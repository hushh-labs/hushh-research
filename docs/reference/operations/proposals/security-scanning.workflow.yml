name: Security Scanning & Compliance

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-security:
    name: Python Security Analysis
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.13']
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: consent-protocol
        run: |
          pip install uv
          uv pip install -e ".[dev]"

      - name: Run Bandit (security linter)
        working-directory: consent-protocol
        run: |
          pip install bandit[toml]
          bandit -r . \
            -ll \
            --exclude ./tests,./venv,./.venv \
            --format json \
            --output bandit-report.json || true
          bandit -r . \
            -ll \
            --exclude ./tests,./venv,./.venv \
            --format txt

      - name: Run pylint security checks
        working-directory: consent-protocol
        run: |
          pip install pylint
          pylint --load-plugins=pylint_security \
            --disable=all \
            --enable=security \
            hushh_mcp services routes \
            || true

      - name: Run Safety (dependency check)
        working-directory: consent-protocol
        run: |
          pip install safety
          safety check --json || true

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: bandit-report-${{ matrix.python-version }}
          path: consent-protocol/bandit-report.json

  javascript-security:
    name: JavaScript/TypeScript Security
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: hushh-webapp/package-lock.json

      - name: Install dependencies
        working-directory: hushh-webapp
        run: npm ci

      - name: Run npm audit (dependencies)
        working-directory: hushh-webapp
        run: |
          npm audit --audit-level=moderate || npm audit --json > npm-audit-report.json
          npm audit --json

      - name: Run ESLint security rules
        working-directory: hushh-webapp
        run: |
          npm run lint -- --format json --output-file eslint-report.json || true
          npm run lint

      - name: Run TypeScript strict mode check
        working-directory: hushh-webapp
        run: npx tsc --noEmit --strict

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: npm-audit-report
          path: hushh-webapp/npm-audit-report.json

      - name: Upload ESLint report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: eslint-report
          path: hushh-webapp/eslint-report.json

  container-security:
    name: Container Image Scanning
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Docker image
        run: |
          docker build -t hussh-backend:scan \
            -f Dockerfile.backend .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: hussh-backend:scan
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy'

  dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'Hussh Research'
          path: '.'
          format: 'JSON'
          args: >
            --enable-retired
            --exclude node_modules,venv,.venv,tests

      - name: Upload Dependency Check results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: dependency-check-report
          path: reports/

  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['python', 'javascript']

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v2

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2
        with:
          category: "/language:${{ matrix.language }}"

  secret-scanning:
    name: Secret Detection
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks (secret detection)
        uses: gitleaks/gitleaks-action@v2

      - name: Run truffleHog (credential scanning)
        uses: trufflesecurity/truffleHog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --json

  sast-analysis:
    name: SAST Analysis (Semgrep)
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/owasp-top-ten
            p/security-audit
            p/python
            p/typescript
            p/react

  report-summary:
    name: Generate Security Report
    runs-on: ubuntu-latest
    needs: [python-security, javascript-security, container-security, dependency-check, codeql-analysis, secret-scanning, sast-analysis]
    if: always()
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all reports
        uses: actions/download-artifact@v3

      - name: Generate summary report
        run: |
          echo "# Security Scan Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Python Security: ${{ needs.python-security.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- JavaScript Security: ${{ needs.javascript-security.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Container Security: ${{ needs.container-security.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Dependency Check: ${{ needs.dependency-check.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- CodeQL: ${{ needs.codeql-analysis.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Secret Scanning: ${{ needs.secret-scanning.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- SAST Analysis: ${{ needs.sast-analysis.result }}" >> $GITHUB_STEP_SUMMARY

      - name: Fail if critical issues found
        if: |
          needs.secret-scanning.result == 'failure' ||
          needs.container-security.result == 'failure'
        run: exit 1
