<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Hussh Private Agent One platform hero banner">
  <defs>
    <linearGradient id="bg-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
    <radialGradient id="glow-light" cx="78%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.14"/>
      <stop offset="65%" stop-color="#0EA5E9" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent-line-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <pattern id="grid-light" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#CBD5E1" stroke-width="0.7" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <rect width="1200" height="280" rx="20" fill="url(#bg-light)"/>
  <rect width="1200" height="280" rx="20" fill="url(#grid-light)"/>
  <rect width="1200" height="280" rx="20" fill="url(#glow-light)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="278.5" rx="19.25" fill="none" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Left brand column -->
  <rect x="52" y="42" width="184" height="28" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1"/>
  <circle cx="68" cy="56" r="4" fill="#2563EB"/>
  <text x="80" y="60.5" fill="#1D4ED8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11.5" font-weight="600" letter-spacing="0.08em">CONSENT-FIRST PLATFORM</text>

  <text x="52" y="122" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="44" font-weight="700" letter-spacing="-0.03em">Private Agent One</text>
  <rect x="52" y="138" width="96" height="3.5" rx="1.75" fill="url(#accent-line-light)"/>

  <text x="52" y="176" fill="#334155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="18" font-weight="400">Your information. Your vault. Your sovereign private agent.</text>
  <text x="52" y="204" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="14" font-weight="400">Web · iOS · Android · Personal Sandbox · Google Cloud &amp; Azure BYOC · Google ADK · A2A · MCP</text>

  <!-- Subtle bottom pillars -->
  <rect x="52" y="226" width="122" height="24" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="64" y="242" fill="#1E293B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11.5" font-weight="500">Zero-Knowledge Vault</text>
  <rect x="184" y="226" width="122" height="24" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="197" y="242" fill="#1E293B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11.5" font-weight="500">Isolated Sandboxes</text>
  <rect x="316" y="226" width="122" height="24" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="331" y="242" fill="#1E293B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11.5" font-weight="500">Explicit Consent</text>

  <!-- Right architectural diagram card -->
  <rect x="748" y="34" width="404" height="212" rx="16" fill="#FFFFFF" fill-opacity="0.92" stroke="#CBD5E1" stroke-width="1.25"/>
  <text x="772" y="60" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="10.5" font-weight="600" letter-spacing="0.1em">SOVEREIGN RUNTIME TOPOLOGY</text>

  <!-- Node 1: Owner Device -->
  <rect x="772" y="76" width="156" height="58" rx="10" fill="#F8FAFC" stroke="#0284C7" stroke-width="1.2"/>
  <text x="786" y="100" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="13" font-weight="600">Owner Device</text>
  <text x="786" y="119" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11">Master Vault Key</text>

  <!-- Node 2: Control Plane -->
  <rect x="972" y="76" width="156" height="58" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="986" y="100" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="13" font-weight="600">Control Plane</text>
  <text x="986" y="119" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11">Identity · Consent</text>

  <!-- Node 3: Private Agent Pod / Sandbox -->
  <rect x="772" y="164" width="356" height="60" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.4"/>
  <text x="788" y="189" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="13.5" font-weight="600">Private Agent Runtime (Sandbox or BYOC)</text>
  <text x="788" y="209" fill="#1D4ED8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11">Direct Admitted TLS · Encrypted Memory &amp; Wiki · Sentinel Egress</text>

  <!-- Connecting paths -->
  <path d="M 928 105 L 972 105" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="3 3"/>
  <path d="M 850 134 L 850 164" stroke="#0284C7" stroke-width="1.8"/>
  <polygon points="845,157 855,157 850,165" fill="#0284C7"/>
  <path d="M 1050 134 L 1050 164" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="3 3"/>
  <polygon points="1046,158 1054,158 1050,164" fill="#94A3B8"/>
</svg>
