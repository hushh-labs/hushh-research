  <text x="48" y="102" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="36" font-weight="700" letter-spacing="-0.025em">Built for Humans First. Exact for Coding Agents.</text>
