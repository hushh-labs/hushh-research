<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" role="img" aria-label="Hussh One Documentation Hub hero banner">
  <defs>
    <linearGradient id="hub-bg-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
    <pattern id="hub-grid-light" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#CBD5E1" stroke-width="0.7" stroke-opacity="0.4"/>
    </pattern>
  </defs>
  <rect width="1200" height="220" rx="18" fill="url(#hub-bg-light)"/>
