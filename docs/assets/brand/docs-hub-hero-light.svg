  <text x="48" y="102" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="36" font-weight="700" letter-spacing="-0.025em">Built for Humans First. Exact for Coding Agents.</text>
  <text x="48" y="136" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="15.5">Five canonical pillars with living trust-boundary diagrams, Diataxis reader intent, and one-hop machine discovery.</text>

