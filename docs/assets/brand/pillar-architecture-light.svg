  <text x="66" y="122" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="15">Twelve modular subsystems separating device custody, coordination, private runtimes, and connectors.</text>
