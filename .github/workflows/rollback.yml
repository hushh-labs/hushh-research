name: "Rollback Deployment"

# Standalone, manually-dispatchable rollback: repoints UAT/production Cloud
# Run traffic to a known-good revision without going through a git revert
# PR first. Before this workflow existed, rollback only happened as an
# automatic side effect inside deploy-uat.yml / deploy-production.yml, and
# only when the post-deploy health classifier failed — a revert to code that
# was itself previously shipped and working passes those health checks
# cleanly, so it would never trigger. This closes that gap.
#
# This IS the governed mechanism the "no ad hoc gcloud run deploy /
# update-traffic" rule in admin-release-sop.md refers to — see the doc
# update landed alongside this file. It is not the ad hoc command that rule
# prohibits: it is actor-gated by the same allowlist that already gates
# deploy dispatch, authenticates the same way (Workload Identity
# Federation), and calls the shared scripts/ci/cloudrun-rollback.sh used by the automatic
# path, with protected-document reader compatibility checked before traffic moves.
#
# Two separate jobs, not one dynamic `environment:`, deliberately. Each job
# binds its exact deployment environment so the corresponding environment-
# scoped workload identity variables resolve without widening their scope.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Which environment to roll back"
        required: true
        type: choice
        options:
          - uat
          - production
      scope:
        description: "Which service(s) to roll back"
        required: true
        type: choice
        default: all
        options:
          - backend
          - frontend
          - all
          - drive-worker
      backend_revision:
        description: "Backend revision to restore (blank = last known-good tag)"
        required: false
        type: string
      frontend_revision:
        description: "Frontend revision to restore (blank = last known-good tag)"
        required: false
        type: string
      drive_worker_revision:
        description: "Exact accepted UAT Drive worker revision for drive-worker scope"
        required: false
        type: string
      reason:
        description: "Why this rollback is needed (audit trail)"
        required: true
        type: string

permissions:
  pull-requests: read
  actions: read
  contents: read
  id-token: write

jobs:
  deployment-security:
    name: Deployment security
    uses: ./.github/workflows/deployment-security.yml
    secrets:
      GH_SECURITY_ALERTS_TOKEN: ${{ secrets.GH_SECURITY_ALERTS_TOKEN }}
    with:
      application_ref: ${{ github.sha }}
      environment_name: ${{ inputs.environment }}
      scope: ${{ 'all' }}

  rollback-uat:
    permissions:
      pull-requests: read
      actions: write
      contents: read
      id-token: write
    needs: deployment-security
    name: "Rollback — UAT"
    if: github.event.inputs.environment == 'uat'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: uat
    concurrency:
      group: deploy-uat
      cancel-in-progress: false
      queue: max
    env:
      GCP_PROJECT_ID: hushh-pda-uat
      GCP_REGION: us-central1
      HUSHH_DOCUMENT_MANUAL_ROLLBACK_GUARD: "true"
      BACKEND_SERVICE: consent-protocol
      FRONTEND_SERVICE: hushh-webapp
    steps:
      - name: Require current-attempt deployment security
        shell: bash
        env:
          SECURITY_ATTEMPT: ${{ needs.deployment-security.outputs.attempt }}
        run: |
          set -euo pipefail
          if [[ "$SECURITY_ATTEMPT" != "$GITHUB_RUN_ATTEMPT" ]]; then
            echo "Deployment requires current-attempt security. Rerun the entire workflow; partial reruns cannot reuse clearance." >&2
            exit 1
          fi
      - name: Assert manual dispatch originates from main
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "Refusing UAT rollback from '${GITHUB_REF_NAME}'. Trigger this workflow from 'main' only."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.sha }}

      - name: Assert manual UAT dispatch actor policy
        shell: bash
        env:
          RELEASE_AUTHORIZATION: ${{ needs.deployment-security.outputs.authorization }}
          RELEASE_APPLICATION_SHA: ${{ needs.deployment-security.outputs.application_sha }}
        run: |
          set -euo pipefail
          python3 scripts/ci/assert-governed-actor.py --surface uat --actor "${GITHUB_ACTOR}"

      - name: Fetch last-known-good deploy tags
        run: git fetch origin 'refs/tags/deployed/*:refs/tags/deployed/*' 2>&1 || true

      - name: Validate Google Cloud workload identity configuration
        shell: bash
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test -n "$WIF_PROVIDER" || { echo "Missing environment variable GCP_WORKLOAD_IDENTITY_PROVIDER" >&2; exit 1; }
          test -n "$DEPLOY_SERVICE_ACCOUNT" || { echo "Missing environment variable GCP_DEPLOY_SERVICE_ACCOUNT" >&2; exit 1; }

      - name: Authenticate to Google Cloud
        id: gcp-auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          project_id: ${{ env.GCP_PROJECT_ID }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Set GCP project context
        run: gcloud config set project "${{ env.GCP_PROJECT_ID }}"

      - name: Prepare protected document rollback checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/document-rollback"
          "${RUNNER_TEMP}/document-rollback/bin/pip" install --disable-pip-version-check psycopg2-binary==2.9.11
          echo "PROTOCOL_PYTHON=${RUNNER_TEMP}/document-rollback/bin/python" >> "$GITHUB_ENV"
          curl -fsSL https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.18.3/cloud-sql-proxy.linux.amd64 \
            -o "${RUNNER_TEMP}/cloud-sql-proxy"
          chmod +x "${RUNNER_TEMP}/cloud-sql-proxy"
          echo "${RUNNER_TEMP}" >> "$GITHUB_PATH"

      - name: Roll back backend
        id: rollback-backend
        if: github.event.inputs.scope == 'backend' || github.event.inputs.scope == 'all'
        shell: bash
        env:
          ROLLBACK_VERIFY_SERVICE: ${{ env.BACKEND_SERVICE }}
          ROLLBACK_VERIFY_REGION: ${{ env.GCP_REGION }}
          ROLLBACK_VERIFY_PROJECT: ${{ env.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          REVISION="$(bash scripts/ci/resolve-rollback-target.sh uat backend "${{ github.event.inputs.backend_revision }}")"
          echo "revision=${REVISION}" >> "$GITHUB_OUTPUT"
          bash scripts/ci/cloudrun-rollback.sh "${{ env.BACKEND_SERVICE }}" "${{ env.GCP_REGION }}" "${REVISION}"

      - name: Restore the accepted UAT Drive worker
        id: rollback-drive-worker
        if: inputs.scope == 'drive-worker'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKER_REVISION: ${{ inputs.drive_worker_revision }}
        run: |
          set -euo pipefail
          [[ "$WORKER_REVISION" =~ ^consent-protocol-drive-worker-[0-9]+-[a-z0-9]+$ ]]
          worker=consent-protocol-drive-worker
          runtime_account=consent-protocol-runtime@hushh-pda-uat.iam.gserviceaccount.com
          run_location=(--project="$GCP_PROJECT_ID" --region="$GCP_REGION")
          serving_revision() {
            gcloud run services describe "$1" "${run_location[@]}" --format=json \
              | python3 scripts/ci/resolve-cloud-run-serving-state.py --service-json /dev/stdin \
              | jq -er '.revision'
          }
          umask 077
          baseline="$(serving_revision "$BACKEND_SERVICE")"
          frontend_baseline="$(serving_revision "$FRONTEND_SERVICE")"
          sha="$(gcloud run revisions describe "$baseline" "${run_location[@]}" \
            --format='value(metadata.labels.deploy-sha)')"
          python3 scripts/ci/verify-predecessor-acceptance.py require \
            --environment uat --sha "$sha" --scope backend --output "$RUNNER_TEMP/worker-baseline.json"
          run="$(jq -er '.services.backend.run_id' "$RUNNER_TEMP/worker-baseline.json")"
          image="$(jq -er '.services.backend.image_reference' "$RUNNER_TEMP/worker-baseline.json")"
          provider="$(python3 scripts/ci/managed_provider_readiness.py worker-provider \
            --sha "$sha" --image "$image" --run-id "$run" --account "$runtime_account")"
          worker_snapshot="$RUNNER_TEMP/worker-rollback-revision.json"
          gcloud run revisions describe "$WORKER_REVISION" "${run_location[@]}" --format=json > "$worker_snapshot"
          jq -e --arg worker "$worker" --arg run "$run" \
                --arg provider "$provider" --arg account "$runtime_account" '
                .metadata.labels["serving.knative.dev/service"] == $worker
                and .metadata.labels["github-run-id"] == $run
                and .spec.serviceAccountName == $account
                and any(.spec.containers[]; .name == "drive-worker"
                  and any(.env[]; .name == "HUSHH_UAT_MANAGED_AI_PROVIDER" and .value == $provider))
              ' "$worker_snapshot" >/dev/null
          # Reuse the same reviewed scanner pins and revision validator as deployment.
          scanner_index="$(sed -nE 's/^readonly CLAMAV_IMAGE="[^"]+@(sha256:[a-f0-9]{64})"$/\1/p' \
            deploy/drive/deploy_worker_service.sh)"
          scanner_amd64="$(sed -nE 's/^readonly CLAMAV_AMD64_DIGEST="(sha256:[a-f0-9]{64})"$/\1/p' \
            deploy/drive/deploy_worker_service.sh)"
          [[ "$scanner_index" =~ ^sha256:[a-f0-9]{64}$ && "$scanner_amd64" =~ ^sha256:[a-f0-9]{64}$ ]]
          EXPECTED_SHA="$sha" EXPECTED_APP_IMAGE="$image" EXPECTED_DRAIN_ENABLED=true \
            EXPECTED_SCANNER_INDEX_DIGEST="$scanner_index" EXPECTED_SCANNER_AMD64_DIGEST="$scanner_amd64" \
            EXPECTED_MANAGED_TEXT_PROVIDER="$provider" EXPECTED_MAX_INSTANCES=2 EXPECTED_CONCURRENCY=1 \
            python3 deploy/drive/verify_worker_revision.py < "$worker_snapshot"
          origin="$(gcloud run services describe "$worker" "${run_location[@]}" --format='value(status.url)')"
          python3 deploy/drive/work_drain_scheduler_snapshot.py verify-configuration --worker-origin "$origin"
          [[ "$(serving_revision "$BACKEND_SERVICE")" == "$baseline" ]]
          if [[ "$(serving_revision "$worker")" != "$WORKER_REVISION" ]]; then
            bash scripts/ci/cloudrun-rollback.sh "$worker" "$GCP_REGION" "$WORKER_REVISION"
          fi
          [[ "$(serving_revision "$worker")" == "$WORKER_REVISION" ]]
          [[ "$(serving_revision "$BACKEND_SERVICE")" == "$baseline" ]]
          [[ "$(serving_revision "$FRONTEND_SERVICE")" == "$frontend_baseline" ]]
          python3 deploy/drive/work_drain_scheduler_snapshot.py verify-configuration --worker-origin "$origin"
          echo "revision=$WORKER_REVISION" >> "$GITHUB_OUTPUT"
          echo "Accepted UAT Drive worker $WORKER_REVISION serves all worker traffic."

      - name: Post-rollback backend health check
        if: github.event.inputs.scope == 'backend' || github.event.inputs.scope == 'all'
        shell: bash
        run: |
          set -euo pipefail
          URL="$(gcloud run services describe "${{ env.BACKEND_SERVICE }}" --project="${{ env.GCP_PROJECT_ID }}" --region="${{ env.GCP_REGION }}" --format='value(status.url)')"
          bash scripts/ci/cloudrun-http-health.sh "$URL" "/health" 5 30 5 200

      - name: Roll back frontend
        id: rollback-frontend
        if: github.event.inputs.scope == 'frontend' || github.event.inputs.scope == 'all'
        shell: bash
        env:
          ROLLBACK_VERIFY_SERVICE: ${{ env.FRONTEND_SERVICE }}
          ROLLBACK_VERIFY_REGION: ${{ env.GCP_REGION }}
          ROLLBACK_VERIFY_PROJECT: ${{ env.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          REVISION="$(bash scripts/ci/resolve-rollback-target.sh uat frontend "${{ github.event.inputs.frontend_revision }}")"
          echo "revision=${REVISION}" >> "$GITHUB_OUTPUT"
          bash scripts/ci/cloudrun-rollback.sh "${{ env.FRONTEND_SERVICE }}" "${{ env.GCP_REGION }}" "${REVISION}"

      - name: Post-rollback frontend health check
        if: github.event.inputs.scope == 'frontend' || github.event.inputs.scope == 'all'
        shell: bash
        run: |
          set -euo pipefail
          URL="$(gcloud run services describe "${{ env.FRONTEND_SERVICE }}" --project="${{ env.GCP_PROJECT_ID }}" --region="${{ env.GCP_REGION }}" --format='value(status.url)')"
          bash scripts/ci/cloudrun-http-health.sh "$URL" "/" 3 30 5 200

      - name: Rollback summary
        if: always()
        shell: bash
        run: |
          {
            echo "## UAT Rollback"
            echo ""
            echo "- Actor: \`${GITHUB_ACTOR}\`"
            echo "- Reason: ${{ github.event.inputs.reason }}"
            echo "- Scope: \`${{ github.event.inputs.scope }}\`"
            echo "- Backend target revision: \`${{ steps.rollback-backend.outputs.revision || 'n/a (not in scope)' }}\`"
            echo "- Frontend target revision: \`${{ steps.rollback-frontend.outputs.revision || 'n/a (not in scope)' }}\`"
            echo "- Drive worker target revision: \`${{ steps.rollback-drive-worker.outputs.revision || 'n/a (not in scope)' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  rollback-production:
    needs: deployment-security
    name: "Rollback — Production"
    permissions:
      contents: read
      actions: write
      id-token: write
    if: github.event.inputs.environment == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
      queue: max
    env:
      GCP_PROJECT_ID: hushh-pda
      GCP_REGION: us-central1
      HUSHH_DOCUMENT_MANUAL_ROLLBACK_GUARD: "true"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BACKEND_SERVICE: consent-protocol
      FRONTEND_SERVICE: hushh-webapp
    steps:
      - name: Require current-attempt deployment security
        shell: bash
        env:
          SECURITY_ATTEMPT: ${{ needs.deployment-security.outputs.attempt }}
        run: |
          set -euo pipefail
          if [[ "$SECURITY_ATTEMPT" != "$GITHUB_RUN_ATTEMPT" ]]; then
            echo "Deployment requires current-attempt security. Rerun the entire workflow; partial reruns cannot reuse clearance." >&2
            exit 1
          fi
      - name: Refuse worker-only scope outside UAT
        if: inputs.scope == 'drive-worker'
        run: exit 1

      - name: Assert manual dispatch originates from main
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "Refusing production rollback from '${GITHUB_REF_NAME}'. Trigger this workflow from 'main' only."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.sha }}

      - name: Assert production dispatch actor policy
        shell: bash
        env:
          RELEASE_AUTHORIZATION: ${{ needs.deployment-security.outputs.authorization }}
          RELEASE_APPLICATION_SHA: ${{ needs.deployment-security.outputs.application_sha }}
        run: |
          set -euo pipefail
          python3 scripts/ci/assert-governed-actor.py --surface production --actor "${GITHUB_ACTOR}"

      - name: Fetch last-known-good deploy tags
        run: git fetch origin 'refs/tags/deployed/*:refs/tags/deployed/*' 2>&1 || true

      - name: Validate Google Cloud workload identity configuration
        shell: bash
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test -n "$WIF_PROVIDER" || { echo "Missing environment variable GCP_WORKLOAD_IDENTITY_PROVIDER" >&2; exit 1; }
          test -n "$DEPLOY_SERVICE_ACCOUNT" || { echo "Missing environment variable GCP_DEPLOY_SERVICE_ACCOUNT" >&2; exit 1; }

      - name: Authenticate to Google Cloud
        id: gcp-auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          project_id: ${{ env.GCP_PROJECT_ID }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Set GCP project context
        run: gcloud config set project "${{ env.GCP_PROJECT_ID }}"

      - name: Prepare protected document rollback checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/document-rollback"
          "${RUNNER_TEMP}/document-rollback/bin/pip" install --disable-pip-version-check psycopg2-binary==2.9.11
          echo "PROTOCOL_PYTHON=${RUNNER_TEMP}/document-rollback/bin/python" >> "$GITHUB_ENV"
          curl -fsSL https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.18.3/cloud-sql-proxy.linux.amd64 \
            -o "${RUNNER_TEMP}/cloud-sql-proxy"
          chmod +x "${RUNNER_TEMP}/cloud-sql-proxy"
          echo "${RUNNER_TEMP}" >> "$GITHUB_PATH"

      - name: Roll back backend
        id: rollback-backend
        if: github.event.inputs.scope == 'backend' || github.event.inputs.scope == 'all'
        shell: bash
        env:
          ROLLBACK_VERIFY_SERVICE: ${{ env.BACKEND_SERVICE }}
          ROLLBACK_VERIFY_REGION: ${{ env.GCP_REGION }}
          ROLLBACK_VERIFY_PROJECT: ${{ env.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          REVISION="$(bash scripts/ci/resolve-rollback-target.sh production backend "${{ github.event.inputs.backend_revision }}")"
          echo "revision=${REVISION}" >> "$GITHUB_OUTPUT"
          bash scripts/ci/cloudrun-rollback.sh "${{ env.BACKEND_SERVICE }}" "${{ env.GCP_REGION }}" "${REVISION}"

      - name: Post-rollback backend health check
        if: github.event.inputs.scope == 'backend' || github.event.inputs.scope == 'all'
        shell: bash
        run: |
          set -euo pipefail
          URL="$(gcloud run services describe "${{ env.BACKEND_SERVICE }}" --project="${{ env.GCP_PROJECT_ID }}" --region="${{ env.GCP_REGION }}" --format='value(status.url)')"
          bash scripts/ci/cloudrun-http-health.sh "$URL" "/health" 5 30 5 200

      - name: Roll back frontend
        id: rollback-frontend
        if: github.event.inputs.scope == 'frontend' || github.event.inputs.scope == 'all'
        shell: bash
        env:
          ROLLBACK_VERIFY_SERVICE: ${{ env.FRONTEND_SERVICE }}
          ROLLBACK_VERIFY_REGION: ${{ env.GCP_REGION }}
          ROLLBACK_VERIFY_PROJECT: ${{ env.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          REVISION="$(bash scripts/ci/resolve-rollback-target.sh production frontend "${{ github.event.inputs.frontend_revision }}")"
          echo "revision=${REVISION}" >> "$GITHUB_OUTPUT"
          bash scripts/ci/cloudrun-rollback.sh "${{ env.FRONTEND_SERVICE }}" "${{ env.GCP_REGION }}" "${REVISION}"

      - name: Post-rollback frontend health check
        if: github.event.inputs.scope == 'frontend' || github.event.inputs.scope == 'all'
        shell: bash
        run: |
          set -euo pipefail
          URL="$(gcloud run services describe "${{ env.FRONTEND_SERVICE }}" --project="${{ env.GCP_PROJECT_ID }}" --region="${{ env.GCP_REGION }}" --format='value(status.url)')"
          bash scripts/ci/cloudrun-http-health.sh "$URL" "/" 3 30 5 200

      - name: Rollback summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Production Rollback"
            echo ""
            echo "- Actor: \`${GITHUB_ACTOR}\`"
            echo "- Reason: ${{ github.event.inputs.reason }}"
            echo "- Scope: \`${{ github.event.inputs.scope }}\`"
            echo "- Backend target revision: \`${{ steps.rollback-backend.outputs.revision || 'n/a (not in scope)' }}\`"
            echo "- Frontend target revision: \`${{ steps.rollback-frontend.outputs.revision || 'n/a (not in scope)' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
