name: Deploy to Production
run-name: ${{ inputs.cadence_origin && format('Cadence {0} deploy · {1}', inputs.cadence_ordinal, inputs.cadence_origin) || 'Deploy to Production' }}

on:
  workflow_dispatch:
    inputs:
      cadence_origin:
        description: Internal exact-run release cadence authority (leave blank for manual deploys)
        type: string
        default: ""
      cadence_ordinal:
        description: Internal successful UAT deployment ordinal
        type: string
        default: ""
      sha:
        description: "Exact green main SHA to deploy"
        required: true
        type: string
      scope:
        description: "Auto-detect changed services, or force backend/frontend/all"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - all
          - backend
          - frontend
      run_predeploy_backup_job:
        description: "Optionally take an on-demand Cloud SQL backup before the deploy gate"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      enable_one_email_kyc:
        description: "Enable production One Email KYC only after mailbox-watch ownership and encrypted-draft gates are complete"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      drive_live_mode:
        description: "Preserve current Drive state; explicitly enable after provider verification or disable with rollback"
        required: true
        default: preserve
        type: choice
        options:
          - preserve
          - enable
          - disable
      backend_image_source:
        description: "Backend image: build-from-source (rebuild at this SHA, today's path) or promote-from-uat (copy the exact digest UAT verified for this SHA; needs the IAM in deploy/iam/README.md)"
        required: true
        default: "build-from-source"
        type: choice
        options:
          - build-from-source
          - promote-from-uat
      phone_rollback_sha:
        description: "Previously UAT-accepted phone425 source for first production rollback baseline; blank once a qualified production baseline exists"
        required: false
        default: ""
        type: string
      phone_phase:
        description: "standard release or qualification-only cold checkpoint; cold never deploys primary"
        type: choice
        default: standard
        options: [standard, cold, worker, activate]
      phone_worker_stage_run_id:
        description: Exact qualified worker staging run; required during operational backend transition
        type: string
        default: ""
      phone_activation_run_id:
        description: Original pending production run for same-source activation without redeployment
        type: string
        default: ""
      phone_schema_origin_run_id:
        description: "Original immutable cold pre-DDL intent run; paired attempt required"
        type: string
        default: ""
      phone_schema_origin_attempt:
        description: "Original pre-DDL intent attempt for same-source continuation"
        type: string
        default: ""
      nearby_check_in_cohort:
        description: "Nearby check-in audience. Leave this as 'all' for a normal deploy. Clearing it turns nearby check-in OFF in production, which is the kill switch; a comma-separated list of user ids restricts it to those accounts."
        required: false
        default: "all"
        type: string

permissions:
  # write: this workflow tags a healthy release as "last known good"
  # (scripts/ci/tag-last-known-good.sh) so a future revert check and a
  # future rollback both have a durable anchor. Scoped to pushing tags only
  # — the workflow never touches a branch.
  contents: write
  checks: read
  actions: read
  id-token: write

env:
  PHONE_DEPLOY_PHASE: ${{ inputs.phone_phase || 'standard' }}
  GCP_PROJECT_ID: hushh-pda
  GCP_REGION: us-central1
  BACKEND_SERVICE: consent-protocol
  RUNTIME_SERVICE_ACCOUNT: consent-protocol-runtime@hushh-pda.iam.gserviceaccount.com
  FRONTEND_SERVICE: hushh-webapp
  APP_FRONTEND_ORIGIN: https://one.hussh.ai
  CONSENT_API_PUBLIC_ORIGIN: https://api.hushh.ai
  BACKEND_REVISION_RETENTION: "2"
  FRONTEND_REVISION_RETENTION: "10"
  PROD_CLOUDSQL_INSTANCE_NAME: hushh-vault-db
  PROD_CLOUDSQL_INSTANCE: hushh-pda:us-central1:hushh-vault-db
  PROD_DB_UNIX_SOCKET: /cloudsql/hushh-pda:us-central1:hushh-vault-db
  PROD_DB_NAME: hushh_vault
  ACCOUNT_DELETION_SCHEDULER_SERVICE_ACCOUNT_ID: account-deletion-cleanup
  ACCOUNT_DELETION_SCHEDULER_JOB: account-deletion-cleanup-production
  GMAIL_PERSONAL_INFORMATION_REQUEST_MONITOR_SCHEDULER_SERVICE_ACCOUNT_ID: gmail-personal-monitor-sched
  BACKUP_MAX_AGE_HOURS: "30"
  # Read-only source for backend_image_source=promote-from-uat. Production never
  # deploys from this registry; it copies the verified digest into its own.
  UAT_GCP_PROJECT_ID: hushh-pda-uat
  UAT_BACKEND_IMAGE_REPOSITORY: gcr.io/hushh-pda-uat/consent-protocol
  PROTOCOL_PYTHON: ${{ github.workspace }}/consent-protocol/.venv/bin/python
  # run_attempt changes on a workflow rerun; a rerun must never rewrite the
  # :latest config of a candidate revision already serving from this run ID.
  DRIVE_CANDIDATE_RUNTIME_SECRET: BACKEND_RUNTIME_CONFIG_JSON_DRIVE_${{ github.run_id }}_${{ github.run_attempt }}

# One global group: the account deletion fence, migration, and activation
# must never interleave between two production dispatches, even for different
# SHAs. Queued runs wait; an in-flight release is never cancelled mid-fence.
concurrency:
  group: deploy-production
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: ${{ inputs.phone_phase == 'activate' && 'Ordinary production deploy (not selected)' || 'Deploy Production Scope' }}
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' && inputs.phone_phase != 'worker' && inputs.phone_phase != 'activate'
    environment: production

    steps:
      - name: Assert manual dispatch originates from main
        shell: bash
        env:
          PHONE_FALLBACK: ${{ inputs.phone_rollback_sha }}
          PHONE_PRIMARY: ${{ inputs.sha }}
          PHONE_SCOPE: ${{ inputs.scope }}
          PHONE_DRIVE_MODE: ${{ inputs.drive_live_mode }}
          SCHEMA_ORIGIN_RUN: ${{ inputs.phone_schema_origin_run_id }}
          SCHEMA_ORIGIN_ATTEMPT: ${{ inputs.phone_schema_origin_attempt }}
        run: |
          set -euo pipefail
          case "$PHONE_DEPLOY_PHASE" in standard|cold) ;; *) exit 1 ;; esac
          origin_run="$SCHEMA_ORIGIN_RUN"
          origin_attempt="$SCHEMA_ORIGIN_ATTEMPT"
          if [[ -n "${origin_run}${origin_attempt}" ]]; then
            [[ "$PHONE_DEPLOY_PHASE" == cold && "$origin_run" =~ ^[1-9][0-9]*$ && "$origin_attempt" =~ ^[1-9][0-9]*$ ]] || exit 1
          fi
          if [[ "$PHONE_DEPLOY_PHASE" == cold ]]; then
            [[ "$PHONE_SCOPE" == backend && "$PHONE_DRIVE_MODE" == preserve && "$PHONE_FALLBACK" =~ ^[0-9a-f]{40}$ && "$PHONE_FALLBACK" != "$PHONE_PRIMARY" ]] || {
              echo "Cold qualification requires backend scope, preserved Drive and an independent fallback." >&2; exit 1;
            }
          fi
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "Refusing production deploy from '${GITHUB_REF_NAME}'. Trigger this workflow from 'main' only."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Require reconciled maintenance mutations under deployment lock
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/ci/uat-retention-maintenance.py --environment production \
            --check-mutations --state-dir "$RUNNER_TEMP/production-maintenance-guard"

      - name: Assert production dispatch actor policy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/ci/assert-governed-actor.py --surface production --actor "${GITHUB_ACTOR}"

      - name: Validate deployment SHA against main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUIRED_BRANCH: main
          REQUIRE_CI_SUCCESS: "1"
          REQUIRED_CHECK_NAME: "Main Post-Merge Smoke Gate"
        run: bash scripts/ci/require-deploy-sha-on-main.sh "${{ github.event.inputs.sha }}"

      - name: Require original source during operational backend transition
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ inputs.sha }}
          TARGET_SCOPE: ${{ inputs.scope }}
        run: |
          set -euo pipefail
          python3 scripts/ci/production_backend_successor_control.py admit \
            --sha "$TARGET_SHA" --scope "$TARGET_SCOPE"

      - name: Preserve current release tooling
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/release-tools"
          cp scripts/ci/cloudrun-rollback.sh "${RUNNER_TEMP}/release-tools/"
          git log -1 --diff-filter=A --format=%H -- \
            consent-protocol/api/routes/document_delivery.py \
            > "${RUNNER_TEMP}/release-tools/protected-document-reader-commit"
          cp scripts/ci/verify-predecessor-acceptance.py "${RUNNER_TEMP}/release-tools/"
          cp scripts/ci/release_acceptance_provenance.py "${RUNNER_TEMP}/release-tools/"
          cp scripts/ci/resolve-deploy-scope.py "${RUNNER_TEMP}/release-tools/"
          cp scripts/ci/resolve-cloud-run-deploy-revision.py \
            "${RUNNER_TEMP}/release-tools/resolve-cloud-run-deploy-revision.py"
          # The deployment SHA may predate this verifier; always use main's.
          cp scripts/ci/resolve-uat-verified-image.py \
            "${RUNNER_TEMP}/release-tools/resolve-uat-verified-image.py"
          # Release gates come from current main even when the exact UAT image
          # is older than this workflow's production voice enablement.
          cp deploy/backend.cloudbuild.yaml \
            "${RUNNER_TEMP}/release-tools/backend.cloudbuild.yaml"
          # The current YAML invokes extracted helpers even for an older image.
          mkdir -p "${RUNNER_TEMP}/release-tools/backend-deploy"
          for tool in backend-deploy.sh backend-phone-rollback.sh backend-capacity-settings.sh backend-model-settings.sh backend-drive-secret-settings.sh commerce-preview-bindings.sh \
            verify-managed-vertex-runtime.sh scope-commerce-secrets.sh pod-release-env.sh preserve-pod-release.py; do
            cp "scripts/deploy/${tool}" "${RUNNER_TEMP}/release-tools/backend-deploy/${tool}"
          done
          mkdir -p "${RUNNER_TEMP}/release-tools/phone" "${RUNNER_TEMP}/release-tools/sso"
          cp deploy/phone/*.py "${RUNNER_TEMP}/release-tools/phone/"
          cp deploy/sso/bind_workos.sh "${RUNNER_TEMP}/release-tools/sso/"
          cp scripts/ci/verify-cloudrun-revision-provenance.py "${RUNNER_TEMP}/release-tools/"
          # Source upload admission belongs to the same current tooling bundle.
          cp .gcloudignore "${RUNNER_TEMP}/release-tools/.gcloudignore"
          # Preserve the companion sourced by current Cloud Build tooling when
          # the approved application SHA predates email-auth deployment support.
          mkdir -p "${RUNNER_TEMP}/release-tools/email-auth"
          cp deploy/email-auth/bind_secrets.sh \
            "${RUNNER_TEMP}/release-tools/email-auth/bind_secrets.sh"
          mkdir -p "${RUNNER_TEMP}/release-tools/plg"
          cp deploy/plg/bind_secrets.sh \
            "${RUNNER_TEMP}/release-tools/plg/bind_secrets.sh"
          cp scripts/ci/assert_one_voice_live_probe.py \
            "${RUNNER_TEMP}/release-tools/assert_one_voice_live_probe.py"
          # Current Cloud Build records and evaluates provider readiness through
          # this companion, even when the approved application predates it.
          cp scripts/ci/managed_provider_readiness.py \
            "${RUNNER_TEMP}/release-tools/managed_provider_readiness.py"
          cp scripts/ci/managed_capability_proof.py \
            "${RUNNER_TEMP}/release-tools/managed_capability_proof.py"
          # Orchestration must remain current when rolling back to an older image.
          mkdir -p "${RUNNER_TEMP}/release-tools/drive"
          for tool in resolve_prod_release_mode.py resolve_protected_document_release.py rebind_protected_document_backend.py verify_prod_prerequisites.py verify_hashcoin_config.sh setup_native_callback_log_exclusion.sh \
            deploy_worker_service_prod.sh sync_runtime_config_prod.sh staged_worker.py verify_worker_revision.py setup_work_drain_scheduler_prod.sh \
            work_drain_scheduler_snapshot_prod.py restore_prod_after_release_failure.sh; do
            cp "deploy/drive/${tool}" "${RUNNER_TEMP}/release-tools/drive/${tool}"
          done
          cp hushh-webapp/lib/vault/passkey-domain-aliases.json \
            "${RUNNER_TEMP}/release-tools/drive-domain-aliases.json"
          cp scripts/ops/sync_backend_runtime_secrets.py \
            "${RUNNER_TEMP}/release-tools/sync_backend_runtime_secrets.py"
          for tool in runtime_config_retention.py production_drive_candidate_config.py scope_commerce_runtime_policy.py shared_files_runtime_policy.py passkey_domain_policy.py upsert_gcp_secret.py; do
            cp "scripts/ops/$tool" "${RUNNER_TEMP}/release-tools/$tool"
          done
          cp scripts/ops/verify-env-secrets-parity.py \
            "${RUNNER_TEMP}/release-tools/verify-env-secrets-parity.py"
          for tool in cloudrun-retention.py process_group.py uat-retention-maintenance.py retention_publication.py \
            production_phone_receipt.py production_phone_lease.py production_phone_lease_receipts.py production_backend_successor.py production_backend_successor_proof.py production_backend_successor_control.py production_pending_activation.py production_activation_continuation.py production_staged_worker.py production_worker_basis.py production_backend_inheritance.py production_retention_context.py retention_admission.py tag-last-known-good.sh resolve-rollback-target.sh production-capacity-bridge.py production_capacity_bridge_contract.py \
            release_artifact_receipts.py release_cadence.py release_cadence_github.py \
            release_cadence_native.py release_cadence_maintenance.py; do
            cp "scripts/ci/$tool" "${RUNNER_TEMP}/release-tools/$tool"
          done
          # Capacity policy and phase support belong to current release tooling,
          # including when promoting or rolling back an older approved app image.
          cp scripts/ci/runtime-capacity-budget.py \
            "${RUNNER_TEMP}/release-tools/runtime-capacity-budget.py"
          cp scripts/ci/runtime_capacity_inventory.py \
            "${RUNNER_TEMP}/release-tools/runtime_capacity_inventory.py"
          cp scripts/ci/runtime_capacity_cli.py "${RUNNER_TEMP}/release-tools/"
          cp scripts/ci/verify-cloud-scheduler-attempt.py "${RUNNER_TEMP}/release-tools/"
          cp scripts/ci/cloudrun-rollback.sh "${RUNNER_TEMP}/release-tools/"
          cp deploy/drive/rollback_after_worker_failure.sh "${RUNNER_TEMP}/release-tools/"
          cp scripts/ci/account-deletion-fence-decision.py \
            "${RUNNER_TEMP}/release-tools/account-deletion-fence-decision.py"
          mkdir -p "${RUNNER_TEMP}/release-tools/account-deletion"
          cp deploy/account-deletion/{install,remove}_release_fence.sql \
            deploy/account-deletion/activate_release.py deploy/account-deletion/activation_retirement.py deploy/account-deletion/release_target.py deploy/account-deletion/setup_cleanup_scheduler.sh \
            deploy/account-deletion/verify_release_boundary.sql \
            "${RUNNER_TEMP}/release-tools/account-deletion/"
          cp config/runtime-capacity.json \
            "${RUNNER_TEMP}/release-tools/runtime-capacity.json"
          for policy in ci-governance.json release-cadence.json; do
            cp "config/${policy}" "${RUNNER_TEMP}/release-tools/${policy}"
          done
          git log -1 --diff-filter=A --format=%H -- \
            consent-protocol/hushh_mcp/services/drive_prod_registry_provisioning.py \
            > "${RUNNER_TEMP}/release-tools/prod-drive-feature-commit"
          cp scripts/ci/verify-prod-places-readiness.py \
            "${RUNNER_TEMP}/release-tools/verify-prod-places-readiness.py"

      - name: Checkout deployment SHA
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "${{ github.event.inputs.sha }}"
          cp "${RUNNER_TEMP}/release-tools/backend.cloudbuild.yaml" \
            deploy/backend.cloudbuild.yaml
          mkdir -p deploy/phone deploy/sso
          cp "${RUNNER_TEMP}/release-tools/phone/"*.py deploy/phone/
          cp "${RUNNER_TEMP}/release-tools/sso/"* deploy/sso/
          for tool in verify-predecessor-acceptance.py release_acceptance_provenance.py; do
            cp "${RUNNER_TEMP}/release-tools/$tool" "scripts/ci/$tool"
          done
          cp "${RUNNER_TEMP}/release-tools/verify-cloudrun-revision-provenance.py" scripts/ci/
          mkdir -p scripts/deploy
          cp "${RUNNER_TEMP}/release-tools/backend-deploy/"* scripts/deploy/
          cp "${RUNNER_TEMP}/release-tools/.gcloudignore" .gcloudignore
          mkdir -p deploy/email-auth
          cp "${RUNNER_TEMP}/release-tools/email-auth/bind_secrets.sh" \
            deploy/email-auth/bind_secrets.sh
          mkdir -p deploy/plg
          cp "${RUNNER_TEMP}/release-tools/plg/bind_secrets.sh" \
            deploy/plg/bind_secrets.sh
          cp "${RUNNER_TEMP}/release-tools/assert_one_voice_live_probe.py" \
            scripts/ci/assert_one_voice_live_probe.py
          cp "${RUNNER_TEMP}/release-tools/managed_provider_readiness.py" \
            scripts/ci/managed_provider_readiness.py
          cp "${RUNNER_TEMP}/release-tools/managed_capability_proof.py" \
            scripts/ci/managed_capability_proof.py
          mkdir -p deploy/drive
          cp "${RUNNER_TEMP}/release-tools/drive/"* deploy/drive/
          cp "${RUNNER_TEMP}/release-tools/cloudrun-rollback.sh" scripts/ci/
          cp "${RUNNER_TEMP}/release-tools/sync_backend_runtime_secrets.py" \
            scripts/ops/sync_backend_runtime_secrets.py
          for tool in runtime_config_retention.py production_drive_candidate_config.py scope_commerce_runtime_policy.py shared_files_runtime_policy.py passkey_domain_policy.py upsert_gcp_secret.py; do
            cp "${RUNNER_TEMP}/release-tools/$tool" "scripts/ops/$tool"
          done
          cp "${RUNNER_TEMP}/release-tools/verify-env-secrets-parity.py" \
            scripts/ops/verify-env-secrets-parity.py
          for tool in cloudrun-retention.py process_group.py uat-retention-maintenance.py retention_publication.py \
            production_phone_receipt.py production_phone_lease.py production_phone_lease_receipts.py production_backend_successor.py production_backend_successor_proof.py production_backend_successor_control.py production_pending_activation.py production_activation_continuation.py production_staged_worker.py production_worker_basis.py production_backend_inheritance.py production_retention_context.py retention_admission.py tag-last-known-good.sh resolve-rollback-target.sh production-capacity-bridge.py production_capacity_bridge_contract.py \
            release_artifact_receipts.py release_cadence.py release_cadence_github.py \
            release_cadence_native.py release_cadence_maintenance.py; do
            cp "${RUNNER_TEMP}/release-tools/$tool" "scripts/ci/$tool"
          done
          cp "${RUNNER_TEMP}/release-tools/runtime-capacity-budget.py" \
            scripts/ci/runtime-capacity-budget.py
          cp "${RUNNER_TEMP}/release-tools/runtime_capacity_inventory.py" \
            scripts/ci/runtime_capacity_inventory.py
          cp "${RUNNER_TEMP}/release-tools/runtime_capacity_cli.py" scripts/ci/
          cp "${RUNNER_TEMP}/release-tools/verify-cloud-scheduler-attempt.py" scripts/ci/
          cp "${RUNNER_TEMP}/release-tools/cloudrun-rollback.sh" scripts/ci/
          mkdir -p deploy/drive
          cp "${RUNNER_TEMP}/release-tools/rollback_after_worker_failure.sh" deploy/drive/
          cp "${RUNNER_TEMP}/release-tools/account-deletion-fence-decision.py" \
            scripts/ci/account-deletion-fence-decision.py
          mkdir -p deploy/account-deletion
          cp "${RUNNER_TEMP}/release-tools/account-deletion/"* deploy/account-deletion/
          cp "${RUNNER_TEMP}/release-tools/runtime-capacity.json" \
            config/runtime-capacity.json
          for policy in ci-governance.json release-cadence.json; do
            cp "${RUNNER_TEMP}/release-tools/${policy}" "config/${policy}"
          done

      - name: Report production deploy lane
        run: |
          echo "Governed production deploy: using production environment."

      - name: Validate Google Cloud workload identity configuration
        shell: bash
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test -n "$WIF_PROVIDER" || { echo "Missing environment variable GCP_WORKLOAD_IDENTITY_PROVIDER" >&2; exit 1; }
          test -n "$DEPLOY_SERVICE_ACCOUNT" || { echo "Missing environment variable GCP_DEPLOY_SERVICE_ACCOUNT" >&2; exit 1; }

      - name: Authenticate to Google Cloud
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          project_id: ${{ env.GCP_PROJECT_ID }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set GCP project context
        run: gcloud config set project "${{ env.GCP_PROJECT_ID }}"

      - name: Assert GCP project scope
        shell: bash
        run: |
          set -euo pipefail
          ACTIVE_PROJECT="$(gcloud config get-value project 2>/dev/null)"
          if [ "$ACTIVE_PROJECT" != "${{ env.GCP_PROJECT_ID }}" ]; then
            echo "Refusing deploy: expected project '${{ env.GCP_PROJECT_ID }}' but got '$ACTIVE_PROJECT'."
            exit 1
          fi

      - name: Load qualified staged production Drive worker
        id: staged-worker
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STAGED_WORKER_RUN_ID: ${{ inputs.phone_worker_stage_run_id }}
          TARGET_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, "scripts/ci")
          import production_backend_successor_control as control
          import production_backend_successor_proof as proof
          import production_staged_worker as worker
          import production_retention_context as retention_context
          anchor = control.record_anchor(proof.read_original())
          run_id = os.environ["STAGED_WORKER_RUN_ID"]
          if anchor is not None and os.environ["PHONE_DEPLOY_PHASE"] != "cold" and not run_id:
              raise SystemExit("Production transition requires its qualified staged worker run")
          if run_id:
              if os.environ["PHONE_DEPLOY_PHASE"] == "cold":
                  raise SystemExit("Cold qualification cannot consume a staged worker")
              owner = control.authority()
              arguments = {}
              if anchor is None:
                  import production_worker_basis as basis
                  arguments["healthy_release_run_id"] = basis.current_release_run_id()
              staged = worker.load_worker(
                  run_id, anchor, api=owner.api, governed=owner.governed_dispatch,
                  timestamp=owner._github_timestamp, run_command=owner.retention.run_command, timeout=60,
                  **arguments,
              )
              retention_context.worker_flags(owner, staged)
              context = staged["context"]
              if context["source"] != os.environ["TARGET_SHA"]:
                  raise SystemExit("Staged worker belongs to another source")
              directory = Path(os.environ["RUNNER_TEMP"]) / "qualified-worker-stage"
              directory.mkdir(mode=0o700)
              for name in worker.FILES:
                  (directory / name).write_bytes(staged["files"][name])
              (directory / "context.json").write_text(json.dumps(context))
              values = {
                  "loaded": "true", "receipt": str(directory / worker.FILES[0]),
                  "image": context["image"], "run_id": context["context"]["run_id"],
                  "attempt": context["context"]["attempt"],
                  "config_secret": context["context"]["config_secret"],
              }
              if any("\n" in value or "\r" in value for value in values.values()):
                  raise SystemExit("Invalid staged worker output")
              with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                  output.writelines(f"{key}={value}\n" for key, value in values.items())
          PY

      - name: Enforce production database connection budget before deployment
        shell: bash
        env:
          PHONE_ROLLBACK_SHA: ${{ inputs.phone_rollback_sha }}
          STAGED_WORKER_LOADED: ${{ steps.staged-worker.outputs.loaded }}
        run: |
          set -euo pipefail
          extra=()
          if [[ "$PHONE_DEPLOY_PHASE" == cold || "$STAGED_WORKER_LOADED" == true ]]; then
            extra=(--candidate-service consent-protocol)
          elif [ -n "$PHONE_ROLLBACK_SHA" ]; then
            extra=(--additional-candidate-service consent-protocol)
          fi
          timeout --signal=TERM --kill-after=2s 295s python3 scripts/ci/runtime-capacity-budget.py --environment production "${extra[@]}"

      - name: Capture predeploy Cloud Run state
        id: predeploy-state
        shell: bash
        run: |
          set -euo pipefail

          if ! gcloud run services describe "${{ env.BACKEND_SERVICE }}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --region="${{ env.GCP_REGION }}" \
            --format=json > /tmp/prod-backend-predeploy-service.json 2>/dev/null; then
            printf '{}\n' > /tmp/prod-backend-predeploy-service.json
          fi
          if ! gcloud run services describe "${{ env.FRONTEND_SERVICE }}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --region="${{ env.GCP_REGION }}" \
            --format=json > /tmp/prod-frontend-predeploy-service.json 2>/dev/null; then
            printf '{}\n' > /tmp/prod-frontend-predeploy-service.json
          fi

          backend_state="$(python3 scripts/ci/resolve-cloud-run-serving-state.py \
            --service-json /tmp/prod-backend-predeploy-service.json \
            --allow-missing \
            --github-output "$GITHUB_OUTPUT" \
            --output-prefix backend)"
          frontend_state="$(python3 scripts/ci/resolve-cloud-run-serving-state.py \
            --service-json /tmp/prod-frontend-predeploy-service.json \
            --allow-missing \
            --github-output "$GITHUB_OUTPUT" \
            --output-prefix frontend)"

          backend_revision="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["revision"])' <<<"${backend_state}")"
          frontend_revision="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["revision"])' <<<"${frontend_state}")"
          backend_sha=""
          if [ -n "${backend_revision}" ]; then
            backend_sha="$(gcloud run revisions describe "${backend_revision}" \
              --project="${{ env.GCP_PROJECT_ID }}" \
              --region="${{ env.GCP_REGION }}" \
              --format='value(metadata.labels.deploy-sha)' 2>/dev/null || true)"
          fi
          frontend_sha=""
          if [ -n "${frontend_revision}" ]; then
            frontend_sha="$(gcloud run revisions describe "${frontend_revision}" \
              --project="${{ env.GCP_PROJECT_ID }}" \
              --region="${{ env.GCP_REGION }}" \
              --format='value(metadata.labels.deploy-sha)' 2>/dev/null || true)"
          fi

          echo "backend_sha=${backend_sha}" >> "$GITHUB_OUTPUT"
          echo "frontend_sha=${frontend_sha}" >> "$GITHUB_OUTPUT"
          echo "Predeploy backend serving revision: ${backend_revision:-none}"
          echo "Predeploy frontend serving revision: ${frontend_revision:-none}"

      - name: Resolve deployment scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          python3 "${RUNNER_TEMP}/release-tools/resolve-deploy-scope.py" \
            --requested-scope "${{ github.event.inputs.scope }}" \
            --target-sha "${{ github.event.inputs.sha }}" \
            --backend-base-sha "${{ steps.predeploy-state.outputs.backend_sha }}" \
            --frontend-base-sha "${{ steps.predeploy-state.outputs.frontend_sha }}" \
            --forward-only "${{ inputs.cadence_origin != '' }}" \
            --github-output "$GITHUB_OUTPUT" \
            --json

      - name: Require exact-SHA UAT acceptance
        id: predecessor-acceptance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 "${RUNNER_TEMP}/release-tools/verify-predecessor-acceptance.py" require \
            --environment uat --sha "${{ github.event.inputs.sha }}" \
            --scope "${{ steps.scope.outputs.scope }}" --output /tmp/prod-predecessor-acceptance.json

      - name: Verify production personal Gmail monitor identity
        if: steps.scope.outputs.deploy_backend == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gcloud iam service-accounts describe \
            "${{ env.GMAIL_PERSONAL_INFORMATION_REQUEST_MONITOR_SCHEDULER_SERVICE_ACCOUNT_ID }}@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --project="${{ env.GCP_PROJECT_ID }}" --format='value(email)' >/dev/null

      - name: Resolve production curated connector secrets
        id: prod-curated-secrets
        if: steps.scope.outputs.deploy_backend == 'true'
        shell: bash
        env:
          CURATED_CONNECTORS_ENABLED: ${{ vars.CURATED_MCP_CONNECTORS_PROD || 'false' }}
        run: |
          set -euo pipefail
          names=""
          enabled="false"
          if [ "${CURATED_CONNECTORS_ENABLED}" = "true" ]; then
            enabled="true"
            names="$(python3 scripts/ci/curated_connector_secrets.py)"
            for secret in ${names//+/ } EXTERNAL_CONNECTOR_CREDENTIAL_KEY; do
              if ! state="$(gcloud secrets versions describe latest --secret="${secret}" \
                  --project="${{ env.GCP_PROJECT_ID }}" --format='value(state)' 2>&1)"; then
                echo "::error::Production curated connector secret ${secret} is unavailable: ${state}. Provision it in hushh-pda before enabling CURATED_MCP_CONNECTORS_PROD." >&2
                exit 1
              fi
              if [ "${state}" != "ENABLED" ]; then
                echo "::error::Production curated connector secret ${secret} has no enabled latest version (state: ${state})." >&2
                exit 1
              fi
            done
          fi
          echo "names=${names}" >> "$GITHUB_OUTPUT"
          echo "enabled=${enabled}" >> "$GITHUB_OUTPUT"

      - name: Resolve production Drive release mode from serving backend
        id: drive-mode
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ steps.predeploy-state.outputs.backend_revision }}" ]; then
            gcloud run revisions describe "${{ steps.predeploy-state.outputs.backend_revision }}" \
              --project="${{ env.GCP_PROJECT_ID }}" --region="${{ env.GCP_REGION }}" \
              --format=json > /tmp/prod-drive-serving-backend.json
          else
            printf '{}\n' > /tmp/prod-drive-serving-backend.json
          fi
          python3 deploy/drive/resolve_prod_release_mode.py \
            --project "${{ env.GCP_PROJECT_ID }}" \
            --mode "${{ github.event.inputs.drive_live_mode }}" \
            --backend-deploy "${{ steps.scope.outputs.deploy_backend }}" \
            --previous-revision "${{ steps.predeploy-state.outputs.backend_revision }}" \
            --revision-json /tmp/prod-drive-serving-backend.json \
            --target-sha "${{ github.event.inputs.sha }}" \
            --required-ancestor "$(cat "${RUNNER_TEMP}/release-tools/prod-drive-feature-commit")" \
            --github-output "$GITHUB_OUTPUT"

      - name: Prepare qualified phone rollback and producer stage
        id: phone-rollback-plan
        if: steps.scope.outputs.deploy_backend == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PHONE_ROLLBACK_SHA: ${{ inputs.phone_rollback_sha }}
          ENABLE_PHONE_RECOVERY: ${{ inputs.phone_phase == 'cold' && 'false' || vars.AUTH_PHONE_RECOVERY_PROD_ENABLED || 'true' }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/phone-rollback
          gcloud auth configure-docker gcr.io --quiet
          python3 deploy/phone/plan.py prepare --run-id "${{ github.run_id }}" \
            --primary-sha "${{ inputs.sha }}" --enable-recovery "$ENABLE_PHONE_RECOVERY" \
            --current-json /tmp/prod-drive-serving-backend.json --fallback-sha "$PHONE_ROLLBACK_SHA" \
            --release-tools "${RUNNER_TEMP}/release-tools" \
            --output /tmp/phone-rollback/plan.json --github-output "$GITHUB_OUTPUT"

      - name: Resolve retained protected document maintenance
        id: document-mode
        shell: bash
        run: |
          set -euo pipefail
          python3 deploy/drive/resolve_protected_document_release.py \
            --project "${{ env.GCP_PROJECT_ID }}" --environment production \
            --target-sha "${{ github.event.inputs.sha }}" \
            --required-ancestor "$(cat "${RUNNER_TEMP}/release-tools/protected-document-reader-commit")" \
            --github-output "$GITHUB_OUTPUT" \
            | tee /tmp/prod-protected-document-release.json

      - name: Verify production Drive prerequisites before mutation
        if: (steps.drive-mode.outputs.active == 'true' || steps.document-mode.outputs.configured == 'true') && steps.scope.outputs.deploy_backend == 'true'
        shell: bash
        env:
          DRIVE_OAUTH_VERIFIED: ${{ vars.GOOGLE_DRIVE_OAUTH_PROD_VERIFIED || 'false' }}
        run: |
          set -euo pipefail
          if [ "${{ steps.scope.outputs.deploy_backend }}" != true ]; then
            echo "Production Drive activation requires backend deployment" >&2
            exit 1
          fi
          if [ "${DRIVE_OAUTH_VERIFIED}" != true ]; then
            echo "Production Drive OAuth client scopes and exact callbacks require operator attestation" >&2
            exit 1
          fi
          python3 deploy/drive/verify_prod_prerequisites.py \
            --project "${{ env.GCP_PROJECT_ID }}" --oauth-attested \
            --domain-catalog "${RUNNER_TEMP}/release-tools/drive-domain-aliases.json"
          PROJECT_ID="${{ env.GCP_PROJECT_ID }}" \
            bash deploy/drive/setup_native_callback_log_exclusion.sh --verify-only

      # promote-from-uat preflight. Runs before the secret sync, backup, fence
      # and migrations so a missing UAT release or missing IAM stops the run
      # before it changes anything. Evidence chain, all of which must agree:
      #   healthy-UAT git tag for exactly this SHA -> the backend revision it
      #   recorded -> that revision's deploy-sha label, env and @sha256 image.
      - name: Resolve UAT-verified backend image for promotion
        id: uat-verified-backend-image
        if: steps.scope.outputs.deploy_backend == 'true' && github.event.inputs.backend_image_source == 'promote-from-uat'
        shell: bash
        env:
          DEPLOY_SHA: ${{ github.event.inputs.sha }}
        run: |
          set -euo pipefail
          iam_help="Grant the production deployer read access to UAT as written in deploy/iam/README.md (Production image promotion), or dispatch again with backend_image_source=build-from-source."

          # deploy-uat.yml writes deployed/uat/<sha8>-<time> only after a UAT
          # release classified healthy. Newest first; each must peel to this SHA.
          git fetch --force --no-tags origin 'refs/tags/deployed/uat/*:refs/tags/deployed/uat/*'
          release_tags="$(git for-each-ref --sort=-creatordate \
            --format='%(refname) %(*objectname)' 'refs/tags/deployed/uat/' \
            | awk -v sha="${DEPLOY_SHA}" '$2 == sha { print $1 }')"
          if [ -z "${release_tags}" ]; then
            echo "Refusing promotion: ${DEPLOY_SHA} has no healthy UAT release. Deploy it to UAT first, or dispatch with backend_image_source=build-from-source." >&2
            exit 1
          fi

          image_reference=""
          while IFS= read -r release_tag; do
            [ -n "${release_tag}" ] || continue
            git for-each-ref --format='%(contents)' "${release_tag}" > /tmp/prod-uat-release-tag.txt
            uat_revision="$(sed -n 's/^backend_revision: //p' /tmp/prod-uat-release-tag.txt | head -n 1)"
            if [ -z "${uat_revision}" ]; then
              echo "${release_tag}: records no backend revision; skipping." >&2
              continue
            fi
            if ! gcloud run revisions describe "${uat_revision}" \
              --project="${{ env.UAT_GCP_PROJECT_ID }}" \
              --region="${{ env.GCP_REGION }}" \
              --format=json > /tmp/prod-uat-backend-revision.json 2> /tmp/prod-uat-backend-revision.err; then
              if grep -qiE 'PERMISSION_DENIED|403|does not have permission' /tmp/prod-uat-backend-revision.err; then
                echo "Refusing promotion: the production deployer cannot read Cloud Run revisions in ${{ env.UAT_GCP_PROJECT_ID }}. ${iam_help}" >&2
                exit 1
              fi
              echo "${release_tag}: UAT revision ${uat_revision} is no longer described (retired by retention?); skipping." >&2
              continue
            fi
            if image_reference="$(python3 "${RUNNER_TEMP}/release-tools/resolve-uat-verified-image.py" \
              --sha "${DEPLOY_SHA}" \
              --revision-json /tmp/prod-uat-backend-revision.json \
              --release-tag-annotation /tmp/prod-uat-release-tag.txt \
              --expected-repository "${{ env.UAT_BACKEND_IMAGE_REPOSITORY }}" \
              --json-output /tmp/prod-backend-image-promotion-source.json)"; then
              echo "Promotion source: ${image_reference} (UAT revision ${uat_revision}, ${release_tag#refs/tags/})."
              echo "uat_revision=${uat_revision}" >> "$GITHUB_OUTPUT"
              echo "uat_release_tag=${release_tag#refs/tags/}" >> "$GITHUB_OUTPUT"
              break
            fi
            image_reference=""
          done <<< "${release_tags}"
          if [ -z "${image_reference}" ]; then
            echo "Refusing promotion: no healthy UAT release of ${DEPLOY_SHA} still proves which backend digest it verified. A frontend-only UAT release does not verify a backend image. Deploy this SHA to UAT with backend scope, or dispatch with backend_image_source=build-from-source." >&2
            exit 1
          fi

          # Registry read preflight: prove the digest is readable and is one
          # executable image, before anything in production is touched.
          gcloud auth configure-docker gcr.io --quiet
          if ! docker buildx imagetools inspect --raw "${image_reference}" \
            > /tmp/prod-uat-backend-image-manifest.json 2> /tmp/prod-uat-backend-image.err; then
            cat /tmp/prod-uat-backend-image.err >&2
            echo "Refusing promotion: the production deployer cannot read ${image_reference}. ${iam_help}" >&2
            exit 1
          fi
          pinned="$(python3 scripts/ci/resolve-cloud-run-image.py \
            --image-reference "${image_reference}" \
            --manifest-json /tmp/prod-uat-backend-image-manifest.json \
            --sha "${DEPLOY_SHA}" \
            --json-output /tmp/prod-uat-backend-image.json)"
          if [ "${pinned}" != "${image_reference}" ]; then
            echo "Refusing promotion: UAT's verified image is not a single executable manifest." >&2
            exit 1
          fi
          echo "image_reference=${image_reference}" >> "$GITHUB_OUTPUT"

      - name: Set up Python + uv runtime
        uses: ./consent-protocol/.github/actions/setup-python-uv
        with:
          python-version: "3.13"
          protocol-dir: ./consent-protocol

      - name: Install Cloud SQL Auth Proxy
        if: steps.scope.outputs.deploy_backend == 'true' || steps.document-mode.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.18.3/cloud-sql-proxy.linux.amd64 \
            -o /usr/local/bin/cloud-sql-proxy
          chmod +x /usr/local/bin/cloud-sql-proxy

      - name: Verify protected document reader and rollback compatibility
        if: steps.document-mode.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          "${{ env.PROTOCOL_PYTHON }}" deploy/drive/resolve_protected_document_release.py \
            --project "${{ env.GCP_PROJECT_ID }}" --environment production \
            --target-sha "${{ github.event.inputs.sha }}" \
            --required-ancestor "$(cat "${RUNNER_TEMP}/release-tools/protected-document-reader-commit")" \
            --verify-previous --json-output /tmp/prod-document-reader-compatibility.json
          echo "HUSHH_DOCUMENT_READER_GUARD_REPORT=/tmp/prod-document-reader-compatibility.json" >> "$GITHUB_ENV"
          echo "HUSHH_DOCUMENT_READER_ENVIRONMENT=production" >> "$GITHUB_ENV"

      - name: Qualify WorkOS non-activation before production mutation
        if: steps.scope.outputs.deploy_backend == 'true'
        run: |
          "${{ env.PROTOCOL_PYTHON }}" deploy/phone/workos_rollout.py \
            --project "${{ env.GCP_PROJECT_ID }}" --output /tmp/phone-rollback/workos-before.json

      - name: Attest production Drive database before secret sync
        if: (steps.drive-mode.outputs.active == 'true' || steps.document-mode.outputs.configured == 'true') && steps.scope.outputs.deploy_backend == 'true'
        shell: bash
        run: |
          set -euo pipefail
          export ENVIRONMENT=production
          export GOOGLE_CLOUD_PROJECT="${{ env.GCP_PROJECT_ID }}"
          export CLOUDSQL_INSTANCE_CONNECTION_NAME="${{ env.PROD_CLOUDSQL_INSTANCE }}"
          DB_USER="$(gcloud secrets versions access latest --secret=DB_USER --project="${{ env.GCP_PROJECT_ID }}")"
          DB_PASSWORD="$(gcloud secrets versions access latest --secret=DB_PASSWORD --project="${{ env.GCP_PROJECT_ID }}")"
          echo "::add-mask::${DB_USER}"
          echo "::add-mask::${DB_PASSWORD}"
          cloud-sql-proxy --address 127.0.0.1 --port 6544 \
            ${GOOGLE_GHA_CREDS_PATH:+--credentials-file="${GOOGLE_GHA_CREDS_PATH}"} \
            "${{ env.PROD_CLOUDSQL_INSTANCE }}" >/tmp/cloud-sql-proxy-prod-drive-attest.log 2>&1 &
          PROXY_PID=$!
          trap 'kill "${PROXY_PID}" >/dev/null 2>&1 || true' EXIT
          python3 - <<'PY'
          import socket
          import time

          for _ in range(80):
              with socket.socket() as sock:
                  if sock.connect_ex(("127.0.0.1", 6544)) == 0:
                      raise SystemExit(0)
              time.sleep(0.25)
          raise SystemExit("Production Drive DB attestation proxy did not bind")
          PY
          export DB_HOST=127.0.0.1 DB_PORT=6544 DB_NAME="${{ env.PROD_DB_NAME }}"
          export DB_USER DB_PASSWORD
          "${{ env.PROTOCOL_PYTHON }}" consent-protocol/scripts/ops/reconcile_google_drive_prod_connector.py --attest-target

      - name: Verify production Places prerequisites
        if: steps.scope.outputs.deploy_backend == 'true' && vars.ONE_PLACES_DIRECTORY_ENABLED_PROD != 'false'
        shell: bash
        run: |
          set -euo pipefail
          python3 "${RUNNER_TEMP}/release-tools/verify-prod-places-readiness.py" \
            --project "${GCP_PROJECT_ID}"

      - name: Sync canonical hosted runtime secrets
        if: env.PHONE_DEPLOY_PHASE != 'cold' && (steps.scope.outputs.deploy_backend == 'true')
        shell: bash
        env:
          PROD_CURATED_MCP_CONNECTORS: ${{ vars.CURATED_MCP_CONNECTORS_PROD || 'false' }}
          PRODUCTION_DRIVE_ACTIVE: ${{ steps.drive-mode.outputs.active }}
          CONSENT_CENTER_SUMMARY_V2_ENABLED: ${{ vars.CONSENT_CENTER_SUMMARY_V2_ENABLED || 'true' }}
          HUSSH_TRUSTED_DEVICE_ENABLED: ${{ vars.HUSSH_TRUSTED_DEVICE_ENABLED || 'false' }}
          NEARBY_CHECK_IN_COHORT: ${{ inputs.nearby_check_in_cohort }}
          ADVISORS_API_BASE_URL: ${{ vars.ADVISORS_API_BASE_URL || 'https://brokercheck.35.253.255.106.sslip.io' }}
          INSURANCE_AGENTS_API_BASE_URL: ${{ vars.INSURANCE_AGENTS_API_BASE_URL || 'https://insurance-agents.34.61.69.175.sslip.io' }}
          ONE_PLACES_DIRECTORY_ENABLED_PROD: ${{ vars.ONE_PLACES_DIRECTORY_ENABLED_PROD || 'true' }}
        run: bash deploy/drive/sync_runtime_config_prod.sh

      - name: Sync frontend hosted runtime secrets
        if: env.PHONE_DEPLOY_PHASE != 'cold' && (steps.scope.outputs.deploy_frontend == 'true')
        shell: bash
        run: |
          set -euo pipefail
          "${{ env.PROTOCOL_PYTHON }}" scripts/ops/sync_frontend_runtime_secrets.py \
            --project "${{ env.GCP_PROJECT_ID }}" \
            --environment production \
            > /tmp/prod-frontend-runtime-secret-sync.json

      - name: Qualify initial cold schema boundary
        id: cold-schema-preflight
        if: env.PHONE_DEPLOY_PHASE == 'cold'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCHEMA_ORIGIN_RUN: ${{ inputs.phone_schema_origin_run_id }}
          SCHEMA_ORIGIN_ATTEMPT: ${{ inputs.phone_schema_origin_attempt }}
        run: |
          set -euo pipefail
          origin=()
          if [[ -n "$SCHEMA_ORIGIN_RUN" ]]; then
            origin=(--origin-run-id "$SCHEMA_ORIGIN_RUN" --origin-attempt "$SCHEMA_ORIGIN_ATTEMPT")
          fi
          "${{ env.PROTOCOL_PYTHON }}" deploy/phone/schema_qualification.py preflight \
            --plan /tmp/phone-rollback/plan.json --output /tmp/phone-rollback/schema-preflight.json "${origin[@]}"

      - name: Publish initial cold schema intent
        id: cold-schema-intent
        if: env.PHONE_DEPLOY_PHASE == 'cold' && steps.cold-schema-preflight.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: prod-phone-schema-intent-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/phone-rollback/schema-preflight.json
          if-no-files-found: error
          retention-days: 30

      - name: Optional predeploy logical backup run
        if: steps.scope.outputs.deploy_backend == 'true' && github.event.inputs.run_predeploy_backup_job == 'true' && (env.PHONE_DEPLOY_PHASE != 'cold' || steps.cold-schema-intent.outcome == 'success')
        run: |
          set -euo pipefail
          gcloud sql backups create \
            --instance="${PROD_CLOUDSQL_INSTANCE_NAME}" \
            --project="${GCP_PROJECT_ID}" \
            --description="predeploy-${GITHUB_SHA:-manual}"

      - name: Pre-deploy Cloud SQL backup posture gate
        if: steps.scope.outputs.deploy_backend == 'true'
        id: backup-gate
        shell: bash
        run: |
          set -euo pipefail
          "${{ env.PROTOCOL_PYTHON }}" scripts/ops/cloudsql_backup_freshness_check.py \
            --project-id "${GCP_PROJECT_ID}" \
            --instance "${PROD_CLOUDSQL_INSTANCE_NAME}" \
            --max-age-hours "${BACKUP_MAX_AGE_HOURS}" \
            --report-path /tmp/backup-posture-report.json

          BACKUP_ID="$(python3 -c "import json; from pathlib import Path; payload=json.loads(Path('/tmp/backup-posture-report.json').read_text(encoding='utf-8')); latest=payload.get('latest_backup', {}) if isinstance(payload, dict) else {}; print(str(latest.get('id') or '').strip())")"
          BACKUP_COMPLETED_AT="$(python3 -c "import json; from pathlib import Path; payload=json.loads(Path('/tmp/backup-posture-report.json').read_text(encoding='utf-8')); latest=payload.get('latest_backup', {}) if isinstance(payload, dict) else {}; print(str(latest.get('completed_at') or '').strip())")"
          echo "backup_id=${BACKUP_ID}" >> "$GITHUB_OUTPUT"
          echo "backup_completed_at=${BACKUP_COMPLETED_AT}" >> "$GITHUB_OUTPUT"

      # The web image is production-specific (NEXT_PUBLIC_* values from this
      # project's Secret Manager are compiled in), so it is always built here,
      # never promoted from UAT. It builds while the backend image, fence,
      # migrations and backend candidate checks run, and the lane comes back
      # for it right before the frontend deploy.
      - name: Start frontend image build in parallel
        id: start-frontend-image-build
        if: env.PHONE_DEPLOY_PHASE != 'cold' && (steps.scope.outputs.deploy_frontend == 'true')
        shell: bash
        run: |
          set -euo pipefail
          image_tag="prod-${{ github.event.inputs.sha }}"
          # The single definition of every value compiled into the web image.
          # The deploy step reuses it, so the build and deploy cannot disagree.
          build_substitutions="_APP_ENV=production,_DEPLOY_ENV=production,_IMAGE_TAG=${image_tag},_ONE_WALLET_CARD_ENABLED=true,_ONE_LOCATION_NEARBY_CHECK_IN=${{ github.event.inputs.nearby_check_in_cohort && 'true' || 'false' }},_LOCATION_MAP_DEMO=false"
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"
          echo "build_substitutions=${build_substitutions}" >> "$GITHUB_OUTPUT"
          # A deployment SHA from before the split has no build-only config.
          # It keeps the combined build-and-deploy, serially, exactly as before.
          if [ ! -f deploy/frontend-image.cloudbuild.yaml ] \
            || ! grep -q '_SKIP_IMAGE_BUILD' deploy/frontend.cloudbuild.yaml; then
            echo "prebuilt=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Frontend image build::This SHA predates the prebuilt frontend image; using the combined build-and-deploy."
            exit 0
          fi
          build_id="$(gcloud builds submit \
            --async \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --config=deploy/frontend-image.cloudbuild.yaml \
            --format='value(id)' \
            "--substitutions=${build_substitutions}")"
          if [[ ! "${build_id}" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
            echo "Frontend image build did not return a Cloud Build id." >&2
            exit 1
          fi
          echo "Started frontend image build ${build_id}."
          echo "build_id=${build_id}" >> "$GITHUB_OUTPUT"
          echo "prebuilt=true" >> "$GITHUB_OUTPUT"

      - name: Build and pin backend image before lifecycle migration
        id: build-backend-image
        if: steps.scope.outputs.deploy_backend == 'true'
        shell: bash
        env:
          STAGED_WORKER_LOADED: ${{ steps.staged-worker.outputs.loaded }}
          STAGED_WORKER_IMAGE: ${{ steps.staged-worker.outputs.image }}
          BACKEND_IMAGE_SOURCE: ${{ github.event.inputs.backend_image_source }}
          UAT_VERIFIED_IMAGE_REFERENCE: ${{ steps.uat-verified-backend-image.outputs.image_reference }}
        run: |
          set -euo pipefail
          image_tag="prod-${{ github.event.inputs.sha }}"
          image_repository="gcr.io/${{ env.GCP_PROJECT_ID }}/consent-protocol"
          if [[ "${STAGED_WORKER_LOADED:-}" == true ]]; then
            [[ "$STAGED_WORKER_IMAGE" =~ ^gcr\.io/hushh-pda/consent-protocol@sha256:[0-9a-f]{64}$ ]] || exit 1
            image_reference="$STAGED_WORKER_IMAGE"
            BACKEND_IMAGE_SOURCE=retained-operational-image
          else
          case "${BACKEND_IMAGE_SOURCE:-}" in
            build-from-source)
              gcloud builds submit \
                --project="${{ env.GCP_PROJECT_ID }}" \
                --config=deploy/backend-image.cloudbuild.yaml \
                "--substitutions=_IMAGE_TAG=${image_tag}"
              ;;
            promote-from-uat)
              if [[ ! "${UAT_VERIFIED_IMAGE_REFERENCE:-}" =~ ^gcr\.io/hushh-pda-uat/consent-protocol@sha256:[0-9a-f]{64}$ ]]; then
                echo "Refusing promotion: the UAT-verified backend digest is missing or malformed." >&2
                exit 1
              fi
              # Copy the exact manifest UAT verified into this project's
              # registry. Cloud Run then deploys the copy, so production never
              # depends on the UAT registry at runtime or for rollback.
              if ! gcloud container images add-tag --quiet \
                "${UAT_VERIFIED_IMAGE_REFERENCE}" "${image_repository}:${image_tag}"; then
                echo "Refusing promotion: could not copy ${UAT_VERIFIED_IMAGE_REFERENCE} into ${image_repository}. The production deployer needs read on the UAT gcr.io repository and write on the production gcr.io repository (deploy/iam/README.md, Production image promotion), or dispatch again with backend_image_source=build-from-source." >&2
                exit 1
              fi
              ;;
            *)
              echo "backend_image_source must be build-from-source or promote-from-uat." >&2
              exit 1
              ;;
          esac

          image_digest="$(gcloud container images describe \
            "${image_repository}:${image_tag}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --format='value(image_summary.digest)')"
          if [[ ! "${image_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Backend image build did not resolve an immutable sha256 digest." >&2
            exit 1
          fi
          image_reference="${image_repository}@${image_digest}"
          fi
          # Buildx attestations live in a parent index. Pin its executable child
          # before the fence; Cloud Run must later report this exact digest.
          gcloud auth configure-docker gcr.io --quiet
          docker buildx imagetools inspect --raw "${image_reference}" \
            > /tmp/prod-backend-image-manifest.json
          image_reference="$(python3 scripts/ci/resolve-cloud-run-image.py \
            --image-reference "${image_reference}" \
            --manifest-json /tmp/prod-backend-image-manifest.json \
            --sha "${{ github.event.inputs.sha }}" \
            --json-output /tmp/prod-backend-image.json)"
          if [ "${BACKEND_IMAGE_SOURCE}" = "promote-from-uat" ] \
            && [ "${image_reference}" != "${image_repository}@${UAT_VERIFIED_IMAGE_REFERENCE#*@}" ]; then
            echo "Refusing promotion: production resolved ${image_reference}, not the digest UAT verified (${UAT_VERIFIED_IMAGE_REFERENCE#*@})." >&2
            exit 1
          fi
          if [[ "${STAGED_WORKER_LOADED:-}" == true && "$image_reference" != "$STAGED_WORKER_IMAGE" ]]; then
            echo "Qualified operational image changed during manifest validation" >&2; exit 1
          fi
          echo "image_reference=${image_reference}" >> "$GITHUB_OUTPUT"
          echo "image_source=${BACKEND_IMAGE_SOURCE}" >> "$GITHUB_OUTPUT"

      - name: Refuse an already failed frontend image before lifecycle migration
        id: check-frontend-image
        if: env.PHONE_DEPLOY_PHASE != 'cold' && (steps.scope.outputs.deploy_frontend == 'true' && steps.start-frontend-image-build.outputs.prebuilt == 'true')
        shell: bash
        env:
          FRONTEND_IMAGE_BUILD_ID: ${{ steps.start-frontend-image-build.outputs.build_id }}
        run: |
          set -euo pipefail
          # The workflow is main-owned; the helper comes from the candidate.
          # Historical candidates retain the required final image join.
          if ! grep -Fq -- '--status-only)' scripts/ci/await-prebuilt-image.sh; then
            echo "::notice title=Frontend image status::This candidate predates the early check; retaining the final image join."
            exit 0
          fi
          bash scripts/ci/await-prebuilt-image.sh \
            --project "${{ env.GCP_PROJECT_ID }}" \
            --build-id "${FRONTEND_IMAGE_BUILD_ID}" --status-only

      - name: Qualify current account lifecycle producer
        if: steps.scope.outputs.deploy_backend == 'true' && (env.PHONE_DEPLOY_PHASE != 'cold' || steps.cold-schema-intent.outcome == 'success')
        run: python3 deploy/account-deletion/activate_release.py --qualify-source "${{ github.event.inputs.sha }}"

      - name: Qualify uninterrupted account deletion
        id: account-deletion-fence-decision
        if: steps.scope.outputs.deploy_backend == 'true' && (env.PHONE_DEPLOY_PHASE != 'cold' || steps.cold-schema-intent.outcome == 'success')
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GCP_PROJECT_ID}" != "hushh-pda" ] \
             || [ "${PROD_CLOUDSQL_INSTANCE}" != "hushh-pda:us-central1:hushh-vault-db" ]; then
            echo "Refusing account deletion preflight on a non-canonical production target."
            exit 1
          fi
          if ! gcloud run revisions list \
            --service="${BACKEND_SERVICE}" --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" --format=json \
            > /tmp/prod-account-deletion-revisions.json; then
            printf '[]\n' > /tmp/prod-account-deletion-revisions.json
          fi
          decision="$(python3 scripts/ci/account-deletion-fence-decision.py \
            --revisions-json /tmp/prod-account-deletion-revisions.json \
            --backend-base-sha "${{ steps.predeploy-state.outputs.backend_sha }}" \
            --target-sha "${{ github.event.inputs.sha }}" \
            --github-output "$GITHUB_OUTPUT")"
          if [ "${decision}" = "unfenced_candidate" ]; then
            DB_USER="$(gcloud secrets versions access latest --secret=DB_USER --project="${GCP_PROJECT_ID}")"
            DB_PASSWORD="$(gcloud secrets versions access latest --secret=DB_PASSWORD --project="${GCP_PROJECT_ID}")"
            echo "::add-mask::${DB_USER}"
            echo "::add-mask::${DB_PASSWORD}"
            cloud-sql-proxy --address 127.0.0.1 --port 6544 \
              ${GOOGLE_GHA_CREDS_PATH:+--credentials-file="${GOOGLE_GHA_CREDS_PATH}"} \
              "${PROD_CLOUDSQL_INSTANCE}" >/tmp/cloud-sql-proxy-prod-deletion-preflight.log 2>&1 &
            PROXY_PID=$!
            trap 'kill "${PROXY_PID}" >/dev/null 2>&1 || true' EXIT
            python3 - <<'PY'
          import socket
          import time
          deadline = time.time() + 20
          while time.time() < deadline:
              with socket.socket() as sock:
                  sock.settimeout(0.5)
                  if sock.connect_ex(("127.0.0.1", 6544)) == 0:
                      raise SystemExit(0)
              time.sleep(0.25)
          raise SystemExit("Cloud SQL proxy did not bind for deletion preflight")
          PY
            if ! command -v psql >/dev/null 2>&1; then
              sudo apt-get update -qq
              sudo apt-get install -y -qq postgresql-client
            fi
            if PGHOST=127.0.0.1 PGPORT=6544 PGDATABASE="${PROD_DB_NAME}" \
               PGUSER="$DB_USER" PGPASSWORD="$DB_PASSWORD" \
               psql --no-psqlrc -v expected_fence_count=0 \
                 --file deploy/account-deletion/verify_release_boundary.sql \
                 > /tmp/prod-account-deletion-unfenced-preflight.log 2>&1; then
              echo "required=false" >> "$GITHUB_OUTPUT"
              echo "Verified active v201 database and revisions; deletion remains available."
              exit 0
            fi
            echo "Unfenced database verification failed; retaining the release fence."
          fi
          echo "required=true" >> "$GITHUB_OUTPUT"

      - name: Install fail-closed account deletion release fence
        id: install-account-deletion-fence
        if: steps.scope.outputs.deploy_backend == 'true' && steps.account-deletion-fence-decision.outputs.required == 'true' && (env.PHONE_DEPLOY_PHASE != 'cold' || steps.cold-schema-intent.outcome == 'success')
        shell: bash
        run: |
          set -euo pipefail

          if [ "${GCP_PROJECT_ID}" != "hushh-pda" ] \
             || [ "${PROD_CLOUDSQL_INSTANCE}" != "hushh-pda:us-central1:hushh-vault-db" ]; then
            echo "Refusing account deletion fence: project or Cloud SQL instance is not the canonical production target."
            exit 1
          fi
          export CLOUDSQL_INSTANCE_CONNECTION_NAME="${PROD_CLOUDSQL_INSTANCE}"

          DB_USER="$(gcloud secrets versions access latest --secret=DB_USER --project="${{ env.GCP_PROJECT_ID }}")"
          DB_PASSWORD="$(gcloud secrets versions access latest --secret=DB_PASSWORD --project="${{ env.GCP_PROJECT_ID }}")"
          echo "::add-mask::${DB_USER}"
          echo "::add-mask::${DB_PASSWORD}"

          cloud-sql-proxy \
            --address 127.0.0.1 \
            --port 6544 \
            ${GOOGLE_GHA_CREDS_PATH:+--credentials-file="${GOOGLE_GHA_CREDS_PATH}"} \
            "${{ env.PROD_CLOUDSQL_INSTANCE }}" >/tmp/cloud-sql-proxy-prod-fence.log 2>&1 &
          PROXY_PID=$!
          trap 'kill "${PROXY_PID}" >/dev/null 2>&1 || true' EXIT

          python3 - <<'PY'
          import socket
          import time

          deadline = time.time() + 20
          while time.time() < deadline:
              with socket.socket() as sock:
                  sock.settimeout(0.5)
                  if sock.connect_ex(("127.0.0.1", 6544)) == 0:
                      raise SystemExit(0)
              time.sleep(0.25)
          raise SystemExit("Cloud SQL proxy did not bind 127.0.0.1:6544 in time")
          PY

          export DB_HOST=127.0.0.1
          export DB_PORT=6544
          export DB_NAME="${{ env.PROD_DB_NAME }}"
          export DB_USER
          export DB_PASSWORD

          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi

          export PGHOST="$DB_HOST"
          export PGPORT="$DB_PORT"
          export PGDATABASE="${PROD_DB_NAME}"
          export PGUSER="$DB_USER"
          export PGPASSWORD="$DB_PASSWORD"
          psql --no-psqlrc \
            --file deploy/account-deletion/install_release_fence.sql \
            | tee /tmp/prod-account-deletion-fence-install.log
          echo "installed=true" >> "$GITHUB_OUTPUT"

      - name: Apply production DB migrations behind account deletion fence
        id: predeploy-db-gate
        if: steps.scope.outputs.deploy_backend == 'true' && (env.PHONE_DEPLOY_PHASE != 'cold' || steps.cold-schema-intent.outcome == 'success')
        shell: bash
        run: |
          set -euo pipefail

          if [ "${GCP_PROJECT_ID}" != "hushh-pda" ] \
             || [ "${PROD_CLOUDSQL_INSTANCE}" != "hushh-pda:us-central1:hushh-vault-db" ]; then
            echo "Refusing production migration: project or Cloud SQL instance is not the canonical production target."
            exit 1
          fi
          export CLOUDSQL_INSTANCE_CONNECTION_NAME="${PROD_CLOUDSQL_INSTANCE}"

          # Production is Cloud SQL, reached only through the Auth Proxy from this
          # runner (there is no plain DB_HOST/DB_PORT env var on the deployed
          # service to scrape -- that approach never matched how this app actually
          # resolves its DB connection, see BACKEND_RUNTIME_CONFIG_JSON's
          # db_unix_socket key and hydrate_runtime_environment()). Mirrors the UAT
          # deploy lane's proven pattern exactly.
          DB_USER="$(gcloud secrets versions access latest --secret=DB_USER --project="${{ env.GCP_PROJECT_ID }}")"
          DB_PASSWORD="$(gcloud secrets versions access latest --secret=DB_PASSWORD --project="${{ env.GCP_PROJECT_ID }}")"
          echo "::add-mask::${DB_USER}"
          echo "::add-mask::${DB_PASSWORD}"

          cloud-sql-proxy \
            --address 127.0.0.1 \
            --port 6544 \
            ${GOOGLE_GHA_CREDS_PATH:+--credentials-file="${GOOGLE_GHA_CREDS_PATH}"} \
            "${{ env.PROD_CLOUDSQL_INSTANCE }}" >/tmp/cloud-sql-proxy-prod.log 2>&1 &
          PROXY_PID=$!
          trap 'kill "${PROXY_PID}" >/dev/null 2>&1 || true' EXIT

          python3 - <<'PY'
          import socket
          import time

          deadline = time.time() + 20
          while time.time() < deadline:
              with socket.socket() as sock:
                  sock.settimeout(0.5)
                  if sock.connect_ex(("127.0.0.1", 6544)) == 0:
                      raise SystemExit(0)
              time.sleep(0.25)
          raise SystemExit("Cloud SQL proxy did not bind 127.0.0.1:6544 in time")
          PY

          export DB_HOST=127.0.0.1
          export DB_PORT=6544
          export DB_NAME="${{ env.PROD_DB_NAME }}"
          export DB_USER DB_PASSWORD
          export PGHOST="$DB_HOST"
          export PGPORT="$DB_PORT"
          export PGDATABASE="${PROD_DB_NAME}"
          export PGUSER="$DB_USER"
          export PGPASSWORD="$DB_PASSWORD"

          # Reassert the fence only when crossing an unproven lifecycle boundary.
          if [ "${{ steps.account-deletion-fence-decision.outputs.required }}" = "true" ]; then
            psql --no-psqlrc \
              --file deploy/account-deletion/install_release_fence.sql \
              | tee /tmp/prod-account-deletion-fence-premigration.log
          fi

          if [[ "$PHONE_DEPLOY_PHASE" == cold ]]; then
            (cd consent-protocol && "${{ env.PROTOCOL_PYTHON }}" db/migrate.py --release --release-environment production --migration-mode observe)
          fi
          (
            cd consent-protocol
            "${{ env.PROTOCOL_PYTHON }}" db/migrate.py --release \
              --release-environment production \
              --migration-mode replay
          )
          if [[ "$PHONE_DEPLOY_PHASE" == cold ]]; then
            (cd consent-protocol && "${{ env.PROTOCOL_PYTHON }}" db/migrate.py --release --release-environment production --migration-mode observe)
          fi
          if [[ "$PHONE_DEPLOY_PHASE" == cold ]]; then
            python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('/tmp/phone-rollback/schema-observe.json').write_text(json.dumps({
              "mode": "observe", "qualification": "passed", "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
          }))
          PY
          fi
          if [[ "$PHONE_DEPLOY_PHASE" != cold ]] && { [ "${{ steps.drive-mode.outputs.active }}" = true ] || [ "${{ steps.document-mode.outputs.configured }}" = true ]; }; then
            export ENVIRONMENT=production
            export GOOGLE_CLOUD_PROJECT="${{ env.GCP_PROJECT_ID }}"
            (
              cd consent-protocol
              "${{ env.PROTOCOL_PYTHON }}" scripts/ops/reconcile_google_drive_prod_connector.py --activate
              "${{ env.PROTOCOL_PYTHON }}" scripts/ops/reconcile_google_drive_prod_connector.py
            )
          fi
          expected_fence_count=0
          if [ "${{ steps.account-deletion-fence-decision.outputs.required }}" = "true" ]; then
            expected_fence_count=2
          fi
          psql --no-psqlrc -v "expected_fence_count=${expected_fence_count}" \
            --file deploy/account-deletion/verify_release_boundary.sql \
            | tee /tmp/prod-account-deletion-boundary.log
          tombstone_count="$(psql --no-psqlrc --tuples-only --no-align \
            --command 'SELECT count(*) FROM public.account_deletion_tombstones')"
          if [[ ! "${tombstone_count}" =~ ^[0-9]+$ ]]; then
            echo "Unable to record the migration-boundary tombstone count." >&2
            exit 1
          fi
          echo "tombstone_count=${tombstone_count}" >> "$GITHUB_OUTPUT"

      - name: Migration governance and DB drift gate
        if: steps.scope.outputs.deploy_backend == 'true' && (env.PHONE_DEPLOY_PHASE != 'cold' || steps.cold-schema-intent.outcome == 'success')
        shell: bash
        run: |
          set -euo pipefail

          DB_USER="$(gcloud secrets versions access latest --secret=DB_USER --project="${{ env.GCP_PROJECT_ID }}")"
          DB_PASSWORD="$(gcloud secrets versions access latest --secret=DB_PASSWORD --project="${{ env.GCP_PROJECT_ID }}")"
          echo "::add-mask::${DB_USER}"
          echo "::add-mask::${DB_PASSWORD}"

          cloud-sql-proxy \
            --address 127.0.0.1 \
            --port 6544 \
            ${GOOGLE_GHA_CREDS_PATH:+--credentials-file="${GOOGLE_GHA_CREDS_PATH}"} \
            "${{ env.PROD_CLOUDSQL_INSTANCE }}" >/tmp/cloud-sql-proxy-prod-drift-gate.log 2>&1 &
          PROXY_PID=$!
          trap 'kill "${PROXY_PID}" >/dev/null 2>&1 || true' EXIT

          python3 - <<'PY'
          import socket
          import time

          deadline = time.time() + 20
          while time.time() < deadline:
              with socket.socket() as sock:
                  sock.settimeout(0.5)
                  if sock.connect_ex(("127.0.0.1", 6544)) == 0:
                      raise SystemExit(0)
              time.sleep(0.25)
          raise SystemExit("Cloud SQL proxy did not bind 127.0.0.1:6544 in time")
          PY

          export DB_HOST=127.0.0.1
          export DB_PORT=6544
          export DB_NAME="${{ env.PROD_DB_NAME }}"
          export DB_USER DB_PASSWORD
          "${{ env.PROTOCOL_PYTHON }}" scripts/ops/db_migration_release_guard.py \
            --release-environment production \
            --report-path /tmp/db-migration-guard-report.json

      - name: Generate production migration release manifest
        if: steps.scope.outputs.deploy_backend == 'true' && (env.PHONE_DEPLOY_PHASE != 'cold' || steps.cold-schema-intent.outcome == 'success')
        shell: bash
        run: |
          set -euo pipefail
          "${{ env.PROTOCOL_PYTHON }}" scripts/ops/generate_migration_release_manifest.py \
            --output /tmp/prod-migration-release-manifest.json \
            --environment production --git-sha "${{ inputs.sha }}" \
            --backup-report-path /tmp/backup-posture-report.json

      - name: Upload production DB governance artifacts
        if: always() && steps.scope.outputs.deploy_backend == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: prod-db-governance-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            /tmp/backup-posture-report.json
            /tmp/db-migration-guard-report.json
            /tmp/prod-migration-release-manifest.json

      - name: Qualify installed cold schema
        id: cold-schema-installed
        if: env.PHONE_DEPLOY_PHASE == 'cold' && steps.predeploy-db-gate.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          "${{ env.PROTOCOL_PYTHON }}" deploy/phone/schema_qualification.py installed \
            --plan /tmp/phone-rollback/plan.json --baseline /tmp/phone-rollback/schema-preflight.json \
            --guard /tmp/db-migration-guard-report.json --backup /tmp/backup-posture-report.json \
            --manifest /tmp/prod-migration-release-manifest.json --observe /tmp/phone-rollback/schema-observe.json \
            --primary-image "${{ steps.build-backend-image.outputs.image_reference }}" --output /tmp/phone-rollback/schema-installed.json

      - name: Record initial cold health-tag lease
        id: cold-lease
        if: env.PHONE_DEPLOY_PHASE == 'cold' && steps.cold-schema-installed.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gcloud run services get-iam-policy "${{ env.BACKEND_SERVICE }}" \
            --project="${{ env.GCP_PROJECT_ID }}" --region="${{ env.GCP_REGION }}" \
            --format=json > /tmp/prod-backend-predeploy-iam.json
          python3 deploy/phone/bootstrap.py begin --plan /tmp/phone-rollback/plan.json \
            --before /tmp/prod-backend-predeploy-service.json --before-iam /tmp/prod-backend-predeploy-iam.json \
            --lease-state /tmp/phone-rollback/initial-lease.json --output /tmp/phone-rollback/initial-lease.json

      - name: Publish initial cold health-tag intent
        id: cold-lease-intent
        if: env.PHONE_DEPLOY_PHASE == 'cold' && steps.cold-lease.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: prod-phone-health-intent-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/phone-rollback/initial-lease.json
          if-no-files-found: error
          retention-days: 30

      - name: Deploy backend using Cloud Build
        id: deploy-backend
        if: steps.scope.outputs.deploy_backend == 'true' && (env.PHONE_DEPLOY_PHASE != 'cold' || (steps.cold-lease.outcome == 'success' && steps.cold-lease-intent.outcome == 'success'))
        run: |
          if [ "${{ github.event.inputs.enable_one_email_kyc }}" = "true" ]; then
            echo "Production One Email KYC is blocked until mailbox-watch ownership, Scheduler renewal, and encrypted-at-rest draft storage are complete."
            exit 1
          fi
          set -euo pipefail
          DRIVE_SUBSTITUTIONS=",_BACKEND_RUNTIME_CONFIG_JSON_SECRET=${DRIVE_CANDIDATE_RUNTIME_SECRET}"
          if [[ "$PHONE_DEPLOY_PHASE" == cold ]]; then
            DRIVE_SUBSTITUTIONS=",_BACKEND_RUNTIME_CONFIG_JSON_SECRET=BACKEND_RUNTIME_CONFIG_JSON"
          fi
          DRIVE_SUBSTITUTIONS+=",_PHONE_DEPLOY_PHASE=${PHONE_DEPLOY_PHASE},_GITHUB_RUN_ATTEMPT=${{ github.run_attempt }}"
          DRIVE_SUBSTITUTIONS+=",_AUTH_PHONE_RECOVERY_ENABLED=${{ steps.phone-rollback-plan.outputs.recovery_enabled }},_WORKOS_SSO_ENABLED=false,_PHONE_ROLLBACK_SHA=${{ steps.phone-rollback-plan.outputs.fallback_sha }},_PHONE_ROLLBACK_IMAGE_REFERENCE=${{ steps.phone-rollback-plan.outputs.fallback_image }}"
          if grep -Fq '${_PROTECTED_DOCUMENT_DELIVERY_ENABLED}' deploy/backend.cloudbuild.yaml; then
            DRIVE_SUBSTITUTIONS+=",_PROTECTED_DOCUMENT_DELIVERY_ENABLED=${{ steps.document-mode.outputs.enabled || 'false' }}"
          fi
          DRIVE_SUBSTITUTIONS+=",_CURATED_CONNECTOR_SECRETS=${{ steps.prod-curated-secrets.outputs.names }}"
          DRIVE_SUBSTITUTIONS+=",_STRIPE_CONNECT_WEBHOOK_SECRET_SECRET=STRIPE_CONNECT_WEBHOOK_SECRET"
          DRIVE_SUBSTITUTIONS+=",_PKM_ANSWER_REQUESTS_ENABLED=${{ vars.PKM_ANSWER_REQUESTS_PROD_ENABLED || 'true' }},_PKM_ANSWER_PAYMENTS_ENABLED=${{ vars.PKM_ANSWER_PAYMENTS_PROD_ENABLED || 'false' }},_PKM_ANSWER_COMPOSER_ENABLED=${{ vars.PKM_ANSWER_COMPOSER_PROD_ENABLED || 'false' }},_PKM_ANSWER_LIVE_PROVIDER_REVIEWED=${{ vars.PKM_ANSWER_LIVE_PROVIDER_PROD_REVIEWED || 'false' }},_PKM_ANSWER_STRIPE_MODE=live,_PKM_ANSWER_STRIPE_SECRET_KEY_SECRET=STRIPE_SECRET_KEY,_PKM_ANSWER_STRIPE_WEBHOOK_SECRET_SECRET=STRIPE_WEBHOOK_SECRET,_PKM_ANSWER_STRIPE_TEST_SECRET_KEY_SECRET=${{ vars.PKM_ANSWER_STRIPE_TEST_SECRET_KEY_PROD_SECRET || '' }},_PKM_ANSWER_STRIPE_TEST_WEBHOOK_SECRET_SECRET=${{ vars.PKM_ANSWER_STRIPE_TEST_WEBHOOK_SECRET_PROD_SECRET || '' }},_PKM_ANSWER_STRIPE_LIVE_SECRET_KEY_SECRET=${{ vars.PKM_ANSWER_STRIPE_LIVE_SECRET_KEY_PROD_SECRET || '' }},_PKM_ANSWER_STRIPE_LIVE_WEBHOOK_SECRET_SECRET=${{ vars.PKM_ANSWER_STRIPE_LIVE_WEBHOOK_SECRET_PROD_SECRET || '' }},_ANSWER_WORK_DRAIN_ENABLED=${{ vars.ANSWER_WORK_DRAIN_PROD_ENABLED || 'false' }},_ANSWER_WORK_DRAIN_AUDIENCE=https://api.hushh.ai"
          DRIVE_SUBSTITUTIONS+=",_GMAIL_PERSONAL_INFORMATION_REQUEST_MONITOR_AUTH_ENABLED=true,_GMAIL_PERSONAL_INFORMATION_REQUEST_MONITOR_AUDIENCE=${{ env.CONSENT_API_PUBLIC_ORIGIN }},_GMAIL_PERSONAL_INFORMATION_REQUEST_MONITOR_SERVICE_ACCOUNT_EMAIL=${{ env.GMAIL_PERSONAL_INFORMATION_REQUEST_MONITOR_SCHEDULER_SERVICE_ACCOUNT_ID }}@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com"
          if [ "${{ steps.drive-mode.outputs.active }}" = "true" ] || [ "${{ steps.document-mode.outputs.configured }}" = "true" ]; then
            DRIVE_SUBSTITUTIONS+=",_GOOGLE_DRIVE_OAUTH_CLIENT_ID_SECRET=GOOGLE_DRIVE_OAUTH_CLIENT_ID,_GOOGLE_DRIVE_OAUTH_CLIENT_SECRET_SECRET=GOOGLE_DRIVE_OAUTH_CLIENT_SECRET,_GOOGLE_DRIVE_PICKER_API_KEY_SECRET=GOOGLE_DRIVE_PICKER_API_KEY,_EXTERNAL_CONNECTOR_CREDENTIAL_KEY_SECRET=EXTERNAL_CONNECTOR_CREDENTIAL_KEY,_DRIVE_DOCUMENT_KEY_V1_SECRET=DRIVE_DOCUMENT_KEY_V1,_DRIVE_SHARING_KEY_V1_SECRET=DRIVE_SHARING_KEY_V1,_DRIVE_WORK_DRAIN_ENABLED=true,_DRIVE_WORK_DRAIN_SCHEDULER_PROJECT_ID=hushh-pda,_DRIVE_WORK_DRAIN_SCHEDULER_SERVICE_ACCOUNT_EMAIL=drive-work-drain-sched@hushh-pda.iam.gserviceaccount.com,_DRIVE_WORK_DRAIN_SCHEDULER_AUDIENCE=https://api.hushh.ai"
          elif [ "${{ steps.prod-curated-secrets.outputs.enabled }}" = "true" ]; then
            DRIVE_SUBSTITUTIONS+=",_EXTERNAL_CONNECTOR_CREDENTIAL_KEY_SECRET=EXTERNAL_CONNECTOR_CREDENTIAL_KEY"
          fi
          # Same sizing as UAT: two gunicorn workers plus the E5 query leaf
          # outgrow the 1Gi default, and an out-of-memory kill drops every
          # chat stream on the instance mid-turn (measured 2026-09-27).
          # Payment rollout is explicitly off until production Drive parity,
          # live Stripe keys, the webhook endpoint, and acceptance are ready.
          # Keep credentials bound after switch-off for existing paid requests.
          gcloud builds submit \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --config=deploy/backend.cloudbuild.yaml \
            "--substitutions=$(python3 scripts/ops/managed_ai_config.py --environment production --format substitutions | sed 's/##/,/g'),_BACKEND_SERVICE=${{ env.BACKEND_SERVICE }},_REGION=${{ env.GCP_REGION }},_CLOUDSQL_INSTANCES=${{ env.PROD_CLOUDSQL_INSTANCE }},_PLAID_CLIENT_ID_SECRET=PLAID_CLIENT_ID,_PLAID_SECRET_SECRET=PLAID_SECRET,_PLAID_ACCESS_TOKEN_KEY_SECRET=PLAID_ACCESS_TOKEN_KEY,_FINNHUB_API_KEY_SECRET=FINNHUB_API_KEY,_PMP_API_KEY_SECRET=PMP_API_KEY,_NEWSAPI_KEY_SECRET=NEWSAPI_KEY,_GMAIL_OAUTH_CLIENT_ID_SECRET=GMAIL_OAUTH_CLIENT_ID,_GMAIL_OAUTH_CLIENT_SECRET_SECRET=GMAIL_OAUTH_CLIENT_SECRET,_GMAIL_OAUTH_REDIRECT_URI_SECRET=GMAIL_OAUTH_REDIRECT_URI,_GMAIL_OAUTH_TOKEN_KEY_SECRET=GMAIL_OAUTH_TOKEN_KEY,_GOOGLE_OAUTH_CLIENT_ID_SECRET=GOOGLE_OAUTH_CLIENT_ID,_GOOGLE_OAUTH_CLIENT_SECRET_SECRET=GOOGLE_OAUTH_CLIENT_SECRET,_GOOGLE_OAUTH_REDIRECT_URI_SECRET=GOOGLE_OAUTH_REDIRECT_URI,_GOOGLE_OAUTH_TOKEN_KEY_SECRET=GOOGLE_OAUTH_TOKEN_KEY,_OPENAI_API_KEY_SECRET=OPENAI_API_KEY,_GOOGLE_MAPS_API_KEY_SECRET=GOOGLE_MAPS_API_KEY,_HUSHH_DEVELOPER_TOKEN_SECRET=HUSHH_DEVELOPER_TOKEN,_HUSHH_PROD_PHONE_TEST_NUMBERS_SECRET=HUSHH_PROD_PHONE_TEST_NUMBERS,_HUSHH_PROD_PHONE_TEST_CODE_SECRET=HUSHH_PROD_PHONE_TEST_CODE,_HUSHH_PROD_PHONE_TEST_CHALLENGE_SECRET_SECRET=HUSHH_PROD_PHONE_TEST_CHALLENGE_SECRET,_HUSHH_PROD_PHONE_TEST_ENABLED=true,_KAI_ANALYZE_DURABLE_RUN_STORE=true,_RIA_INTELLIGENCE_VERIFY_BASE_URL_SECRET=RIA_INTELLIGENCE_VERIFY_BASE_URL,_CONSENT_API_PUBLIC_ORIGIN=${{ env.CONSENT_API_PUBLIC_ORIGIN }},_CONSENT_WEB_FALLBACK_ENABLED=false,_CONSENT_SSE_ENABLED=false,_DB_POOL_MIN_SIZE=1,_DB_POOL_MAX_SIZE=4,_DB_SQLALCHEMY_POOL_SIZE=4,_DB_SQLALCHEMY_MAX_OVERFLOW=0,_CLOUD_RUN_CPU=2,_CLOUD_RUN_MEMORY=4Gi,_CLOUD_RUN_CONCURRENCY=20,_CLOUD_RUN_MIN_INSTANCES=1,_CLOUD_RUN_MAX_INSTANCES=5,_CLOUD_RUN_NO_TRAFFIC=true,_VERIFY_MANAGED_VERTEX_RUNTIME=true,_IMAGE_TAG=prod-${{ github.event.inputs.sha }},_ONE_WALLET_CARD_ENABLED=true,_WALLET_PASS_PROVIDER=service,_WALLET_API_KEY_SECRET=WALLET_API_KEY,_ONE_VOICE_LIVE_ENABLED=true,_DEPLOY_ENV=production,_DEPLOY_SOURCE=deploy-production,_DEPLOY_SHA=${{ github.event.inputs.sha }},_GITHUB_RUN_ID=${{ github.run_id }},_RUNTIME_SERVICE_ACCOUNT=${{ env.RUNTIME_SERVICE_ACCOUNT }},_SKIP_IMAGE_BUILD=true,_IMAGE_REFERENCE=${{ steps.build-backend-image.outputs.image_reference }},_CLOUD_RUN_TAG=account-deletion-${{ github.run_id }},_ACCOUNT_DELETION_CLEANUP_AUDIENCE=${{ env.CONSENT_API_PUBLIC_ORIGIN }},_ACCOUNT_DELETION_CLEANUP_SERVICE_ACCOUNT_EMAIL=${{ env.ACCOUNT_DELETION_SCHEDULER_SERVICE_ACCOUNT_ID }}@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com,_DRIVE_REQUEST_PAYMENTS_ENABLED=${{ vars.DRIVE_REQUEST_PAYMENTS_PROD_ENABLED || 'false' }},_STRIPE_SECRET_KEY_SECRET=STRIPE_SECRET_KEY,_STRIPE_WEBHOOK_SECRET_SECRET=STRIPE_WEBHOOK_SECRET${DRIVE_SUBSTITUTIONS}"

      - name: Revalidate actual phone rollback after backend deployment attempt
        id: phone-rollback-qualified
        if: always() && steps.phone-rollback-plan.outcome == 'success' && steps.deploy-backend.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 deploy/phone/plan.py verify --run-id "${{ github.run_id }}" \
            --primary-sha "${{ inputs.sha }}" --plan /tmp/phone-rollback/plan.json \
            --output /tmp/phone-rollback/qualified.json --github-output "$GITHUB_OUTPUT"
          "${{ env.PROTOCOL_PYTHON }}" deploy/phone/workos_rollout.py \
            --project "${{ env.GCP_PROJECT_ID }}" --output /tmp/phone-rollback/workos-after.json
          if [ "${{ steps.document-mode.outputs.configured }}" = "true" ]; then
            "${{ env.PROTOCOL_PYTHON }}" deploy/drive/resolve_protected_document_release.py \
              --project "${{ env.GCP_PROJECT_ID }}" --environment production \
              --required-ancestor "$(cat "${RUNNER_TEMP}/release-tools/protected-document-reader-commit")" \
              --rollback-report /tmp/prod-document-reader-compatibility.json \
              --rebind-backend-report /tmp/phone-rollback/qualified.json
          fi

      - name: Write cold phone qualification checkpoint
        id: cold-checkpoint
        if: env.PHONE_DEPLOY_PHASE == 'cold' && steps.deploy-backend.outcome == 'success' && steps.phone-rollback-qualified.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 deploy/phone/bootstrap.py checkpoint \
            --plan /tmp/phone-rollback/plan.json --before /tmp/prod-backend-predeploy-service.json \
            --before-iam /tmp/prod-backend-predeploy-iam.json --output /tmp/phone-rollback/bootstrap.json

      - name: Retire initial cold health-tag lease
        id: cold-lease-cleanup
        if: always() && env.PHONE_DEPLOY_PHASE == 'cold' && steps.cold-lease.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_COMPLETED: ${{ steps.deploy-backend.outcome == 'success' && 'true' || 'false' }}
        run: |
          python3 deploy/phone/bootstrap.py cleanup --lease-state /tmp/phone-rollback/initial-lease.json \
            --output /tmp/phone-rollback/bootstrap.json --completed "$DEPLOY_COMPLETED"

      - name: Publish cold health-tag reconciliation evidence
        id: cold-lease-evidence
        if: always() && env.PHONE_DEPLOY_PHASE == 'cold' && steps.cold-lease.outcome != 'skipped'
        uses: actions/upload-artifact@v6
        with:
          name: prod-phone-health-lease-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/phone-rollback/initial-lease.json
          if-no-files-found: error
          retention-days: 30

      - name: Qualify final cold installed-schema proof
        id: cold-schema-final
        if: env.PHONE_DEPLOY_PHASE == 'cold' && steps.cold-lease-cleanup.outcome == 'success' && steps.cold-checkpoint.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          "${{ env.PROTOCOL_PYTHON }}" deploy/phone/schema_qualification.py final \
            --plan /tmp/phone-rollback/plan.json --baseline /tmp/phone-rollback/schema-preflight.json \
            --guard /tmp/db-migration-guard-report.json --backup /tmp/backup-posture-report.json \
            --manifest /tmp/prod-migration-release-manifest.json --observe /tmp/phone-rollback/schema-observe.json \
            --checkpoint /tmp/phone-rollback/bootstrap.json --primary-image "${{ steps.build-backend-image.outputs.image_reference }}" \
            --output /tmp/phone-rollback/schema-qualified.json

      - name: Publish cold installed-schema proof
        id: cold-schema-upload
        if: env.PHONE_DEPLOY_PHASE == 'cold' && steps.cold-schema-final.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: prod-phone-schema-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/phone-rollback/schema-qualified.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload cold phone qualification checkpoint
        id: cold-checkpoint-upload
        if: env.PHONE_DEPLOY_PHASE == 'cold' && steps.cold-checkpoint.outcome == 'success' && steps.cold-lease-cleanup.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: prod-phone-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/phone-rollback/bootstrap.json
          if-no-files-found: error
          retention-days: 30

      - name: Seal operational backend proof
        id: cold-operational-proof
        if: env.PHONE_DEPLOY_PHASE == 'cold' && steps.cold-schema-upload.outcome == 'success' && steps.cold-checkpoint-upload.outcome == 'success'
        run: |
          set -euo pipefail
          documents=()
          if [[ -f /tmp/prod-document-reader-compatibility.json ]]; then
            documents=(--document-report /tmp/prod-document-reader-compatibility.json)
          fi
          python3 scripts/ci/production_backend_successor_proof.py \
            --checkpoint /tmp/phone-rollback/bootstrap.json \
            --installed-schema /tmp/phone-rollback/schema-qualified.json \
            --document-mode /tmp/prod-protected-document-release.json \
            --primary-image "${{ steps.build-backend-image.outputs.image_reference }}" \
            --output /tmp/phone-rollback/operational-backend.json "${documents[@]}"

      - name: Publish operational backend proof
        id: cold-operational-upload
        if: env.PHONE_DEPLOY_PHASE == 'cold' && steps.cold-operational-proof.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: prod-phone-operational-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/phone-rollback/operational-backend.json
          if-no-files-found: error
          retention-days: 30

      - name: Require published cold qualification checkpoint
        if: always() && env.PHONE_DEPLOY_PHASE == 'cold'
        env:
          CHECKPOINT_OUTCOME: ${{ steps.cold-checkpoint.outcome }}
          UPLOAD_OUTCOME: ${{ steps.cold-checkpoint-upload.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cold-lease-cleanup.outcome }}
          EVIDENCE_OUTCOME: ${{ steps.cold-lease-evidence.outcome }}
          SCHEMA_OUTCOME: ${{ steps.cold-schema-upload.outcome }}
          OPERATIONAL_OUTCOME: ${{ steps.cold-operational-upload.outcome }}
        run: |
          [[ "$CHECKPOINT_OUTCOME" == success && "$UPLOAD_OUTCOME" == success && "$CLEANUP_OUTCOME" == success && "$EVIDENCE_OUTCOME" == success && "$SCHEMA_OUTCOME" == success && "$OPERATIONAL_OUTCOME" == success ]] || exit 1
          echo "Cold runtime, installed schema and protected reader proofs joined. Operational reference publication, drainage, worker and production activation remain pending. This phase leaves serving traffic and producer fences unchanged." >> "$GITHUB_STEP_SUMMARY"

      - name: Get backend URL
        if: env.PHONE_DEPLOY_PHASE != 'cold' && (steps.scope.outputs.deploy_backend == 'true')
        id: backend-url
        run: |
          BACKEND_URL=$(gcloud run services describe ${{ env.BACKEND_SERVICE }} \
            --project=${{ env.GCP_PROJECT_ID }} \
            --region=${{ env.GCP_REGION }} \
            --format='value(status.url)')
          echo "url=$BACKEND_URL" >> $GITHUB_OUTPUT
          echo "Backend URL: $BACKEND_URL"

      - name: Resolve backend candidate revision
        id: backend-candidate-state
        if: env.PHONE_DEPLOY_PHASE != 'cold' && (steps.scope.outputs.deploy_backend == 'true')
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "${{ env.BACKEND_SERVICE }}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --region="${{ env.GCP_REGION }}" \
            --format=json > /tmp/prod-backend-candidate-service.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          service = json.loads(
              Path("/tmp/prod-backend-candidate-service.json").read_text(encoding="utf-8")
          )
          status = service.get("status") or {}
          revision = str(status.get("latestCreatedRevisionName") or "").strip()
          expected_tag = f"account-deletion-{os.environ['GITHUB_RUN_ID']}"
          tagged = [
              entry
              for entry in (status.get("traffic") or [])
              if isinstance(entry, dict) and entry.get("tag") == expected_tag
          ]
          if not revision or len(tagged) != 1:
              raise SystemExit("Backend candidate revision/tag could not be resolved uniquely")
          tagged_revision = str(tagged[0].get("revisionName") or revision).strip()
          candidate_url = str(tagged[0].get("url") or "").strip()
          if tagged_revision != revision or not candidate_url.startswith("https://"):
              raise SystemExit("Backend candidate tag does not resolve to the latest created revision")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"backend_revision={revision}\n")
              output.write(f"backend_candidate_url={candidate_url}\n")
          PY

      - name: Verify backend candidate readiness and exact-SHA provenance
        if: env.PHONE_DEPLOY_PHASE != 'cold' && (steps.scope.outputs.deploy_backend == 'true')
        shell: bash
        env:
          BACKEND_REVISION: ${{ steps.backend-candidate-state.outputs.backend_revision }}
          BACKEND_CANDIDATE_URL: ${{ steps.backend-candidate-state.outputs.backend_candidate_url }}
          EXPECTED_SHA: ${{ github.event.inputs.sha }}
          EXPECTED_IMAGE_REFERENCE: ${{ steps.build-backend-image.outputs.image_reference }}
          DRIVE_ENABLED: ${{ steps.drive-mode.outputs.active }}
          DOCUMENT_DELIVERY_CONFIGURED: ${{ steps.document-mode.outputs.configured }}
          DRIVE_CANDIDATE_RUNTIME_SECRET: ${{ env.DRIVE_CANDIDATE_RUNTIME_SECRET }}
        run: |
          set -euo pipefail
          gcloud run revisions describe "${BACKEND_REVISION}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --region="${{ env.GCP_REGION }}" \
            --format=json > /tmp/prod-backend-candidate.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          revision = json.loads(
              Path("/tmp/prod-backend-candidate.json").read_text(encoding="utf-8")
          )
          expected_revision = os.environ["BACKEND_REVISION"]
          expected_sha = os.environ["EXPECTED_SHA"]
          expected_image_reference = os.environ["EXPECTED_IMAGE_REFERENCE"]
          metadata = revision.get("metadata") or {}
          labels = metadata.get("labels") or {}
          containers = (revision.get("spec") or {}).get("containers") or []
          env = {
              str(item.get("name") or ""): str(item.get("value") or "")
              for container in containers
              if isinstance(container, dict)
              for item in (container.get("env") or [])
              if isinstance(item, dict) and "value" in item
          }
          secret_refs = {
              str(item.get("name") or ""): str(
                  ((item.get("valueFrom") or {}).get("secretKeyRef") or {}).get("name") or ""
              )
              for container in containers
              if isinstance(container, dict)
              for item in (container.get("env") or [])
              if isinstance(item, dict)
          }
          expected_runtime_secret = os.environ["DRIVE_CANDIDATE_RUNTIME_SECRET"]
          ready = any(
              condition.get("type") == "Ready" and str(condition.get("status")).lower() == "true"
              for condition in ((revision.get("status") or {}).get("conditions") or [])
              if isinstance(condition, dict)
          )
          checks = {
              "revision": metadata.get("name") == expected_revision,
              "ready": ready,
              "label_sha": labels.get("deploy-sha") == expected_sha,
              "label_environment": labels.get("deploy-env") == "production",
              "label_source": labels.get("deploy-source") == "deploy-production",
              "lifecycle_contract": labels.get("account-deletion-contract") == "v201",
              "immutable_image": bool(containers)
              and containers[0].get("image") == expected_image_reference,
              "env_sha": env.get("HUSHH_DEPLOY_SHA") == expected_sha,
              "env_environment": env.get("HUSHH_DEPLOY_ENV") == "production",
              "env_source": env.get("HUSHH_DEPLOY_SOURCE") == "deploy-production",
              "env_run": env.get("HUSHH_DEPLOY_RUN_ID") == os.environ["GITHUB_RUN_ID"],
              "isolated_runtime_config": secret_refs.get("BACKEND_RUNTIME_CONFIG_JSON")
              == expected_runtime_secret,
              "gmail_monitor_oidc_required": env.get(
                  "GMAIL_PERSONAL_INFORMATION_REQUEST_MONITOR_AUTH_ENABLED"
              ) == "true",
              "gmail_monitor_audience": env.get(
                  "GMAIL_PERSONAL_INFORMATION_REQUEST_MONITOR_AUDIENCE"
              ) == "https://api.hushh.ai",
              "gmail_monitor_service_account": env.get(
                  "GMAIL_PERSONAL_INFORMATION_REQUEST_MONITOR_SERVICE_ACCOUNT_EMAIL"
              ) == "gmail-personal-monitor-sched@hushh-pda.iam.gserviceaccount.com",
          }
          if os.environ.get("DOCUMENT_DELIVERY_CONFIGURED") == "true":
              checks["hosted_provider_and_custody_refs"] = all(
                  secret_refs.get(name) == name for name in (
                      "GOOGLE_DRIVE_OAUTH_CLIENT_ID", "GOOGLE_DRIVE_OAUTH_CLIENT_SECRET",
                      "GOOGLE_DRIVE_PICKER_API_KEY", "EXTERNAL_CONNECTOR_CREDENTIAL_KEY",
                      "DRIVE_DOCUMENT_KEY_V1", "DRIVE_SHARING_KEY_V1",
                      "STRIPE_SECRET_KEY", "STRIPE_WEBHOOK_SECRET",
                  )
              )
          report = {
              "status": "ready" if all(checks.values()) else "blocked",
              "revision": expected_revision,
              "checks": checks,
          }
          Path("/tmp/prod-backend-candidate-readiness.json").write_text(
              json.dumps(report, indent=2, sort_keys=True), encoding="utf-8"
          )
          if not all(checks.values()):
              raise SystemExit("Backend candidate readiness/provenance gate failed")
          PY
          candidate_health_ok=false
          for _attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 15 \
              "${BACKEND_CANDIDATE_URL%/}/health" \
              > /tmp/prod-backend-candidate-health.json; then
              candidate_health_ok=true
              break
            fi
            sleep 3
          done
          if [ "${candidate_health_ok}" != "true" ]; then
            echo "Backend candidate tagged health probe failed." >&2
            exit 1
          fi

      - name: Wait for frontend image and pin its digest
        id: build-frontend-image
        if: env.PHONE_DEPLOY_PHASE != 'cold' && (steps.scope.outputs.deploy_frontend == 'true' && steps.start-frontend-image-build.outputs.prebuilt == 'true')
        shell: bash
        env:
          FRONTEND_IMAGE_BUILD_ID: ${{ steps.start-frontend-image-build.outputs.build_id }}
          FRONTEND_IMAGE_TAG: ${{ steps.start-frontend-image-build.outputs.image_tag }}
        run: |
          set -euo pipefail
          started_at="$(date +%s)"
          image_repository="gcr.io/${{ env.GCP_PROJECT_ID }}/hushh-webapp"
          image_reference="$(bash scripts/ci/await-prebuilt-image.sh \
            --project "${{ env.GCP_PROJECT_ID }}" \
            --build-id "${FRONTEND_IMAGE_BUILD_ID}" \
            --image-repository "${image_repository}" \
            --image-tag "${FRONTEND_IMAGE_TAG}" \
            --sha "${{ github.event.inputs.sha }}" \
            --manifest-json /tmp/prod-frontend-image-manifest.json \
            --json-output /tmp/prod-frontend-image.json)"
          if [[ ! "${image_reference}" =~ ^gcr\.io/${{ env.GCP_PROJECT_ID }}/hushh-webapp@sha256:[0-9a-f]{64}$ ]]; then
            echo "Frontend image did not pin to an immutable sha256 digest." >&2
            exit 1
          fi
          echo "image_reference=${image_reference}" >> "$GITHUB_OUTPUT"
          echo "wait_seconds=$(( $(date +%s) - started_at ))" >> "$GITHUB_OUTPUT"

      - name: Deploy frontend using Cloud Build
        id: deploy-frontend
        if: env.PHONE_DEPLOY_PHASE != 'cold' && (steps.scope.outputs.deploy_frontend == 'true')
        shell: bash
        env:
          FRONTEND_PREBUILT: ${{ steps.start-frontend-image-build.outputs.prebuilt }}
          FRONTEND_IMAGE_REFERENCE: ${{ steps.build-frontend-image.outputs.image_reference }}
          FRONTEND_BUILD_SUBSTITUTIONS: ${{ steps.start-frontend-image-build.outputs.build_substitutions }}
        run: |
          set -euo pipefail
          SUBSTITUTIONS="_FRONTEND_SERVICE=${{ env.FRONTEND_SERVICE }},_REGION=${{ env.GCP_REGION }},_CLOUD_RUN_NO_TRAFFIC=true,_CLOUD_RUN_TIMEOUT_SECONDS=300,_DEPLOY_SOURCE=deploy-production,_DEPLOY_SHA=${{ github.event.inputs.sha }},_GITHUB_RUN_ID=${{ github.run_id }},_GITHUB_RUN_ATTEMPT=${{ github.run_attempt }}"
          if [ -z "${FRONTEND_BUILD_SUBSTITUTIONS}" ]; then
            echo "Refusing frontend deploy: the frontend build substitutions were not resolved." >&2
            exit 1
          fi
          SUBSTITUTIONS="${SUBSTITUTIONS},${FRONTEND_BUILD_SUBSTITUTIONS}"
          source_arg="."
          case "${FRONTEND_PREBUILT}" in
            true)
              # Deploy exactly the digest pinned above; never rebuild or re-resolve a tag.
              if [[ ! "${FRONTEND_IMAGE_REFERENCE}" =~ ^gcr\.io/${{ env.GCP_PROJECT_ID }}/hushh-webapp@sha256:[0-9a-f]{64}$ ]]; then
                echo "Refusing frontend deploy: the pinned image digest is missing or malformed." >&2
                exit 1
              fi
              SUBSTITUTIONS="${SUBSTITUTIONS},_SKIP_IMAGE_BUILD=true,_IMAGE_REFERENCE=${FRONTEND_IMAGE_REFERENCE}"
              # Deploy-only: nothing in the build context is read, so skip the upload.
              source_arg="--no-source"
              ;;
            false)
              echo "Combined build-and-deploy for a SHA that predates the prebuilt frontend image."
              ;;
            *)
              echo "Refusing frontend deploy: prebuilt-image mode was not resolved." >&2
              exit 1
              ;;
          esac
          gcloud builds submit "${source_arg}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --config=deploy/frontend.cloudbuild.yaml \
            "--substitutions=${SUBSTITUTIONS}"

      - name: Get frontend URL
        if: env.PHONE_DEPLOY_PHASE != 'cold' && (steps.scope.outputs.deploy_frontend == 'true')
        id: frontend-url
        run: |
          FRONTEND_ORIGIN=$(gcloud run services describe ${{ env.FRONTEND_SERVICE }} \
            --project=${{ env.GCP_PROJECT_ID }} \
            --region=${{ env.GCP_REGION }} \
            --format='value(status.url)')
          echo "url=$FRONTEND_ORIGIN" >> $GITHUB_OUTPUT
          echo "Frontend URL: $FRONTEND_ORIGIN"

      - name: Resolve deployed candidate revisions
        if: env.PHONE_DEPLOY_PHASE != 'cold'
        id: candidate-state
        shell: bash
        run: |
          set -euo pipefail
          backend_revision=""
          frontend_revision=""
          if [ "${{ steps.scope.outputs.deploy_backend }}" = "true" ]; then
            # Promote exactly the tagged, digest-pinned, readiness-proven
            # candidate, never whatever revision happens to be latest now.
            backend_revision="${{ steps.backend-candidate-state.outputs.backend_revision }}"
            if [ -z "${backend_revision}" ]; then
              echo "Backend candidate revision was not resolved." >&2
              exit 1
            fi
          fi
          if [ "${{ steps.scope.outputs.deploy_frontend }}" = "true" ]; then
            gcloud run revisions list \
              --service="${{ env.FRONTEND_SERVICE }}" \
              --project="${{ env.GCP_PROJECT_ID }}" \
              --region="${{ env.GCP_REGION }}" \
              --format=json > /tmp/prod-frontend-deploy-revisions.json
            frontend_revision="$(python3 "${RUNNER_TEMP}/release-tools/resolve-cloud-run-deploy-revision.py" \
              --revisions-json /tmp/prod-frontend-deploy-revisions.json \
              --deploy-env production \
              --deploy-source deploy-production \
              --deploy-sha "${{ github.event.inputs.sha }}" \
              --github-run-id "${{ github.run_id }}" \
              --github-run-attempt "${{ github.run_attempt }}")"
          fi
          echo "backend_revision=${backend_revision}" >> "$GITHUB_OUTPUT"
          echo "frontend_revision=${frontend_revision}" >> "$GITHUB_OUTPUT"
          echo "Backend candidate revision: ${backend_revision:-n/a}"
          echo "Frontend candidate revision: ${frontend_revision:-n/a}"

      - name: Verify frontend candidate runs the pinned image digest
        if: env.PHONE_DEPLOY_PHASE != 'cold' && (steps.scope.outputs.deploy_frontend == 'true' && steps.start-frontend-image-build.outputs.prebuilt == 'true')
        shell: bash
        env:
          FRONTEND_REVISION: ${{ steps.candidate-state.outputs.frontend_revision }}
          EXPECTED_IMAGE_REFERENCE: ${{ steps.build-frontend-image.outputs.image_reference }}
        run: |
          set -euo pipefail
          deployed_image="$(gcloud run revisions describe "${FRONTEND_REVISION}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --region="${{ env.GCP_REGION }}" \
            --format='value(spec.containers[0].image)')"
          if [ -z "${EXPECTED_IMAGE_REFERENCE}" ] || [ "${deployed_image}" != "${EXPECTED_IMAGE_REFERENCE}" ]; then
            echo "Frontend candidate ${FRONTEND_REVISION} runs '${deployed_image}', not the pinned '${EXPECTED_IMAGE_REFERENCE}'." >&2
            exit 1
          fi
          echo "Frontend candidate ${FRONTEND_REVISION} runs the pinned image ${deployed_image}."

      - name: Verify backend candidate runtime identity
        if: env.PHONE_DEPLOY_PHASE != 'cold' && (steps.scope.outputs.deploy_backend == 'true')
        run: >-
          bash scripts/ci/assert-cloud-run-runtime-identity.sh
          "${{ env.GCP_PROJECT_ID }}"
          "${{ env.GCP_REGION }}"
          "${{ steps.candidate-state.outputs.backend_revision }}"
          "${{ env.RUNTIME_SERVICE_ACCOUNT }}"

      - name: Verify protected list secrets were not wiped
        if: env.PHONE_DEPLOY_PHASE != 'cold'
        shell: bash
        run: |
          # `gcloud secrets versions add` REPLACES the whole value, so one write
          # that skips the read deletes every other entry with no error.
          # HUSHH_PROD_PHONE_TEST_NUMBERS holds 40 numbers under exactly the
          # exposure that took the UAT list from 59 to 1 on 2026-09-03. Never
          # ship on top of destroyed configuration. See R36.
          python3 scripts/ops/verify_secret_list_invariants.py \
            --project "${{ env.GCP_PROJECT_ID }}"

      - name: Qualify production CRM availability
        id: crm-availability
        if: env.PHONE_DEPLOY_PHASE != 'cold' && (steps.scope.outputs.deploy_backend == 'true' || steps.scope.outputs.deploy_frontend == 'true')
        env:
          TARGET_SHA: ${{ github.event.inputs.sha }}
        run: |
          python3 - <<'PY'
          import json, os, runpy
          from pathlib import Path
          authority = runpy.run_path("consent-protocol/hushh_mcp/services/crm_product_availability.py")
          available = authority["crm_product_available"](environment="production")
          assert type(available) is bool
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"required={str(available).lower()}\n")
          Path("/tmp/prod-connected-systems-availability.json").write_text(json.dumps({
              "environment": "production", "sha": os.environ["TARGET_SHA"],
              "available": available,
              "status": "required" if available else "not_applicable_product_paused",
              "transport_verified": False,
          }))
          PY

      - name: Verify production candidate runtime env parity
        id: verify-parity
        if: env.PHONE_DEPLOY_PHASE != 'cold' && (steps.scope.outputs.deploy_backend == 'true' || steps.scope.outputs.deploy_frontend == 'true')
        continue-on-error: true
        env:
          CRM_REQUIRED: ${{ steps.crm-availability.outputs.required }}
        run: |
          set -euo pipefail
          connected_systems=()
          case "$CRM_REQUIRED" in
            true) connected_systems=(--require-connected-systems) ;;
            false) ;;
            *) echo "CRM availability was not qualified." >&2; exit 1 ;;
          esac
          python3 scripts/ops/verify-env-secrets-parity.py \
            --project "${{ env.GCP_PROJECT_ID }}" \
            --region "${{ env.GCP_REGION }}" \
            --backend-service "${{ env.BACKEND_SERVICE }}" \
            --frontend-service "${{ env.FRONTEND_SERVICE }}" \
            --backend-revision "${{ steps.candidate-state.outputs.backend_revision }}" \
            --frontend-revision "${{ steps.candidate-state.outputs.frontend_revision }}" \
            --require-plaid \
            --require-market-data \
            --require-gmail \
            --require-calendar \
            "${connected_systems[@]}" \
            --require-prod-phone-test \
            --assert-runtime-env-contract \
            --report-path /tmp/prod-runtime-parity.json

      - name: Verify production Connected Systems Omni Gateway
        id: verify-connected-systems
        if: env.PHONE_DEPLOY_PHASE != 'cold' && (steps.scope.outputs.deploy_backend == 'true' && steps.verify-parity.outcome == 'success')
        continue-on-error: true
        env:
          CRM_REQUIRED: ${{ steps.crm-availability.outputs.required }}
        run: |
          set -euo pipefail
          case "$CRM_REQUIRED" in
            false)
              echo "Hosted CRM product is paused; no gateway verification claimed."
              echo "qualification=not_applicable_product_paused" >> "$GITHUB_OUTPUT"
              exit 0 ;;
            true) ;;
            *) echo "CRM availability was not qualified." >&2; exit 1 ;;
          esac
          "${{ env.PROTOCOL_PYTHON }}" scripts/ops/verify_connected_systems_gateway.py \
            --project "${{ env.GCP_PROJECT_ID }}" \
            2>&1 | tee /tmp/prod-connected-systems.log
          echo "qualification=verified" >> "$GITHUB_OUTPUT"

      - name: Prepare retained production Drive worker activation
        id: prepare-staged-worker-activation
        if: steps.staged-worker.outputs.loaded == 'true' && steps.verify-parity.outcome == 'success' && steps.verify-connected-systems.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_REFERENCE: ${{ steps.staged-worker.outputs.image }}
          DEPLOY_SHA: ${{ inputs.sha }}
          CLOUDSQL_INSTANCE: ${{ env.PROD_CLOUDSQL_INSTANCE }}
          RELEASE_RUN_ID: ${{ steps.staged-worker.outputs.run_id }}
          RELEASE_RUN_ATTEMPT: ${{ steps.staged-worker.outputs.attempt }}
          DRIVE_RUNTIME_CONFIG_SECRET: ${{ steps.staged-worker.outputs.config_secret }}
          DRIVE_WORKER_STAGE_RECEIPT: ${{ steps.staged-worker.outputs.receipt }}
          ENABLE_PRODUCTION_DRIVE_LIVE: ${{ steps.drive-mode.outputs.active }}
          PROTECTED_DOCUMENT_MAINTENANCE: ${{ steps.document-mode.outputs.configured }}
          PROTECTED_DOCUMENT_DELIVERY_ENABLED: ${{ steps.document-mode.outputs.enabled || 'false' }}
          DRIVE_WORKER_RELEASE_PHASE: prepare-activation
          PRIMARY_IMAGE: ${{ steps.build-backend-image.outputs.image_reference }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_REFERENCE" = "$PRIMARY_IMAGE" ]] || {
            echo "Primary image differs from the operational qualification and staged worker" >&2; exit 1;
          }
          bash deploy/drive/deploy_worker_service_prod.sh
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          path = Path(os.environ["DRIVE_WORKER_STAGE_RECEIPT"] + ".activation.json")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("sha256=" + hashlib.sha256(path.read_bytes()).hexdigest() + "\n")
          PY

      - name: Publish retained worker activation intent
        id: staged-worker-activation-intent
        if: steps.prepare-staged-worker-activation.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: prod-drive-worker-activation-intent-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.staged-worker.outputs.receipt }}.activation.json
          retention-days: 30
          if-no-files-found: error

      - name: Deploy and attest private production Drive worker
        id: deploy-drive-worker
        if: env.PHONE_DEPLOY_PHASE != 'cold' && ((steps.drive-mode.outputs.active == 'true' || steps.document-mode.outputs.configured == 'true') && steps.scope.outputs.deploy_backend == 'true' && steps.verify-parity.outcome == 'success' && steps.verify-connected-systems.outcome == 'success')
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_REFERENCE: ${{ steps.build-backend-image.outputs.image_reference }}
          DEPLOY_SHA: ${{ github.event.inputs.sha }}
          CLOUDSQL_INSTANCE: ${{ env.PROD_CLOUDSQL_INSTANCE }}
          RELEASE_RUN_ID: ${{ steps.staged-worker.outputs.loaded == 'true' && steps.staged-worker.outputs.run_id || github.run_id }}
          RELEASE_RUN_ATTEMPT: ${{ steps.staged-worker.outputs.loaded == 'true' && steps.staged-worker.outputs.attempt || github.run_attempt }}
          DRIVE_RUNTIME_CONFIG_SECRET: ${{ steps.staged-worker.outputs.loaded == 'true' && steps.staged-worker.outputs.config_secret || env.DRIVE_CANDIDATE_RUNTIME_SECRET }}
          DRIVE_WORKER_STAGE_RECEIPT: ${{ steps.staged-worker.outputs.receipt }}
          DRIVE_WORKER_RELEASE_PHASE: ${{ steps.staged-worker.outputs.loaded == 'true' && 'activate' || 'standard' }}
          DRIVE_WORKER_ACTIVATION_INTENT_SHA256: ${{ steps.prepare-staged-worker-activation.outputs.sha256 }}
          STAGED_WORKER_LOADED: ${{ steps.staged-worker.outputs.loaded }}
          ACTIVATION_UPLOAD: ${{ steps.staged-worker-activation-intent.outcome }}
          ENABLE_PRODUCTION_DRIVE_LIVE: ${{ steps.drive-mode.outputs.active }}
          PROTECTED_DOCUMENT_MAINTENANCE: ${{ steps.document-mode.outputs.configured }}
          PROTECTED_DOCUMENT_DELIVERY_ENABLED: ${{ steps.document-mode.outputs.enabled || 'false' }}
          DRIVE_REQUEST_PAYMENTS_PROD_ENABLED: ${{ vars.DRIVE_REQUEST_PAYMENTS_PROD_ENABLED || 'false' }}
        run: |
          set -euo pipefail
          if [[ "$STAGED_WORKER_LOADED" == true && "$ACTIVATION_UPLOAD" != success ]]; then
            echo "Retained worker activation intent was not published" >&2; exit 1
          fi
          bash deploy/drive/deploy_worker_service_prod.sh

      # New revisions are deployed with --no-traffic (see _CLOUD_RUN_NO_TRAFFIC=true
      # above), so promotion is an explicit, reversible step: shift 100% to the
      # freshly built revision, then health-gate it, then auto-roll-back on failure.
      - name: Promote deployed revisions to production traffic
        id: promote-traffic
        if: env.PHONE_DEPLOY_PHASE != 'cold' && (steps.verify-parity.outcome == 'success' && (steps.scope.outputs.deploy_backend != 'true' || (steps.phone-rollback-qualified.outcome == 'success' && steps.verify-connected-systems.outcome == 'success')) && (steps.scope.outputs.deploy_backend != 'true' || (steps.drive-mode.outputs.active != 'true' && steps.document-mode.outputs.configured != 'true') || steps.deploy-drive-worker.outcome == 'success'))
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.scope.outputs.deploy_backend }}" = "true" ]; then
            gcloud run services update-traffic "${{ env.BACKEND_SERVICE }}" \
              --project="${{ env.GCP_PROJECT_ID }}" \
              --region="${{ env.GCP_REGION }}" \
              --to-revisions="${{ steps.candidate-state.outputs.backend_revision }}=100"
          fi
          if [ "${{ steps.scope.outputs.deploy_frontend }}" = "true" ]; then
            gcloud run services update-traffic "${{ env.FRONTEND_SERVICE }}" \
              --project="${{ env.GCP_PROJECT_ID }}" \
              --region="${{ env.GCP_REGION }}" \
              --to-revisions="${{ steps.candidate-state.outputs.frontend_revision }}=100"
          fi

      - name: Quarantine production Drive jobs after disabling live Drive
        id: pause-drive-worker
        if: env.PHONE_DEPLOY_PHASE != 'cold' && (steps.drive-mode.outputs.active != 'true' && steps.document-mode.outputs.configured != 'true' && steps.scope.outputs.deploy_backend == 'true' && steps.promote-traffic.outcome == 'success')
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          # Never pause jobs while the previous live-Drive backend still serves.
          # Save exact fixed-job state so a failed health gate can restore it.
          snapshot=/tmp/prod-drive-scheduler-before-disable.json
          worker_origin="$(gcloud run services describe consent-protocol-drive-worker \
            --project="${{ env.GCP_PROJECT_ID }}" --region="${{ env.GCP_REGION }}" \
            --format='value(status.url)' 2>/dev/null || true)"
          python3 deploy/drive/work_drain_scheduler_snapshot_prod.py capture \
            --snapshot "${snapshot}" --worker-origin "${worker_origin}"
          echo "snapshot=${snapshot}" >> "${GITHUB_OUTPUT}"
          echo "worker_origin=${worker_origin}" >> "${GITHUB_OUTPUT}"
          python3 deploy/drive/work_drain_scheduler_snapshot_prod.py quarantine

      - name: Verify production backend deployment provenance
        id: verify-backend-provenance
        if: env.PHONE_DEPLOY_PHASE != 'cold' && (steps.scope.outputs.deploy_backend == 'true' && steps.promote-traffic.outcome == 'success')
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          "${{ env.PROTOCOL_PYTHON }}" scripts/ci/verify-cloudrun-revision-provenance.py \
            --project "${{ env.GCP_PROJECT_ID }}" \
            --region "${{ env.GCP_REGION }}" \
            --service "${{ env.BACKEND_SERVICE }}" \
            --expected-env production \
            --expected-source deploy-production \
            --expected-sha "${{ github.event.inputs.sha }}" \
            --expected-run-id "${{ github.run_id }}" \
            --report-path /tmp/prod-backend-provenance.json

      - name: Verify production frontend deployment provenance
        id: verify-frontend-provenance
        if: env.PHONE_DEPLOY_PHASE != 'cold' && (steps.scope.outputs.deploy_frontend == 'true' && steps.promote-traffic.outcome == 'success')
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          "${{ env.PROTOCOL_PYTHON }}" scripts/ci/verify-cloudrun-revision-provenance.py \
            --project "${{ env.GCP_PROJECT_ID }}" \
            --region "${{ env.GCP_REGION }}" \
            --service "${{ env.FRONTEND_SERVICE }}" \
            --expected-env production \
            --expected-source deploy-production \
            --expected-sha "${{ github.event.inputs.sha }}" \
            --expected-run-id "${{ github.run_id }}" \
            --report-path /tmp/prod-frontend-provenance.json

      - name: Post-deploy backend runtime health gate
        id: health-backend
        if: env.PHONE_DEPLOY_PHASE != 'cold' && (steps.scope.outputs.deploy_backend == 'true' && steps.promote-traffic.outcome == 'success')
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          # Require 5 consecutive 200s from /health. A crash-looping revision
          # (passes TCP startup probe, then dies serving requests, flapping
          # 200<->503) can never reach a stable streak, so this fails and the
          # rollback step below reverts traffic to the predeploy revision.
          bash scripts/ci/cloudrun-http-health.sh \
            "${{ steps.backend-url.outputs.url }}" "/health" 5 30 5 200

      - name: Post-deploy frontend runtime health gate
        id: health-frontend
        if: env.PHONE_DEPLOY_PHASE != 'cold' && (steps.scope.outputs.deploy_frontend == 'true' && steps.promote-traffic.outcome == 'success')
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/cloudrun-http-health.sh \
            "${{ steps.frontend-url.outputs.url }}" "/" 3 30 5 200

      - name: Verify production account-session contract
        id: health-account-session-contract
        if: env.PHONE_DEPLOY_PHASE != 'cold' && (steps.promote-traffic.outcome == 'success')
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          # The session-status endpoint is a mandatory cross-service contract for
          # every restored web session. With no bearer token, a compatible backend
          # must reject the request as 401. A 404 proves frontend/backend version
          # skew and must roll the selected release back instead of stranding users
          # behind the fail-closed reconnect screen.
          bash scripts/ci/cloudrun-http-health.sh \
            "${{ env.CONSENT_API_PUBLIC_ORIGIN }}" "/api/account/session-status" 3 30 5 401

      - name: Verify production native passkey domain associations
        id: verify-passkey-associations
        if: env.PHONE_DEPLOY_PHASE != 'cold' && (steps.scope.outputs.deploy_frontend == 'true' && steps.promote-traffic.outcome == 'success')
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ops/verify_passkey_domain_associations.py \
            --project "${{ env.GCP_PROJECT_ID }}" \
            --origin "${{ env.APP_FRONTEND_ORIGIN }}"

      - name: Classify production release outcome
        id: classify
        if: env.PHONE_DEPLOY_PHASE != 'cold' && (always())
        shell: bash
        env:
          FRONTEND_IMAGE_CHECK_OUTCOME: ${{ steps.check-frontend-image.outcome }}
          DEPLOY_BACKEND: ${{ steps.scope.outputs.deploy_backend }}
          DEPLOY_FRONTEND: ${{ steps.scope.outputs.deploy_frontend }}
          HEALTH_BACKEND: ${{ steps.health-backend.outcome }}
          HEALTH_FRONTEND: ${{ steps.health-frontend.outcome }}
          ACCOUNT_SESSION_CONTRACT_OUTCOME: ${{ steps.health-account-session-contract.outcome }}
          PARITY_OUTCOME: ${{ steps.verify-parity.outcome }}
          CONNECTED_SYSTEMS_OUTCOME: ${{ steps.verify-connected-systems.outcome }}
          DRIVE_ENABLED: ${{ steps.drive-mode.outputs.active }}
          DOCUMENT_DELIVERY_CONFIGURED: ${{ steps.document-mode.outputs.configured }}
          DRIVE_WORKER_OUTCOME: ${{ steps.deploy-drive-worker.outcome }}
          DRIVE_PAUSE_OUTCOME: ${{ steps.pause-drive-worker.outcome }}
          DRIVE_PAUSE_SNAPSHOT: ${{ steps.pause-drive-worker.outputs.snapshot }}
          PROMOTE_OUTCOME: ${{ steps.promote-traffic.outcome }}
          BACKEND_PROVENANCE_OUTCOME: ${{ steps.verify-backend-provenance.outcome }}
          FRONTEND_PROVENANCE_OUTCOME: ${{ steps.verify-frontend-provenance.outcome }}
          PASSKEY_ASSOCIATIONS_OUTCOME: ${{ steps.verify-passkey-associations.outcome }}
          UPSTREAM_JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          upstream_failed=false
          backend_failure=false
          frontend_failure=false
          account_session_contract_failed=false
          parity_failed=false
          connected_systems_failed=false
          drive_worker_failed=false
          drive_pause_failed=false
          promote_failed=false
          backend_provenance_failed=false
          frontend_provenance_failed=false
          passkey_associations_failed=false

          # GitHub marks job.status as failure when any earlier non-optional step
          # failed. This catches configuration, authentication, backup, migration,
          # build, and other pre-traffic failures even when their downstream
          # outputs are empty.
          if [ "$UPSTREAM_JOB_STATUS" != "success" ]; then
            upstream_failed=true
          fi

          # Runtime health remains the rollback trigger after promotion. Candidate
          # parity is a pre-traffic gate, so a parity failure leaves serving traffic
          # untouched and fails the release without invoking rollback.
          if [ "$DEPLOY_BACKEND" = "true" ] && [ "$HEALTH_BACKEND" = "failure" ]; then
            backend_failure=true
          fi
          if [ "$DEPLOY_FRONTEND" = "true" ] && [ "$HEALTH_FRONTEND" = "failure" ]; then
            frontend_failure=true
          fi
          if [ "$ACCOUNT_SESSION_CONTRACT_OUTCOME" != "success" ]; then
            account_session_contract_failed=true
            # The compatibility check observes the combined serving pair. Revert
            # every service changed by this release so traffic returns to the
            # previously proven pair.
            if [ "$PROMOTE_OUTCOME" = "success" ] || [ "$PROMOTE_OUTCOME" = "failure" ]; then
              if [ "$DEPLOY_BACKEND" = "true" ]; then backend_failure=true; fi
              if [ "$DEPLOY_FRONTEND" = "true" ]; then frontend_failure=true; fi
            fi
          fi
          if [ "$PARITY_OUTCOME" = "failure" ]; then
            parity_failed=true
          fi
          if [ "$DEPLOY_BACKEND" = "true" ] && [ "$CONNECTED_SYSTEMS_OUTCOME" != "success" ]; then
            connected_systems_failed=true
          fi
          if [ "$DEPLOY_BACKEND" = "true" ] && [ "$PARITY_OUTCOME" = "success" ] \
             && [ "$CONNECTED_SYSTEMS_OUTCOME" = "success" ] && [ "$PROMOTE_OUTCOME" = "success" ]; then
            if { [ "$DRIVE_ENABLED" = "true" ] || [ "$DOCUMENT_DELIVERY_CONFIGURED" = "true" ]; } && [ "$DRIVE_WORKER_OUTCOME" != "success" ]; then
              drive_worker_failed=true
            fi
            if [ "$DRIVE_ENABLED" != "true" ] && [ "$DOCUMENT_DELIVERY_CONFIGURED" != "true" ] && [ "$DRIVE_PAUSE_OUTCOME" != "success" ]; then
              drive_pause_failed=true
              backend_failure=true
            fi
          fi
          if [ "$PROMOTE_OUTCOME" = "failure" ]; then
            promote_failed=true
            # A multi-service promotion can fail after one service has already
            # shifted traffic. Roll back every selected service to its proven
            # predeploy revision; the rollback is safe and idempotent for a
            # service whose traffic never moved.
            if [ "$DEPLOY_BACKEND" = "true" ]; then
              backend_failure=true
            fi
            if [ "$DEPLOY_FRONTEND" = "true" ]; then
              frontend_failure=true
            fi
          fi
          if [ "$DEPLOY_BACKEND" = "true" ] && [ "$PROMOTE_OUTCOME" = "success" ] \
             && [ "$BACKEND_PROVENANCE_OUTCOME" != "success" ]; then
            backend_provenance_failed=true
            backend_failure=true
          fi
          if [ "$DEPLOY_FRONTEND" = "true" ] && [ "$PROMOTE_OUTCOME" = "success" ] \
             && [ "$FRONTEND_PROVENANCE_OUTCOME" != "success" ]; then
            frontend_provenance_failed=true
            frontend_failure=true
          fi
          if [ "$DEPLOY_FRONTEND" = "true" ] && [ "$PROMOTE_OUTCOME" = "success" ] \
             && [ "$PASSKEY_ASSOCIATIONS_OUTCOME" != "success" ]; then
            passkey_associations_failed=true
            frontend_failure=true
          fi

          # release_failed drives the workflow's final pass/fail. Required runtime
          # parity is not optional: missing consent origins, provider credentials,
          # or key mounts must fail closed before promotion.
          release_failed=false
          if [ "$upstream_failed" = "true" ] \
             || [ "$backend_failure" = "true" ] || [ "$frontend_failure" = "true" ] \
             || [ "$parity_failed" = "true" ] || [ "$connected_systems_failed" = "true" ] \
             || [ "$drive_worker_failed" = "true" ] || [ "$drive_pause_failed" = "true" ] \
             || [ "$promote_failed" = "true" ] \
             || [ "$backend_provenance_failed" = "true" ] \
             || [ "$frontend_provenance_failed" = "true" ] \
             || [ "$passkey_associations_failed" = "true" ] \
             || [ "$account_session_contract_failed" = "true" ]; then
            release_failed=true
          fi
          # Once this release paused a previously serving Drive job, a later
          # failure must restore the paired backend before restoring those jobs.
          if [ "$release_failed" = "true" ] && [ -n "$DRIVE_PAUSE_SNAPSHOT" ]; then
            backend_failure=true
          fi

          # No lifecycle or serving mutation precedes the early image check.
          # Keep the release failed without issuing a needless rollback.
          if [ "$FRONTEND_IMAGE_CHECK_OUTCOME" = "failure" ]; then
            release_failed=true
            backend_failure=false
            frontend_failure=false
          fi

          {
            echo "upstream_failed=$upstream_failed"
            echo "backend_failure=$backend_failure"
            echo "frontend_failure=$frontend_failure"
            echo "account_session_contract_failed=$account_session_contract_failed"
            echo "parity_failed=$parity_failed"
            echo "connected_systems_failed=$connected_systems_failed"
            echo "drive_worker_failed=$drive_worker_failed"
            echo "drive_pause_failed=$drive_pause_failed"
            echo "promote_failed=$promote_failed"
            echo "backend_provenance_failed=$backend_provenance_failed"
            echo "frontend_provenance_failed=$frontend_provenance_failed"
            echo "passkey_associations_failed=$passkey_associations_failed"
            echo "release_failed=$release_failed"
          } >> "$GITHUB_OUTPUT"

          echo "Release classification: release_failed=$release_failed upstream_failed=$upstream_failed backend_failure=$backend_failure frontend_failure=$frontend_failure account_session_contract_failed=$account_session_contract_failed parity_failed=$parity_failed connected_systems_failed=$connected_systems_failed promote_failed=$promote_failed backend_provenance_failed=$backend_provenance_failed frontend_provenance_failed=$frontend_provenance_failed passkey_associations_failed=$passkey_associations_failed"

      - name: Roll back backend revision
        id: rollback-backend
        if: env.PHONE_DEPLOY_PHASE != 'cold' && (always() && steps.classify.outputs.backend_failure == 'true' && steps.scope.outputs.deploy_backend == 'true' && steps.phone-rollback-qualified.outputs.revision != '')
        shell: bash
        run: |
          set -euo pipefail
          rollback_revision="${{ steps.phone-rollback-qualified.outputs.revision }}"
          echo "Backend release gate failed; evaluating rollback to qualified phone reader ${rollback_revision}"
          gcloud run services describe "${{ env.BACKEND_SERVICE }}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --region="${{ env.GCP_REGION }}" \
            --format=json > /tmp/prod-backend-prerollback-service.json
          serving_revision="$(python3 - <<'PY'
          import json
          from pathlib import Path

          service = json.loads(
              Path('/tmp/prod-backend-prerollback-service.json').read_text(encoding='utf-8')
          )
          status = service.get('status') or {}
          positive = [
              item for item in (status.get('traffic') or [])
              if isinstance(item, dict) and int(item.get('percent') or 0) > 0
          ]
          if len(positive) != 1:
              raise SystemExit('Cannot authorize rollback from ambiguous backend traffic')
          revision = str(positive[0].get('revisionName') or '').strip()
          if not revision and positive[0].get('latestRevision'):
              revision = str(status.get('latestReadyRevisionName') or '').strip()
          if not revision:
              raise SystemExit('Cannot resolve current backend revision for rollback')
          print(revision)
          PY
          )"
          if [ "${serving_revision}" = "${rollback_revision}" ]; then
            echo "Backend rollback target already serves 100% traffic; no traffic mutation required."
            exit 0
          fi
          if [ "${{ steps.predeploy-db-gate.outcome }}" != "success" ]; then
            echo "Refusing backend rollback after an unproven migration boundary." >&2
            exit 1
          fi

          rollback_contract="$(gcloud run revisions describe "${rollback_revision}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --region="${{ env.GCP_REGION }}" \
            --format='value(metadata.labels.account-deletion-contract)' 2>/dev/null || true)"
          DB_USER="$(gcloud secrets versions access latest --secret=DB_USER --project="${{ env.GCP_PROJECT_ID }}")"
          DB_PASSWORD="$(gcloud secrets versions access latest --secret=DB_PASSWORD --project="${{ env.GCP_PROJECT_ID }}")"
          echo "::add-mask::${DB_USER}"
          echo "::add-mask::${DB_PASSWORD}"
          cloud-sql-proxy \
            --address 127.0.0.1 \
            --port 6544 \
            ${GOOGLE_GHA_CREDS_PATH:+--credentials-file="${GOOGLE_GHA_CREDS_PATH}"} \
            "${{ env.PROD_CLOUDSQL_INSTANCE }}" >/tmp/cloud-sql-proxy-prod-rollback.log 2>&1 &
          PROXY_PID=$!
          trap 'kill "${PROXY_PID}" >/dev/null 2>&1 || true' EXIT
          python3 - <<'PY'
          import socket
          import time

          deadline = time.time() + 20
          while time.time() < deadline:
              with socket.socket() as sock:
                  sock.settimeout(0.5)
                  if sock.connect_ex(("127.0.0.1", 6544)) == 0:
                      raise SystemExit(0)
              time.sleep(0.25)
          raise SystemExit("Cloud SQL proxy did not bind for rollback authorization")
          PY
          export PGHOST=127.0.0.1
          export PGPORT=6544
          export PGDATABASE="${{ env.PROD_DB_NAME }}"
          export PGUSER="$DB_USER"
          export PGPASSWORD="$DB_PASSWORD"
          if [ "${{ steps.account-deletion-fence-decision.outputs.required }}" = "true" ] \
             || [ "${rollback_contract}" != "v201" ]; then
            psql --no-psqlrc \
              --file deploy/account-deletion/install_release_fence.sql \
              > /tmp/prod-account-deletion-fence-rollback.log
          fi
          tombstone_count="$(psql --no-psqlrc --tuples-only --no-align \
            --command 'SELECT count(*) FROM public.account_deletion_tombstones')"
          if [[ ! "${tombstone_count}" =~ ^[0-9]+$ ]]; then
            echo "Cannot authorize backend rollback without a tombstone count." >&2
            exit 1
          fi
          if [ "${rollback_contract}" != "v201" ] && [ "${tombstone_count}" != "0" ]; then
            echo "Refusing rollback to a pre-v201 backend after an account tombstone exists." >&2
            exit 1
          fi
          bash scripts/ci/cloudrun-rollback.sh \
            "${{ env.BACKEND_SERVICE }}" \
            "${{ env.GCP_REGION }}" \
            "${rollback_revision}"

      - name: Roll back frontend revision
        id: rollback-frontend
        if: env.PHONE_DEPLOY_PHASE != 'cold' && (always() && steps.classify.outputs.frontend_failure == 'true' && steps.scope.outputs.deploy_frontend == 'true' && steps.predeploy-state.outputs.frontend_revision != '')
        shell: bash
        run: |
          set -euo pipefail
          echo "Frontend runtime health gate failed; reverting traffic to predeploy revision ${{ steps.predeploy-state.outputs.frontend_revision }}"
          bash scripts/ci/cloudrun-rollback.sh "${{ env.FRONTEND_SERVICE }}" "${{ env.GCP_REGION }}" "${{ steps.predeploy-state.outputs.frontend_revision }}"

      - name: Restore production Drive worker after paired release failure
        id: rollback-drive-worker
        if: env.PHONE_DEPLOY_PHASE != 'cold' && (always() && steps.classify.outputs.release_failed == 'true' && steps.deploy-drive-worker.outcome == 'success')
        shell: bash
        run: |
          set -euo pipefail
          bash deploy/drive/restore_prod_after_release_failure.sh \
            "${{ steps.deploy-drive-worker.outputs.previous_revision }}" \
            "${{ steps.deploy-drive-worker.outputs.worker_url }}"

      - name: Restore production Drive jobs after disabled release failure
        id: rollback-paused-drive-worker
        if: env.PHONE_DEPLOY_PHASE != 'cold' && (always() && steps.classify.outputs.release_failed == 'true' && steps.pause-drive-worker.outputs.snapshot != '' && steps.rollback-backend.outcome == 'success')
        shell: bash
        run: |
          set -euo pipefail
          python3 deploy/drive/work_drain_scheduler_snapshot_prod.py restore \
            --snapshot "${{ steps.pause-drive-worker.outputs.snapshot }}" \
            --worker-origin "${{ steps.pause-drive-worker.outputs.worker_origin }}"

      - name: Activate tombstone-aware account deletion
        id: activate-account-deletion
        if: env.PHONE_DEPLOY_PHASE != 'cold' && (steps.classify.outputs.release_failed == 'false' && steps.scope.outputs.deploy_backend == 'true')
        shell: bash
        run: |
          set -euo pipefail
          python3 deploy/account-deletion/activate_release.py \
            --project "${{ env.GCP_PROJECT_ID }}" --region "${{ env.GCP_REGION }}" \
            --backend-service "${{ env.BACKEND_SERVICE }}" \
            --backend-url "${{ env.CONSENT_API_PUBLIC_ORIGIN }}" \
            --oidc-audience "${{ env.CONSENT_API_PUBLIC_ORIGIN }}" \
            --scheduler-job "${{ env.ACCOUNT_DELETION_SCHEDULER_JOB }}" \
            --scheduler-service-account "${{ env.ACCOUNT_DELETION_SCHEDULER_SERVICE_ACCOUNT_ID }}" \
            --expected-sha "${{ github.event.inputs.sha }}" --expected-run-id "${{ github.run_id }}" \
            --cloudsql-instance "${{ env.PROD_CLOUDSQL_INSTANCE }}" \
            --db-name "${{ env.PROD_DB_NAME }}" --db-port 6544 \
            --fence-required "${{ steps.account-deletion-fence-decision.outputs.required }}" \
            --evidence-prefix /tmp/prod-account-deletion
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads(Path("/tmp/prod-account-deletion-activation.json").read_text())
          status = result["status"]
          if status not in {"activated", "pending_activation"}:
              raise SystemExit("Account lifecycle result is not confirmed")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"activated={str(status == 'activated').lower()}\n")
              output.write(f"pending={str(status == 'pending_activation').lower()}\n")
          PY

      - name: Resolve final Cloud Run state
        id: final-state
        if: env.PHONE_DEPLOY_PHASE != 'cold' && (always())
        shell: bash
        run: |
          set -euo pipefail
          # A zero-percent candidate tag can sort ahead of the serving entry, so
          # never trust traffic order; resolve the single 100% revision.
          if ! gcloud run services describe "${{ env.BACKEND_SERVICE }}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --region="${{ env.GCP_REGION }}" \
            --format=json > /tmp/prod-backend-final-service.json 2>/dev/null; then
            printf '{}\n' > /tmp/prod-backend-final-service.json
          fi
          if ! gcloud run services describe "${{ env.FRONTEND_SERVICE }}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --region="${{ env.GCP_REGION }}" \
            --format=json > /tmp/prod-frontend-final-service.json 2>/dev/null; then
            printf '{}\n' > /tmp/prod-frontend-final-service.json
          fi
          backend_serving="$(python3 scripts/ci/resolve-cloud-run-serving-state.py \
            --service-json /tmp/prod-backend-final-service.json --allow-missing \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["revision"])')"
          frontend_serving="$(python3 scripts/ci/resolve-cloud-run-serving-state.py \
            --service-json /tmp/prod-frontend-final-service.json --allow-missing \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["revision"])')"
          echo "backend_serving=${backend_serving}" >> "$GITHUB_OUTPUT"
          echo "frontend_serving=${frontend_serving}" >> "$GITHUB_OUTPUT"
          if [ "${{ steps.scope.outputs.deploy_backend }}" != true ] && [ -n "$backend_serving" ]; then
            gcloud run revisions describe "$backend_serving" \
              --project="${{ env.GCP_PROJECT_ID }}" --region="${{ env.GCP_REGION }}" \
              --format='json(metadata)' > /tmp/prod-backend-origin-revision.json
          fi

      - name: Write production release status artifact
        id: release-status
        if: env.PHONE_DEPLOY_PHASE != 'cold' && (always())
        shell: bash
        run: |
          set -euo pipefail
          STATUS="blocked"
          if [ "${{ steps.classify.outputs.release_failed }}" = "false" ]; then
            STATUS="healthy"
            if [ "${{ steps.scope.outputs.deploy_backend }}" = "true" ] \
               && [ "${{ steps.final-state.outputs.backend_serving }}" != "${{ steps.candidate-state.outputs.backend_revision }}" ]; then
              STATUS="blocked"
            fi
            if [ "${{ steps.scope.outputs.deploy_frontend }}" = "true" ] \
               && [ "${{ steps.final-state.outputs.frontend_serving }}" != "${{ steps.candidate-state.outputs.frontend_revision }}" ]; then
              STATUS="blocked"
            fi
            # A backend release is healthy only once tombstone-aware deletion is
            # activated; until then the fence keeps account deletion fail-closed.
            if [ "${{ steps.scope.outputs.deploy_backend }}" = "true" ] \
               && [ "${{ steps.activate-account-deletion.outcome }}" != "success" ]; then
              STATUS="blocked"
            fi
            if [ "$STATUS" = healthy ] && [ "${{ steps.scope.outputs.deploy_backend }}" = true ]; then
              if [ "${{ steps.activate-account-deletion.outputs.activated }}" = true ]; then
                :
              elif [ "${{ steps.activate-account-deletion.outputs.pending }}" = true ]; then
                STATUS="pending_activation"
              else
                STATUS="blocked"
              fi
            fi
          else
            ROLLBACK_REQUIRED=false
            ROLLBACK_PROVEN=true
            if [ "${{ steps.classify.outputs.backend_failure }}" = "true" ]; then
              ROLLBACK_REQUIRED=true
              if [ "${{ steps.phone-rollback-qualified.outputs.revision }}" = "" ] \
                 || [ "${{ steps.rollback-backend.outcome }}" != "success" ] \
                 || [ "${{ steps.final-state.outputs.backend_serving }}" != "${{ steps.phone-rollback-qualified.outputs.revision }}" ]; then
                ROLLBACK_PROVEN=false
              fi
            fi
            if [ "${{ steps.classify.outputs.frontend_failure }}" = "true" ]; then
              ROLLBACK_REQUIRED=true
              if [ "${{ steps.predeploy-state.outputs.frontend_revision }}" = "" ] \
                 || [ "${{ steps.rollback-frontend.outcome }}" != "success" ] \
                 || [ "${{ steps.final-state.outputs.frontend_serving }}" != "${{ steps.predeploy-state.outputs.frontend_revision }}" ]; then
                ROLLBACK_PROVEN=false
              fi
            fi
            if [ "${{ steps.pause-drive-worker.outputs.snapshot }}" != "" ]; then
              ROLLBACK_REQUIRED=true
              if [ "${{ steps.rollback-paused-drive-worker.outcome }}" != "success" ]; then
                ROLLBACK_PROVEN=false
              fi
            fi
            if [ "$ROLLBACK_REQUIRED" = "true" ] && [ "$ROLLBACK_PROVEN" = "true" ]; then
              STATUS="rolled_back"
            fi
          fi
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          export STATUS
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "status": os.environ["STATUS"],
              "sha": "${{ github.event.inputs.sha }}",
              "scope": "${{ steps.scope.outputs.scope }}",
              "predeploy": {
                  "backend_revision": "${{ steps.predeploy-state.outputs.backend_revision }}",
                  "frontend_revision": "${{ steps.predeploy-state.outputs.frontend_revision }}",
              },
              "candidate": {
                  "backend_revision": "${{ steps.candidate-state.outputs.backend_revision }}",
                  "frontend_revision": "${{ steps.candidate-state.outputs.frontend_revision }}",
              },
              "final": {
                  "backend_revision": "${{ steps.final-state.outputs.backend_serving }}",
                  "frontend_revision": "${{ steps.final-state.outputs.frontend_serving }}",
              },
              "verification": {
                  "runtime_parity": "${{ steps.verify-parity.outcome }}",
                  "connected_systems": "${{ steps.verify-connected-systems.outcome }}",
                  "connected_systems_product_available": "${{ steps.crm-availability.outputs.required }}",
                  "connected_systems_qualification": "${{ steps.verify-connected-systems.outputs.qualification }}",
                  "backend_provenance": "${{ steps.verify-backend-provenance.outcome }}",
                  "frontend_provenance": "${{ steps.verify-frontend-provenance.outcome }}",
                  "backend_health": "${{ steps.health-backend.outcome }}",
                  "frontend_health": "${{ steps.health-frontend.outcome }}",
                  "passkey_domain_associations": "${{ steps.verify-passkey-associations.outcome }}",
                  "account_deletion_fence_required": "${{ steps.account-deletion-fence-decision.outputs.required }}",
                  "account_deletion_activation": "${{ steps.activate-account-deletion.outcome }}",
                  "account_deletion_activated": "${{ steps.activate-account-deletion.outputs.activated }}",
              },
              "classification": {
                  "release_failed": "${{ steps.classify.outputs.release_failed }}",
                  "promote_failed": "${{ steps.classify.outputs.promote_failed }}",
                  "backend_provenance_failed": "${{ steps.classify.outputs.backend_provenance_failed }}",
                  "frontend_provenance_failed": "${{ steps.classify.outputs.frontend_provenance_failed }}",
              },
              "phone_rollback": {"revision": "${{ steps.phone-rollback-qualified.outputs.revision }}", "qualification": "${{ steps.phone-rollback-qualified.outcome }}", "recovery_enabled": "${{ steps.phone-rollback-plan.outputs.recovery_enabled }}"},
              "rollback": {
                  "backend": "${{ steps.rollback-backend.outcome }}",
                  "frontend": "${{ steps.rollback-frontend.outcome }}",
                  "drive_jobs": "${{ steps.rollback-paused-drive-worker.outcome }}",
              },
          }
          if "${{ steps.scope.outputs.deploy_backend }}" != "true":
              payload.pop("phone_rollback")
              if payload["status"] == "healthy":
                  # This is a selector, never authority. Readers independently
                  # bind its exact original run/archive and activated identity.
                  import re
                  metadata = json.loads(Path("/tmp/prod-backend-origin-revision.json").read_text())["metadata"]
                  service = json.loads(Path("/tmp/prod-backend-final-service.json").read_text())["metadata"]
                  labels = metadata.get("labels", {})
                  pointer = {
                      "run_id": labels.get("github-run-id", ""),
                      "source": labels.get("deploy-sha", ""),
                      "revision": metadata.get("name", ""),
                      "uid": metadata.get("uid", ""),
                      "service_uid": service.get("uid", ""),
                  }
                  if (not re.fullmatch(r"[1-9][0-9]*", pointer["run_id"])
                      or not re.fullmatch(r"[0-9a-f]{40}", pointer["source"])
                      or pointer["revision"] != payload["final"]["backend_revision"]
                      or not all(isinstance(pointer[key], str) and 0 < len(pointer[key]) <= 256
                                 for key in ("uid", "service_uid"))):
                      raise SystemExit("Frontend release has no exact inherited backend selector")
                  payload["backend_origin"] = pointer
          predecessor = Path("/tmp/prod-predecessor-acceptance.json")
          payload["predecessor_acceptance"] = (
              json.loads(predecessor.read_text(encoding="utf-8")) if predecessor.exists() else None
          )
          Path("/tmp/prod-release-status.json").write_text(
              json.dumps(payload, indent=2), encoding="utf-8"
          )
          PY

      - name: Cancel an unused parallel frontend image build
        # Hygiene only: a release that stopped before the frontend deploy leaves
        # the web build running. It never affects release classification.
        if: env.PHONE_DEPLOY_PHASE != 'cold' && (always() && steps.start-frontend-image-build.outputs.build_id != '' && steps.build-frontend-image.outcome != 'success')
        continue-on-error: true
        shell: bash
        env:
          FRONTEND_IMAGE_BUILD_ID: ${{ steps.start-frontend-image-build.outputs.build_id }}
        run: |
          set -euo pipefail
          status="$(gcloud builds describe "${FRONTEND_IMAGE_BUILD_ID}" \
            --project="${{ env.GCP_PROJECT_ID }}" --format='value(status)')"
          case "${status}" in
            QUEUED|PENDING|WORKING)
              gcloud builds cancel "${FRONTEND_IMAGE_BUILD_ID}" --project="${{ env.GCP_PROJECT_ID }}"
              ;;
            *)
              echo "Frontend image build ${FRONTEND_IMAGE_BUILD_ID} is already ${status}; nothing to cancel."
              ;;
          esac

      - name: Upload production deploy artifacts
        if: env.PHONE_DEPLOY_PHASE != 'cold' && (always())
        uses: actions/upload-artifact@v6
        with:
          name: prod-release-${{ github.run_id }}
          if-no-files-found: error
          path: |
            /tmp/phone-rollback/
            /tmp/prod-predecessor-acceptance.json
            /tmp/prod-runtime-secret-sync.json
            /tmp/prod-frontend-runtime-secret-sync.json
            /tmp/prod-runtime-parity.json
            /tmp/prod-protected-document-release.json
            /tmp/prod-document-reader-compatibility.json
            /tmp/prod-connected-systems-availability.json
            /tmp/prod-connected-systems.log
            /tmp/prod-backend-provenance.json
            /tmp/prod-frontend-provenance.json
            /tmp/prod-backend-image.json
            /tmp/prod-backend-image-manifest.json
            /tmp/prod-backend-image-promotion-source.json
            /tmp/prod-uat-backend-image.json
            /tmp/prod-uat-backend-image-manifest.json
            /tmp/prod-frontend-image.json
            /tmp/prod-frontend-image-manifest.json
            /tmp/prod-backend-candidate.json
            /tmp/prod-backend-candidate-readiness.json
            /tmp/prod-backend-candidate-health.json
            /tmp/prod-account-deletion-fence-install.log
            /tmp/prod-account-deletion-revisions.json
            /tmp/prod-account-deletion-unfenced-preflight.log
            /tmp/prod-account-deletion-fence-premigration.log
            /tmp/prod-account-deletion-boundary.log
            /tmp/prod-account-deletion-boundary-preactivation.log
            /tmp/prod-account-deletion-scheduler-setup.log
            /tmp/prod-account-deletion-scheduler-config.json
            /tmp/prod-account-deletion-scheduler-finished-logs.json
            /tmp/prod-account-deletion-activation.json
            /tmp/prod-account-deletion-scheduler-evidence.json
            /tmp/prod-account-deletion-cleanup-health.json
            /tmp/prod-account-deletion-revision-retirement.json
            /tmp/prod-account-deletion-fence-removal.log
            /tmp/cloud-sql-proxy-prod.log
            /tmp/cloud-sql-proxy-prod-fence.log
            /tmp/cloud-sql-proxy-prod-drift-gate.log
            /tmp/cloud-sql-proxy-prod-rollback.log
            /tmp/cloud-sql-proxy-prod-activation.log
            /tmp/prod-release-status.json
            ${{ runner.temp }}/qualified-worker-stage/

      - name: Deployment Summary
        if: env.PHONE_DEPLOY_PHASE != 'cold' && (always())
        shell: bash
        run: |
          {
            echo "## Production Release"
            echo ""
            echo "- Commit SHA: \`${{ github.event.inputs.sha }}\`"
            echo "- Scope: \`${{ steps.scope.outputs.scope }}\`"
            echo "- Account deletion fence required: \`${{ steps.account-deletion-fence-decision.outputs.required || 'not_applicable' }}\`"
            echo "- Release status: \`$(python3 -c "import json; from pathlib import Path; print(json.loads(Path('/tmp/prod-release-status.json').read_text(encoding='utf-8'))['status'])")\`"
            if [ "${{ steps.classify.outputs.release_failed }}" != "false" ]; then
              echo "- Status: \`FAILED\`"
            else
              echo "- Status: \`healthy\`"
            fi
            echo ""
            if [ "${{ steps.scope.outputs.deploy_backend }}" = "true" ]; then
              echo "- Backend URL: \`${{ steps.backend-url.outputs.url }}\`"
              echo "- Qualified phone rollback revision: \`${{ steps.phone-rollback-qualified.outputs.revision || 'unqualified' }}\`"
              echo "- Phone recovery producer: \`${{ steps.phone-rollback-plan.outputs.recovery_enabled || 'unqualified' }}\`"
              echo "- Backend predeploy revision: \`${{ steps.predeploy-state.outputs.backend_revision || 'unknown' }}\`"
              echo "- Backend image source: \`${{ steps.build-backend-image.outputs.image_source }}\`"
              echo "- Backend image: \`${{ steps.build-backend-image.outputs.image_reference || 'n/a' }}\`"
              if [ "${{ github.event.inputs.backend_image_source }}" = "promote-from-uat" ]; then
                echo "- Promoted from UAT revision: \`${{ steps.uat-verified-backend-image.outputs.uat_revision || 'n/a' }}\` (\`${{ steps.uat-verified-backend-image.outputs.uat_release_tag || 'n/a' }}\`)"
              fi
              echo "- Backend candidate revision: \`${{ steps.candidate-state.outputs.backend_revision || 'n/a' }}\`"
              echo "- Backend serving revision (final): \`${{ steps.final-state.outputs.backend_serving || 'unknown' }}\`"
              echo "- Backend health gate: \`${{ steps.health-backend.outcome }}\`"
              echo "- Backend rollback: \`${{ steps.rollback-backend.outcome }}\`"
              echo "- Account deletion activation: \`${{ steps.activate-account-deletion.outcome }}\`"
              echo "- Latest backup id: \`${{ steps.backup-gate.outputs.backup_id }}\`"
              echo "- Latest backup completed at: \`${{ steps.backup-gate.outputs.backup_completed_at }}\`"
            else
              echo "- Backend: skipped"
            fi
            if [ "${{ steps.scope.outputs.deploy_frontend }}" = "true" ]; then
              echo "- Frontend URL: \`${{ steps.frontend-url.outputs.url }}\`"
              echo "- Frontend predeploy revision: \`${{ steps.predeploy-state.outputs.frontend_revision || 'unknown' }}\`"
              echo "- Frontend candidate revision: \`${{ steps.candidate-state.outputs.frontend_revision || 'n/a' }}\`"
              echo "- Frontend serving revision (final): \`${{ steps.final-state.outputs.frontend_serving || 'unknown' }}\`"
              echo "- Frontend health gate: \`${{ steps.health-frontend.outcome }}\`"
              echo "- Frontend rollback: \`${{ steps.rollback-frontend.outcome }}\`"
            else
              echo "- Frontend: skipped"
            fi
            echo ""
            echo "- Traffic promotion: \`${{ steps.promote-traffic.outcome }}\`"
            echo "- Backend provenance: \`${{ steps.verify-backend-provenance.outcome }}\`"
            echo "- Frontend provenance: \`${{ steps.verify-frontend-provenance.outcome }}\`"
            echo "- Env parity: \`${{ steps.verify-parity.outcome }}\`"
            echo "- CRM qualification: \`${{ steps.verify-connected-systems.outputs.qualification || 'not_run' }}\` (product available: \`${{ steps.crm-availability.outputs.required || 'unqualified' }}\`)"
            echo "- Native passkey domain associations: \`${{ steps.verify-passkey-associations.outcome }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tag this release as last known good
        id: tag-last-known-good
        if: always() && env.PHONE_DEPLOY_PHASE != 'cold' && steps.release-status.outputs.status == 'healthy'
        # Advisory annotation, not a release-health signal: the deploy above
        # already succeeded and classified healthy by this point. A tagging
        # failure (e.g. a transient push conflict) must never turn a healthy
        # release red or trigger the rollback investigation that implies.
        continue-on-error: true
        shell: bash
        env:
          ENVIRONMENT: production
          SHA: ${{ github.event.inputs.sha }}
          BACKEND_REVISION: ${{ steps.final-state.outputs.backend_serving }}
          BACKEND_SERVICE_URL: ${{ steps.backend-url.outputs.url }}
          FRONTEND_REVISION: ${{ steps.final-state.outputs.frontend_serving }}
          FRONTEND_SERVICE_URL: ${{ steps.frontend-url.outputs.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          STATUS="$(python3 -c "import json; from pathlib import Path; print(json.loads(Path('/tmp/prod-release-status.json').read_text(encoding='utf-8'))['status'])")"
          if [ "$STATUS" != "healthy" ]; then
            echo "[tag-last-known-good] Release status is '$STATUS', not 'healthy' — not tagging."
            exit 0
          fi
          bash scripts/ci/tag-last-known-good.sh

      - name: Retire unused production tags after a healthy release
        if: env.PHONE_DEPLOY_PHASE != 'cold' && (always())
        shell: bash
        env:
          BACKEND_CURRENT: ${{ steps.final-state.outputs.backend_serving }}
          FRONTEND_CURRENT: ${{ steps.final-state.outputs.frontend_serving }}
          BACKEND_ROLLBACK: ${{ steps.phone-rollback-qualified.outputs.revision }}
          FRONTEND_ROLLBACK: ${{ steps.predeploy-state.outputs.frontend_revision }}
        run: |
          set -euo pipefail
          status="$(python3 -c "import json; from pathlib import Path; print(json.loads(Path('/tmp/prod-release-status.json').read_text(encoding='utf-8'))['status'])")"
          if [ "$status" != healthy ]; then
            echo "Skipping revision cleanup for release status $status"
            exit 0
          fi
          bash scripts/ci/cloudrun-retention.sh "$BACKEND_SERVICE" "$GCP_REGION" "$BACKEND_REVISION_RETENTION" \
            "$BACKEND_CURRENT" --rollback-revision "$BACKEND_ROLLBACK" \
            --last-known-good-revision "$BACKEND_CURRENT" --apply --healthy --tags-only
          bash scripts/ci/cloudrun-retention.sh "$FRONTEND_SERVICE" "$GCP_REGION" "$FRONTEND_REVISION_RETENTION" \
            "$FRONTEND_CURRENT" --rollback-revision "$FRONTEND_ROLLBACK" \
            --last-known-good-revision "$FRONTEND_CURRENT" --apply --healthy --tags-only
          timeout --signal=TERM --kill-after=2s 295s python3 scripts/ci/runtime-capacity-budget.py --environment production --phase post-release

      - name: Fail workflow when production release did not end healthy
        if: env.PHONE_DEPLOY_PHASE != 'cold' && (always())
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(python3 -c "import json; from pathlib import Path; print(json.loads(Path('/tmp/prod-release-status.json').read_text(encoding='utf-8'))['status'])")"
          if [ "$STATUS" = pending_activation ]; then
            echo "Runtime gates passed; deletion remains fenced pending canonical retirement and explicit activation. No healthy release is claimed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$STATUS" != "healthy" ]; then
            echo "Production release did not end healthy."
            echo "release_status=$STATUS"
            echo "upstream_failed=${{ steps.classify.outputs.upstream_failed }}"
            echo "backend_failure=${{ steps.classify.outputs.backend_failure }}"
            echo "frontend_failure=${{ steps.classify.outputs.frontend_failure }}"
            echo "parity_failed=${{ steps.classify.outputs.parity_failed }}"
            echo "promote_failed=${{ steps.classify.outputs.promote_failed }}"
            echo "backend_provenance_failed=${{ steps.classify.outputs.backend_provenance_failed }}"
            echo "frontend_provenance_failed=${{ steps.classify.outputs.frontend_provenance_failed }}"
            echo "account_deletion_activation=${{ steps.activate-account-deletion.outcome }}"
            echo "backend_rollback=${{ steps.rollback-backend.outcome }}"
            echo "frontend_rollback=${{ steps.rollback-frontend.outcome }}"
            if [ "${{ steps.rollback-backend.outcome }}" = "success" ] || [ "${{ steps.rollback-frontend.outcome }}" = "success" ]; then
              echo "Traffic was auto-reverted to the predeploy revision(s). Investigate before redeploying."
            fi
            exit 1
          fi
          echo "✅ Production release healthy; new revisions serving traffic."

  stage-drive-worker:
    name: Stage qualified production Drive worker
    if: github.event_name == 'workflow_dispatch' && inputs.phone_phase == 'worker'
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      checks: read
      actions: read
      id-token: write
    steps:
      - name: Assert manual dispatch originates from main
        shell: bash
        env:
          REQUESTED_PHASE: ${{ inputs.phone_phase }}
          REQUESTED_SCOPE: ${{ inputs.scope }}
          REQUESTED_DRIVE_MODE: ${{ inputs.drive_live_mode }}
          CADENCE_ORIGIN: ${{ inputs.cadence_origin }}
          CADENCE_ORDINAL: ${{ inputs.cadence_ordinal }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF_NAME" == main ]] || exit 1
          [[ "$REQUESTED_PHASE" == worker && "$REQUESTED_SCOPE" == backend ]] || exit 1
          [[ "$REQUESTED_DRIVE_MODE" == preserve && -z "$CADENCE_ORIGIN$CADENCE_ORDINAL" ]] || exit 1

      - name: Checkout current release tooling
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Assert production dispatch actor policy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/ci/assert-governed-actor.py --surface production --actor "$GITHUB_ACTOR"

      - name: Set up Python + uv runtime
        uses: ./consent-protocol/.github/actions/setup-python-uv
        with:
          python-version: "3.13"
          protocol-dir: ./consent-protocol
          sync-dev-group: "false"

      - name: Validate Google Cloud workload identity configuration
        shell: bash
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test -n "$WIF_PROVIDER"
          test -n "$DEPLOY_SERVICE_ACCOUNT"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          project_id: ${{ env.GCP_PROJECT_ID }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Assert GCP project scope
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GCP_PROJECT_ID" == hushh-pda && "$GCP_REGION" == us-central1 ]] || exit 1
          gcloud config set project "$GCP_PROJECT_ID"
          [[ "$(gcloud config get-value project 2>/dev/null)" == "$GCP_PROJECT_ID" ]] || exit 1

      - name: Require reconciled maintenance mutations under deployment lock
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          "$PROTOCOL_PYTHON" scripts/ci/uat-retention-maintenance.py --environment production \
            --check-mutations --state-dir "$RUNNER_TEMP/production-maintenance-guard"

      - name: Require qualified production worker release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SOURCE: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/worker-stage"
          "$PROTOCOL_PYTHON" - <<'PYCODE'
          import json
          import os
          import re
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts/ci")
          import production_backend_successor_control as control
          import production_backend_successor_proof as proof
          import production_worker_basis as basis_owner
          current = proof.read_original()
          anchor = control.record_anchor(current)
          basis_path = ""
          if anchor is not None:
              control.live(anchor)
              sealed = anchor["sealed_boundary"]
              source, image, mode = (sealed["checkpoint"]["plan"]["primary_sha"],
                                     sealed["primary_image"], sealed["document_mode"])
          else:
              basis = basis_owner.load(os.environ["REQUESTED_SOURCE"])
              source, image, mode = (basis["candidate"]["source"], basis["candidate"]["image"],
                                     basis["protected_documents"])
              basis_path = str(Path(os.environ["RUNNER_TEMP"]) / "worker-stage/release-basis.json")
              Path(basis_path).write_text(json.dumps(basis, sort_keys=True) + "\n")
          if (not re.fullmatch(r"[0-9a-f]{40}", source)
              or not re.fullmatch(r"gcr\.io/hushh-pda/consent-protocol@sha256:[0-9a-f]{64}", image)
              or os.environ["REQUESTED_SOURCE"] != source
              or any(type(mode.get(key)) is not bool for key in ("configured", "enabled"))):
              raise SystemExit("Worker staging source or document boundary is unqualified")
          values = {
              "DEPLOY_SHA": source, "IMAGE_REFERENCE": image,
              "STAGE_RELEASE_TAG_OID": current["tag_oid"],
              "DRIVE_WORKER_RELEASE_BASIS": basis_path,
              "RELEASE_RUN_ID": os.environ["GITHUB_RUN_ID"],
              "RELEASE_RUN_ATTEMPT": os.environ["GITHUB_RUN_ATTEMPT"],
              "DRIVE_RUNTIME_CONFIG_SECRET": os.environ["DRIVE_CANDIDATE_RUNTIME_SECRET"],
              "DRIVE_WORKER_STAGE_RECEIPT": str(Path(os.environ["RUNNER_TEMP"]) / "worker-stage/worker-stage.json"),
          }
          if any("\n" in value or "\r" in value for value in values.values()):
              raise SystemExit("Invalid worker staging environment value")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as target:
              target.writelines(f"{key}={value}\n" for key, value in values.items())
          PYCODE

      - name: Validate deployment SHA against main
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUIRED_BRANCH: main
          REQUIRE_CI_SUCCESS: "1"
          REQUIRED_CHECK_NAME: Main Post-Merge Smoke Gate
        run: bash scripts/ci/require-deploy-sha-on-main.sh "$DEPLOY_SHA"

      - name: Require exact-SHA UAT acceptance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          "$PROTOCOL_PYTHON" scripts/ci/verify-predecessor-acceptance.py require \
            --environment uat --sha "$DEPLOY_SHA" --scope backend \
            --output "$RUNNER_TEMP/worker-stage/uat-acceptance.json"

      - name: Resolve preserved production Drive mode
        id: drive-mode
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$BACKEND_SERVICE" --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" --format=json > "$RUNNER_TEMP/worker-stage/backend-service.json"
          serving_revision="$(python3 scripts/ci/resolve-cloud-run-serving-state.py \
            --service-json "$RUNNER_TEMP/worker-stage/backend-service.json" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["revision"])')"
          gcloud run revisions describe "$serving_revision" --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" --format=json > "$RUNNER_TEMP/worker-stage/backend-revision.json"
          # Existing backend-family source admission; requested mode stays preserve.
          required_ancestor="$(git log -1 --diff-filter=A --format=%H -- \
            consent-protocol/hushh_mcp/services/drive_prod_registry_provisioning.py)"
          "$PROTOCOL_PYTHON" deploy/drive/resolve_prod_release_mode.py \
            --project "$GCP_PROJECT_ID" --mode preserve --backend-deploy true \
            --previous-revision "$serving_revision" \
            --revision-json "$RUNNER_TEMP/worker-stage/backend-revision.json" \
            --target-sha "$DEPLOY_SHA" --required-ancestor "$required_ancestor" \
            --github-output "$GITHUB_OUTPUT"

      - name: Require unchanged protected document maintenance mode
        id: document-mode
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          "$PROTOCOL_PYTHON" - <<'PY'
          import json
          import os
          import subprocess
          import sys
          sys.path.insert(0, "scripts/ci")
          import production_backend_successor_control as control
          import production_backend_successor_proof as proof
          current = proof.read_original()
          anchor = control.record_anchor(current)
          if current["tag_oid"] != os.environ["STAGE_RELEASE_TAG_OID"]:
              raise SystemExit("Production release reference changed during worker admission")
          if anchor is not None:
              control.live(anchor)
              expected_mode = anchor["sealed_boundary"]["document_mode"]
          else:
              from pathlib import Path
              import production_worker_basis as basis_owner
              basis = json.loads(Path(os.environ["DRIVE_WORKER_RELEASE_BASIS"]).read_text())
              basis_owner.revalidate(basis)
              expected_mode = basis["protected_documents"]
          result = subprocess.run(
              [os.environ["PROTOCOL_PYTHON"], "deploy/drive/resolve_protected_document_release.py",
               "--project=hushh-pda", "--environment=production"],
              capture_output=True, text=True, check=True, timeout=120,
          )
          mode = json.loads(result.stdout)
          if mode != expected_mode:
              raise SystemExit("Protected document mode changed after worker qualification")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as target:
              for key in ("configured", "enabled"):
                  if type(mode.get(key)) is not bool:
                      raise SystemExit("Protected document mode is unqualified")
                  target.write(f"{key}={str(mode[key]).lower()}\n")
          PY

      - name: Enforce production worker staging capacity
        shell: bash
        run: |
          set -euo pipefail
          "$PROTOCOL_PYTHON" scripts/ci/runtime-capacity-budget.py --environment production \
            --candidate-service consent-protocol-drive-worker --output json \
            > "$RUNNER_TEMP/worker-stage/capacity.json"

      - name: Pin accepted image for recurring worker release
        if: env.DRIVE_WORKER_RELEASE_BASIS != ''
        shell: bash
        run: |
          set -euo pipefail
          uat_image="gcr.io/hushh-pda-uat/consent-protocol@${IMAGE_REFERENCE#*@}"
          gcloud container images add-tag --quiet "$uat_image"             "gcr.io/hushh-pda/consent-protocol:prod-$DEPLOY_SHA"
          docker buildx imagetools inspect "$IMAGE_REFERENCE" --raw             > "$RUNNER_TEMP/worker-stage/image-manifest.json"
          resolved="$(python3 scripts/ci/resolve-cloud-run-image.py             --image-reference "$IMAGE_REFERENCE"             --manifest-json "$RUNNER_TEMP/worker-stage/image-manifest.json"             --sha "$DEPLOY_SHA")"
          [[ "$resolved" == "$IMAGE_REFERENCE" ]] || exit 1

      - name: Sync isolated production Drive candidate configuration
        shell: bash
        env:
          PRODUCTION_DRIVE_CANDIDATE_ONLY: "true"
          PRODUCTION_DRIVE_ACTIVE: ${{ steps.drive-mode.outputs.active }}
          PROD_CURATED_MCP_CONNECTORS: ${{ vars.CURATED_MCP_CONNECTORS_PROD || 'false' }}
          CONSENT_CENTER_SUMMARY_V2_ENABLED: ${{ vars.CONSENT_CENTER_SUMMARY_V2_ENABLED || 'true' }}
          HUSSH_TRUSTED_DEVICE_ENABLED: ${{ vars.HUSSH_TRUSTED_DEVICE_ENABLED || 'false' }}
          NEARBY_CHECK_IN_COHORT: ${{ inputs.nearby_check_in_cohort }}
          ADVISORS_API_BASE_URL: ${{ vars.ADVISORS_API_BASE_URL || 'https://brokercheck.35.253.255.106.sslip.io' }}
          INSURANCE_AGENTS_API_BASE_URL: ${{ vars.INSURANCE_AGENTS_API_BASE_URL || 'https://insurance-agents.34.61.69.175.sslip.io' }}
          ONE_PLACES_DIRECTORY_ENABLED_PROD: ${{ vars.ONE_PLACES_DIRECTORY_ENABLED_PROD || 'true' }}
        run: bash deploy/drive/sync_runtime_config_prod.sh

      - name: Prepare private production Drive worker
        id: prepare-worker
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DRIVE_WORKER_RELEASE_PHASE: prepare
          ENABLE_PRODUCTION_DRIVE_LIVE: ${{ steps.drive-mode.outputs.active }}
          PROTECTED_DOCUMENT_MAINTENANCE: ${{ steps.document-mode.outputs.configured }}
          PROTECTED_DOCUMENT_DELIVERY_ENABLED: ${{ steps.document-mode.outputs.enabled }}
          CLOUDSQL_INSTANCE: ${{ env.PROD_CLOUDSQL_INSTANCE }}
        run: |
          set -euo pipefail
          bash deploy/drive/deploy_worker_service_prod.sh
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          digest = hashlib.sha256(Path(os.environ["DRIVE_WORKER_STAGE_RECEIPT"]).read_bytes()).hexdigest()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as target:
              target.write(f"prepared_sha256={digest}\n")
          PY

      - name: Publish prepared worker intent
        id: prepared-worker-intent
        uses: actions/upload-artifact@v4
        with:
          name: prod-drive-worker-intent-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/worker-stage/worker-stage.json
            ${{ runner.temp }}/worker-stage/worker-stage.json.scheduler.json

      - name: Stage private production Drive worker
        if: steps.prepared-worker-intent.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DRIVE_WORKER_RELEASE_PHASE: stage
          ENABLE_PRODUCTION_DRIVE_LIVE: ${{ steps.drive-mode.outputs.active }}
          PROTECTED_DOCUMENT_MAINTENANCE: ${{ steps.document-mode.outputs.configured }}
          PROTECTED_DOCUMENT_DELIVERY_ENABLED: ${{ steps.document-mode.outputs.enabled }}
          CLOUDSQL_INSTANCE: ${{ env.PROD_CLOUDSQL_INSTANCE }}
          DRIVE_WORKER_STAGE_INTENT_SHA256: ${{ steps.prepare-worker.outputs.prepared_sha256 }}
        run: bash deploy/drive/deploy_worker_service_prod.sh

      - name: Publish staged worker qualification
        uses: actions/upload-artifact@v4
        with:
          name: prod-drive-worker-stage-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/worker-stage/worker-stage.json
            ${{ runner.temp }}/worker-stage/worker-stage.json.staged.json
            ${{ runner.temp }}/worker-stage/worker-stage.json.scheduler.json


  complete-phone-activation:
    name: ${{ inputs.phone_phase == 'activate' && 'Deploy Production Scope' || 'Activation continuation not selected' }}
    if: github.event_name == 'workflow_dispatch' && inputs.phone_phase == 'activate'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONPATH: ${{ github.workspace }}/scripts/ci
      TARGET_SHA: ${{ inputs.sha }}
      ORIGINAL_RUN_ID: ${{ inputs.phone_activation_run_id }}
      REQUESTED_SCOPE: ${{ inputs.scope }}
      REQUESTED_DRIVE_MODE: ${{ inputs.drive_live_mode }}
    steps:
      - name: Assert manual activation continuation originates from main
        shell: bash
        env:
          CADENCE_ORIGIN: ${{ inputs.cadence_origin }}
          PHONE_ROLLBACK_SHA: ${{ inputs.phone_rollback_sha }}
          SCHEMA_ORIGIN_RUN: ${{ inputs.phone_schema_origin_run_id }}
          SCHEMA_ORIGIN_ATTEMPT: ${{ inputs.phone_schema_origin_attempt }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == main && "$PHONE_DEPLOY_PHASE" == activate ]]
          [[ "$ORIGINAL_RUN_ID" =~ ^[1-9][0-9]*$ && "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REQUESTED_SCOPE" == backend || "$REQUESTED_SCOPE" == all ]]
          [[ "$REQUESTED_DRIVE_MODE" == preserve ]]
          [[ -z "$CADENCE_ORIGIN$PHONE_ROLLBACK_SHA$SCHEMA_ORIGIN_RUN$SCHEMA_ORIGIN_ATTEMPT" ]]

      - name: Checkout current release tooling
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Require reconciled maintenance mutations under deployment lock
        run: |
          set -euo pipefail
          python3 scripts/ci/uat-retention-maintenance.py --environment production \
            --check-mutations --state-dir "$RUNNER_TEMP/production-maintenance-guard"

      - name: Assert production dispatch actor policy
        run: python3 scripts/ci/assert-governed-actor.py --surface production --actor "$GITHUB_ACTOR"

      - name: Validate deployment SHA against main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUIRED_BRANCH: main
          REQUIRE_CI_SUCCESS: "1"
          REQUIRED_CHECK_NAME: Main Post-Merge Smoke Gate
        run: bash scripts/ci/require-deploy-sha-on-main.sh "$TARGET_SHA"

      - name: Set up Python + uv runtime
        uses: ./consent-protocol/.github/actions/setup-python-uv
        with:
          python-version: "3.13"
          protocol-dir: ./consent-protocol
          sync-dev-group: "false"

      - name: Validate production WIF configuration
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test -n "$WIF_PROVIDER"
          test -n "$DEPLOY_SERVICE_ACCOUNT"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          project_id: ${{ env.GCP_PROJECT_ID }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Assert GCP project scope
        run: |
          set -euo pipefail
          gcloud config set project "$GCP_PROJECT_ID"
          [[ "$(gcloud config get-value project 2>/dev/null)" == hushh-pda ]]

      - name: Install Cloud SQL Auth Proxy
        run: |
          set -euo pipefail
          curl -fsSL https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.18.3/cloud-sql-proxy.linux.amd64 \
            -o /usr/local/bin/cloud-sql-proxy
          chmod +x /usr/local/bin/cloud-sql-proxy

      - name: Require qualified activation continuation
        id: origin
        run: |
          set -euo pipefail
          mkdir -p /tmp/phone-rollback
          "$PROTOCOL_PYTHON" - <<'PY'
          import json, os
          from pathlib import Path
          import production_activation_continuation as continuation
          import production_backend_successor_control as control
          import production_backend_successor_proof as proof
          owner = control.authority()
          anchor = control.record_anchor(proof.read_original())
          if anchor is None:
              raise SystemExit("An independently qualified operational reference is required")
          origin = continuation.load_original(
              os.environ["ORIGINAL_RUN_ID"], os.environ["TARGET_SHA"],
              repository=os.environ["GITHUB_REPOSITORY"], operational_anchor=anchor,
              api=owner.api, governed=owner.governed_dispatch,
              timestamp=owner._github_timestamp,
              run_command=owner.retention.run_command, timeout=60,
          )
          if origin["scope"] != os.environ["REQUESTED_SCOPE"]:
              raise SystemExit("Continuation scope must equal the original pending release")
          with Path("/tmp/prod-activation-origin.json").open("x") as output:
              json.dump(origin, output, indent=2, sort_keys=True)
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"scope={origin['scope']}\n")
              output.write(f"run_id={origin['original']['run_id']}\n")
              output.write(f"backend_revision={origin['candidate']['revision']}\n")
              output.write(f"cold_revision={origin['cold_rollback']['revision']}\n")
          PY

      - name: Require exact-SHA UAT acceptance
        run: |
          set -euo pipefail
          python3 scripts/ci/verify-predecessor-acceptance.py require \
            --environment uat --sha "$TARGET_SHA" --scope "${{ steps.origin.outputs.scope }}" \
            --output /tmp/prod-predecessor-acceptance.json

      - name: Enforce production database connection budget before deployment
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=2s 295s python3 scripts/ci/runtime-capacity-budget.py \
            --environment production --phase post-release --no-candidates

      - name: Capture current serving state without changing traffic
        id: serving
        run: |
          set -euo pipefail
          gcloud run services describe "$BACKEND_SERVICE" --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" --format=json > /tmp/prod-activation-backend-service.json
          gcloud run services describe "$FRONTEND_SERVICE" --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" --format=json > /tmp/prod-activation-frontend-service.json
          for lane in backend frontend; do
            python3 scripts/ci/resolve-cloud-run-serving-state.py \
              --service-json "/tmp/prod-activation-${lane}-service.json" \
              --github-output "$GITHUB_OUTPUT" --output-prefix "$lane" >/dev/null
          done
          gcloud run revisions describe "${{ steps.origin.outputs.backend_revision }}" \
            --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format=json \
            > /tmp/prod-activation-backend-revision.json

      - name: Prepare qualified phone rollback and producer stage
        id: phone-rollback-plan
        run: |
          set -euo pipefail
          # Use the parent's operational-first owner; preserve the actual snapshot.
          python3 deploy/phone/plan.py prepare --run-id "$GITHUB_RUN_ID" \
            --primary-sha "$TARGET_SHA" --enable-recovery false \
            --operational-only \
            --current-json /tmp/prod-activation-backend-revision.json \
            --release-tools scripts/ci --output /tmp/phone-rollback/plan.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Resolve retained protected document maintenance
        id: document-mode
        run: |
          set -euo pipefail
          git log -1 --diff-filter=A --format=%H -- consent-protocol/api/routes/document_delivery.py \
            > /tmp/prod-protected-document-reader-commit
          test -s /tmp/prod-protected-document-reader-commit
          "$PROTOCOL_PYTHON" deploy/drive/resolve_protected_document_release.py \
            --project "$GCP_PROJECT_ID" --environment production --target-sha "$TARGET_SHA" \
            --required-ancestor "$(cat /tmp/prod-protected-document-reader-commit)" \
            --github-output "$GITHUB_OUTPUT" | tee /tmp/prod-protected-document-release.json

      - name: Verify protected document reader and rollback compatibility
        if: steps.document-mode.outputs.configured == 'true'
        run: |
          set -euo pipefail
          "$PROTOCOL_PYTHON" deploy/drive/resolve_protected_document_release.py \
            --project "$GCP_PROJECT_ID" --environment production --target-sha "$TARGET_SHA" \
            --required-ancestor "$(cat /tmp/prod-protected-document-reader-commit)" \
            --verify-previous --json-output /tmp/prod-document-reader-compatibility.json

      - name: Revalidate actual phone rollback after backend deployment attempt
        id: phone-rollback-qualified
        run: |
          set -euo pipefail
          python3 deploy/phone/plan.py verify --run-id "$GITHUB_RUN_ID" \
            --primary-sha "$TARGET_SHA" --plan /tmp/phone-rollback/plan.json \
            --output /tmp/phone-rollback/qualified.json --github-output "$GITHUB_OUTPUT"
          "$PROTOCOL_PYTHON" deploy/phone/workos_rollout.py \
            --project "$GCP_PROJECT_ID" --output /tmp/phone-rollback/workos-after.json
          if [[ "${{ steps.document-mode.outputs.configured }}" == true ]]; then
            "$PROTOCOL_PYTHON" deploy/drive/resolve_protected_document_release.py \
              --project "$GCP_PROJECT_ID" --environment production \
              --required-ancestor "$(cat /tmp/prod-protected-document-reader-commit)" \
              --rollback-report /tmp/prod-document-reader-compatibility.json \
              --rebind-backend-report /tmp/phone-rollback/qualified.json
          fi

      - name: Migration governance and DB drift gate
        run: |
          set -euo pipefail
          # Materialize the approved target's immutable schema inputs without
          # switching the checkout or replacing current verification tools.
          target_schema="$RUNNER_TEMP/activation-target-schema"
          mkdir -p "$target_schema"
          git archive "$TARGET_SHA" consent-protocol/db/migrations \
            consent-protocol/db/contracts/prod_core_schema.json \
            consent-protocol/db/release_migration_manifest.json \
            | tar -x -C "$target_schema"
          DB_USER="$(gcloud secrets versions access latest --secret=DB_USER --project="$GCP_PROJECT_ID")"
          DB_PASSWORD="$(gcloud secrets versions access latest --secret=DB_PASSWORD --project="$GCP_PROJECT_ID")"
          echo "::add-mask::${DB_USER}"
          echo "::add-mask::${DB_PASSWORD}"
          cloud-sql-proxy --address 127.0.0.1 --port 6544 \
            ${GOOGLE_GHA_CREDS_PATH:+--credentials-file="${GOOGLE_GHA_CREDS_PATH}"} \
            "$PROD_CLOUDSQL_INSTANCE" >/tmp/cloud-sql-proxy-prod-drift-gate.log 2>&1 &
          PROXY_PID=$!
          cleanup_proxy() {
            kill "$PROXY_PID" >/dev/null 2>&1 || true
            for _ in {1..20}; do
              if ! kill -0 "$PROXY_PID" 2>/dev/null; then
                wait "$PROXY_PID" 2>/dev/null || true
                return
              fi
              sleep 0.25
            done
            kill -KILL "$PROXY_PID" >/dev/null 2>&1 || true
            wait "$PROXY_PID" 2>/dev/null || true
          }
          trap cleanup_proxy EXIT
          python3 - <<'PY'
          import socket, time
          deadline = time.monotonic() + 20
          while time.monotonic() < deadline:
              with socket.socket() as sock:
                  sock.settimeout(0.5)
                  if sock.connect_ex(("127.0.0.1", 6544)) == 0:
                      raise SystemExit(0)
              time.sleep(0.25)
          raise SystemExit("Owned Cloud SQL proxy did not bind")
          PY
          export DB_HOST=127.0.0.1 DB_PORT=6544 DB_NAME="$PROD_DB_NAME" DB_USER DB_PASSWORD
          "$PROTOCOL_PYTHON" scripts/ops/db_migration_release_guard.py \
            --release-environment production \
            --migrations-dir "$target_schema/consent-protocol/db/migrations" \
            --contract-file "$target_schema/consent-protocol/db/contracts/prod_core_schema.json" \
            --manifest-file "$target_schema/consent-protocol/db/release_migration_manifest.json" \
            --report-path /tmp/db-migration-guard-report.json

      - name: Qualify production CRM availability
        id: crm-availability
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, runpy
          from pathlib import Path
          owner = runpy.run_path("consent-protocol/hushh_mcp/services/crm_product_availability.py")
          available = owner["crm_product_available"](environment="production")
          assert type(available) is bool
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"required={str(available).lower()}\n")
          Path("/tmp/prod-connected-systems-availability.json").write_text(json.dumps({
              "environment": "production", "sha": os.environ["TARGET_SHA"],
              "available": available, "status": "required" if available else "not_applicable_product_paused",
              "transport_verified": False,
          }))
          PY

      - name: Verify production candidate runtime env parity
        id: verify-parity
        env:
          CRM_REQUIRED: ${{ steps.crm-availability.outputs.required }}
        run: |
          set -euo pipefail
          connected_systems=()
          case "$CRM_REQUIRED" in
            true) connected_systems=(--require-connected-systems) ;;
            false) ;;
            *) exit 1 ;;
          esac
          python3 scripts/ops/verify-env-secrets-parity.py --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" --backend-service "$BACKEND_SERVICE" \
            --frontend-service "$FRONTEND_SERVICE" \
            --backend-revision "${{ steps.origin.outputs.backend_revision }}" \
            --frontend-revision "${{ steps.serving.outputs.frontend_revision }}" \
            --require-plaid --require-market-data --require-gmail --require-calendar \
            "${connected_systems[@]}" --require-prod-phone-test --assert-runtime-env-contract \
            --report-path /tmp/prod-runtime-parity.json

      - name: Verify production Connected Systems Omni Gateway
        id: verify-connected-systems
        env:
          CRM_REQUIRED: ${{ steps.crm-availability.outputs.required }}
        run: |
          set -euo pipefail
          case "$CRM_REQUIRED" in
            false) echo "qualification=not_applicable_product_paused" >> "$GITHUB_OUTPUT"; exit 0 ;;
            true) ;;
            *) exit 1 ;;
          esac
          "$PROTOCOL_PYTHON" scripts/ops/verify_connected_systems_gateway.py \
            --project "$GCP_PROJECT_ID" 2>&1 | tee /tmp/prod-connected-systems.log
          echo "qualification=verified" >> "$GITHUB_OUTPUT"

      - name: Verify production backend deployment provenance
        id: verify-backend-provenance
        run: |
          set -euo pipefail
          "$PROTOCOL_PYTHON" scripts/ci/verify-cloudrun-revision-provenance.py \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --service "$BACKEND_SERVICE" \
            --expected-env production --expected-source deploy-production --expected-sha "$TARGET_SHA" \
            --expected-run-id "${{ steps.origin.outputs.run_id }}" --report-path /tmp/prod-backend-provenance.json

      - name: Verify production frontend deployment provenance
        id: verify-frontend-provenance
        if: steps.origin.outputs.scope == 'all'
        run: |
          set -euo pipefail
          "$PROTOCOL_PYTHON" scripts/ci/verify-cloudrun-revision-provenance.py \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --service "$FRONTEND_SERVICE" \
            --expected-env production --expected-source deploy-production --expected-sha "$TARGET_SHA" \
            --expected-run-id "${{ steps.origin.outputs.run_id }}" --report-path /tmp/prod-frontend-provenance.json

      - name: Post-deploy backend runtime health gate
        id: health-backend
        run: bash scripts/ci/cloudrun-http-health.sh "$CONSENT_API_PUBLIC_ORIGIN" /health 5 30 5 200

      - name: Post-deploy frontend runtime health gate
        id: health-frontend
        if: steps.origin.outputs.scope == 'all'
        run: bash scripts/ci/cloudrun-http-health.sh "$APP_FRONTEND_ORIGIN" / 3 30 5 200

      - name: Verify production account-session contract
        id: health-account-session-contract
        run: bash scripts/ci/cloudrun-http-health.sh "$CONSENT_API_PUBLIC_ORIGIN" /api/account/session-status 3 30 5 401

      - name: Verify production native passkey domain associations
        id: verify-passkey-associations
        if: steps.origin.outputs.scope == 'all'
        run: python3 scripts/ops/verify_passkey_domain_associations.py --project "$GCP_PROJECT_ID" --origin "$APP_FRONTEND_ORIGIN"

      - name: Classify production release outcome
        id: classify
        if: always()
        env:
          PRIOR_JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          failed=true
          [[ "$PRIOR_JOB_STATUS" != success ]] || failed=false
          echo "release_failed=$failed" >> "$GITHUB_OUTPUT"
          # No traffic promotion took place. This classification does not claim one.
          echo "promote_failed=false" >> "$GITHUB_OUTPUT"
          echo "backend_provenance_failed=${{ steps.verify-backend-provenance.outcome != 'success' }}" >> "$GITHUB_OUTPUT"
          if [[ "${{ steps.origin.outputs.scope }}" == all && "${{ steps.verify-frontend-provenance.outcome }}" != success ]]; then
            echo "frontend_provenance_failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend_provenance_failed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Activate tombstone-aware account deletion
        id: activate-account-deletion
        if: steps.classify.outputs.release_failed == 'false'
        run: |
          set -euo pipefail
          # Small read-only composition of the existing observe/contract owners.
          # This same readback is repeated after activation before healthy status.
          cat > /tmp/prod-activation-boundary.py <<'PY'
          import json, os, runpy
          from pathlib import Path
          from types import SimpleNamespace
          import production_phone_receipt as phone
          import production_backend_successor_control as control
          import production_backend_successor_proof as proof
          owner = runpy.run_path("deploy/account-deletion/activate_release.py")
          anchor = control.record_anchor(proof.read_original())
          if anchor is None:
              raise SystemExit("Operational rollback reference disappeared")
          control.live(anchor)
          def require(condition):
              if not condition:
                  raise SystemExit("Activation boundary no longer matches its qualified origin")
          origin = json.loads(Path("/tmp/prod-activation-origin.json").read_text())
          plan = json.loads(Path("/tmp/phone-rollback/plan.json").read_text())
          qualified = json.loads(Path("/tmp/phone-rollback/qualified.json").read_text())
          cold = phone.qualified_reader(qualified, plan, origin["sha"], {"id": int(os.environ["GITHUB_RUN_ID"])})
          runtime = phone.operational_runtime(qualified, plan)
          require(all(cold[key] == origin["cold_rollback"][key] for key in ("revision", "source", "image")))
          require(runtime["uid"] == origin["cold_rollback"]["uid"])
          require(plan["operational_reference"]["origin"] == origin["cold_rollback"]["origin"])
          mode = json.loads(Path("/tmp/prod-protected-document-release.json").read_text())
          require(mode == origin["protected_documents"]["mode"])
          report = json.loads(Path("/tmp/prod-document-reader-compatibility.json").read_text()) if mode["configured"] else None
          phone.qualified_documents(mode, report, cold, origin["sha"])
          expected = origin["candidate"]
          args = SimpleNamespace(
              project="hushh-pda", region="us-central1", backend_service="consent-protocol",
              expected_sha=origin["sha"], expected_run_id=str(origin["original"]["run_id"]),
          )
          service, revisions, name = owner["observe"](args)
          selected = [row for row in revisions if row["metadata"]["name"] == name]
          require(len(selected) == 1 and name == expected["revision"])
          revision = selected[0]
          require(revision["metadata"].get("uid") == expected["uid"])
          require(service["metadata"].get("uid") == expected["service_uid"])
          require(service["metadata"].get("generation") is not None)
          require(str(service["status"].get("observedGeneration")) == str(service["metadata"]["generation"]))
          require(all(any(row.get("type") == "Ready" and row.get("status") == "True"
                          for row in document.get("status", {}).get("conditions", []))
                      for document in (service, revision)))
          if origin["scope"] == "all":
              frontend = json.loads(owner["run"]([
                  "gcloud", "run", "services", "describe", "hushh-webapp",
                  "--project=hushh-pda", "--region=us-central1", "--format=json",
              ]))
              positive = [row for row in frontend.get("status", {}).get("traffic", []) if row.get("percent", 0) > 0]
              require(len(positive) == 1 and positive[0].get("percent") == 100
                      and positive[0].get("revisionName") == origin["frontend"]["revision"])
          Path("/tmp/prod-activation-boundary.json").write_text(json.dumps({
              "revision": name, "uid": expected["uid"], "service_uid": expected["service_uid"],
              "sha": origin["sha"], "run_id": origin["original"]["run_id"], "qualification": "passed",
          }))
          PY
          "$PROTOCOL_PYTHON" /tmp/prod-activation-boundary.py
          bash scripts/ci/assert-cloud-run-runtime-identity.sh \
            "$GCP_PROJECT_ID" "$GCP_REGION" "${{ steps.origin.outputs.backend_revision }}" "$RUNTIME_SERVICE_ACCOUNT"
          "$PROTOCOL_PYTHON" deploy/account-deletion/activate_release.py \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --backend-service "$BACKEND_SERVICE" \
            --backend-url "$CONSENT_API_PUBLIC_ORIGIN" --oidc-audience "$CONSENT_API_PUBLIC_ORIGIN" \
            --scheduler-job "$ACCOUNT_DELETION_SCHEDULER_JOB" \
            --scheduler-service-account "$ACCOUNT_DELETION_SCHEDULER_SERVICE_ACCOUNT_ID" \
            --expected-sha "$TARGET_SHA" --expected-run-id "${{ steps.origin.outputs.run_id }}" \
            --cloudsql-instance "$PROD_CLOUDSQL_INSTANCE" --db-name "$PROD_DB_NAME" --db-port 6544 \
            --fence-required true --evidence-prefix /tmp/prod-account-deletion
          "$PROTOCOL_PYTHON" - <<'PY'
          import json, os
          from pathlib import Path
          from production_activation_continuation import validate_activated
          origin = json.loads(Path("/tmp/prod-activation-origin.json").read_text())
          activation = json.loads(Path("/tmp/prod-account-deletion-activation.json").read_text())
          validate_activated(origin, activation, os.environ["TARGET_SHA"])
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("activated=true\n")
          PY

      - name: Refresh actual phone rollback and protected reader after activation
        if: steps.activate-account-deletion.outputs.activated == 'true'
        run: |
          set -euo pipefail
          python3 deploy/phone/plan.py verify --run-id "$GITHUB_RUN_ID" \
            --primary-sha "$TARGET_SHA" --plan /tmp/phone-rollback/plan.json \
            --output /tmp/phone-rollback/qualified.json --github-output "$GITHUB_OUTPUT"
          if [[ "${{ steps.document-mode.outputs.configured }}" == true ]]; then
            "$PROTOCOL_PYTHON" deploy/drive/resolve_protected_document_release.py \
              --project "$GCP_PROJECT_ID" --environment production --target-sha "$TARGET_SHA" \
              --required-ancestor "$(cat /tmp/prod-protected-document-reader-commit)" \
              --verify-previous --json-output /tmp/prod-document-reader-compatibility.json
            "$PROTOCOL_PYTHON" deploy/drive/resolve_protected_document_release.py \
              --project "$GCP_PROJECT_ID" --environment production \
              --required-ancestor "$(cat /tmp/prod-protected-document-reader-commit)" \
              --rollback-report /tmp/prod-document-reader-compatibility.json \
              --rebind-backend-report /tmp/phone-rollback/qualified.json
          fi

      - name: Resolve final Cloud Run state
        id: final-state
        if: always()
        run: |
          set -euo pipefail
          if [[ "${{ steps.activate-account-deletion.outcome }}" == success ]]; then
            "$PROTOCOL_PYTHON" /tmp/prod-activation-boundary.py
          fi
          for lane in backend frontend; do
            if [[ "$lane" == backend ]]; then service="$BACKEND_SERVICE"; else service="$FRONTEND_SERVICE"; fi
            gcloud run services describe "$service" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" \
              --format=json > "/tmp/prod-activation-${lane}-final-service.json"
            python3 scripts/ci/resolve-cloud-run-serving-state.py \
              --service-json "/tmp/prod-activation-${lane}-final-service.json" \
              --github-output "$GITHUB_OUTPUT" --output-prefix "$lane" >/dev/null
          done

      - name: Write production release status artifact
        id: release-status
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          ORIGINAL_SCOPE: ${{ steps.origin.outputs.scope }}
          BACKEND_INITIAL: ${{ steps.serving.outputs.backend_revision }}
          FRONTEND_INITIAL: ${{ steps.serving.outputs.frontend_revision }}
          BACKEND_FINAL: ${{ steps.final-state.outputs.backend_revision }}
          FRONTEND_FINAL: ${{ steps.final-state.outputs.frontend_revision }}
          ACTIVATED: ${{ steps.activate-account-deletion.outputs.activated }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          healthy = (os.environ["JOB_STATUS"] == "success" and os.environ["ACTIVATED"] == "true"
                     and os.environ["BACKEND_FINAL"] == os.environ["BACKEND_INITIAL"]
                     and os.environ["FRONTEND_FINAL"] == os.environ["FRONTEND_INITIAL"])
          payload = {
              "status": "healthy" if healthy else "blocked", "sha": os.environ["TARGET_SHA"],
              "scope": os.environ["ORIGINAL_SCOPE"] or os.environ["REQUESTED_SCOPE"],
              "predeploy": {"backend_revision": os.environ["BACKEND_INITIAL"], "frontend_revision": os.environ["FRONTEND_INITIAL"]},
              "candidate": {"backend_revision": os.environ["BACKEND_INITIAL"], "frontend_revision": os.environ["FRONTEND_INITIAL"]},
              "final": {"backend_revision": os.environ["BACKEND_FINAL"], "frontend_revision": os.environ["FRONTEND_FINAL"]},
              "verification": {
                  "runtime_parity": "${{ steps.verify-parity.outcome }}",
                  "connected_systems": "${{ steps.verify-connected-systems.outcome }}",
                  "connected_systems_product_available": "${{ steps.crm-availability.outputs.required }}",
                  "connected_systems_qualification": "${{ steps.verify-connected-systems.outputs.qualification }}",
                  "backend_provenance": "${{ steps.verify-backend-provenance.outcome }}",
                  "frontend_provenance": "${{ steps.verify-frontend-provenance.outcome }}",
                  "backend_health": "${{ steps.health-backend.outcome }}",
                  "frontend_health": "${{ steps.health-frontend.outcome }}",
                  "passkey_domain_associations": "${{ steps.verify-passkey-associations.outcome }}",
                  "account_deletion_fence_required": "true",
                  "account_deletion_activation": "${{ steps.activate-account-deletion.outcome }}",
                  "account_deletion_activated": os.environ["ACTIVATED"],
              },
              "classification": {
                  "release_failed": "${{ steps.classify.outputs.release_failed }}",
                  "promote_failed": "${{ steps.classify.outputs.promote_failed }}",
                  "backend_provenance_failed": "${{ steps.classify.outputs.backend_provenance_failed }}",
                  "frontend_provenance_failed": "${{ steps.classify.outputs.frontend_provenance_failed }}",
              },
              "phone_rollback": {"revision": "${{ steps.phone-rollback-qualified.outputs.revision }}",
                                 "qualification": "${{ steps.phone-rollback-qualified.outcome }}", "recovery_enabled": "false"},
              "rollback": {"backend": "skipped", "frontend": "skipped", "drive_jobs": "skipped"},
          }
          predecessor = Path("/tmp/prod-predecessor-acceptance.json")
          payload["predecessor_acceptance"] = json.loads(predecessor.read_text()) if predecessor.exists() else None
          Path("/tmp/prod-release-status.json").write_text(json.dumps(payload, indent=2))
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"status={payload['status']}\n")
          PY

      - name: Upload production deploy artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-release-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: |
            /tmp/prod-release-status.json
            /tmp/prod-activation-origin.json
            /tmp/prod-account-deletion-activation.json
            /tmp/prod-account-deletion-*.log
            /tmp/prod-account-deletion-scheduler-*.json
            /tmp/prod-account-deletion-revision-retirement.json
            /tmp/prod-account-deletion-cleanup-health.json
            /tmp/prod-activation-boundary.json
            /tmp/phone-rollback/
            /tmp/prod-protected-document-release.json
            /tmp/prod-document-reader-compatibility.json
            /tmp/prod-runtime-parity.json
            /tmp/prod-connected-systems-availability.json
            /tmp/prod-connected-systems.log
            /tmp/prod-backend-provenance.json
            /tmp/prod-frontend-provenance.json
            /tmp/db-migration-guard-report.json
            /tmp/prod-predecessor-acceptance.json

      - name: Tag this release as last known good
        id: tag-last-known-good
        if: success() && steps.release-status.outputs.status == 'healthy'
        env:
          ENVIRONMENT: production
          SHA: ${{ inputs.sha }}
          BACKEND_REVISION: ${{ steps.final-state.outputs.backend_revision }}
          BACKEND_SERVICE_URL: ${{ env.CONSENT_API_PUBLIC_ORIGIN }}
          FRONTEND_REVISION: ${{ steps.final-state.outputs.frontend_revision }}
          FRONTEND_SERVICE_URL: ${{ env.APP_FRONTEND_ORIGIN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          # Parent must wire the tag owner's strict continuation-origin support.
          # No direct tag write or modified activation run ID is substituted here.
          bash scripts/ci/tag-last-known-good.sh
          "$PROTOCOL_PYTHON" - <<'PY'
          import os
          import production_backend_successor as reference
          import production_backend_successor_proof as proof
          current = proof.read_original()
          healthy, operational = reference.split(current["message"], current["commit"])
          fields = dict(line.split(": ", 1) for line in healthy.splitlines()[1:])
          if (operational is not None or current["commit"] != os.environ["TARGET_SHA"]
              or fields["backend_revision"] != os.environ["BACKEND_REVISION"]
              or fields["frontend_revision"] != os.environ["FRONTEND_REVISION"]
              or fields["run"] != os.environ["RUN_URL"]):
              raise SystemExit("Healthy production reference was not confirmed")
          PY

      - name: Fail workflow when production release did not end healthy
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          if json.loads(Path("/tmp/prod-release-status.json").read_text())["status"] != "healthy":
              raise SystemExit("Activation continuation is blocked; no healthy result or rollback is claimed")
          PY
