name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Exact green main SHA to deploy"
        required: true
        type: string
      scope:
        description: "Deploy backend only, frontend only, or both"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - backend
          - frontend
      run_predeploy_backup_job:
        description: "Optionally take an on-demand Cloud SQL backup before the deploy gate"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      enable_one_email_kyc:
        description: "Enable production One Email KYC only after mailbox-watch ownership and encrypted-draft gates are complete"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      drive_live_mode:
        description: "Preserve current Drive state; explicitly enable after provider verification or disable with rollback"
        required: true
        default: preserve
        type: choice
        options:
          - preserve
          - enable
          - disable
      backend_image_source:
        description: "Backend image: build-from-source (rebuild at this SHA, today's path) or promote-from-uat (copy the exact digest UAT verified for this SHA; needs the IAM in deploy/iam/README.md)"
        required: true
        default: "build-from-source"
        type: choice
        options:
          - build-from-source
          - promote-from-uat
      nearby_check_in_cohort:
        description: "Nearby check-in audience. Leave this as 'all' for a normal deploy. Clearing it turns nearby check-in OFF in production, which is the kill switch; a comma-separated list of user ids restricts it to those accounts."
        required: false
        default: "all"
        type: string

permissions:
  # write: this workflow tags a healthy release as "last known good"
  # (scripts/ci/tag-last-known-good.sh) so a future revert check and a
  # future rollback both have a durable anchor. Scoped to pushing tags only
  # — the workflow never touches a branch.
  contents: write
  checks: read
  id-token: write

env:
  GCP_PROJECT_ID: hushh-pda
  GCP_REGION: us-central1
  BACKEND_SERVICE: consent-protocol
  RUNTIME_SERVICE_ACCOUNT: consent-protocol-runtime@hushh-pda.iam.gserviceaccount.com
  FRONTEND_SERVICE: hushh-webapp
  APP_FRONTEND_ORIGIN: https://one.hushh.ai
  CONSENT_API_PUBLIC_ORIGIN: https://api.hushh.ai
  BACKEND_REVISION_RETENTION: "3"
  FRONTEND_REVISION_RETENTION: "10"
  PROD_CLOUDSQL_INSTANCE_NAME: hushh-vault-db
  PROD_CLOUDSQL_INSTANCE: hushh-pda:us-central1:hushh-vault-db
  PROD_DB_UNIX_SOCKET: /cloudsql/hushh-pda:us-central1:hushh-vault-db
  PROD_DB_NAME: hushh_vault
  ACCOUNT_DELETION_SCHEDULER_SERVICE_ACCOUNT_ID: account-deletion-cleanup
  ACCOUNT_DELETION_SCHEDULER_JOB: account-deletion-cleanup-production
  BACKUP_MAX_AGE_HOURS: "30"
  # Read-only source for backend_image_source=promote-from-uat. Production never
  # deploys from this registry; it copies the verified digest into its own.
  UAT_GCP_PROJECT_ID: hushh-pda-uat
  UAT_BACKEND_IMAGE_REPOSITORY: gcr.io/hushh-pda-uat/consent-protocol
  PROTOCOL_PYTHON: ${{ github.workspace }}/consent-protocol/.venv/bin/python
  # run_attempt changes on a workflow rerun; a rerun must never rewrite the
  # :latest config of a candidate revision already serving from this run ID.
  DRIVE_CANDIDATE_RUNTIME_SECRET: BACKEND_RUNTIME_CONFIG_JSON_DRIVE_${{ github.run_id }}_${{ github.run_attempt }}

# One global group: the account deletion fence, migration, and activation
# must never interleave between two production dispatches, even for different
# SHAs. Queued runs wait; an in-flight release is never cancelled mid-fence.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Production Scope
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment: production

    steps:
      - name: Assert manual dispatch originates from main
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "Refusing production deploy from '${GITHUB_REF_NAME}'. Trigger this workflow from 'main' only."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Assert production dispatch actor policy
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/assert-governed-actor.py --surface production --actor "${GITHUB_ACTOR}"

      - name: Validate deployment SHA against main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUIRED_BRANCH: main
          REQUIRE_CI_SUCCESS: "1"
          REQUIRED_CHECK_NAME: "Main Post-Merge Smoke Gate"
        run: bash scripts/ci/require-deploy-sha-on-main.sh "${{ github.event.inputs.sha }}"

      - name: Preserve current release tooling
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/release-tools"
          cp scripts/ci/resolve-cloud-run-deploy-revision.py \
            "${RUNNER_TEMP}/release-tools/resolve-cloud-run-deploy-revision.py"
          # The deployment SHA may predate this verifier; always use main's.
          cp scripts/ci/resolve-uat-verified-image.py \
            "${RUNNER_TEMP}/release-tools/resolve-uat-verified-image.py"
          # Release gates come from current main even when the exact UAT image
          # is older than this workflow's production voice enablement.
          cp deploy/backend.cloudbuild.yaml \
            "${RUNNER_TEMP}/release-tools/backend.cloudbuild.yaml"
          cp scripts/ci/assert_one_voice_live_probe.py \
            "${RUNNER_TEMP}/release-tools/assert_one_voice_live_probe.py"
          # Orchestration must remain current when rolling back to an older image.
          mkdir -p "${RUNNER_TEMP}/release-tools/drive"
          for tool in resolve_prod_release_mode.py verify_prod_prerequisites.py \
            deploy_worker_service_prod.sh setup_work_drain_scheduler_prod.sh \
            work_drain_scheduler_snapshot_prod.py restore_prod_after_release_failure.sh; do
            cp "deploy/drive/${tool}" "${RUNNER_TEMP}/release-tools/drive/${tool}"
          done
          cp scripts/ops/sync_backend_runtime_secrets.py \
            "${RUNNER_TEMP}/release-tools/sync_backend_runtime_secrets.py"
          git log -1 --diff-filter=A --format=%H -- \
            consent-protocol/hushh_mcp/services/drive_prod_registry_provisioning.py \
            > "${RUNNER_TEMP}/release-tools/prod-drive-feature-commit"
          cp scripts/ci/verify-prod-places-readiness.py \
            "${RUNNER_TEMP}/release-tools/verify-prod-places-readiness.py"

      - name: Checkout deployment SHA
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "${{ github.event.inputs.sha }}"
          cp "${RUNNER_TEMP}/release-tools/backend.cloudbuild.yaml" \
            deploy/backend.cloudbuild.yaml
          cp "${RUNNER_TEMP}/release-tools/assert_one_voice_live_probe.py" \
            scripts/ci/assert_one_voice_live_probe.py
          mkdir -p deploy/drive
          cp "${RUNNER_TEMP}/release-tools/drive/"* deploy/drive/
          cp "${RUNNER_TEMP}/release-tools/sync_backend_runtime_secrets.py" \
            scripts/ops/sync_backend_runtime_secrets.py

      - name: Report production deploy lane
        run: |
          echo "Governed production deploy: using production environment."

      - name: Validate Google Cloud workload identity configuration
        shell: bash
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test -n "$WIF_PROVIDER" || { echo "Missing environment variable GCP_WORKLOAD_IDENTITY_PROVIDER" >&2; exit 1; }
          test -n "$DEPLOY_SERVICE_ACCOUNT" || { echo "Missing environment variable GCP_DEPLOY_SERVICE_ACCOUNT" >&2; exit 1; }

      - name: Authenticate to Google Cloud
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          project_id: ${{ env.GCP_PROJECT_ID }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set GCP project context
        run: gcloud config set project "${{ env.GCP_PROJECT_ID }}"

      - name: Assert GCP project scope
        shell: bash
        run: |
          set -euo pipefail
          ACTIVE_PROJECT="$(gcloud config get-value project 2>/dev/null)"
          if [ "$ACTIVE_PROJECT" != "${{ env.GCP_PROJECT_ID }}" ]; then
            echo "Refusing deploy: expected project '${{ env.GCP_PROJECT_ID }}' but got '$ACTIVE_PROJECT'."
            exit 1
          fi

      - name: Capture predeploy Cloud Run state
        id: predeploy-state
        shell: bash
        run: |
          set -euo pipefail

          if ! gcloud run services describe "${{ env.BACKEND_SERVICE }}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --region="${{ env.GCP_REGION }}" \
            --format=json > /tmp/prod-backend-predeploy-service.json 2>/dev/null; then
            printf '{}\n' > /tmp/prod-backend-predeploy-service.json
          fi
          if ! gcloud run services describe "${{ env.FRONTEND_SERVICE }}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --region="${{ env.GCP_REGION }}" \
            --format=json > /tmp/prod-frontend-predeploy-service.json 2>/dev/null; then
            printf '{}\n' > /tmp/prod-frontend-predeploy-service.json
          fi

          backend_state="$(python3 scripts/ci/resolve-cloud-run-serving-state.py \
            --service-json /tmp/prod-backend-predeploy-service.json \
            --allow-missing \
            --github-output "$GITHUB_OUTPUT" \
            --output-prefix backend)"
          frontend_state="$(python3 scripts/ci/resolve-cloud-run-serving-state.py \
            --service-json /tmp/prod-frontend-predeploy-service.json \
            --allow-missing \
            --github-output "$GITHUB_OUTPUT" \
            --output-prefix frontend)"

          backend_revision="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["revision"])' <<<"${backend_state}")"
          frontend_revision="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["revision"])' <<<"${frontend_state}")"
          backend_sha=""
          if [ -n "${backend_revision}" ]; then
            backend_sha="$(gcloud run revisions describe "${backend_revision}" \
              --project="${{ env.GCP_PROJECT_ID }}" \
              --region="${{ env.GCP_REGION }}" \
              --format='value(metadata.labels.deploy-sha)' 2>/dev/null || true)"
          fi
          frontend_sha=""
          if [ -n "${frontend_revision}" ]; then
            frontend_sha="$(gcloud run revisions describe "${frontend_revision}" \
              --project="${{ env.GCP_PROJECT_ID }}" \
              --region="${{ env.GCP_REGION }}" \
              --format='value(metadata.labels.deploy-sha)' 2>/dev/null || true)"
          fi

          echo "backend_sha=${backend_sha}" >> "$GITHUB_OUTPUT"
          echo "frontend_sha=${frontend_sha}" >> "$GITHUB_OUTPUT"
          echo "Predeploy backend serving revision: ${backend_revision:-none}"
          echo "Predeploy frontend serving revision: ${frontend_revision:-none}"

      - name: Resolve deployment scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/resolve-deploy-scope.py \
            --requested-scope "${{ github.event.inputs.scope }}" \
            --target-sha "${{ github.event.inputs.sha }}" \
            --backend-base-sha "${{ steps.predeploy-state.outputs.backend_sha }}" \
            --frontend-base-sha "${{ steps.predeploy-state.outputs.frontend_sha }}" \
            --github-output "$GITHUB_OUTPUT" \
            --json

      - name: Resolve production Drive release mode from serving backend
        id: drive-mode
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ steps.predeploy-state.outputs.backend_revision }}" ]; then
            gcloud run revisions describe "${{ steps.predeploy-state.outputs.backend_revision }}" \
              --project="${{ env.GCP_PROJECT_ID }}" --region="${{ env.GCP_REGION }}" \
              --format=json > /tmp/prod-drive-serving-backend.json
          else
            printf '{}\n' > /tmp/prod-drive-serving-backend.json
          fi
          python3 deploy/drive/resolve_prod_release_mode.py \
            --project "${{ env.GCP_PROJECT_ID }}" \
            --mode "${{ github.event.inputs.drive_live_mode }}" \
            --backend-deploy "${{ steps.scope.outputs.deploy_backend }}" \
            --previous-revision "${{ steps.predeploy-state.outputs.backend_revision }}" \
            --revision-json /tmp/prod-drive-serving-backend.json \
            --target-sha "${{ github.event.inputs.sha }}" \
            --required-ancestor "$(cat "${RUNNER_TEMP}/release-tools/prod-drive-feature-commit")" \
            --github-output "$GITHUB_OUTPUT"

      - name: Verify production Drive prerequisites before mutation
        if: steps.drive-mode.outputs.active == 'true' && steps.scope.outputs.deploy_backend == 'true'
        shell: bash
        env:
          DRIVE_OAUTH_VERIFIED: ${{ vars.GOOGLE_DRIVE_OAUTH_PROD_VERIFIED || 'false' }}
        run: |
          set -euo pipefail
          if [ "${{ steps.scope.outputs.deploy_backend }}" != true ]; then
            echo "Production Drive activation requires backend deployment" >&2
            exit 1
          fi
          if [ "${DRIVE_OAUTH_VERIFIED}" != true ]; then
            echo "Production Drive OAuth client scopes and exact callbacks require operator attestation" >&2
            exit 1
          fi
          python3 deploy/drive/verify_prod_prerequisites.py \
            --project "${{ env.GCP_PROJECT_ID }}" --oauth-attested

      # promote-from-uat preflight. Runs before the secret sync, backup, fence
      # and migrations so a missing UAT release or missing IAM stops the run
      # before it changes anything. Evidence chain, all of which must agree:
      #   healthy-UAT git tag for exactly this SHA -> the backend revision it
      #   recorded -> that revision's deploy-sha label, env and @sha256 image.
      - name: Resolve UAT-verified backend image for promotion
        id: uat-verified-backend-image
        if: steps.scope.outputs.deploy_backend == 'true' && github.event.inputs.backend_image_source == 'promote-from-uat'
        shell: bash
        env:
          DEPLOY_SHA: ${{ github.event.inputs.sha }}
        run: |
          set -euo pipefail
          iam_help="Grant the production deployer read access to UAT as written in deploy/iam/README.md (Production image promotion), or dispatch again with backend_image_source=build-from-source."

          # deploy-uat.yml writes deployed/uat/<sha8>-<time> only after a UAT
          # release classified healthy. Newest first; each must peel to this SHA.
          git fetch --force --no-tags origin 'refs/tags/deployed/uat/*:refs/tags/deployed/uat/*'
          release_tags="$(git for-each-ref --sort=-creatordate \
            --format='%(refname) %(*objectname)' 'refs/tags/deployed/uat/' \
            | awk -v sha="${DEPLOY_SHA}" '$2 == sha { print $1 }')"
          if [ -z "${release_tags}" ]; then
            echo "Refusing promotion: ${DEPLOY_SHA} has no healthy UAT release. Deploy it to UAT first, or dispatch with backend_image_source=build-from-source." >&2
            exit 1
          fi

          image_reference=""
          while IFS= read -r release_tag; do
            [ -n "${release_tag}" ] || continue
            git for-each-ref --format='%(contents)' "${release_tag}" > /tmp/prod-uat-release-tag.txt
            uat_revision="$(sed -n 's/^backend_revision: //p' /tmp/prod-uat-release-tag.txt | head -n 1)"
            if [ -z "${uat_revision}" ]; then
              echo "${release_tag}: records no backend revision; skipping." >&2
              continue
            fi
            if ! gcloud run revisions describe "${uat_revision}" \
              --project="${{ env.UAT_GCP_PROJECT_ID }}" \
              --region="${{ env.GCP_REGION }}" \
              --format=json > /tmp/prod-uat-backend-revision.json 2> /tmp/prod-uat-backend-revision.err; then
              if grep -qiE 'PERMISSION_DENIED|403|does not have permission' /tmp/prod-uat-backend-revision.err; then
                echo "Refusing promotion: the production deployer cannot read Cloud Run revisions in ${{ env.UAT_GCP_PROJECT_ID }}. ${iam_help}" >&2
                exit 1
              fi
              echo "${release_tag}: UAT revision ${uat_revision} is no longer described (retired by retention?); skipping." >&2
              continue
            fi
            if image_reference="$(python3 "${RUNNER_TEMP}/release-tools/resolve-uat-verified-image.py" \
              --sha "${DEPLOY_SHA}" \
              --revision-json /tmp/prod-uat-backend-revision.json \
              --release-tag-annotation /tmp/prod-uat-release-tag.txt \
              --expected-repository "${{ env.UAT_BACKEND_IMAGE_REPOSITORY }}" \
              --json-output /tmp/prod-backend-image-promotion-source.json)"; then
              echo "Promotion source: ${image_reference} (UAT revision ${uat_revision}, ${release_tag#refs/tags/})."
              echo "uat_revision=${uat_revision}" >> "$GITHUB_OUTPUT"
              echo "uat_release_tag=${release_tag#refs/tags/}" >> "$GITHUB_OUTPUT"
              break
            fi
            image_reference=""
          done <<< "${release_tags}"
          if [ -z "${image_reference}" ]; then
            echo "Refusing promotion: no healthy UAT release of ${DEPLOY_SHA} still proves which backend digest it verified. A frontend-only UAT release does not verify a backend image. Deploy this SHA to UAT with backend scope, or dispatch with backend_image_source=build-from-source." >&2
            exit 1
          fi

          # Registry read preflight: prove the digest is readable and is one
          # executable image, before anything in production is touched.
          gcloud auth configure-docker gcr.io --quiet
          if ! docker buildx imagetools inspect --raw "${image_reference}" \
            > /tmp/prod-uat-backend-image-manifest.json 2> /tmp/prod-uat-backend-image.err; then
            cat /tmp/prod-uat-backend-image.err >&2
            echo "Refusing promotion: the production deployer cannot read ${image_reference}. ${iam_help}" >&2
            exit 1
          fi
          pinned="$(python3 scripts/ci/resolve-cloud-run-image.py \
            --image-reference "${image_reference}" \
            --manifest-json /tmp/prod-uat-backend-image-manifest.json \
            --sha "${DEPLOY_SHA}" \
            --json-output /tmp/prod-uat-backend-image.json)"
          if [ "${pinned}" != "${image_reference}" ]; then
            echo "Refusing promotion: UAT's verified image is not a single executable manifest." >&2
            exit 1
          fi
          echo "image_reference=${image_reference}" >> "$GITHUB_OUTPUT"

      - name: Set up Python + uv runtime
        uses: ./consent-protocol/.github/actions/setup-python-uv
        with:
          python-version: "3.13"
          protocol-dir: ./consent-protocol

      - name: Install Cloud SQL Auth Proxy
        if: steps.scope.outputs.deploy_backend == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.18.3/cloud-sql-proxy.linux.amd64 \
            -o /usr/local/bin/cloud-sql-proxy
          chmod +x /usr/local/bin/cloud-sql-proxy

      - name: Attest production Drive database before secret sync
        if: steps.drive-mode.outputs.active == 'true' && steps.scope.outputs.deploy_backend == 'true'
        shell: bash
        run: |
          set -euo pipefail
          export ENVIRONMENT=production
          export GOOGLE_CLOUD_PROJECT="${{ env.GCP_PROJECT_ID }}"
          export CLOUDSQL_INSTANCE_CONNECTION_NAME="${{ env.PROD_CLOUDSQL_INSTANCE }}"
          DB_USER="$(gcloud secrets versions access latest --secret=DB_USER --project="${{ env.GCP_PROJECT_ID }}")"
          DB_PASSWORD="$(gcloud secrets versions access latest --secret=DB_PASSWORD --project="${{ env.GCP_PROJECT_ID }}")"
          echo "::add-mask::${DB_USER}"
          echo "::add-mask::${DB_PASSWORD}"
          cloud-sql-proxy --address 127.0.0.1 --port 6544 \
            ${GOOGLE_GHA_CREDS_PATH:+--credentials-file="${GOOGLE_GHA_CREDS_PATH}"} \
            "${{ env.PROD_CLOUDSQL_INSTANCE }}" >/tmp/cloud-sql-proxy-prod-drive-attest.log 2>&1 &
          PROXY_PID=$!
          trap 'kill "${PROXY_PID}" >/dev/null 2>&1 || true' EXIT
          python3 - <<'PY'
          import socket
          import time

          for _ in range(80):
              with socket.socket() as sock:
                  if sock.connect_ex(("127.0.0.1", 6544)) == 0:
                      raise SystemExit(0)
              time.sleep(0.25)
          raise SystemExit("Production Drive DB attestation proxy did not bind")
          PY
          export DB_HOST=127.0.0.1 DB_PORT=6544 DB_NAME="${{ env.PROD_DB_NAME }}"
          export DB_USER DB_PASSWORD
          "${{ env.PROTOCOL_PYTHON }}" consent-protocol/scripts/ops/reconcile_google_drive_prod_connector.py --attest-target

      - name: Verify production Places prerequisites
        if: steps.scope.outputs.deploy_backend == 'true' && vars.ONE_PLACES_DIRECTORY_ENABLED_PROD != 'false'
        shell: bash
        run: |
          set -euo pipefail
          python3 "${RUNNER_TEMP}/release-tools/verify-prod-places-readiness.py" \
            --project "${GCP_PROJECT_ID}"

      - name: Sync canonical hosted runtime secrets
        if: steps.scope.outputs.deploy_backend == 'true'
        shell: bash
        run: |
          set -euo pipefail
          "${{ env.PROTOCOL_PYTHON }}" scripts/ops/sync_backend_runtime_secrets.py \
            --project "${{ env.GCP_PROJECT_ID }}" \
            --environment production \
            --app-frontend-origin "${{ env.APP_FRONTEND_ORIGIN }}" \
            --db-host "cloudsql-socket" \
            --db-port "5432" \
            --db-name "${{ env.PROD_DB_NAME }}" \
            --db-unix-socket "${{ env.PROD_DB_UNIX_SOCKET }}" \
            --cloudsql-instance-connection-name "${{ env.PROD_CLOUDSQL_INSTANCE }}" \
            --consent-sse-enabled "false" \
            --sync-remote-enabled "false" \
            --developer-api-enabled "true" \
            --remote-mcp-enabled "true" \
            --cors-allowed-origins "${{ env.APP_FRONTEND_ORIGIN }}" \
            --obs-data-stale-ratio-threshold "0.25" \
            --passkey-allowed-rp-ids "localhost,127.0.0.1,one.hushh.ai" \
            --plaid-env "production" \
            --plaid-client-name "Hushh Kai" \
            --plaid-country-codes "US" \
            --plaid-webhook-url "${{ env.APP_FRONTEND_ORIGIN }}/api/kai/plaid/webhook" \
            --plaid-redirect-path "/kai/plaid/oauth/return" \
            --plaid-tx-history-days "730" \
            --connections-panel-v2 "${{ steps.drive-mode.outputs.active }}" \
            --google-drive-connection "${{ steps.drive-mode.outputs.active }}" \
            --google-drive-live "${{ steps.drive-mode.outputs.active }}" \
            --google-drive-picker "${{ steps.drive-mode.outputs.active }}" \
            --drive-document-indexing "${{ steps.drive-mode.outputs.active }}" \
            --drive-document-sharing "${{ steps.drive-mode.outputs.active }}" \
            --google-drive-chat-reads "${{ steps.drive-mode.outputs.active }}" \
            --connector-production-all-users "${{ steps.drive-mode.outputs.active }}" \
            --production-drive-candidate-secret "${{ env.DRIVE_CANDIDATE_RUNTIME_SECRET }}" \
            --one-location-read-only-state-enabled "false" \
            --consent-center-summary-v2-enabled "${{ vars.CONSENT_CENTER_SUMMARY_V2_ENABLED || 'true' }}" \
            --hushh-trusted-device-enabled "${{ vars.HUSSH_TRUSTED_DEVICE_ENABLED || 'false' }}" \
            --hushh-tech-client-enabled "false" \
            --hushh-tech-allowed-consent-scopes "" \
            --one-location-nearby-presence-mode "${{ github.event.inputs.nearby_check_in_cohort && 'production' || '' }}" \
            --one-location-nearby-presence-cohort "${{ github.event.inputs.nearby_check_in_cohort }}" \
            --advisors-api-base-url "${{ vars.ADVISORS_API_BASE_URL || 'https://brokercheck.35.253.255.106.sslip.io' }}" \
            --insurance-agents-api-base-url "${{ vars.INSURANCE_AGENTS_API_BASE_URL || 'https://insurance-agents.34.61.69.175.sslip.io' }}" \
            --one-places-directory-enabled "${{ vars.ONE_PLACES_DIRECTORY_ENABLED_PROD || 'true' }}" \
            > /tmp/prod-runtime-secret-sync.json

      - name: Sync frontend hosted runtime secrets
        if: steps.scope.outputs.deploy_frontend == 'true'
        shell: bash
        run: |
          set -euo pipefail
          "${{ env.PROTOCOL_PYTHON }}" scripts/ops/sync_frontend_runtime_secrets.py \
            --project "${{ env.GCP_PROJECT_ID }}" \
            --environment production \
            > /tmp/prod-frontend-runtime-secret-sync.json

      - name: Optional predeploy logical backup run
        if: steps.scope.outputs.deploy_backend == 'true' && github.event.inputs.run_predeploy_backup_job == 'true'
        run: |
          set -euo pipefail
          gcloud sql backups create \
            --instance="${PROD_CLOUDSQL_INSTANCE_NAME}" \
            --project="${GCP_PROJECT_ID}" \
            --description="predeploy-${GITHUB_SHA:-manual}"

      - name: Pre-deploy Cloud SQL backup posture gate
        if: steps.scope.outputs.deploy_backend == 'true'
        id: backup-gate
        shell: bash
        run: |
          set -euo pipefail
          "${{ env.PROTOCOL_PYTHON }}" scripts/ops/cloudsql_backup_freshness_check.py \
            --project-id "${GCP_PROJECT_ID}" \
            --instance "${PROD_CLOUDSQL_INSTANCE_NAME}" \
            --max-age-hours "${BACKUP_MAX_AGE_HOURS}" \
            --report-path /tmp/backup-posture-report.json

          BACKUP_ID="$(python3 -c "import json; from pathlib import Path; payload=json.loads(Path('/tmp/backup-posture-report.json').read_text(encoding='utf-8')); latest=payload.get('latest_backup', {}) if isinstance(payload, dict) else {}; print(str(latest.get('id') or '').strip())")"
          BACKUP_COMPLETED_AT="$(python3 -c "import json; from pathlib import Path; payload=json.loads(Path('/tmp/backup-posture-report.json').read_text(encoding='utf-8')); latest=payload.get('latest_backup', {}) if isinstance(payload, dict) else {}; print(str(latest.get('completed_at') or '').strip())")"
          echo "backup_id=${BACKUP_ID}" >> "$GITHUB_OUTPUT"
          echo "backup_completed_at=${BACKUP_COMPLETED_AT}" >> "$GITHUB_OUTPUT"

      # The web image is production-specific (NEXT_PUBLIC_* values from this
      # project's Secret Manager are compiled in), so it is always built here,
      # never promoted from UAT. It builds while the backend image, fence,
      # migrations and backend candidate checks run, and the lane comes back
      # for it right before the frontend deploy.
      - name: Start frontend image build in parallel
        id: start-frontend-image-build
        if: steps.scope.outputs.deploy_frontend == 'true'
        shell: bash
        run: |
          set -euo pipefail
          image_tag="prod-${{ github.event.inputs.sha }}"
          # The single definition of every value compiled into the web image.
          # The deploy step reuses it, so the build and deploy cannot disagree.
          build_substitutions="_APP_ENV=production,_DEPLOY_ENV=production,_IMAGE_TAG=${image_tag},_ONE_WALLET_CARD_ENABLED=true,_ONE_LOCATION_NEARBY_CHECK_IN=${{ github.event.inputs.nearby_check_in_cohort && 'true' || 'false' }},_LOCATION_MAP_DEMO=false"
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"
          echo "build_substitutions=${build_substitutions}" >> "$GITHUB_OUTPUT"
          # A deployment SHA from before the split has no build-only config.
          # It keeps the combined build-and-deploy, serially, exactly as before.
          if [ ! -f deploy/frontend-image.cloudbuild.yaml ] \
            || ! grep -q '_SKIP_IMAGE_BUILD' deploy/frontend.cloudbuild.yaml; then
            echo "prebuilt=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Frontend image build::This SHA predates the prebuilt frontend image; using the combined build-and-deploy."
            exit 0
          fi
          build_id="$(gcloud builds submit \
            --async \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --config=deploy/frontend-image.cloudbuild.yaml \
            --format='value(id)' \
            "--substitutions=${build_substitutions}")"
          if [[ ! "${build_id}" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
            echo "Frontend image build did not return a Cloud Build id." >&2
            exit 1
          fi
          echo "Started frontend image build ${build_id}."
          echo "build_id=${build_id}" >> "$GITHUB_OUTPUT"
          echo "prebuilt=true" >> "$GITHUB_OUTPUT"

      - name: Build and pin backend image before lifecycle migration
        id: build-backend-image
        if: steps.scope.outputs.deploy_backend == 'true'
        shell: bash
        env:
          BACKEND_IMAGE_SOURCE: ${{ github.event.inputs.backend_image_source }}
          UAT_VERIFIED_IMAGE_REFERENCE: ${{ steps.uat-verified-backend-image.outputs.image_reference }}
        run: |
          set -euo pipefail
          image_tag="prod-${{ github.event.inputs.sha }}"
          image_repository="gcr.io/${{ env.GCP_PROJECT_ID }}/consent-protocol"
          case "${BACKEND_IMAGE_SOURCE:-}" in
            build-from-source)
              gcloud builds submit \
                --project="${{ env.GCP_PROJECT_ID }}" \
                --config=deploy/backend-image.cloudbuild.yaml \
                "--substitutions=_IMAGE_TAG=${image_tag}"
              ;;
            promote-from-uat)
              if [[ ! "${UAT_VERIFIED_IMAGE_REFERENCE:-}" =~ ^gcr\.io/hushh-pda-uat/consent-protocol@sha256:[0-9a-f]{64}$ ]]; then
                echo "Refusing promotion: the UAT-verified backend digest is missing or malformed." >&2
                exit 1
              fi
              # Copy the exact manifest UAT verified into this project's
              # registry. Cloud Run then deploys the copy, so production never
              # depends on the UAT registry at runtime or for rollback.
              if ! gcloud container images add-tag --quiet \
                "${UAT_VERIFIED_IMAGE_REFERENCE}" "${image_repository}:${image_tag}"; then
                echo "Refusing promotion: could not copy ${UAT_VERIFIED_IMAGE_REFERENCE} into ${image_repository}. The production deployer needs read on the UAT gcr.io repository and write on the production gcr.io repository (deploy/iam/README.md, Production image promotion), or dispatch again with backend_image_source=build-from-source." >&2
                exit 1
              fi
              ;;
            *)
              echo "backend_image_source must be build-from-source or promote-from-uat." >&2
              exit 1
              ;;
          esac

          image_digest="$(gcloud container images describe \
            "${image_repository}:${image_tag}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --format='value(image_summary.digest)')"
          if [[ ! "${image_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Backend image build did not resolve an immutable sha256 digest." >&2
            exit 1
          fi
          image_reference="${image_repository}@${image_digest}"
          # Buildx attestations live in a parent index. Pin its executable child
          # before the fence; Cloud Run must later report this exact digest.
          gcloud auth configure-docker gcr.io --quiet
          docker buildx imagetools inspect --raw "${image_reference}" \
            > /tmp/prod-backend-image-manifest.json
          image_reference="$(python3 scripts/ci/resolve-cloud-run-image.py \
            --image-reference "${image_reference}" \
            --manifest-json /tmp/prod-backend-image-manifest.json \
            --sha "${{ github.event.inputs.sha }}" \
            --json-output /tmp/prod-backend-image.json)"
          if [ "${BACKEND_IMAGE_SOURCE}" = "promote-from-uat" ] \
            && [ "${image_reference}" != "${image_repository}@${UAT_VERIFIED_IMAGE_REFERENCE#*@}" ]; then
            echo "Refusing promotion: production resolved ${image_reference}, not the digest UAT verified (${UAT_VERIFIED_IMAGE_REFERENCE#*@})." >&2
            exit 1
          fi
          echo "image_reference=${image_reference}" >> "$GITHUB_OUTPUT"
          echo "image_source=${BACKEND_IMAGE_SOURCE}" >> "$GITHUB_OUTPUT"

      - name: Install fail-closed account deletion release fence
        id: install-account-deletion-fence
        if: steps.scope.outputs.deploy_backend == 'true'
        shell: bash
        run: |
          set -euo pipefail

          if [ "${GCP_PROJECT_ID}" != "hushh-pda" ] \
             || [ "${PROD_CLOUDSQL_INSTANCE}" != "hushh-pda:us-central1:hushh-vault-db" ]; then
            echo "Refusing account deletion fence: project or Cloud SQL instance is not the canonical production target."
            exit 1
          fi
          export CLOUDSQL_INSTANCE_CONNECTION_NAME="${PROD_CLOUDSQL_INSTANCE}"

          DB_USER="$(gcloud secrets versions access latest --secret=DB_USER --project="${{ env.GCP_PROJECT_ID }}")"
          DB_PASSWORD="$(gcloud secrets versions access latest --secret=DB_PASSWORD --project="${{ env.GCP_PROJECT_ID }}")"
          echo "::add-mask::${DB_USER}"
          echo "::add-mask::${DB_PASSWORD}"

          cloud-sql-proxy \
            --address 127.0.0.1 \
            --port 6544 \
            ${GOOGLE_GHA_CREDS_PATH:+--credentials-file="${GOOGLE_GHA_CREDS_PATH}"} \
            "${{ env.PROD_CLOUDSQL_INSTANCE }}" >/tmp/cloud-sql-proxy-prod-fence.log 2>&1 &
          PROXY_PID=$!
          trap 'kill "${PROXY_PID}" >/dev/null 2>&1 || true' EXIT

          python3 - <<'PY'
          import socket
          import time

          deadline = time.time() + 20
          while time.time() < deadline:
              with socket.socket() as sock:
                  sock.settimeout(0.5)
                  if sock.connect_ex(("127.0.0.1", 6544)) == 0:
                      raise SystemExit(0)
              time.sleep(0.25)
          raise SystemExit("Cloud SQL proxy did not bind 127.0.0.1:6544 in time")
          PY

          export DB_HOST=127.0.0.1
          export DB_PORT=6544
          export DB_NAME="${{ env.PROD_DB_NAME }}"
          export DB_USER
          export DB_PASSWORD

          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi

          export PGHOST="$DB_HOST"
          export PGPORT="$DB_PORT"
          export PGDATABASE="${PROD_DB_NAME}"
          export PGUSER="$DB_USER"
          export PGPASSWORD="$DB_PASSWORD"
          psql --no-psqlrc \
            --file deploy/account-deletion/install_release_fence.sql \
            | tee /tmp/prod-account-deletion-fence-install.log
          echo "installed=true" >> "$GITHUB_OUTPUT"

      - name: Apply production DB migrations behind account deletion fence
        id: predeploy-db-gate
        if: steps.scope.outputs.deploy_backend == 'true'
        shell: bash
        run: |
          set -euo pipefail

          if [ "${GCP_PROJECT_ID}" != "hushh-pda" ] \
             || [ "${PROD_CLOUDSQL_INSTANCE}" != "hushh-pda:us-central1:hushh-vault-db" ]; then
            echo "Refusing production migration: project or Cloud SQL instance is not the canonical production target."
            exit 1
          fi
          export CLOUDSQL_INSTANCE_CONNECTION_NAME="${PROD_CLOUDSQL_INSTANCE}"

          # Production is Cloud SQL, reached only through the Auth Proxy from this
          # runner (there is no plain DB_HOST/DB_PORT env var on the deployed
          # service to scrape -- that approach never matched how this app actually
          # resolves its DB connection, see BACKEND_RUNTIME_CONFIG_JSON's
          # db_unix_socket key and hydrate_runtime_environment()). Mirrors the UAT
          # deploy lane's proven pattern exactly.
          DB_USER="$(gcloud secrets versions access latest --secret=DB_USER --project="${{ env.GCP_PROJECT_ID }}")"
          DB_PASSWORD="$(gcloud secrets versions access latest --secret=DB_PASSWORD --project="${{ env.GCP_PROJECT_ID }}")"
          echo "::add-mask::${DB_USER}"
          echo "::add-mask::${DB_PASSWORD}"

          cloud-sql-proxy \
            --address 127.0.0.1 \
            --port 6544 \
            ${GOOGLE_GHA_CREDS_PATH:+--credentials-file="${GOOGLE_GHA_CREDS_PATH}"} \
            "${{ env.PROD_CLOUDSQL_INSTANCE }}" >/tmp/cloud-sql-proxy-prod.log 2>&1 &
          PROXY_PID=$!
          trap 'kill "${PROXY_PID}" >/dev/null 2>&1 || true' EXIT

          python3 - <<'PY'
          import socket
          import time

          deadline = time.time() + 20
          while time.time() < deadline:
              with socket.socket() as sock:
                  sock.settimeout(0.5)
                  if sock.connect_ex(("127.0.0.1", 6544)) == 0:
                      raise SystemExit(0)
              time.sleep(0.25)
          raise SystemExit("Cloud SQL proxy did not bind 127.0.0.1:6544 in time")
          PY

          export DB_HOST=127.0.0.1
          export DB_PORT=6544
          export DB_NAME="${{ env.PROD_DB_NAME }}"
          export DB_USER DB_PASSWORD
          export PGHOST="$DB_HOST"
          export PGPORT="$DB_PORT"
          export PGDATABASE="${PROD_DB_NAME}"
          export PGUSER="$DB_USER"
          export PGPASSWORD="$DB_PASSWORD"

          # Re-acquire the table locks and prove the fence immediately before
          # migration so manual drift cannot reopen the rolling-deploy gap.
          psql --no-psqlrc \
            --file deploy/account-deletion/install_release_fence.sql \
            | tee /tmp/prod-account-deletion-fence-premigration.log

          (
            cd consent-protocol
            "${{ env.PROTOCOL_PYTHON }}" db/migrate.py --release \
              --release-environment production \
              --migration-mode replay
          )
          if [ "${{ steps.drive-mode.outputs.active }}" = true ]; then
            export ENVIRONMENT=production
            export GOOGLE_CLOUD_PROJECT="${{ env.GCP_PROJECT_ID }}"
            (
              cd consent-protocol
              "${{ env.PROTOCOL_PYTHON }}" scripts/ops/reconcile_google_drive_prod_connector.py --activate
              "${{ env.PROTOCOL_PYTHON }}" scripts/ops/reconcile_google_drive_prod_connector.py
            )
          fi
          psql --no-psqlrc \
            --file deploy/account-deletion/verify_release_boundary.sql \
            | tee /tmp/prod-account-deletion-boundary.log
          tombstone_count="$(psql --no-psqlrc --tuples-only --no-align \
            --command 'SELECT count(*) FROM public.account_deletion_tombstones')"
          if [[ ! "${tombstone_count}" =~ ^[0-9]+$ ]]; then
            echo "Unable to record the migration-boundary tombstone count." >&2
            exit 1
          fi
          echo "tombstone_count=${tombstone_count}" >> "$GITHUB_OUTPUT"

      - name: Migration governance and DB drift gate
        if: steps.scope.outputs.deploy_backend == 'true'
        shell: bash
        run: |
          set -euo pipefail

          DB_USER="$(gcloud secrets versions access latest --secret=DB_USER --project="${{ env.GCP_PROJECT_ID }}")"
          DB_PASSWORD="$(gcloud secrets versions access latest --secret=DB_PASSWORD --project="${{ env.GCP_PROJECT_ID }}")"
          echo "::add-mask::${DB_USER}"
          echo "::add-mask::${DB_PASSWORD}"

          cloud-sql-proxy \
            --address 127.0.0.1 \
            --port 6544 \
            ${GOOGLE_GHA_CREDS_PATH:+--credentials-file="${GOOGLE_GHA_CREDS_PATH}"} \
            "${{ env.PROD_CLOUDSQL_INSTANCE }}" >/tmp/cloud-sql-proxy-prod-drift-gate.log 2>&1 &
          PROXY_PID=$!
          trap 'kill "${PROXY_PID}" >/dev/null 2>&1 || true' EXIT

          python3 - <<'PY'
          import socket
          import time

          deadline = time.time() + 20
          while time.time() < deadline:
              with socket.socket() as sock:
                  sock.settimeout(0.5)
                  if sock.connect_ex(("127.0.0.1", 6544)) == 0:
                      raise SystemExit(0)
              time.sleep(0.25)
          raise SystemExit("Cloud SQL proxy did not bind 127.0.0.1:6544 in time")
          PY

          export DB_HOST=127.0.0.1
          export DB_PORT=6544
          export DB_NAME="${{ env.PROD_DB_NAME }}"
          export DB_USER DB_PASSWORD
          "${{ env.PROTOCOL_PYTHON }}" scripts/ops/db_migration_release_guard.py \
            --release-environment production \
            --report-path /tmp/db-migration-guard-report.json

      - name: Generate production migration release manifest
        if: steps.scope.outputs.deploy_backend == 'true'
        shell: bash
        run: |
          set -euo pipefail
          "${{ env.PROTOCOL_PYTHON }}" scripts/ops/generate_migration_release_manifest.py \
            --output /tmp/prod-migration-release-manifest.json \
            --environment production \
            --backup-report-path /tmp/backup-posture-report.json

      - name: Upload production DB governance artifacts
        if: always() && steps.scope.outputs.deploy_backend == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: prod-db-governance-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            /tmp/backup-posture-report.json
            /tmp/db-migration-guard-report.json
            /tmp/prod-migration-release-manifest.json

      - name: Deploy backend using Cloud Build
        id: deploy-backend
        if: steps.scope.outputs.deploy_backend == 'true'
        run: |
          if [ "${{ github.event.inputs.enable_one_email_kyc }}" = "true" ]; then
            echo "Production One Email KYC is blocked until mailbox-watch ownership, Scheduler renewal, and encrypted-at-rest draft storage are complete."
            exit 1
          fi
          DRIVE_SUBSTITUTIONS=",_BACKEND_RUNTIME_CONFIG_JSON_SECRET=${DRIVE_CANDIDATE_RUNTIME_SECRET}"
          if [ "${{ steps.drive-mode.outputs.active }}" = "true" ]; then
            DRIVE_SUBSTITUTIONS+=",_GOOGLE_DRIVE_OAUTH_CLIENT_ID_SECRET=GOOGLE_DRIVE_OAUTH_CLIENT_ID,_GOOGLE_DRIVE_OAUTH_CLIENT_SECRET_SECRET=GOOGLE_DRIVE_OAUTH_CLIENT_SECRET,_GOOGLE_DRIVE_PICKER_API_KEY_SECRET=GOOGLE_DRIVE_PICKER_API_KEY,_EXTERNAL_CONNECTOR_CREDENTIAL_KEY_SECRET=EXTERNAL_CONNECTOR_CREDENTIAL_KEY,_DRIVE_DOCUMENT_KEY_V1_SECRET=DRIVE_DOCUMENT_KEY_V1,_DRIVE_SHARING_KEY_V1_SECRET=DRIVE_SHARING_KEY_V1,_DRIVE_WORK_DRAIN_ENABLED=true,_DRIVE_WORK_DRAIN_SCHEDULER_PROJECT_ID=hushh-pda,_DRIVE_WORK_DRAIN_SCHEDULER_SERVICE_ACCOUNT_EMAIL=drive-work-drain-sched@hushh-pda.iam.gserviceaccount.com,_DRIVE_WORK_DRAIN_SCHEDULER_AUDIENCE=https://api.hushh.ai"
          fi
          # Same sizing as UAT: two gunicorn workers plus the E5 query leaf
          # outgrow the 1Gi default, and an out-of-memory kill drops every
          # chat stream on the instance mid-turn (measured 2026-09-27).
          # Payment rollout is explicitly off until production Drive parity,
          # live Stripe keys, the webhook endpoint, and acceptance are ready.
          # Keep credentials bound after switch-off for existing paid requests.
          gcloud builds submit \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --config=deploy/backend.cloudbuild.yaml \
            "--substitutions=_BACKEND_SERVICE=${{ env.BACKEND_SERVICE }},_REGION=${{ env.GCP_REGION }},_CLOUDSQL_INSTANCES=${{ env.PROD_CLOUDSQL_INSTANCE }},_PLAID_CLIENT_ID_SECRET=PLAID_CLIENT_ID,_PLAID_SECRET_SECRET=PLAID_SECRET,_PLAID_ACCESS_TOKEN_KEY_SECRET=PLAID_ACCESS_TOKEN_KEY,_FINNHUB_API_KEY_SECRET=FINNHUB_API_KEY,_PMP_API_KEY_SECRET=PMP_API_KEY,_NEWSAPI_KEY_SECRET=NEWSAPI_KEY,_GMAIL_OAUTH_CLIENT_ID_SECRET=GMAIL_OAUTH_CLIENT_ID,_GMAIL_OAUTH_CLIENT_SECRET_SECRET=GMAIL_OAUTH_CLIENT_SECRET,_GMAIL_OAUTH_REDIRECT_URI_SECRET=GMAIL_OAUTH_REDIRECT_URI,_GMAIL_OAUTH_TOKEN_KEY_SECRET=GMAIL_OAUTH_TOKEN_KEY,_GOOGLE_OAUTH_CLIENT_ID_SECRET=GOOGLE_OAUTH_CLIENT_ID,_GOOGLE_OAUTH_CLIENT_SECRET_SECRET=GOOGLE_OAUTH_CLIENT_SECRET,_GOOGLE_OAUTH_REDIRECT_URI_SECRET=GOOGLE_OAUTH_REDIRECT_URI,_GOOGLE_OAUTH_TOKEN_KEY_SECRET=GOOGLE_OAUTH_TOKEN_KEY,_OPENAI_API_KEY_SECRET=OPENAI_API_KEY,_GOOGLE_MAPS_API_KEY_SECRET=GOOGLE_MAPS_API_KEY,_HUSHH_DEVELOPER_TOKEN_SECRET=HUSHH_DEVELOPER_TOKEN,_HUSHH_PROD_PHONE_TEST_NUMBERS_SECRET=HUSHH_PROD_PHONE_TEST_NUMBERS,_HUSHH_PROD_PHONE_TEST_CODE_SECRET=HUSHH_PROD_PHONE_TEST_CODE,_HUSHH_PROD_PHONE_TEST_CHALLENGE_SECRET_SECRET=HUSHH_PROD_PHONE_TEST_CHALLENGE_SECRET,_HUSHH_PROD_PHONE_TEST_ENABLED=true,_KAI_ANALYZE_DURABLE_RUN_STORE=true,_RIA_INTELLIGENCE_VERIFY_BASE_URL_SECRET=RIA_INTELLIGENCE_VERIFY_BASE_URL,_CONSENT_API_PUBLIC_ORIGIN=${{ env.CONSENT_API_PUBLIC_ORIGIN }},_CONSENT_WEB_FALLBACK_ENABLED=false,_CONSENT_SSE_ENABLED=false,_DB_POOL_MIN_SIZE=1,_DB_POOL_MAX_SIZE=4,_DB_SQLALCHEMY_POOL_SIZE=4,_DB_SQLALCHEMY_MAX_OVERFLOW=0,_CLOUD_RUN_CPU=2,_CLOUD_RUN_MEMORY=4Gi,_CLOUD_RUN_CONCURRENCY=20,_CLOUD_RUN_MIN_INSTANCES=1,_CLOUD_RUN_MAX_INSTANCES=5,_CLOUD_RUN_NO_TRAFFIC=true,_IMAGE_TAG=prod-${{ github.event.inputs.sha }},_ONE_WALLET_CARD_ENABLED=true,_WALLET_PASS_PROVIDER=service,_WALLET_API_KEY_SECRET=WALLET_API_KEY,_HUSSH_GEMINI_TEXT_MODEL=gemini-3.6-flash,_ONE_VOICE_LIVE_ENABLED=true,_VERTEX_LIVE_MODEL_ID=gemini-live-2.5-flash-native-audio,_VERTEX_LIVE_LOCATION=us-central1,_GENAI_PROJECT_ID=hushh-vertex-personal54,_DEPLOY_ENV=production,_DEPLOY_SOURCE=deploy-production,_DEPLOY_SHA=${{ github.event.inputs.sha }},_GITHUB_RUN_ID=${{ github.run_id }},_RUNTIME_SERVICE_ACCOUNT=${{ env.RUNTIME_SERVICE_ACCOUNT }},_SKIP_IMAGE_BUILD=true,_IMAGE_REFERENCE=${{ steps.build-backend-image.outputs.image_reference }},_CLOUD_RUN_TAG=account-deletion-${{ github.run_id }},_ACCOUNT_DELETION_CLEANUP_AUDIENCE=${{ env.CONSENT_API_PUBLIC_ORIGIN }},_ACCOUNT_DELETION_CLEANUP_SERVICE_ACCOUNT_EMAIL=${{ env.ACCOUNT_DELETION_SCHEDULER_SERVICE_ACCOUNT_ID }}@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com,_DRIVE_REQUEST_PAYMENTS_ENABLED=${{ vars.DRIVE_REQUEST_PAYMENTS_PROD_ENABLED || 'false' }},_STRIPE_SECRET_KEY_SECRET=STRIPE_SECRET_KEY,_STRIPE_WEBHOOK_SECRET_SECRET=STRIPE_WEBHOOK_SECRET${DRIVE_SUBSTITUTIONS}"

      - name: Get backend URL
        if: steps.scope.outputs.deploy_backend == 'true'
        id: backend-url
        run: |
          BACKEND_URL=$(gcloud run services describe ${{ env.BACKEND_SERVICE }} \
            --project=${{ env.GCP_PROJECT_ID }} \
            --region=${{ env.GCP_REGION }} \
            --format='value(status.url)')
          echo "url=$BACKEND_URL" >> $GITHUB_OUTPUT
          echo "Backend URL: $BACKEND_URL"

      - name: Retain latest backend revisions
        if: steps.scope.outputs.deploy_backend == 'true'
        continue-on-error: true
        run: bash scripts/ci/cloudrun-retention.sh "${{ env.BACKEND_SERVICE }}" "${{ env.GCP_REGION }}" "${{ env.BACKEND_REVISION_RETENTION }}"

      - name: Resolve backend candidate revision
        id: backend-candidate-state
        if: steps.scope.outputs.deploy_backend == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "${{ env.BACKEND_SERVICE }}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --region="${{ env.GCP_REGION }}" \
            --format=json > /tmp/prod-backend-candidate-service.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          service = json.loads(
              Path("/tmp/prod-backend-candidate-service.json").read_text(encoding="utf-8")
          )
          status = service.get("status") or {}
          revision = str(status.get("latestCreatedRevisionName") or "").strip()
          expected_tag = f"account-deletion-{os.environ['GITHUB_RUN_ID']}"
          tagged = [
              entry
              for entry in (status.get("traffic") or [])
              if isinstance(entry, dict) and entry.get("tag") == expected_tag
          ]
          if not revision or len(tagged) != 1:
              raise SystemExit("Backend candidate revision/tag could not be resolved uniquely")
          tagged_revision = str(tagged[0].get("revisionName") or revision).strip()
          candidate_url = str(tagged[0].get("url") or "").strip()
          if tagged_revision != revision or not candidate_url.startswith("https://"):
              raise SystemExit("Backend candidate tag does not resolve to the latest created revision")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"backend_revision={revision}\n")
              output.write(f"backend_candidate_url={candidate_url}\n")
          PY

      - name: Verify backend candidate readiness and exact-SHA provenance
        if: steps.scope.outputs.deploy_backend == 'true'
        shell: bash
        env:
          BACKEND_REVISION: ${{ steps.backend-candidate-state.outputs.backend_revision }}
          BACKEND_CANDIDATE_URL: ${{ steps.backend-candidate-state.outputs.backend_candidate_url }}
          EXPECTED_SHA: ${{ github.event.inputs.sha }}
          EXPECTED_IMAGE_REFERENCE: ${{ steps.build-backend-image.outputs.image_reference }}
          DRIVE_ENABLED: ${{ steps.drive-mode.outputs.active }}
          DRIVE_CANDIDATE_RUNTIME_SECRET: ${{ env.DRIVE_CANDIDATE_RUNTIME_SECRET }}
        run: |
          set -euo pipefail
          gcloud run revisions describe "${BACKEND_REVISION}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --region="${{ env.GCP_REGION }}" \
            --format=json > /tmp/prod-backend-candidate.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          revision = json.loads(
              Path("/tmp/prod-backend-candidate.json").read_text(encoding="utf-8")
          )
          expected_revision = os.environ["BACKEND_REVISION"]
          expected_sha = os.environ["EXPECTED_SHA"]
          expected_image_reference = os.environ["EXPECTED_IMAGE_REFERENCE"]
          metadata = revision.get("metadata") or {}
          labels = metadata.get("labels") or {}
          containers = (revision.get("spec") or {}).get("containers") or []
          env = {
              str(item.get("name") or ""): str(item.get("value") or "")
              for container in containers
              if isinstance(container, dict)
              for item in (container.get("env") or [])
              if isinstance(item, dict) and "value" in item
          }
          secret_refs = {
              str(item.get("name") or ""): str(
                  ((item.get("valueFrom") or {}).get("secretKeyRef") or {}).get("name") or ""
              )
              for container in containers
              if isinstance(container, dict)
              for item in (container.get("env") or [])
              if isinstance(item, dict)
          }
          expected_runtime_secret = os.environ["DRIVE_CANDIDATE_RUNTIME_SECRET"]
          ready = any(
              condition.get("type") == "Ready" and str(condition.get("status")).lower() == "true"
              for condition in ((revision.get("status") or {}).get("conditions") or [])
              if isinstance(condition, dict)
          )
          checks = {
              "revision": metadata.get("name") == expected_revision,
              "ready": ready,
              "label_sha": labels.get("deploy-sha") == expected_sha,
              "label_environment": labels.get("deploy-env") == "production",
              "label_source": labels.get("deploy-source") == "deploy-production",
              "lifecycle_contract": labels.get("account-deletion-contract") == "v201",
              "immutable_image": bool(containers)
              and containers[0].get("image") == expected_image_reference,
              "env_sha": env.get("HUSHH_DEPLOY_SHA") == expected_sha,
              "env_environment": env.get("HUSHH_DEPLOY_ENV") == "production",
              "env_source": env.get("HUSHH_DEPLOY_SOURCE") == "deploy-production",
              "env_run": env.get("HUSHH_DEPLOY_RUN_ID") == os.environ["GITHUB_RUN_ID"],
              "isolated_runtime_config": secret_refs.get("BACKEND_RUNTIME_CONFIG_JSON")
              == expected_runtime_secret,
          }
          report = {
              "status": "ready" if all(checks.values()) else "blocked",
              "revision": expected_revision,
              "checks": checks,
          }
          Path("/tmp/prod-backend-candidate-readiness.json").write_text(
              json.dumps(report, indent=2, sort_keys=True), encoding="utf-8"
          )
          if not all(checks.values()):
              raise SystemExit("Backend candidate readiness/provenance gate failed")
          PY
          candidate_health_ok=false
          for _attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 15 \
              "${BACKEND_CANDIDATE_URL%/}/health" \
              > /tmp/prod-backend-candidate-health.json; then
              candidate_health_ok=true
              break
            fi
            sleep 3
          done
          if [ "${candidate_health_ok}" != "true" ]; then
            echo "Backend candidate tagged health probe failed." >&2
            exit 1
          fi

      - name: Wait for frontend image and pin its digest
        id: build-frontend-image
        if: steps.scope.outputs.deploy_frontend == 'true' && steps.start-frontend-image-build.outputs.prebuilt == 'true'
        shell: bash
        env:
          FRONTEND_IMAGE_BUILD_ID: ${{ steps.start-frontend-image-build.outputs.build_id }}
          FRONTEND_IMAGE_TAG: ${{ steps.start-frontend-image-build.outputs.image_tag }}
        run: |
          set -euo pipefail
          started_at="$(date +%s)"
          image_repository="gcr.io/${{ env.GCP_PROJECT_ID }}/hushh-webapp"
          image_reference="$(bash scripts/ci/await-prebuilt-image.sh \
            --project "${{ env.GCP_PROJECT_ID }}" \
            --build-id "${FRONTEND_IMAGE_BUILD_ID}" \
            --image-repository "${image_repository}" \
            --image-tag "${FRONTEND_IMAGE_TAG}" \
            --sha "${{ github.event.inputs.sha }}" \
            --manifest-json /tmp/prod-frontend-image-manifest.json \
            --json-output /tmp/prod-frontend-image.json)"
          if [[ ! "${image_reference}" =~ ^gcr\.io/${{ env.GCP_PROJECT_ID }}/hushh-webapp@sha256:[0-9a-f]{64}$ ]]; then
            echo "Frontend image did not pin to an immutable sha256 digest." >&2
            exit 1
          fi
          echo "image_reference=${image_reference}" >> "$GITHUB_OUTPUT"
          echo "wait_seconds=$(( $(date +%s) - started_at ))" >> "$GITHUB_OUTPUT"

      - name: Deploy frontend using Cloud Build
        id: deploy-frontend
        if: steps.scope.outputs.deploy_frontend == 'true'
        shell: bash
        env:
          FRONTEND_PREBUILT: ${{ steps.start-frontend-image-build.outputs.prebuilt }}
          FRONTEND_IMAGE_REFERENCE: ${{ steps.build-frontend-image.outputs.image_reference }}
          FRONTEND_BUILD_SUBSTITUTIONS: ${{ steps.start-frontend-image-build.outputs.build_substitutions }}
        run: |
          set -euo pipefail
          SUBSTITUTIONS="_FRONTEND_SERVICE=${{ env.FRONTEND_SERVICE }},_REGION=${{ env.GCP_REGION }},_CLOUD_RUN_NO_TRAFFIC=true,_DEPLOY_SOURCE=deploy-production,_DEPLOY_SHA=${{ github.event.inputs.sha }},_GITHUB_RUN_ID=${{ github.run_id }},_GITHUB_RUN_ATTEMPT=${{ github.run_attempt }}"
          if [ -z "${FRONTEND_BUILD_SUBSTITUTIONS}" ]; then
            echo "Refusing frontend deploy: the frontend build substitutions were not resolved." >&2
            exit 1
          fi
          SUBSTITUTIONS="${SUBSTITUTIONS},${FRONTEND_BUILD_SUBSTITUTIONS}"
          source_arg="."
          case "${FRONTEND_PREBUILT}" in
            true)
              # Deploy exactly the digest pinned above; never rebuild or re-resolve a tag.
              if [[ ! "${FRONTEND_IMAGE_REFERENCE}" =~ ^gcr\.io/${{ env.GCP_PROJECT_ID }}/hushh-webapp@sha256:[0-9a-f]{64}$ ]]; then
                echo "Refusing frontend deploy: the pinned image digest is missing or malformed." >&2
                exit 1
              fi
              SUBSTITUTIONS="${SUBSTITUTIONS},_SKIP_IMAGE_BUILD=true,_IMAGE_REFERENCE=${FRONTEND_IMAGE_REFERENCE}"
              # Deploy-only: nothing in the build context is read, so skip the upload.
              source_arg="--no-source"
              ;;
            false)
              echo "Combined build-and-deploy for a SHA that predates the prebuilt frontend image."
              ;;
            *)
              echo "Refusing frontend deploy: prebuilt-image mode was not resolved." >&2
              exit 1
              ;;
          esac
          gcloud builds submit "${source_arg}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --config=deploy/frontend.cloudbuild.yaml \
            "--substitutions=${SUBSTITUTIONS}"

      - name: Get frontend URL
        if: steps.scope.outputs.deploy_frontend == 'true'
        id: frontend-url
        run: |
          FRONTEND_ORIGIN=$(gcloud run services describe ${{ env.FRONTEND_SERVICE }} \
            --project=${{ env.GCP_PROJECT_ID }} \
            --region=${{ env.GCP_REGION }} \
            --format='value(status.url)')
          echo "url=$FRONTEND_ORIGIN" >> $GITHUB_OUTPUT
          echo "Frontend URL: $FRONTEND_ORIGIN"

      - name: Retain latest frontend revisions
        if: steps.scope.outputs.deploy_frontend == 'true'
        continue-on-error: true
        run: bash scripts/ci/cloudrun-retention.sh "${{ env.FRONTEND_SERVICE }}" "${{ env.GCP_REGION }}" "${{ env.FRONTEND_REVISION_RETENTION }}"

      - name: Resolve deployed candidate revisions
        id: candidate-state
        shell: bash
        run: |
          set -euo pipefail
          backend_revision=""
          frontend_revision=""
          if [ "${{ steps.scope.outputs.deploy_backend }}" = "true" ]; then
            # Promote exactly the tagged, digest-pinned, readiness-proven
            # candidate, never whatever revision happens to be latest now.
            backend_revision="${{ steps.backend-candidate-state.outputs.backend_revision }}"
            if [ -z "${backend_revision}" ]; then
              echo "Backend candidate revision was not resolved." >&2
              exit 1
            fi
          fi
          if [ "${{ steps.scope.outputs.deploy_frontend }}" = "true" ]; then
            gcloud run revisions list \
              --service="${{ env.FRONTEND_SERVICE }}" \
              --project="${{ env.GCP_PROJECT_ID }}" \
              --region="${{ env.GCP_REGION }}" \
              --format=json > /tmp/prod-frontend-deploy-revisions.json
            frontend_revision="$(python3 "${RUNNER_TEMP}/release-tools/resolve-cloud-run-deploy-revision.py" \
              --revisions-json /tmp/prod-frontend-deploy-revisions.json \
              --deploy-env production \
              --deploy-source deploy-production \
              --deploy-sha "${{ github.event.inputs.sha }}" \
              --github-run-id "${{ github.run_id }}" \
              --github-run-attempt "${{ github.run_attempt }}")"
          fi
          echo "backend_revision=${backend_revision}" >> "$GITHUB_OUTPUT"
          echo "frontend_revision=${frontend_revision}" >> "$GITHUB_OUTPUT"
          echo "Backend candidate revision: ${backend_revision:-n/a}"
          echo "Frontend candidate revision: ${frontend_revision:-n/a}"

      - name: Verify frontend candidate runs the pinned image digest
        if: steps.scope.outputs.deploy_frontend == 'true' && steps.start-frontend-image-build.outputs.prebuilt == 'true'
        shell: bash
        env:
          FRONTEND_REVISION: ${{ steps.candidate-state.outputs.frontend_revision }}
          EXPECTED_IMAGE_REFERENCE: ${{ steps.build-frontend-image.outputs.image_reference }}
        run: |
          set -euo pipefail
          deployed_image="$(gcloud run revisions describe "${FRONTEND_REVISION}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --region="${{ env.GCP_REGION }}" \
            --format='value(spec.containers[0].image)')"
          if [ -z "${EXPECTED_IMAGE_REFERENCE}" ] || [ "${deployed_image}" != "${EXPECTED_IMAGE_REFERENCE}" ]; then
            echo "Frontend candidate ${FRONTEND_REVISION} runs '${deployed_image}', not the pinned '${EXPECTED_IMAGE_REFERENCE}'." >&2
            exit 1
          fi
          echo "Frontend candidate ${FRONTEND_REVISION} runs the pinned image ${deployed_image}."

      - name: Verify backend candidate runtime identity
        if: steps.scope.outputs.deploy_backend == 'true'
        run: >-
          bash scripts/ci/assert-cloud-run-runtime-identity.sh
          "${{ env.GCP_PROJECT_ID }}"
          "${{ env.GCP_REGION }}"
          "${{ steps.candidate-state.outputs.backend_revision }}"
          "${{ env.RUNTIME_SERVICE_ACCOUNT }}"

      - name: Verify protected list secrets were not wiped
        shell: bash
        run: |
          # `gcloud secrets versions add` REPLACES the whole value, so one write
          # that skips the read deletes every other entry with no error.
          # HUSHH_PROD_PHONE_TEST_NUMBERS holds 40 numbers under exactly the
          # exposure that took the UAT list from 59 to 1 on 2026-09-03. Never
          # ship on top of destroyed configuration. See R36.
          python3 scripts/ops/verify_secret_list_invariants.py \
            --project "${{ env.GCP_PROJECT_ID }}"

      - name: Verify production candidate runtime env parity
        id: verify-parity
        if: steps.scope.outputs.deploy_backend == 'true' || steps.scope.outputs.deploy_frontend == 'true'
        continue-on-error: true
        run: |
          python3 scripts/ops/verify-env-secrets-parity.py \
            --project "${{ env.GCP_PROJECT_ID }}" \
            --region "${{ env.GCP_REGION }}" \
            --backend-service "${{ env.BACKEND_SERVICE }}" \
            --frontend-service "${{ env.FRONTEND_SERVICE }}" \
            --backend-revision "${{ steps.candidate-state.outputs.backend_revision }}" \
            --frontend-revision "${{ steps.candidate-state.outputs.frontend_revision }}" \
            --require-plaid \
            --require-market-data \
            --require-gmail \
            --require-calendar \
            --require-connected-systems \
            --require-prod-phone-test \
            --assert-runtime-env-contract \
            --report-path /tmp/prod-runtime-parity.json

      - name: Verify production Connected Systems Omni Gateway
        id: verify-connected-systems
        if: steps.scope.outputs.deploy_backend == 'true' && steps.verify-parity.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          "${{ env.PROTOCOL_PYTHON }}" scripts/ops/verify_connected_systems_gateway.py \
            --project "${{ env.GCP_PROJECT_ID }}" \
            2>&1 | tee /tmp/prod-connected-systems.log

      - name: Deploy and attest private production Drive worker
        id: deploy-drive-worker
        if: steps.drive-mode.outputs.active == 'true' && steps.scope.outputs.deploy_backend == 'true' && steps.verify-parity.outcome == 'success' && steps.verify-connected-systems.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          IMAGE_REFERENCE: ${{ steps.build-backend-image.outputs.image_reference }}
          DEPLOY_SHA: ${{ github.event.inputs.sha }}
          CLOUDSQL_INSTANCE: ${{ env.PROD_CLOUDSQL_INSTANCE }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          RELEASE_RUN_ATTEMPT: ${{ github.run_attempt }}
          DRIVE_RUNTIME_CONFIG_SECRET: ${{ env.DRIVE_CANDIDATE_RUNTIME_SECRET }}
          ENABLE_PRODUCTION_DRIVE_LIVE: "true"
          DRIVE_REQUEST_PAYMENTS_PROD_ENABLED: ${{ vars.DRIVE_REQUEST_PAYMENTS_PROD_ENABLED || 'false' }}
        run: |
          set -euo pipefail
          bash deploy/drive/deploy_worker_service_prod.sh

      # New revisions are deployed with --no-traffic (see _CLOUD_RUN_NO_TRAFFIC=true
      # above), so promotion is an explicit, reversible step: shift 100% to the
      # freshly built revision, then health-gate it, then auto-roll-back on failure.
      - name: Promote deployed revisions to production traffic
        id: promote-traffic
        if: steps.verify-parity.outcome == 'success' && (steps.scope.outputs.deploy_backend != 'true' || steps.verify-connected-systems.outcome == 'success') && (steps.scope.outputs.deploy_backend != 'true' || steps.drive-mode.outputs.active != 'true' || steps.deploy-drive-worker.outcome == 'success')
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.scope.outputs.deploy_backend }}" = "true" ]; then
            gcloud run services update-traffic "${{ env.BACKEND_SERVICE }}" \
              --project="${{ env.GCP_PROJECT_ID }}" \
              --region="${{ env.GCP_REGION }}" \
              --to-revisions="${{ steps.candidate-state.outputs.backend_revision }}=100"
          fi
          if [ "${{ steps.scope.outputs.deploy_frontend }}" = "true" ]; then
            gcloud run services update-traffic "${{ env.FRONTEND_SERVICE }}" \
              --project="${{ env.GCP_PROJECT_ID }}" \
              --region="${{ env.GCP_REGION }}" \
              --to-revisions="${{ steps.candidate-state.outputs.frontend_revision }}=100"
          fi

      - name: Quarantine production Drive jobs after disabling live Drive
        id: pause-drive-worker
        if: steps.drive-mode.outputs.active != 'true' && steps.scope.outputs.deploy_backend == 'true' && steps.promote-traffic.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          # Never pause jobs while the previous live-Drive backend still serves.
          # Save exact fixed-job state so a failed health gate can restore it.
          snapshot=/tmp/prod-drive-scheduler-before-disable.json
          worker_origin="$(gcloud run services describe consent-protocol-drive-worker \
            --project="${{ env.GCP_PROJECT_ID }}" --region="${{ env.GCP_REGION }}" \
            --format='value(status.url)' 2>/dev/null || true)"
          python3 deploy/drive/work_drain_scheduler_snapshot_prod.py capture \
            --snapshot "${snapshot}" --worker-origin "${worker_origin}"
          echo "snapshot=${snapshot}" >> "${GITHUB_OUTPUT}"
          echo "worker_origin=${worker_origin}" >> "${GITHUB_OUTPUT}"
          python3 deploy/drive/work_drain_scheduler_snapshot_prod.py quarantine

      - name: Verify production backend deployment provenance
        id: verify-backend-provenance
        if: steps.scope.outputs.deploy_backend == 'true' && steps.promote-traffic.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          "${{ env.PROTOCOL_PYTHON }}" scripts/ci/verify-cloudrun-revision-provenance.py \
            --project "${{ env.GCP_PROJECT_ID }}" \
            --region "${{ env.GCP_REGION }}" \
            --service "${{ env.BACKEND_SERVICE }}" \
            --expected-env production \
            --expected-source deploy-production \
            --expected-sha "${{ github.event.inputs.sha }}" \
            --expected-run-id "${{ github.run_id }}" \
            --report-path /tmp/prod-backend-provenance.json

      - name: Verify production frontend deployment provenance
        id: verify-frontend-provenance
        if: steps.scope.outputs.deploy_frontend == 'true' && steps.promote-traffic.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          "${{ env.PROTOCOL_PYTHON }}" scripts/ci/verify-cloudrun-revision-provenance.py \
            --project "${{ env.GCP_PROJECT_ID }}" \
            --region "${{ env.GCP_REGION }}" \
            --service "${{ env.FRONTEND_SERVICE }}" \
            --expected-env production \
            --expected-source deploy-production \
            --expected-sha "${{ github.event.inputs.sha }}" \
            --expected-run-id "${{ github.run_id }}" \
            --report-path /tmp/prod-frontend-provenance.json

      - name: Post-deploy backend runtime health gate
        id: health-backend
        if: steps.scope.outputs.deploy_backend == 'true' && steps.promote-traffic.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          # Require 5 consecutive 200s from /health. A crash-looping revision
          # (passes TCP startup probe, then dies serving requests, flapping
          # 200<->503) can never reach a stable streak, so this fails and the
          # rollback step below reverts traffic to the predeploy revision.
          bash scripts/ci/cloudrun-http-health.sh \
            "${{ steps.backend-url.outputs.url }}" "/health" 5 30 5 200

      - name: Post-deploy frontend runtime health gate
        id: health-frontend
        if: steps.scope.outputs.deploy_frontend == 'true' && steps.promote-traffic.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/cloudrun-http-health.sh \
            "${{ steps.frontend-url.outputs.url }}" "/" 3 30 5 200

      - name: Verify production account-session contract
        id: health-account-session-contract
        if: steps.promote-traffic.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          # The session-status endpoint is a mandatory cross-service contract for
          # every restored web session. With no bearer token, a compatible backend
          # must reject the request as 401. A 404 proves frontend/backend version
          # skew and must roll the selected release back instead of stranding users
          # behind the fail-closed reconnect screen.
          bash scripts/ci/cloudrun-http-health.sh \
            "${{ env.CONSENT_API_PUBLIC_ORIGIN }}" "/api/account/session-status" 3 30 5 401

      - name: Verify production native passkey domain associations
        id: verify-passkey-associations
        if: steps.scope.outputs.deploy_frontend == 'true' && steps.promote-traffic.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ops/verify_passkey_domain_associations.py \
            --project "${{ env.GCP_PROJECT_ID }}" \
            --origin "${{ env.APP_FRONTEND_ORIGIN }}"

      - name: Classify production release outcome
        id: classify
        if: always()
        shell: bash
        env:
          DEPLOY_BACKEND: ${{ steps.scope.outputs.deploy_backend }}
          DEPLOY_FRONTEND: ${{ steps.scope.outputs.deploy_frontend }}
          HEALTH_BACKEND: ${{ steps.health-backend.outcome }}
          HEALTH_FRONTEND: ${{ steps.health-frontend.outcome }}
          ACCOUNT_SESSION_CONTRACT_OUTCOME: ${{ steps.health-account-session-contract.outcome }}
          PARITY_OUTCOME: ${{ steps.verify-parity.outcome }}
          CONNECTED_SYSTEMS_OUTCOME: ${{ steps.verify-connected-systems.outcome }}
          DRIVE_ENABLED: ${{ steps.drive-mode.outputs.active }}
          DRIVE_WORKER_OUTCOME: ${{ steps.deploy-drive-worker.outcome }}
          DRIVE_PAUSE_OUTCOME: ${{ steps.pause-drive-worker.outcome }}
          DRIVE_PAUSE_SNAPSHOT: ${{ steps.pause-drive-worker.outputs.snapshot }}
          PROMOTE_OUTCOME: ${{ steps.promote-traffic.outcome }}
          BACKEND_PROVENANCE_OUTCOME: ${{ steps.verify-backend-provenance.outcome }}
          FRONTEND_PROVENANCE_OUTCOME: ${{ steps.verify-frontend-provenance.outcome }}
          PASSKEY_ASSOCIATIONS_OUTCOME: ${{ steps.verify-passkey-associations.outcome }}
          UPSTREAM_JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          upstream_failed=false
          backend_failure=false
          frontend_failure=false
          account_session_contract_failed=false
          parity_failed=false
          connected_systems_failed=false
          drive_worker_failed=false
          drive_pause_failed=false
          promote_failed=false
          backend_provenance_failed=false
          frontend_provenance_failed=false
          passkey_associations_failed=false

          # GitHub marks job.status as failure when any earlier non-optional step
          # failed. This catches configuration, authentication, backup, migration,
          # build, and other pre-traffic failures even when their downstream
          # outputs are empty.
          if [ "$UPSTREAM_JOB_STATUS" != "success" ]; then
            upstream_failed=true
          fi

          # Runtime health remains the rollback trigger after promotion. Candidate
          # parity is a pre-traffic gate, so a parity failure leaves serving traffic
          # untouched and fails the release without invoking rollback.
          if [ "$DEPLOY_BACKEND" = "true" ] && [ "$HEALTH_BACKEND" = "failure" ]; then
            backend_failure=true
          fi
          if [ "$DEPLOY_FRONTEND" = "true" ] && [ "$HEALTH_FRONTEND" = "failure" ]; then
            frontend_failure=true
          fi
          if [ "$ACCOUNT_SESSION_CONTRACT_OUTCOME" != "success" ]; then
            account_session_contract_failed=true
            # The compatibility check observes the combined serving pair. Revert
            # every service changed by this release so traffic returns to the
            # previously proven pair.
            if [ "$DEPLOY_BACKEND" = "true" ]; then
              backend_failure=true
            fi
            if [ "$DEPLOY_FRONTEND" = "true" ]; then
              frontend_failure=true
            fi
          fi
          if [ "$PARITY_OUTCOME" = "failure" ]; then
            parity_failed=true
          fi
          if [ "$DEPLOY_BACKEND" = "true" ] && [ "$CONNECTED_SYSTEMS_OUTCOME" != "success" ]; then
            connected_systems_failed=true
          fi
          if [ "$DEPLOY_BACKEND" = "true" ] && [ "$PARITY_OUTCOME" = "success" ] \
             && [ "$CONNECTED_SYSTEMS_OUTCOME" = "success" ]; then
            if [ "$DRIVE_ENABLED" = "true" ] && [ "$DRIVE_WORKER_OUTCOME" != "success" ]; then
              drive_worker_failed=true
            fi
            if [ "$DRIVE_ENABLED" != "true" ] && [ "$DRIVE_PAUSE_OUTCOME" != "success" ]; then
              drive_pause_failed=true
              backend_failure=true
            fi
          fi
          if [ "$PROMOTE_OUTCOME" = "failure" ]; then
            promote_failed=true
            # A multi-service promotion can fail after one service has already
            # shifted traffic. Roll back every selected service to its proven
            # predeploy revision; the rollback is safe and idempotent for a
            # service whose traffic never moved.
            if [ "$DEPLOY_BACKEND" = "true" ]; then
              backend_failure=true
            fi
            if [ "$DEPLOY_FRONTEND" = "true" ]; then
              frontend_failure=true
            fi
          fi
          if [ "$DEPLOY_BACKEND" = "true" ] && [ "$PROMOTE_OUTCOME" = "success" ] \
             && [ "$BACKEND_PROVENANCE_OUTCOME" != "success" ]; then
            backend_provenance_failed=true
            backend_failure=true
          fi
          if [ "$DEPLOY_FRONTEND" = "true" ] && [ "$PROMOTE_OUTCOME" = "success" ] \
             && [ "$FRONTEND_PROVENANCE_OUTCOME" != "success" ]; then
            frontend_provenance_failed=true
            frontend_failure=true
          fi
          if [ "$DEPLOY_FRONTEND" = "true" ] && [ "$PROMOTE_OUTCOME" = "success" ] \
             && [ "$PASSKEY_ASSOCIATIONS_OUTCOME" != "success" ]; then
            passkey_associations_failed=true
            frontend_failure=true
          fi

          # release_failed drives the workflow's final pass/fail. Required runtime
          # parity is not optional: missing consent origins, provider credentials,
          # or key mounts must fail closed before promotion.
          release_failed=false
          if [ "$upstream_failed" = "true" ] \
             || [ "$backend_failure" = "true" ] || [ "$frontend_failure" = "true" ] \
             || [ "$parity_failed" = "true" ] || [ "$connected_systems_failed" = "true" ] \
             || [ "$drive_worker_failed" = "true" ] || [ "$drive_pause_failed" = "true" ] \
             || [ "$promote_failed" = "true" ] \
             || [ "$backend_provenance_failed" = "true" ] \
             || [ "$frontend_provenance_failed" = "true" ] \
             || [ "$passkey_associations_failed" = "true" ] \
             || [ "$account_session_contract_failed" = "true" ]; then
            release_failed=true
          fi
          # Once this release paused a previously serving Drive job, a later
          # failure must restore the paired backend before restoring those jobs.
          if [ "$release_failed" = "true" ] && [ -n "$DRIVE_PAUSE_SNAPSHOT" ]; then
            backend_failure=true
          fi

          {
            echo "upstream_failed=$upstream_failed"
            echo "backend_failure=$backend_failure"
            echo "frontend_failure=$frontend_failure"
            echo "account_session_contract_failed=$account_session_contract_failed"
            echo "parity_failed=$parity_failed"
            echo "connected_systems_failed=$connected_systems_failed"
            echo "drive_worker_failed=$drive_worker_failed"
            echo "drive_pause_failed=$drive_pause_failed"
            echo "promote_failed=$promote_failed"
            echo "backend_provenance_failed=$backend_provenance_failed"
            echo "frontend_provenance_failed=$frontend_provenance_failed"
            echo "passkey_associations_failed=$passkey_associations_failed"
            echo "release_failed=$release_failed"
          } >> "$GITHUB_OUTPUT"

          echo "Release classification: release_failed=$release_failed upstream_failed=$upstream_failed backend_failure=$backend_failure frontend_failure=$frontend_failure account_session_contract_failed=$account_session_contract_failed parity_failed=$parity_failed connected_systems_failed=$connected_systems_failed promote_failed=$promote_failed backend_provenance_failed=$backend_provenance_failed frontend_provenance_failed=$frontend_provenance_failed passkey_associations_failed=$passkey_associations_failed"

      - name: Roll back backend revision
        id: rollback-backend
        if: always() && steps.classify.outputs.backend_failure == 'true' && steps.scope.outputs.deploy_backend == 'true' && steps.predeploy-state.outputs.backend_revision != ''
        shell: bash
        run: |
          set -euo pipefail
          rollback_revision="${{ steps.predeploy-state.outputs.backend_revision }}"
          echo "Backend release gate failed; evaluating rollback to predeploy revision ${rollback_revision}"
          gcloud run services describe "${{ env.BACKEND_SERVICE }}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --region="${{ env.GCP_REGION }}" \
            --format=json > /tmp/prod-backend-prerollback-service.json
          serving_revision="$(python3 - <<'PY'
          import json
          from pathlib import Path

          service = json.loads(
              Path('/tmp/prod-backend-prerollback-service.json').read_text(encoding='utf-8')
          )
          status = service.get('status') or {}
          positive = [
              item for item in (status.get('traffic') or [])
              if isinstance(item, dict) and int(item.get('percent') or 0) > 0
          ]
          if len(positive) != 1:
              raise SystemExit('Cannot authorize rollback from ambiguous backend traffic')
          revision = str(positive[0].get('revisionName') or '').strip()
          if not revision and positive[0].get('latestRevision'):
              revision = str(status.get('latestReadyRevisionName') or '').strip()
          if not revision:
              raise SystemExit('Cannot resolve current backend revision for rollback')
          print(revision)
          PY
          )"
          if [ "${serving_revision}" = "${rollback_revision}" ]; then
            echo "Backend rollback target already serves 100% traffic; no traffic mutation required."
            exit 0
          fi
          if [ "${{ steps.predeploy-db-gate.outcome }}" != "success" ]; then
            echo "Refusing backend rollback after an unproven migration boundary." >&2
            exit 1
          fi

          rollback_contract="$(gcloud run revisions describe "${rollback_revision}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --region="${{ env.GCP_REGION }}" \
            --format='value(metadata.labels.account-deletion-contract)' 2>/dev/null || true)"
          DB_USER="$(gcloud secrets versions access latest --secret=DB_USER --project="${{ env.GCP_PROJECT_ID }}")"
          DB_PASSWORD="$(gcloud secrets versions access latest --secret=DB_PASSWORD --project="${{ env.GCP_PROJECT_ID }}")"
          echo "::add-mask::${DB_USER}"
          echo "::add-mask::${DB_PASSWORD}"
          cloud-sql-proxy \
            --address 127.0.0.1 \
            --port 6544 \
            ${GOOGLE_GHA_CREDS_PATH:+--credentials-file="${GOOGLE_GHA_CREDS_PATH}"} \
            "${{ env.PROD_CLOUDSQL_INSTANCE }}" >/tmp/cloud-sql-proxy-prod-rollback.log 2>&1 &
          PROXY_PID=$!
          trap 'kill "${PROXY_PID}" >/dev/null 2>&1 || true' EXIT
          python3 - <<'PY'
          import socket
          import time

          deadline = time.time() + 20
          while time.time() < deadline:
              with socket.socket() as sock:
                  sock.settimeout(0.5)
                  if sock.connect_ex(("127.0.0.1", 6544)) == 0:
                      raise SystemExit(0)
              time.sleep(0.25)
          raise SystemExit("Cloud SQL proxy did not bind for rollback authorization")
          PY
          export PGHOST=127.0.0.1
          export PGPORT=6544
          export PGDATABASE="${{ env.PROD_DB_NAME }}"
          export PGUSER="$DB_USER"
          export PGPASSWORD="$DB_PASSWORD"
          psql --no-psqlrc \
            --file deploy/account-deletion/install_release_fence.sql \
            > /tmp/prod-account-deletion-fence-rollback.log
          tombstone_count="$(psql --no-psqlrc --tuples-only --no-align \
            --command 'SELECT count(*) FROM public.account_deletion_tombstones')"
          if [[ ! "${tombstone_count}" =~ ^[0-9]+$ ]]; then
            echo "Cannot authorize backend rollback without a tombstone count." >&2
            exit 1
          fi
          if [ "${rollback_contract}" != "v201" ] && [ "${tombstone_count}" != "0" ]; then
            echo "Refusing rollback to a pre-v201 backend after an account tombstone exists." >&2
            exit 1
          fi
          bash scripts/ci/cloudrun-rollback.sh \
            "${{ env.BACKEND_SERVICE }}" \
            "${{ env.GCP_REGION }}" \
            "${rollback_revision}"

      - name: Roll back frontend revision
        id: rollback-frontend
        if: always() && steps.classify.outputs.frontend_failure == 'true' && steps.scope.outputs.deploy_frontend == 'true' && steps.predeploy-state.outputs.frontend_revision != ''
        shell: bash
        run: |
          set -euo pipefail
          echo "Frontend runtime health gate failed; reverting traffic to predeploy revision ${{ steps.predeploy-state.outputs.frontend_revision }}"
          bash scripts/ci/cloudrun-rollback.sh "${{ env.FRONTEND_SERVICE }}" "${{ env.GCP_REGION }}" "${{ steps.predeploy-state.outputs.frontend_revision }}"

      - name: Restore production Drive worker after paired release failure
        id: rollback-drive-worker
        if: always() && steps.classify.outputs.release_failed == 'true' && steps.deploy-drive-worker.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          bash deploy/drive/restore_prod_after_release_failure.sh \
            "${{ steps.deploy-drive-worker.outputs.previous_revision }}" \
            "${{ steps.deploy-drive-worker.outputs.worker_url }}"

      - name: Restore production Drive jobs after disabled release failure
        id: rollback-paused-drive-worker
        if: always() && steps.classify.outputs.release_failed == 'true' && steps.pause-drive-worker.outputs.snapshot != '' && steps.rollback-backend.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python3 deploy/drive/work_drain_scheduler_snapshot_prod.py restore \
            --snapshot "${{ steps.pause-drive-worker.outputs.snapshot }}" \
            --worker-origin "${{ steps.pause-drive-worker.outputs.worker_origin }}"

      - name: Activate tombstone-aware account deletion
        id: activate-account-deletion
        if: steps.classify.outputs.release_failed == 'false' && steps.scope.outputs.deploy_backend == 'true'
        shell: bash
        env:
          BACKEND_URL: ${{ env.CONSENT_API_PUBLIC_ORIGIN }}
          OIDC_AUDIENCE: ${{ env.CONSENT_API_PUBLIC_ORIGIN }}
          PROJECT_ID: ${{ env.GCP_PROJECT_ID }}
          SCHEDULER_LOCATION: ${{ env.GCP_REGION }}
          SCHEDULER_SERVICE_ACCOUNT_NAME: ${{ env.ACCOUNT_DELETION_SCHEDULER_SERVICE_ACCOUNT_ID }}
          JOB_NAME: ${{ env.ACCOUNT_DELETION_SCHEDULER_JOB }}
          BATCH_LIMIT: "10"
        run: |
          set -euo pipefail
          if [ "${PROJECT_ID}" != "hushh-pda" ] \
             || [ "${PROD_CLOUDSQL_INSTANCE}" != "hushh-pda:us-central1:hushh-vault-db" ]; then
            echo "Refusing account deletion activation: project or Cloud SQL instance is not the canonical production target." >&2
            exit 1
          fi
          bash deploy/account-deletion/setup_cleanup_scheduler.sh \
            | tee /tmp/prod-account-deletion-scheduler-setup.log

          gcloud scheduler jobs describe "${JOB_NAME}" \
            --project="${PROJECT_ID}" \
            --location="${SCHEDULER_LOCATION}" \
            --format=json > /tmp/prod-account-deletion-scheduler-config.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          job = json.loads(
              Path('/tmp/prod-account-deletion-scheduler-config.json').read_text(
                  encoding='utf-8'
              )
          )
          target = job.get('httpTarget') or {}
          oidc = target.get('oidcToken') or {}
          expected_uri = (
              'https://api.hushh.ai/api/account/deletion-cleanup/drain?limit=10'
          )
          expected_service_account_email = (
              f"{os.environ['SCHEDULER_SERVICE_ACCOUNT_NAME']}@"
              f"{os.environ['PROJECT_ID']}.iam.gserviceaccount.com"
          )
          checks = {
              'enabled': job.get('state') == 'ENABLED',
              'method': target.get('httpMethod') == 'POST',
              'uri': target.get('uri') == expected_uri,
              'service_account': oidc.get('serviceAccountEmail')
              == expected_service_account_email,
              'audience': oidc.get('audience') == 'https://api.hushh.ai',
          }
          if not all(checks.values()):
              raise SystemExit('Account deletion cleanup scheduler configuration drifted')
          PY

          # lastAttemptTime only proves that an attempt started. A release may
          # activate only after Cloud Logging records the matching HTTP target
          # completion with a concrete 2xx response; absent status is failure.
          scheduler_triggered_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          gcloud scheduler jobs run "${JOB_NAME}" \
            --project="${PROJECT_ID}" \
            --location="${SCHEDULER_LOCATION}"

          scheduler_job_resource="projects/${PROJECT_ID}/locations/${SCHEDULER_LOCATION}/jobs/${JOB_NAME}"
          expected_uri="${BACKEND_URL%/}/api/account/deletion-cleanup/drain?limit=${BATCH_LIMIT}"
          scheduler_log_filter="resource.type=\"cloud_scheduler_job\" AND resource.labels.project_id=\"${PROJECT_ID}\" AND resource.labels.location=\"${SCHEDULER_LOCATION}\" AND resource.labels.job_id=\"${JOB_NAME}\" AND logName=\"projects/${PROJECT_ID}/logs/cloudscheduler.googleapis.com%2Fexecutions\" AND timestamp>=\"${scheduler_triggered_at}\" AND jsonPayload.\"@type\"=\"type.googleapis.com/google.cloud.scheduler.logging.AttemptFinished\""
          scheduler_verified=false
          for _attempt in $(seq 1 72); do
            if ! gcloud logging read "${scheduler_log_filter}" \
              --project="${PROJECT_ID}" \
              --freshness=10m \
              --order=desc \
              --limit=20 \
              --format=json > /tmp/prod-account-deletion-scheduler-finished-logs.json; then
              echo "Cannot read Cloud Scheduler completion logs; grant the deploy identity logging.logEntries.list." >&2
              exit 1
            fi
            if python3 scripts/ci/verify-cloud-scheduler-attempt.py \
              --logs-json /tmp/prod-account-deletion-scheduler-finished-logs.json \
              --triggered-at "${scheduler_triggered_at}" \
              --expected-job "${scheduler_job_resource}" \
              --expected-uri "${expected_uri}" \
              --evidence-path /tmp/prod-account-deletion-scheduler-evidence.json
            then
              scheduler_verified=true
              break
            fi
            sleep 5
          done
          if [ "${scheduler_verified}" != "true" ]; then
            echo "Account deletion cleanup scheduler produced no fresh successful AttemptFinished evidence." >&2
            exit 1
          fi

          # Zero traffic is not a hard drain: an already-routed request can
          # still reach an old revision. Retire every pre-v201 backend revision
          # before removing the database fence, then prove none remain.
          gcloud run services describe "${{ env.BACKEND_SERVICE }}" \
            --project="${PROJECT_ID}" \
            --region="${{ env.GCP_REGION }}" \
            --format=json > /tmp/prod-backend-preactivation-service.json
          gcloud run revisions list \
            --service="${{ env.BACKEND_SERVICE }}" \
            --project="${PROJECT_ID}" \
            --region="${{ env.GCP_REGION }}" \
            --format=json > /tmp/prod-backend-preactivation-revisions.json
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          service = json.loads(
              Path('/tmp/prod-backend-preactivation-service.json').read_text(encoding='utf-8')
          )
          revisions = json.loads(
              Path('/tmp/prod-backend-preactivation-revisions.json').read_text(encoding='utf-8')
          )
          legacy = {
              str((revision.get('metadata') or {}).get('name') or '').strip()
              for revision in revisions
              if ((revision.get('metadata') or {}).get('labels') or {}).get('account-deletion-contract') != 'v201'
          }
          if any(not re.fullmatch(r'[a-z0-9-]+', revision) for revision in legacy):
              raise SystemExit('Refusing to retire an invalid legacy revision name')
          tags = []
          for entry in ((service.get('status') or {}).get('traffic') or []):
              if not isinstance(entry, dict):
                  continue
              revision = str(entry.get('revisionName') or '').strip()
              if revision in legacy and int(entry.get('percent') or 0) > 0:
                  raise SystemExit('A pre-v201 backend revision still has serving traffic')
              tag = str(entry.get('tag') or '').strip()
              if revision in legacy and tag:
                  if not re.fullmatch(r'[a-z][a-z0-9-]{0,62}', tag):
                      raise SystemExit('Refusing to remove an invalid legacy traffic tag')
                  tags.append(tag)
          Path('/tmp/prod-backend-legacy-revisions.txt').write_text(
              ''.join(f'{revision}\n' for revision in sorted(legacy)), encoding='utf-8'
          )
          Path('/tmp/prod-backend-legacy-tags.txt').write_text(
              ','.join(sorted(set(tags))), encoding='utf-8'
          )
          PY
          legacy_tags="$(cat /tmp/prod-backend-legacy-tags.txt)"
          if [ -n "${legacy_tags}" ]; then
            gcloud run services update-traffic "${{ env.BACKEND_SERVICE }}" \
              --project="${PROJECT_ID}" \
              --region="${{ env.GCP_REGION }}" \
              --remove-tags="${legacy_tags}"
          fi
          while IFS= read -r legacy_revision; do
            [ -n "${legacy_revision}" ] || continue
            gcloud run revisions delete "${legacy_revision}" \
              --project="${PROJECT_ID}" \
              --region="${{ env.GCP_REGION }}" \
              --quiet
          done < /tmp/prod-backend-legacy-revisions.txt
          gcloud run revisions list \
            --service="${{ env.BACKEND_SERVICE }}" \
            --project="${PROJECT_ID}" \
            --region="${{ env.GCP_REGION }}" \
            --format=json > /tmp/prod-backend-postretirement-revisions.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          revisions = json.loads(
              Path('/tmp/prod-backend-postretirement-revisions.json').read_text(encoding='utf-8')
          )
          legacy = [
              str((revision.get('metadata') or {}).get('name') or '')
              for revision in revisions
              if ((revision.get('metadata') or {}).get('labels') or {}).get('account-deletion-contract') != 'v201'
          ]
          evidence = {'status': 'retired' if not legacy else 'blocked', 'remaining_pre_v201_count': len(legacy)}
          Path('/tmp/prod-account-deletion-revision-retirement.json').write_text(
              json.dumps(evidence, indent=2, sort_keys=True), encoding='utf-8'
          )
          if legacy:
              raise SystemExit('Pre-v201 backend revisions remain; retaining deletion fence')
          PY

          DB_USER="$(gcloud secrets versions access latest --secret=DB_USER --project="${PROJECT_ID}")"
          DB_PASSWORD="$(gcloud secrets versions access latest --secret=DB_PASSWORD --project="${PROJECT_ID}")"
          echo "::add-mask::${DB_USER}"
          echo "::add-mask::${DB_PASSWORD}"
          cloud-sql-proxy \
            --address 127.0.0.1 \
            --port 6544 \
            ${GOOGLE_GHA_CREDS_PATH:+--credentials-file="${GOOGLE_GHA_CREDS_PATH}"} \
            "${{ env.PROD_CLOUDSQL_INSTANCE }}" >/tmp/cloud-sql-proxy-prod-activation.log 2>&1 &
          PROXY_PID=$!
          trap 'kill "${PROXY_PID}" >/dev/null 2>&1 || true' EXIT
          python3 - <<'PY'
          import socket
          import time

          deadline = time.time() + 20
          while time.time() < deadline:
              with socket.socket() as sock:
                  sock.settimeout(0.5)
                  if sock.connect_ex(("127.0.0.1", 6544)) == 0:
                      raise SystemExit(0)
              time.sleep(0.25)
          raise SystemExit("Cloud SQL proxy did not bind for account deletion activation")
          PY
          export PGHOST=127.0.0.1
          export PGPORT=6544
          export PGDATABASE="${{ env.PROD_DB_NAME }}"
          export PGUSER="$DB_USER"
          export PGPASSWORD="$DB_PASSWORD"
          psql --no-psqlrc \
            --file deploy/account-deletion/verify_release_boundary.sql \
            > /tmp/prod-account-deletion-boundary-preactivation.log
          psql --no-psqlrc --tuples-only --no-align \
            --command "SELECT json_build_object(
              'counts_by_status', COALESCE((SELECT json_object_agg(cleanup_status, intent_count) FROM (SELECT cleanup_status, count(*) AS intent_count FROM public.account_deletion_tombstones GROUP BY cleanup_status) grouped), '{}'::json),
              'oldest_due_age_seconds', COALESCE((SELECT floor(extract(epoch FROM (now() - min(cleanup_next_attempt_at))))::bigint FROM public.account_deletion_tombstones WHERE firebase_uid IS NOT NULL AND cleanup_status <> 'completed' AND cleanup_next_attempt_at <= now()), 0)
            )" > /tmp/prod-account-deletion-cleanup-health.json
          psql --no-psqlrc \
            --file deploy/account-deletion/remove_release_fence.sql \
            | tee /tmp/prod-account-deletion-fence-removal.log
          echo "activated=true" >> "$GITHUB_OUTPUT"

      - name: Resolve final Cloud Run state
        id: final-state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          # A zero-percent candidate tag can sort ahead of the serving entry, so
          # never trust traffic order; resolve the single 100% revision.
          if ! gcloud run services describe "${{ env.BACKEND_SERVICE }}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --region="${{ env.GCP_REGION }}" \
            --format=json > /tmp/prod-backend-final-service.json 2>/dev/null; then
            printf '{}\n' > /tmp/prod-backend-final-service.json
          fi
          if ! gcloud run services describe "${{ env.FRONTEND_SERVICE }}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --region="${{ env.GCP_REGION }}" \
            --format=json > /tmp/prod-frontend-final-service.json 2>/dev/null; then
            printf '{}\n' > /tmp/prod-frontend-final-service.json
          fi
          backend_serving="$(python3 scripts/ci/resolve-cloud-run-serving-state.py \
            --service-json /tmp/prod-backend-final-service.json --allow-missing \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["revision"])')"
          frontend_serving="$(python3 scripts/ci/resolve-cloud-run-serving-state.py \
            --service-json /tmp/prod-frontend-final-service.json --allow-missing \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["revision"])')"
          echo "backend_serving=${backend_serving}" >> "$GITHUB_OUTPUT"
          echo "frontend_serving=${frontend_serving}" >> "$GITHUB_OUTPUT"

      - name: Write production release status artifact
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          STATUS="blocked"
          if [ "${{ steps.classify.outputs.release_failed }}" = "false" ]; then
            STATUS="healthy"
            if [ "${{ steps.scope.outputs.deploy_backend }}" = "true" ] \
               && [ "${{ steps.final-state.outputs.backend_serving }}" != "${{ steps.candidate-state.outputs.backend_revision }}" ]; then
              STATUS="blocked"
            fi
            if [ "${{ steps.scope.outputs.deploy_frontend }}" = "true" ] \
               && [ "${{ steps.final-state.outputs.frontend_serving }}" != "${{ steps.candidate-state.outputs.frontend_revision }}" ]; then
              STATUS="blocked"
            fi
            # A backend release is healthy only once tombstone-aware deletion is
            # activated; until then the fence keeps account deletion fail-closed.
            if [ "${{ steps.scope.outputs.deploy_backend }}" = "true" ] \
               && [ "${{ steps.activate-account-deletion.outcome }}" != "success" ]; then
              STATUS="blocked"
            fi
          else
            ROLLBACK_REQUIRED=false
            ROLLBACK_PROVEN=true
            if [ "${{ steps.classify.outputs.backend_failure }}" = "true" ]; then
              ROLLBACK_REQUIRED=true
              if [ "${{ steps.predeploy-state.outputs.backend_revision }}" = "" ] \
                 || [ "${{ steps.rollback-backend.outcome }}" != "success" ] \
                 || [ "${{ steps.final-state.outputs.backend_serving }}" != "${{ steps.predeploy-state.outputs.backend_revision }}" ]; then
                ROLLBACK_PROVEN=false
              fi
            fi
            if [ "${{ steps.classify.outputs.frontend_failure }}" = "true" ]; then
              ROLLBACK_REQUIRED=true
              if [ "${{ steps.predeploy-state.outputs.frontend_revision }}" = "" ] \
                 || [ "${{ steps.rollback-frontend.outcome }}" != "success" ] \
                 || [ "${{ steps.final-state.outputs.frontend_serving }}" != "${{ steps.predeploy-state.outputs.frontend_revision }}" ]; then
                ROLLBACK_PROVEN=false
              fi
            fi
            if [ "${{ steps.pause-drive-worker.outputs.snapshot }}" != "" ]; then
              ROLLBACK_REQUIRED=true
              if [ "${{ steps.rollback-paused-drive-worker.outcome }}" != "success" ]; then
                ROLLBACK_PROVEN=false
              fi
            fi
            if [ "$ROLLBACK_REQUIRED" = "true" ] && [ "$ROLLBACK_PROVEN" = "true" ]; then
              STATUS="rolled_back"
            fi
          fi
          export STATUS
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "status": os.environ["STATUS"],
              "sha": "${{ github.event.inputs.sha }}",
              "scope": "${{ steps.scope.outputs.scope }}",
              "predeploy": {
                  "backend_revision": "${{ steps.predeploy-state.outputs.backend_revision }}",
                  "frontend_revision": "${{ steps.predeploy-state.outputs.frontend_revision }}",
              },
              "candidate": {
                  "backend_revision": "${{ steps.candidate-state.outputs.backend_revision }}",
                  "frontend_revision": "${{ steps.candidate-state.outputs.frontend_revision }}",
              },
              "final": {
                  "backend_revision": "${{ steps.final-state.outputs.backend_serving }}",
                  "frontend_revision": "${{ steps.final-state.outputs.frontend_serving }}",
              },
              "verification": {
                  "runtime_parity": "${{ steps.verify-parity.outcome }}",
                  "connected_systems": "${{ steps.verify-connected-systems.outcome }}",
                  "backend_provenance": "${{ steps.verify-backend-provenance.outcome }}",
                  "frontend_provenance": "${{ steps.verify-frontend-provenance.outcome }}",
                  "backend_health": "${{ steps.health-backend.outcome }}",
                  "frontend_health": "${{ steps.health-frontend.outcome }}",
                  "passkey_domain_associations": "${{ steps.verify-passkey-associations.outcome }}",
                  "account_deletion_activation": "${{ steps.activate-account-deletion.outcome }}",
                  "account_deletion_activated": "${{ steps.activate-account-deletion.outputs.activated }}",
              },
              "classification": {
                  "release_failed": "${{ steps.classify.outputs.release_failed }}",
                  "promote_failed": "${{ steps.classify.outputs.promote_failed }}",
                  "backend_provenance_failed": "${{ steps.classify.outputs.backend_provenance_failed }}",
                  "frontend_provenance_failed": "${{ steps.classify.outputs.frontend_provenance_failed }}",
              },
              "rollback": {
                  "backend": "${{ steps.rollback-backend.outcome }}",
                  "frontend": "${{ steps.rollback-frontend.outcome }}",
                  "drive_jobs": "${{ steps.rollback-paused-drive-worker.outcome }}",
              },
          }
          Path("/tmp/prod-release-status.json").write_text(
              json.dumps(payload, indent=2), encoding="utf-8"
          )
          PY

      - name: Cancel an unused parallel frontend image build
        # Hygiene only: a release that stopped before the frontend deploy leaves
        # the web build running. It never affects release classification.
        if: always() && steps.start-frontend-image-build.outputs.build_id != '' && steps.build-frontend-image.outcome != 'success'
        continue-on-error: true
        shell: bash
        env:
          FRONTEND_IMAGE_BUILD_ID: ${{ steps.start-frontend-image-build.outputs.build_id }}
        run: |
          set -euo pipefail
          status="$(gcloud builds describe "${FRONTEND_IMAGE_BUILD_ID}" \
            --project="${{ env.GCP_PROJECT_ID }}" --format='value(status)')"
          case "${status}" in
            QUEUED|PENDING|WORKING)
              gcloud builds cancel "${FRONTEND_IMAGE_BUILD_ID}" --project="${{ env.GCP_PROJECT_ID }}"
              ;;
            *)
              echo "Frontend image build ${FRONTEND_IMAGE_BUILD_ID} is already ${status}; nothing to cancel."
              ;;
          esac

      - name: Upload production deploy artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: prod-release-${{ github.run_id }}
          if-no-files-found: error
          path: |
            /tmp/prod-runtime-secret-sync.json
            /tmp/prod-frontend-runtime-secret-sync.json
            /tmp/prod-runtime-parity.json
            /tmp/prod-connected-systems.log
            /tmp/prod-backend-provenance.json
            /tmp/prod-frontend-provenance.json
            /tmp/prod-backend-image.json
            /tmp/prod-backend-image-manifest.json
            /tmp/prod-backend-image-promotion-source.json
            /tmp/prod-uat-backend-image.json
            /tmp/prod-uat-backend-image-manifest.json
            /tmp/prod-frontend-image.json
            /tmp/prod-frontend-image-manifest.json
            /tmp/prod-backend-candidate.json
            /tmp/prod-backend-candidate-readiness.json
            /tmp/prod-backend-candidate-health.json
            /tmp/prod-account-deletion-fence-install.log
            /tmp/prod-account-deletion-fence-premigration.log
            /tmp/prod-account-deletion-boundary.log
            /tmp/prod-account-deletion-boundary-preactivation.log
            /tmp/prod-account-deletion-scheduler-setup.log
            /tmp/prod-account-deletion-scheduler-config.json
            /tmp/prod-account-deletion-scheduler-finished-logs.json
            /tmp/prod-account-deletion-scheduler-evidence.json
            /tmp/prod-account-deletion-cleanup-health.json
            /tmp/prod-account-deletion-revision-retirement.json
            /tmp/prod-account-deletion-fence-removal.log
            /tmp/cloud-sql-proxy-prod.log
            /tmp/cloud-sql-proxy-prod-fence.log
            /tmp/cloud-sql-proxy-prod-drift-gate.log
            /tmp/cloud-sql-proxy-prod-rollback.log
            /tmp/cloud-sql-proxy-prod-activation.log
            /tmp/prod-release-status.json

      - name: Deployment Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Production Release"
            echo ""
            echo "- Commit SHA: \`${{ github.event.inputs.sha }}\`"
            echo "- Scope: \`${{ steps.scope.outputs.scope }}\`"
            echo "- Release status: \`$(python3 -c "import json; from pathlib import Path; print(json.loads(Path('/tmp/prod-release-status.json').read_text(encoding='utf-8'))['status'])")\`"
            if [ "${{ steps.classify.outputs.release_failed }}" != "false" ]; then
              echo "- Status: \`FAILED\`"
            else
              echo "- Status: \`healthy\`"
            fi
            echo ""
            if [ "${{ steps.scope.outputs.deploy_backend }}" = "true" ]; then
              echo "- Backend URL: \`${{ steps.backend-url.outputs.url }}\`"
              echo "- Backend predeploy revision: \`${{ steps.predeploy-state.outputs.backend_revision || 'unknown' }}\`"
              echo "- Backend image source: \`${{ github.event.inputs.backend_image_source }}\`"
              echo "- Backend image: \`${{ steps.build-backend-image.outputs.image_reference || 'n/a' }}\`"
              if [ "${{ github.event.inputs.backend_image_source }}" = "promote-from-uat" ]; then
                echo "- Promoted from UAT revision: \`${{ steps.uat-verified-backend-image.outputs.uat_revision || 'n/a' }}\` (\`${{ steps.uat-verified-backend-image.outputs.uat_release_tag || 'n/a' }}\`)"
              fi
              echo "- Backend candidate revision: \`${{ steps.candidate-state.outputs.backend_revision || 'n/a' }}\`"
              echo "- Backend serving revision (final): \`${{ steps.final-state.outputs.backend_serving || 'unknown' }}\`"
              echo "- Backend health gate: \`${{ steps.health-backend.outcome }}\`"
              echo "- Backend rollback: \`${{ steps.rollback-backend.outcome }}\`"
              echo "- Account deletion activation: \`${{ steps.activate-account-deletion.outcome }}\`"
              echo "- Latest backup id: \`${{ steps.backup-gate.outputs.backup_id }}\`"
              echo "- Latest backup completed at: \`${{ steps.backup-gate.outputs.backup_completed_at }}\`"
            else
              echo "- Backend: skipped"
            fi
            if [ "${{ steps.scope.outputs.deploy_frontend }}" = "true" ]; then
              echo "- Frontend URL: \`${{ steps.frontend-url.outputs.url }}\`"
              echo "- Frontend predeploy revision: \`${{ steps.predeploy-state.outputs.frontend_revision || 'unknown' }}\`"
              echo "- Frontend candidate revision: \`${{ steps.candidate-state.outputs.frontend_revision || 'n/a' }}\`"
              echo "- Frontend serving revision (final): \`${{ steps.final-state.outputs.frontend_serving || 'unknown' }}\`"
              echo "- Frontend health gate: \`${{ steps.health-frontend.outcome }}\`"
              echo "- Frontend rollback: \`${{ steps.rollback-frontend.outcome }}\`"
            else
              echo "- Frontend: skipped"
            fi
            echo ""
            echo "- Traffic promotion: \`${{ steps.promote-traffic.outcome }}\`"
            echo "- Backend provenance: \`${{ steps.verify-backend-provenance.outcome }}\`"
            echo "- Frontend provenance: \`${{ steps.verify-frontend-provenance.outcome }}\`"
            echo "- Env parity: \`${{ steps.verify-parity.outcome }}\`"
            echo "- Connected Systems Omni Gateway: \`${{ steps.verify-connected-systems.outcome }}\`"
            echo "- Native passkey domain associations: \`${{ steps.verify-passkey-associations.outcome }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tag this release as last known good
        id: tag-last-known-good
        if: always()
        # Advisory annotation, not a release-health signal: the deploy above
        # already succeeded and classified healthy by this point. A tagging
        # failure (e.g. a transient push conflict) must never turn a healthy
        # release red or trigger the rollback investigation that implies.
        continue-on-error: true
        shell: bash
        env:
          ENVIRONMENT: production
          SHA: ${{ github.event.inputs.sha }}
          BACKEND_REVISION: ${{ steps.final-state.outputs.backend_serving }}
          BACKEND_SERVICE_URL: ${{ steps.backend-url.outputs.url }}
          FRONTEND_REVISION: ${{ steps.final-state.outputs.frontend_serving }}
          FRONTEND_SERVICE_URL: ${{ steps.frontend-url.outputs.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          STATUS="$(python3 -c "import json; from pathlib import Path; print(json.loads(Path('/tmp/prod-release-status.json').read_text(encoding='utf-8'))['status'])")"
          if [ "$STATUS" != "healthy" ]; then
            echo "[tag-last-known-good] Release status is '$STATUS', not 'healthy' — not tagging."
            exit 0
          fi
          bash scripts/ci/tag-last-known-good.sh

      - name: Fail workflow when production release did not end healthy
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(python3 -c "import json; from pathlib import Path; print(json.loads(Path('/tmp/prod-release-status.json').read_text(encoding='utf-8'))['status'])")"
          if [ "$STATUS" != "healthy" ]; then
            echo "Production release did not end healthy."
            echo "release_status=$STATUS"
            echo "upstream_failed=${{ steps.classify.outputs.upstream_failed }}"
            echo "backend_failure=${{ steps.classify.outputs.backend_failure }}"
            echo "frontend_failure=${{ steps.classify.outputs.frontend_failure }}"
            echo "parity_failed=${{ steps.classify.outputs.parity_failed }}"
            echo "promote_failed=${{ steps.classify.outputs.promote_failed }}"
            echo "backend_provenance_failed=${{ steps.classify.outputs.backend_provenance_failed }}"
            echo "frontend_provenance_failed=${{ steps.classify.outputs.frontend_provenance_failed }}"
            echo "account_deletion_activation=${{ steps.activate-account-deletion.outcome }}"
            echo "backend_rollback=${{ steps.rollback-backend.outcome }}"
            echo "frontend_rollback=${{ steps.rollback-frontend.outcome }}"
            if [ "${{ steps.rollback-backend.outcome }}" = "success" ] || [ "${{ steps.rollback-frontend.outcome }}" = "success" ]; then
              echo "Traffic was auto-reverted to the predeploy revision(s). Investigate before redeploying."
            fi
            exit 1
          fi
          echo "✅ Production release healthy; new revisions serving traffic."
