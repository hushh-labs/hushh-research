name: Capacity Maintenance

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      environment:
        description: Environment requiring an exceptional inspection
        required: true
        type: choice
        options: [uat, production]
      healthy_release_run_id:
        description: Verified release matching live traffic
        required: true
        type: string
      apply:
        description: Apply eligible cleanup without waiting for drainage
        required: true
        default: false
        type: boolean

# Coalesce only scheduled work; manual requests have independent identities.
# Keep the default one-pending queue here, never cancel an active mutation.
concurrency:
  group: capacity-maintenance-${{ github.event_name == 'schedule' && 'scheduled' || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  select-release:
    name: Verify due cleanup without cloud credentials
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      uat_ready: ${{ steps.uat.outputs.cleanup_ready }}
      production_ready: ${{ steps.production.outputs.cleanup_ready }}
    steps:
      - name: Checkout authority tooling
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Require main and governed manual actor
        shell: bash
        env:
          RELEASE_ENV: ${{ inputs.environment }}
          RELEASE_RUN_ID: ${{ inputs.healthy_release_run_id }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = main
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            [[ "$RELEASE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            python3 scripts/ci/assert-governed-actor.py --surface "$RELEASE_ENV" --actor "$GITHUB_ACTOR"
          fi
      - name: Verify due uat source
        id: uat
        if: github.event_name == 'schedule' || inputs.environment == 'uat'
        env:
          RELEASE_RUN_ID: ${{ inputs.healthy_release_run_id }}
        run: |
          python3 scripts/ci/uat-retention-maintenance.py --environment uat \
            --verify-source-only --release-run-id "$RELEASE_RUN_ID" \
            --state-dir "$RUNNER_TEMP/uat-retention-source"
      - name: Verify due production source
        id: production
        if: github.event_name == 'schedule' || inputs.environment == 'production'
        env:
          RELEASE_RUN_ID: ${{ inputs.healthy_release_run_id }}
        run: |
          python3 scripts/ci/uat-retention-maintenance.py --environment production \
            --verify-source-only --release-run-id "$RELEASE_RUN_ID" \
            --state-dir "$RUNNER_TEMP/production-retention-source"

  uat-maintenance:
    name: UAT bounded revision cleanup
    needs: select-release
    if: needs.select-release.outputs.uat_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    concurrency:
      group: deploy-uat
      cancel-in-progress: false
      queue: max
    environment:
      name: uat
      deployment: false
    env:
      GCP_PROJECT_ID: hushh-pda-uat
      GCP_REGION: us-central1
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout mutation tooling and rollback history
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Start the five-minute cleanup budget
        run: |
          python3 - <<'PYCODE'
          import os, time
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"HUSSH_RETENTION_DEADLINE_MONOTONIC={time.monotonic() + 295}\n")
          PYCODE
      - name: Recheck due source under the deployment lock
        id: locked-source
        env:
          RELEASE_RUN_ID: ${{ inputs.healthy_release_run_id }}
        run: |
          python3 scripts/ci/uat-retention-maintenance.py --environment uat \
            --verify-source-only --release-run-id "$RELEASE_RUN_ID" \
            --state-dir "$RUNNER_TEMP/uat-retention-state"
      - name: Authenticate to uat
        if: steps.locked-source.outputs.cleanup_ready == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          project_id: ${{ env.GCP_PROJECT_ID }}
          create_credentials_file: true
          export_environment_variables: true
      - name: Set up Cloud SDK
        if: steps.locked-source.outputs.cleanup_ready == 'true'
        uses: google-github-actions/setup-gcloud@v2
      - name: Prepare or finish eligible uat revision cleanup
        id: retention
        if: steps.locked-source.outputs.cleanup_ready == 'true'
        env:
          RELEASE_RUN_ID: ${{ inputs.healthy_release_run_id }}
          APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$APPLY" = true ]; then flags=(--apply); fi
          python3 scripts/ci/uat-retention-maintenance.py --environment uat \
            --release-run-id "$RELEASE_RUN_ID" \
            --state-dir "$RUNNER_TEMP/uat-retention-state" "${flags[@]}"
      - name: Save uat cleanup checkpoint
        if: always() && steps.locked-source.outputs.cleanup_ready == 'true' && steps.retention.outputs.checkpoint_ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: uat-retention-state
          path: ${{ runner.temp }}/uat-retention-state/
          retention-days: 7
          if-no-files-found: error
      - name: Report cleanup independently of release health
        if: always() && steps.locked-source.outputs.cleanup_ready == 'true'
        env:
          CLEANUP_OUTCOME: ${{ steps.retention.outputs.cleanup_outcome }}
        run: |
          echo "Cleanup: ${CLEANUP_OUTCOME:-failed}. This is not a deployment-capacity or release-health result." >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    name: Production bounded revision cleanup
    needs: select-release
    if: needs.select-release.outputs.production_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    concurrency:
      group: deploy-production
      cancel-in-progress: false
      queue: max
    environment:
      name: production
      deployment: false
    env:
      GCP_PROJECT_ID: hushh-pda
      GCP_REGION: us-central1
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout mutation tooling and rollback history
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Start the five-minute cleanup budget
        run: |
          python3 - <<'PYCODE'
          import os, time
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"HUSSH_RETENTION_DEADLINE_MONOTONIC={time.monotonic() + 295}\n")
          PYCODE
      - name: Recheck due source under the deployment lock
        id: locked-source
        env:
          RELEASE_RUN_ID: ${{ inputs.healthy_release_run_id }}
        run: |
          python3 scripts/ci/uat-retention-maintenance.py --environment production \
            --verify-source-only --release-run-id "$RELEASE_RUN_ID" \
            --state-dir "$RUNNER_TEMP/production-retention-state"
      - name: Authenticate to production
        if: steps.locked-source.outputs.cleanup_ready == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          project_id: ${{ env.GCP_PROJECT_ID }}
          create_credentials_file: true
          export_environment_variables: true
      - name: Set up Cloud SDK
        if: steps.locked-source.outputs.cleanup_ready == 'true'
        uses: google-github-actions/setup-gcloud@v2
      - name: Prepare or finish eligible production revision cleanup
        id: retention
        if: steps.locked-source.outputs.cleanup_ready == 'true'
        env:
          RELEASE_RUN_ID: ${{ inputs.healthy_release_run_id }}
          APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$APPLY" = true ]; then flags=(--apply); fi
          python3 scripts/ci/uat-retention-maintenance.py --environment production \
            --release-run-id "$RELEASE_RUN_ID" \
            --state-dir "$RUNNER_TEMP/production-retention-state" "${flags[@]}"
      - name: Save production cleanup checkpoint
        if: always() && steps.locked-source.outputs.cleanup_ready == 'true' && steps.retention.outputs.checkpoint_ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: production-retention-state
          path: ${{ runner.temp }}/production-retention-state/
          retention-days: 7
          if-no-files-found: error
      - name: Report cleanup independently of release health
        if: always() && steps.locked-source.outputs.cleanup_ready == 'true'
        env:
          CLEANUP_OUTCOME: ${{ steps.retention.outputs.cleanup_outcome }}
        run: |
          echo "Cleanup: ${CLEANUP_OUTCOME:-failed}. This is not a deployment-capacity or release-health result." >> "$GITHUB_STEP_SUMMARY"
