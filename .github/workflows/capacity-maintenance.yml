name: Capacity Maintenance

on:
  workflow_run:
    workflows: [Deploy to UAT, Deploy to Production]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "11,26,41,56 * * * *"
  workflow_dispatch:
    inputs:
      environment:
        description: UAT or production project to inspect or clean
        required: true
        type: choice
        options:
          - uat
          - production
      healthy_release_run_id:
        description: Successful deploy run whose release artifact matches live traffic
        required: true
        type: string
      apply:
        description: Apply cleanup (deletion is deferred until its drain deadline)
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: capacity-maintenance-${{ inputs.environment || 'uat' }}
  cancel-in-progress: false
  queue: max

jobs:
  select-release:
    name: Verify cleanup authority and healthy release
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      environment: ${{ steps.authority.outputs.environment }}
      release_run_id: ${{ steps.authority.outputs.release_run_id }}
      apply: ${{ steps.authority.outputs.apply }}
      cleanup_ready: ${{ steps.release.outputs.cleanup_ready || steps.scheduled-release.outputs.cleanup_ready }}
      production_cleanup_ready: ${{ steps.scheduled-production-release.outputs.cleanup_ready || (steps.authority.outputs.environment == 'production' && steps.release.outputs.cleanup_ready) || 'false' }}
      backend_revision: ${{ steps.release.outputs.backend_revision }}
      frontend_revision: ${{ steps.release.outputs.frontend_revision }}
      backend_rollback: ${{ steps.release.outputs.backend_rollback }}
      frontend_rollback: ${{ steps.release.outputs.frontend_rollback }}
    steps:
      - name: Resolve and validate cleanup authority
        id: authority
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = main
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          event_name = os.environ["GITHUB_EVENT_NAME"]
          if event_name == "workflow_run":
              run = event.get("workflow_run") or {}
              repository = os.environ["GITHUB_REPOSITORY"]
              workflow_path = run.get("path") or (event.get("workflow") or {}).get("path")
              lanes = {"Deploy to UAT": ("uat", ".github/workflows/deploy-uat.yml"),
                       "Deploy to Production": ("production", ".github/workflows/deploy-production.yml")}
              lane = lanes.get(run.get("name"))
              if not (lane
                  and workflow_path == lane[1]
                  and run.get("event") == "workflow_dispatch"
                  and run.get("status") == "completed"
                  and run.get("conclusion") == "success"
                  and run.get("head_branch") == "main"
                  and (run.get("repository") or {}).get("full_name") == repository
                  and (run.get("head_repository") or {}).get("full_name") == repository
              ):
                  raise SystemExit("Upstream run does not authorize hosted cleanup")
              environment = lane[0]
              release_run_id = str(run.get("id") or "")
              actor = (run.get("actor") or {}).get("login") or ""
              apply = "true"
          elif event_name == "workflow_dispatch":
              inputs = event.get("inputs") or {}
              environment = inputs.get("environment")
              release_run_id = str(inputs.get("healthy_release_run_id") or "")
              actor = os.environ["GITHUB_ACTOR"]
              apply = str(inputs.get("apply", False)).lower()
          elif event_name == "schedule":
              environment = "uat"
              release_run_id = ""
              actor = os.environ["GITHUB_ACTOR"]
              apply = "true"
          else:
              raise SystemExit("Unsupported cleanup trigger")
          if environment not in {"uat", "production"} or apply not in {"true", "false"}:
              raise SystemExit("Invalid cleanup environment or apply mode")
          if event_name != "schedule" and not re.fullmatch(r"[1-9][0-9]*", release_run_id):
              raise SystemExit("Invalid release run ID")
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9-]*(?:\[bot\])?", actor):
              raise SystemExit("Invalid cleanup actor")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              for key, value in (
                  ("environment", environment), ("release_run_id", release_run_id),
                  ("actor", actor), ("apply", apply),
              ):
                  print(f"{key}={value}", file=output)
          PY

      - name: Checkout current release tooling
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Require main and governed actor
        if: github.event_name != 'schedule'
        shell: bash
        env:
          RELEASE_ENV: ${{ steps.authority.outputs.environment }}
          CLEANUP_ACTOR: ${{ steps.authority.outputs.actor }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = main
          python3 scripts/ci/assert-governed-actor.py --surface "$RELEASE_ENV" --actor "$CLEANUP_ACTOR"

      - name: Verify scheduled source before cloud authentication
        id: scheduled-release
        if: github.event_name == 'schedule'
        run: |
          python3 scripts/ci/uat-retention-maintenance.py --verify-source-only \
            --state-dir "$RUNNER_TEMP/uat-retention-source"

      - name: Verify due production source before cloud authentication
        id: scheduled-production-release
        if: github.event_name == 'schedule'
        run: |
          python3 scripts/ci/uat-retention-maintenance.py --environment production --verify-source-only \
            --state-dir "$RUNNER_TEMP/production-retention-source"

      - name: Require a successful healthy release artifact
        if: github.event_name != 'schedule'
        id: release
        shell: bash
        env:
          RELEASE_RUN_ID: ${{ steps.authority.outputs.release_run_id }}
          RELEASE_ENV: ${{ steps.authority.outputs.environment }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_RUN_ID" =~ ^[0-9]+$ ]] || { echo "Invalid release run ID" >&2; exit 1; }
          expected_workflow="Deploy to UAT"
          artifact_name="uat-release-${RELEASE_RUN_ID}"
          status_file="uat-release-status.json"
          if [ "$RELEASE_ENV" = production ]; then
            expected_workflow="Deploy to Production"
            artifact_name="prod-release-${RELEASE_RUN_ID}"
            status_file="prod-release-status.json"
          fi
          gh run view "$RELEASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion,workflowName,headBranch,event \
            | jq -e --arg workflow "$expected_workflow" \
              '.conclusion == "success" and .workflowName == $workflow and .headBranch == "main" and .event == "workflow_dispatch"' >/dev/null
          # A successful UAT NO_OP has no release artifact and grants no cleanup.
          # Resolve this before entering an environment or minting cloud credentials.
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID/artifacts" --paginate --slurp)"
            if jq -e --arg name "$artifact_name" \
              '[.[].artifacts[] | select(.name == $name)] | length == 0' \
              <<<"$artifacts" >/dev/null; then
              echo "No release artifact; no automatic cleanup is authorized."
              echo "cleanup_ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            jq -e --arg name "$artifact_name" \
              '[.[].artifacts[] | select(.name == $name)] | length == 1 and .[0].expired == false' \
              <<<"$artifacts" >/dev/null
          fi
          mkdir -p "$RUNNER_TEMP/capacity-release"
          gh run download "$RELEASE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$artifact_name" --dir "$RUNNER_TEMP/capacity-release"
          python3 - "$RUNNER_TEMP/capacity-release/$status_file" "$GITHUB_OUTPUT" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if payload.get("status") != "healthy":
              raise SystemExit("Release artifact is not healthy")
          final = payload.get("final") or {}
          predeploy = payload.get("predeploy") or {}
          for key, service in (("backend_revision", "consent-protocol"), ("frontend_revision", "hushh-webapp")):
              pattern = rf"{service}-[a-z0-9-]+"
              if not isinstance(final.get(key), str) or not re.fullmatch(pattern, final[key]):
                  raise SystemExit(f"Healthy artifact lacks a valid {key}")
              rollback = predeploy.get(key) or ""
              if rollback and (not isinstance(rollback, str) or not re.fullmatch(pattern, rollback)):
                  raise SystemExit(f"Healthy artifact has an invalid rollback {key}")
          with Path(sys.argv[2]).open("a", encoding="utf-8") as output:
              for label, value in (
                  ("backend_revision", final["backend_revision"]),
                  ("frontend_revision", final["frontend_revision"]),
                  ("backend_rollback", predeploy.get("backend_revision") or ""),
                  ("frontend_rollback", predeploy.get("frontend_revision") or ""),
              ):
                  print(f"{label}={value}", file=output)
          PY
          # Manual dispatch needs the same exact source-path, repository and
          # source-actor proof as scheduled discovery before minting credentials.
          python3 scripts/ci/uat-retention-maintenance.py --environment "$RELEASE_ENV" \
            --release-run-id "$RELEASE_RUN_ID" --verify-source-only \
            --state-dir "$RUNNER_TEMP/$RELEASE_ENV-retention-source"

  uat-maintenance:
    name: UAT revision maintenance (no drain wait)
    needs: select-release
    if: needs.select-release.outputs.cleanup_ready == 'true' && needs.select-release.outputs.environment == 'uat'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Keep only this short mutation pass mutually exclusive with rollout/rollback.
    # The hour-long grace period is stored in an artifact and holds no runner/lock.
    concurrency:
      group: deploy-uat
      cancel-in-progress: false
      queue: max
    environment:
      name: uat
      deployment: false
    env:
      GCP_PROJECT_ID: hushh-pda-uat
      GCP_REGION: us-central1
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout current maintenance tooling
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Authenticate to UAT
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          project_id: ${{ env.GCP_PROJECT_ID }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Prepare or finish eligible UAT revision cleanup
        env:
          RELEASE_RUN_ID: ${{ needs.select-release.outputs.release_run_id }}
          APPLY: ${{ needs.select-release.outputs.apply }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$APPLY" = true ]; then flags=(--apply); fi
          python3 scripts/ci/uat-retention-maintenance.py \
            --release-run-id "$RELEASE_RUN_ID" \
            --state-dir "$RUNNER_TEMP/uat-retention-state" "${flags[@]}"

      - name: Save UAT drain evidence for a later maintenance pass
        if: success() && needs.select-release.outputs.apply == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: uat-retention-state
          path: ${{ runner.temp }}/uat-retention-state/
          retention-days: 7
          if-no-files-found: ignore

      - name: Report remaining UAT connection capacity
        if: needs.select-release.outputs.apply == 'true'
        continue-on-error: true
        run: python3 scripts/ci/runtime-capacity-budget.py --environment uat

  cleanup:
    concurrency:
      group: deploy-production
      cancel-in-progress: false
      queue: max
    name: Production revision maintenance (no drain wait)
    needs: select-release
    if: needs.select-release.outputs.production_cleanup_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      deployment: false
    env:
      GCP_PROJECT_ID: hushh-pda
      GCP_REGION: us-central1
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout current maintenance tooling
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false

      - name: Authenticate to production
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          project_id: ${{ env.GCP_PROJECT_ID }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Prepare or finish eligible production revision cleanup
        env:
          RELEASE_RUN_ID: ${{ needs.select-release.outputs.environment == 'production' && needs.select-release.outputs.release_run_id || '' }}
          APPLY: ${{ needs.select-release.outputs.apply }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$APPLY" = true ]; then flags=(--apply); fi
          python3 scripts/ci/uat-retention-maintenance.py --environment production \
            --release-run-id "$RELEASE_RUN_ID" \
            --state-dir "$RUNNER_TEMP/production-retention-state" "${flags[@]}"

      - name: Save production drain evidence for a later maintenance pass
        if: success() && needs.select-release.outputs.apply == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: production-retention-state
          path: ${{ runner.temp }}/production-retention-state/
          retention-days: 7
          if-no-files-found: ignore

      - name: Report remaining production connection capacity
        if: needs.select-release.outputs.apply == 'true'
        continue-on-error: true
        run: python3 scripts/ci/runtime-capacity-budget.py --environment production
