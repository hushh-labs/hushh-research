name: Capacity Maintenance

on:
  workflow_run:
    workflows: [Deploy to UAT, Deploy UAT One Chat Backend Only, Deploy to Production]
    types: [requested, completed]
    branches: [main]
  schedule:
    - cron: "11,26,41,56 * * * *"
  workflow_dispatch:
    inputs:
      environment:
        description: UAT or production project to inspect or clean
        required: true
        type: choice
        options:
          - uat
          - production
      healthy_release_run_id:
        description: Verified full, passkey-partial, or One chat deploy run matching live traffic
        required: true
        type: string
      apply:
        description: Apply cleanup (deletion is deferred until its drain deadline)
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  select-release:
    name: Verify cleanup authority and release evidence
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' || (github.event.workflow_run.name == 'Deploy to Production' && github.event.workflow_run.conclusion == 'failure') || (github.event.workflow_run.name == 'Deploy to UAT' && (github.event.action == 'requested' || github.event.workflow_run.conclusion == 'failure')) || (github.event.workflow_run.name == 'Deploy UAT One Chat Backend Only' && (github.event.action == 'requested' || github.event.workflow_run.conclusion == 'failure'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      environment: ${{ steps.authority.outputs.environment }}
      release_run_id: ${{ steps.authority.outputs.release_run_id }}
      apply: ${{ steps.authority.outputs.apply }}
      cleanup_ready: ${{ steps.release.outputs.cleanup_ready || steps.scheduled-release.outputs.cleanup_ready }}
      production_cleanup_ready: ${{ steps.scheduled-production-release.outputs.cleanup_ready || (steps.authority.outputs.environment == 'production' && steps.release.outputs.cleanup_ready) || 'false' }}
    steps:
      - name: Resolve and validate cleanup authority
        id: authority
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = main
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          event_name = os.environ["GITHUB_EVENT_NAME"]
          if event_name == "workflow_run":
              run = event.get("workflow_run") or {}
              repository = os.environ["GITHUB_REPOSITORY"]
              workflow_path = run.get("path") or (event.get("workflow") or {}).get("path")
              lanes = {
                  "Deploy to UAT": ("uat", ".github/workflows/deploy-uat.yml"),
                  "Deploy UAT One Chat Backend Only": (
                      "uat", ".github/workflows/deploy-uat-one-chat.yml"
                  ),
                  "Deploy to Production": (
                      "production", ".github/workflows/deploy-production.yml"
                  ),
              }
              lane = lanes.get(run.get("name"))
              requested_uat = event.get("action") == "requested" and lane and lane[0] == "uat"
              completed = (
                  event.get("action") == "completed"
                  and run.get("status") == "completed"
                  and run.get("conclusion") in {"success", "failure"}
              )
              if not (lane
                  and workflow_path == lane[1]
                  and run.get("event") == "workflow_dispatch"
                  and (completed or (requested_uat and run.get("conclusion") is None))
                  and run.get("head_branch") == "main"
                  and (run.get("repository") or {}).get("full_name") == repository
                  and (run.get("head_repository") or {}).get("full_name") == repository
              ):
                  raise SystemExit("Upstream run does not authorize hosted cleanup")
              environment = lane[0]
              # A requested or failed UAT deploy only wakes maintenance. It
              # cannot supply release authority; the helper independently
              # selects a completed source and verifies its live provenance.
              release_run_id = "" if environment == "uat" and (requested_uat or run.get("conclusion") == "failure") else str(run.get("id") or "")
              actor = (run.get("actor") or {}).get("login") or ""
              apply = "true"
          elif event_name == "workflow_dispatch":
              inputs = event.get("inputs") or {}
              environment = inputs.get("environment")
              release_run_id = str(inputs.get("healthy_release_run_id") or "")
              actor = os.environ["GITHUB_ACTOR"]
              apply = str(inputs.get("apply", False)).lower()
          elif event_name == "schedule":
              environment = "uat"
              release_run_id = ""
              actor = os.environ["GITHUB_ACTOR"]
              apply = "true"
          else:
              raise SystemExit("Unsupported cleanup trigger")
          if environment not in {"uat", "production"} or apply not in {"true", "false"}:
              raise SystemExit("Invalid cleanup environment or apply mode")
          observation_only = event_name == "workflow_run" and environment == "uat" and release_run_id == ""
          if event_name != "schedule" and not observation_only and not re.fullmatch(r"[1-9][0-9]*", release_run_id):
              raise SystemExit("Invalid release run ID")
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9-]*(?:\[bot\])?", actor):
              raise SystemExit("Invalid cleanup actor")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              for key, value in (
                  ("environment", environment), ("release_run_id", release_run_id),
                  ("actor", actor), ("apply", apply),
              ):
                  print(f"{key}={value}", file=output)
          PY

      - name: Checkout current release tooling
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Require main and governed actor
        if: github.event_name != 'schedule'
        shell: bash
        env:
          RELEASE_ENV: ${{ steps.authority.outputs.environment }}
          CLEANUP_ACTOR: ${{ steps.authority.outputs.actor }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = main
          python3 scripts/ci/assert-governed-actor.py --surface "$RELEASE_ENV" --actor "$CLEANUP_ACTOR"

      - name: Verify scheduled source before cloud authentication
        id: scheduled-release
        if: github.event_name == 'schedule'
        run: |
          python3 scripts/ci/uat-retention-maintenance.py --verify-source-only \
            --state-dir "$RUNNER_TEMP/uat-retention-source"

      - name: Verify due production source before cloud authentication
        id: scheduled-production-release
        if: github.event_name == 'schedule'
        run: |
          python3 scripts/ci/uat-retention-maintenance.py --environment production --verify-source-only \
            --state-dir "$RUNNER_TEMP/production-retention-source"

      - name: Verify healthy release and complete source authority
        if: github.event_name != 'schedule'
        id: release
        shell: bash
        env:
          RELEASE_RUN_ID: ${{ steps.authority.outputs.release_run_id }}
          RELEASE_ENV: ${{ steps.authority.outputs.environment }}
        run: |
          set -euo pipefail
          # The canonical helper verifies repository, workflow, actor and artifact
          # before either maintenance job can enter an environment or mint credentials.
          # Failed UAT deployments are observations only. The helper chooses
          # an independently verified source; production hygiene-only failures
          # additionally require all release gates to have passed.
          python3 scripts/ci/uat-retention-maintenance.py --environment "$RELEASE_ENV" \
            --release-run-id "$RELEASE_RUN_ID" --verify-source-only \
            --state-dir "$RUNNER_TEMP/$RELEASE_ENV-retention-source" \
            ${{ github.event_name == 'workflow_run' && github.event.action == 'requested' && '--force-inspection' || '' }}

  uat-maintenance:
    name: UAT revision maintenance (no drain wait)
    needs: select-release
    if: needs.select-release.outputs.cleanup_ready == 'true' && needs.select-release.outputs.environment == 'uat'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Short passes publish completed receipts; no runner waits through drainage.
    concurrency:
      group: deploy-uat
      cancel-in-progress: false
      queue: max
    environment:
      name: uat
      deployment: false
    env:
      GCP_PROJECT_ID: hushh-pda-uat
      GCP_REGION: us-central1
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout current maintenance tooling
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Authenticate to UAT
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          project_id: ${{ env.GCP_PROJECT_ID }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Prepare or finish eligible UAT revision cleanup
        id: retention
        env:
          RELEASE_RUN_ID: ${{ needs.select-release.outputs.release_run_id }}
          APPLY: ${{ needs.select-release.outputs.apply }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$APPLY" = true ]; then flags=(--apply); fi
          python3 scripts/ci/uat-retention-maintenance.py \
            --release-run-id "$RELEASE_RUN_ID" \
            --state-dir "$RUNNER_TEMP/uat-retention-state" "${flags[@]}" \
            ${{ github.event_name == 'workflow_run' && github.event.action == 'requested' && '--force-inspection' || '' }}

      - name: Save UAT drain evidence for a later maintenance pass
        if: success() && needs.select-release.outputs.apply == 'true' && steps.retention.outputs.verified_source_run_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: uat-retention-state
          path: ${{ runner.temp }}/uat-retention-state/
          retention-days: 7
          if-no-files-found: error

      - name: Report remaining UAT connection capacity
        if: needs.select-release.outputs.apply == 'true'
        continue-on-error: true
        run: |
          status=0
          python3 scripts/ci/runtime-capacity-budget.py --environment uat --phase post-release || status=$?
          case "$status" in
            0) outcome=ADMITTED ;;
            1) outcome=BLOCKED ;;
            *) outcome=UNVERIFIABLE ;;
          esac
          echo "Capacity: $outcome; cleanup success is independent." >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  cleanup:
    concurrency:
      group: deploy-production
      cancel-in-progress: false
      queue: max
    name: Production revision maintenance (no drain wait)
    needs: select-release
    if: needs.select-release.outputs.production_cleanup_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      deployment: false
    env:
      GCP_PROJECT_ID: hushh-pda
      GCP_REGION: us-central1
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout current maintenance tooling
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false

      - name: Authenticate to production
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          project_id: ${{ env.GCP_PROJECT_ID }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Prepare or finish eligible production revision cleanup
        env:
          RELEASE_RUN_ID: ${{ needs.select-release.outputs.environment == 'production' && needs.select-release.outputs.release_run_id || '' }}
          APPLY: ${{ needs.select-release.outputs.apply }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$APPLY" = true ]; then flags=(--apply); fi
          python3 scripts/ci/uat-retention-maintenance.py --environment production \
            --release-run-id "$RELEASE_RUN_ID" \
            --state-dir "$RUNNER_TEMP/production-retention-state" "${flags[@]}" \
            ${{ github.event_name == 'workflow_run' && github.event.action == 'requested' && '--force-inspection' || '' }}

      - name: Save production drain evidence for a later maintenance pass
        if: success() && needs.select-release.outputs.apply == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: production-retention-state
          path: ${{ runner.temp }}/production-retention-state/
          retention-days: 7
          if-no-files-found: ignore

      - name: Report remaining production connection capacity
        if: needs.select-release.outputs.apply == 'true'
        continue-on-error: true
        run: |
          status=0
          python3 scripts/ci/runtime-capacity-budget.py --environment production --phase post-release || status=$?
          case "$status" in
            0) outcome=ADMITTED ;;
            1) outcome=BLOCKED ;;
            *) outcome=UNVERIFIABLE ;;
          esac
          echo "Capacity: $outcome; cleanup success is independent." >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
