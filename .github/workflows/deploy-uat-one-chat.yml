name: Deploy UAT One Chat Backend Only

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Exact green main SHA for the One chat backend cutover"
        required: true
        type: string

permissions:
  contents: read
  checks: read
  actions: read
  id-token: write

concurrency:
  group: deploy-uat
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: Deploy only consent-protocol
    runs-on: ubuntu-latest
    environment: uat
    timeout-minutes: 65
    steps:
      - name: Assert main dispatch and governed actor
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = main
        env:
          TARGET_SHA: ${{ inputs.sha }}

      - name: Checkout main
        id: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Validate exact main SHA and actor
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ inputs.sha }}
          REQUIRED_BRANCH: main
          REQUIRE_CI_SUCCESS: "1"
          REQUIRED_CHECK_NAME: Main Post-Merge Smoke Gate
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          python3 scripts/ci/assert-governed-actor.py --surface uat --actor "$GITHUB_ACTOR"
          bash scripts/ci/require-deploy-sha-on-main.sh "$TARGET_SHA"
          git checkout --detach "$TARGET_SHA"

      - name: Validate UAT identity configuration
        shell: bash
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test -n "$WIF_PROVIDER"
          test -n "$DEPLOY_SERVICE_ACCOUNT"

      - name: Authenticate to UAT
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          project_id: hushh-pda-uat
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set UAT project context
        run: gcloud config set project hushh-pda-uat

      - name: Enforce UAT database connection budget
        shell: bash
        run: python3 scripts/ci/runtime-capacity-budget.py --environment uat

      - name: Deploy and verify only the backend service
        id: deploy-backend
        shell: bash
        timeout-minutes: 45
        env:
          TARGET_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          test "$(gcloud config get-value project 2>/dev/null)" = hushh-pda-uat
          python3 scripts/ci/uat_one_chat_backend_release.py

      - name: Recover interrupted backend promotion
        if: always() && steps.checkout.outcome == 'success' && steps.deploy-backend.outcome != 'success'
        shell: bash
        timeout-minutes: 10
        env:
          TARGET_SHA: ${{ inputs.sha }}
        run: python3 scripts/ci/uat_one_chat_backend_release.py --recover-interrupted

      - name: Publish service-only release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uat-one-chat-backend-release
          path: ${{ runner.temp }}/uat-one-chat-*.json
          if-no-files-found: error
