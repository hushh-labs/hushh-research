name: "Verify Protected Configuration"

# A list stored in a secret can be destroyed by one careless write, because
# `gcloud secrets versions add` REPLACES the whole value. On 2026-09-03 the UAT
# phone allowlist went from 59 entries to 1 and it took FIVE DAYS to notice --
# it surfaced as "phone verification is broken", not as "configuration was
# deleted".
#
# A flat team cannot solve this by taking write access away. So this does not
# try to prevent the write. It shortens the time-to-notice from days to an hour,
# names the exact secret, and prints the one command that restores it.
#
# Deploy-time checks are not enough on their own: production deploys are rare,
# so a production wipe could sit undetected for weeks. This runs on a clock.

on:
  schedule:
    # Hourly. The cost of a run is four secret reads; the cost of missing a wipe
    # is an engineer losing a day to a symptom three layers away from the cause.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      health_build_operation:
        description: "Build only the reviewed UAT health image for an existing operation (empty runs checks)"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: verify-protected-lists-${{ inputs.health_build_operation != '' && 'image-build' || 'checks' }}
  cancel-in-progress: false

jobs:
  uat:
    if: inputs.health_build_operation == ''
    name: "UAT lists"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: uat
    env:
      GCP_PROJECT_ID: hushh-pda-uat
      AUTH_PHONE_RUNTIME_HEALTH_ENABLED: ${{ vars.AUTH_PHONE_RUNTIME_HEALTH_ENABLED || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          project_id: ${{ env.GCP_PROJECT_ID }}
          create_credentials_file: true
          export_environment_variables: true

      - uses: google-github-actions/setup-gcloud@v2

      - name: Verify UAT protected lists are intact
        run: |
          set --
          case "$AUTH_PHONE_RUNTIME_HEALTH_ENABLED" in
            true) set -- --check-phone-runtime ;;
            false) ;;
            *) echo "Invalid phone runtime health rollout setting" >&2; exit 1 ;;
          esac
          python3 scripts/ops/verify_secret_list_invariants.py \
            --project "${{ env.GCP_PROJECT_ID }}" --emit-health-log "$@"

  production:
    if: inputs.health_build_operation == ''
    name: "Production lists"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      GCP_PROJECT_ID: hushh-pda
      AUTH_PHONE_RUNTIME_HEALTH_ENABLED: ${{ vars.AUTH_PHONE_RUNTIME_HEALTH_ENABLED || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          project_id: ${{ env.GCP_PROJECT_ID }}
          create_credentials_file: true
          export_environment_variables: true

      - uses: google-github-actions/setup-gcloud@v2

      - name: Verify production protected lists are intact
        run: |
          set --
          case "$AUTH_PHONE_RUNTIME_HEALTH_ENABLED" in
            true) set -- --check-phone-runtime ;;
            false) ;;
            *) echo "Invalid phone runtime health rollout setting" >&2; exit 1 ;;
          esac
          python3 scripts/ops/verify_secret_list_invariants.py \
            --project "${{ env.GCP_PROJECT_ID }}" --emit-health-log "$@"

  health-image:
    name: "Build UAT health image (manual)"
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.health_build_operation != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: uat
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify governed operator before obtaining cloud credentials
        env:
          OPERATOR: ${{ github.actor }}
          HEALTH_OPERATION: ${{ inputs.health_build_operation }}
        run: |
          set -euo pipefail
          [[ "$HEALTH_OPERATION" =~ ^[0-9a-f]{32}$ ]]
          python3 scripts/ci/assert-governed-actor.py --surface uat --actor "$OPERATOR"
      - uses: ./consent-protocol/.github/actions/setup-python-uv
        with:
          protocol-dir: ./consent-protocol
          sync-dev-group: "false"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          project_id: hushh-pda-uat
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build reviewed monitoring image without application deployment
        env:
          HEALTH_OPERATION: ${{ inputs.health_build_operation }}
        run: |
          consent-protocol/.venv/bin/python deploy/observability/setup_auth_health.py --project hushh-pda-uat \
            --build-image --operation "$HEALTH_OPERATION" --receipt health-image.json
      - uses: actions/upload-artifact@v6
        with:
          name: auth-health-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: health-image.json
          if-no-files-found: error
          retention-days: 14
