name: Publish @hushh/mcp

on:
  workflow_dispatch:
    inputs:
      dist_tag:
        description: "npm dist-tag to publish after package verification"
        required: true
        default: latest
        type: choice
        options:
          - beta
          - latest

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    env:
      PACKAGE_DIR: packages/hushh-mcp

    steps:
      - name: Assert main-only release dispatch
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "main"

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          # npm trusted publishing requires Node >=22.14 and npm >=11.5.1.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - uses: ./consent-protocol/.github/actions/setup-python-uv
        with:
          python-version: "3.13"
          protocol-dir: ./consent-protocol

      - name: Install package dependencies
        working-directory: ${{ env.PACKAGE_DIR }}
        run: npm ci

      - name: Verify release artifact
        working-directory: ${{ env.PACKAGE_DIR }}
        run: npm run verify:package

      - name: Guard against duplicate npm version
        working-directory: ${{ env.PACKAGE_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "Version ${PACKAGE_NAME}@${PACKAGE_VERSION} is already published."
            exit 1
          fi

      - name: Publish package
        working-directory: ${{ env.PACKAGE_DIR }}
        # OIDC is selected by npm automatically. Do not add NODE_AUTH_TOKEN.
        run: npm publish --tag "${{ inputs.dist_tag }}" --provenance

      - name: Verify exact published package from a clean npm cache
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_NAME="$(node -p "require('./packages/hushh-mcp/package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./packages/hushh-mcp/package.json').version")"
          PACKAGE_SPEC="${PACKAGE_NAME}@${PACKAGE_VERSION}"
          PUBLISHED_METADATA="$(npm view "${PACKAGE_SPEC}" version dist.integrity dist.shasum dist.attestations --json)"
          PUBLISHED_METADATA="${PUBLISHED_METADATA}" node <<'NODE'
          const metadata = JSON.parse(process.env.PUBLISHED_METADATA);
          if (!metadata.version || !metadata["dist.integrity"] || !metadata["dist.shasum"]) {
            throw new Error("Published package metadata is missing version or integrity fields.");
          }
          if (!metadata["dist.attestations"]) {
            throw new Error("Published package is missing npm provenance attestations.");
          }
          NODE
          HUSHH_MCP_PACKAGE_SPEC="${PACKAGE_SPEC}" npm --prefix packages/hushh-mcp run verify:packed-runtime
