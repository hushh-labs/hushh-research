name: "CI Security Alerts"
run-name: Security alerts for ${{ github.event.workflow_run.id || inputs.source_run_id }} / ${{ github.event.workflow_run.run_attempt || inputs.source_attempt }} / ${{ github.event.workflow_run.head_sha || inputs.source_sha }}

on:
  workflow_run:
    workflows: ["PR Validation"]
    types: [in_progress]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Exact PR Validation run ID"
        required: true
        type: string
      source_attempt:
        description: "Current source run attempt"
        required: true
        type: string
      source_sha:
        description: "Exact source head SHA"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  alerts:
    name: "Read protected repository alerts"
    if: github.repository == 'hushh-labs/hushh-research' && github.ref == 'refs/heads/main'
    environment: ci-security
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read alerts and bind the exact source attempt
        run: python3 scripts/ci/github_security_authority.py
        env:
          GH_TOKEN: ${{ github.token }}
          GH_SECURITY_ALERTS_TOKEN: ${{ secrets.GH_SECURITY_ALERTS_TOKEN }}
      - name: Upload bounded security receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-security.json
          if-no-files-found: error
          retention-days: 2
