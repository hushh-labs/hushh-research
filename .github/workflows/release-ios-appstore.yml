name: Release iOS to App Store

# Production App Store release for Hushh One iOS. Cuts a build from an exact green
# `main` SHA, builds the Capacitor app against the PRODUCTION backend + PRODUCTION
# Firebase (hushh-pda), signs with Apple-managed signing via an App Store Connect
# API key using the production APNs entitlement (AppRelease.entitlements), uploads
# to App Store Connect, and then completes every automatable App Store step up to
# the final Apple review action.
#
# The same archive/export/upload is what feeds TestFlight; the App Store vs
# TestFlight difference is entirely at the version/submission layer below. This
# workflow does NOT auto-submit for public review: the irreversible "submit for
# App Store review" action only runs when BOTH `submit_for_review` and
# `ack_publish_blockers` are explicitly set true. Left at their defaults, the run
# stops after attaching the processed build to a MANUAL-release App Store version.
#
# Prod web sibling: .github/workflows/deploy-production.yml
# TestFlight sibling: .github/workflows/ship-ios-testflight.yml
# Runbook + secret/IAM setup: docs/guides/mobile/release-ios-appstore.md

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Exact green main SHA to release"
        required: true
        type: string
      dry_run:
        description: "Archive + sign but do NOT upload or touch App Store Connect (isolates signing)"
        required: false
        default: false
        type: boolean
      submit_for_review:
        description: "IRREVERSIBLE: submit the build for public App Store review (requires ack_publish_blockers)"
        required: false
        default: false
        type: boolean
      ack_publish_blockers:
        description: "I have cleared every publish-safety blocker in docs/guides/mobile/release-ios-appstore.md"
        required: false
        default: false
        type: boolean
      notes:
        description: "Optional note for the run summary"
        required: false
        type: string

permissions:
  contents: read
  checks: read
  id-token: write

env:
  GCP_PROJECT_ID: hushh-pda
  GCP_REGION: us-central1
  IOS_BUNDLE_ID: com.hushh.app
  XCODE_PROJECT: hushh-webapp/ios/App/App.xcodeproj
  XCODE_SCHEME: App
  PBXPROJ: hushh-webapp/ios/App/App.xcodeproj/project.pbxproj
  # Production APNs entitlement, applied only at archive time so the committed
  # pbxproj (and local/dev/TestFlight builds) stay on App/App.entitlements.
  IOS_RELEASE_ENTITLEMENTS: App/AppRelease.entitlements
  # cap:build (Next.js static export) is memory-heavy on the Apple-silicon runner.
  NODE_OPTIONS: --max-old-space-size=8192

concurrency:
  # Serialize dispatches so two runs can't race the same build number / version.
  group: release-ios-appstore
  cancel-in-progress: false

jobs:
  release:
    name: Build, upload & prepare iOS App Store release
    runs-on: macos-15
    environment: production
    timeout-minutes: 90

    steps:
      - name: Assert manual dispatch originates from main
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "Refusing iOS App Store release from '${GITHUB_REF_NAME}'. Trigger this workflow from 'main' only."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Assert production dispatch actor policy
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/assert-governed-actor.py --surface production --actor "${GITHUB_ACTOR}"

      - name: Validate release SHA against main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REQUIRED_BRANCH: main
          REQUIRE_CI_SUCCESS: "1"
          REQUIRED_CHECK_NAME: "Main Post-Merge Smoke Gate"
        run: bash scripts/ci/require-deploy-sha-on-main.sh "${{ github.event.inputs.sha }}"

      - name: Check out the exact release SHA (detached)
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "${{ github.event.inputs.sha }}"
          git --no-pager log -1 --oneline

      - name: Validate Google Cloud workload identity configuration
        shell: bash
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test -n "$WIF_PROVIDER" || { echo "Missing environment variable GCP_WORKLOAD_IDENTITY_PROVIDER" >&2; exit 1; }
          test -n "$DEPLOY_SERVICE_ACCOUNT" || { echo "Missing environment variable GCP_DEPLOY_SERVICE_ACCOUNT" >&2; exit 1; }

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # Xcode 26.3 → iOS 26 SDK + Swift 6.2 (both preinstalled on macos-15).
          # The app's Sign in with Apple handler switches over iOS-26 additions to
          # ASAuthorizationError.Code (.preferSignInWithApple,
          # .deviceNotConfiguredForPasskeyCreation) that Xcode 16.4's iOS 18.5 SDK
          # does not define. Swift 6.2 (>= 6.1) still resolves the swift-tools:6.1
          # Package.swift manifests in Firebase/GoogleAppMeasurement 12.11.0.
          xcode-version: "26.3"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: hushh-webapp/package-lock.json

      - name: Install web dependencies (must precede SPM resolve)
        shell: bash
        run: |
          set -euo pipefail
          # CapApp-SPM/Package.swift references ../../../node_modules, so the JS
          # deps must exist before any Swift Package Manager resolution.
          npm ci --prefix hushh-webapp

      - name: Authenticate to Google Cloud (production, WIF)
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          project_id: ${{ env.GCP_PROJECT_ID }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Assert GCP project scope
        shell: bash
        run: |
          set -euo pipefail
          gcloud config set project "${GCP_PROJECT_ID}"
          ACTIVE_PROJECT="$(gcloud config get-value project 2>/dev/null)"
          if [ "$ACTIVE_PROJECT" != "${GCP_PROJECT_ID}" ]; then
            echo "Refusing release: expected project '${GCP_PROJECT_ID}' but got '$ACTIVE_PROJECT'." >&2
            exit 1
          fi

      - name: Materialize production frontend contract + native Firebase config
        shell: bash
        run: |
          set -euo pipefail

          # Each NEXT_PUBLIC_* value is a GCP Secret Manager secret in hushh-pda
          # (same source of truth deploy-production.yml uses). The prod prep script
          # (prepare-ios-prod-archive.mjs) lets process env override APP_RUNTIME_PROFILE
          # and NEXT_PUBLIC_* keys, and hard-fails on a UAT or localhost backend.
          get() {
            gcloud secrets versions access latest --secret="$1" --project="${GCP_PROJECT_ID}" 2>/dev/null || true
          }
          require() {
            local name="$1" val="$2"
            if [ -z "$val" ]; then
              echo "Missing required GCP secret: $name (project ${GCP_PROJECT_ID})" >&2
              exit 1
            fi
          }
          put() { printf '%s=%s\n' "$1" "$2" >> "$GITHUB_ENV"; }

          BACKEND_URL="$(get BACKEND_URL)"
          require BACKEND_URL "$BACKEND_URL"
          # Fail fast on a non-production backend before the heavy web build.
          BACKEND_HOST="$(printf '%s' "$BACKEND_URL" | sed -E 's#^https?://##; s#/.*$##' | tr 'A-Z' 'a-z')"
          case "$BACKEND_HOST" in
            *uat*|*f2gsa4kfsq*|localhost|127.0.0.1|0.0.0.0|10.0.2.2)
              echo "Refusing release: NEXT_PUBLIC_BACKEND_URL resolves to non-production host '$BACKEND_HOST'." >&2
              exit 1
              ;;
          esac
          APP_URL="$(get APP_FRONTEND_ORIGIN)"
          [ -n "$APP_URL" ] || APP_URL="https://one.hushh.ai"

          FB_API_KEY="$(get NEXT_PUBLIC_FIREBASE_API_KEY)";           require NEXT_PUBLIC_FIREBASE_API_KEY "$FB_API_KEY"
          FB_AUTH_DOMAIN="$(get NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN)";    require NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN "$FB_AUTH_DOMAIN"
          FB_PROJECT_ID="$(get NEXT_PUBLIC_FIREBASE_PROJECT_ID)";      require NEXT_PUBLIC_FIREBASE_PROJECT_ID "$FB_PROJECT_ID"
          FB_STORAGE="$(get NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET)";     require NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET "$FB_STORAGE"
          FB_SENDER="$(get NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID)"; require NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID "$FB_SENDER"
          FB_APP_ID="$(get NEXT_PUBLIC_FIREBASE_APP_ID)";              require NEXT_PUBLIC_FIREBASE_APP_ID "$FB_APP_ID"
          FB_VAPID="$(get NEXT_PUBLIC_FIREBASE_VAPID_KEY)";            require NEXT_PUBLIC_FIREBASE_VAPID_KEY "$FB_VAPID"

          FB_MEASUREMENT="$(get NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID)"
          MAPS_IOS_KEY="$(get NEXT_PUBLIC_GOOGLE_MAPS_IOS_API_KEY)"

          echo "::add-mask::$FB_API_KEY"
          echo "::add-mask::$FB_VAPID"
          [ -n "$MAPS_IOS_KEY" ] && echo "::add-mask::$MAPS_IOS_KEY"

          put APP_RUNTIME_PROFILE "prod"
          put NEXT_PUBLIC_APP_ENV "production"
          put NEXT_PUBLIC_BACKEND_URL "$BACKEND_URL"
          put NEXT_PUBLIC_APP_URL "$APP_URL"
          put NEXT_PUBLIC_PASSKEY_RP_ID "one.hushh.ai"
          put NEXT_PUBLIC_FIREBASE_API_KEY "$FB_API_KEY"
          put NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN "$FB_AUTH_DOMAIN"
          put NEXT_PUBLIC_FIREBASE_PROJECT_ID "$FB_PROJECT_ID"
          put NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET "$FB_STORAGE"
          put NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID "$FB_SENDER"
          put NEXT_PUBLIC_FIREBASE_APP_ID "$FB_APP_ID"
          put NEXT_PUBLIC_FIREBASE_VAPID_KEY "$FB_VAPID"
          [ -n "$FB_MEASUREMENT" ] && put NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID "$FB_MEASUREMENT"
          [ -n "$MAPS_IOS_KEY" ] && put NEXT_PUBLIC_GOOGLE_MAPS_IOS_API_KEY "$MAPS_IOS_KEY"
          put NEXT_PUBLIC_OBSERVABILITY_ENABLED "true"
          put NEXT_PUBLIC_OBSERVABILITY_DEBUG "false"
          put NEXT_PUBLIC_OBSERVABILITY_SAMPLE_RATE "1"

          # Native GoogleService-Info.plist for the iOS target (production Firebase).
          PLIST_DEST="hushh-webapp/ios/App/App/GoogleService-Info.plist"
          if ! gcloud secrets describe IOS_GOOGLESERVICE_INFO_PLIST_B64 --project="${GCP_PROJECT_ID}" >/dev/null 2>&1; then
            echo "Missing GCP secret IOS_GOOGLESERVICE_INFO_PLIST_B64 in ${GCP_PROJECT_ID}." >&2
            echo "Create it from the PRODUCTION iOS GoogleService-Info.plist:" >&2
            echo "  base64 -i GoogleService-Info.plist | gcloud secrets create IOS_GOOGLESERVICE_INFO_PLIST_B64 --data-file=- --project=${GCP_PROJECT_ID}" >&2
            echo "See docs/guides/mobile/release-ios-appstore.md." >&2
            exit 1
          fi
          gcloud secrets versions access latest --secret=IOS_GOOGLESERVICE_INFO_PLIST_B64 --project="${GCP_PROJECT_ID}" \
            | openssl base64 -d -A > "$PLIST_DEST"
          if ! plutil -lint "$PLIST_DEST" >/dev/null 2>&1; then
            echo "Decoded GoogleService-Info.plist failed plist validation." >&2
            exit 1
          fi
          echo "Native GoogleService-Info.plist materialized (bundle ${IOS_BUNDLE_ID}, project ${FB_PROJECT_ID})."

      - name: Decode App Store Connect API key
        shell: bash
        run: |
          set -euo pipefail
          # The ASC signing key lives in GCP Secret Manager (hushh-pda):
          #   APPSTORE_CONNECT_API_KEY_P8_B64 / _KEY_ID / _ISSUER_ID.
          get() {
            gcloud secrets versions access latest --secret="$1" --project="${GCP_PROJECT_ID}" 2>/dev/null || true
          }
          for name in APPSTORE_CONNECT_API_KEY_P8_B64 APPSTORE_CONNECT_KEY_ID APPSTORE_CONNECT_ISSUER_ID; do
            if ! gcloud secrets describe "$name" --project="${GCP_PROJECT_ID}" >/dev/null 2>&1; then
              echo "Missing GCP secret $name in ${GCP_PROJECT_ID}." >&2
              echo "See docs/guides/mobile/release-ios-appstore.md for setup." >&2
              exit 1
            fi
          done
          ASC_KEY_ID="$(get APPSTORE_CONNECT_KEY_ID)"
          ASC_ISSUER_ID="$(get APPSTORE_CONNECT_ISSUER_ID)"
          echo "::add-mask::${ASC_KEY_ID}"
          echo "::add-mask::${ASC_ISSUER_ID}"
          umask 077
          get APPSTORE_CONNECT_API_KEY_P8_B64 | openssl base64 -d -A > "${RUNNER_TEMP}/asc.p8"
          chmod 600 "${RUNNER_TEMP}/asc.p8"
          if ! grep -q "BEGIN PRIVATE KEY" "${RUNNER_TEMP}/asc.p8"; then
            echo "Decoded ASC key is not a valid PEM .p8 (check APPSTORE_CONNECT_API_KEY_P8_B64)." >&2
            exit 1
          fi
          echo "ASC_KEY_ID=${ASC_KEY_ID}" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=${ASC_ISSUER_ID}" >> "$GITHUB_ENV"

      - name: Create signing keychain
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN="${RUNNER_TEMP}/app-signing.keychain-db"
          KC_PW="$(openssl rand -base64 24)"
          security create-keychain -p "$KC_PW" "$KEYCHAIN"
          security set-keychain-settings -lt 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" "login.keychain-db"
          security default-keychain -s "$KEYCHAIN"

      - name: Prepare iOS project (web build + cap sync, PRODUCTION backend)
        shell: bash
        run: |
          set -euo pipefail
          npm run --prefix hushh-webapp ios:prepare:prod

      - name: Create App Store Connect Python venv
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/asc-venv"
          "${RUNNER_TEMP}/asc-venv/bin/pip" install --quiet --disable-pip-version-check pyjwt cryptography

      - name: Resolve next build number
        id: build_number
        shell: bash
        run: |
          set -euo pipefail
          NEXT_BUILD="$("${RUNNER_TEMP}/asc-venv/bin/python" scripts/ci/resolve-ios-build-number.py \
            --p8-path "${RUNNER_TEMP}/asc.p8" \
            --key-id "${ASC_KEY_ID}" \
            --issuer-id "${ASC_ISSUER_ID}" \
            --bundle-id "${IOS_BUNDLE_ID}" \
            --pbxproj "${PBXPROJ}")"
          echo "next_build=${NEXT_BUILD}" >> "$GITHUB_OUTPUT"
          echo "Next build number: ${NEXT_BUILD}"

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/spm
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('hushh-webapp/ios/App/CapApp-SPM/Package.swift', 'hushh-webapp/ios/**/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Resolve Swift package dependencies
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project "${XCODE_PROJECT}" \
            -scheme "${XCODE_SCHEME}" \
            -clonedSourcePackagesDirPath "${RUNNER_TEMP}/spm"

      - name: Archive (production entitlements)
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          # CODE_SIGN_ENTITLEMENTS override swaps aps-environment development ->
          # production for the released binary without editing the committed pbxproj.
          xcodebuild \
            -project "${XCODE_PROJECT}" \
            -scheme "${XCODE_SCHEME}" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "${RUNNER_TEMP}/App.xcarchive" \
            -clonedSourcePackagesDirPath "${RUNNER_TEMP}/spm" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${RUNNER_TEMP}/asc.p8" \
            -authenticationKeyID "${ASC_KEY_ID}" \
            -authenticationKeyIssuerID "${ASC_ISSUER_ID}" \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGN_ENTITLEMENTS="${IOS_RELEASE_ENTITLEMENTS}" \
            CURRENT_PROJECT_VERSION="${{ steps.build_number.outputs.next_build }}" \
            archive 2>&1 | tee "${RUNNER_TEMP}/xcodebuild-archive.log"

      - name: Export & upload to App Store Connect
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          EXPORT_PLIST="hushh-webapp/ios/ExportOptions/AppStoreConnect.plist"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            EXPORT_PLIST="${RUNNER_TEMP}/ExportOptions.dryrun.plist"
            cp "hushh-webapp/ios/ExportOptions/AppStoreConnect.plist" "$EXPORT_PLIST"
            /usr/libexec/PlistBuddy -c "Set :destination export" "$EXPORT_PLIST"
            echo "DRY RUN: exporting signed .ipa without uploading to App Store Connect."
          fi
          xcodebuild -exportArchive \
            -archivePath "${RUNNER_TEMP}/App.xcarchive" \
            -exportOptionsPlist "$EXPORT_PLIST" \
            -exportPath "${RUNNER_TEMP}/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${RUNNER_TEMP}/asc.p8" \
            -authenticationKeyID "${ASC_KEY_ID}" \
            -authenticationKeyIssuerID "${ASC_ISSUER_ID}" \
            2>&1 | tee "${RUNNER_TEMP}/xcodebuild-export.log"

      - name: Prepare App Store version (attach build; gated submit)
        id: appstore
        if: ${{ github.event.inputs.dry_run != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          SUBMIT_ARGS=()
          if [ "${{ github.event.inputs.submit_for_review }}" = "true" ]; then
            if [ "${{ github.event.inputs.ack_publish_blockers }}" != "true" ]; then
              echo "submit_for_review=true requires ack_publish_blockers=true. Refusing to submit for public review." >&2
              exit 1
            fi
            echo "submit_for_review + ack_publish_blockers set: WILL submit for public App Store review (IRREVERSIBLE)."
            SUBMIT_ARGS+=(--submit)
          else
            echo "Prepare-only: ensuring MANUAL App Store version and attaching build; NOT submitting for review."
          fi
          "${RUNNER_TEMP}/asc-venv/bin/python" scripts/ci/submit-appstore-version.py \
            --p8-path "${RUNNER_TEMP}/asc.p8" \
            --key-id "${ASC_KEY_ID}" \
            --issuer-id "${ASC_ISSUER_ID}" \
            --bundle-id "${IOS_BUNDLE_ID}" \
            --pbxproj "${PBXPROJ}" \
            --build-number "${{ steps.build_number.outputs.next_build }}" \
            --release-type MANUAL \
            "${SUBMIT_ARGS[@]+"${SUBMIT_ARGS[@]}"}"

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-appstore-${{ steps.build_number.outputs.next_build }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            ${{ runner.temp }}/export/**
            ${{ runner.temp }}/xcodebuild-archive.log
            ${{ runner.temp }}/xcodebuild-export.log
            ${{ runner.temp }}/App.xcarchive/dSYMs/**

      - name: Job summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          MARKETING="$(grep -m1 -E 'MARKETING_VERSION[[:space:]]*=' "${PBXPROJ}" | sed -E 's/.*= *([^;]+);.*/\1/' | tr -d ' ')"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            MODE="dry run (no upload, no ASC changes)"
          elif [ "${{ github.event.inputs.submit_for_review }}" = "true" ]; then
            MODE="upload + submit for public App Store review"
          else
            MODE="upload + prepare App Store version (no review submission)"
          fi
          {
            echo "## Release iOS to App Store"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| SHA | \`${{ github.event.inputs.sha }}\` |"
            echo "| Version | ${MARKETING:-unknown} |"
            echo "| Build | ${{ steps.build_number.outputs.next_build }} |"
            echo "| Bundle | ${IOS_BUNDLE_ID} |"
            echo "| Backend | PRODUCTION (hushh-pda) |"
            echo "| Mode | ${MODE} |"
            if [ -n "${{ github.event.inputs.notes }}" ]; then
              echo "| Notes | ${{ github.event.inputs.notes }} |"
            fi
            echo ""
            if [ "${{ github.event.inputs.dry_run }}" != "true" ] && [ "${{ github.event.inputs.submit_for_review }}" != "true" ]; then
              echo "> Prepared the App Store version with the build attached. The final"
              echo "> **Submit for Review** action (and Apple's manual metadata / screenshots /"
              echo "> privacy nutrition labels / age rating / pricing) is still required — see"
              echo "> the runbook. Re-dispatch with \`submit_for_review=true\` +"
              echo "> \`ack_publish_blockers=true\` to submit programmatically."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
