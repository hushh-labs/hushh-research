name: Release iOS to App Store

# Public App Store release for Hushh One iOS. Cuts a build from an exact green
# `main` SHA and builds the Capacitor app against the backend chosen by
# `backend_target` (default `uat`; `production` for a store binary that talks
# to one.hushh.ai) + the shared Firebase authority (hushh-pda; config stored in
# hushh-pda-uat Secret Manager), signs with Apple-managed signing via an App Store
# Connect API key using the production APNs entitlement (AppRelease.entitlements,
# required for any store binary), uploads to App Store Connect, sets the required
# "What's New in This Version" notes, attaches the build, and — when asked — takes
# the single irreversible "submit for App Store review" action.
#
# The same archive/export/upload is what feeds TestFlight; the App Store vs
# TestFlight difference is entirely at the version/submission layer below. Set
# `submit_for_review=true` for the one-click path (build -> upload -> set What's
# New -> attach -> submit for public review). Left false, the run stops after
# attaching the processed build to a MANUAL-release App Store version.
#
# Backend note: `backend_target` picks the backend the binary talks to. The
# default `uat` keeps the historical behaviour (latest frontend + latest backend,
# matching UAT). `production` reads the environment-routing half of the public
# build contract (backend, app origin, analytics stream, storage bucket) from the
# production project through the production workload identity, and keeps the
# Apple signing material and the shared Firebase identity config where they
# already live. The two Firebase identity values are compared across projects
# and the run refuses if they differ. Push on a store binary routes through
# Apple's PRODUCTION APNs, so the shared Firebase project must hold a production APNs
# key for notifications to deliver — see the runbook.
#
# TestFlight sibling: .github/workflows/ship-ios-testflight.yml
# Runbook + secret/IAM setup: docs/guides/mobile/release-ios-appstore.md

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Exact green main SHA to release"
        required: true
        type: string
      dry_run:
        description: "Archive + sign but do NOT upload or touch App Store Connect (isolates signing)"
        required: false
        default: false
        type: boolean
      submit_for_review:
        description: "IRREVERSIBLE one-click: upload, set What's New, attach, and SUBMIT for public App Store review. False = stop after attaching the build."
        required: false
        default: false
        type: boolean
      release_after_approval:
        description: "Publish automatically after Apple approval. Requires submit_for_review and cleared publish-safety gates; false keeps manual release."
        required: false
        default: false
        type: boolean
      whats_new:
        description: "What's New in This Version (App Store release notes; Apple requires this for every new version)"
        required: false
        default: "Stability improvements and bug fixes."
        type: string
      notes:
        description: "Optional note for the run summary"
        required: false
        type: string
      backend_target:
        description: "Backend the binary talks to. uat = historical default; production = one.hushh.ai and the production API."
        required: false
        default: uat
        type: choice
        options:
          - uat
          - production

permissions:
  contents: read
  checks: read
  # Workload identity for the production contract read (backend_target=production).
  id-token: write

env:
  # Signing material, the ASC key, the native Firebase config and the shared
  # Firebase web identity live in hushh-pda-uat Secret Manager, exactly like the
  # TestFlight pipeline. Firebase identity remains on hushh-pda. With
  # backend_target=production only the routing values are read from hushh-pda.
  GCP_PROJECT_ID: hushh-pda-uat
  GCP_REGION: us-central1
  # Only read when backend_target=production: the routing half of the contract.
  PROD_GCP_PROJECT_ID: hushh-pda
  BACKEND_TARGET: ${{ github.event.inputs.backend_target || 'uat' }}
  IOS_BUNDLE_ID: com.hushh.app
  XCODE_PROJECT: hushh-webapp/ios/App/App.xcodeproj
  XCODE_SCHEME: App
  PBXPROJ: hushh-webapp/ios/App/App.xcodeproj/project.pbxproj
  # Production APNs entitlement, applied only at archive time so the committed
  # pbxproj (and local/dev/TestFlight builds) stay on App/App.entitlements.
  IOS_RELEASE_ENTITLEMENTS: App/AppRelease.entitlements
  # cap:build (Next.js static export) is memory-heavy on the Apple-silicon runner.
  NODE_OPTIONS: --max-old-space-size=8192

concurrency:
  # Serialize dispatches so two runs can't race the same build number / version.
  group: release-ios-appstore
  cancel-in-progress: false

jobs:
  release:
    name: Build, upload & prepare iOS App Store release
    runs-on: macos-15
    environment: production
    timeout-minutes: 90

    steps:
      - name: Assert manual dispatch originates from main
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "Refusing iOS App Store release from '${GITHUB_REF_NAME}'. Trigger this workflow from 'main' only."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Assert production dispatch actor policy
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/assert-governed-actor.py --surface production --actor "${GITHUB_ACTOR}"

      - name: Validate release SHA against main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REQUIRED_BRANCH: main
          REQUIRE_CI_SUCCESS: "1"
          REQUIRED_CHECK_NAME: "Main Post-Merge Smoke Gate"
        run: bash scripts/ci/require-deploy-sha-on-main.sh "${{ github.event.inputs.sha }}"

      - name: Check out the exact release SHA (detached)
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "${{ github.event.inputs.sha }}"
          git --no-pager log -1 --oneline

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # Xcode 26.3 → iOS 26 SDK + Swift 6.2 (both preinstalled on macos-15).
          # The app's Sign in with Apple handler switches over iOS-26 additions to
          # ASAuthorizationError.Code (.preferSignInWithApple,
          # .deviceNotConfiguredForPasskeyCreation) that Xcode 16.4's iOS 18.5 SDK
          # does not define. Swift 6.2 (>= 6.1) still resolves the swift-tools:6.1
          # Package.swift manifests in Firebase/GoogleAppMeasurement 12.11.0.
          xcode-version: "26.3"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: hushh-webapp/package-lock.json

      # verify:one-voice (below) runs consent-protocol generators that import
      # hushh_mcp; they resolve consent-protocol/.venv first, so install the
      # locked backend runtime exactly as ship-ios-testflight.yml does.
      - name: Set up locked consent-protocol runtime
        uses: ./consent-protocol/.github/actions/setup-python-uv
        with:
          python-version: "3.13"
          protocol-dir: ./consent-protocol
          sync-dev-group: "true"

      - name: Install web dependencies (must precede SPM resolve)
        shell: bash
        run: |
          set -euo pipefail
          # CapApp-SPM/Package.swift references ../../../node_modules, so the JS
          # deps must exist before any Swift Package Manager resolution.
          npm ci --prefix hushh-webapp

      # verify:one-voice regenerates the capability graph through the
      # consent-protocol Python package. Without its locked environment the
      # generator dies on `import dotenv` and no dispatch can pass the contract
      # gate. Same provisioning the TestFlight lane has had since 231c6e50f.
      - name: Set up locked consent-protocol runtime
        uses: ./consent-protocol/.github/actions/setup-python-uv
        with:
          python-version: "3.13"
          protocol-dir: ./consent-protocol
          sync-dev-group: "true"

      - name: Validate backend target
        shell: bash
        run: |
          set -euo pipefail
          case "${BACKEND_TARGET}" in
            uat|production) echo "Backend target: ${BACKEND_TARGET}" ;;
            *) echo "Refusing release: unknown backend_target '${BACKEND_TARGET}'." >&2; exit 1 ;;
          esac
          if [ "${{ inputs.release_after_approval }}" = "true" ] && [ "${{ inputs.submit_for_review }}" != "true" ]; then
            echo "Automatic publication requires an explicitly authorized review submission." >&2
            exit 1
          fi

      - name: Authenticate to Google Cloud (production contract)
        if: env.BACKEND_TARGET == 'production'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          project_id: ${{ env.PROD_GCP_PROJECT_ID }}

      - name: Set up gcloud (production contract)
        if: env.BACKEND_TARGET == 'production'
        uses: google-github-actions/setup-gcloud@v2

      - name: Read production routing contract
        if: env.BACKEND_TARGET == 'production'
        shell: bash
        run: |
          set -euo pipefail
          # Only the values that route a build to an environment are read here.
          # They are public identifiers (the live web bundle carries them), but
          # the production project stays their single source of truth.
          get() {
            gcloud secrets versions access latest --secret="$1" --project="${PROD_GCP_PROJECT_ID}" 2>/dev/null || true
          }
          require() {
            if [ -z "$2" ]; then
              echo "Missing required production secret: $1 (project ${PROD_GCP_PROJECT_ID})" >&2
              exit 1
            fi
          }
          put() { printf '%s=%s\n' "$1" "$2" >> "$GITHUB_ENV"; }

          PROD_BACKEND_URL="$(get BACKEND_URL)";                                require BACKEND_URL "$PROD_BACKEND_URL"
          PROD_APP_URL="$(get APP_FRONTEND_ORIGIN)"
          [ -n "$PROD_APP_URL" ] || PROD_APP_URL="https://one.hushh.ai"
          PROD_FB_PROJECT_ID="$(get NEXT_PUBLIC_FIREBASE_PROJECT_ID)";           require NEXT_PUBLIC_FIREBASE_PROJECT_ID "$PROD_FB_PROJECT_ID"
          PROD_FB_APP_ID="$(get NEXT_PUBLIC_FIREBASE_APP_ID)";                   require NEXT_PUBLIC_FIREBASE_APP_ID "$PROD_FB_APP_ID"
          PROD_FB_STORAGE="$(get NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET)";          require NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET "$PROD_FB_STORAGE"
          PROD_FB_MEASUREMENT="$(get NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID)"

          PROD_BACKEND_HOST="$(printf '%s' "$PROD_BACKEND_URL" | sed -E 's#^https?://##; s#/.*$##' | tr 'A-Z' 'a-z')"
          case "$PROD_BACKEND_HOST" in
            ""|*uat*|*f2gsa4kfsq*|localhost|127.0.0.1|0.0.0.0|10.0.2.2)
              echo "Refusing release: backend_target=production but the production BACKEND_URL resolves to '${PROD_BACKEND_HOST}'." >&2
              exit 1
              ;;
          esac
          case "$PROD_APP_URL" in
            *uat*) echo "Refusing release: production APP_FRONTEND_ORIGIN points at UAT." >&2; exit 1 ;;
          esac

          put PROD_BACKEND_URL "$PROD_BACKEND_URL"
          put PROD_APP_URL "$PROD_APP_URL"
          put PROD_FB_PROJECT_ID "$PROD_FB_PROJECT_ID"
          put PROD_FB_APP_ID "$PROD_FB_APP_ID"
          put PROD_FB_STORAGE "$PROD_FB_STORAGE"
          [ -n "$PROD_FB_MEASUREMENT" ] && put PROD_FB_MEASUREMENT "$PROD_FB_MEASUREMENT"
          echo "Production routing contract read (backend host ${PROD_BACKEND_HOST})."

      - name: Verify matching production backend revision
        if: env.BACKEND_TARGET == 'production'
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.inputs.sha }}
        run: |
          set -euo pipefail
          python3 scripts/ci/verify-cloudrun-revision-provenance.py \
            --project "$PROD_GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --service consent-protocol \
            --expected-env production \
            --expected-source deploy-production \
            --expected-sha "$EXPECTED_SHA" \
            --report-path "$RUNNER_TEMP/ios-backend-provenance.json"

      - name: Authenticate to Google Cloud (UAT)
        uses: google-github-actions/auth@v2
        with:
          # UAT-scoped SA key (repo-level secret, inherited by the production
          # environment). This build's contract, Firebase config, and ASC key all
          # live in hushh-pda-uat Secret Manager; the Firebase config itself targets
          # the shared hushh-pda identity authority.
          credentials_json: ${{ secrets.GCP_SA_KEY_UAT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Assert GCP project scope
        shell: bash
        run: |
          set -euo pipefail
          gcloud config set project "${GCP_PROJECT_ID}"
          ACTIVE_PROJECT="$(gcloud config get-value project 2>/dev/null)"
          if [ "$ACTIVE_PROJECT" != "${GCP_PROJECT_ID}" ]; then
            echo "Refusing release: expected project '${GCP_PROJECT_ID}' but got '$ACTIVE_PROJECT'." >&2
            exit 1
          fi

      - name: Materialize frontend contract + native Firebase config
        shell: bash
        run: |
          set -euo pipefail

          # Each NEXT_PUBLIC_* value is a GCP Secret Manager secret in
          # hushh-pda-uat (same source of truth deploy-uat.yml / the TestFlight
          # pipeline use). The prepare-ios-*-archive.mjs scripts let process env
          # override APP_RUNTIME_PROFILE and NEXT_PUBLIC_* keys. For
          # backend_target=production the routing values are replaced by the
          # production contract read above; the guard below pins each target.
          get() {
            gcloud secrets versions access latest --secret="$1" --project="${GCP_PROJECT_ID}" 2>/dev/null || true
          }
          require() {
            local name="$1" val="$2"
            if [ -z "$val" ]; then
              echo "Missing required GCP secret: $name (project ${GCP_PROJECT_ID})" >&2
              exit 1
            fi
          }
          put() { printf '%s=%s\n' "$1" "$2" >> "$GITHUB_ENV"; }

          FB_API_KEY="$(get NEXT_PUBLIC_FIREBASE_API_KEY)";           require NEXT_PUBLIC_FIREBASE_API_KEY "$FB_API_KEY"
          FB_AUTH_DOMAIN="$(get NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN)";    require NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN "$FB_AUTH_DOMAIN"
          FB_PROJECT_ID="$(get NEXT_PUBLIC_FIREBASE_PROJECT_ID)";      require NEXT_PUBLIC_FIREBASE_PROJECT_ID "$FB_PROJECT_ID"
          FB_STORAGE="$(get NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET)";     require NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET "$FB_STORAGE"
          FB_SENDER="$(get NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID)"; require NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID "$FB_SENDER"
          FB_APP_ID="$(get NEXT_PUBLIC_FIREBASE_APP_ID)";              require NEXT_PUBLIC_FIREBASE_APP_ID "$FB_APP_ID"
          FB_VAPID="$(get NEXT_PUBLIC_FIREBASE_VAPID_KEY)";            require NEXT_PUBLIC_FIREBASE_VAPID_KEY "$FB_VAPID"

          FB_MEASUREMENT="$(get NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID)"

          if [ "${BACKEND_TARGET}" = "production" ]; then
            # Routing values come from the production project (read in the
            # previous step). The native GoogleService-Info.plist and the
            # Firebase web identity below are only valid for a production
            # binary because both projects point at the one shared Firebase
            # app; refuse rather than ship a binary with split identity.
            if [ "${PROD_FB_PROJECT_ID:-}" != "$FB_PROJECT_ID" ] || [ "${PROD_FB_APP_ID:-}" != "$FB_APP_ID" ]; then
              echo "Refusing release: production and UAT Firebase identity differ, so the stored native Firebase config cannot serve a production binary." >&2
              exit 1
            fi
            BACKEND_URL="${PROD_BACKEND_URL:?production routing contract was not read}"
            APP_URL="${PROD_APP_URL:?production routing contract was not read}"
            FB_STORAGE="${PROD_FB_STORAGE:?production routing contract was not read}"
            FB_MEASUREMENT="${PROD_FB_MEASUREMENT:-$FB_MEASUREMENT}"
            RUNTIME_PROFILE="prod"
            APP_ENV="production"
          else
            BACKEND_URL="$(get BACKEND_URL)"
            require BACKEND_URL "$BACKEND_URL"
            # Fail fast BEFORE the heavy web build if the resolved backend is not
            # the UAT host (guards against a mis-scoped project or a
            # prod/localhost URL sneaking into a uat-target build).
            BACKEND_HOST="$(printf '%s' "$BACKEND_URL" | sed -E 's#^https?://##; s#/.*$##' | tr 'A-Z' 'a-z')"
            case "$BACKEND_HOST" in
              *uat*|*f2gsa4kfsq*)
                : # expected UAT backend
                ;;
              *)
                echo "Refusing release: backend_target=uat but NEXT_PUBLIC_BACKEND_URL resolves to '$BACKEND_HOST' (project ${GCP_PROJECT_ID})." >&2
                exit 1
                ;;
            esac
            APP_URL="$(get APP_FRONTEND_ORIGIN)"
            [ -n "$APP_URL" ] || APP_URL="https://uat.one.hushh.ai"
            RUNTIME_PROFILE="uat"
            APP_ENV="uat"
          fi
          MAPS_IOS_KEY="$(get NEXT_PUBLIC_GOOGLE_MAPS_IOS_API_KEY)"
          # The immersive "Your Map" uses the native SDK (iOS key), but the
          # onboarding location picker and LiveMap render Maps JS inside the
          # WKWebView and read the BROWSER key. Without it the webview map has no
          # key at all and silently degrades to the iframe embed.
          MAPS_BROWSER_KEY="$(get NEXT_PUBLIC_GOOGLE_MAPS_BROWSER_API_KEY)"

          echo "::add-mask::$FB_API_KEY"
          echo "::add-mask::$FB_VAPID"
          [ -n "$MAPS_IOS_KEY" ] && echo "::add-mask::$MAPS_IOS_KEY"
          [ -n "$MAPS_BROWSER_KEY" ] && echo "::add-mask::$MAPS_BROWSER_KEY"

          put APP_RUNTIME_PROFILE "$RUNTIME_PROFILE"
          put NEXT_PUBLIC_APP_ENV "$APP_ENV"
          put NEXT_PUBLIC_BACKEND_URL "$BACKEND_URL"
          put NEXT_PUBLIC_APP_URL "$APP_URL"
          put NEXT_PUBLIC_PASSKEY_RP_ID "one.hushh.ai"
          put NEXT_PUBLIC_FIREBASE_API_KEY "$FB_API_KEY"
          put NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN "$FB_AUTH_DOMAIN"
          put NEXT_PUBLIC_FIREBASE_PROJECT_ID "$FB_PROJECT_ID"
          put NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET "$FB_STORAGE"
          put NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID "$FB_SENDER"
          put NEXT_PUBLIC_FIREBASE_APP_ID "$FB_APP_ID"
          put NEXT_PUBLIC_FIREBASE_VAPID_KEY "$FB_VAPID"
          [ -n "$FB_MEASUREMENT" ] && put NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID "$FB_MEASUREMENT"
          [ -n "$MAPS_IOS_KEY" ] && put NEXT_PUBLIC_GOOGLE_MAPS_IOS_API_KEY "$MAPS_IOS_KEY"
          [ -n "$MAPS_BROWSER_KEY" ] && put NEXT_PUBLIC_GOOGLE_MAPS_BROWSER_API_KEY "$MAPS_BROWSER_KEY"
          put NEXT_PUBLIC_OBSERVABILITY_ENABLED "true"
          put NEXT_PUBLIC_OBSERVABILITY_DEBUG "false"
          put NEXT_PUBLIC_OBSERVABILITY_SAMPLE_RATE "1"

          # Materialize the canonical root source consumed by
          # sync:native-firebase-configs --platform ios. The prepare step copies
          # this validated source into the iOS app target.
          PLIST_SOURCE="GoogleService-Info.plist"
          if ! gcloud secrets describe IOS_GOOGLESERVICE_INFO_PLIST_B64 --project="${GCP_PROJECT_ID}" >/dev/null 2>&1; then
            echo "Missing GCP secret IOS_GOOGLESERVICE_INFO_PLIST_B64 in ${GCP_PROJECT_ID}." >&2
            echo "Create it from the UAT iOS GoogleService-Info.plist:" >&2
            echo "  base64 -i GoogleService-Info.plist | gcloud secrets create IOS_GOOGLESERVICE_INFO_PLIST_B64 --data-file=- --project=${GCP_PROJECT_ID}" >&2
            echo "See docs/guides/mobile/release-ios-appstore.md." >&2
            exit 1
          fi
          gcloud secrets versions access latest --secret=IOS_GOOGLESERVICE_INFO_PLIST_B64 --project="${GCP_PROJECT_ID}" \
            | openssl base64 -d -A > "$PLIST_SOURCE"
          if ! plutil -lint "$PLIST_SOURCE" >/dev/null 2>&1; then
            echo "Decoded GoogleService-Info.plist failed plist validation." >&2
            exit 1
          fi
          echo "Native GoogleService-Info.plist materialized (bundle ${IOS_BUNDLE_ID}, project ${FB_PROJECT_ID})."

      - name: Decode App Store Connect API key
        shell: bash
        run: |
          set -euo pipefail
          # The ASC signing key lives in GCP Secret Manager (hushh-pda-uat):
          #   APPSTORE_CONNECT_API_KEY_P8_B64 / _KEY_ID / _ISSUER_ID.
          get() {
            gcloud secrets versions access latest --secret="$1" --project="${GCP_PROJECT_ID}" 2>/dev/null || true
          }
          for name in APPSTORE_CONNECT_API_KEY_P8_B64 APPSTORE_CONNECT_KEY_ID APPSTORE_CONNECT_ISSUER_ID; do
            if ! gcloud secrets describe "$name" --project="${GCP_PROJECT_ID}" >/dev/null 2>&1; then
              echo "Missing GCP secret $name in ${GCP_PROJECT_ID}." >&2
              echo "See docs/guides/mobile/release-ios-appstore.md for setup." >&2
              exit 1
            fi
          done
          ASC_KEY_ID="$(get APPSTORE_CONNECT_KEY_ID)"
          ASC_ISSUER_ID="$(get APPSTORE_CONNECT_ISSUER_ID)"
          echo "::add-mask::${ASC_KEY_ID}"
          echo "::add-mask::${ASC_ISSUER_ID}"
          umask 077
          get APPSTORE_CONNECT_API_KEY_P8_B64 | openssl base64 -d -A > "${RUNNER_TEMP}/asc.p8"
          chmod 600 "${RUNNER_TEMP}/asc.p8"
          if ! grep -q "BEGIN PRIVATE KEY" "${RUNNER_TEMP}/asc.p8"; then
            echo "Decoded ASC key is not a valid PEM .p8 (check APPSTORE_CONNECT_API_KEY_P8_B64)." >&2
            exit 1
          fi
          echo "ASC_KEY_ID=${ASC_KEY_ID}" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=${ASC_ISSUER_ID}" >> "$GITHUB_ENV"

      - name: Create signing keychain
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN="${RUNNER_TEMP}/app-signing.keychain-db"
          KC_PW="$(openssl rand -base64 24)"
          security create-keychain -p "$KC_PW" "$KEYCHAIN"
          security set-keychain-settings -lt 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" "login.keychain-db"
          security default-keychain -s "$KEYCHAIN"

          # Import distribution certificate if present in GCP Secret Manager
          DIST_CERT_B64="$(gcloud secrets versions access latest --secret=APPSTORE_DISTRIBUTION_CERT_P12_B64 --project="${GCP_PROJECT_ID}" 2>/dev/null || true)"
          if [ -n "$DIST_CERT_B64" ]; then
            umask 077
            echo "$DIST_CERT_B64" | openssl base64 -d -A > "${RUNNER_TEMP}/dist_cert.p12"
            security import "${RUNNER_TEMP}/dist_cert.p12" -k "$KEYCHAIN" -P "" -A
            rm -f "${RUNNER_TEMP}/dist_cert.p12"
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KEYCHAIN" >/dev/null 2>&1 || true
            echo "Distribution certificate imported into signing keychain."
          fi

      - name: Prepare iOS project (web build + cap sync, selected backend)
        shell: bash
        run: |
          set -euo pipefail
          # Both preparers end in verify-ios-bundled-backend.sh, which refuses the
          # archive unless every native plugin's backendUrl equals the selected one.
          if [ "${BACKEND_TARGET}" = "production" ]; then
            npm run --prefix hushh-webapp ios:prepare:prod
          else
            npm run --prefix hushh-webapp ios:prepare:uat
          fi

      - name: Verify generated voice authority and consent contracts
        shell: bash
        run: |
          set -euo pipefail
          npm run --prefix hushh-webapp verify:one-voice
          npm run --prefix hushh-webapp verify:capacitor:static
          npm run --prefix hushh-webapp verify:capacitor:plugins
          npm run --prefix hushh-webapp verify:capacitor:product-assets

      - name: Create App Store Connect Python venv
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/asc-venv"
          "${RUNNER_TEMP}/asc-venv/bin/pip" install --quiet --disable-pip-version-check pyjwt cryptography

      - name: Resolve next build number
        id: build_number
        shell: bash
        run: |
          set -euo pipefail
          NEXT_BUILD="$("${RUNNER_TEMP}/asc-venv/bin/python" scripts/ci/resolve-ios-build-number.py \
            --p8-path "${RUNNER_TEMP}/asc.p8" \
            --key-id "${ASC_KEY_ID}" \
            --issuer-id "${ASC_ISSUER_ID}" \
            --bundle-id "${IOS_BUNDLE_ID}" \
            --pbxproj "${PBXPROJ}")"
          echo "next_build=${NEXT_BUILD}" >> "$GITHUB_OUTPUT"
          echo "Next build number: ${NEXT_BUILD}"

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/spm
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('hushh-webapp/ios/App/CapApp-SPM/Package.swift', 'hushh-webapp/ios/**/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Resolve Swift package dependencies
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project "${XCODE_PROJECT}" \
            -scheme "${XCODE_SCHEME}" \
            -clonedSourcePackagesDirPath "${RUNNER_TEMP}/spm"

      - name: Archive (production entitlements)
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          # CODE_SIGN_ENTITLEMENTS override swaps aps-environment development ->
          # production for the released binary without editing the committed
          # pbxproj. A store binary must use production APNs regardless of which
          # backend/Firebase config it talks to, so the shared Firebase project
          # needs a production APNs key for push to deliver -- see the runbook.
          xcodebuild \
            -project "${XCODE_PROJECT}" \
            -scheme "${XCODE_SCHEME}" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "${RUNNER_TEMP}/App.xcarchive" \
            -clonedSourcePackagesDirPath "${RUNNER_TEMP}/spm" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${RUNNER_TEMP}/asc.p8" \
            -authenticationKeyID "${ASC_KEY_ID}" \
            -authenticationKeyIssuerID "${ASC_ISSUER_ID}" \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGN_ENTITLEMENTS="${IOS_RELEASE_ENTITLEMENTS}" \
            CURRENT_PROJECT_VERSION="${{ steps.build_number.outputs.next_build }}" \
            archive 2>&1 | tee "${RUNNER_TEMP}/xcodebuild-archive.log"

      - name: Verify archived product voice assets and privacy declarations
        shell: bash
        run: |
          set -euo pipefail
          IOS_APP_BUNDLE_PATH="${RUNNER_TEMP}/App.xcarchive/Products/Applications/App.app" \
            npm run --prefix hushh-webapp verify:capacitor:product-assets

      - name: Assert the archive ships our own debug symbols
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="${RUNNER_TEMP}/App.xcarchive"
          APP_BIN="${ARCHIVE}/Products/Applications/App.app/App"
          APP_DSYM="${ARCHIVE}/dSYMs/App.app.dSYM"

          # FirebaseAnalytics, GoogleAppMeasurement, GoogleAppMeasurementIdentitySupport
          # and GoogleAdsOnDeviceConversion DO ship as their own dynamic libraries in
          # App.app/Frameworks (verified against the signed .ipa: MH_DYLIB, real UUIDs),
          # but Google publishes no dSYM for any of them -- the .xcframework contains
          # none, and none reaches the archive. So exportArchive logs "Upload Symbols
          # Failed" for each on every run, and crash frames inside those four libraries
          # genuinely will not symbolicate. That is an accepted loss we cannot close
          # from here (see R29), not a harmless one. This step exists so that permanent
          # noise can never hide the failure that matters: OUR dSYM going missing.
          #
          # LinkKit (Plaid, plaid-link-ios 7.1.2, an SPM binaryTarget added 2026-09-22
          # for native Plaid Link) is the same class: a closed-source dynamic library,
          # stripped to its export trie, and no plaid-link-ios release from 7.0.0-beta1
          # to 7.1.2 carries a dSYM. The shipped UUID (01485993-...) equals Plaid's
          # prebuilt binary, so nothing of ours is being dropped. Adding a binary SDK
          # means deciding its entry here; this list is the record of that decision.
          ALLOWED_WITHOUT_DSYM="FirebaseAnalytics GoogleAppMeasurement GoogleAppMeasurementIdentitySupport GoogleAdsOnDeviceConversion LinkKit"

          test -f "$APP_BIN" || { echo "::error::No app binary at $APP_BIN"; exit 1; }
          if [ ! -d "$APP_DSYM" ]; then
            echo "::error::The archive contains no App.app.dSYM, so crash reports for our own code would arrive unsymbolicated. Check that DEBUG_INFORMATION_FORMAT is dwarf-with-dsym for the Release configuration."
            exit 1
          fi

          app_uuids="$(dwarfdump --uuid "$APP_BIN" | awk '{print $2}' | sort)"
          dsym_uuids="$(dwarfdump --uuid "$APP_DSYM" | awk '{print $2}' | sort)"
          echo "app binary UUIDs:"; printf '%s\n' "$app_uuids" | sed 's/^/  /'
          echo "App.app.dSYM UUIDs:"; printf '%s\n' "$dsym_uuids" | sed 's/^/  /'

          [ -n "$app_uuids" ] || { echo "::error::The app binary reports no UUIDs."; exit 1; }
          if [ "$app_uuids" != "$dsym_uuids" ]; then
            echo "::error::App.app.dSYM does not match the shipped app binary; crash reports would not symbolicate."
            exit 1
          fi

          # Anything that actually ships as its own image must carry symbols.
          fail=0
          FW_DIR="${ARCHIVE}/Products/Applications/App.app/Frameworks"
          if [ -d "$FW_DIR" ]; then
            for fw in "$FW_DIR"/*.framework; do
              [ -e "$fw" ] || continue
              name="$(basename "$fw" .framework)"
              case " $ALLOWED_WITHOUT_DSYM " in
                *" $name "*) echo "  skip  $name (closed-source vendor binary; upstream ships no dSYM)"; continue ;;
              esac
              if [ -d "${ARCHIVE}/dSYMs/${name}.framework.dSYM" ]; then
                echo "  ok    $name"
              else
                echo "::error::Embedded framework $name ships with no dSYM and is not an approved exception."
                fail=1
              fi
            done
          fi
          [ "$fail" -eq 0 ] || exit 1

          echo "OK: App.app.dSYM present and matching; every separately shipped image has symbols or a named exception."

      - name: Export & upload to App Store Connect
        id: export_ipa
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          EXPORT_PLIST="hushh-webapp/ios/ExportOptions/AppStoreConnect.plist"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            EXPORT_PLIST="${RUNNER_TEMP}/ExportOptions.dryrun.plist"
            cp "hushh-webapp/ios/ExportOptions/AppStoreConnect.plist" "$EXPORT_PLIST"
            /usr/libexec/PlistBuddy -c "Set :destination export" "$EXPORT_PLIST"
            echo "DRY RUN: exporting signed .ipa without uploading to App Store Connect."
          fi
          xcodebuild -exportArchive \
            -archivePath "${RUNNER_TEMP}/App.xcarchive" \
            -exportOptionsPlist "$EXPORT_PLIST" \
            -exportPath "${RUNNER_TEMP}/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${RUNNER_TEMP}/asc.p8" \
            -authenticationKeyID "${ASC_KEY_ID}" \
            -authenticationKeyIssuerID "${ASC_ISSUER_ID}" \
            2>&1 | tee "${RUNNER_TEMP}/xcodebuild-export.log"

      # The same uploaded build can go to the TestFlight groups through
      # resume-ios-testflight.yml, which reads this receipt (same shape the
      # TestFlight lane writes). That is how a production-backed build reaches
      # testers without the UAT-only TestFlight lane building a second binary.
      - name: Preserve uploaded build identity for TestFlight distribution
        if: ${{ github.event.inputs.dry_run != 'true' }}
        shell: bash
        env:
          BUILD_NUMBER: ${{ steps.build_number.outputs.next_build }}
        run: |
          set -euo pipefail
          RELEASE_SHA="$(git rev-parse HEAD)" python3 - <<'PY'
          import json, os, pathlib, re
          version = re.search(r'MARKETING_VERSION\s*=\s*([^;]+)', pathlib.Path(os.environ['PBXPROJ']).read_text()).group(1).strip()
          receipt = dict(source_sha=os.environ['RELEASE_SHA'], build_number=os.environ['BUILD_NUMBER'], marketing_version=version, bundle_id=os.environ['IOS_BUNDLE_ID'], backend_target=os.environ['BACKEND_TARGET'])
          pathlib.Path(os.environ['RUNNER_TEMP'], 'testflight-upload-receipt.json').write_text(json.dumps(receipt))
          PY

      - name: Upload TestFlight distribution receipt
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: testflight-upload-receipt
          path: ${{ runner.temp }}/testflight-upload-receipt.json
          retention-days: 90
          if-no-files-found: error

      - name: Prepare App Store version (set What's New, attach build; one-click submit)
        id: appstore
        if: ${{ github.event.inputs.dry_run != 'true' }}
        shell: bash
        env:
          WHATS_NEW: ${{ inputs.whats_new }}
        run: |
          set -euo pipefail
          # bash 3.2 on macos runners: guard the possibly-empty array under set -u.
          SUBMIT_ARGS=()
          RELEASE_TYPE=MANUAL
          if [ "${{ inputs.release_after_approval }}" = "true" ]; then
            RELEASE_TYPE=AFTER_APPROVAL
          fi
          if [ "${{ github.event.inputs.submit_for_review }}" = "true" ]; then
            echo "::warning title=Public App Store submission::submit_for_review=true -> this run will SUBMIT the build for public Apple review (IRREVERSIBLE). Confirm the publish-safety checklist in docs/guides/mobile/release-ios-appstore.md (led by PrivacyInfo.xcprivacy privacy-label reconciliation) is cleared, and that ASC metadata/screenshots/age rating/pricing are set for this version."
            echo "submit_for_review=true: will set What's New, attach the build, and SUBMIT for public App Store review."
            SUBMIT_ARGS+=(--submit)
          else
            echo "Prepare-only: setting What's New, ensuring the MANUAL App Store version, and attaching the build; NOT submitting for review."
          fi
          "${RUNNER_TEMP}/asc-venv/bin/python" scripts/ci/submit-appstore-version.py \
            --p8-path "${RUNNER_TEMP}/asc.p8" \
            --key-id "${ASC_KEY_ID}" \
            --issuer-id "${ASC_ISSUER_ID}" \
            --bundle-id "${IOS_BUNDLE_ID}" \
            --pbxproj "${PBXPROJ}" \
            --build-number "${{ steps.build_number.outputs.next_build }}" \
            --release-type "$RELEASE_TYPE" \
            --evidence-path "${RUNNER_TEMP}/ios-appstore-state.json" \
            --whats-new "$WHATS_NEW" \
            "${SUBMIT_ARGS[@]+"${SUBMIT_ARGS[@]}"}"

      - name: Write redacted release evidence
        if: always()
        shell: bash
        env:
          RELEASE_SHA: ${{ github.event.inputs.sha }}
          BUILD_NUMBER: ${{ steps.build_number.outputs.next_build }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          EXPORT_OUTCOME: ${{ steps.export_ipa.outcome }}
          APPSTORE_OUTCOME: ${{ steps.appstore.outcome }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, re
          sha = os.environ.get('RELEASE_SHA', '')
          build = os.environ.get('BUILD_NUMBER', '')
          receipt = {
              'source_sha': sha if re.fullmatch(r'[0-9a-f]{40}', sha) else None,
              'build_number': build if re.fullmatch(r'[0-9]+', build) else None,
              'dry_run': os.environ.get('DRY_RUN') == 'true',
              'export_outcome': os.environ.get('EXPORT_OUTCOME'),
              'appstore_outcome': os.environ.get('APPSTORE_OUTCOME'),
              'backend_target': os.environ.get('BACKEND_TARGET'),
          }
          state_path = pathlib.Path(os.environ['RUNNER_TEMP'], 'ios-appstore-state.json')
          receipt['appstore_state'] = json.loads(state_path.read_text()) if state_path.exists() else None
          pathlib.Path(os.environ['RUNNER_TEMP'], 'ios-appstore-release-evidence.json').write_text(json.dumps(receipt))
          PY

      - name: Upload redacted release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-appstore-redacted-evidence-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: ${{ runner.temp }}/ios-appstore-release-evidence.json

      - name: Job summary
        if: always()
        shell: bash
        env:
          EXPORT_OUTCOME: ${{ steps.export_ipa.outcome }}
          APPSTORE_OUTCOME: ${{ steps.appstore.outcome }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          MARKETING="$(grep -m1 -E 'MARKETING_VERSION[[:space:]]*=' "${PBXPROJ}" | sed -E 's/.*= *([^;]+);.*/\1/' | tr -d ' ')"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            MODE="dry run (no upload, no ASC changes)"
          elif [ "${{ github.event.inputs.submit_for_review }}" = "true" ]; then
            MODE="upload + submit for public App Store review"
          else
            MODE="upload + prepare App Store version (no review submission)"
          fi
          {
            echo "## Release iOS to App Store"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| SHA | \`${{ github.event.inputs.sha }}\` |"
            echo "| Version | ${MARKETING:-unknown} |"
            echo "| Build | ${{ steps.build_number.outputs.next_build }} |"
            echo "| Bundle | ${IOS_BUNDLE_ID} |"
            if [ "${BACKEND_TARGET}" = "production" ]; then
              echo "| Backend | production (hushh-pda, one.hushh.ai) |"
            else
              echo "| Backend | UAT (hushh-pda-uat) |"
            fi
            echo "| Mode | ${MODE} |"
            echo "| Export outcome | ${EXPORT_OUTCOME:-not run} |"
            echo "| App Store outcome | ${APPSTORE_OUTCOME:-not run} |"
            echo "| Automatic publication after approval | ${{ inputs.release_after_approval }} |"
            if [ -n "$RELEASE_NOTES" ]; then
              printf '| Notes | %s |\n' "$RELEASE_NOTES"
            fi
            echo ""
            if [ "$EXPORT_OUTCOME" != "success" ] || { [ "${{ github.event.inputs.dry_run }}" != "true" ] && [ "$APPSTORE_OUTCOME" != "success" ]; }; then
              echo "> Release incomplete. Inspect the failed step and redacted evidence; do not infer upload, submission, or publication."
            elif [ "${{ github.event.inputs.dry_run }}" != "true" ] && [ "${{ github.event.inputs.submit_for_review }}" != "true" ]; then
              echo "> Set What's New, prepared the App Store version, and attached the build."
              echo "> The final **Submit for Review** action was NOT fired. Re-dispatch with"
              echo "> \`submit_for_review=true\` to submit for public Apple review in one click"
              echo "> (screenshots / age rating / pricing are reused from the existing ASC"
              echo "> listing and stay stable across versions — see the runbook). Confirm the"
              echo "> publish-safety checklist (docs/guides/mobile/release-ios-appstore.md) first."
            elif [ "${{ github.event.inputs.submit_for_review }}" = "true" ] && [ "${{ github.event.inputs.dry_run }}" != "true" ]; then
              echo "> Set What's New, attached the build, and SUBMITTED for public App Store"
              echo "> review. Track the review state in App Store Connect."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
