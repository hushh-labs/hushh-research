name: "Queue Validation"

# A thin pass-through, not a second copy of CI (2026-09).
#
# This workflow used to re-run the whole CI surface on every merge group. No PR
# has entered the queue since 2026-09-01 (maintainers bypass it), and its
# web-full step was red in each of its last six runs, so it validated nothing
# that merged. The full Vitest suite and the contract verifiers it ran now gate
# every frontend PR in PR Validation (`Web Full Suite (Vitest)`).
#
# It is kept, rather than deleted, because `main` requires the `CI Status Gate`
# check and has an active merge-queue ruleset: a PR that enters the queue needs
# a `CI Status Gate` on its merge group, or the entry times out and is dropped.
#
# The pass-through never vouches for content CI has not seen. It accepts a
# merge group only when its git tree is identical to the PR head's tree and the
# latest PR Validation run on that head passed `CI Status Gate`; see
# scripts/ci/verify-queue-entry-reuses-pr-validation.py. The freshness gate
# still runs on the merge group itself.

on:
  merge_group:
    branches: [main, integration/pr-train]

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-validation-reuse:
    name: "Reuse PR Validation Result"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Require PR Validation to have passed on this exact tree
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: python3 scripts/ci/verify-queue-entry-reuses-pr-validation.py

  main-freshness-gate:
    name: "Base Freshness Gate"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Verify queue freshness against merge-group base
        env:
          MAIN_SYNC_REMOTE: origin
          MAIN_SYNC_MODE: block
          MAIN_SYNC_CURRENT_BRANCH: ${{ github.ref_name }}
          QUEUE_BASE_REF: ${{ github.event.merge_group.base_ref }}
        run: |
          base="${QUEUE_BASE_REF#refs/heads/}"
          if [ -z "$base" ]; then
            base="main"
          fi
          MAIN_SYNC_BRANCH="$base" sh scripts/git/check-main-sync.sh

  ci-status:
    name: "CI Status Gate"
    needs:
      - pr-validation-reuse
      - main-freshness-gate
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate queue job outcomes
        shell: bash
        run: |
          PR_VALIDATION_REUSE="${{ needs['pr-validation-reuse'].result }}"
          MAIN_FRESHNESS="${{ needs['main-freshness-gate'].result }}"

          printf 'pr-validation-reuse=%s\n' "$PR_VALIDATION_REUSE"
          printf 'main-freshness-gate=%s\n' "$MAIN_FRESHNESS"

          # Both jobs always run on a merge group, so anything but success
          # (skipped included) fails the gate.
          if [ "$PR_VALIDATION_REUSE" != "success" ] || [ "$MAIN_FRESHNESS" != "success" ]; then
            echo "Queue validation failed."
            exit 1
          fi
          echo "Queue validation passed."
