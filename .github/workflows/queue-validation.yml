name: "Queue Validation"

# Validate the actual combined source. Reuse requires identical tested inputs;
# otherwise call the existing affected-contract workflow on this merge group.
on:
  merge_group:
    branches: [main, integration/pr-train, dev, uat, uat-isolated]

permissions:
  contents: read
  pull-requests: read
  actions: read
  security-events: read

concurrency:
  group: queue-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admission:
    name: "Merge authority and tested inputs"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      reuse: ${{ steps.plan.outputs.reuse }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.merge_group.head_sha }}
          fetch-depth: 0
      # Authority code comes from the protected destination, not the candidate
      # asking to change it. Candidate checks still inspect the combined tree.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.merge_group.base_sha }}
          path: .queue-authority
          persist-credentials: false
      - name: Inspect every queued PR and its current validation
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .queue-authority/scripts/ci/queue_combined_result.py plan --receipt "$RUNNER_TEMP/queue-inputs.json"
      - uses: actions/upload-artifact@v7
        with:
          name: queue-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/queue-inputs.json
          if-no-files-found: error
          retention-days: 7

  combined-checks:
    name: "Combined source"
    needs: admission
    if: needs.admission.outputs.reuse == 'false'
    uses: ./.github/workflows/ci.yml

  ci-status:
    name: "CI Status Gate"
    needs: [admission, combined-checks]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require an unambiguous validation result
        env:
          ADMISSION: ${{ needs.admission.result }}
          REUSE: ${{ needs.admission.outputs.reuse }}
          COMBINED: ${{ needs.combined-checks.result }}
        run: |
          test "$ADMISSION" = success
          case "$REUSE:$COMBINED" in
            true:skipped|false:success) ;;
            *) echo "Combined-result validation did not succeed." >&2; exit 1 ;;
          esac
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.merge_group.head_sha }}
          fetch-depth: 0
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.merge_group.base_sha }}
          path: .queue-authority
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: queue-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/queue-admission
      - name: Recheck membership, review and validation attempts
        env:
          GH_TOKEN: ${{ github.token }}
          COMBINED_RESULT: ${{ needs.combined-checks.result }}
        run: python3 .queue-authority/scripts/ci/queue_combined_result.py finish --receipt "$RUNNER_TEMP/queue-admission/queue-inputs.json"
