name: Ship iOS to TestFlight

# New builds use UAT. upload_run_id resumes the exact existing binary, preserving
# its original backend. This workflow never
# creates an App Store version or submits the app for public App Store review.
# The one valid build is assigned to the configured internal and external
# TestFlight groups. External availability remains pending until Apple grants
# TestFlight Beta App Review when that review is required.

on:
  workflow_dispatch:
    inputs:
      upload_run_id:
        description: Resume distribution of this existing upload instead of building again; leave blank for a new build.
        required: false
        type: string
      sha:
        description: Exact application SHA. Required when selecting a protected UAT branch.
        required: false
        type: string
      source_branch:
        description: Select a Main build or the exact accepted source of a protected UAT branch.
        type: choice
        default: main
        options:
          - main
          - uat
          - uat-isolated
      marketing_version:
        description: Optional packaging version (x.y.z); does not change the release source or public App Store version.
        required: false
        type: string
      dry_run:
        description: Archive, sign, and run all gates without uploading to TestFlight.
        required: false
        default: false
        type: boolean
      require_hardware:
        description: Run the optional attached-iPhone capture p95 gate (recommended for voice/device changes).
        required: false
        default: false
        type: boolean
      run_core_tests:
        description: Run the focused simulator App Intent/action smoke gate (full AppTests remain in change-aware CI).
        required: false
        default: false
        type: boolean
      verify_tester_access:
        description: Verify the configured tester's access after normal distribution.
        default: false
        type: boolean
      notes:
        description: Optional release note context for the workflow summary.
        required: false
        type: string

permissions:
  pull-requests: read
  contents: read
  actions: read
  checks: read
  id-token: write

concurrency:
  group: ship-ios-testflight
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: hushh-pda-uat
  GCP_REGION: us-central1
  BACKEND_SERVICE: consent-protocol
  IOS_BUNDLE_ID: com.hushh.app
  XCODE_PROJECT: hushh-webapp/ios/App/App.xcodeproj
  XCODE_SCHEME: App
  PBXPROJ: hushh-webapp/ios/App/App.xcodeproj/project.pbxproj
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  deployment-security:
    name: Deployment security
    uses: ./.github/workflows/deployment-security.yml
    secrets:
      GH_SECURITY_ALERTS_TOKEN: ${{ secrets.GH_SECURITY_ALERTS_TOKEN }}
      CI_TEAM_APP_PRIVATE_KEY: ${{ secrets.CI_TEAM_APP_PRIVATE_KEY }}
    with:
      application_ref: ${{ inputs.upload_run_id != '' && github.sha || inputs.sha || github.sha }}
      environment_name: native
      scope: ${{ 'native' }}

  preflight:
    permissions:
      pull-requests: read
      contents: read
      actions: write
      checks: read
      id-token: write
    if: inputs.upload_run_id == ''
    needs: deployment-security
    name: Resolve green UAT release source
    runs-on: ubuntu-latest
    environment:
      name: uat
      deployment: false
    timeout-minutes: 15
    outputs:
      release_sha: ${{ steps.resolve.outputs.sha }}
      marketing_version: ${{ steps.packaging.outputs.marketing_version }}
      isolated_revision: ${{ steps.backend.outputs.isolated_revision }}
      isolated_image: ${{ steps.backend.outputs.isolated_image }}
      isolated_run: ${{ steps.backend.outputs.isolated_run }}
      isolated_attempt: ${{ steps.backend.outputs.isolated_attempt }}
      isolated_base: ${{ steps.backend.outputs.isolated_base }}
      isolated_authority: ${{ steps.backend.outputs.isolated_authority }}
    steps:
      - name: Require current-attempt deployment security
        shell: bash
        env:
          SECURITY_ATTEMPT: ${{ needs.deployment-security.outputs.attempt }}
        run: |
          set -euo pipefail
          if [[ "$SECURITY_ATTEMPT" != "$GITHUB_RUN_ATTEMPT" ]]; then
            echo "Deployment requires current-attempt security. Rerun the entire workflow; partial reruns cannot reuse clearance." >&2
            exit 1
          fi
      - name: Refuse non-main dispatches
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "main" || {
            echo "TestFlight releases must be dispatched from main." >&2
            exit 1
          }

      - name: Check out main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Authorize dispatching actor
        shell: bash
        env:
          RELEASE_AUTHORIZATION: ${{ needs.deployment-security.outputs.authorization }}
          RELEASE_APPLICATION_SHA: ${{ needs.deployment-security.outputs.application_sha }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/assert-governed-actor.py --surface uat --actor "$GITHUB_ACTOR"

      - name: Resolve exact green release SHA
        id: resolve
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REQUIRED_BRANCH: main
          REQUIRE_CI_SUCCESS: "1"
          REQUIRED_CHECK_NAME: Main Post-Merge Smoke Gate
          SHA: ${{ needs.deployment-security.outputs.application_sha }}
          REQUESTED_SHA: ${{ inputs.sha }}
          SOURCE_BRANCH: ${{ inputs.source_branch || 'main' }}
          REQUIRE_HARDWARE: ${{ inputs.require_hardware }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$SOURCE_BRANCH" == uat || "$SOURCE_BRANCH" == uat-isolated ]]; then
            if [[ "$REQUESTED_SHA" != "$SHA" || "$REQUIRE_HARDWARE" == true ]]; then
              echo "Exact UAT TestFlight requires a full SHA and supports the standard hardware=false release." >&2
              exit 1
            fi
            bash scripts/ci/require-deploy-sha-on-main.sh "$GITHUB_SHA"
            git fetch --no-tags origin "$SOURCE_BRANCH"
            gh api "repos/$GITHUB_REPOSITORY/branches/$SOURCE_BRANCH" \
              | jq -e --arg sha "$SHA" '.protected == true and .commit.sha == $sha' >/dev/null
            # Run the candidate release controls with signing credentials only
            # when they agree with the Main dispatch revision.
            git diff --exit-code --quiet "$GITHUB_SHA" "$SHA" -- \
              consent-protocol/.github/actions/setup-python-uv \
              .npmrc hushh-webapp/.npmrc hushh-webapp/package.json hushh-webapp/package-lock.json \
              hushh-webapp/vitest.config.ts hushh-webapp/__tests__/setup.ts \
              hushh-webapp/scripts scripts/native \
              ':(glob)hushh-webapp/next.config.*' ':(glob)hushh-webapp/capacitor.config.*' \
              hushh-webapp/ios/App/App.xcodeproj/project.pbxproj \
              hushh-webapp/ios/App/CapApp-SPM/Package.swift hushh-webapp/ios/ExportOptions \
              ':(glob)hushh-webapp/ios/**/Package.resolved' \
              ':(glob)hushh-webapp/ios/**/*.sh' \
              ':(glob)scripts/ci/*ios*' ':(glob)scripts/ci/*testflight*' \
              ':(glob)scripts/ci/*appstore*' \
              ':(exclude)hushh-webapp/scripts/testing/affected-tests.mjs' \
              ':(exclude)hushh-webapp/scripts/testing/affected-tests.test.mjs' || {
                echo "UAT native release tooling differs from the Main dispatch revision." >&2
                exit 1
              }
          else
            test "$SOURCE_BRANCH" = main
            bash scripts/ci/require-deploy-sha-on-main.sh "$SHA"
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      # The UAT backend provenance check lives here, on ubuntu, rather than in
      # the macOS ship job: it needs only gcloud, and it is the step that fails
      # most often, so it must fail before any macOS runner or Xcode setup is
      # paid for. The check itself is unchanged; its resolver is read from the
      # exact release SHA, the same file the ship job's checkout used to run.
      - name: Set up Python for the provenance resolver
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate workload identity configuration
        shell: bash
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test -n "$WIF_PROVIDER" || { echo "Missing UAT workload identity provider." >&2; exit 1; }
          test -n "$DEPLOY_SERVICE_ACCOUNT" || { echo "Missing UAT deployment service account." >&2; exit 1; }

      - name: Authenticate to Google Cloud with workload identity
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          project_id: ${{ env.GCP_PROJECT_ID }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify matching UAT backend revision
        id: backend
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.resolve.outputs.sha }}
          SOURCE_BRANCH: ${{ inputs.source_branch || 'main' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          resolver="$RUNNER_TEMP/resolve-cloud-run-serving-state.py"
          if [[ "$SOURCE_BRANCH" == uat || "$SOURCE_BRANCH" == uat-isolated ]]; then
            cp scripts/ci/resolve-cloud-run-serving-state.py "$resolver"
          else
            git show "$EXPECTED_SHA:scripts/ci/resolve-cloud-run-serving-state.py" > "$resolver"
          fi
          service_json="$RUNNER_TEMP/one-voice-uat-backend-service.json"
          gcloud run services describe "$BACKEND_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --format=json > "$service_json"
          revision="$(python3 "$resolver" \
            --service-json "$service_json" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["revision"])')"
          revision_json="$RUNNER_TEMP/testflight-backend-revision.json"
          gcloud run revisions describe "$revision" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --format='json(metadata.labels,status.imageDigest)' > "$revision_json"
          actual_sha="$(jq -er '.metadata.labels["deploy-sha"]' "$revision_json")"
          if [[ "$SOURCE_BRANCH" == uat || "$SOURCE_BRANCH" == uat-isolated ]]; then
            test "$actual_sha" = "$EXPECTED_SHA"
            run_id="$(jq -er '.metadata.labels["github-run-id"]' "$revision_json")"
            image="$(jq -er '.status.imageDigest' "$revision_json")"
            image="${image##*@}"
            python3 scripts/ci/verify-predecessor-acceptance.py testflight-uat \
              --environment uat --source-branch "$SOURCE_BRANCH" --sha "$EXPECTED_SHA" --deployment-run-id "$run_id" \
              --serving-revision "$revision" --serving-image "$image" \
              --output "$RUNNER_TEMP/testflight-uat-acceptance.json"
            echo "isolated_revision=$revision" >> "$GITHUB_OUTPUT"
            echo "isolated_image=$image" >> "$GITHUB_OUTPUT"
            echo "isolated_run=$run_id" >> "$GITHUB_OUTPUT"
            attempt="$(jq -er '.run_attempt' "$RUNNER_TEMP/testflight-uat-acceptance.json")"
            echo "isolated_attempt=$attempt" >> "$GITHUB_OUTPUT"
            base="$(jq -er '.base_sha' "$RUNNER_TEMP/testflight-uat-acceptance.json")"
            [[ "$base" =~ ^[0-9a-f]{40}$ ]]
            echo "isolated_base=$base" >> "$GITHUB_OUTPUT"
            authority="$(jq -er '.authority_sha' "$RUNNER_TEMP/testflight-uat-acceptance.json")"
            [[ "$authority" =~ ^[0-9a-f]{40}$ ]]
            echo "isolated_authority=$authority" >> "$GITHUB_OUTPUT"
          elif test "$actual_sha" = "$EXPECTED_SHA"; then
            echo "UAT backend revision matches the TestFlight source SHA ($actual_sha)."
          else
            git fetch --no-tags origin uat
            if ! git merge-base --is-ancestor "$actual_sha" origin/uat; then
              echo "UAT backend revision $actual_sha is not in protected UAT history." >&2
              exit 1
            fi
            REQUIRED_BRANCH=uat REQUIRE_CI_SUCCESS=1 \
              REQUIRED_CHECK_NAME="CI Status Gate,Queue Validation,Branch Validation Gate" \
              bash scripts/ci/require-deploy-sha-on-main.sh "$actual_sha"
            actual_tree="$(git rev-parse "${actual_sha}^{tree}")"
            expected_tree="$(git rev-parse "${EXPECTED_SHA}^{tree}")"
            test "$actual_tree" = "$expected_tree" || {
              echo "UAT backend provenance does not match the TestFlight source tree ($actual_tree != $expected_tree)." >&2
              exit 1
            }
            echo "UAT backend revision verified by exact tree equivalence ($actual_sha tree $actual_tree == $EXPECTED_SHA tree $expected_tree)."
          fi

      - name: Materialize automatic packaging credentials
        if: inputs.marketing_version == ''
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyjwt cryptography
          bash scripts/ci/materialize-ios-asc-key.sh
      - name: Resolve automatic packaging before allocating macOS
        id: packaging
        if: inputs.marketing_version == ''
        env:
          RELEASE_SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          # Credentials are passed through a protected runner-local file; only
          # the public marketing version is a job output.
          git show "$RELEASE_SHA:$PBXPROJ" > "$RUNNER_TEMP/release.pbxproj"
          version="$(python3 scripts/ci/submit-appstore-version.py --resolve-marketing-version --testflight \
            --p8-path "$RUNNER_TEMP/asc.p8" --key-id "$ASC_KEY_ID" --issuer-id "$ASC_ISSUER_ID" \
            --bundle-id "$IOS_BUNDLE_ID" --pbxproj "$RUNNER_TEMP/release.pbxproj")"
          echo "marketing_version=$version" >> "$GITHUB_OUTPUT"
      - name: Remove preflight signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/asc.p8"

  hardware-capture:
    permissions:
      contents: read
      checks: read
      actions: write
      id-token: write
    name: Prove physical iPhone capture gate
    needs: [preflight, deployment-security]
    if: ${{ needs.preflight.result == 'success' && inputs.require_hardware == true }}
    uses: ./.github/workflows/ios-voice-device.yml
    with:
      release_sha: ${{ needs.preflight.outputs.release_sha }}
      security_attempt: ${{ needs.deployment-security.outputs.attempt }}
      security_authorization: ${{ needs.deployment-security.outputs.authorization }}
      security_application_sha: ${{ needs.deployment-security.outputs.application_sha }}
    secrets: inherit

  ship:
    permissions:
      pull-requests: read
      contents: read
      actions: write
      checks: read
      id-token: write
    name: Build and distribute normal UAT TestFlight build
    needs:
      - deployment-security
      - preflight
      - hardware-capture
    if: ${{ always() && needs.preflight.result == 'success' && (needs.hardware-capture.result == 'success' || needs.hardware-capture.result == 'skipped') }}
    runs-on: macos-15
    concurrency:
      group: ios-build-and-upload
      cancel-in-progress: false
      queue: max
    environment:
      name: uat
      deployment: false
    timeout-minutes: 90
    env:
      CAPABILITY_GRAPH_BASE_REF: ${{ needs.preflight.outputs.isolated_base }}
    outputs:
      build_number: ${{ steps.build_number.outputs.next_build }}
      marketing_version: ${{ steps.identity.outputs.marketing_version }}
    steps:
      - name: Require current-attempt deployment security
        shell: bash
        env:
          SECURITY_ATTEMPT: ${{ needs.deployment-security.outputs.attempt }}
        run: |
          set -euo pipefail
          if [[ "$SECURITY_ATTEMPT" != "$GITHUB_RUN_ATTEMPT" ]]; then
            echo "Deployment requires current-attempt security. Rerun the entire workflow; partial reruns cannot reuse clearance." >&2
            exit 1
          fi
      - name: Check out current release authority
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Authorize build actor including individual job reruns
        env:
          RELEASE_AUTHORIZATION: ${{ needs.deployment-security.outputs.authorization }}
          RELEASE_APPLICATION_SHA: ${{ needs.deployment-security.outputs.application_sha }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/assert-governed-actor.py --surface uat --actor "$GITHUB_ACTOR"
      - name: Preserve trusted serving revision verifier
        if: inputs.source_branch == 'uat' || inputs.source_branch == 'uat-isolated'
        run: |
          cp scripts/ci/resolve-cloud-run-serving-state.py "$RUNNER_TEMP/testflight-serving-state.py"
          cp consent-protocol/scripts/generate_capability_graph.py "$RUNNER_TEMP/testflight-capability-graph.py"
      - name: Check out exact release SHA
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.release_sha }}
          persist-credentials: false

      - name: Assert source SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.preflight.outputs.release_sha }}"

      - name: Resolve TestFlight marketing version
        shell: bash
        env:
          REQUESTED_MARKETING_VERSION: ${{ inputs.marketing_version || needs.preflight.outputs.marketing_version }}
        run: |
          set -euo pipefail
          version="$(python3 - <<'PY'
          import os, pathlib, re, sys
          requested = os.environ.get('REQUESTED_MARKETING_VERSION', '').strip()
          source = pathlib.Path(os.environ['PBXPROJ']).read_text()
          match = re.search(r'MARKETING_VERSION\s*=\s*([^;]+)', source)
          version = requested or (match.group(1).strip() if match else '')
          if not re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', version):
              sys.exit('Marketing version must have three numeric components.')
          print(version)
          PY
          )"
          echo "IOS_MARKETING_VERSION=$version" >> "$GITHUB_ENV"
          echo "TestFlight packaging version: $version"

      - name: Assert optional physical evidence agrees with source
        if: ${{ inputs.require_hardware == true }}
        shell: bash
        run: |
          set -euo pipefail
          test "${{ needs.hardware-capture.outputs.release_sha }}" = "${{ needs.preflight.outputs.release_sha }}"

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: hushh-webapp/package-lock.json

      - name: Set up locked consent-protocol runtime
        uses: ./consent-protocol/.github/actions/setup-python-uv
        with:
          python-version: "3.13"
          protocol-dir: ./consent-protocol
          sync-dev-group: "true"

      - name: Install web dependencies
        shell: bash
        run: npm ci --prefix hushh-webapp

      - name: Validate workload identity configuration
        shell: bash
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test -n "$WIF_PROVIDER" || { echo "Missing UAT workload identity provider." >&2; exit 1; }
          test -n "$DEPLOY_SERVICE_ACCOUNT" || { echo "Missing UAT deployment service account." >&2; exit 1; }

      - name: Authenticate to Google Cloud with workload identity
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          project_id: ${{ env.GCP_PROJECT_ID }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Materialize UAT app configuration
        shell: bash
        run: bash scripts/ci/materialize-ios-uat-build-contract.sh

      - name: Materialize protected TestFlight configuration
        shell: bash
        run: bash scripts/ci/materialize-ios-testflight-release-config.sh

      - name: Create signing keychain
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN="${RUNNER_TEMP}/app-signing.keychain-db"
          KC_PW="$(openssl rand -base64 24)"
          security create-keychain -p "$KC_PW" "$KEYCHAIN"
          security set-keychain-settings -lt 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PW" "$KEYCHAIN"
          # Keep the keychain runner-local; Apple-managed signing can use the
          # existing distribution certificate without creating another one.
          security list-keychains -d user -s "$KEYCHAIN" "login.keychain-db"
          security default-keychain -s "$KEYCHAIN"

          DIST_CERT_B64="$(gcloud secrets versions access latest \
            --secret=APPSTORE_DISTRIBUTION_CERT_P12_B64 \
            --project="${GCP_PROJECT_ID}" 2>/dev/null || true)"
          if [ -z "$DIST_CERT_B64" ]; then
            echo "Missing APPSTORE_DISTRIBUTION_CERT_P12_B64 in ${GCP_PROJECT_ID}." >&2
            exit 1
          fi
          umask 077
          echo "$DIST_CERT_B64" | openssl base64 -d -A > "${RUNNER_TEMP}/dist_cert.p12"
          security import "${RUNNER_TEMP}/dist_cert.p12" -k "$KEYCHAIN" -P "" -A
          rm -f "${RUNNER_TEMP}/dist_cert.p12"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KEYCHAIN" \
            >/dev/null 2>&1 || true
          echo "Distribution certificate imported into signing keychain."

      - name: Run local One Voice safety and native contract gates
        shell: bash
        env:
          ISOLATED_AUTHORITY: ${{ needs.preflight.outputs.isolated_authority }}
          RELEASE_SHA: ${{ needs.preflight.outputs.release_sha }}
          SOURCE_BRANCH: ${{ inputs.source_branch || 'main' }}
        run: |
          set -euo pipefail
          if [[ -n "$ISOLATED_AUTHORITY" ]]; then
            # Preserve the accepted isolated verifier. Normal UAT uses the
            # reviewed Main verifier that understands its serving history.
            # Restore the exact candidate before packaging in either case.
            graph=consent-protocol/scripts/generate_capability_graph.py
            trap 'git restore --worktree -- "$graph"' EXIT
            if [[ "$SOURCE_BRANCH" == uat ]]; then
              cp "$RUNNER_TEMP/testflight-capability-graph.py" "$graph"
            else
              git show "$ISOLATED_AUTHORITY:$graph" > "$graph"
            fi
            export UAT_CI_CANDIDATE="$RELEASE_SHA" CI_VALIDATION_LEVEL=release
          fi
          npm run --prefix hushh-webapp verify:one-voice
          npm run --prefix hushh-webapp verify:capacitor:static
          npm run --prefix hushh-webapp verify:capacitor:plugins
          node hushh-webapp/scripts/native/verify-ios-voice-privacy-preflight.mjs
          python3 scripts/ci/test_distribute_testflight_build.py
          python3 scripts/ci/test_ios_uat_passkey_config.py

      - name: Prepare UAT native project
        shell: bash
        run: npm run --prefix hushh-webapp ios:prepare:uat

      - name: Verify staged UAT product assets
        shell: bash
        run: npm run --prefix hushh-webapp verify:capacitor:product-assets

      - name: Cache Swift packages
        uses: actions/cache@v5
        with:
          path: |
            ${{ runner.temp }}/spm
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('hushh-webapp/ios/App/CapApp-SPM/Package.swift', 'hushh-webapp/ios/**/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Resolve Swift package dependencies
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -clonedSourcePackagesDirPath "${RUNNER_TEMP}/spm"

      - name: Run core iOS App Intent and action tests
        id: core_tests
        if: ${{ inputs.run_core_tests == true }}
        shell: bash
        run: |
          set -euo pipefail
          simulator_id="$(python3 -c 'import json, subprocess; payload = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "--json"], text=True)); matches = [device["udid"] for runtime, devices in payload.get("devices", {}).items() if "iOS" in runtime for device in devices if device.get("isAvailable") and device.get("name", "").startswith("iPhone")]; print(matches[0] if matches else ""); raise SystemExit(0 if matches else "No available iPhone Simulator is installed on the release runner.")')"
          xcodebuild test \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -clonedSourcePackagesDirPath "${RUNNER_TEMP}/spm" \
            -derivedDataPath "$RUNNER_TEMP/one-voice-simulator-derived-data" \
            -only-testing:AppTests/OneVoiceInvocationCoordinatorTests/testAppIntentAvailabilityContractsCompileFromTheIOS17DeploymentTarget \
            -only-testing:AppTests/OneSystemActionInvocationCoordinatorTests/testActionCatalogMatchesGeneratedLocationContractIdentifiers \
            -only-testing:AppTests/OneSystemActionInvocationCoordinatorTests/testDirectIntentFactoriesMapPeopleAndSlotsToCanonicalActions \
            -only-testing:AppTests/OneSystemActionInvocationCoordinatorTests/testDirectIntentFactoriesMapLocationAndCircleMutations \
            -only-testing:AppTests/OneSystemActionInvocationCoordinatorTests/testAllTenDestinationIntentsRemainNonMutatingAdapters \
            CODE_SIGNING_ALLOWED=NO

      - name: Resolve next TestFlight build number
        id: build_number
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/asc-venv"
          "$RUNNER_TEMP/asc-venv/bin/pip" install --quiet --disable-pip-version-check pyjwt cryptography
          next_build="$("$RUNNER_TEMP/asc-venv/bin/python" scripts/ci/resolve-ios-build-number.py \
            --p8-path "$RUNNER_TEMP/asc.p8" \
            --key-id "$ASC_KEY_ID" \
            --issuer-id "$ASC_ISSUER_ID" \
            --bundle-id "$IOS_BUNDLE_ID" \
            --marketing-version "$IOS_MARKETING_VERSION" \
            --pbxproj "$PBXPROJ")"
          echo "next_build=$next_build" >> "$GITHUB_OUTPUT"

      - name: Run TestFlight API unit gates
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/asc-venv/bin/python" scripts/ci/test_resolve_ios_build_number.py
          "$RUNNER_TEMP/asc-venv/bin/python" scripts/ci/test_wait_for_testflight_build.py

      - name: Create UAT archive
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -clonedSourcePackagesDirPath "${RUNNER_TEMP}/spm" \
            -derivedDataPath "$RUNNER_TEMP/one-voice-archive-derived-data" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            MARKETING_VERSION="$IOS_MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="${{ steps.build_number.outputs.next_build }}" \
            archive

      - name: Verify archived app and extension versions
        shell: bash
        env:
          EXPECTED_BUILD_NUMBER: ${{ steps.build_number.outputs.next_build }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, plistlib, sys
          app = pathlib.Path(os.environ['RUNNER_TEMP'], 'App.xcarchive/Products/Applications/App.app')
          plists = [app / 'Info.plist', *app.glob('PlugIns/*.appex/Info.plist')]
          for path in plists:
              with path.open('rb') as handle:
                  info = plistlib.load(handle)
              if (info.get('CFBundleShortVersionString') != os.environ['IOS_MARKETING_VERSION'] or
                  str(info.get('CFBundleVersion')) != os.environ['EXPECTED_BUILD_NUMBER']):
                  sys.exit(f'Archive version mismatch: {path.relative_to(app)}')
          print(f'Verified app and {len(plists) - 1} extension version(s).')
          PY

      - name: Verify archive assets, privacy, and own symbols
        shell: bash
        env:
          IOS_APP_BUNDLE_PATH: ${{ runner.temp }}/App.xcarchive/Products/Applications/App.app
        run: |
          set -euo pipefail
          npm run --prefix hushh-webapp verify:capacitor:product-assets
          node hushh-webapp/scripts/native/verify-ios-voice-privacy-preflight.mjs
          npm run --prefix hushh-webapp ios:verify-archive-symbols \
            -- "$RUNNER_TEMP/App.xcarchive"

      - name: Export and upload TestFlight build
        id: upload
        shell: bash
        env:
          ISOLATED_REVISION: ${{ needs.preflight.outputs.isolated_revision }}
          ISOLATED_IMAGE: ${{ needs.preflight.outputs.isolated_image }}
          ISOLATED_RUN: ${{ needs.preflight.outputs.isolated_run }}
          ISOLATED_ATTEMPT: ${{ needs.preflight.outputs.isolated_attempt }}
          SOURCE_BRANCH: ${{ inputs.source_branch || 'main' }}
          RELEASE_SHA: ${{ needs.preflight.outputs.release_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$SOURCE_BRANCH" == uat || "$SOURCE_BRANCH" == uat-isolated ]]; then
            test -n "$ISOLATED_REVISION"
            service_json="$RUNNER_TEMP/testflight-live-service.json"
            gcloud run services describe "$BACKEND_SERVICE" --project="$GCP_PROJECT_ID" \
              --region="$GCP_REGION" --format='json(status)' > "$service_json"
            python3 "$RUNNER_TEMP/testflight-serving-state.py" \
              --service-json "$service_json" --expected-revision "$ISOLATED_REVISION"
            gcloud run revisions describe "$ISOLATED_REVISION" --project="$GCP_PROJECT_ID" \
              --region="$GCP_REGION" --format='json(metadata.labels,status.imageDigest)' \
              | jq -e --arg sha "$RELEASE_SHA" --arg run "$ISOLATED_RUN" --arg image "$ISOLATED_IMAGE" \
                  '.metadata.labels["deploy-sha"] == $sha and
                   .metadata.labels["github-run-id"] == $run and
                   (.status.imageDigest | split("@") | last) == $image' >/dev/null
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ISOLATED_RUN" \
              | jq -e --argjson attempt "$ISOLATED_ATTEMPT" \
                  '.run_attempt == $attempt and .status == "completed" and .conclusion == "success"' >/dev/null
          fi
          python3 scripts/ci/export-ios-distribution.py \
            --archive "$RUNNER_TEMP/App.xcarchive" \
            --export-path "$RUNNER_TEMP/export" \
            --options hushh-webapp/ios/ExportOptions/AppStoreConnect.plist \
            --p8-path "$RUNNER_TEMP/asc.p8" \
            --key-id "$ASC_KEY_ID" \
            --issuer-id "$ASC_ISSUER_ID" \
            --dry-run "${{ inputs.dry_run }}"

      - name: Preserve dry-run UAT IPA in private bucket
        id: private_artifact
        if: ${{ inputs.dry_run == true }}
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.preflight.outputs.release_sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          ipa_files=("$RUNNER_TEMP"/export/*.ipa)
          test "${#ipa_files[@]}" -eq 1 || {
            echo "Expected exactly one signed UAT IPA." >&2
            exit 1
          }
          python3 scripts/ci/upload-private-native-artifact.py \
            --file "${ipa_files[0]}" \
            --source-sha "$RELEASE_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --platform ios-testflight \
            --receipt "$RUNNER_TEMP/private-native-artifact-receipt.json"

      - name: Upload redacted private IPA receipt
        if: ${{ inputs.dry_run == true && steps.private_artifact.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: hushh-one-ios-uat-private-receipt-${{ needs.preflight.outputs.release_sha }}
          path: ${{ runner.temp }}/private-native-artifact-receipt.json
          retention-days: 14
          if-no-files-found: error

      - name: Preserve uploaded build identity for recovery
        if: inputs.dry_run != true
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.preflight.outputs.release_sha }}
          BUILD_NUMBER: ${{ steps.build_number.outputs.next_build }}
          SOURCE_BRANCH: ${{ inputs.source_branch || 'main' }}
          ISOLATED_REVISION: ${{ needs.preflight.outputs.isolated_revision }}
          ISOLATED_RUN: ${{ needs.preflight.outputs.isolated_run }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, plistlib
          archive_info = pathlib.Path(os.environ['RUNNER_TEMP'], 'App.xcarchive/Products/Applications/App.app/Info.plist')
          with archive_info.open('rb') as handle:
              version = plistlib.load(handle)['CFBundleShortVersionString']
          receipt = dict(source_sha=os.environ['RELEASE_SHA'], build_number=os.environ['BUILD_NUMBER'], marketing_version=version, bundle_id=os.environ['IOS_BUNDLE_ID'])
          source_branch = os.environ.get('SOURCE_BRANCH', 'main')
          if source_branch in {'uat', 'uat-isolated'}:
              receipt.update(
                  source_branch=source_branch,
                  upload_attempt=int(os.environ['GITHUB_RUN_ATTEMPT']),
                  uat_backend_revision=os.environ['ISOLATED_REVISION'],
                  uat_deployment_run_id=int(os.environ['ISOLATED_RUN']),
              )
          pathlib.Path(os.environ['RUNNER_TEMP'], 'testflight-upload-receipt.json').write_text(json.dumps(receipt))
          PY

      - name: Upload recovery receipt before Apple processing
        if: inputs.dry_run != true
        uses: actions/upload-artifact@v6
        with:
          name: testflight-upload-receipt
          path: ${{ runner.temp }}/testflight-upload-receipt.json
          retention-days: 90
          if-no-files-found: error

      - name: Preserve redacted distribution outputs
        id: identity
        run: echo "marketing_version=$IOS_MARKETING_VERSION" >> "$GITHUB_OUTPUT"

      - name: Remove protected runner files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/asc.p8" \
            "$RUNNER_TEMP/asc-beta-review-contact.json" \
            "$RUNNER_TEMP/asc-beta-review-notes.txt" \
            "GoogleService-Info.plist" \
            "hushh-webapp/.env.native.ios.local"

      - name: Publish TestFlight-only summary
        if: always()
        shell: bash
        env:
          PRIVATE_ARTIFACT_OUTCOME: ${{ steps.private_artifact.outcome }}
        run: |
          {
            echo "## Normal UAT TestFlight release"
            echo
            echo "| Release source | ${{ needs.preflight.outputs.release_sha }} |"
            echo "| Physical iPhone p95 (ms) | ${{ inputs.require_hardware == true && needs.hardware-capture.outputs.p95_time_to_capture_ms || 'not requested' }} |"
            echo "| Focused App Intent/action gate | ${{ steps.core_tests.outcome }} |"
            echo "| Build number | ${{ steps.build_number.outputs.next_build }} |"
            echo "| Marketing version | ${IOS_MARKETING_VERSION:-unresolved} |"
            echo "| IPA export / TestFlight upload | ${{ steps.upload.outcome }} |"
            echo "| Private dry-run UAT IPA | ${PRIVATE_ARTIFACT_OUTCOME:-not requested} (14-day bucket retention; receipt only in Actions) |"
            echo "| Apple processing | separate Ubuntu distribution job |"
            echo "| TestFlight distribution | separate Ubuntu distribution job |"
            echo
            echo "The workflow uses TestFlight beta endpoints only. External tester availability is pending until Apple approves TestFlight Beta App Review when required; this workflow never submits an App Store version."
          } >> "$GITHUB_STEP_SUMMARY"

  distribute:
    permissions:
      pull-requests: read
      contents: read
      actions: write
      checks: read
      id-token: write
    name: Process and distribute uploaded TestFlight build
    needs: [preflight, ship, deployment-security]
    # Override implicit success(): the optional hardware ancestor may be skipped.
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.ship.result == 'success' && inputs.dry_run != true }}
    runs-on: ubuntu-latest
    environment:
      name: uat
      deployment: false
    timeout-minutes: 35
    env:
      IOS_MARKETING_VERSION: ${{ needs.ship.outputs.marketing_version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require current-attempt deployment security
        shell: bash
        env:
          SECURITY_ATTEMPT: ${{ needs.deployment-security.outputs.attempt }}
        run: |
          set -euo pipefail
          if [[ "$SECURITY_ATTEMPT" != "$GITHUB_RUN_ATTEMPT" ]]; then
            echo "Deployment requires current-attempt security. Rerun the entire workflow; partial reruns cannot reuse clearance." >&2
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Authorize distribution actor including individual job reruns
        env:
          RELEASE_AUTHORIZATION: ${{ needs.deployment-security.outputs.authorization }}
          RELEASE_APPLICATION_SHA: ${{ needs.deployment-security.outputs.application_sha }}
        run: python3 scripts/ci/assert-governed-actor.py --surface uat --actor "$GITHUB_ACTOR"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python3 -m pip install pyjwt cryptography
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          project_id: hushh-pda-uat
      - uses: google-github-actions/setup-gcloud@v3
      - name: Materialize protected distribution configuration
        run: bash scripts/ci/materialize-ios-testflight-release-config.sh

      - name: Wait for valid TestFlight processing
        id: processing
        if: inputs.dry_run != true
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/wait_for_testflight_build.py \
            --p8-path "$RUNNER_TEMP/asc.p8" \
            --key-id "$ASC_KEY_ID" \
            --issuer-id "$ASC_ISSUER_ID" \
            --bundle-id "$IOS_BUNDLE_ID" \
            --marketing-version "$IOS_MARKETING_VERSION" \
            --build-number "${{ needs.ship.outputs.build_number }}" \
            --timeout-seconds 1200 \
            --poll-interval-seconds 15 \
            --output-json "$RUNNER_TEMP/testflight-build.json"

      - name: Attach the same valid build to both TestFlight groups
        id: distribution
        if: inputs.dry_run != true
        shell: bash
        env:
          TESTFLIGHT_TESTER_EMAIL: ${{ inputs.verify_tester_access && secrets.TESTFLIGHT_TESTER_EMAIL || '' }}
        run: |
          set -euo pipefail
          python3 scripts/ci/distribute-testflight-build.py \
            --p8-path "$RUNNER_TEMP/asc.p8" \
            --key-id "$ASC_KEY_ID" \
            --issuer-id "$ASC_ISSUER_ID" \
            --bundle-id "$IOS_BUNDLE_ID" \
            --marketing-version "$IOS_MARKETING_VERSION" \
            --build-number "${{ needs.ship.outputs.build_number }}" \
            --build-id-file "$RUNNER_TEMP/testflight-build.json" \
            --internal-group-id "$ASC_INTERNAL_GROUP_ID" \
            --external-group-id "$ASC_EXTERNAL_GROUP_ID" \
            --beta-review-contact-file "$ASC_BETA_REVIEW_CONTACT_PATH" \
            --beta-review-notes-file "$ASC_BETA_REVIEW_NOTES_PATH" \
            --output-json "$RUNNER_TEMP/testflight-distribution.json"

      - name: Upload redacted release evidence
        if: ${{ always() && inputs.dry_run != true }}
        uses: actions/upload-artifact@v6
        with:
          name: one-voice-testflight-evidence-${{ needs.preflight.outputs.release_sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/testflight-distribution.json

      - name: Distribution summary
        if: always()
        run: |
          echo "Source: ${{ needs.preflight.outputs.release_sha }}; build: ${{ needs.ship.outputs.build_number }}." >> "$GITHUB_STEP_SUMMARY"
          echo "Apple processing: ${{ steps.processing.outcome }}; distribution: ${{ steps.distribution.outcome }}. External Beta App Review may remain pending." >> "$GITHUB_STEP_SUMMARY"
      - name: Remove protected distribution files
        if: always()
        run: rm -f "$RUNNER_TEMP/asc.p8" "$RUNNER_TEMP/asc-beta-review-contact.json" "$RUNNER_TEMP/asc-beta-review-notes.txt"

  resume:
    permissions:
      pull-requests: read
      contents: read
      actions: write
      checks: read
      id-token: write
    if: inputs.upload_run_id != ''
    needs: deployment-security
    runs-on: ubuntu-latest
    environment:
      name: uat
      deployment: false
    timeout-minutes: 35
    env:
      GCP_PROJECT_ID: hushh-pda-uat
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      UPLOAD_RUN_ID: ${{ inputs.upload_run_id }}
    steps:
      - name: Require current-attempt deployment security
        shell: bash
        env:
          SECURITY_ATTEMPT: ${{ needs.deployment-security.outputs.attempt }}
        run: |
          set -euo pipefail
          if [[ "$SECURITY_ATTEMPT" != "$GITHUB_RUN_ATTEMPT" ]]; then
            echo "Deployment requires current-attempt security. Rerun the entire workflow; partial reruns cannot reuse clearance." >&2
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Validate dispatch and original upload provenance
        shell: bash
        env:
          RELEASE_AUTHORIZATION: ${{ needs.deployment-security.outputs.authorization }}
          RELEASE_APPLICATION_SHA: ${{ needs.deployment-security.outputs.application_sha }}
          REQUESTED_SHA: ${{ inputs.sha }}
          SOURCE_BRANCH: ${{ inputs.source_branch || 'main' }}
          REQUESTED_VERSION: ${{ inputs.marketing_version }}
          DRY_RUN: ${{ inputs.dry_run }}
          REQUIRE_HARDWARE: ${{ inputs.require_hardware }}
          RUN_CORE_TESTS: ${{ inputs.run_core_tests }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = main
          [[ "$UPLOAD_RUN_ID" =~ ^[0-9]+$ ]]
          if [[ "$SOURCE_BRANCH" != main || -n "$REQUESTED_SHA" || -n "$REQUESTED_VERSION" || "$DRY_RUN" == true || "$REQUIRE_HARDWARE" == true || "$RUN_CORE_TESTS" == true ]]; then
            echo "Existing-upload recovery cannot change source/version or accept build-only options. Supply upload_run_id only." >&2
            exit 1
          fi
          python3 scripts/ci/assert-governed-actor.py --surface uat --actor "$GITHUB_ACTOR"
          gh api "repos/$GH_REPO/actions/runs/$UPLOAD_RUN_ID" > "$RUNNER_TEMP/upload-run.json"
          # A Release iOS to App Store run uploads the same kind of build (for
          # example a production-backed one) and writes the same receipt.
          jq -e '(.path == ".github/workflows/ship-ios-testflight.yml" or .path == ".github/workflows/release-ios-appstore.yml") and .head_branch == "main" and .event == "workflow_dispatch"' "$RUNNER_TEMP/upload-run.json" >/dev/null
          gh run download "$UPLOAD_RUN_ID" --name testflight-upload-receipt --dir "$RUNNER_TEMP/receipt"
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess
          receipt = json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'receipt/testflight-upload-receipt.json').read_text())
          assert receipt['bundle_id'] == 'com.hushh.app'
          assert re.fullmatch(r'[0-9a-f]{40}', receipt['source_sha'])
          assert re.fullmatch(r'[0-9]+', receipt['build_number'])
          assert re.fullmatch(r'[0-9]+(?:\.[0-9]+){1,2}', receipt['marketing_version'])
          source = receipt.get('source_branch', 'main')
          if source in {'uat', 'uat-isolated'}:
              original_run = json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'upload-run.json').read_text())
              assert original_run['path'] == '.github/workflows/ship-ios-testflight.yml'
              assert original_run['head_repository']['full_name'] == os.environ['GH_REPO']
              attempt = receipt['upload_attempt']
              assert type(attempt) is int and 0 < attempt <= original_run['run_attempt']
              assert re.fullmatch(r'consent-protocol-[a-z0-9-]+', receipt['uat_backend_revision'])
              assert type(receipt['uat_deployment_run_id']) is int and receipt['uat_deployment_run_id'] > 0
              jobs = json.loads(subprocess.check_output([
                  'gh', 'api', f"repos/{os.environ['GH_REPO']}/actions/runs/{original_run['id']}/attempts/{attempt}/jobs?per_page=100"
              ]))
              assert jobs['total_count'] == len(jobs['jobs'])
              for name, required_step in (
                  ('Resolve green UAT release source', 'Verify matching UAT backend revision'),
                  ('Build and distribute normal UAT TestFlight build', 'Export and upload TestFlight build'),
              ):
                  assert sum(
                      step['name'] == required_step and step['conclusion'] == 'success'
                      for job in jobs['jobs'] if job['name'] == name
                      for step in job['steps']
                  ) == 1
              subprocess.run(['git', 'fetch', '--no-tags', 'origin', source], check=True)
          else:
              assert source == 'main'
          subprocess.run(['git', 'merge-base', '--is-ancestor', receipt['source_sha'], f'origin/{source}'], check=True)
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              for field in ('source_sha', 'build_number', 'marketing_version'):
                  out.write(f'{field.upper()}={receipt[field]}\n')
          PY
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install pyjwt cryptography
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          project_id: hushh-pda-uat
      - uses: google-github-actions/setup-gcloud@v3
      - name: Materialize protected TestFlight configuration
        run: bash scripts/ci/materialize-ios-testflight-release-config.sh
      - name: Reconcile the existing uploaded build
        id: processing
        run: |
          python scripts/ci/wait_for_testflight_build.py \
            --p8-path "$RUNNER_TEMP/asc.p8" --key-id "$ASC_KEY_ID" --issuer-id "$ASC_ISSUER_ID" \
            --bundle-id com.hushh.app --marketing-version "$MARKETING_VERSION" --build-number "$BUILD_NUMBER" \
            --timeout-seconds 1200 --poll-interval-seconds 30 --output-json "$RUNNER_TEMP/testflight-build.json"
      - name: Resume idempotent group distribution
        id: distribution
        run: |
          python scripts/ci/distribute-testflight-build.py \
            --p8-path "$RUNNER_TEMP/asc.p8" --key-id "$ASC_KEY_ID" --issuer-id "$ASC_ISSUER_ID" \
            --bundle-id com.hushh.app --marketing-version "$MARKETING_VERSION" --build-number "$BUILD_NUMBER" \
            --build-id-file "$RUNNER_TEMP/testflight-build.json" \
            --internal-group-id "$ASC_INTERNAL_GROUP_ID" --external-group-id "$ASC_EXTERNAL_GROUP_ID" \
            --beta-review-contact-file "$ASC_BETA_REVIEW_CONTACT_PATH" --beta-review-notes-file "$ASC_BETA_REVIEW_NOTES_PATH" \
            --output-json "$RUNNER_TEMP/testflight-distribution.json"
      - name: Bind recovery evidence to the original upload
        run: |
          PYTHONPATH=scripts/ci python - <<'PY'
          import json, os, pathlib
          from release_cadence_native import bind_recovery
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          path = root / 'testflight-distribution.json'
          value = bind_recovery(json.loads((root / 'upload-run.json').read_text()),
                                json.loads((root / 'receipt/testflight-upload-receipt.json').read_text()),
                                int(os.environ['GITHUB_RUN_ID']), int(os.environ['GITHUB_RUN_ATTEMPT']),
                                json.loads(path.read_text()))
          path.write_text(json.dumps(value, sort_keys=True) + '\n')
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: testflight-resumed-distribution
          path: ${{ runner.temp }}/testflight-distribution.json
          if-no-files-found: warn
      - name: Recovery summary
        if: always()
        env:
          PROCESSING: ${{ steps.processing.outcome }}
          DISTRIBUTION: ${{ steps.distribution.outcome }}
        run: |
          echo "Existing upload run: $UPLOAD_RUN_ID; build: ${BUILD_NUMBER:-unresolved}; source: ${SOURCE_SHA:-unresolved}." >> "$GITHUB_STEP_SUMMARY"
          echo "Apple processing: $PROCESSING; distribution: $DISTRIBUTION. No archive, upload, or App Intent tests executed." >> "$GITHUB_STEP_SUMMARY"
      - name: Remove protected files
        if: always()
        run: |
          python - <<'PY'
          import os, pathlib
          for name in ('asc.p8', 'asc-beta-review-contact.json', 'asc-beta-review-notes.txt'):
              pathlib.Path(os.environ['RUNNER_TEMP'], name).unlink(missing_ok=True)
          PY
