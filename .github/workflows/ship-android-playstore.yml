name: Ship Android to Google Play Store

# One-click: cut a Hushh One Android App Bundle (.aab) from the latest green `main`,
# build the Capacitor app against the UAT or Production backend + Firebase,
# sign it with the Android Release Upload Keystore, and upload to Google Play Console
# (internal, alpha, beta, or production track) via the Google Play Developer API.
#
# iOS sibling: .github/workflows/ship-ios-testflight.yml
# Runbook & secret setup: docs/guides/mobile/ship-android-playstore.md

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Exact green main SHA to ship (blank defaults to latest origin/main)"
        required: false
        type: string
      track:
        description: "Google Play Console track (internal, alpha, beta, production)"
        required: false
        default: "internal"
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      dry_run:
        description: "Build & sign .aab but do NOT upload to Google Play Console"
        required: false
        default: false
        type: boolean
      notes:
        description: "Optional release notes / summary of changes"
        required: false
        type: string

permissions:
  contents: read
  checks: read

env:
  GCP_PROJECT_ID: hushh-pda-uat
  ANDROID_PACKAGE_NAME: com.hushh.app
  NODE_OPTIONS: --max-old-space-size=8192

concurrency:
  group: ship-android-playstore
  cancel-in-progress: false

jobs:
  ship:
    name: Build & upload Android (.aab) to Google Play
    runs-on: ubuntu-latest
    environment: uat
    timeout-minutes: 40

    steps:
      - name: Assert manual dispatch originates from main
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "Refusing Android ship from '${GITHUB_REF_NAME}'. Trigger this workflow from 'main' only."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Authorize dispatching actor (uat surface)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/assert-governed-actor.py --surface uat --actor "${GITHUB_ACTOR}"

      - name: Resolve release SHA
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          REQUESTED="${{ github.event.inputs.sha }}"
          git fetch --no-tags origin main
          if [ -z "${REQUESTED}" ]; then
            SHA="$(git rev-parse origin/main)"
          else
            SHA="${REQUESTED}"
          fi
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "Resolved release SHA: ${SHA}"

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Authenticate to GCP (Secret Manager)
        id: gcp-auth
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_UAT }}

      - name: Fetch Android Keystore & Google Play API secrets from GCP Secret Manager
        id: gcp-secrets
        continue-on-error: true
        uses: google-github-actions/get-secretmanager-secrets@v2
        with:
          secrets: |-
            KEYSTORE_B64:${{ env.GCP_PROJECT_ID }}/ANDROID_RELEASE_KEYSTORE_B64
            KEYSTORE_PASS:${{ env.GCP_PROJECT_ID }}/ANDROID_KEYSTORE_PASSWORD
            KEY_ALIAS:${{ env.GCP_PROJECT_ID }}/ANDROID_KEY_ALIAS
            KEY_PASS:${{ env.GCP_PROJECT_ID }}/ANDROID_KEY_PASSWORD
            PLAY_SERVICE_ACCOUNT_B64:${{ env.GCP_PROJECT_ID }}/GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_B64

      - name: Hydrate Android Release Keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_DIR="${RUNNER_TEMP}/keystore"
          mkdir -p "${KEYSTORE_DIR}"
          KEYSTORE_PATH="${KEYSTORE_DIR}/release-upload-key.jks"

          # Fall back to GitHub secret if GCP Secret Manager secret was not fetched
          RAW_B64="${{ steps.gcp-secrets.outputs.KEYSTORE_B64 || secrets.ANDROID_RELEASE_KEYSTORE_B64 }}"

          if [ -n "${RAW_B64}" ]; then
            echo "${RAW_B64}" | base64 -d > "${KEYSTORE_PATH}"
            echo "ANDROID_KEYSTORE_PATH=${KEYSTORE_PATH}" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=${{ steps.gcp-secrets.outputs.KEYSTORE_PASS || secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=${{ steps.gcp-secrets.outputs.KEY_ALIAS || secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=${{ steps.gcp-secrets.outputs.KEY_PASS || secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "Release keystore hydrated successfully."
          else
            echo "WARNING: No release keystore provided. Build will produce unsigned/debug AAB."
          fi

      - name: Hydrate Google Play Service Account Key
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_ACCOUNT_PATH="${RUNNER_TEMP}/google-play-service-account.json"
          RAW_B64="${{ steps.gcp-secrets.outputs.PLAY_SERVICE_ACCOUNT_B64 || secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_B64 }}"

          if [ -n "${RAW_B64}" ]; then
            echo "${RAW_B64}" | base64 -d > "${SERVICE_ACCOUNT_PATH}"
            echo "PLAY_SERVICE_ACCOUNT_PATH=${SERVICE_ACCOUNT_PATH}" >> "$GITHUB_ENV"
            echo "Google Play Developer API service account hydrated."
          else
            echo "WARNING: No Google Play service account key provided."
          fi

      - name: Resolve next monotonic Android versionCode
        id: versioning
        shell: bash
        run: |
          set -euo pipefail
          KEY_OPT=""
          if [ -n "${PLAY_SERVICE_ACCOUNT_PATH:-}" ] && [ -f "${PLAY_SERVICE_ACCOUNT_PATH}" ]; then
            KEY_OPT="--service-account-json ${PLAY_SERVICE_ACCOUNT_PATH}"
          fi

          NEXT_CODE="$(python3 scripts/ci/resolve-android-build-number.py ${KEY_OPT} --update-gradle)"
          echo "next_version_code=${NEXT_CODE}" >> "$GITHUB_OUTPUT"
          echo "Resolved next Android versionCode: ${NEXT_CODE}"

      - name: Install web dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd hushh-webapp
          npm ci

      - name: Build static export & sync Capacitor Android
        shell: bash
        run: |
          set -euo pipefail
          cd hushh-webapp
          npm run sync:native-firebase-configs
          npm run cap:build
          npm run cap:sync:android

      - name: Compile Android App Bundle (.aab)
        shell: bash
        run: |
          set -euo pipefail
          cd hushh-webapp/android
          ./gradlew bundleRelease --stacktrace

      - name: Upload .aab to Google Play Console
        if: ${{ inputs.dry_run != true }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ env.PLAY_SERVICE_ACCOUNT_PATH }}
          packageName: ${{ env.ANDROID_PACKAGE_NAME }}
          releaseFiles: hushh-webapp/android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track }}
          status: completed

      - name: Publish job summary
        shell: bash
        run: |
          set -euo pipefail
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## 🤖 Hushh One Android Play Store Ship

          - **Target Track**: \`${{ inputs.track }}\`
          - **Version Code**: \`${{ steps.versioning.outputs.next_version_code }}\`
          - **Package Name**: \`${{ env.ANDROID_PACKAGE_NAME }}\`
          - **Dry Run**: \`${{ inputs.dry_run }}\`
          - **Artifact**: \`hushh-webapp/android/app/build/outputs/bundle/release/app-release.aab\`
          - **Play Console**: [Google Play Console Releases](https://play.google.com/console)
          EOF
