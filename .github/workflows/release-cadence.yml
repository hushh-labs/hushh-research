name: UAT Release Cadence

# A downstream observer only: no job or lock is added to Deploy to UAT.
on:
  # Reuse the existing hourly clock's runner-free wait; cron is best effort.
  repository_dispatch:
    types: [capacity-maintenance-clock]
  schedule:
    # Revisit deferred Apple reviews without holding any runner between checks.
    - cron: '17 * * * *'
    # Low-frequency catch-up also finds successful reruns of older failures.
    - cron: '7 3 * * 1'
  workflow_run:
    workflows: [Deploy to UAT, Deploy to Production, Ship iOS to TestFlight, Release iOS to App Store, Resume iOS TestFlight Release]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      recover_checkpoint_sha:
        description: Production operator only; exact ledger commit reviewed after an interrupted checkpoint publication
        type: string
        default: ""
      full_reconcile:
        description: Reconcile all post-activation UAT runs, including missed completion events
        type: boolean
        default: false
      retire_failed_before:
        description: Production operator only; retire older proven pre-upload failures before this latest milestone
        type: string
        default: ""
      retry_failed_native_run_id:
        description: Production operator only; replace one proven prearchive TestFlight API-gate failure
        type: string
        default: ""
      reviewed_ledger_sha:
        description: Exact certified ledger commit reviewed for the selected operator recovery
        type: string
        default: ""

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: release-cadence-accounting
  cancel-in-progress: false
  queue: max

jobs:
  reconcile:
    # Every terminal UAT result wakes deferred releases; only healthy successes
    # advance the counter in the controller.
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.recover_checkpoint_sha && 60 || 10 }}
    env:
      GH_TOKEN: ${{ github.token }}
      FULL_RECONCILE: ${{ inputs.full_reconcile }}
      RECOVER_CHECKPOINT_SHA: ${{ inputs.recover_checkpoint_sha }}
      RETIRE_FAILED_BEFORE: ${{ inputs.retire_failed_before }}
      RETRY_FAILED_NATIVE_RUN_ID: ${{ inputs.retry_failed_native_run_id }}
      REVIEWED_LEDGER_SHA: ${{ inputs.reviewed_ledger_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Require the protected main controller
        run: test "$GITHUB_REF_NAME" = main
      - name: Account verified deployments and dispatch eligible releases
        id: accounting
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "$FULL_RECONCILE" == true ]]; then args+=(--full); fi
          if [[ -n "$RECOVER_CHECKPOINT_SHA" ]]; then args+=(--recover-head "$RECOVER_CHECKPOINT_SHA"); fi
          if [[ -n "$RETIRE_FAILED_BEFORE" ]]; then args+=(--retire-failed-before "$RETIRE_FAILED_BEFORE"); fi
          if [[ -n "$RETRY_FAILED_NATIVE_RUN_ID" ]]; then args+=(--retry-failed-native-run-id "$RETRY_FAILED_NATIVE_RUN_ID"); fi
          if [[ -n "$REVIEWED_LEDGER_SHA" ]]; then args+=(--reviewed-ledger-sha "$REVIEWED_LEDGER_SHA"); fi
          python3 scripts/ci/release-cadence.py reconcile "${args[@]}"
      - name: Publish immutable controller authority and accounting checkpoint
        id: checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-cadence-authority
          path: ${{ runner.temp }}/release-cadence-authority/checkpoint.json
          retention-days: 90
          overwrite: true
          if-no-files-found: warn
      - name: Report release milestones and failures in GitHub
        if: always()
        timeout-minutes: 2
        env:
          ACCOUNTING_OUTCOME: ${{ steps.accounting.outcome }}
          CHECKPOINT_OUTCOME: ${{ steps.checkpoint.outcome }}
        run: python3 scripts/ci/release_cadence_monitor.py
