name: Deploy to UAT

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Auto-detect deploy lane, or force backend/frontend/all"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - all
          - backend
          - frontend
      sha:
        description: "Exact green main SHA to deploy (blank defaults to latest origin/main)"
        required: false
        type: string

permissions:
  # write: this workflow tags a healthy release as "last known good"
  # (scripts/ci/tag-last-known-good.sh) so a future revert check and a
  # future rollback both have a durable anchor. Scoped to pushing tags only
  # — the workflow never touches a branch.
  contents: write
  checks: read
  id-token: write

env:
  GCP_PROJECT_ID: hushh-pda-uat
  UAT_FIREBASE_PROJECT_ID: hushh-pda
  GCP_REGION: us-central1
  BACKEND_SERVICE: consent-protocol
  RUNTIME_SERVICE_ACCOUNT: consent-protocol-runtime@hushh-pda-uat.iam.gserviceaccount.com
  FRONTEND_SERVICE: hushh-webapp
  FRONTEND_RUNTIME_SERVICE_ACCOUNT: hushh-webapp-runtime@hushh-pda-uat.iam.gserviceaccount.com
  APP_FRONTEND_ORIGIN: https://uat.one.hushh.ai
  CONSENT_API_PUBLIC_ORIGIN: https://api.uat.hushh.ai
  CONSENT_API_RUNTIME_ORIGIN: https://consent-protocol-f2gsa4kfsq-uc.a.run.app
  UAT_CLOUDSQL_INSTANCE: hushh-pda-uat:us-central1:hushh-uat-pg
  UAT_DB_UNIX_SOCKET: /cloudsql/hushh-pda-uat:us-central1:hushh-uat-pg
  BACKEND_REVISION_RETENTION: "3"
  FRONTEND_REVISION_RETENTION: "10"
  PROTOCOL_PYTHON: ${{ github.workspace }}/consent-protocol/.venv/bin/python

concurrency:
  group: deploy-uat
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy UAT Scope
    runs-on: ubuntu-latest
    environment: uat

    steps:
      - name: Assert manual dispatch originates from main
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "Refusing UAT deploy from '${GITHUB_REF_NAME}'. Trigger this workflow from 'main' only."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Assert manual UAT dispatch actor policy
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/assert-governed-actor.py --surface uat --actor "${GITHUB_ACTOR}"

      - name: Capture deployment timing start
        id: timing-start
        shell: bash
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      # A branch tip is "whatever happened most recently", which is a different
      # question from "what is proven". On 2026-08-14 those answers differed by
      # seconds: a green merge, then a teammate's merge whose own post-merge
      # gate had not finished, and this step resolved to that unproven tip. The
      # validator below caught it — but only after the dispatch, and only by
      # luck of ordering. Selecting is the fix; validating is the backstop.
      #
      # A blank input now means "pick the newest commit that has its OWN
      # successful post-merge gate", never `git rev-parse origin/main`.
      - name: Resolve deployment SHA
        id: resolve-sha
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.sha }}" ]; then
            # An explicit SHA is a request, not a permission: it still has to
            # clear the exact-gate validator in the next step.
            echo "sha=${{ github.event.inputs.sha }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node hushh-webapp/scripts/ci/select-uat-target.mjs --limit 20 --github-output

      - name: Validate deployment SHA against main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUIRED_BRANCH: main
          REQUIRE_CI_SUCCESS: "1"
          REQUIRED_CHECK_NAME: "Main Post-Merge Smoke Gate"
        run: bash scripts/ci/require-deploy-sha-on-main.sh "${{ steps.resolve-sha.outputs.sha }}"

      - name: Checkout deployment SHA
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "${{ steps.resolve-sha.outputs.sha }}"

      - name: Validate Google Cloud workload identity configuration
        shell: bash
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test -n "$WIF_PROVIDER" || { echo "Missing environment variable GCP_WORKLOAD_IDENTITY_PROVIDER" >&2; exit 1; }
          test -n "$DEPLOY_SERVICE_ACCOUNT" || { echo "Missing environment variable GCP_DEPLOY_SERVICE_ACCOUNT" >&2; exit 1; }

      - name: Authenticate to Google Cloud
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          project_id: ${{ env.GCP_PROJECT_ID }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set GCP project context
        run: gcloud config set project "${{ env.GCP_PROJECT_ID }}"

      - name: Assert GCP project scope
        shell: bash
        run: |
          set -euo pipefail
          ACTIVE_PROJECT="$(gcloud config get-value project 2>/dev/null)"
          if [ "$ACTIVE_PROJECT" != "${{ env.GCP_PROJECT_ID }}" ]; then
            echo "Refusing deploy: expected project '${{ env.GCP_PROJECT_ID }}' but got '$ACTIVE_PROJECT'."
            exit 1
          fi

      - name: Set up Python + uv runtime
        uses: ./consent-protocol/.github/actions/setup-python-uv
        with:
          python-version: "3.13"
          protocol-dir: ./consent-protocol

      - name: Capture predeploy Cloud Run state
        id: predeploy-state
        shell: bash
        run: |
          set -euo pipefail

          backend_revision="$(gcloud run services describe "${{ env.BACKEND_SERVICE }}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --region="${{ env.GCP_REGION }}" \
            --format='value(status.traffic[0].revisionName)' 2>/dev/null || true)"
          backend_url="$(gcloud run services describe "${{ env.BACKEND_SERVICE }}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --region="${{ env.GCP_REGION }}" \
            --format='value(status.url)' 2>/dev/null || true)"
          frontend_revision="$(gcloud run services describe "${{ env.FRONTEND_SERVICE }}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --region="${{ env.GCP_REGION }}" \
            --format='value(status.traffic[0].revisionName)' 2>/dev/null || true)"
          frontend_url="$(gcloud run services describe "${{ env.FRONTEND_SERVICE }}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --region="${{ env.GCP_REGION }}" \
            --format='value(status.url)' 2>/dev/null || true)"

          backend_sha=""
          if [ -n "${backend_revision}" ]; then
            backend_sha="$(gcloud run revisions describe "${backend_revision}" \
              --project="${{ env.GCP_PROJECT_ID }}" \
              --region="${{ env.GCP_REGION }}" \
              --format='value(metadata.labels.deploy-sha)' 2>/dev/null || true)"
          fi
          frontend_sha=""
          if [ -n "${frontend_revision}" ]; then
            frontend_sha="$(gcloud run revisions describe "${frontend_revision}" \
              --project="${{ env.GCP_PROJECT_ID }}" \
              --region="${{ env.GCP_REGION }}" \
              --format='value(metadata.labels.deploy-sha)' 2>/dev/null || true)"
          fi

          echo "backend_revision=${backend_revision}" >> "$GITHUB_OUTPUT"
          echo "backend_url=${backend_url}" >> "$GITHUB_OUTPUT"
          echo "backend_sha=${backend_sha}" >> "$GITHUB_OUTPUT"
          echo "frontend_revision=${frontend_revision}" >> "$GITHUB_OUTPUT"
          echo "frontend_url=${frontend_url}" >> "$GITHUB_OUTPUT"
          echo "frontend_sha=${frontend_sha}" >> "$GITHUB_OUTPUT"

      - name: Resolve deployment scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/resolve-deploy-scope.py \
            --requested-scope "${{ github.event.inputs.scope }}" \
            --target-sha "${{ steps.resolve-sha.outputs.sha }}" \
            --backend-base-sha "${{ steps.predeploy-state.outputs.backend_sha }}" \
            --frontend-base-sha "${{ steps.predeploy-state.outputs.frontend_sha }}" \
            --github-output "$GITHUB_OUTPUT" \
            --json

      - name: Resolve last-known-good rollback targets
        id: rollback-targets
        shell: bash
        run: |
          set -euo pipefail

          # This tag intentionally moves after every healthy UAT release. Force
          # refresh it so a reused checkout cannot resolve a stale local tag.
          git fetch --force origin \
            refs/tags/deployed/uat-latest:refs/tags/deployed/uat-latest

          backend_revision=""
          if [ "${{ steps.scope.outputs.deploy_backend }}" = "true" ]; then
            backend_revision="$(
              ROLLBACK_VERIFY_SERVICE="${{ env.BACKEND_SERVICE }}" \
              ROLLBACK_VERIFY_REGION="${{ env.GCP_REGION }}" \
              ROLLBACK_VERIFY_PROJECT="${{ env.GCP_PROJECT_ID }}" \
              bash scripts/ci/resolve-rollback-target.sh uat backend
            )"
          fi

          frontend_revision=""
          if [ "${{ steps.scope.outputs.deploy_frontend }}" = "true" ]; then
            frontend_revision="$(
              ROLLBACK_VERIFY_SERVICE="${{ env.FRONTEND_SERVICE }}" \
              ROLLBACK_VERIFY_REGION="${{ env.GCP_REGION }}" \
              ROLLBACK_VERIFY_PROJECT="${{ env.GCP_PROJECT_ID }}" \
              bash scripts/ci/resolve-rollback-target.sh uat frontend
            )"
          fi

          echo "backend_revision=${backend_revision}" >> "$GITHUB_OUTPUT"
          echo "frontend_revision=${frontend_revision}" >> "$GITHUB_OUTPUT"

      - name: Resolve UAT verification plan
        id: verification-plan
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/resolve-uat-verification-plan.py \
            --target-sha "${{ steps.resolve-sha.outputs.sha }}" \
            --backend-base-sha "${{ steps.predeploy-state.outputs.backend_sha }}" \
            --frontend-base-sha "${{ steps.predeploy-state.outputs.frontend_sha }}" \
            --deploy-backend "${{ steps.scope.outputs.deploy_backend }}" \
            --deploy-frontend "${{ steps.scope.outputs.deploy_frontend }}" \
            --github-output "$GITHUB_OUTPUT" \
            --json-output /tmp/uat-verification-plan.json

      - name: Upload verification-plan artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: uat-verification-plan
          path: /tmp/uat-verification-plan.json
          if-no-files-found: error

      - name: Set up Node runtime for protected PKM verification
        if: steps.verification-plan.outputs.requires_web_dependencies == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: hushh-webapp/package-lock.json

      - name: Install protected PKM browser dependencies
        if: steps.verification-plan.outputs.requires_web_dependencies == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix hushh-webapp
          (
            cd hushh-webapp
            npx playwright install --with-deps chromium
          )

      - name: Verify One Location read-only rollout prerequisites
        id: one_location_read_only_rollout
        shell: bash
        env:
          ONE_LOCATION_READ_ONLY_STATE_REQUESTED: ${{ vars.ONE_LOCATION_READ_ONLY_STATE_ENABLED || 'false' }}
        run: |
          set -euo pipefail

          requested="${ONE_LOCATION_READ_ONLY_STATE_REQUESTED}"
          requested="${requested#"${requested%%[![:space:]]*}"}"
          requested="${requested%"${requested##*[![:space:]]}"}"
          requested="${requested,,}"
          case "${requested}" in
            1|true|yes|on)
              normalized_requested="true"
              ;;
            ""|0|false|no|off)
              normalized_requested="false"
              ;;
            *)
              echo "Refusing UAT deployment: ONE_LOCATION_READ_ONLY_STATE_ENABLED must be a recognized boolean."
              exit 1
              ;;
          esac
          echo "enabled=${normalized_requested}" >> "${GITHUB_OUTPUT}"

          if [[ "${normalized_requested}" != "true" ]]; then
            echo "One Location read-only state remains disabled for this UAT rollout."
            exit 0
          fi

          scheduler_job="one-location-retention-purge-uat"
          expected_target="/api/one/location/retention/purge?older_than_hours=12"
          expected_uri="${CONSENT_API_RUNTIME_ORIGIN%/}${expected_target}"
          if ! scheduler_evidence="$(
            gcloud scheduler jobs describe "${scheduler_job}" \
              --project="${GCP_PROJECT_ID}" \
              --location="${GCP_REGION}" \
              --format=json 2>/dev/null \
            | "${PROTOCOL_PYTHON}" -c '
          import json
          import sys

          payload = json.load(sys.stdin)
          target = payload.get("httpTarget") or {}
          headers = target.get("headers") or {}
          auth_present = any(
              str(key).strip().lower() == "x-hushh-maintenance-token"
              and bool(str(value).strip())
              for key, value in headers.items()
          )
          print("\t".join((
              str(payload.get("state") or ""),
              str(target.get("uri") or ""),
              str(target.get("httpMethod") or ""),
              "true" if auth_present else "false",
          )))
          '
          )"; then
            echo "Refusing to enable One Location read-only state: the canonical UAT retention scheduler is missing."
            exit 1
          fi

          IFS=$'\t' read -r scheduler_state scheduler_uri scheduler_method scheduler_auth_present \
            <<<"${scheduler_evidence}"
          if [[ "${scheduler_state}" != "ENABLED" ]]; then
            echo "Refusing to enable One Location read-only state: the canonical UAT retention scheduler is not ENABLED."
            exit 1
          fi
          if [[ "${scheduler_method^^}" != "POST" ]]; then
            echo "Refusing to enable One Location read-only state: the canonical UAT retention scheduler is not configured for POST."
            exit 1
          fi
          if [[ "${scheduler_auth_present}" != "true" ]]; then
            echo "Refusing to enable One Location read-only state: the canonical UAT retention scheduler has no maintenance-auth header."
            exit 1
          fi

          scheduler_target="$("${PROTOCOL_PYTHON}" - "${scheduler_uri}" <<'PY'
          import sys
          from urllib.parse import urlsplit

          target = urlsplit(sys.argv[1])
          if (
              target.scheme != "https"
              or not target.netloc
              or target.username
              or target.password
              or target.fragment
          ):
              raise SystemExit(1)
          suffix = target.path
          if target.query:
              suffix = f"{suffix}?{target.query}"
          print(suffix)
          PY
          )" || {
            echo "Refusing to enable One Location read-only state: the scheduler target is not a canonical HTTPS endpoint."
            exit 1
          }

          if [[ "${scheduler_target}" != "${expected_target}" || "${scheduler_uri}" != "${expected_uri}" ]]; then
            echo "Refusing to enable One Location read-only state: the scheduler does not target the canonical UAT retention endpoint."
            exit 1
          fi

          # Deliberately report only the job identity. Header values remain in
          # the private gcloud-to-Python pipe and are reduced to a boolean.
          echo "Verified ENABLED One Location retention scheduler: ${scheduler_job}."

      - name: Sync canonical hosted runtime secrets
        shell: bash
        run: |
          set -euo pipefail
          "${{ env.PROTOCOL_PYTHON }}" scripts/ops/sync_backend_runtime_secrets.py \
            --project "${{ env.GCP_PROJECT_ID }}" \
            --environment uat \
            --app-frontend-origin "${{ env.APP_FRONTEND_ORIGIN }}" \
            --db-host "cloudsql-socket" \
            --db-port "5432" \
            --db-name "postgres" \
            --db-unix-socket "${{ env.UAT_DB_UNIX_SOCKET }}" \
            --cloudsql-instance-connection-name "${{ env.UAT_CLOUDSQL_INSTANCE }}" \
            --consent-sse-enabled "true" \
            --sync-remote-enabled "false" \
            --developer-api-enabled "true" \
            --remote-mcp-enabled "true" \
            --cors-allowed-origins "${{ env.APP_FRONTEND_ORIGIN }}" \
            --obs-data-stale-ratio-threshold "0.25" \
            --passkey-allowed-rp-ids "localhost,127.0.0.1,one.hushh.ai,uat.one.hushh.ai" \
            --plaid-env "production" \
            --plaid-client-name "Hushh Kai" \
            --plaid-country-codes "US" \
            --plaid-webhook-url "${{ env.APP_FRONTEND_ORIGIN }}/api/kai/plaid/webhook" \
            --plaid-redirect-path "/kai/plaid/oauth/return" \
            --plaid-tx-history-days "730" \
            --one-location-read-only-state-enabled "${{ steps.one_location_read_only_rollout.outputs.enabled }}" \
            --consent-center-summary-v2-enabled "${{ vars.CONSENT_CENTER_SUMMARY_V2_ENABLED || 'true' }}" \
            --db-bulk-batching-enabled "${{ vars.DB_BULK_BATCHING_ENABLED || 'false' }}" \
            --hushh-trusted-device-enabled "${{ vars.HUSSH_TRUSTED_DEVICE_ENABLED || 'false' }}" \
            --one-location-nearby-presence-mode "${{ vars.ONE_LOCATION_NEARBY_PRESENCE_MODE_UAT || '' }}" \
            --one-location-nearby-presence-cohort "${{ vars.ONE_LOCATION_NEARBY_PRESENCE_COHORT_UAT || '' }}" \
            --hushh-trusted-device-uat-allowlist "${{ vars.HUSSH_TRUSTED_DEVICE_UAT_ALLOWLIST || '' }}" \
            --hushh-tech-client-enabled "${{ vars.HUSSH_TECH_CLIENT_ENABLED || 'false' }}" \
            --hushh-tech-developer-app-id "${{ vars.HUSSH_TECH_DEVELOPER_APP_ID || '' }}" \
            --hushh-tech-allowed-audience "hushh-tech-uat" \
            --hushh-tech-allowed-redirect-uris "https://uat.hushhtech.com/auth/hushh-research/callback" \
            --hushh-tech-allowed-consent-scopes "${{ vars.HUSSH_TECH_ALLOWED_CONSENT_SCOPES || '' }}" \
            --hushh-tech-uat-firebase-uid-allowlist "${{ vars.HUSSH_TECH_UAT_FIREBASE_UID_ALLOWLIST || '' }}" \
            --hushh-tech-shadow-max-age-ms "604800000" \
            --hushh-tech-trusted-proxy-hops "${{ vars.HUSSH_TECH_TRUSTED_PROXY_HOPS || '0' }}" \
            --hushh-tech-proxy-audience "${{ env.CONSENT_API_RUNTIME_ORIGIN }}" \
            --hushh-tech-trusted-proxy-service-accounts "${{ env.FRONTEND_RUNTIME_SERVICE_ACCOUNT }},${{ vars.HUSSH_TECH_TRUSTED_PROXY_SERVICE_ACCOUNTS || '' }}" \
            --advisors-api-base-url "${{ vars.ADVISORS_API_BASE_URL || 'https://brokercheck.35.253.255.106.sslip.io' }}" \
            --insurance-agents-api-base-url "${{ vars.INSURANCE_AGENTS_API_BASE_URL || 'https://insurance-agents.34.61.69.175.sslip.io' }}" \
            --one-places-directory-enabled "${{ vars.ONE_PLACES_DIRECTORY_ENABLED_UAT || 'true' }}" \
            > /tmp/uat-runtime-secret-sync.json

          "${{ env.PROTOCOL_PYTHON }}" scripts/ops/sync_frontend_runtime_secrets.py \
            --project "${{ env.GCP_PROJECT_ID }}" \
            --environment uat \
            > /tmp/uat-frontend-runtime-secret-sync.json

      - name: Install Cloud SQL Auth Proxy
        if: steps.scope.outputs.deploy_backend == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.18.3/cloud-sql-proxy.linux.amd64 \
            -o /usr/local/bin/cloud-sql-proxy
          chmod +x /usr/local/bin/cloud-sql-proxy

      - name: Apply UAT DB migrations and predeploy schema gate
        if: steps.scope.outputs.deploy_backend == 'true'
        shell: bash
        run: |
          set -euo pipefail

          if [ "${GCP_PROJECT_ID}" != "hushh-pda-uat" ] \
             || [ "${UAT_CLOUDSQL_INSTANCE}" != "hushh-pda-uat:us-central1:hushh-uat-pg" ]; then
            echo "Refusing UAT migration: project or Cloud SQL instance is not the canonical UAT target."
            exit 1
          fi
          export HUSSH_RELEASE_ENVIRONMENT=uat
          export CLOUDSQL_INSTANCE_CONNECTION_NAME="${UAT_CLOUDSQL_INSTANCE}"

          DB_USER="$(gcloud secrets versions access latest --secret=DB_USER --project="${{ env.GCP_PROJECT_ID }}")"
          DB_PASSWORD="$(gcloud secrets versions access latest --secret=DB_PASSWORD --project="${{ env.GCP_PROJECT_ID }}")"
          echo "::add-mask::${DB_USER}"
          echo "::add-mask::${DB_PASSWORD}"

          cloud-sql-proxy \
            --address 127.0.0.1 \
            --port 6543 \
            ${GOOGLE_GHA_CREDS_PATH:+--credentials-file="${GOOGLE_GHA_CREDS_PATH}"} \
            "${{ env.UAT_CLOUDSQL_INSTANCE }}" >/tmp/cloud-sql-proxy-uat.log 2>&1 &
          PROXY_PID=$!
          trap 'kill "${PROXY_PID}" >/dev/null 2>&1 || true' EXIT

          python3 - <<'PY'
          import socket
          import time

          deadline = time.time() + 20
          while time.time() < deadline:
              with socket.socket() as sock:
                  sock.settimeout(0.5)
                  if sock.connect_ex(("127.0.0.1", 6543)) == 0:
                      raise SystemExit(0)
              time.sleep(0.25)
          raise SystemExit("Cloud SQL proxy did not bind 127.0.0.1:6543 in time")
          PY

          export DB_HOST=127.0.0.1
          export DB_PORT=6543
          export DB_NAME=postgres
          export DB_USER
          export DB_PASSWORD

          (
            cd consent-protocol
            "${{ env.PROTOCOL_PYTHON }}" db/migrate.py --release \
              --release-environment uat \
              --migration-mode "${{ vars.UAT_MIGRATION_MODE || 'replay' }}"
          )
          "${{ env.PROTOCOL_PYTHON }}" scripts/ops/db_migration_release_guard.py \
            --release-environment uat \
            --contract-file consent-protocol/db/contracts/uat_integrated_schema.json \
            --report-path /tmp/uat-db-migration-guard-predeploy.json

          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi

          BOOTSTRAP_FOCUS_PROFILE=uat bash scripts/env/bootstrap_profiles.sh --strict
          bash scripts/env/use_profile.sh uat

          if [ "${{ steps.verification-plan.outputs.run_pkm_upgrade_gate }}" = "true" ]; then
            export PGHOST="$DB_HOST"
            export PGPORT="$DB_PORT"
            export PGDATABASE="$DB_NAME"
            export PGUSER="$DB_USER"
            export PGPASSWORD="$DB_PASSWORD"
            PKM_UPGRADE_PROTECTED_UAT=1 \
            PKM_UPGRADE_STRUCTURE_AGENT_EVAL_DEFERRED=1 \
            PKM_UPGRADE_RUNTIME_AUDIT_DEFERRED=1 \
              ./scripts/ci/pkm-upgrade-gate.sh
          fi

      - name: Deploy backend using Cloud Build
        id: deploy-backend
        if: steps.scope.outputs.deploy_backend == 'true'
        shell: bash
        run: |
          set -euo pipefail
          started_at="$(date +%s)"
          SUBSTITUTIONS="_BACKEND_SERVICE=${{ env.BACKEND_SERVICE }}##_REGION=${{ env.GCP_REGION }}##_CLOUDSQL_INSTANCES=${{ env.UAT_CLOUDSQL_INSTANCE }}##_PLAID_CLIENT_ID_SECRET=PLAID_CLIENT_ID##_PLAID_SECRET_SECRET=PLAID_SECRET##_PLAID_ACCESS_TOKEN_KEY_SECRET=PLAID_ACCESS_TOKEN_KEY##_FINNHUB_API_KEY_SECRET=FINNHUB_API_KEY##_PMP_API_KEY_SECRET=PMP_API_KEY##_NEWSAPI_KEY_SECRET=NEWSAPI_KEY##_GMAIL_OAUTH_CLIENT_ID_SECRET=GMAIL_OAUTH_CLIENT_ID##_GMAIL_OAUTH_CLIENT_SECRET_SECRET=GMAIL_OAUTH_CLIENT_SECRET##_GMAIL_OAUTH_REDIRECT_URI_SECRET=GMAIL_OAUTH_REDIRECT_URI##_GMAIL_OAUTH_TOKEN_KEY_SECRET=GMAIL_OAUTH_TOKEN_KEY##_GOOGLE_OAUTH_CLIENT_ID_SECRET=GOOGLE_OAUTH_CLIENT_ID##_GOOGLE_OAUTH_CLIENT_SECRET_SECRET=GOOGLE_OAUTH_CLIENT_SECRET##_GOOGLE_OAUTH_REDIRECT_URI_SECRET=GOOGLE_OAUTH_REDIRECT_URI##_GOOGLE_OAUTH_TOKEN_KEY_SECRET=GOOGLE_OAUTH_TOKEN_KEY##_OPENAI_API_KEY_SECRET=OPENAI_API_KEY##_GOOGLE_MAPS_API_KEY_SECRET=GOOGLE_MAPS_API_KEY##_VOICE_RUNTIME_CONFIG_JSON_SECRET=VOICE_RUNTIME_CONFIG_JSON##_HUSHH_DEVELOPER_TOKEN_SECRET=HUSHH_DEVELOPER_TOKEN##_HUSHH_TECH_LAUNCH_PEPPER_SECRET=HUSSH_TECH_LAUNCH_PEPPER##_RATE_LIMIT_STORAGE_URI_SECRET=RATE_LIMIT_STORAGE_URI##_HUSHH_UAT_PHONE_TEST_NUMBERS_SECRET=HUSHH_UAT_PHONE_TEST_NUMBERS##_HUSHH_UAT_PHONE_TEST_CODE_SECRET=HUSHH_UAT_PHONE_TEST_CODE##_REVIEWER_UID_SECRET=REVIEWER_UID##_REVIEWER_VAULT_PASSPHRASE_SECRET=REVIEWER_VAULT_PASSPHRASE##_RIA_INTELLIGENCE_VERIFY_BASE_URL_SECRET=RIA_INTELLIGENCE_VERIFY_BASE_URL##_ONE_EMAIL_WATCH_RENEW_TOKEN_SECRET=ONE_EMAIL_WATCH_RENEW_TOKEN##_ONE_EMAIL_ADDRESS=one@hushh.ai##_ONE_EMAIL_DELEGATED_USER=one@hushh.ai##_ONE_EMAIL_PUBSUB_TOPIC=projects/hushh-pda/topics/one-email-kyc-uat##_ONE_EMAIL_WEBHOOK_AUDIENCE=https://consent-protocol-f2gsa4kfsq-uc.a.run.app/api/one/email/webhook##_ONE_EMAIL_WEBHOOK_SERVICE_ACCOUNT_EMAIL=one-email-pubsub-push@hushh-pda.iam.gserviceaccount.com##_ONE_EMAIL_WEBHOOK_AUTH_ENABLED=true##_ONE_EMAIL_WATCH_RENEW_AUTH_ENABLED=true##_ONE_EMAIL_KYC_DEFAULT_SCOPE=attr.identity.*##_ONE_EMAIL_KYC_STRICT_CLIENT_ZK_ENABLED=true##_ONE_WALLET_CARD_ENABLED=true##_ONE_WALLET_ENABLED=true##_HUSSH_GEMINI_TEXT_MODEL=##_WALLET_PASS_PROVIDER=service##_WALLET_API_KEY_SECRET=WALLET_API_KEY##_APP_REVIEW_MODE=true##_CONSENT_WEB_FALLBACK_ENABLED=false##_CONSENT_SSE_ENABLED=false##_DB_POOL_MIN_SIZE=1##_DB_POOL_MAX_SIZE=4##_DB_SQLALCHEMY_POOL_SIZE=3##_DB_SQLALCHEMY_MAX_OVERFLOW=0##_CLOUD_RUN_MIN_INSTANCES=2##_CLOUD_RUN_MAX_INSTANCES=5##_CLOUD_RUN_CPU=2##_CLOUD_RUN_CONCURRENCY=20##_CLOUD_RUN_NO_TRAFFIC=true##_IMAGE_TAG=uat-${{ steps.resolve-sha.outputs.sha }}##_DEPLOY_ENV=uat##_DEPLOY_SOURCE=deploy-uat##_DEPLOY_SHA=${{ steps.resolve-sha.outputs.sha }}##_GITHUB_RUN_ID=${{ github.run_id }}"
          SUBSTITUTIONS="${SUBSTITUTIONS}##_RUNTIME_SERVICE_ACCOUNT=${{ env.RUNTIME_SERVICE_ACCOUNT }}"
          SUBSTITUTIONS="${SUBSTITUTIONS}##_CONSENT_API_PUBLIC_ORIGIN=${{ env.CONSENT_API_PUBLIC_ORIGIN }}"
          SUBSTITUTIONS="${SUBSTITUTIONS}##_VPC_CONNECTOR=${{ vars.UAT_VPC_CONNECTOR || '' }}"
          # TEMP (revert once the hushh-pda-uat billing dunning is resolved):
          # route ONLY the managed Vertex/Gemini client to a bridge project on
          # a healthy billing account, per backend.cloudbuild.yaml's existing
          # genai_project_id support. Cloud SQL, secrets, and everything else
          # still target hushh-pda-uat via $PROJECT_ID. To revert, delete this
          # line (genai_project_id then falls back to $PROJECT_ID).
          SUBSTITUTIONS="${SUBSTITUTIONS}##_GENAI_PROJECT_ID=hushh-gemini-bridge"
          # The canonical 3.1 Live preview uses a separate prepaid Developer
          # API pool. UAT must remain functional when that pool is depleted, so
          # pin the already-rehearsed GA Vertex rollback until credits recover.
          SUBSTITUTIONS="${SUBSTITUTIONS}##_AGENT_ONE_ADK_MODEL=gemini-live-2.5-flash-native-audio"
          # Durable Kai analyze-run store ON in UAT: exercises the migration-125
          # persist/replay path against real Cloud SQL before prod flips it on.
          SUBSTITUTIONS="${SUBSTITUTIONS}##_KAI_ANALYZE_DURABLE_RUN_STORE=true"
          verify_managed_vertex_runtime=false
          if [ "${{ steps.verification-plan.outputs.pkm_evaluator_runs }}" != "0" ]; then
            verify_managed_vertex_runtime=true
          fi
          SUBSTITUTIONS="${SUBSTITUTIONS}##_VERIFY_MANAGED_VERTEX_RUNTIME=${verify_managed_vertex_runtime}"
          # RIA claim-by-phone: identity resolver + the UAT demo passcode
          # allowlist (fixed code, no SMS to real firm lines). UAT-only.
          SUBSTITUTIONS="${SUBSTITUTIONS}##_RIA_IDENTITY_BASE_URL_SECRET=RIA_IDENTITY_BASE_URL##_RIA_IDENTITY_API_KEY_SECRET=RIA_IDENTITY_API_KEY##_RIA_CLAIM_TEST_NUMBERS_SECRET=RIA_CLAIM_TEST_NUMBERS##_RIA_CLAIM_TEST_CODE_SECRET=RIA_CLAIM_TEST_CODE##_RIA_CLAIM_TEST_EMAILS_SECRET=RIA_CLAIM_TEST_EMAILS##_INTELLIGENCE_API_BASE_URL_SECRET=INTELLIGENCE_API_BASE_URL##_INTELLIGENCE_API_KEY_SECRET=INTELLIGENCE_API_KEY##_SUPPORT_EMAIL_TEST_TO_SECRET=SUPPORT_EMAIL_TEST_TO##_SUPPORT_EMAIL_MODE_SECRET=SUPPORT_EMAIL_MODE##_SUPPORT_EMAIL_DELEGATED_USER_SECRET=SUPPORT_EMAIL_DELEGATED_USER##_SUPPORT_EMAIL_FROM_SECRET=SUPPORT_EMAIL_FROM##_GOOGLE_SERVICE_ACCOUNT_EMAIL_SECRET=GOOGLE_SERVICE_ACCOUNT_EMAIL##_GOOGLE_PRIVATE_KEY_SECRET=GOOGLE_PRIVATE_KEY"
          gcloud builds submit \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --config=deploy/backend.cloudbuild.yaml \
            "--substitutions=^##^${SUBSTITUTIONS}"
          finished_at="$(date +%s)"
          echo "started_at_epoch=${started_at}" >> "$GITHUB_OUTPUT"
          echo "finished_at_epoch=${finished_at}" >> "$GITHUB_OUTPUT"
          echo "duration_seconds=$((finished_at - started_at))" >> "$GITHUB_OUTPUT"

      - name: Retain latest backend revisions
        if: steps.scope.outputs.deploy_backend == 'true'
        continue-on-error: true
        run: bash scripts/ci/cloudrun-retention.sh "${{ env.BACKEND_SERVICE }}" "${{ env.GCP_REGION }}" "${{ env.BACKEND_REVISION_RETENTION }}"

      # The structure evaluator exercises the backend candidate image. Keep it
      # before the frontend build so an advisory model-quality warning is
      # available as early as possible, without turning a model variance into a
      # deployment or rollback authority.
      - name: Resolve backend candidate revision
        id: backend-candidate-state
        if: steps.scope.outputs.deploy_backend == 'true'
        shell: bash
        run: |
          set -euo pipefail
          backend_revision="$(gcloud run services describe "${{ env.BACKEND_SERVICE }}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --region="${{ env.GCP_REGION }}" \
            --format='value(status.latestCreatedRevisionName)')"
          echo "backend_revision=${backend_revision}" >> "$GITHUB_OUTPUT"

      - name: Verify backend candidate runtime identity
        if: steps.scope.outputs.deploy_backend == 'true'
        run: >-
          bash scripts/ci/assert-cloud-run-runtime-identity.sh
          "${{ env.GCP_PROJECT_ID }}"
          "${{ env.GCP_REGION }}"
          "${{ steps.backend-candidate-state.outputs.backend_revision }}"
          "${{ env.RUNTIME_SERVICE_ACCOUNT }}"

      - name: Verify candidate PKM evaluator in Cloud Run
        id: verify-candidate-pkm-evaluator
        if: steps.scope.outputs.deploy_backend == 'true' && steps.verification-plan.outputs.pkm_evaluator_runs != '0'
        shell: bash
        env:
          BACKEND_REVISION: ${{ steps.backend-candidate-state.outputs.backend_revision }}
        run: |
          set -euo pipefail
          if ./scripts/ci/run-candidate-pkm-structure-agent-eval.sh; then
            echo "outcome=success" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=failure" >> "$GITHUB_OUTPUT"
            echo "Candidate PKM evaluator failed; continuing with its advisory warning." >&2
          fi

      - name: Record candidate PKM evaluator warning
        if: always() && steps.scope.outputs.deploy_backend == 'true' && steps.verification-plan.outputs.pkm_evaluator_runs != '0' && steps.verify-candidate-pkm-evaluator.outputs.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          echo "::warning title=Candidate PKM evaluator warning::The synthetic structure-agent evaluator failed. This is advisory; runtime identity, provenance, parity, schema, semantic, reviewer, and passkey gates remain blocking."
          {
            echo "## ⚠ Candidate PKM evaluator warning"
            echo ""
            echo "The synthetic structure-agent evaluator failed for this backend candidate. The result is recorded for remediation but does not authorize rollback by itself."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy frontend using Cloud Build
        id: deploy-frontend
        if: steps.scope.outputs.deploy_frontend == 'true'
        shell: bash
        run: |
          set -euo pipefail
          started_at="$(date +%s)"
          gcloud builds submit \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --config=deploy/frontend.cloudbuild.yaml \
            "--substitutions=_FRONTEND_SERVICE=${{ env.FRONTEND_SERVICE }},_FRONTEND_RUNTIME_SERVICE_ACCOUNT=${{ env.FRONTEND_RUNTIME_SERVICE_ACCOUNT }},_REGION=${{ env.GCP_REGION }},_ONE_LOCATION_NEARBY_CHECK_IN=${{ 'true' }},_LOCATION_MAP_DEMO=false,_APP_ENV=uat,_ONE_WALLET_CARD_ENABLED=true,_ONE_WALLET_ENABLED=true,_HUSHH_TECH_CLIENT_ENABLED=${{ vars.HUSSH_TECH_CLIENT_ENABLED || 'false' }},_HUSHH_TECH_PROXY_AUDIENCE=${{ env.CONSENT_API_RUNTIME_ORIGIN }},_HUSHH_TECH_FRONTEND_TRUSTED_PROXY_HOPS=${{ vars.HUSSH_TECH_FRONTEND_TRUSTED_PROXY_HOPS || '0' }},_RATE_LIMIT_STORAGE_URI_SECRET=RATE_LIMIT_STORAGE_URI,_VPC_CONNECTOR=${{ vars.UAT_VPC_CONNECTOR || '' }},_CLOUD_RUN_MEMORY=1Gi,_CLOUD_RUN_TIMEOUT_SECONDS=300,_CLOUD_RUN_CONCURRENCY=10,_CLOUD_RUN_MIN_INSTANCES=2,_CLOUD_RUN_MAX_INSTANCES=10,_CLOUD_RUN_NO_TRAFFIC=true,_IMAGE_TAG=uat-${{ steps.resolve-sha.outputs.sha }},_DEPLOY_ENV=uat,_DEPLOY_SOURCE=deploy-uat,_DEPLOY_SHA=${{ steps.resolve-sha.outputs.sha }},_GITHUB_RUN_ID=${{ github.run_id }}"
          finished_at="$(date +%s)"
          echo "started_at_epoch=${started_at}" >> "$GITHUB_OUTPUT"
          echo "finished_at_epoch=${finished_at}" >> "$GITHUB_OUTPUT"
          echo "duration_seconds=$((finished_at - started_at))" >> "$GITHUB_OUTPUT"

      - name: Retain latest frontend revisions
        if: steps.scope.outputs.deploy_frontend == 'true'
        continue-on-error: true
        run: bash scripts/ci/cloudrun-retention.sh "${{ env.FRONTEND_SERVICE }}" "${{ env.GCP_REGION }}" "${{ env.FRONTEND_REVISION_RETENTION }}"

      - name: Resolve deployed candidate revisions
        id: candidate-state
        shell: bash
        run: |
          set -euo pipefail

          backend_revision="$(gcloud run services describe "${{ env.BACKEND_SERVICE }}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --region="${{ env.GCP_REGION }}" \
            --format='value(status.latestCreatedRevisionName)')"
          frontend_revision="$(gcloud run services describe "${{ env.FRONTEND_SERVICE }}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --region="${{ env.GCP_REGION }}" \
            --format='value(status.latestCreatedRevisionName)')"

          echo "backend_revision=${backend_revision}" >> "$GITHUB_OUTPUT"
          echo "frontend_revision=${frontend_revision}" >> "$GITHUB_OUTPUT"

      - name: Promote deployed revisions to UAT traffic
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ steps.scope.outputs.deploy_backend }}" = "true" ]; then
            gcloud run services update-traffic "${{ env.BACKEND_SERVICE }}" \
              --project="${{ env.GCP_PROJECT_ID }}" \
              --region="${{ env.GCP_REGION }}" \
              --to-revisions="${{ steps.candidate-state.outputs.backend_revision }}=100"
          fi

          if [ "${{ steps.scope.outputs.deploy_frontend }}" = "true" ]; then
            gcloud run services update-traffic "${{ env.FRONTEND_SERVICE }}" \
              --project="${{ env.GCP_PROJECT_ID }}" \
              --region="${{ env.GCP_REGION }}" \
              --to-revisions="${{ steps.candidate-state.outputs.frontend_revision }}=100"
          fi

      - name: Resolve current deployed Cloud Run state
        id: current-state
        shell: bash
        run: |
          set -euo pipefail

          backend_revision="$(gcloud run services describe "${{ env.BACKEND_SERVICE }}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --region="${{ env.GCP_REGION }}" \
            --format='value(status.traffic[0].revisionName)')"
          backend_url="$(gcloud run services describe "${{ env.BACKEND_SERVICE }}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --region="${{ env.GCP_REGION }}" \
            --format='value(status.url)')"
          frontend_revision="$(gcloud run services describe "${{ env.FRONTEND_SERVICE }}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --region="${{ env.GCP_REGION }}" \
            --format='value(status.traffic[0].revisionName)')"
          frontend_url="$(gcloud run services describe "${{ env.FRONTEND_SERVICE }}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --region="${{ env.GCP_REGION }}" \
            --format='value(status.url)')"

          echo "backend_revision=${backend_revision}" >> "$GITHUB_OUTPUT"
          echo "backend_url=${backend_url}" >> "$GITHUB_OUTPUT"
          echo "frontend_revision=${frontend_revision}" >> "$GITHUB_OUTPUT"
          echo "frontend_url=${frontend_url}" >> "$GITHUB_OUTPUT"

      - name: Verify backend deployment provenance
        id: verify-backend-provenance
        if: steps.scope.outputs.deploy_backend == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          "${{ env.PROTOCOL_PYTHON }}" scripts/ci/verify-cloudrun-revision-provenance.py \
            --project "${{ env.GCP_PROJECT_ID }}" \
            --region "${{ env.GCP_REGION }}" \
            --service "${{ env.BACKEND_SERVICE }}" \
            --expected-env uat \
            --expected-source deploy-uat \
            --expected-sha "${{ steps.resolve-sha.outputs.sha }}" \
            --expected-run-id "${{ github.run_id }}" \
            --report-path /tmp/uat-backend-provenance.json

      - name: Verify frontend deployment provenance
        id: verify-frontend-provenance
        if: steps.scope.outputs.deploy_frontend == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          "${{ env.PROTOCOL_PYTHON }}" scripts/ci/verify-cloudrun-revision-provenance.py \
            --project "${{ env.GCP_PROJECT_ID }}" \
            --region "${{ env.GCP_REGION }}" \
            --service "${{ env.FRONTEND_SERVICE }}" \
            --expected-env uat \
            --expected-source deploy-uat \
            --expected-sha "${{ steps.resolve-sha.outputs.sha }}" \
            --expected-run-id "${{ github.run_id }}" \
            --report-path /tmp/uat-frontend-provenance.json

      - name: Verify UAT runtime env parity
        id: verify-parity-1
        continue-on-error: true
        run: |
          "${{ env.PROTOCOL_PYTHON }}" scripts/ops/verify-env-secrets-parity.py \
            --project "${{ env.GCP_PROJECT_ID }}" \
            --expected-firebase-project "${{ env.UAT_FIREBASE_PROJECT_ID }}" \
            --region "${{ env.GCP_REGION }}" \
            --backend-service "${{ env.BACKEND_SERVICE }}" \
            --frontend-service "${{ env.FRONTEND_SERVICE }}" \
            --require-plaid \
            --require-market-data \
            --require-gmail \
            --require-one-email \
            --require-voice \
            --require-reviewer-smoke \
            --assert-runtime-env-contract \
            --report-path /tmp/uat-runtime-parity-attempt-1.json

      - name: Verify UAT runtime env parity retry
        id: verify-parity-2
        if: steps.verify-parity-1.outcome == 'failure'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          sleep 20
          "${{ env.PROTOCOL_PYTHON }}" scripts/ops/verify-env-secrets-parity.py \
            --project "${{ env.GCP_PROJECT_ID }}" \
            --expected-firebase-project "${{ env.UAT_FIREBASE_PROJECT_ID }}" \
            --region "${{ env.GCP_REGION }}" \
            --backend-service "${{ env.BACKEND_SERVICE }}" \
            --frontend-service "${{ env.FRONTEND_SERVICE }}" \
            --require-plaid \
            --require-market-data \
            --require-gmail \
            --require-one-email \
            --require-voice \
            --require-reviewer-smoke \
            --assert-runtime-env-contract \
            --report-path /tmp/uat-runtime-parity-attempt-2.json

      - name: Verify UAT native passkey domain associations
        id: verify-passkey-associations
        if: steps.scope.outputs.deploy_frontend == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ops/verify_passkey_domain_associations.py \
            --project "${{ env.GCP_PROJECT_ID }}" \
            --origin "${{ env.APP_FRONTEND_ORIGIN }}" \
            --origin "https://one.hushh.ai"

      - name: Post-deploy UAT schema contract gate
        id: postdeploy-db-gate
        if: steps.scope.outputs.deploy_backend == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          if [ "${GCP_PROJECT_ID}" != "hushh-pda-uat" ] \
             || [ "${UAT_CLOUDSQL_INSTANCE}" != "hushh-pda-uat:us-central1:hushh-uat-pg" ]; then
            echo "Refusing UAT schema verification: project or Cloud SQL instance is not canonical."
            exit 1
          fi
          export HUSSH_RELEASE_ENVIRONMENT=uat
          export CLOUDSQL_INSTANCE_CONNECTION_NAME="${UAT_CLOUDSQL_INSTANCE}"

          DB_USER="$(gcloud secrets versions access latest --secret=DB_USER --project="${{ env.GCP_PROJECT_ID }}")"
          DB_PASSWORD="$(gcloud secrets versions access latest --secret=DB_PASSWORD --project="${{ env.GCP_PROJECT_ID }}")"
          echo "::add-mask::${DB_USER}"
          echo "::add-mask::${DB_PASSWORD}"

          cloud-sql-proxy \
            --address 127.0.0.1 \
            --port 6543 \
            ${GOOGLE_GHA_CREDS_PATH:+--credentials-file="${GOOGLE_GHA_CREDS_PATH}"} \
            "${{ env.UAT_CLOUDSQL_INSTANCE }}" >/tmp/cloud-sql-proxy-uat-postdeploy.log 2>&1 &
          PROXY_PID=$!
          trap 'kill "${PROXY_PID}" >/dev/null 2>&1 || true' EXIT

          python3 - <<'PY'
          import socket
          import time

          deadline = time.time() + 20
          while time.time() < deadline:
              with socket.socket() as sock:
                  sock.settimeout(0.5)
                  if sock.connect_ex(("127.0.0.1", 6543)) == 0:
                      raise SystemExit(0)
              time.sleep(0.25)
          raise SystemExit("Cloud SQL proxy did not bind 127.0.0.1:6543 in time")
          PY

          export DB_HOST=127.0.0.1
          export DB_PORT=6543
          export DB_NAME=postgres
          export DB_USER
          export DB_PASSWORD

          "${{ env.PROTOCOL_PYTHON }}" scripts/ops/db_migration_release_guard.py \
            --release-environment uat \
            --contract-file consent-protocol/db/contracts/uat_integrated_schema.json \
            --report-path /tmp/uat-db-migration-guard-postdeploy.json

      - name: Bootstrap UAT runtime files for semantic verification
        if: steps.postdeploy-db-gate.outcome != 'failure'
        shell: bash
        run: |
          set -euo pipefail
          BOOTSTRAP_FOCUS_PROFILE=uat bash scripts/env/bootstrap_profiles.sh --strict
          bash scripts/env/use_profile.sh uat

      - name: Load maintainer smoke overlay
        if: steps.postdeploy-db-gate.outcome != 'failure'
        shell: bash
        run: |
          set -euo pipefail
          smoke_user_id="$(gcloud secrets versions access latest \
            --secret=UAT_SMOKE_USER_ID \
            --project="${{ env.GCP_PROJECT_ID }}")"
          smoke_passphrase="$(gcloud secrets versions access latest \
            --secret=UAT_SMOKE_PASSPHRASE \
            --project="${{ env.GCP_PROJECT_ID }}")"
          echo "::add-mask::$smoke_user_id"
          echo "::add-mask::$smoke_passphrase"
          {
            echo "UAT_SMOKE_USER_ID<<EOF"
            printf '%s\n' "$smoke_user_id"
            echo "EOF"
            echo "UAT_SMOKE_PASSPHRASE<<EOF"
            printf '%s\n' "$smoke_passphrase"
            echo "EOF"
          } >> "$GITHUB_ENV"

          if [ "${{ steps.verification-plan.outputs.run_reviewer_byok }}" = "true" ]; then
            reviewer_uid="$(gcloud secrets versions access latest \
              --secret=REVIEWER_UID \
              --project="${{ env.GCP_PROJECT_ID }}")"
            reviewer_passphrase="$(gcloud secrets versions access latest \
              --secret=REVIEWER_VAULT_PASSPHRASE \
              --project="${{ env.GCP_PROJECT_ID }}")"
            echo "::add-mask::$reviewer_uid"
            echo "::add-mask::$reviewer_passphrase"
            {
              echo "REVIEWER_UID<<EOF"
              printf '%s\n' "$reviewer_uid"
              echo "EOF"
              echo "REVIEWER_VAULT_PASSPHRASE<<EOF"
              printf '%s\n' "$reviewer_passphrase"
              echo "EOF"
            } >> "$GITHUB_ENV"
          fi

      - name: Semantic UAT verification
        id: verify-uat-1
        if: steps.postdeploy-db-gate.outcome != 'failure'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          "${{ env.PROTOCOL_PYTHON }}" scripts/ops/verify_uat_release.py \
            --backend-url "${{ steps.current-state.outputs.backend_url }}" \
            --frontend-url "${{ env.APP_FRONTEND_ORIGIN }}" \
            --protocol-env consent-protocol/.env \
            --web-env hushh-webapp/.env.local \
            --report-path /tmp/uat-release-verify-attempt-1.json

      - name: Semantic UAT verification retry
        id: verify-uat-2
        if: steps.postdeploy-db-gate.outcome != 'failure' && steps.verify-uat-1.outcome == 'failure'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          sleep 20
          "${{ env.PROTOCOL_PYTHON }}" scripts/ops/verify_uat_release.py \
            --backend-url "${{ steps.current-state.outputs.backend_url }}" \
            --frontend-url "${{ env.APP_FRONTEND_ORIGIN }}" \
            --protocol-env consent-protocol/.env \
            --web-env hushh-webapp/.env.local \
            --report-path /tmp/uat-release-verify-attempt-2.json

      - name: Verify reviewer BYOK navigation and cold re-unlock
        id: verify-reviewer-byok
        if: steps.verification-plan.outputs.run_reviewer_byok == 'true' && (steps.verify-uat-1.outcome == 'success' || steps.verify-uat-2.outcome == 'success')
        continue-on-error: true
        shell: bash
        env:
          REVIEWER_APP_ORIGIN: ${{ env.APP_FRONTEND_ORIGIN }}
          REVIEWER_APP_ROUTES: /agent,/one/kai?tab=portfolio,/one/pkm
        run: |
          set -euo pipefail
          node .codex/skills/reviewer-app-testing/scripts/verify-reviewer-byok-navigation.mjs \
            2>&1 | tee /tmp/uat-reviewer-byok.log

      - name: Classify UAT release outcome
        if: always()
        id: classify-uat-release
        shell: bash
        env:
          DEPLOY_BACKEND: ${{ steps.scope.outputs.deploy_backend }}
          DEPLOY_FRONTEND: ${{ steps.scope.outputs.deploy_frontend }}
          PARITY_ATTEMPT_1: ${{ steps.verify-parity-1.outcome }}
          PARITY_ATTEMPT_2: ${{ steps.verify-parity-2.outcome }}
          BACKEND_PROVENANCE_OUTCOME: ${{ steps.verify-backend-provenance.outcome }}
          FRONTEND_PROVENANCE_OUTCOME: ${{ steps.verify-frontend-provenance.outcome }}
          DB_OUTCOME: ${{ steps.postdeploy-db-gate.outcome }}
          SEMANTIC_ATTEMPT_1: ${{ steps.verify-uat-1.outcome }}
          SEMANTIC_ATTEMPT_2: ${{ steps.verify-uat-2.outcome }}
          REVIEWER_BYOK_OUTCOME: ${{ steps.verify-reviewer-byok.outcome }}
          REVIEWER_BYOK_REQUIRED: ${{ steps.verification-plan.outputs.run_reviewer_byok }}
          PASSKEY_ASSOCIATIONS_OUTCOME: ${{ steps.verify-passkey-associations.outcome }}
          PKM_EVALUATOR_RUNS: ${{ steps.verification-plan.outputs.pkm_evaluator_runs }}
          PKM_EVALUATOR_OUTCOME: ${{ steps.verify-candidate-pkm-evaluator.outputs.outcome }}
          VERIFICATION_PLAN_REASON: ${{ steps.verification-plan.outputs.reason }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          def load_json(path: str) -> dict:
              candidate = Path(path)
              if not candidate.exists():
                  return {}
              try:
                  parsed = json.loads(candidate.read_text(encoding="utf-8"))
              except json.JSONDecodeError:
                  return {}
              return parsed if isinstance(parsed, dict) else {}

          def has_runtime_failures(entries: list[dict]) -> bool:
              return any(str(entry.get("status")) in {"missing", "legacy"} for entry in entries)

          def append_unique(target: list[str], values: list[str]) -> None:
              for value in values:
                  if value and value not in target:
                      target.append(value)

          parity_report = load_json("/tmp/uat-runtime-parity-attempt-2.json") or load_json(
              "/tmp/uat-runtime-parity-attempt-1.json"
          )
          backend_provenance_report = load_json("/tmp/uat-backend-provenance.json")
          frontend_provenance_report = load_json("/tmp/uat-frontend-provenance.json")
          semantic_report = load_json("/tmp/uat-release-verify-attempt-2.json") or load_json(
              "/tmp/uat-release-verify-attempt-1.json"
          )
          semantic_report_present = bool(semantic_report)

          parity_success = os.environ.get("PARITY_ATTEMPT_1") == "success" or os.environ.get("PARITY_ATTEMPT_2") == "success"
          backend_provenance_success = (
              os.environ.get("DEPLOY_BACKEND") != "true"
              or os.environ.get("BACKEND_PROVENANCE_OUTCOME") == "success"
          )
          frontend_provenance_success = (
              os.environ.get("DEPLOY_FRONTEND") != "true"
              or os.environ.get("FRONTEND_PROVENANCE_OUTCOME") == "success"
          )
          db_outcome = os.environ.get("DB_OUTCOME", "")
          semantic_required = db_outcome != "failure"
          semantic_success = (
              not semantic_required
              or os.environ.get("SEMANTIC_ATTEMPT_1") == "success"
              or os.environ.get("SEMANTIC_ATTEMPT_2") == "success"
          )
          browser_authority_ready = semantic_required and semantic_success
          reviewer_byok_required = os.environ.get("REVIEWER_BYOK_REQUIRED") == "true"
          reviewer_byok_success = (
              not reviewer_byok_required
              or not browser_authority_ready
              or os.environ.get("REVIEWER_BYOK_OUTCOME") == "success"
          )
          passkey_associations_required = os.environ.get("DEPLOY_FRONTEND") == "true"
          passkey_associations_success = (
              not passkey_associations_required
              or os.environ.get("PASSKEY_ASSOCIATIONS_OUTCOME") == "success"
          )

          blocking: list[str] = []
          backend_failure = False
          frontend_failure = False

          required = parity_report.get("required") or {}
          missing_secrets = set(parity_report.get("missing_secrets") or [])
          backend_secret_names = set(
              required.get("backend", [])
              + required.get("gmail", [])
              + required.get("one_email", [])
              + required.get("voice", [])
              + required.get("plaid", [])
              + required.get("market", [])
          )
          frontend_secret_names = set(required.get("frontend", []))

          runtime_contract = parity_report.get("runtime_contract") or {}
          frontend_runtime_entries = runtime_contract.get("frontend") or []
          backend_runtime_entries = (
              (runtime_contract.get("backend") or [])
              + (runtime_contract.get("backend_gmail") or [])
              + (runtime_contract.get("backend_one_email") or [])
              + (runtime_contract.get("backend_voice") or [])
          )

          if not parity_success:
              append_unique(blocking, list(parity_report.get("classifications") or ["runtime_mount_missing"]))
          if missing_secrets & backend_secret_names:
              backend_failure = True
          if missing_secrets & frontend_secret_names:
              frontend_failure = True
          if has_runtime_failures(frontend_runtime_entries):
              frontend_failure = True
          if has_runtime_failures(backend_runtime_entries):
              backend_failure = True

          if not backend_provenance_success:
              append_unique(
                  blocking,
                  list(backend_provenance_report.get("classifications") or ["deploy_authority_drift"]),
              )
              backend_failure = True
          if not frontend_provenance_success:
              append_unique(
                  blocking,
                  list(frontend_provenance_report.get("classifications") or ["deploy_authority_drift"]),
              )
              frontend_failure = True

          semantic_failures = set(semantic_report.get("failures") or [])
          # Checks the verifier itself classified as an EXTERNAL provider outage.
          # They are reported and alerted on, but they do not block: a provider
          # being down is not evidence that this candidate is bad.
          semantic_degraded = sorted(semantic_report.get("degraded") or [])
          advisory_semantic_failures = sorted(
              item for item in semantic_failures if item.startswith("signed_in_routes:")
          )
          blocking_semantic_failures = {
              item for item in semantic_failures if not item.startswith("signed_in_routes:")
          }
          if not semantic_success:
              if not semantic_report_present:
                  append_unique(blocking, ["semantic_verifier_failed"])
              if blocking_semantic_failures:
                  append_unique(blocking, ["runtime_behavior_failed"])
              if "smoke_auth" in blocking_semantic_failures:
                  append_unique(blocking, ["smoke_overlay_dependency_leak"])
              if blocking_semantic_failures & {"backend_health", "smoke_auth", "gmail_status", "voice_capability", "voice_realtime_session"}:
                  backend_failure = True
              if "frontend_login" in blocking_semantic_failures:
                  frontend_failure = True

          if db_outcome == "failure":
              append_unique(blocking, ["db_contract_drift"])
              backend_failure = True

          # Advisory, like candidate_pkm_evaluator. This lane arms on ANY path
          # under lib/vault, components/vault or lib/testing changed since the
          # last successful deploy -- including one-line copy edits -- and it
          # then waits for a passphrase prompt the reviewer account cannot
          # raise, because that account has no vault on UAT. On 2026-08-18 a
          # six-line copy change armed it and blocked three consecutive
          # releases from three different branches. A reviewer-fixture gap must
          # not roll back a verified release; it is still reported, and the
          # harness reports an un-provisioned reviewer separately from a real
          # regression, so a broken prompt is still visible here as a warning.

          if not passkey_associations_success:
              append_unique(blocking, ["passkey_domain_association_failed"])
              frontend_failure = True

          blocking = list(dict.fromkeys(blocking))
          release_failed = bool(blocking)

          payload = {
              "status": "blocked" if release_failed else "healthy",
              "release_failed": release_failed,
              "blocking_classifications": blocking,
              "backend_failure": backend_failure,
              "frontend_failure": frontend_failure,
              "parity": {
                  "attempt_1": os.environ.get("PARITY_ATTEMPT_1", ""),
                  "attempt_2": os.environ.get("PARITY_ATTEMPT_2", ""),
                  "success": parity_success,
              },
              "provenance": {
                  "backend": {
                      "outcome": os.environ.get("BACKEND_PROVENANCE_OUTCOME", ""),
                      "success": backend_provenance_success,
                      "report": backend_provenance_report,
                  },
                  "frontend": {
                      "outcome": os.environ.get("FRONTEND_PROVENANCE_OUTCOME", ""),
                      "success": frontend_provenance_success,
                      "report": frontend_provenance_report,
                  },
              },
              "semantic": {
                  "required": semantic_required,
                  "attempt_1": os.environ.get("SEMANTIC_ATTEMPT_1", ""),
                  "attempt_2": os.environ.get("SEMANTIC_ATTEMPT_2", ""),
                  "success": semantic_success,
                  "report_present": semantic_report_present,
                  "failures": sorted(semantic_failures),
                  "blocking_failures": sorted(blocking_semantic_failures),
                  "advisory_failures": advisory_semantic_failures,
                  "degraded_capabilities": semantic_degraded,
              },
              "dependency_health": {
                  # A release can be simultaneously correct and not fully
                  # functional. Saying so is more useful than forcing that state
                  # into either "success" or "failure".
                  "degraded": bool(semantic_degraded),
                  "degraded_capabilities": semantic_degraded,
              },
              "db_contract": {
                  "outcome": db_outcome,
              },
              "reviewer_byok": {
                  "required": reviewer_byok_required,
                  "authority_ready": browser_authority_ready,
                  "skipped_reason": "" if browser_authority_ready or not reviewer_byok_required else "upstream_authority_failed",
                  "outcome": os.environ.get("REVIEWER_BYOK_OUTCOME", ""),
                  "success": reviewer_byok_success,
                  "advisory": True,
                  "warning": not reviewer_byok_success,
              },
              "passkey_domain_associations": {
                  "required": passkey_associations_required,
                  "outcome": os.environ.get("PASSKEY_ASSOCIATIONS_OUTCOME", ""),
                  "success": passkey_associations_success,
              },
              "candidate_pkm_evaluator": {
                  "required": int(os.environ.get("PKM_EVALUATOR_RUNS") or "0") != 0,
                  "outcome": os.environ.get("PKM_EVALUATOR_OUTCOME", ""),
                  "advisory": True,
                  "warning": os.environ.get("PKM_EVALUATOR_OUTCOME") == "failure",
              },
              "verification_plan": {
                  "reason": os.environ.get("VERIFICATION_PLAN_REASON", ""),
                  "pkm_evaluator_runs": int(os.environ.get("PKM_EVALUATOR_RUNS") or "0"),
              },
          }

          Path("/tmp/uat-release-classification.json").write_text(
              json.dumps(payload, indent=2), encoding="utf-8"
          )

          output_path = Path(os.environ["GITHUB_OUTPUT"])
          with output_path.open("a", encoding="utf-8") as handle:
              handle.write(f"release_failed={'true' if release_failed else 'false'}\n")
              handle.write(f"backend_failure={'true' if backend_failure else 'false'}\n")
              handle.write(f"frontend_failure={'true' if frontend_failure else 'false'}\n")
              handle.write(f"blocking_classifications={','.join(blocking)}\n")
              handle.write(f"parity_success={'true' if parity_success else 'false'}\n")
              handle.write(f"provenance_success={'true' if backend_provenance_success and frontend_provenance_success else 'false'}\n")
              handle.write(f"semantic_success={'true' if semantic_success else 'false'}\n")
              handle.write(f"reviewer_byok_success={'true' if reviewer_byok_success else 'false'}\n")
              handle.write(f"passkey_associations_success={'true' if passkey_associations_success else 'false'}\n")
          PY

      - name: Roll back backend revision
        id: rollback-backend
        if: always() && steps.classify-uat-release.outputs.release_failed == 'true' && steps.classify-uat-release.outputs.backend_failure == 'true' && steps.scope.outputs.deploy_backend == 'true' && steps.rollback-targets.outputs.backend_revision != ''
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/cloudrun-rollback.sh "${{ env.BACKEND_SERVICE }}" "${{ env.GCP_REGION }}" "${{ steps.rollback-targets.outputs.backend_revision }}"

      - name: Roll back frontend revision
        id: rollback-frontend
        if: always() && steps.classify-uat-release.outputs.release_failed == 'true' && steps.classify-uat-release.outputs.frontend_failure == 'true' && steps.scope.outputs.deploy_frontend == 'true' && steps.rollback-targets.outputs.frontend_revision != ''
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/cloudrun-rollback.sh "${{ env.FRONTEND_SERVICE }}" "${{ env.GCP_REGION }}" "${{ steps.rollback-targets.outputs.frontend_revision }}"

      - name: Resolve final Cloud Run state
        if: always()
        id: final-state
        shell: bash
        run: |
          set -euo pipefail
          backend_revision="$(gcloud run services describe "${{ env.BACKEND_SERVICE }}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --region="${{ env.GCP_REGION }}" \
            --format='value(status.traffic[0].revisionName)' 2>/dev/null || true)"
          backend_url="$(gcloud run services describe "${{ env.BACKEND_SERVICE }}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --region="${{ env.GCP_REGION }}" \
            --format='value(status.url)' 2>/dev/null || true)"
          frontend_revision="$(gcloud run services describe "${{ env.FRONTEND_SERVICE }}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --region="${{ env.GCP_REGION }}" \
            --format='value(status.traffic[0].revisionName)' 2>/dev/null || true)"
          frontend_url="$(gcloud run services describe "${{ env.FRONTEND_SERVICE }}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --region="${{ env.GCP_REGION }}" \
            --format='value(status.url)' 2>/dev/null || true)"
          echo "backend_revision=${backend_revision}" >> "$GITHUB_OUTPUT"
          echo "backend_url=${backend_url}" >> "$GITHUB_OUTPUT"
          echo "frontend_revision=${frontend_revision}" >> "$GITHUB_OUTPUT"
          echo "frontend_url=${frontend_url}" >> "$GITHUB_OUTPUT"

      - name: Write UAT release status artifact
        if: always()
        shell: bash
        env:
          VERIFICATION_PLAN_LANES: ${{ steps.verification-plan.outputs.lanes }}
        run: |
          set -euo pipefail
          BACKEND_ROLLBACK_REQUIRED=false
          FRONTEND_ROLLBACK_REQUIRED=false
          BACKEND_ROLLBACK_DONE=true
          FRONTEND_ROLLBACK_DONE=true

          if [ "${{ steps.classify-uat-release.outputs.release_failed }}" != "true" ]; then
            STATUS="healthy"
          else
            if [ "${{ steps.classify-uat-release.outputs.backend_failure }}" = "true" ] && [ "${{ steps.scope.outputs.deploy_backend }}" = "true" ] && [ "${{ steps.rollback-targets.outputs.backend_revision }}" != "" ]; then
              BACKEND_ROLLBACK_REQUIRED=true
              if [ "${{ steps.rollback-backend.outcome }}" != "success" ]; then
                BACKEND_ROLLBACK_DONE=false
              fi
            fi
            if [ "${{ steps.classify-uat-release.outputs.frontend_failure }}" = "true" ] && [ "${{ steps.scope.outputs.deploy_frontend }}" = "true" ] && [ "${{ steps.rollback-targets.outputs.frontend_revision }}" != "" ]; then
              FRONTEND_ROLLBACK_REQUIRED=true
              if [ "${{ steps.rollback-frontend.outcome }}" != "success" ]; then
                FRONTEND_ROLLBACK_DONE=false
              fi
            fi

            if { [ "$BACKEND_ROLLBACK_REQUIRED" = true ] || [ "$FRONTEND_ROLLBACK_REQUIRED" = true ]; } && [ "$BACKEND_ROLLBACK_DONE" = true ] && [ "$FRONTEND_ROLLBACK_DONE" = true ]; then
              STATUS="rolled_back"
            else
              STATUS="blocked"
            fi
          fi

          export STATUS
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "status": os.environ["STATUS"],
              "sha": "${{ steps.resolve-sha.outputs.sha }}",
              "scope": "${{ steps.scope.outputs.scope }}",
              "app_frontend_origin": "${{ env.APP_FRONTEND_ORIGIN }}",
              "predeploy": {
                  "backend_revision": "${{ steps.predeploy-state.outputs.backend_revision }}",
                  "backend_url": "${{ steps.predeploy-state.outputs.backend_url }}",
                  "frontend_revision": "${{ steps.predeploy-state.outputs.frontend_revision }}",
                  "frontend_url": "${{ steps.predeploy-state.outputs.frontend_url }}",
              },
              "current": {
                  "backend_candidate_revision": "${{ steps.candidate-state.outputs.backend_revision }}",
                  "backend_revision": "${{ steps.current-state.outputs.backend_revision }}",
                  "backend_url": "${{ steps.current-state.outputs.backend_url }}",
                  "frontend_candidate_revision": "${{ steps.candidate-state.outputs.frontend_revision }}",
                  "frontend_revision": "${{ steps.current-state.outputs.frontend_revision }}",
                  "frontend_url": "${{ steps.current-state.outputs.frontend_url }}",
              },
              "final": {
                  "backend_revision": "${{ steps.final-state.outputs.backend_revision }}",
                  "backend_url": "${{ steps.final-state.outputs.backend_url }}",
                  "frontend_revision": "${{ steps.final-state.outputs.frontend_revision }}",
                  "frontend_url": "${{ steps.final-state.outputs.frontend_url }}",
              },
              "verification": {
                  "plan_reason": "${{ steps.verification-plan.outputs.reason }}",
                  "lanes": json.loads(os.environ.get("VERIFICATION_PLAN_LANES") or "{}"),
                  "pkm_evaluator_runs": "${{ steps.verification-plan.outputs.pkm_evaluator_runs }}",
                  "pkm_upgrade_gate_required": "${{ steps.verification-plan.outputs.run_pkm_upgrade_gate }}",
                  "reviewer_byok_required": "${{ steps.verification-plan.outputs.run_reviewer_byok }}",
                  "parity_attempt_1": "${{ steps.verify-parity-1.outcome }}",
                  "parity_attempt_2": "${{ steps.verify-parity-2.outcome }}",
                  "parity_success": "${{ steps.classify-uat-release.outputs.parity_success }}",
                  "backend_provenance": "${{ steps.verify-backend-provenance.outcome }}",
                  "frontend_provenance": "${{ steps.verify-frontend-provenance.outcome }}",
                  "provenance_success": "${{ steps.classify-uat-release.outputs.provenance_success }}",
                  "attempt_1": "${{ steps.verify-uat-1.outcome }}",
                  "attempt_2": "${{ steps.verify-uat-2.outcome }}",
                  "semantic_success": "${{ steps.classify-uat-release.outputs.semantic_success }}",
                  "db_contract": "${{ steps.postdeploy-db-gate.outcome }}",
                  "reviewer_byok": "${{ steps.verify-reviewer-byok.outcome }}",
                  "blocking_classifications": "${{ steps.classify-uat-release.outputs.blocking_classifications }}",
              },
              "rollback_targets": {
                  "backend_revision": "${{ steps.rollback-targets.outputs.backend_revision }}",
                  "frontend_revision": "${{ steps.rollback-targets.outputs.frontend_revision }}",
              },
              "timing_seconds": {
                  "backend_cloud_build": "${{ steps.deploy-backend.outputs.duration_seconds || '0' }}",
                  "frontend_cloud_build": "${{ steps.deploy-frontend.outputs.duration_seconds || '0' }}",
              },
          }
          Path("/tmp/uat-release-status.json").write_text(json.dumps(payload, indent=2), encoding="utf-8")
          PY

      - name: Upload UAT deploy artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: uat-release-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            /tmp/uat-runtime-secret-sync.json
            /tmp/uat-frontend-runtime-secret-sync.json
            /tmp/uat-runtime-parity-attempt-1.json
            /tmp/uat-runtime-parity-attempt-2.json
            /tmp/uat-backend-provenance.json
            /tmp/uat-frontend-provenance.json
            /tmp/uat-db-migration-guard-predeploy.json
            /tmp/uat-db-migration-guard-postdeploy.json
            /tmp/cloud-sql-proxy-uat.log
            /tmp/cloud-sql-proxy-uat-postdeploy.log
            /tmp/uat-release-verify-attempt-1.json
            /tmp/uat-release-verify-attempt-2.json
            /tmp/uat-reviewer-byok.log
            /tmp/uat-release-classification.json
            /tmp/uat-release-status.json

      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            total_seconds=$(( $(date +%s) - ${{ steps.timing-start.outputs.epoch || '0' }} ))
            if [ "${{ steps.timing-start.outputs.epoch || '' }}" = "" ]; then
              total_seconds=0
            fi
            backend_build_seconds="${{ steps.deploy-backend.outputs.duration_seconds || '0' }}"
            frontend_build_seconds="${{ steps.deploy-frontend.outputs.duration_seconds || '0' }}"
            build_seconds=$(( backend_build_seconds + frontend_build_seconds ))
            non_build_seconds=$(( total_seconds - build_seconds ))
            if [ "$non_build_seconds" -lt 0 ]; then
              non_build_seconds=0
            fi
            echo "## UAT Release"
            echo ""
            echo "- SHA: \`${{ steps.resolve-sha.outputs.sha }}\`"
            echo "- Requested scope: \`${{ github.event.inputs.scope }}\`"
            echo "- Scope: \`${{ steps.scope.outputs.scope }}\`"
            echo "- Scope reason: \`${{ steps.scope.outputs.reason }}\`"
            echo "- Verification plan: \`${{ steps.verification-plan.outputs.reason }}\`"
            echo "- Verification lanes: \`${{ steps.verification-plan.outputs.lanes }}\`"
            echo "- PKM evaluator runs: \`${{ steps.verification-plan.outputs.pkm_evaluator_runs }}\`"
            echo "- Candidate PKM evaluator outcome (advisory): \`${{ steps.verify-candidate-pkm-evaluator.outputs.outcome }}\`"
            echo "- PKM upgrade gate required: \`${{ steps.verification-plan.outputs.run_pkm_upgrade_gate }}\`"
            echo "- Reviewer BYOK required: \`${{ steps.verification-plan.outputs.run_reviewer_byok }}\`"
            echo "- Backend deployed SHA before run: \`${{ steps.predeploy-state.outputs.backend_sha || 'unknown' }}\`"
            echo "- Frontend deployed SHA before run: \`${{ steps.predeploy-state.outputs.frontend_sha || 'unknown' }}\`"
            echo "- Status: \`$(python3 -c "import json; from pathlib import Path; print(json.loads(Path('/tmp/uat-release-status.json').read_text(encoding='utf-8'))['status'])")\`"
            echo "- Blocking classifications: \`${{ steps.classify-uat-release.outputs.blocking_classifications || 'none' }}\`"
            # Degradation is reported next to the status, not buried in the JSON.
            # A release that deployed correctly while a provider was down must be
            # readable as exactly that -- neither a clean success nor a failure.
            degraded_capabilities="$(python3 -c "import json; from pathlib import Path; print(','.join(json.loads(Path('/tmp/uat-release-status.json').read_text(encoding='utf-8')).get('dependency_health', {}).get('degraded_capabilities') or []))" 2>/dev/null || true)"
            if [[ -n "${degraded_capabilities}" ]]; then
              echo "- **Dependency health: DEGRADED**"
              echo "- Degraded capabilities: \`${degraded_capabilities}\`"
              echo "  > The application deployed correctly. One or more external"
              echo "  > providers are unavailable, so these capabilities will not"
              echo "  > work until the provider recovers. This is not a code defect."
            else
              echo "- Dependency health: \`healthy\`"
            fi
            echo "- Backend URL: \`${{ steps.final-state.outputs.backend_url }}\`"
            echo "- Frontend URL: \`${{ env.APP_FRONTEND_ORIGIN }}\`"
            echo "- Backend revision: \`${{ steps.final-state.outputs.backend_revision }}\`"
            echo "- Frontend revision: \`${{ steps.final-state.outputs.frontend_revision }}\`"
            echo "- Parity attempt 1: \`${{ steps.verify-parity-1.outcome }}\`"
            echo "- Parity attempt 2: \`${{ steps.verify-parity-2.outcome }}\`"
            echo "- Backend provenance: \`${{ steps.verify-backend-provenance.outcome }}\`"
            echo "- Frontend provenance: \`${{ steps.verify-frontend-provenance.outcome }}\`"
            echo "- Post-deploy DB contract: \`${{ steps.postdeploy-db-gate.outcome }}\`"
            echo "- Verify attempt 1: \`${{ steps.verify-uat-1.outcome }}\`"
            echo "- Verify attempt 2: \`${{ steps.verify-uat-2.outcome }}\`"
            echo "- Backend rollback: \`${{ steps.rollback-backend.outcome }}\`"
            echo "- Frontend rollback: \`${{ steps.rollback-frontend.outcome }}\`"
            echo ""
            echo "### Deploy Timing"
            echo ""
            echo "- Total job time so far: \`${total_seconds}s\`"
            echo "- Backend Cloud Build: \`${backend_build_seconds}s\`"
            echo "- Frontend Cloud Build: \`${frontend_build_seconds}s\`"
            echo "- Non-build gates and verification: \`${non_build_seconds}s\`"
            echo ""
            echo "### Auto Scope Evidence"
            echo ""
            echo "- Backend changed files: \`${{ steps.scope.outputs.backend_changed_files || 'none' }}\`"
            echo "- Frontend changed files: \`${{ steps.scope.outputs.frontend_changed_files || 'none' }}\`"
            echo "- Shared changed files: \`${{ steps.scope.outputs.shared_changed_files || 'none' }}\`"
            echo "- Neutral changed files: \`${{ steps.scope.outputs.neutral_changed_files || 'none' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tag this release as last known good
        id: tag-last-known-good
        if: always()
        # Advisory annotation, not a release-health signal: the deploy above
        # already succeeded and classified healthy by this point. A tagging
        # failure (e.g. a transient push conflict) must never turn a healthy
        # release red or trigger the rollback investigation that implies.
        continue-on-error: true
        shell: bash
        env:
          ENVIRONMENT: uat
          SHA: ${{ steps.resolve-sha.outputs.sha }}
          BACKEND_REVISION: ${{ steps.final-state.outputs.backend_revision }}
          BACKEND_SERVICE_URL: ${{ steps.final-state.outputs.backend_url }}
          FRONTEND_REVISION: ${{ steps.final-state.outputs.frontend_revision }}
          FRONTEND_SERVICE_URL: ${{ steps.final-state.outputs.frontend_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          STATUS="$(python3 -c "import json; from pathlib import Path; print(json.loads(Path('/tmp/uat-release-status.json').read_text(encoding='utf-8'))['status'])")"
          if [ "$STATUS" != "healthy" ]; then
            echo "[tag-last-known-good] Release status is '$STATUS', not 'healthy' — not tagging."
            exit 0
          fi
          bash scripts/ci/tag-last-known-good.sh

      - name: Fail workflow when UAT release did not end healthy
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(python3 -c "import json; from pathlib import Path; print(json.loads(Path('/tmp/uat-release-status.json').read_text(encoding='utf-8'))['status'])")"
          if [ "$STATUS" != "healthy" ]; then
            echo "UAT release finished with status: $STATUS"
            exit 1
          fi
