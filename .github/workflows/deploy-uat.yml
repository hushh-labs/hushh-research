          SUBSTITUTIONS="_BACKEND_SERVICE=${{ env.BACKEND_SERVICE }}##_REGION=${{ env.GCP_REGION }}##_CLOUDSQL_INSTANCES=${{ env.UAT_CLOUDSQL_INSTANCE }}##_PLAID_CLIENT_ID_SECRET=PLAID_CLIENT_ID##_PLAID_SECRET_SECRET=PLAID_SECRET##_PLAID_ACCESS_TOKEN_KEY_SECRET=PLAID_ACCESS_TOKEN_KEY##_FINNHUB_API_KEY_SECRET=FINNHUB_API_KEY##_PMP_API_KEY_SECRET=PMP_API_KEY##_NEWSAPI_KEY_SECRET=NEWSAPI_KEY##_GMAIL_OAUTH_CLIENT_ID_SECRET=GMAIL_OAUTH_CLIENT_ID##_GMAIL_OAUTH_CLIENT_SECRET_SECRET=GMAIL_OAUTH_CLIENT_SECRET##_GMAIL_OAUTH_REDIRECT_URI_SECRET=GMAIL_OAUTH_REDIRECT_URI##_GMAIL_OAUTH_TOKEN_KEY_SECRET=GMAIL_OAUTH_TOKEN_KEY##_GOOGLE_OAUTH_CLIENT_ID_SECRET=GOOGLE_OAUTH_CLIENT_ID##_GOOGLE_OAUTH_CLIENT_SECRET_SECRET=GOOGLE_OAUTH_CLIENT_SECRET##_GOOGLE_OAUTH_REDIRECT_URI_SECRET=GOOGLE_OAUTH_REDIRECT_URI##_GOOGLE_OAUTH_TOKEN_KEY_SECRET=GOOGLE_OAUTH_TOKEN_KEY##_OPENAI_API_KEY_SECRET=OPENAI_API_KEY##_GOOGLE_MAPS_API_KEY_SECRET=GOOGLE_MAPS_API_KEY##_HUSHH_DEVELOPER_TOKEN_SECRET=HUSHH_DEVELOPER_TOKEN##_HUSHH_TECH_LAUNCH_PEPPER_SECRET=HUSSH_TECH_LAUNCH_PEPPER##_RATE_LIMIT_STORAGE_URI_SECRET=RATE_LIMIT_STORAGE_URI##_HUSHH_UAT_PHONE_TEST_NUMBERS_SECRET=HUSHH_UAT_PHONE_TEST_NUMBERS##_HUSHH_UAT_PHONE_TEST_CODE_SECRET=HUSHH_UAT_PHONE_TEST_CODE##_REVIEWER_UID_SECRET=REVIEWER_UID##_REVIEWER_VAULT_PASSPHRASE_SECRET=REVIEWER_VAULT_PASSPHRASE##_REVIEWER_COUNTERPART_UID_SECRET=REVIEWER_COUNTERPART_UID##_REVIEWER_COUNTERPART_VAULT_PASSPHRASE_SECRET=REVIEWER_COUNTERPART_VAULT_PASSPHRASE##_RIA_INTELLIGENCE_VERIFY_BASE_URL_SECRET=RIA_INTELLIGENCE_VERIFY_BASE_URL##_ONE_EMAIL_WATCH_RENEW_TOKEN_SECRET=ONE_EMAIL_WATCH_RENEW_TOKEN##_ONE_EMAIL_ADDRESS=one@hushh.ai##_ONE_EMAIL_DELEGATED_USER=one@hushh.ai##_ONE_EMAIL_PUBSUB_TOPIC=projects/hushh-pda/topics/one-email-kyc-uat##_ONE_EMAIL_WEBHOOK_AUDIENCE=https://consent-protocol-f2gsa4kfsq-uc.a.run.app/api/one/email/webhook##_ONE_EMAIL_WEBHOOK_SERVICE_ACCOUNT_EMAIL=one-email-pubsub-push@hushh-pda.iam.gserviceaccount.com##_ONE_EMAIL_WEBHOOK_AUTH_ENABLED=true##_ONE_EMAIL_WATCH_RENEW_AUTH_ENABLED=true##_ONE_EMAIL_KYC_DEFAULT_SCOPE=attr.identity.*##_ONE_EMAIL_KYC_STRICT_CLIENT_ZK_ENABLED=true##_ONE_WALLET_CARD_ENABLED=true##_ONE_VOICE_LIVE_ENABLED=true##_ONE_VOICE_CALENDAR_NARRATION_ENABLED=true##_WALLET_PASS_PROVIDER=service##_WALLET_API_KEY_SECRET=WALLET_API_KEY##_APP_REVIEW_MODE=true##_CONSENT_WEB_FALLBACK_ENABLED=false##_CONSENT_SSE_ENABLED=false##_DB_POOL_MIN_SIZE=1##_DB_POOL_MAX_SIZE=4##_DB_SQLALCHEMY_POOL_SIZE=3##_DB_SQLALCHEMY_MAX_OVERFLOW=0##_CLOUD_RUN_MIN_INSTANCES=2##_CLOUD_RUN_MAX_INSTANCES=5##_CLOUD_RUN_CPU=2##_CLOUD_RUN_CONCURRENCY=20##_CLOUD_RUN_SCALING_CONCURRENCY_TARGET=0.20##_CLOUD_RUN_NO_TRAFFIC=true##_IMAGE_TAG=uat-${{ steps.resolve-sha.outputs.sha }}##_DEPLOY_ENV=uat##_DEPLOY_SOURCE=deploy-uat##_DEPLOY_SHA=${{ steps.resolve-sha.outputs.sha }}##_GITHUB_RUN_ID=${{ github.run_id }}"
          if grep -Fq '${_PROTECTED_DOCUMENT_DELIVERY_ENABLED}' deploy/backend.cloudbuild.yaml; then
            SUBSTITUTIONS="${SUBSTITUTIONS}##_PROTECTED_DOCUMENT_DELIVERY_ENABLED=${{ steps.document-mode.outputs.enabled || 'false' }}"
          fi
          SUBSTITUTIONS="${SUBSTITUTIONS}##_RUNTIME_SERVICE_ACCOUNT=${{ env.RUNTIME_SERVICE_ACCOUNT }}"
          SUBSTITUTIONS="${SUBSTITUTIONS}##_CONSENT_API_PUBLIC_ORIGIN=${{ env.CONSENT_API_PUBLIC_ORIGIN }}"
          SUBSTITUTIONS="${SUBSTITUTIONS}##_DIRECT_MESSAGE_ENCRYPTION_KEY_V1_SECRET=DIRECT_MESSAGE_ENCRYPTION_KEY_V1"
          # Older deployment SHAs do not declare this substitution.
          if grep -q '^[[:space:]]*_WALLET_CARD_ACCESS_ENABLED:' deploy/backend.cloudbuild.yaml; then
            SUBSTITUTIONS="${SUBSTITUTIONS}##_WALLET_CARD_ACCESS_ENABLED=${{ vars.WALLET_CARD_ACCESS_UAT_ENABLED || 'true' }}"
          fi
          # Older deployment SHAs do not declare these. The secrets are bound by
          # deploy/sso/bind_workos.sh only if they exist in the deploy project.
          if grep -q '^[[:space:]]*_WORKOS_SSO_ENABLED:' deploy/backend.cloudbuild.yaml; then
            SUBSTITUTIONS="${SUBSTITUTIONS}##_WORKOS_SSO_ENABLED=${{ vars.WORKOS_SSO_UAT_ENABLED || 'false' }}##_WORKOS_REDIRECT_URI=${{ env.APP_FRONTEND_ORIGIN }}/login"
          fi
          # Every hostname UAT is served on (single source: the passkey alias list), so SSO can
          # return to the one the person started on.
          if grep -q '^[[:space:]]*_WORKOS_REDIRECT_ORIGINS:' deploy/backend.cloudbuild.yaml; then
            WORKOS_ORIGINS="$(python3 -c "import json;print(','.join('https://'+h for h in json.load(open('hushh-webapp/lib/vault/passkey-domain-aliases.json'))['uat']))")"
            SUBSTITUTIONS="${SUBSTITUTIONS}##_WORKOS_REDIRECT_ORIGINS=${WORKOS_ORIGINS}"
          fi
          SUBSTITUTIONS="${SUBSTITUTIONS}##_GOOGLE_DRIVE_OAUTH_CLIENT_ID_SECRET=GOOGLE_DRIVE_OAUTH_CLIENT_ID##_GOOGLE_DRIVE_OAUTH_CLIENT_SECRET_SECRET=GOOGLE_DRIVE_OAUTH_CLIENT_SECRET##_GOOGLE_DRIVE_PICKER_API_KEY_SECRET=GOOGLE_DRIVE_PICKER_API_KEY##_EXTERNAL_CONNECTOR_CREDENTIAL_KEY_SECRET=EXTERNAL_CONNECTOR_CREDENTIAL_KEY##_DRIVE_DOCUMENT_KEY_V1_SECRET=DRIVE_DOCUMENT_KEY_V1##_DRIVE_SHARING_KEY_V1_SECRET=DRIVE_SHARING_KEY_V1"
          # Curated connector OAuth client secrets are derived from the checked-in
          # manifests by the "Resolve curated connector secrets" step; empty (the
          # rollout is off) keeps them all absent.
          SUBSTITUTIONS="${SUBSTITUTIONS}##_CURATED_CONNECTOR_SECRETS=${{ steps.curated-secrets.outputs.names }}"
          # Keep credentials bound after the rollout switch turns off so existing
          # paid-required requests can finish Checkout and webhook settlement.
          # API and worker share explicit payment and separate Connect modes.
          SUBSTITUTIONS="${SUBSTITUTIONS}##_DRIVE_REQUEST_PAYMENTS_ENABLED=${{ vars.DRIVE_REQUEST_PAYMENTS_UAT_ENABLED || 'false' }}##_DRIVE_REQUEST_OWNER_PAYOUTS_ENABLED=${{ vars.DRIVE_REQUEST_OWNER_PAYOUTS_UAT_ENABLED || 'false' }}##_STRIPE_MODE=${STRIPE_UAT_MODE}##_STRIPE_SECRET_KEY_SECRET=${STRIPE_UAT_KEY_SECRET}##_STRIPE_WEBHOOK_SECRET_SECRET=${STRIPE_UAT_WEBHOOK_SECRET}##_STRIPE_CONNECT_WEBHOOK_SECRET_SECRET=${STRIPE_UAT_CONNECT_SECRET}"
          ANSWER_STRIPE_MODE="${{ vars.PKM_ANSWER_STRIPE_UAT_MODE || 'test' }}"
          case "$ANSWER_STRIPE_MODE" in
            test) ANSWER_KEY_SECRET=STRIPE_SECRET_KEY; ANSWER_WEBHOOK_SECRET=STRIPE_WEBHOOK_SECRET ;;
            live) ANSWER_KEY_SECRET=STRIPE_LIVE_SECRET_KEY; ANSWER_WEBHOOK_SECRET=STRIPE_LIVE_WEBHOOK_SECRET ;;
            *) echo "Invalid answer Stripe mode" >&2; exit 1 ;;
          esac
          SUBSTITUTIONS="${SUBSTITUTIONS}##_PKM_ANSWER_REQUESTS_ENABLED=${{ vars.PKM_ANSWER_REQUESTS_UAT_ENABLED || 'true' }}##_PKM_ANSWER_PAYMENTS_ENABLED=${{ vars.PKM_ANSWER_PAYMENTS_UAT_ENABLED || 'false' }}##_PKM_ANSWER_COMPOSER_ENABLED=${{ vars.PKM_ANSWER_COMPOSER_UAT_ENABLED || 'false' }}##_PKM_ANSWER_LIVE_PROVIDER_REVIEWED=${{ vars.PKM_ANSWER_LIVE_PROVIDER_UAT_REVIEWED || 'false' }}##_PKM_ANSWER_STRIPE_MODE=${ANSWER_STRIPE_MODE}##_PKM_ANSWER_STRIPE_SECRET_KEY_SECRET=${ANSWER_KEY_SECRET}##_PKM_ANSWER_STRIPE_WEBHOOK_SECRET_SECRET=${ANSWER_WEBHOOK_SECRET}##_PKM_ANSWER_STRIPE_TEST_SECRET_KEY_SECRET=${{ vars.PKM_ANSWER_STRIPE_TEST_SECRET_KEY_UAT_SECRET || 'STRIPE_SECRET_KEY' }}##_PKM_ANSWER_STRIPE_TEST_WEBHOOK_SECRET_SECRET=${{ vars.PKM_ANSWER_STRIPE_TEST_WEBHOOK_SECRET_UAT_SECRET || 'STRIPE_WEBHOOK_SECRET' }}##_PKM_ANSWER_STRIPE_LIVE_SECRET_KEY_SECRET=${{ vars.PKM_ANSWER_STRIPE_LIVE_SECRET_KEY_UAT_SECRET || '' }}##_PKM_ANSWER_STRIPE_LIVE_WEBHOOK_SECRET_SECRET=${{ vars.PKM_ANSWER_STRIPE_LIVE_WEBHOOK_SECRET_UAT_SECRET || '' }}##_ANSWER_WORK_DRAIN_ENABLED=${{ vars.ANSWER_WORK_DRAIN_UAT_ENABLED || 'false' }}##_ANSWER_WORK_DRAIN_AUDIENCE=https://api.uat.hushh.ai"
          SUBSTITUTIONS="${SUBSTITUTIONS}##_DRIVE_REQUEST_HASHCOINS_ENABLED=${DRIVE_REQUEST_HASHCOINS_UAT_ENABLED}##_DRIVE_REQUEST_HASHCOINS_LIVE_ENABLED=${DRIVE_REQUEST_HASHCOINS_LIVE_UAT_ENABLED}##_STRIPE_CONNECT_MODE=${STRIPE_CONNECT_UAT_MODE}##_STRIPE_CONNECT_SECRET_KEY_SECRET=${STRIPE_UAT_CONNECT_KEY_SECRET}##_STRIPE_CONNECT_TEST_WEBHOOK_SECRET_SECRET=${STRIPE_UAT_CONNECT_TEST_WEBHOOK_SECRET}"
          SUBSTITUTIONS="${SUBSTITUTIONS}##_ACCOUNT_DELETION_CLEANUP_AUDIENCE=${{ env.CONSENT_API_PUBLIC_ORIGIN }}##_ACCOUNT_DELETION_CLEANUP_SERVICE_ACCOUNT_EMAIL=${{ env.ACCOUNT_DELETION_SCHEDULER_SERVICE_ACCOUNT_ID }}@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com"
          SUBSTITUTIONS="${SUBSTITUTIONS}##_GMAIL_PERSONAL_INFORMATION_REQUEST_MONITOR_AUTH_ENABLED=true##_GMAIL_PERSONAL_INFORMATION_REQUEST_MONITOR_AUDIENCE=${{ env.CONSENT_API_PUBLIC_ORIGIN }}##_GMAIL_PERSONAL_INFORMATION_REQUEST_MONITOR_SERVICE_ACCOUNT_EMAIL=${{ env.GMAIL_PERSONAL_INFORMATION_REQUEST_MONITOR_SCHEDULER_SERVICE_ACCOUNT_ID }}@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com"
          if grep -q '^[[:space:]]*_DRIVE_REQUEST_SEMANTIC_SEARCH_ENABLED:' deploy/backend.cloudbuild.yaml; then
            SUBSTITUTIONS="${SUBSTITUTIONS}##_DRIVE_REQUEST_SEMANTIC_SEARCH_ENABLED=${DRIVE_REQUEST_SEMANTIC_SEARCH_UAT_ENABLED}"
          fi
          if grep -q '^[[:space:]]*_DRIVE_REQUEST_SEMANTIC_MODEL_PROVIDER:' deploy/backend.cloudbuild.yaml; then
            case "${DRIVE_REQUEST_SEMANTIC_MODEL_PROVIDER_UAT}" in
              gemini|azure_openai) ;;
              *) echo "Invalid Documents semantic provider" >&2; exit 1 ;;
            esac
            SUBSTITUTIONS="${SUBSTITUTIONS}##_DRIVE_REQUEST_SEMANTIC_MODEL_PROVIDER=${DRIVE_REQUEST_SEMANTIC_MODEL_PROVIDER_UAT}"
          fi
          SUBSTITUTIONS="${SUBSTITUTIONS}##_DRIVE_WORK_DRAIN_ENABLED=${{ inputs.preserve_paused_drive_worker && 'false' || 'true' }}##_DRIVE_WORK_DRAIN_SCHEDULER_PROJECT_ID=${{ env.GCP_PROJECT_ID }}##_DRIVE_WORK_DRAIN_SCHEDULER_SERVICE_ACCOUNT_EMAIL=drive-work-drain-sched@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com##_DRIVE_WORK_DRAIN_SCHEDULER_AUDIENCE=${{ env.CONSENT_API_PUBLIC_ORIGIN }}"
          # The serving two-worker runtime held 86.9–87.85% of 4Gi during the
          # 2026-10-13 read-only 5 RPS stage. Keep CPU/pools/instances unchanged;
          # 6Gi gives that measured steady working set its required headroom.
          SUBSTITUTIONS="${SUBSTITUTIONS}##_CLOUD_RUN_MEMORY=6Gi"
          SUBSTITUTIONS="${SUBSTITUTIONS}##_SKIP_IMAGE_BUILD=true##_IMAGE_REFERENCE=${{ steps.build-backend-image.outputs.image_reference }}##_CLOUD_RUN_TAG=account-deletion-${{ github.run_id }}"
          SUBSTITUTIONS="${SUBSTITUTIONS}##_VPC_CONNECTOR=${{ vars.UAT_VPC_CONNECTOR || '' }}"
          # The packaged profile owns every managed AI surface.
          SUBSTITUTIONS="${SUBSTITUTIONS}##$(python3 scripts/ops/managed_ai_config.py --environment uat --format substitutions)"
          # Durable Kai analyze-run store ON in UAT: exercises the migration-125
          # persist/replay path against real Cloud SQL before prod flips it on.
          SUBSTITUTIONS="${SUBSTITUTIONS}##_KAI_ANALYZE_DURABLE_RUN_STORE=true"
          verify_managed_vertex_runtime=true
          if [ "${{ steps.verification-plan.outputs.pkm_evaluator_runs }}" != "0" ]; then
            verify_managed_vertex_runtime=true
          fi
          SUBSTITUTIONS="${SUBSTITUTIONS}##_VERIFY_MANAGED_VERTEX_RUNTIME=${verify_managed_vertex_runtime}"
          SUBSTITUTIONS="${SUBSTITUTIONS}##_SKIP_MANAGED_VERTEX_RUNTIME_FOR_RELEASE=${{ inputs.skip_managed_vertex_probe_once }}"
          # RIA claim-by-phone: identity resolver + the UAT demo passcode
          # allowlist (fixed code, no SMS to real firm lines). UAT-only.
          SUBSTITUTIONS="${SUBSTITUTIONS}##_RIA_IDENTITY_BASE_URL_SECRET=RIA_IDENTITY_BASE_URL##_RIA_IDENTITY_API_KEY_SECRET=RIA_IDENTITY_API_KEY##_RIA_CLAIM_TEST_NUMBERS_SECRET=RIA_CLAIM_TEST_NUMBERS##_RIA_CLAIM_TEST_CODE_SECRET=RIA_CLAIM_TEST_CODE##_RIA_CLAIM_TEST_EMAILS_SECRET=RIA_CLAIM_TEST_EMAILS##_INTELLIGENCE_API_BASE_URL_SECRET=INTELLIGENCE_API_BASE_URL##_INTELLIGENCE_API_KEY_SECRET=INTELLIGENCE_API_KEY##_SUPPORT_EMAIL_TEST_TO_SECRET=SUPPORT_EMAIL_TEST_TO##_SUPPORT_EMAIL_MODE_SECRET=SUPPORT_EMAIL_MODE##_SUPPORT_EMAIL_DELEGATED_USER_SECRET=SUPPORT_EMAIL_DELEGATED_USER##_SUPPORT_EMAIL_FROM_SECRET=SUPPORT_EMAIL_FROM##_GOOGLE_SERVICE_ACCOUNT_EMAIL_SECRET=GOOGLE_SERVICE_ACCOUNT_EMAIL##_GOOGLE_PRIVATE_KEY_SECRET=GOOGLE_PRIVATE_KEY"
          # Migrations have passed. The private candidate can now warm alongside
          # both probes; the same build's required aggregate still joins all
          # three before this step or any later promotion can succeed.
          config_args=(--output /tmp/uat-backend-parallel.cloudbuild.json)
          if [[ "$FRONTEND_PARALLEL" == "true" ]]; then
            config_args+=(--frontend-source deploy/frontend.cloudbuild.yaml
              --backend-substitutions "$SUBSTITUTIONS")
            if [[ -n "$FRONTEND_PENDING_IMAGE_BUILD_ID" ]]; then
              config_args+=(--frontend-image-build-id "$FRONTEND_PENDING_IMAGE_BUILD_ID"
                --frontend-substitutions "${FRONTEND_DEPLOY_SUBSTITUTIONS},_SKIP_IMAGE_BUILD=true")
            else
              config_args+=(--frontend-substitutions "${FRONTEND_DEPLOY_SUBSTITUTIONS},_SKIP_IMAGE_BUILD=true,_IMAGE_REFERENCE=${FRONTEND_PARALLEL_IMAGE}")
            fi
          fi
          "${{ env.PROTOCOL_PYTHON }}" scripts/ci/uat_backend_build_config.py "${config_args[@]}"
          build_id="$(gcloud builds submit \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --config=/tmp/uat-backend-parallel.cloudbuild.json \
            --suppress-logs --format='value(id)' \
            "--substitutions=^##^${SUBSTITUTIONS}")"
          if [[ ! "${build_id}" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
            echo "Backend deployment did not return an exact Cloud Build id." >&2
            exit 1
          fi
          echo "build_id=${build_id}" >> "$GITHUB_OUTPUT"
          finished_at="$(date +%s)"
          echo "started_at_epoch=${started_at}" >> "$GITHUB_OUTPUT"
          echo "finished_at_epoch=${finished_at}" >> "$GITHUB_OUTPUT"
          echo "duration_seconds=$((finished_at - started_at))" >> "$GITHUB_OUTPUT"

      - name: Capture managed provider readiness receipt
        if: always() && steps.scope.outputs.deploy_backend == 'true'
        shell: bash
        env:
          READINESS_BUILD_ID: ${{ steps.deploy-backend.outputs.build_id }}
          READINESS_SOURCE_SHA: ${{ steps.resolve-sha.outputs.sha }}
          READINESS_IMAGE: ${{ steps.build-backend-image.outputs.image_reference }}
          READINESS_RUNTIME_ACCOUNT: ${{ env.RUNTIME_SERVICE_ACCOUNT }}
          READINESS_PROJECT: ${{ env.GCP_PROJECT_ID }}
          READINESS_REGION: ${{ env.GCP_REGION }}
          READINESS_GITHUB_RUN: ${{ github.run_id }}
          READINESS_ENVIRONMENT: uat
          READINESS_LEGACY_EXCEPTION: ${{ inputs.skip_managed_vertex_probe_once || false }}
        run: |
          python3 scripts/ci/capture_managed_provider_receipt.py \
            --output /tmp/uat-managed-provider-readiness.json

      # The structure evaluator exercises the backend candidate image. Keep it
      # before the frontend build so an advisory model-quality warning is
      # available as early as possible, without turning a model variance into a
      # deployment or rollback authority.
      - name: Resolve backend candidate revision
        id: backend-candidate-state
        if: steps.scope.outputs.deploy_backend == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "${{ env.BACKEND_SERVICE }}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --region="${{ env.GCP_REGION }}" \
            --format=json > /tmp/uat-backend-candidate-service.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          service = json.loads(
              Path("/tmp/uat-backend-candidate-service.json").read_text(encoding="utf-8")
          )
          status = service.get("status") or {}
          revision = str(status.get("latestCreatedRevisionName") or "").strip()
          expected_tag = f"account-deletion-{os.environ['GITHUB_RUN_ID']}"
          tagged = [
              entry
              for entry in (status.get("traffic") or [])
              if isinstance(entry, dict) and entry.get("tag") == expected_tag
          ]
          if not revision or len(tagged) != 1:
              raise SystemExit("Backend candidate revision/tag could not be resolved uniquely")
          tagged_revision = str(tagged[0].get("revisionName") or revision).strip()
          candidate_url = str(tagged[0].get("url") or "").strip()
          if tagged_revision != revision or not candidate_url.startswith("https://"):
              raise SystemExit("Backend candidate tag does not resolve to the latest created revision")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"backend_revision={revision}\n")
              output.write(f"backend_candidate_url={candidate_url}\n")
          PY

      - name: Verify backend candidate runtime identity
        if: steps.scope.outputs.deploy_backend == 'true'
        run: >-
          bash scripts/ci/assert-cloud-run-runtime-identity.sh
          "${{ env.GCP_PROJECT_ID }}"
          "${{ env.GCP_REGION }}"
          "${{ steps.backend-candidate-state.outputs.backend_revision }}"
          "${{ env.RUNTIME_SERVICE_ACCOUNT }}"

      - name: Verify backend candidate readiness and exact-SHA provenance
        if: steps.scope.outputs.deploy_backend == 'true'
        shell: bash
        env:
          BACKEND_REVISION: ${{ steps.backend-candidate-state.outputs.backend_revision }}
          BACKEND_CANDIDATE_URL: ${{ steps.backend-candidate-state.outputs.backend_candidate_url }}
          EXPECTED_SHA: ${{ steps.resolve-sha.outputs.sha }}
          EXPECTED_IMAGE_REFERENCE: ${{ steps.build-backend-image.outputs.image_reference }}
        run: |
          set -euo pipefail
          gcloud run revisions describe "${BACKEND_REVISION}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --region="${{ env.GCP_REGION }}" \
            --format=json > /tmp/uat-backend-candidate.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          revision = json.loads(
              Path("/tmp/uat-backend-candidate.json").read_text(encoding="utf-8")
          )
          expected_revision = os.environ["BACKEND_REVISION"]
          expected_sha = os.environ["EXPECTED_SHA"]
          expected_image_reference = os.environ["EXPECTED_IMAGE_REFERENCE"]
          metadata = revision.get("metadata") or {}
          labels = metadata.get("labels") or {}
          containers = (revision.get("spec") or {}).get("containers") or []
          env = {
              str(item.get("name") or ""): str(item.get("value") or "")
              for container in containers
              if isinstance(container, dict)
              for item in (container.get("env") or [])
              if isinstance(item, dict) and "value" in item
          }
          ready = any(
              condition.get("type") == "Ready" and str(condition.get("status")).lower() == "true"
              for condition in ((revision.get("status") or {}).get("conditions") or [])
              if isinstance(condition, dict)
          )
          checks = {
              "revision": metadata.get("name") == expected_revision,
              "ready": ready,
              "label_sha": labels.get("deploy-sha") == expected_sha,
              "label_environment": labels.get("deploy-env") == "uat",
              "label_source": labels.get("deploy-source") == "deploy-uat",
              "lifecycle_contract": labels.get("account-deletion-contract") == "v201",
              "immutable_image": bool(containers)
              and containers[0].get("image") == expected_image_reference,
              "env_sha": env.get("HUSHH_DEPLOY_SHA") == expected_sha,
              "env_environment": env.get("HUSHH_DEPLOY_ENV") == "uat",
              "env_source": env.get("HUSHH_DEPLOY_SOURCE") == "deploy-uat",
              "env_run": env.get("HUSHH_DEPLOY_RUN_ID") == os.environ["GITHUB_RUN_ID"],
          }
          report = {
              "status": "ready" if all(checks.values()) else "blocked",
              "revision": expected_revision,
              "checks": checks,
          }
          Path("/tmp/uat-backend-candidate-readiness.json").write_text(
              json.dumps(report, indent=2, sort_keys=True), encoding="utf-8"
          )
          if not all(checks.values()):
              raise SystemExit("Backend candidate readiness/provenance gate failed")
          PY
          candidate_health_ok=false
          for _attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 15 \
              "${BACKEND_CANDIDATE_URL%/}/health" \
              > /tmp/uat-backend-candidate-health.json; then
              candidate_health_ok=true
              break
            fi
            sleep 3
          done
          if [ "${candidate_health_ok}" != "true" ]; then
            echo "Backend candidate tagged health probe failed." >&2
            exit 1
          fi
          if [[ "$UAT_EMAIL_AUTH_ENABLED" == "true" ]]; then
            "${{ env.PROTOCOL_PYTHON }}" scripts/ops/email_auth_uat_release.py verify-candidate \
              --backend-url "$BACKEND_CANDIDATE_URL"
          fi

      - name: Verify candidate PKM evaluator in Cloud Run
        id: verify-candidate-pkm-evaluator
        if: steps.scope.outputs.deploy_backend == 'true' && steps.verification-plan.outputs.pkm_evaluator_runs != '0'
        shell: bash
        env:
          BACKEND_REVISION: ${{ steps.backend-candidate-state.outputs.backend_revision }}
        run: |
          set -euo pipefail
          if ./scripts/ci/run-candidate-pkm-structure-agent-eval.sh; then
            echo "outcome=success" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=failure" >> "$GITHUB_OUTPUT"
            echo "Candidate PKM evaluator failed; continuing with its advisory warning." >&2
          fi

      - name: Record candidate PKM evaluator warning
        if: always() && steps.scope.outputs.deploy_backend == 'true' && steps.verification-plan.outputs.pkm_evaluator_runs != '0' && steps.verify-candidate-pkm-evaluator.outputs.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          echo "::warning title=Candidate PKM evaluator warning::The synthetic structure-agent evaluator failed. This is advisory; runtime identity, provenance, parity, schema, semantic, reviewer, and passkey gates remain blocking."
          {
            echo "## ⚠ Candidate PKM evaluator warning"
            echo ""
            echo "The synthetic structure-agent evaluator failed for this backend candidate. The result is recorded for remediation but does not authorize rollback by itself."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for frontend image and pin its digest
        id: build-frontend-image
        if: steps.scope.outputs.deploy_frontend == 'true' && steps.start-frontend-image-build.outputs.prebuilt == 'true'
        shell: bash
        env:
          FRONTEND_IMAGE_BUILD_ID: ${{ steps.start-frontend-image-build.outputs.build_id }}
          FRONTEND_IMAGE_TAG: ${{ steps.start-frontend-image-build.outputs.image_tag }}
          FRONTEND_PARALLEL_IMAGE: ${{ steps.prepare-frontend-rollout.outputs.image_reference }}
          FRONTEND_PENDING_IMAGE_BUILD_ID: ${{ steps.prepare-frontend-rollout.outputs.pending_image_build_id }}
          FRONTEND_SHARED_BUILD_ID: ${{ steps.deploy-backend.outputs.build_id }}
        run: |
          set -euo pipefail
          started_at="$(date +%s)"
          image_repository="gcr.io/${{ env.GCP_PROJECT_ID }}/hushh-webapp"
          if [[ -n "$FRONTEND_PENDING_IMAGE_BUILD_ID" ]]; then
            # Collect this exact build's original executable pin. Never resolve
            # the mutable tag again after its no-traffic candidate was created.
            image_reference="$(python3 scripts/ci/uat_frontend_image_handoff.py collect \
              --image-build-id "$FRONTEND_PENDING_IMAGE_BUILD_ID" \
              --deployment-build-id "$FRONTEND_SHARED_BUILD_ID" \
              --sha "${{ steps.resolve-sha.outputs.sha }}" \
              --github-run "${{ github.run_id }}" \
              --github-attempt "${{ github.run_attempt }}" \
              --backend-image "${{ steps.build-backend-image.outputs.image_reference }}" \
              --legacy-exception "${{ inputs.skip_managed_vertex_probe_once || false }}" \
              --manifest-output /tmp/uat-frontend-image-manifest.json \
              --output /tmp/uat-frontend-image.json \
              --proof-output /tmp/uat-frontend-image-handoff.json)"
            # Waiting occurs inside the shared build. Report that exact step's
            # elapsed time, separately from this post-build evidence collection.
            wait_seconds="$(python3 -c 'import json; print(json.load(open("/tmp/uat-frontend-image-handoff.json"))["image_wait_seconds"])')"
            echo "collection_seconds=$(( $(date +%s) - started_at ))" >> "$GITHUB_OUTPUT"
          elif [[ -n "$FRONTEND_PARALLEL_IMAGE" ]]; then
            image_reference="$FRONTEND_PARALLEL_IMAGE"
          else
            image_reference="$(bash scripts/ci/await-prebuilt-image.sh \
              --project "${{ env.GCP_PROJECT_ID }}" \
              --build-id "${FRONTEND_IMAGE_BUILD_ID}" \
              --image-repository "${image_repository}" \
              --image-tag "${FRONTEND_IMAGE_TAG}" \
              --sha "${{ steps.resolve-sha.outputs.sha }}" \
              --manifest-json /tmp/uat-frontend-image-manifest.json \
              --json-output /tmp/uat-frontend-image.json)"
          fi
          if [[ ! "${image_reference}" =~ ^gcr\.io/${{ env.GCP_PROJECT_ID }}/hushh-webapp@sha256:[0-9a-f]{64}$ ]]; then
            echo "Frontend image did not pin to an immutable sha256 digest." >&2
            exit 1
          fi
          echo "image_reference=${image_reference}" >> "$GITHUB_OUTPUT"
          if [[ -z "$FRONTEND_PENDING_IMAGE_BUILD_ID" ]]; then
            wait_seconds="$(( $(date +%s) - started_at ))"
          fi
          echo "wait_seconds=$(( wait_seconds + ${{ steps.prepare-frontend-rollout.outputs.wait_seconds || '0' }} ))" >> "$GITHUB_OUTPUT"

      - name: Deploy frontend using Cloud Build
        id: deploy-frontend
        if: steps.scope.outputs.deploy_frontend == 'true'
        shell: bash
        env:
          FRONTEND_PREBUILT: ${{ steps.start-frontend-image-build.outputs.prebuilt }}
          FRONTEND_IMAGE_REFERENCE: ${{ steps.build-frontend-image.outputs.image_reference }}
          FRONTEND_DEPLOY_SUBSTITUTIONS: ${{ steps.prepare-frontend-rollout.outputs.substitutions }}
          FRONTEND_PARALLEL: ${{ steps.prepare-frontend-rollout.outputs.parallel || 'false' }}
          SHARED_BUILD_ID: ${{ steps.deploy-backend.outputs.build_id }}
        run: |
          set -euo pipefail
          started_at="$(date +%s)"
          SUBSTITUTIONS="${FRONTEND_DEPLOY_SUBSTITUTIONS}"
          if [ -z "${SUBSTITUTIONS}" ]; then
            echo "Refusing frontend deploy: rollout substitutions were not resolved." >&2
            exit 1
          fi
          if [[ "$FRONTEND_PARALLEL" == "true" ]]; then
            # The synchronous backend step joined all required frontend steps.
            # Record the shared build instead of reporting this no-op as rollout time.
            [[ "$SHARED_BUILD_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]
            [[ "$FRONTEND_PREBUILT" == "true" && "$FRONTEND_IMAGE_REFERENCE" =~ ^gcr\.io/${{ env.GCP_PROJECT_ID }}/hushh-webapp@sha256:[0-9a-f]{64}$ ]]
            echo "shared_build_id=${SHARED_BUILD_ID}" >> "$GITHUB_OUTPUT"
            echo "Frontend rollout completed in required Cloud Build ${SHARED_BUILD_ID}."
            exit 0
          fi
          source_arg="."
          case "${FRONTEND_PREBUILT}" in
            true)
              # Deploy exactly the digest pinned above; never rebuild or re-resolve a tag.
              if [[ ! "${FRONTEND_IMAGE_REFERENCE}" =~ ^gcr\.io/${{ env.GCP_PROJECT_ID }}/hushh-webapp@sha256:[0-9a-f]{64}$ ]]; then
                echo "Refusing frontend deploy: the pinned image digest is missing or malformed." >&2
                exit 1
              fi
              SUBSTITUTIONS="${SUBSTITUTIONS},_SKIP_IMAGE_BUILD=true,_IMAGE_REFERENCE=${FRONTEND_IMAGE_REFERENCE}"
              # Deploy-only: nothing in the build context is read, so skip the upload.
              source_arg="--no-source"
              ;;
            false)
              echo "Combined build-and-deploy for a SHA that predates the prebuilt frontend image."
              ;;
            *)
              echo "Refusing frontend deploy: prebuilt-image mode was not resolved." >&2
              exit 1
              ;;
          esac
          gcloud builds submit "${source_arg}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --config=deploy/frontend.cloudbuild.yaml \
            "--substitutions=${SUBSTITUTIONS}"
          finished_at="$(date +%s)"
          echo "started_at_epoch=${started_at}" >> "$GITHUB_OUTPUT"
          echo "finished_at_epoch=${finished_at}" >> "$GITHUB_OUTPUT"
          echo "duration_seconds=$((finished_at - started_at))" >> "$GITHUB_OUTPUT"

      - name: Resolve deployed candidate revisions
        id: candidate-state
        shell: bash
        run: |
          set -euo pipefail
          backend_revision=""
          frontend_revision=""
          if [ "${{ steps.scope.outputs.deploy_backend }}" = "true" ]; then
            backend_revision="${{ steps.backend-candidate-state.outputs.backend_revision }}"
          fi
          if [ "${{ steps.scope.outputs.deploy_frontend }}" = "true" ]; then
            gcloud run revisions list \
              --service="${{ env.FRONTEND_SERVICE }}" \
              --project="${{ env.GCP_PROJECT_ID }}" \
              --region="${{ env.GCP_REGION }}" \
              --format=json > /tmp/uat-frontend-deploy-revisions.json
            frontend_revision="$(python3 "${RUNNER_TEMP}/release-tools/resolve-cloud-run-deploy-revision.py" \
              --revisions-json /tmp/uat-frontend-deploy-revisions.json \
              --deploy-env uat \
              --deploy-source deploy-uat \
              --deploy-sha "${{ steps.resolve-sha.outputs.sha }}" \
              --github-run-id "${{ github.run_id }}" \
              --github-run-attempt "${{ github.run_attempt }}")"
          fi

          echo "backend_revision=${backend_revision}" >> "$GITHUB_OUTPUT"
          echo "frontend_revision=${frontend_revision}" >> "$GITHUB_OUTPUT"

      - name: Verify frontend-only candidate has no SQL binding before smoke
        if: steps.scope.outputs.deploy_frontend == 'true' && steps.scope.outputs.deploy_backend != 'true'
        shell: bash
        env:
          FRONTEND_REVISION: ${{ steps.candidate-state.outputs.frontend_revision }}
        run: |
          set -euo pipefail
          if [ -z "$FRONTEND_REVISION" ]; then
            echo "UAT frontend candidate revision is unavailable for SQL-free verification." >&2
            exit 1
          fi
          timeout --signal=TERM --kill-after=2s 295s python3 scripts/ci/runtime-capacity-budget.py --environment uat \
            --frontend-only --frontend-revision "$FRONTEND_REVISION"

      - name: Verify frontend candidate runs the pinned image digest
        if: steps.scope.outputs.deploy_frontend == 'true' && steps.start-frontend-image-build.outputs.prebuilt == 'true'
        shell: bash
        env:
          FRONTEND_REVISION: ${{ steps.candidate-state.outputs.frontend_revision }}
          EXPECTED_IMAGE_REFERENCE: ${{ steps.build-frontend-image.outputs.image_reference }}
        run: |
          set -euo pipefail
          deployed_image="$(gcloud run revisions describe "${FRONTEND_REVISION}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --region="${{ env.GCP_REGION }}" \
            --format='value(spec.containers[0].image)')"
          if [ -z "${EXPECTED_IMAGE_REFERENCE}" ] || [ "${deployed_image}" != "${EXPECTED_IMAGE_REFERENCE}" ]; then
            echo "Frontend candidate ${FRONTEND_REVISION} runs '${deployed_image}', not the pinned '${EXPECTED_IMAGE_REFERENCE}'." >&2
            exit 1
          fi
          echo "Frontend candidate ${FRONTEND_REVISION} runs the pinned image ${deployed_image}."

      - name: Resolve zero-traffic frontend analytics candidate
        id: frontend-analytics-candidate
        if: steps.scope.outputs.deploy_frontend == 'true'
        shell: bash
        run: |
          set -euo pipefail
          release_revision="${{ steps.candidate-state.outputs.frontend_revision }}"
          smoke_revision="${release_revision}"

          # A dual-scope release needs reviewer bootstrap to reach the paired
          # backend candidate without moving canonical backend traffic. Clone
          # the already-built frontend revision at zero traffic, override only
          # its server-side backend binding, and discard the clone after the
          # smoke. The canonical-configured release revision is the one that is
          # promoted after the smoke succeeds.
          if [ "${{ steps.scope.outputs.deploy_backend }}" = "true" ]; then
            # Cloud Run rejects changing a secret-backed variable to a literal
            # in the same update. Remove the secret bindings first.
            gcloud run services update "${{ env.FRONTEND_SERVICE }}" \
              --project="${{ env.GCP_PROJECT_ID }}" \
              --region="${{ env.GCP_REGION }}" \
              --platform=managed \
              --no-traffic \
              --remove-secrets=BACKEND_URL,DEVELOPER_API_URL
            gcloud run services update "${{ env.FRONTEND_SERVICE }}" \
              --project="${{ env.GCP_PROJECT_ID }}" \
              --region="${{ env.GCP_REGION }}" \
              --platform=managed \
              --no-traffic \
              --update-env-vars="BACKEND_URL=${{ steps.backend-candidate-state.outputs.backend_candidate_url }},DEVELOPER_API_URL=${{ steps.backend-candidate-state.outputs.backend_candidate_url }}"
            smoke_revision="$(gcloud run revisions list \
              --service="${{ env.FRONTEND_SERVICE }}" \
              --project="${{ env.GCP_PROJECT_ID }}" \
              --region="${{ env.GCP_REGION }}" \
              --sort-by='~metadata.creationTimestamp' \
              --limit=1 \
              --format='value(metadata.name)')"
            if [ -z "${smoke_revision}" ] || [ "${smoke_revision}" = "${release_revision}" ]; then
              echo "Paired frontend smoke revision was not created." >&2
              exit 1
            fi
          fi

          gcloud run services update-traffic "${{ env.FRONTEND_SERVICE }}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --region="${{ env.GCP_REGION }}" \
            --update-tags="analytics-candidate=${smoke_revision}"
          candidate_url="$(gcloud run services describe "${{ env.FRONTEND_SERVICE }}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --region="${{ env.GCP_REGION }}" \
            --format=json | python3 -c '
          import json, sys
          service = json.load(sys.stdin)
          matches = [
              item for item in ((service.get("status") or {}).get("traffic") or [])
              if item.get("tag") == "analytics-candidate"
          ]
          if len(matches) != 1 or matches[0].get("revisionName") != sys.argv[1]:
              raise SystemExit("Frontend analytics candidate tag did not resolve to the expected revision")
          url = str(matches[0].get("url") or "").strip()
          if not url.startswith("https://"):
              raise SystemExit("Frontend analytics candidate URL is unavailable")
          print(url)
          ' "${smoke_revision}")"
          echo "revision=${smoke_revision}" >> "$GITHUB_OUTPUT"
          echo "url=${candidate_url}" >> "$GITHUB_OUTPUT"

      - name: Verify governed analytics transport on zero-traffic UAT candidate
        id: verify-analytics-uat
        if: steps.scope.outputs.deploy_frontend == 'true'
        continue-on-error: true
        shell: bash
        working-directory: hushh-webapp
        env:
          UAT_ANALYTICS_SMOKE_ORIGIN: ${{ steps.frontend-analytics-candidate.outputs.url }}
        run: |
          set -euo pipefail
          reviewer_uid="$(gcloud secrets versions access latest \
            --secret=REVIEWER_UID \
            --project="${{ env.GCP_PROJECT_ID }}")"
          reviewer_passphrase="$(gcloud secrets versions access latest \
            --secret=REVIEWER_VAULT_PASSPHRASE \
            --project="${{ env.GCP_PROJECT_ID }}")"
          echo "::add-mask::$reviewer_uid"
          echo "::add-mask::$reviewer_passphrase"
          export REVIEWER_UID="$reviewer_uid"
          export REVIEWER_VAULT_PASSPHRASE="$reviewer_passphrase"
          # Retry only a browser failure with observed Cloud Run 5xx responses
          # for this tagged candidate's static assets. A second smoke must pass
          # fully before either zero-traffic candidate can be promoted.
          set +e
          npm run smoke:analytics:uat 2>&1 | tee /tmp/uat-analytics-smoke.log
          smoke_attempt_1_statuses=("${PIPESTATUS[@]}")
          set -e
          if [ "${smoke_attempt_1_statuses[1]}" -ne 0 ]; then
            exit "${smoke_attempt_1_statuses[1]}"
          fi
          if [ "${smoke_attempt_1_statuses[0]}" -ne 0 ]; then
            if ! grep -Fq '"classification": "candidate_asset_unavailable"' \
              /tmp/uat-analytics-smoke.log; then
              exit "${smoke_attempt_1_statuses[0]}"
            fi
            echo "Candidate static assets returned 5xx; retrying the analytics smoke once after warmup."
            sleep 15
            npm run smoke:analytics:uat 2>&1 | tee -a /tmp/uat-analytics-smoke.log
          fi

      - name: Remove zero-traffic frontend analytics candidate tag
        if: always() && steps.scope.outputs.deploy_frontend == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "${{ env.FRONTEND_SERVICE }}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --region="${{ env.GCP_REGION }}" \
            --format=json > /tmp/uat-frontend-analytics-candidate-cleanup.json
          if python3 - <<'PY'
          import json
          from pathlib import Path

          service = json.loads(
              Path("/tmp/uat-frontend-analytics-candidate-cleanup.json").read_text(
                  encoding="utf-8"
              )
          )
          traffic = (service.get("status") or {}).get("traffic") or []
          raise SystemExit(
              0
              if any(entry.get("tag") == "analytics-candidate" for entry in traffic)
              else 1
          )
          PY
          then
            gcloud run services update-traffic "${{ env.FRONTEND_SERVICE }}" \
              --project="${{ env.GCP_PROJECT_ID }}" \
              --region="${{ env.GCP_REGION }}" \
              --remove-tags=analytics-candidate
          else
            echo "Frontend analytics candidate tag is already absent."
          fi

      - name: Restore canonical frontend backend bindings
        if: always() && steps.scope.outputs.deploy_frontend == 'true' && steps.scope.outputs.deploy_backend == 'true' && steps.deploy-frontend.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          # The smoke clone may leave a literal candidate URL (or no URL if
          # its first update succeeded but the second failed) on the service
          # template. Restore the canonical secret refs before any promotion.
          gcloud run services update "${{ env.FRONTEND_SERVICE }}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --region="${{ env.GCP_REGION }}" \
            --platform=managed \
            --no-traffic \
            --remove-env-vars=BACKEND_URL,DEVELOPER_API_URL \
            --update-secrets=BACKEND_URL=BACKEND_URL:latest,DEVELOPER_API_URL=BACKEND_URL:latest
          gcloud run services describe "${{ env.FRONTEND_SERVICE }}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --region="${{ env.GCP_REGION }}" \
            --format=json | python3 -c '
          import json, sys
          service = json.load(sys.stdin)
          containers = ((service.get("spec") or {}).get("template") or {}).get("spec", {}).get("containers") or []
          if len(containers) != 1:
              raise SystemExit("Expected one frontend container")
          env = {item.get("name"): item for item in containers[0].get("env") or []}
          for name in ("BACKEND_URL", "DEVELOPER_API_URL"):
              ref = ((env.get(name) or {}).get("valueFrom") or {}).get("secretKeyRef") or {}
              if ref.get("name") != "BACKEND_URL" or ref.get("key") != "latest":
                  raise SystemExit(f"Canonical secret binding missing: {name}")
          '

      - name: Promote deployed revisions to UAT traffic
        id: promote-uat-traffic
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ steps.scope.outputs.deploy_frontend }}" = "true" ] \
            && [ "${{ steps.verify-analytics-uat.outcome }}" != "success" ]; then
            echo "Analytics smoke failed; both zero-traffic candidates stay unpromoted."
            exit 0
          fi

          if [ "${{ steps.scope.outputs.deploy_backend }}" = "true" ]; then
            gcloud run services update-traffic "${{ env.BACKEND_SERVICE }}" \
              --project="${{ env.GCP_PROJECT_ID }}" \
              --region="${{ env.GCP_REGION }}" \
              --to-revisions="${{ steps.candidate-state.outputs.backend_revision }}=100"
          fi

          if [ "${{ steps.scope.outputs.deploy_frontend }}" = "true" ]; then
            if [ "${{ steps.scope.outputs.deploy_backend }}" != "true" ]; then
              # Recheck the immutable candidate and current frontend template
              # immediately before sending it serving traffic.
              timeout --signal=TERM --kill-after=2s 295s python3 scripts/ci/runtime-capacity-budget.py --environment uat \
                --frontend-only \
                --frontend-revision "${{ steps.candidate-state.outputs.frontend_revision }}"
            fi
            gcloud run services update-traffic "${{ env.FRONTEND_SERVICE }}" \
              --project="${{ env.GCP_PROJECT_ID }}" \
              --region="${{ env.GCP_REGION }}" \
              --to-revisions="${{ steps.candidate-state.outputs.frontend_revision }}=100"
          fi

      - name: Resolve current deployed Cloud Run state
        id: current-state
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "${{ env.BACKEND_SERVICE }}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --region="${{ env.GCP_REGION }}" \
            --format=json > /tmp/uat-backend-promoted-service.json
          gcloud run services describe "${{ env.FRONTEND_SERVICE }}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --region="${{ env.GCP_REGION }}" \
            --format=json > /tmp/uat-frontend-promoted-service.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          def serving_state(path: str, expected_revision: str, must_match: bool) -> tuple[str, str]:
              service = json.loads(Path(path).read_text(encoding="utf-8"))
              status = service.get("status") or {}
              positive = [
                  entry
                  for entry in (status.get("traffic") or [])
                  if isinstance(entry, dict) and int(entry.get("percent") or 0) > 0
              ]
              if len(positive) != 1 or int(positive[0].get("percent") or 0) != 100:
                  raise SystemExit(f"Expected exactly one 100% serving revision in {path}")
              revision = str(positive[0].get("revisionName") or "").strip()
              if not revision and positive[0].get("latestRevision"):
                  revision = str(status.get("latestReadyRevisionName") or "").strip()
              if not revision:
                  raise SystemExit(f"Serving revision is missing in {path}")
              if must_match and revision != expected_revision:
                  raise SystemExit(
                      f"Promoted revision mismatch: expected {expected_revision}, got {revision}"
                  )
              url = str(status.get("url") or "").strip()
              if not url.startswith("https://"):
                  raise SystemExit(f"Service URL is invalid in {path}")
              return revision, url

          backend_revision, backend_url = serving_state(
              "/tmp/uat-backend-promoted-service.json",
              "${{ steps.candidate-state.outputs.backend_revision }}",
              "${{ steps.scope.outputs.deploy_backend }}" == "true"
              and (
                  "${{ steps.scope.outputs.deploy_frontend }}" != "true"
                  or "${{ steps.verify-analytics-uat.outcome }}" == "success"
              ),
          )
          frontend_revision, frontend_url = serving_state(
              "/tmp/uat-frontend-promoted-service.json",
              "${{ steps.candidate-state.outputs.frontend_revision }}",
              "${{ steps.scope.outputs.deploy_frontend }}" == "true"
              and "${{ steps.verify-analytics-uat.outcome }}" == "success",
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"backend_revision={backend_revision}\n")
              output.write(f"backend_url={backend_url}\n")
              output.write(f"frontend_revision={frontend_revision}\n")
              output.write(f"frontend_url={frontend_url}\n")
          PY

      - name: Verify backend deployment provenance
        id: verify-backend-provenance
        if: steps.scope.outputs.deploy_backend == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          "${{ env.PROTOCOL_PYTHON }}" scripts/ci/verify-cloudrun-revision-provenance.py \
            --project "${{ env.GCP_PROJECT_ID }}" \
            --region "${{ env.GCP_REGION }}" \
            --service "${{ env.BACKEND_SERVICE }}" \
            --expected-env uat \
            --expected-source deploy-uat \
            --expected-sha "${{ steps.resolve-sha.outputs.sha }}" \
            --expected-run-id "${{ github.run_id }}" \
            --expected-image-reference "${{ steps.build-backend-image.outputs.image_reference }}" \
            --report-path /tmp/uat-backend-provenance.json

      - name: Verify frontend deployment provenance
        id: verify-frontend-provenance
        if: steps.scope.outputs.deploy_frontend == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          "${{ env.PROTOCOL_PYTHON }}" scripts/ci/verify-cloudrun-revision-provenance.py \
            --project "${{ env.GCP_PROJECT_ID }}" \
            --region "${{ env.GCP_REGION }}" \
            --service "${{ env.FRONTEND_SERVICE }}" \
            --expected-env uat \
            --expected-source deploy-uat \
            --expected-sha "${{ steps.resolve-sha.outputs.sha }}" \
            --expected-run-id "${{ github.run_id }}" \
            --report-path /tmp/uat-frontend-provenance.json

      - name: Verify protected list secrets were not wiped
        shell: bash
        run: |
          # `gcloud secrets versions add` REPLACES the whole value. A script or
          # person that writes without reading first deletes every other entry
          # with no error. HUSHH_UAT_PHONE_TEST_NUMBERS went 59 -> 1 that way on
          # 2026-09-03 and nobody noticed for five days; it surfaced as "phone
          # verification is broken". Old versions are the only record, and until
          # now nothing read them. See R36.
          python3 scripts/ops/verify_secret_list_invariants.py \
            --project "${{ env.GCP_PROJECT_ID }}"

      - name: Verify UAT runtime env parity
        id: verify-parity-1
        continue-on-error: true
        run: |
          "${{ env.PROTOCOL_PYTHON }}" scripts/ops/verify-env-secrets-parity.py \
            --project "${{ env.GCP_PROJECT_ID }}" \
            --expected-firebase-project "${{ env.UAT_FIREBASE_PROJECT_ID }}" \
            --region "${{ env.GCP_REGION }}" \
            --backend-service "${{ env.BACKEND_SERVICE }}" \
            --frontend-service "${{ env.FRONTEND_SERVICE }}" \
            --require-plaid \
            --require-market-data \
            --require-gmail \
            --require-calendar \
            --require-one-email \
            --require-reviewer-smoke \
            --assert-runtime-env-contract \
            --report-path /tmp/uat-runtime-parity-attempt-1.json

      - name: Verify UAT runtime env parity retry
        id: verify-parity-2
        if: steps.verify-parity-1.outcome == 'failure'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          sleep 20
          "${{ env.PROTOCOL_PYTHON }}" scripts/ops/verify-env-secrets-parity.py \
            --project "${{ env.GCP_PROJECT_ID }}" \
            --expected-firebase-project "${{ env.UAT_FIREBASE_PROJECT_ID }}" \
            --region "${{ env.GCP_REGION }}" \
            --backend-service "${{ env.BACKEND_SERVICE }}" \
            --frontend-service "${{ env.FRONTEND_SERVICE }}" \
            --require-plaid \
            --require-market-data \
            --require-gmail \
            --require-calendar \
            --require-one-email \
            --require-reviewer-smoke \
            --assert-runtime-env-contract \
            --report-path /tmp/uat-runtime-parity-attempt-2.json

      - name: Verify UAT native passkey domain associations
        id: verify-passkey-associations
        if: steps.scope.outputs.deploy_frontend == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          # Validate UAT OAuth app links and retain shared production RP credentials.
          # Production OAuth routes are verified by its own deployment.
          python3 scripts/ops/verify_passkey_domain_associations.py \
            --project "${{ env.GCP_PROJECT_ID }}" \
            --origin "${{ env.APP_FRONTEND_ORIGIN }}" \
            --credentials-only-origin "https://one.hushh.ai"

      - name: Post-deploy UAT schema contract gate
        id: postdeploy-db-gate
        if: steps.scope.outputs.deploy_backend == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          if [ "${GCP_PROJECT_ID}" != "hushh-pda-uat" ] \
             || [ "${UAT_CLOUDSQL_INSTANCE}" != "hushh-pda-uat:us-central1:hushh-uat-pg" ]; then
            echo "Refusing UAT schema verification: project or Cloud SQL instance is not canonical."
            exit 1
          fi
          export HUSSH_RELEASE_ENVIRONMENT=uat
          export CLOUDSQL_INSTANCE_CONNECTION_NAME="${UAT_CLOUDSQL_INSTANCE}"

          DB_USER="$(gcloud secrets versions access latest --secret=DB_USER --project="${{ env.GCP_PROJECT_ID }}")"
          DB_PASSWORD="$(gcloud secrets versions access latest --secret=DB_PASSWORD --project="${{ env.GCP_PROJECT_ID }}")"
          echo "::add-mask::${DB_USER}"
          echo "::add-mask::${DB_PASSWORD}"

          cloud-sql-proxy \
            --address 127.0.0.1 \
            --port 6543 \
            ${GOOGLE_GHA_CREDS_PATH:+--credentials-file="${GOOGLE_GHA_CREDS_PATH}"} \
            "${{ env.UAT_CLOUDSQL_INSTANCE }}" >/tmp/cloud-sql-proxy-uat-postdeploy.log 2>&1 &
          PROXY_PID=$!
          trap 'kill "${PROXY_PID}" >/dev/null 2>&1 || true' EXIT

          python3 - <<'PY'
          import socket
          import time

          deadline = time.time() + 20
          while time.time() < deadline:
              with socket.socket() as sock:
                  sock.settimeout(0.5)
                  if sock.connect_ex(("127.0.0.1", 6543)) == 0:
                      raise SystemExit(0)
              time.sleep(0.25)
          raise SystemExit("Cloud SQL proxy did not bind 127.0.0.1:6543 in time")
          PY

          export DB_HOST=127.0.0.1
          export DB_PORT=6543
          export DB_NAME=postgres
          export DB_USER
          export DB_PASSWORD

          "${{ env.PROTOCOL_PYTHON }}" scripts/ops/db_migration_release_guard.py \
            --release-environment uat \
            --contract-file consent-protocol/db/contracts/uat_integrated_schema.json \
            --report-path /tmp/uat-db-migration-guard-postdeploy.json

      - name: Bootstrap UAT runtime files for semantic verification
        if: steps.postdeploy-db-gate.outcome != 'failure'
        shell: bash
        run: |
          set -euo pipefail
          BOOTSTRAP_FOCUS_PROFILE=uat bash scripts/env/bootstrap_profiles.sh --strict
          bash scripts/env/use_profile.sh uat

      - name: Load maintainer smoke overlay
        if: steps.postdeploy-db-gate.outcome != 'failure'
        shell: bash
        run: |
          set -euo pipefail
          smoke_user_id="$(gcloud secrets versions access latest \
            --secret=UAT_SMOKE_USER_ID \
            --project="${{ env.GCP_PROJECT_ID }}")"
          smoke_passphrase="$(gcloud secrets versions access latest \
            --secret=UAT_SMOKE_PASSPHRASE \
            --project="${{ env.GCP_PROJECT_ID }}")"
          echo "::add-mask::$smoke_user_id"
          echo "::add-mask::$smoke_passphrase"
          {
            echo "UAT_SMOKE_USER_ID<<EOF"
            printf '%s\n' "$smoke_user_id"
            echo "EOF"
            echo "UAT_SMOKE_PASSPHRASE<<EOF"
            printf '%s\n' "$smoke_passphrase"
            echo "EOF"
          } >> "$GITHUB_ENV"



      - name: Semantic UAT verification
        id: verify-uat-1
        if: steps.postdeploy-db-gate.outcome != 'failure'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          "${{ env.PROTOCOL_PYTHON }}" scripts/ops/verify_uat_release.py \
            --run-live-model-checks "${{ steps.verification-plan.outputs.run_live_model_checks }}" \
            --backend-url "${{ steps.current-state.outputs.backend_url }}" \
            --frontend-url "${{ env.APP_FRONTEND_ORIGIN }}" \
            --protocol-env consent-protocol/.env \
            --web-env hushh-webapp/.env.local \
            --report-path /tmp/uat-release-verify-attempt-1.json

      - name: Semantic UAT verification retry
        id: verify-uat-2
        if: steps.postdeploy-db-gate.outcome != 'failure' && steps.verify-uat-1.outcome == 'failure'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          sleep 20
          "${{ env.PROTOCOL_PYTHON }}" scripts/ops/verify_uat_release.py \
            --run-live-model-checks "${{ steps.verification-plan.outputs.run_live_model_checks }}" \
            --backend-url "${{ steps.current-state.outputs.backend_url }}" \
            --frontend-url "${{ env.APP_FRONTEND_ORIGIN }}" \
            --protocol-env consent-protocol/.env \
            --web-env hushh-webapp/.env.local \
            --report-path /tmp/uat-release-verify-attempt-2.json

      - name: Verify reviewer BYOK navigation and cold re-unlock
        id: verify-reviewer-byok
        if: steps.verification-plan.outputs.run_reviewer_byok == 'true' && (steps.verify-uat-1.outcome == 'success' || steps.verify-uat-2.outcome == 'success')
        continue-on-error: true
        shell: bash
        env:
          REVIEWER_APP_ORIGIN: ${{ env.APP_FRONTEND_ORIGIN }}
          REVIEWER_APP_ROUTES: /,/one/kai?tab=portfolio,/one/pkm
          REVIEWER_SECRET_PROJECT: ${{ env.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          passes=1
          if [ "${{ inputs.repeat_reviewer_byok }}" = "true" ]; then passes=2; fi
          {
            for ((pass = 1; pass <= passes; pass++)); do
              printf 'Reviewer BYOK acceptance pass %s/%s\n' "$pass" "$passes"
              node .agents/skills/reviewer-app-testing/scripts/verify-reviewer-byok-navigation.mjs
              echo "passes_completed=$pass" >> "$GITHUB_OUTPUT"
            done
          } 2>&1 | tee /tmp/uat-reviewer-byok.log

      - name: Verify live PWM streaming, reviewed save and cold readback
        id: verify-pwm-acceptance
        if: inputs.run_pwm_acceptance && (steps.verify-uat-1.outcome == 'success' || steps.verify-uat-2.outcome == 'success')
        continue-on-error: true
        timeout-minutes: 25
        env:
          REVIEWER_APP_ORIGIN: ${{ env.APP_FRONTEND_ORIGIN }}
          REVIEWER_SECRET_PROJECT: ${{ env.GCP_PROJECT_ID }}
          REVIEWER_AUTH_MODE: custom_token
          REVIEWER_ALLOW_SHARED_MUTATIONS: "true"
          PWM_EXPECTED_EMAILS: ${{ inputs.pwm_expected_emails }}
          PWM_OWNER_CONFIRMED_PROFILE: ${{ inputs.pwm_owner_confirmed_profile }}
          PWM_EVIDENCE_PUBLIC_KEY: ${{ inputs.pwm_evidence_public_key }}
          PWM_PROOF_OUTPUT: ${{ github.workspace }}/tmp/pwm-acceptance.sealed.json
        run: node .agents/skills/reviewer-app-testing/scripts/verify-reviewer-pwm.mjs

      - name: Upload sealed PWM acceptance evidence
        if: always() && inputs.run_pwm_acceptance
        uses: actions/upload-artifact@v6
        with:
          name: pwm-acceptance-sealed
          path: tmp/pwm-acceptance.sealed.json
          if-no-files-found: error
          retention-days: 3

      - name: Classify UAT release outcome
        if: always()
        id: classify-uat-release
        shell: bash
        env:
          FRONTEND_IMAGE_CHECK_OUTCOME: ${{ steps.check-frontend-image.outcome }}
          DEPLOY_BACKEND: ${{ steps.scope.outputs.deploy_backend }}
          DEPLOY_FRONTEND: ${{ steps.scope.outputs.deploy_frontend }}
          PARITY_ATTEMPT_1: ${{ steps.verify-parity-1.outcome }}
          PARITY_ATTEMPT_2: ${{ steps.verify-parity-2.outcome }}
          BACKEND_PROVENANCE_OUTCOME: ${{ steps.verify-backend-provenance.outcome }}
          FRONTEND_PROVENANCE_OUTCOME: ${{ steps.verify-frontend-provenance.outcome }}
          DB_OUTCOME: ${{ steps.postdeploy-db-gate.outcome }}
          SEMANTIC_ATTEMPT_1: ${{ steps.verify-uat-1.outcome }}
          SEMANTIC_ATTEMPT_2: ${{ steps.verify-uat-2.outcome }}
          REVIEWER_BYOK_OUTCOME: ${{ steps.verify-reviewer-byok.outcome }}
          REVIEWER_BYOK_REQUIRED: ${{ steps.verification-plan.outputs.run_reviewer_byok }}
          PWM_ACCEPTANCE_REQUIRED: ${{ inputs.run_pwm_acceptance }}
          PWM_ACCEPTANCE_OUTCOME: ${{ steps.verify-pwm-acceptance.outcome }}
          PASSKEY_ASSOCIATIONS_OUTCOME: ${{ steps.verify-passkey-associations.outcome }}
          ANALYTICS_SMOKE_OUTCOME: ${{ steps.verify-analytics-uat.outcome }}
          PKM_EVALUATOR_RUNS: ${{ steps.verification-plan.outputs.pkm_evaluator_runs }}
          PKM_EVALUATOR_OUTCOME: ${{ steps.verify-candidate-pkm-evaluator.outputs.outcome }}
          VERIFICATION_PLAN_REASON: ${{ steps.verification-plan.outputs.reason }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          def load_json(path: str) -> dict:
              candidate = Path(path)
              if not candidate.exists():
                  return {}
              try:
                  parsed = json.loads(candidate.read_text(encoding="utf-8"))
              except json.JSONDecodeError:
                  return {}
              return parsed if isinstance(parsed, dict) else {}

          def has_runtime_failures(entries: list[dict]) -> bool:
              return any(str(entry.get("status")) in {"missing", "legacy"} for entry in entries)

          def append_unique(target: list[str], values: list[str]) -> None:
              for value in values:
                  if value and value not in target:
                      target.append(value)

          parity_report = load_json("/tmp/uat-runtime-parity-attempt-2.json") or load_json(
              "/tmp/uat-runtime-parity-attempt-1.json"
          )
          backend_provenance_report = load_json("/tmp/uat-backend-provenance.json")
          frontend_provenance_report = load_json("/tmp/uat-frontend-provenance.json")
          semantic_report = load_json("/tmp/uat-release-verify-attempt-2.json") or load_json(
              "/tmp/uat-release-verify-attempt-1.json"
          )
          semantic_report_present = bool(semantic_report)

          parity_success = os.environ.get("PARITY_ATTEMPT_1") == "success" or os.environ.get("PARITY_ATTEMPT_2") == "success"
          backend_provenance_success = (
              os.environ.get("DEPLOY_BACKEND") != "true"
              or os.environ.get("BACKEND_PROVENANCE_OUTCOME") == "success"
          )
          frontend_provenance_success = (
              os.environ.get("DEPLOY_FRONTEND") != "true"
              or os.environ.get("FRONTEND_PROVENANCE_OUTCOME") == "success"
          )
          db_outcome = os.environ.get("DB_OUTCOME", "")
          semantic_required = db_outcome != "failure"
          semantic_success = (
              not semantic_required
              or os.environ.get("SEMANTIC_ATTEMPT_1") == "success"
              or os.environ.get("SEMANTIC_ATTEMPT_2") == "success"
          )
          browser_authority_ready = semantic_required and semantic_success
          reviewer_byok_required = os.environ.get("REVIEWER_BYOK_REQUIRED") == "true"
          reviewer_byok_success = (
              not reviewer_byok_required
              or not browser_authority_ready
              or os.environ.get("REVIEWER_BYOK_OUTCOME") == "success"
          )
          passkey_associations_required = os.environ.get("DEPLOY_FRONTEND") == "true"
          passkey_associations_success = (
              not passkey_associations_required
              or os.environ.get("PASSKEY_ASSOCIATIONS_OUTCOME") == "success"
          )
          analytics_smoke_required = os.environ.get("DEPLOY_FRONTEND") == "true"
          analytics_smoke_success = (
              not analytics_smoke_required
              or os.environ.get("ANALYTICS_SMOKE_OUTCOME") == "success"
          )

          blocking: list[str] = []
          pwm_required = os.environ.get("PWM_ACCEPTANCE_REQUIRED") == "true"
          pwm_success = not pwm_required or os.environ.get("PWM_ACCEPTANCE_OUTCOME") == "success"
          if not pwm_success:
              blocking.append("pwm_acceptance_failed")
          backend_failure = False
          frontend_failure = False

          required = parity_report.get("required") or {}
          missing_secrets = set(parity_report.get("missing_secrets") or [])
          backend_secret_names = set(
              required.get("backend", [])
              + required.get("gmail", [])
              + required.get("one_email", [])
              + required.get("calendar", [])
              + required.get("plaid", [])
              + required.get("market", [])
          )
          frontend_secret_names = set(required.get("frontend", []))

          runtime_contract = parity_report.get("runtime_contract") or {}
          frontend_runtime_entries = runtime_contract.get("frontend") or []
          backend_runtime_entries = (
              (runtime_contract.get("backend") or [])
              + (runtime_contract.get("backend_gmail") or [])
              + (runtime_contract.get("backend_calendar") or [])
              + (runtime_contract.get("backend_one_email") or [])
          )

          if not parity_success:
              append_unique(blocking, list(parity_report.get("classifications") or ["runtime_mount_missing"]))
          if missing_secrets & backend_secret_names:
              backend_failure = True
          if missing_secrets & frontend_secret_names:
              frontend_failure = True
          if has_runtime_failures(frontend_runtime_entries):
              frontend_failure = True
          if has_runtime_failures(backend_runtime_entries):
              backend_failure = True

          if not backend_provenance_success:
              append_unique(
                  blocking,
                  list(backend_provenance_report.get("classifications") or ["deploy_authority_drift"]),
              )
              backend_failure = True
          if not frontend_provenance_success:
              append_unique(
                  blocking,
                  list(frontend_provenance_report.get("classifications") or ["deploy_authority_drift"]),
              )
              frontend_failure = True

          semantic_failures = set(semantic_report.get("failures") or [])
          # Checks the verifier itself classified as an EXTERNAL provider outage.
          # They are reported and alerted on, but they do not block: a provider
          # being down is not evidence that this candidate is bad.
          semantic_degraded = sorted(semantic_report.get("degraded") or [])
          advisory_semantic_failures = sorted(
              item for item in semantic_failures if item.startswith("signed_in_routes:")
          )
          blocking_semantic_failures = {
              item for item in semantic_failures if not item.startswith("signed_in_routes:")
          }
          if not semantic_success:
              if not semantic_report_present:
                  append_unique(blocking, ["semantic_verifier_failed"])
              if blocking_semantic_failures:
                  append_unique(blocking, ["runtime_behavior_failed"])
              if "smoke_auth" in blocking_semantic_failures:
                  append_unique(blocking, ["smoke_overlay_dependency_leak"])
              if blocking_semantic_failures & {"backend_health", "smoke_auth", "gmail_status", "location_command_recovery"}:
                  backend_failure = True
              if "frontend_login" in blocking_semantic_failures:
                  frontend_failure = True

          if db_outcome == "failure":
              append_unique(blocking, ["db_contract_drift"])
              backend_failure = True

          # Advisory, like candidate_pkm_evaluator. This lane arms on ANY path
          # under lib/vault, components/vault or lib/testing changed since the
          # last successful deploy -- including one-line copy edits -- and it
          # then waits for a passphrase prompt the reviewer account cannot
          # raise, because that account has no vault on UAT. On 2026-08-18 a
          # six-line copy change armed it and blocked three consecutive
          # releases from three different branches. A reviewer-fixture gap must
          # not roll back a verified release; it is still reported, and the
          # harness reports an un-provisioned reviewer separately from a real
          # regression, so a broken prompt is still visible here as a warning.

          if not passkey_associations_success:
              append_unique(blocking, ["passkey_domain_association_failed"])
              frontend_failure = True

          if not analytics_smoke_success:
              append_unique(blocking, ["analytics_transport_failed"])
              frontend_failure = True
              if os.environ.get("DEPLOY_BACKEND") == "true":
                  backend_failure = True

          if os.environ.get("FRONTEND_IMAGE_CHECK_OUTCOME") == "failure":
              append_unique(blocking, ["frontend_image_build_failed"])
              # This check precedes lifecycle and serving mutations.
              backend_failure = False
              frontend_failure = False

          blocking = list(dict.fromkeys(blocking))
          release_failed = bool(blocking)

          payload = {
              "status": "blocked" if release_failed else "healthy",
              "release_failed": release_failed,
              "pwm_acceptance": {
                  "required": pwm_required,
                  "success": pwm_success,
                  "outcome": os.environ.get("PWM_ACCEPTANCE_OUTCOME") or "not_run",
              },
              "blocking_classifications": blocking,
              "backend_failure": backend_failure,
              "frontend_failure": frontend_failure,
              "parity": {
                  "attempt_1": os.environ.get("PARITY_ATTEMPT_1", ""),
                  "attempt_2": os.environ.get("PARITY_ATTEMPT_2", ""),
                  "success": parity_success,
              },
              "provenance": {
                  "backend": {
                      "outcome": os.environ.get("BACKEND_PROVENANCE_OUTCOME", ""),
                      "success": backend_provenance_success,
                      "report": backend_provenance_report,
                  },
                  "frontend": {
                      "outcome": os.environ.get("FRONTEND_PROVENANCE_OUTCOME", ""),
                      "success": frontend_provenance_success,
                      "report": frontend_provenance_report,
                  },
              },
              "semantic": {
                  "required": semantic_required,
                  "attempt_1": os.environ.get("SEMANTIC_ATTEMPT_1", ""),
                  "attempt_2": os.environ.get("SEMANTIC_ATTEMPT_2", ""),
                  "success": semantic_success,
                  "report_present": semantic_report_present,
                  "failures": sorted(semantic_failures),
                  "blocking_failures": sorted(blocking_semantic_failures),
                  "advisory_failures": advisory_semantic_failures,
                  "degraded_capabilities": semantic_degraded,
              },
              "dependency_health": {
                  # A release can be simultaneously correct and not fully
                  # functional. Saying so is more useful than forcing that state
                  # into either "success" or "failure".
                  "degraded": bool(semantic_degraded),
                  "degraded_capabilities": semantic_degraded,
              },
              "db_contract": {
                  "outcome": db_outcome,
              },
              "reviewer_byok": {
                  "required": reviewer_byok_required,
                  "authority_ready": browser_authority_ready,
                  "skipped_reason": "" if browser_authority_ready or not reviewer_byok_required else "upstream_authority_failed",
                  "outcome": os.environ.get("REVIEWER_BYOK_OUTCOME", ""),
                  "success": reviewer_byok_success,
                  "advisory": True,
                  "warning": not reviewer_byok_success,
              },
              "passkey_domain_associations": {
                  "required": passkey_associations_required,
                  "outcome": os.environ.get("PASSKEY_ASSOCIATIONS_OUTCOME", ""),
                  "success": passkey_associations_success,
              },
              "analytics_smoke": {
                  "required": analytics_smoke_required,
                  "outcome": os.environ.get("ANALYTICS_SMOKE_OUTCOME", ""),
                  "success": analytics_smoke_success,
              },
              "candidate_pkm_evaluator": {
                  "required": int(os.environ.get("PKM_EVALUATOR_RUNS") or "0") != 0,
                  "outcome": (os.environ.get("PKM_EVALUATOR_OUTCOME") or "not_run")
                  if int(os.environ.get("PKM_EVALUATOR_RUNS") or "0") != 0 else "skipped",
                  "advisory": True,
                  "warning": os.environ.get("PKM_EVALUATOR_OUTCOME") == "failure",
              },
              "verification_plan": {
                  "reason": os.environ.get("VERIFICATION_PLAN_REASON", ""),
                  "pkm_evaluator_runs": int(os.environ.get("PKM_EVALUATOR_RUNS") or "0"),
              },
          }

          Path("/tmp/uat-release-classification.json").write_text(
              json.dumps(payload, indent=2), encoding="utf-8"
          )

          output_path = Path(os.environ["GITHUB_OUTPUT"])
          with output_path.open("a", encoding="utf-8") as handle:
              handle.write(f"release_failed={'true' if release_failed else 'false'}\n")
              handle.write(f"backend_failure={'true' if backend_failure else 'false'}\n")
              handle.write(f"frontend_failure={'true' if frontend_failure else 'false'}\n")
              handle.write(f"blocking_classifications={','.join(blocking)}\n")
              handle.write(f"parity_success={'true' if parity_success else 'false'}\n")
              handle.write(f"provenance_success={'true' if backend_provenance_success and frontend_provenance_success else 'false'}\n")
              handle.write(f"semantic_success={'true' if semantic_success else 'false'}\n")
              handle.write(f"reviewer_byok_success={'true' if reviewer_byok_success else 'false'}\n")
              handle.write(f"passkey_associations_success={'true' if passkey_associations_success else 'false'}\n")
          PY

      - name: Roll back backend revision
        id: rollback-backend
        if: always() && steps.classify-uat-release.outputs.release_failed == 'true' && steps.classify-uat-release.outputs.backend_failure == 'true' && steps.scope.outputs.deploy_backend == 'true' && steps.rollback-targets.outputs.backend_revision != ''
        shell: bash
        run: |
          set -euo pipefail
          rollback_revision="${{ steps.rollback-targets.outputs.backend_revision }}"
          gcloud run services describe "${{ env.BACKEND_SERVICE }}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --region="${{ env.GCP_REGION }}" \
            --format=json > /tmp/uat-backend-prerollback-service.json
          serving_revision="$(python3 - <<'PY'
          import json
          from pathlib import Path

          service = json.loads(
              Path('/tmp/uat-backend-prerollback-service.json').read_text(encoding='utf-8')
          )
          status = service.get('status') or {}
          positive = [
              item for item in (status.get('traffic') or [])
              if isinstance(item, dict) and int(item.get('percent') or 0) > 0
          ]
          if len(positive) != 1:
              raise SystemExit('Cannot authorize rollback from ambiguous backend traffic')
          revision = str(positive[0].get('revisionName') or '').strip()
          if not revision and positive[0].get('latestRevision'):
              revision = str(status.get('latestReadyRevisionName') or '').strip()
          if not revision:
              raise SystemExit('Cannot resolve current backend revision for rollback')
          print(revision)
          PY
          )"
          if [ "${serving_revision}" = "${rollback_revision}" ]; then
            echo "Backend rollback target already serves 100% traffic; no traffic mutation required."
            exit 0
          fi
          if [ "${{ steps.predeploy-db-gate.outcome }}" != "success" ]; then
            echo "Refusing backend rollback after an unproven migration boundary." >&2
            exit 1
          fi

          rollback_contract="$(gcloud run revisions describe "${rollback_revision}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --region="${{ env.GCP_REGION }}" \
            --format='value(metadata.labels.account-deletion-contract)' 2>/dev/null || true)"
          DB_USER="$(gcloud secrets versions access latest --secret=DB_USER --project="${{ env.GCP_PROJECT_ID }}")"
          DB_PASSWORD="$(gcloud secrets versions access latest --secret=DB_PASSWORD --project="${{ env.GCP_PROJECT_ID }}")"
          echo "::add-mask::${DB_USER}"
          echo "::add-mask::${DB_PASSWORD}"
          cloud-sql-proxy \
            --address 127.0.0.1 \
            --port 6543 \
            ${GOOGLE_GHA_CREDS_PATH:+--credentials-file="${GOOGLE_GHA_CREDS_PATH}"} \
            "${{ env.UAT_CLOUDSQL_INSTANCE }}" >/tmp/cloud-sql-proxy-uat-rollback.log 2>&1 &
          PROXY_PID=$!
          trap 'kill "${PROXY_PID}" >/dev/null 2>&1 || true' EXIT
          python3 - <<'PY'
          import socket
          import time

          deadline = time.time() + 20
          while time.time() < deadline:
              with socket.socket() as sock:
                  sock.settimeout(0.5)
                  if sock.connect_ex(("127.0.0.1", 6543)) == 0:
                      raise SystemExit(0)
              time.sleep(0.25)
          raise SystemExit("Cloud SQL proxy did not bind for rollback authorization")
          PY
          export PGHOST=127.0.0.1
          export PGPORT=6543
          export PGDATABASE=postgres
          export PGUSER="$DB_USER"
          export PGPASSWORD="$DB_PASSWORD"
          if [ "${{ steps.account-deletion-fence-decision.outputs.required }}" = "true" ] \
             || [ "${rollback_contract}" != "v201" ]; then
            psql --no-psqlrc \
              --file deploy/account-deletion/install_release_fence.sql \
              > /tmp/uat-account-deletion-fence-rollback.log
          fi
          tombstone_count="$(psql --no-psqlrc --tuples-only --no-align \
            --command 'SELECT count(*) FROM public.account_deletion_tombstones')"
          if [[ ! "${tombstone_count}" =~ ^[0-9]+$ ]]; then
            echo "Cannot authorize backend rollback without a tombstone count." >&2
            exit 1
          fi
          if [ "${rollback_contract}" != "v201" ] && [ "${tombstone_count}" != "0" ]; then
            echo "Refusing rollback to a pre-v201 backend after an account tombstone exists." >&2
            exit 1
          fi
          bash scripts/ci/cloudrun-rollback.sh \
            "${{ env.BACKEND_SERVICE }}" \
            "${{ env.GCP_REGION }}" \
            "${rollback_revision}"

      - name: Roll back frontend revision
        id: rollback-frontend
        if: always() && steps.classify-uat-release.outputs.release_failed == 'true' && steps.classify-uat-release.outputs.frontend_failure == 'true' && steps.scope.outputs.deploy_frontend == 'true' && steps.rollback-targets.outputs.frontend_revision != ''
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/cloudrun-rollback.sh "${{ env.FRONTEND_SERVICE }}" "${{ env.GCP_REGION }}" "${{ steps.rollback-targets.outputs.frontend_revision }}"

      - name: Activate tombstone-aware account deletion
        id: activate-account-deletion
        if: steps.classify-uat-release.outputs.release_failed == 'false' && steps.scope.outputs.deploy_backend == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 deploy/account-deletion/activate_release.py \
            --project "${{ env.GCP_PROJECT_ID }}" --region "${{ env.GCP_REGION }}" \
            --backend-service "${{ env.BACKEND_SERVICE }}" \
            --backend-url "${{ env.CONSENT_API_PUBLIC_ORIGIN }}" \
            --oidc-audience "${{ env.CONSENT_API_PUBLIC_ORIGIN }}" \
            --scheduler-job "account-deletion-cleanup-uat" \
            --scheduler-service-account "${{ env.ACCOUNT_DELETION_SCHEDULER_SERVICE_ACCOUNT_ID }}" \
            --expected-sha "${{ steps.resolve-sha.outputs.sha }}" --expected-run-id "${{ github.run_id }}" \
            --cloudsql-instance "${{ env.UAT_CLOUDSQL_INSTANCE }}" \
            --fence-required "${{ steps.account-deletion-fence-decision.outputs.required }}" \
            --evidence-prefix /tmp/uat-account-deletion
          echo "activated=true" >> "$GITHUB_OUTPUT"

      - name: Activate scheduled mail drain
        id: activate-scheduled-mail-drain
        if: steps.classify-uat-release.outputs.release_failed == 'false'
        shell: bash
        env:
          BACKEND_URL: ${{ env.CONSENT_API_PUBLIC_ORIGIN }}
          OIDC_AUDIENCE: ${{ env.CONSENT_API_PUBLIC_ORIGIN }}
          PROJECT_ID: ${{ env.GCP_PROJECT_ID }}
          SCHEDULER_LOCATION: ${{ env.GCP_REGION }}
          SCHEDULER_SERVICE_ACCOUNT_NAME: mail-scheduled-send
          JOB_NAME: mail-scheduled-send-uat
          BATCH_LIMIT: "50"
          MAIL_SCHEDULED_DRAIN_ENABLED: ${{ vars.MAIL_SCHEDULED_DRAIN_ENABLED_UAT || 'true' }}
        run: |
          set -euo pipefail
          bash deploy/gmail/setup_scheduled_mail_scheduler.sh \
            | tee /tmp/uat-scheduled-mail-scheduler-setup.log

          if [[ "${MAIL_SCHEDULED_DRAIN_ENABLED}" != "true" ]]; then
            if gcloud scheduler jobs describe "${JOB_NAME}" \
              --project="${PROJECT_ID}" \
              --location="${SCHEDULER_LOCATION}" \
              --format='value(state)' > /tmp/uat-scheduled-mail-scheduler-state.txt 2>/dev/null \
              && [[ "$(cat /tmp/uat-scheduled-mail-scheduler-state.txt)" != "PAUSED" ]]; then
              echo "Scheduled mail drain kill switch did not pause ${JOB_NAME}" >&2
              exit 1
            fi
            echo "Scheduled mail drain disabled by vars.MAIL_SCHEDULED_DRAIN_ENABLED_UAT"
            exit 0
          fi

          gcloud scheduler jobs describe "${JOB_NAME}" \
            --project="${PROJECT_ID}" \
            --location="${SCHEDULER_LOCATION}" \
            --format=json > /tmp/uat-scheduled-mail-scheduler-config.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          job = json.loads(
              Path('/tmp/uat-scheduled-mail-scheduler-config.json').read_text(
                  encoding='utf-8'
              )
          )
          target = job.get('httpTarget') or {}
          oidc = target.get('oidcToken') or {}
          expected_uri = (
              'https://api.uat.hushh.ai/api/one/email/scheduled/drain?limit=50'
          )
          expected_service_account_email = (
              f"{os.environ['SCHEDULER_SERVICE_ACCOUNT_NAME']}@"
              f"{os.environ['PROJECT_ID']}.iam.gserviceaccount.com"
          )
          checks = {
              'enabled': job.get('state') == 'ENABLED',
              'schedule': job.get('schedule') == '* * * * *',
              'method': target.get('httpMethod') == 'POST',
              'uri': target.get('uri') == expected_uri,
              'service_account': oidc.get('serviceAccountEmail')
              == expected_service_account_email,
              'audience': oidc.get('audience') == 'https://api.uat.hushh.ai',
          }
          if not all(checks.values()):
              raise SystemExit('Scheduled mail drain scheduler configuration drifted')
          PY

      - name: Activate PWM completion notifications
        id: activate-pwm-notifications
        if: steps.scope.outputs.deploy_backend == 'true' && steps.classify-uat-release.outputs.release_failed != 'true' && steps.activate-account-deletion.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          ONE_PROFILE_RESEARCH_ENABLED: ${{ vars.ONE_PROFILE_RESEARCH_ENABLED_UAT || 'false' }}
        run: |
          set -euo pipefail
          bash deploy/pwm/setup_notification_scheduler.sh | tee /tmp/uat-pwm-notifications-setup.log

      - name: Upload PWM scheduler verification
        if: always() && steps.scope.outputs.deploy_backend == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: uat-pwm-notification-scheduler
          path: /tmp/uat-pwm-notifications-setup.log
          if-no-files-found: warn

      - name: Activate personal Gmail monitor
        id: activate-personal-gmail-monitor
        if: steps.classify-uat-release.outputs.release_failed == 'false' && steps.scope.outputs.deploy_backend == 'true'
        shell: bash
        env:
          BACKEND_URL: ${{ env.CONSENT_API_PUBLIC_ORIGIN }}
          PROJECT_ID: ${{ env.GCP_PROJECT_ID }}
          SCHEDULER_LOCATION: ${{ env.GCP_REGION }}
          SCHEDULER_SERVICE_ACCOUNT_NAME: ${{ env.GMAIL_PERSONAL_INFORMATION_REQUEST_MONITOR_SCHEDULER_SERVICE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          bash deploy/gmail/setup_personal_information_request_monitor_scheduler.sh \
            | tee /tmp/uat-personal-gmail-monitor-scheduler-setup.log

      - name: Capture Drive scheduler before worker rollout
        id: capture-drive-worker-scheduler
        if: inputs.preserve_paused_drive_worker != true && steps.classify-uat-release.outputs.release_failed == 'false' && steps.scope.outputs.deploy_backend == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gcloud scheduler jobs list \
            --project="${{ env.GCP_PROJECT_ID }}" --location="${{ env.GCP_REGION }}" \
            --format=json > /tmp/uat-drive-worker-pre-scheduler.json
          WORKER_ORIGIN="$(gcloud run services describe consent-protocol-drive-worker \
            --project="${{ env.GCP_PROJECT_ID }}" --region="${{ env.GCP_REGION }}" \
            --format='value(status.url)' 2>/dev/null || true)"
          python3 deploy/drive/verify_scheduler_state.py capture-set \
            --snapshot /tmp/uat-drive-worker-pre-scheduler.json \
            --canonical /tmp/uat-drive-worker-pre-scheduler-canonical.json \
            --worker-origin "$WORKER_ORIGIN" \
            --github-output "$GITHUB_OUTPUT"

      - name: Deploy and attest private Drive worker
        id: deploy-drive-worker
        if: always() && !cancelled() && inputs.preserve_paused_drive_worker != true && steps.classify-uat-release.outputs.release_failed == 'false' && steps.scope.outputs.deploy_backend == 'true'
        shell: bash
        env:
          IMAGE_REFERENCE: ${{ steps.build-backend-image.outputs.image_reference }}
          DEPLOY_SHA: ${{ steps.resolve-sha.outputs.sha }}
          RUNTIME_SERVICE_ACCOUNT: ${{ env.RUNTIME_SERVICE_ACCOUNT }}
          CLOUDSQL_INSTANCE: ${{ env.UAT_CLOUDSQL_INSTANCE }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          DRIVE_WORK_DRAIN_ENABLED: 'true'
          PROTECTED_DOCUMENT_DELIVERY_ENABLED: ${{ steps.document-mode.outputs.enabled || 'false' }}
          DRIVE_REQUEST_PAYMENTS_UAT_ENABLED: ${{ vars.DRIVE_REQUEST_PAYMENTS_UAT_ENABLED || 'false' }}
          DRIVE_REQUEST_OWNER_PAYOUTS_UAT_ENABLED: ${{ vars.DRIVE_REQUEST_OWNER_PAYOUTS_UAT_ENABLED || 'false' }}
          STRIPE_UAT_MODE: ${{ vars.STRIPE_UAT_MODE || 'test' }}
          STRIPE_CONNECT_UAT_MODE: ${{ vars.STRIPE_CONNECT_UAT_MODE || vars.STRIPE_UAT_MODE || 'test' }}
          DRIVE_REQUEST_SEMANTIC_SEARCH_UAT_ENABLED: ${{ vars.DRIVE_REQUEST_SEMANTIC_SEARCH_UAT_ENABLED || 'true' }}
          DRIVE_REQUEST_SEMANTIC_MODEL_PROVIDER_UAT: ${{ vars.DRIVE_REQUEST_SEMANTIC_MODEL_PROVIDER_UAT || 'gemini' }}
          DRIVE_REQUEST_HASHCOINS_UAT_ENABLED: ${{ vars.DRIVE_REQUEST_HASHCOINS_UAT_ENABLED || 'false' }}
          DRIVE_REQUEST_HASHCOINS_LIVE_UAT_ENABLED: ${{ vars.DRIVE_REQUEST_HASHCOINS_LIVE_UAT_ENABLED || 'false' }}
        run: |
          set -euo pipefail
          if [ "${{ steps.capture-drive-worker-scheduler.outcome }}" != "success" ]; then
            echo "Drive scheduler pre-worker snapshot failed; triggering runtime rollback" >&2
            exit 1
          fi
          exec > >(tee /tmp/uat-drive-worker-release.log) 2>&1
          exec bash deploy/drive/deploy_worker_service.sh

      - name: Recover eligible pending UAT text requests
        id: recover-uat-text-requests
        if: success() && inputs.preserve_paused_drive_worker != true && steps.deploy-drive-worker.outcome == 'success' && steps.scope.outputs.deploy_backend == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ops/run_uat_text_recovery_job.py \
            --service-json /tmp/uat-backend-promoted-service.json \
            --sha "${{ steps.resolve-sha.outputs.sha }}" --run-id "${{ github.run_id }}"

      - name: Verify paused Drive maintenance unchanged
        id: verify-paused-drive-maintenance
        if: always() && !cancelled() && inputs.preserve_paused_drive_worker == true && steps.classify-uat-release.outputs.release_failed == 'false' && steps.scope.outputs.deploy_backend == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.capture-paused-drive-maintenance.outcome }}" != "success" ]; then
            echo "No validated paused Drive baseline; refusing release" >&2
            exit 1
          fi
          gcloud scheduler jobs list \
            --project="${{ env.GCP_PROJECT_ID }}" --location="${{ env.GCP_REGION }}" \
            --format=json > /tmp/uat-paused-drive-post-scheduler.json
          gcloud run services describe consent-protocol-drive-worker \
            --project="${{ env.GCP_PROJECT_ID }}" --region="${{ env.GCP_REGION }}" \
            --format=json > /tmp/uat-paused-drive-post-worker.json
          python3 deploy/drive/attest_paused_maintenance.py verify \
            --scheduler-snapshot /tmp/uat-paused-drive-post-scheduler.json \
            --worker-snapshot /tmp/uat-paused-drive-post-worker.json \
            --baseline /tmp/uat-paused-drive-baseline.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Pause Data packets scheduler when UAT activation is off
        id: pause-drive-groups
        if: always() && !cancelled() && inputs.preserve_paused_drive_worker != true && vars.DRIVE_FOUR_GROUP_INDEX_UAT_ENABLED != 'true' && steps.classify-uat-release.outputs.release_failed == 'false' && steps.scope.outputs.deploy_backend == 'true' && steps.deploy-drive-worker.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          snapshot=/tmp/uat-drive-v1-before-groups.json
          python3 deploy/drive/v1_scheduler_state.py capture-if-present --stage groups --snapshot "${snapshot}"
          if ! python3 deploy/drive/v1_scheduler_state.py quarantine --stage groups; then
            python3 deploy/drive/v1_scheduler_state.py restore --stage groups --snapshot "${snapshot}"
            exit 1
          fi

      - name: Deploy isolated V1 Drive worker while legacy jobs stay paused
        id: deploy-drive-v1-worker
        if: always() && !cancelled() && (inputs.preserve_paused_drive_worker == true || vars.DRIVE_FOUR_GROUP_INDEX_UAT_ENABLED == 'true') && steps.classify-uat-release.outputs.release_failed == 'false' && steps.scope.outputs.deploy_backend == 'true' && (inputs.preserve_paused_drive_worker != true || steps.verify-paused-drive-maintenance.outcome == 'success') && (inputs.preserve_paused_drive_worker == true || steps.deploy-drive-worker.outcome == 'success') && steps.activate-account-deletion.outcome == 'success' && steps.activate-personal-gmail-monitor.outcome == 'success' && steps.activate-pwm-notifications.outcome == 'success'
        shell: bash
        env:
          DRIVE_WORK_DRAIN_ENABLED: ${{ vars.DRIVE_V1_WORK_DRAIN_UAT_ENABLED || 'true' }}
          DRIVE_FOUR_GROUP_INDEX_UAT_ENABLED: ${{ vars.DRIVE_FOUR_GROUP_INDEX_UAT_ENABLED || 'false' }}
          IMAGE_REFERENCE: ${{ steps.build-backend-image.outputs.image_reference }}
          DEPLOY_SHA: ${{ steps.resolve-sha.outputs.sha }}
          RUNTIME_SERVICE_ACCOUNT: ${{ env.RUNTIME_SERVICE_ACCOUNT }}
          CLOUDSQL_INSTANCE: ${{ env.UAT_CLOUDSQL_INSTANCE }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          SNAPSHOT_PATH: /tmp/uat-drive-v1-before.json
          PREVIOUS_REVISION_PATH: /tmp/uat-drive-v1-previous-revision.txt
          DRIVE_REQUEST_PAYMENTS_UAT_ENABLED: ${{ vars.DRIVE_REQUEST_PAYMENTS_UAT_ENABLED || 'false' }}
          DRIVE_REQUEST_OWNER_PAYOUTS_UAT_ENABLED: ${{ vars.DRIVE_REQUEST_OWNER_PAYOUTS_UAT_ENABLED || 'false' }}
          STRIPE_UAT_MODE: ${{ vars.STRIPE_UAT_MODE || 'test' }}
          STRIPE_CONNECT_UAT_MODE: ${{ vars.STRIPE_CONNECT_UAT_MODE || vars.STRIPE_UAT_MODE || 'test' }}
          DRIVE_REQUEST_SEMANTIC_SEARCH_UAT_ENABLED: ${{ vars.DRIVE_REQUEST_SEMANTIC_SEARCH_UAT_ENABLED || 'true' }}
          DRIVE_REQUEST_SEMANTIC_MODEL_PROVIDER_UAT: ${{ vars.DRIVE_REQUEST_SEMANTIC_MODEL_PROVIDER_UAT || 'gemini' }}
          DRIVE_REQUEST_HASHCOINS_UAT_ENABLED: ${{ vars.DRIVE_REQUEST_HASHCOINS_UAT_ENABLED || 'false' }}
          DRIVE_REQUEST_HASHCOINS_LIVE_UAT_ENABLED: ${{ vars.DRIVE_REQUEST_HASHCOINS_LIVE_UAT_ENABLED || 'false' }}
        run: |
          set -euo pipefail
          exec > >(tee /tmp/uat-drive-v1-worker-release.log) 2>&1
          bash deploy/drive/deploy_v1_worker_service.sh
          revision="$(gcloud run services describe consent-protocol-drive-v1-worker \
            --project="${{ env.GCP_PROJECT_ID }}" --region="${{ env.GCP_REGION }}" --format=json \
            | python3 -c 'import json,sys; t=(json.load(sys.stdin).get("status") or {}).get("traffic") or []; r=[x.get("revisionName") for x in t if x.get("percent")==100]; print(r[0] if len(r)==1 else "")')"
          if [[ ! "${revision}" =~ ^consent-protocol-drive-v1-worker-[a-z0-9-]+$ ]]; then
            echo "V1 serving revision is ambiguous" >&2
            exit 1
          fi
          revision_sha="$(gcloud run revisions describe "${revision}" \
            --project="${{ env.GCP_PROJECT_ID }}" --region="${{ env.GCP_REGION }}" \
            --format='value(metadata.labels.deploy-sha)')"
          if [ "${revision_sha}" != "${DEPLOY_SHA}" ]; then
            echo "V1 serving revision SHA does not match the release" >&2
            exit 1
          fi
          echo "revision=${revision}" >> "$GITHUB_OUTPUT"
          echo "sha=${revision_sha}" >> "$GITHUB_OUTPUT"
          if [ "$DRIVE_WORK_DRAIN_ENABLED" = false ]; then
            echo "paused_drive_v1_unchanged=true" >> "$GITHUB_OUTPUT"
            echo "scheduler_http_200=false" >> "$GITHUB_OUTPUT"
          else
            echo "paused_drive_v1_unchanged=false" >> "$GITHUB_OUTPUT"
            echo "scheduler_http_200=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify legacy paused Drive state after V1 rollout
        id: verify-paused-drive-after-v1
        if: always() && !cancelled() && inputs.preserve_paused_drive_worker == true && steps.deploy-drive-v1-worker.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          gcloud scheduler jobs list \
            --project="${{ env.GCP_PROJECT_ID }}" --location="${{ env.GCP_REGION }}" \
            --format=json > /tmp/uat-paused-drive-after-v1-scheduler.json
          gcloud run services describe consent-protocol-drive-worker \
            --project="${{ env.GCP_PROJECT_ID }}" --region="${{ env.GCP_REGION }}" \
            --format=json > /tmp/uat-paused-drive-after-v1-worker.json
          python3 deploy/drive/attest_paused_maintenance.py verify \
            --scheduler-snapshot /tmp/uat-paused-drive-after-v1-scheduler.json \
            --worker-snapshot /tmp/uat-paused-drive-after-v1-worker.json \
            --baseline /tmp/uat-paused-drive-baseline.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Restore V1 lane if paired paused-state gate failed
        id: restore-drive-v1-after-postgate
        if: always() && inputs.preserve_paused_drive_worker == true && steps.deploy-drive-v1-worker.outcome == 'success' && steps.verify-paused-drive-after-v1.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          previous_revision="$(cat /tmp/uat-drive-v1-previous-revision.txt)"
          bash deploy/drive/restore_v1_worker.sh /tmp/uat-drive-v1-before.json "${previous_revision}"

      - name: Restore backend after Drive worker failure
        id: rollback-backend-after-drive-worker
        if: always() && steps.promote-uat-traffic.outcome != 'skipped' && steps.classify-uat-release.outputs.release_failed != 'true' && ((inputs.preserve_paused_drive_worker == true && (steps.verify-paused-drive-maintenance.outcome != 'success' || steps.deploy-drive-v1-worker.outcome != 'success' || steps.verify-paused-drive-after-v1.outcome != 'success')) || (inputs.preserve_paused_drive_worker != true && (steps.deploy-drive-worker.outcome != 'success' || (vars.DRIVE_FOUR_GROUP_INDEX_UAT_ENABLED != 'true' && steps.pause-drive-groups.outcome != 'success'))) || (vars.DRIVE_FOUR_GROUP_INDEX_UAT_ENABLED == 'true' && steps.deploy-drive-v1-worker.outcome != 'success')) && steps.scope.outputs.deploy_backend == 'true' && steps.rollback-targets.outputs.backend_revision != ''
        shell: bash
        env:
          PREDEPLOY_DB_GATE_OUTCOME: ${{ steps.predeploy-db-gate.outcome }}
        run: |
          set -euo pipefail
          bash deploy/drive/rollback_after_worker_failure.sh \
            "${{ env.BACKEND_SERVICE }}" "${{ steps.rollback-targets.outputs.backend_revision }}"

      - name: Verify isolated V1 lane rollback after failed rollout
        id: verify-drive-v1-worker-rollback
        if: always() && (inputs.preserve_paused_drive_worker == true || vars.DRIVE_FOUR_GROUP_INDEX_UAT_ENABLED == 'true') && steps.deploy-drive-v1-worker.outcome == 'failure' && steps.scope.outputs.deploy_backend == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s /tmp/uat-drive-v1-before.json ] || [ ! -f /tmp/uat-drive-v1-previous-revision.txt ]; then
            echo "V1 candidate failed before scheduler capture; no V1 scheduler was changed"
            exit 0
          fi
          previous_revision="$(cat /tmp/uat-drive-v1-previous-revision.txt)"
          bash deploy/drive/restore_v1_worker.sh /tmp/uat-drive-v1-before.json "${previous_revision}"

      - name: Restore frontend after Drive worker failure
        id: rollback-frontend-after-drive-worker
        if: always() && steps.promote-uat-traffic.outcome != 'skipped' && steps.classify-uat-release.outputs.release_failed != 'true' && ((inputs.preserve_paused_drive_worker == true && (steps.verify-paused-drive-maintenance.outcome != 'success' || steps.deploy-drive-v1-worker.outcome != 'success' || steps.verify-paused-drive-after-v1.outcome != 'success')) || (inputs.preserve_paused_drive_worker != true && (steps.deploy-drive-worker.outcome != 'success' || (vars.DRIVE_FOUR_GROUP_INDEX_UAT_ENABLED != 'true' && steps.pause-drive-groups.outcome != 'success'))) || (vars.DRIVE_FOUR_GROUP_INDEX_UAT_ENABLED == 'true' && steps.deploy-drive-v1-worker.outcome != 'success')) && steps.scope.outputs.deploy_backend == 'true' && steps.scope.outputs.deploy_frontend == 'true' && steps.rollback-targets.outputs.frontend_revision != ''
        shell: bash
        env:
          PREDEPLOY_DB_GATE_OUTCOME: ${{ steps.predeploy-db-gate.outcome }}
        run: |
          set -euo pipefail
          bash deploy/drive/rollback_after_worker_failure.sh \
            "${{ env.FRONTEND_SERVICE }}" "${{ steps.rollback-targets.outputs.frontend_revision }}"

      - name: Verify Drive scheduler after worker failure
        id: verify-drive-worker-scheduler-rollback
        if: always() && inputs.preserve_paused_drive_worker != true && steps.promote-uat-traffic.outcome != 'skipped' && steps.classify-uat-release.outputs.release_failed != 'true' && steps.deploy-drive-worker.outcome != 'success' && steps.scope.outputs.deploy_backend == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.capture-drive-worker-scheduler.outcome }}" != "success" ]; then
            echo "No validated scheduler baseline; worker rollout did not begin" >&2
            exit 1
          fi
          if ! gcloud scheduler jobs list \
              --project="${{ env.GCP_PROJECT_ID }}" --location="${{ env.GCP_REGION }}" \
              --format=json > /tmp/uat-drive-worker-post-scheduler.json; then
            python3 deploy/drive/work_drain_scheduler_snapshot.py quarantine
            exit 1
          fi
          WORKER_ORIGIN="$(gcloud run services describe consent-protocol-drive-worker \
            --project="${{ env.GCP_PROJECT_ID }}" --region="${{ env.GCP_REGION }}" \
            --format='value(status.url)' 2>/dev/null || true)"
          if ! python3 deploy/drive/verify_scheduler_state.py verify-set \
              --snapshot /tmp/uat-drive-worker-post-scheduler.json \
              --canonical /tmp/uat-drive-worker-pre-scheduler-canonical.json \
              --worker-origin "$WORKER_ORIGIN" \
              --github-output "$GITHUB_OUTPUT"; then
            python3 deploy/drive/work_drain_scheduler_snapshot.py quarantine
            echo "Drive scheduler set was not restored; exact jobs quarantined" >&2
            exit 1
          fi

      - name: Resolve final Cloud Run state
        if: always()
        id: final-state
        shell: bash
        run: |
          set -euo pipefail
          if ! gcloud run services describe "${{ env.BACKEND_SERVICE }}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --region="${{ env.GCP_REGION }}" \
            --format=json > /tmp/uat-backend-final-service.json 2>/dev/null; then
            printf '{}\n' > /tmp/uat-backend-final-service.json
          fi
          if ! gcloud run services describe "${{ env.FRONTEND_SERVICE }}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --region="${{ env.GCP_REGION }}" \
            --format=json > /tmp/uat-frontend-final-service.json 2>/dev/null; then
            printf '{}\n' > /tmp/uat-frontend-final-service.json
          fi
          python3 scripts/ci/resolve-cloud-run-serving-state.py \
            --service-json /tmp/uat-backend-final-service.json \
            --allow-missing \
            --github-output "$GITHUB_OUTPUT" \
            --output-prefix backend
          python3 scripts/ci/resolve-cloud-run-serving-state.py \
            --service-json /tmp/uat-frontend-final-service.json \
            --allow-missing \
            --github-output "$GITHUB_OUTPUT" \
            --output-prefix frontend
          for component in backend frontend; do
            if [ "${component}" = backend ]; then
              service_json=/tmp/uat-backend-final-service.json
            else
              service_json=/tmp/uat-frontend-final-service.json
            fi
            revision="$(python3 scripts/ci/resolve-cloud-run-serving-state.py \
              --service-json "${service_json}" --allow-missing \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["revision"])')"
            serving_sha=""
            if [ -n "${revision}" ]; then
              serving_sha="$(gcloud run revisions describe "${revision}" \
                --project="${{ env.GCP_PROJECT_ID }}" --region="${{ env.GCP_REGION }}" \
                --format='value(metadata.labels.deploy-sha)' 2>/dev/null || true)"
            fi
            echo "${component}_sha=${serving_sha}" >> "$GITHUB_OUTPUT"
          done

      - name: Write UAT release status artifact
        if: always()
        shell: bash
        env:
          VERIFICATION_PLAN_LANES: ${{ steps.verification-plan.outputs.lanes }}
        run: |
          set -euo pipefail
          BACKEND_ROLLBACK_REQUIRED=false
          FRONTEND_ROLLBACK_REQUIRED=false
          BACKEND_ROLLBACK_DONE=true
          FRONTEND_ROLLBACK_DONE=true
          DRIVE_WORKER_ROLLBACK_COMPLETE=true
          DRIVE_WORKER_GATE_SUCCESS=false

          if [ "${{ inputs.preserve_paused_drive_worker }}" = "true" ] \
             && [ "${{ steps.scope.outputs.deploy_backend }}" != "true" ]; then
            DRIVE_WORKER_GATE_SUCCESS=false
          elif [ "${{ steps.scope.outputs.deploy_backend }}" != "true" ]; then
            DRIVE_WORKER_GATE_SUCCESS=true
          elif [ "${{ inputs.preserve_paused_drive_worker }}" = "true" ]; then
            if [ "${{ steps.capture-paused-drive-maintenance.outcome }}" = "success" ] \
               && [ "${{ steps.capture-paused-drive-maintenance.outputs.paused_drive_baseline_captured }}" = "true" ] \
               && [ "${{ steps.verify-paused-drive-maintenance.outcome }}" = "success" ] \
               && [ "${{ steps.verify-paused-drive-maintenance.outputs.paused_drive_unchanged }}" = "true" ] \
               && [ "${{ steps.deploy-drive-v1-worker.outcome }}" = "success" ] \
               && [ "${{ steps.verify-paused-drive-after-v1.outcome }}" = "success" ] \
               && [ "${{ steps.verify-paused-drive-after-v1.outputs.paused_drive_unchanged }}" = "true" ] \
               && [ "${{ steps.deploy-drive-v1-worker.outputs.sha }}" = "${{ steps.resolve-sha.outputs.sha }}" ] \
               && { { [ "${{ vars.DRIVE_V1_WORK_DRAIN_UAT_ENABLED || 'true' }}" = "true" ] \
                      && [ "${{ steps.deploy-drive-v1-worker.outputs.scheduler_http_200 }}" = "true" ]; } \
                    || { [ "${{ vars.DRIVE_V1_WORK_DRAIN_UAT_ENABLED || 'true' }}" = "false" ] \
                         && [ "${{ steps.deploy-drive-v1-worker.outputs.paused_drive_v1_unchanged }}" = "true" ] \
                         && [ "${{ steps.deploy-drive-v1-worker.outputs.scheduler_http_200 }}" = "false" ]; }; }; then
              DRIVE_WORKER_GATE_SUCCESS=true
            fi
          elif [ "${{ steps.deploy-drive-worker.outcome }}" = "success" ]; then
            DRIVE_WORKER_GATE_SUCCESS=true
          fi
          if [ "${{ steps.scope.outputs.deploy_backend }}" = "true" ] \
             && [ "${{ vars.DRIVE_FOUR_GROUP_INDEX_UAT_ENABLED || 'false' }}" = "true" ] \
             && [ "${{ steps.deploy-drive-v1-worker.outcome }}" != "success" ]; then
            DRIVE_WORKER_GATE_SUCCESS=false
          fi
          if [ "${{ steps.scope.outputs.deploy_backend }}" = "true" ] \
             && [ "${{ inputs.preserve_paused_drive_worker }}" != "true" ] \
             && [ "${{ vars.DRIVE_FOUR_GROUP_INDEX_UAT_ENABLED || 'false' }}" != "true" ] \
             && [ "${{ steps.pause-drive-groups.outcome }}" != "success" ]; then
            DRIVE_WORKER_GATE_SUCCESS=false
          fi

          if [ "${{ steps.scope.outputs.deploy_backend }}" = "true" ] \
             && [ "$DRIVE_WORKER_GATE_SUCCESS" != true ]; then
            # A skipped/cancelled worker is not a completed rollback. Only
            # independent scheduler and serving-revision evidence can prove it.
            DRIVE_WORKER_ROLLBACK_COMPLETE=false
            if [ "${{ inputs.preserve_paused_drive_worker }}" != "true" ] \
               && [ "${{ steps.verify-drive-worker-scheduler-rollback.outcome }}" = "success" ] \
               && [ "${{ steps.verify-drive-worker-scheduler-rollback.outputs.restored }}" = "true" ] \
               && [ "${{ steps.rollback-targets.outputs.backend_revision }}" != "" ] \
               && [ "${{ steps.rollback-backend-after-drive-worker.outcome }}" = "success" ] \
               && [ "${{ steps.final-state.outputs.backend_revision }}" = "${{ steps.rollback-targets.outputs.backend_revision }}" ]; then
              if [ "${{ steps.scope.outputs.deploy_frontend }}" != "true" ] \
                 || { [ "${{ steps.rollback-targets.outputs.frontend_revision }}" != "" ] \
                   && [ "${{ steps.rollback-frontend-after-drive-worker.outcome }}" = "success" ] \
                   && [ "${{ steps.final-state.outputs.frontend_revision }}" = "${{ steps.rollback-targets.outputs.frontend_revision }}" ]; }; then
                DRIVE_WORKER_ROLLBACK_COMPLETE=true
              fi
            fi
          fi

          if [ "${{ inputs.preserve_paused_drive_worker }}" = "true" ] \
             && [ "${{ steps.scope.outputs.deploy_backend }}" != "true" ]; then
            STATUS="blocked"
          elif [ "${{ steps.classify-uat-release.outputs.release_failed }}" = "false" ]; then
            if [ "${{ steps.scope.outputs.deploy_backend }}" = "true" ] \
               && { [ "${{ steps.activate-account-deletion.outcome }}" != "success" ] \
                 || [ "${{ steps.activate-personal-gmail-monitor.outcome }}" != "success" ] \
                 || [ "${{ steps.activate-pwm-notifications.outcome }}" != "success" ] \
                 || [ "$DRIVE_WORKER_GATE_SUCCESS" != true ]; }; then
              STATUS="blocked"
            else
              STATUS="healthy"
            fi
          else
            if [ "${{ steps.classify-uat-release.outputs.backend_failure }}" = "true" ] && [ "${{ steps.scope.outputs.deploy_backend }}" = "true" ] && [ "${{ steps.rollback-targets.outputs.backend_revision }}" != "" ]; then
              BACKEND_ROLLBACK_REQUIRED=true
              if [ "${{ steps.rollback-backend.outcome }}" != "success" ]; then
                BACKEND_ROLLBACK_DONE=false
              fi
            fi
            if [ "${{ steps.classify-uat-release.outputs.frontend_failure }}" = "true" ] && [ "${{ steps.scope.outputs.deploy_frontend }}" = "true" ] && [ "${{ steps.rollback-targets.outputs.frontend_revision }}" != "" ]; then
              FRONTEND_ROLLBACK_REQUIRED=true
              if [ "${{ steps.rollback-frontend.outcome }}" != "success" ]; then
                FRONTEND_ROLLBACK_DONE=false
              fi
            fi

            if { [ "$BACKEND_ROLLBACK_REQUIRED" = true ] || [ "$FRONTEND_ROLLBACK_REQUIRED" = true ]; } && [ "$BACKEND_ROLLBACK_DONE" = true ] && [ "$FRONTEND_ROLLBACK_DONE" = true ]; then
              STATUS="rolled_back"
            else
              STATUS="blocked"
            fi
          fi

          if [ "${{ steps.scope.outputs.deploy_backend }}" = "true" ] \
             && [ "${{ inputs.preserve_paused_drive_worker }}" != "true" ] \
             && [ "${{ steps.deploy-drive-worker.outcome }}" = "success" ] \
             && [ "${{ steps.recover-uat-text-requests.outcome }}" != "success" ]; then
            STATUS="blocked"
          fi

          export STATUS DRIVE_WORKER_ROLLBACK_COMPLETE DRIVE_WORKER_GATE_SUCCESS
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "status": os.environ["STATUS"],
              "sha": "${{ steps.resolve-sha.outputs.sha }}",
              "scope": "${{ steps.scope.outputs.scope }}",
              "app_frontend_origin": "${{ env.APP_FRONTEND_ORIGIN }}",
              "predeploy": {
                  "backend_revision": "${{ steps.predeploy-state.outputs.backend_revision }}",
                  "backend_url": "${{ steps.predeploy-state.outputs.backend_url }}",
                  "frontend_revision": "${{ steps.predeploy-state.outputs.frontend_revision }}",
                  "frontend_url": "${{ steps.predeploy-state.outputs.frontend_url }}",
                  "drive_scheduler_uri": "${{ steps.capture-drive-worker-scheduler.outputs.uri }}",
                  "drive_scheduler_audience": "${{ steps.capture-drive-worker-scheduler.outputs.audience }}",
              },
              "current": {
                  "backend_candidate_revision": "${{ steps.candidate-state.outputs.backend_revision }}",
                  "backend_revision": "${{ steps.current-state.outputs.backend_revision }}",
                  "backend_url": "${{ steps.current-state.outputs.backend_url }}",
                  "frontend_candidate_revision": "${{ steps.candidate-state.outputs.frontend_revision }}",
                  "frontend_revision": "${{ steps.current-state.outputs.frontend_revision }}",
                  "frontend_url": "${{ steps.current-state.outputs.frontend_url }}",
              },
              "final": {
                  "backend_revision": "${{ steps.final-state.outputs.backend_revision }}",
                  "backend_sha": "${{ steps.final-state.outputs.backend_sha }}",
                  "backend_url": "${{ steps.final-state.outputs.backend_url }}",
                  "frontend_revision": "${{ steps.final-state.outputs.frontend_revision }}",
                  "frontend_sha": "${{ steps.final-state.outputs.frontend_sha }}",
                  "frontend_url": "${{ steps.final-state.outputs.frontend_url }}",
              },
              "verification": {
                  "plan_reason": "${{ steps.verification-plan.outputs.reason }}",
                  "lanes": json.loads(os.environ.get("VERIFICATION_PLAN_LANES") or "{}"),
                  "pkm_evaluator_runs": "${{ steps.verification-plan.outputs.pkm_evaluator_runs }}",
                  "pkm_upgrade_gate_required": "${{ steps.verification-plan.outputs.run_pkm_upgrade_gate }}",
                  "pkm_preservation_outcome": "${{ steps.verify-pkm-preservation.outcome }}",
                  "reviewer_byok_required": "${{ steps.verification-plan.outputs.run_reviewer_byok }}",
                  "parity_attempt_1": "${{ steps.verify-parity-1.outcome }}",
                  "parity_attempt_2": "${{ steps.verify-parity-2.outcome }}",
                  "parity_success": "${{ steps.classify-uat-release.outputs.parity_success }}",
                  "backend_provenance": "${{ steps.verify-backend-provenance.outcome }}",
                  "frontend_provenance": "${{ steps.verify-frontend-provenance.outcome }}",
                  "provenance_success": "${{ steps.classify-uat-release.outputs.provenance_success }}",
                  "attempt_1": "${{ steps.verify-uat-1.outcome }}",
                  "attempt_2": "${{ steps.verify-uat-2.outcome }}",
                  "semantic_success": "${{ steps.classify-uat-release.outputs.semantic_success }}",
                  "db_contract": "${{ steps.postdeploy-db-gate.outcome }}",
                  "reviewer_byok": "${{ steps.verify-reviewer-byok.outcome }}",
                  "reviewer_byok_passes_requested": "${{ steps.verification-plan.outputs.run_reviewer_byok == 'true' && (inputs.repeat_reviewer_byok && '2' || '1') || '0' }}",
                  "reviewer_byok_passes_completed": "${{ steps.verify-reviewer-byok.outputs.passes_completed || '0' }}",
                  "pwm_notification_scheduler": "${{ steps.activate-pwm-notifications.outcome }}",
                  "account_deletion_fence_required": "${{ steps.account-deletion-fence-decision.outputs.required }}",
                  "account_deletion_activation": "${{ steps.activate-account-deletion.outcome }}",
                  "account_deletion_activated": "${{ steps.activate-account-deletion.outputs.activated }}",
                  "text_processor_recovery": "${{ steps.recover-uat-text-requests.outcome }}",
                  "drive_worker": "${{ steps.deploy-drive-worker.outcome }}",
                  "drive_v1_worker": "${{ steps.deploy-drive-v1-worker.outcome }}",
                  "drive_v1_worker_revision": "${{ steps.deploy-drive-v1-worker.outputs.revision }}",
                  "drive_v1_worker_sha": "${{ steps.deploy-drive-v1-worker.outputs.sha }}",
                  "drive_v1_paused_unchanged": "${{ steps.deploy-drive-v1-worker.outputs.paused_drive_v1_unchanged }}" == "true",
                  "drive_v1_scheduler_http_200": "${{ steps.deploy-drive-v1-worker.outputs.scheduler_http_200 }}" == "true",
                  "drive_v1_worker_rollback": "${{ steps.verify-drive-v1-worker-rollback.outcome }}",
                  "drive_processing_enabled": "${{ inputs.preserve_paused_drive_worker && 'false' || 'true' }}",
                  "drive_worker_gate_success": os.environ["DRIVE_WORKER_GATE_SUCCESS"] == "true",
                  "paused_drive_maintenance_requested": "${{ inputs.preserve_paused_drive_worker }}" == "true",
                  "paused_drive_baseline": "${{ steps.capture-paused-drive-maintenance.outcome }}",
                  "paused_drive_unchanged": "${{ steps.verify-paused-drive-maintenance.outcome }}",
                  "paused_drive_after_v1": "${{ steps.verify-paused-drive-after-v1.outcome }}",
                  "drive_worker_backend_rollback": "${{ steps.rollback-backend-after-drive-worker.outcome }}",
                  "drive_worker_frontend_rollback": "${{ steps.rollback-frontend-after-drive-worker.outcome }}",
                  "drive_worker_scheduler_rollback": "${{ steps.verify-drive-worker-scheduler-rollback.outcome }}",
                  "blocking_classifications": "${{ steps.classify-uat-release.outputs.blocking_classifications }}",
              },
              "rollback_targets": {
                  "backend_revision": "${{ steps.rollback-targets.outputs.backend_revision }}",
                  "frontend_revision": "${{ steps.rollback-targets.outputs.frontend_revision }}",
                  "drive_worker_failure_rollback_complete": os.environ["DRIVE_WORKER_ROLLBACK_COMPLETE"] == "true",
              },
              "timing_seconds": {
                  "backend_cloud_build": "${{ steps.deploy-backend.outputs.duration_seconds || '0' }}",
                  "frontend_cloud_build": "${{ steps.deploy-frontend.outputs.duration_seconds || '0' }}",
                  # Includes the exact shared-build waiter when selected. This
                  # branch can overlap probes, so wait is not critical-path cost.
                  "frontend_image_wait": "${{ steps.build-frontend-image.outputs.wait_seconds || '0' }}",
                  "frontend_image_pin_collection": "${{ steps.build-frontend-image.outputs.collection_seconds || '0' }}",
              },
              "build_execution": {
                  "backend_cloud_build_id": "${{ steps.deploy-backend.outputs.build_id }}",
                  "frontend_shared_build_id": "${{ steps.deploy-frontend.outputs.shared_build_id }}",
                  "frontend_mode": "${{ steps.prepare-frontend-rollout.outputs.parallel == 'true' && 'shared_backend_build' || 'separate_build' }}",
              },
          }
          payload["backend_image_source"] = "${{ steps.build-backend-image.outputs.image_source }}"
          predecessor = Path("/tmp/uat-predecessor-acceptance.json")
          payload["predecessor_acceptance"] = (
              json.loads(predecessor.read_text(encoding="utf-8")) if predecessor.exists() else None
          )
          Path("/tmp/uat-release-status.json").write_text(json.dumps(payload, indent=2), encoding="utf-8")
          PY

      - name: Produce exact-SHA UAT acceptance
        if: always()
        run: |
          python3 "${RUNNER_TEMP}/release-tools/verify-predecessor-acceptance.py" create \
            --environment uat --status /tmp/uat-release-status.json \
            --predecessor /tmp/uat-predecessor-acceptance.json \
            --output /tmp/uat-acceptance/acceptance.json

      - name: Upload immutable UAT acceptance
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-acceptance-uat-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/uat-acceptance/acceptance.json
          if-no-files-found: ignore

      - name: Cancel an unused parallel frontend image build
        # Hygiene only: a release that stopped before the frontend deploy leaves
        # the web build running. It never affects release classification.
        if: always() && steps.start-frontend-image-build.outputs.build_id != '' && steps.build-frontend-image.outcome != 'success'
        continue-on-error: true
        shell: bash
        env:
          FRONTEND_IMAGE_BUILD_ID: ${{ steps.start-frontend-image-build.outputs.build_id }}
        run: |
          set -euo pipefail
          status="$(gcloud builds describe "${FRONTEND_IMAGE_BUILD_ID}" \
            --project="${{ env.GCP_PROJECT_ID }}" --format='value(status)')"
          case "${status}" in
            QUEUED|PENDING|WORKING)
              gcloud builds cancel "${FRONTEND_IMAGE_BUILD_ID}" --project="${{ env.GCP_PROJECT_ID }}"
              ;;
            *)
              echo "Frontend image build ${FRONTEND_IMAGE_BUILD_ID} is already ${status}; nothing to cancel."
              ;;
          esac

      - name: Upload UAT deploy artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: uat-release-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            /tmp/uat-predecessor-acceptance.json
            /tmp/uat-runtime-secret-sync.json
            /tmp/uat-frontend-runtime-secret-sync.json
            /tmp/uat-runtime-parity-attempt-1.json
            /tmp/uat-runtime-parity-attempt-2.json
            /tmp/uat-backend-provenance.json
            /tmp/uat-frontend-provenance.json
            /tmp/uat-db-migration-guard-predeploy.json
            /tmp/uat-protected-document-release.json
            /tmp/uat-document-reader-compatibility.json
            /tmp/uat-email-auth-policy-activation.json
            /tmp/uat-db-migration-guard-postdeploy.json
            /tmp/uat-backend-image.json
            /tmp/uat-backend-image-manifest.json
            /tmp/uat-frontend-image.json
            /tmp/uat-frontend-image-handoff.json
            /tmp/uat-frontend-image-manifest.json
            /tmp/uat-backend-candidate.json
            /tmp/uat-backend-candidate-readiness.json
            /tmp/uat-managed-provider-readiness.json
            /tmp/uat-backend-candidate-health.json
            /tmp/uat-backend-promoted-service.json
            /tmp/uat-account-deletion-fence-install.log
            /tmp/uat-account-deletion-revisions.json
            /tmp/uat-account-deletion-unfenced-preflight.log
            /tmp/uat-account-deletion-fence-premigration.log
            /tmp/uat-account-deletion-boundary.log
            /tmp/uat-account-deletion-boundary-preactivation.log
            /tmp/uat-account-deletion-scheduler-setup.log
            /tmp/uat-account-deletion-scheduler-config.json
            /tmp/uat-account-deletion-scheduler-finished-logs.json
            /tmp/uat-account-deletion-activation.json
            /tmp/uat-account-deletion-scheduler-evidence.json
            /tmp/uat-account-deletion-cleanup-health.json
            /tmp/uat-account-deletion-revision-retirement.json
            /tmp/uat-account-deletion-fence-removal.log
            /tmp/uat-drive-worker-release.log
            /tmp/uat-drive-v1-worker-release.log
            /tmp/cloud-sql-proxy-uat.log
            /tmp/cloud-sql-proxy-uat-migrate.log
            /tmp/cloud-sql-proxy-uat-activation.log
            /tmp/cloud-sql-proxy-uat-rollback.log
            /tmp/cloud-sql-proxy-uat-postdeploy.log
            /tmp/uat-release-verify-attempt-1.json
            /tmp/uat-release-verify-attempt-2.json
            /tmp/uat-reviewer-byok.log
            /tmp/uat-release-classification.json
            /tmp/uat-text-recovery-proof.json
            /tmp/uat-release-status.json

      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            total_seconds=$(( $(date +%s) - ${{ steps.timing-start.outputs.epoch || '0' }} ))
            if [ "${{ steps.timing-start.outputs.epoch || '' }}" = "" ]; then
              total_seconds=0
            fi
            backend_build_seconds="${{ steps.deploy-backend.outputs.duration_seconds || '0' }}"
            frontend_build_seconds="${{ steps.deploy-frontend.outputs.duration_seconds || '0' }}"
            build_seconds=$(( backend_build_seconds + frontend_build_seconds ))
            non_build_seconds=$(( total_seconds - build_seconds ))
            if [ "$non_build_seconds" -lt 0 ]; then
              non_build_seconds=0
            fi
            echo "## UAT Release"
            echo ""
            echo "- SHA: \`${{ steps.resolve-sha.outputs.sha }}\`"
            echo "- Requested scope: \`${{ github.event.inputs.scope }}\`"
            echo "- Scope: \`${{ steps.scope.outputs.scope }}\`"
            echo "- Scope reason: \`${{ steps.scope.outputs.reason }}\`"
            echo "- Verification plan: \`${{ steps.verification-plan.outputs.reason }}\`"
            echo "- Verification lanes: \`${{ steps.verification-plan.outputs.lanes }}\`"
            echo "- PKM evaluator runs: \`${{ steps.verification-plan.outputs.pkm_evaluator_runs }}\`"
            echo "- Candidate PKM evaluator outcome (advisory): \`${{ steps.verify-candidate-pkm-evaluator.outputs.outcome || (steps.verification-plan.outputs.pkm_evaluator_runs == '0' && 'skipped' || 'not_run') }}\`"
            echo "- PKM upgrade gate required: \`${{ steps.verification-plan.outputs.run_pkm_upgrade_gate }}\`"
            echo "- Reviewer BYOK required: \`${{ steps.verification-plan.outputs.run_reviewer_byok }}\`"
            echo "- Backend deployed SHA before run: \`${{ steps.predeploy-state.outputs.backend_sha || 'unknown' }}\`"
            echo "- Account deletion fence required: \`${{ steps.account-deletion-fence-decision.outputs.required || 'not_applicable' }}\`"
            echo "- Frontend deployed SHA before run: \`${{ steps.predeploy-state.outputs.frontend_sha || 'unknown' }}\`"
            echo "- Status: \`$(python3 -c "import json; from pathlib import Path; print(json.loads(Path('/tmp/uat-release-status.json').read_text(encoding='utf-8'))['status'])")\`"
            echo "- Blocking classifications: \`${{ steps.classify-uat-release.outputs.blocking_classifications || 'none' }}\`"
            # Degradation is reported next to the status, not buried in the JSON.
            # A release that deployed correctly while a provider was down must be
            # readable as exactly that -- neither a clean success nor a failure.
            # Read from the CLASSIFICATION file, which is the only one that has
            # ever carried `dependency_health`. This read pointed at the status
            # file, whose payload has no such key, so `.get(...)` always returned
            # {} and the branch below always printed "healthy" -- a banner that
            # said the same thing whether or not a capability was down.
            degraded_capabilities="$(python3 -c "import json; from pathlib import Path; print(','.join(json.loads(Path('/tmp/uat-release-classification.json').read_text(encoding='utf-8')).get('dependency_health', {}).get('degraded_capabilities') or []))" 2>/dev/null || true)"
            if [[ -n "${degraded_capabilities}" ]]; then
              echo "- **Dependency health: DEGRADED**"
              echo "- Degraded capabilities: \`${degraded_capabilities}\`"
              echo "  > The application deployed correctly. One or more external"
              echo "  > providers are unavailable, so these capabilities will not"
              echo "  > work until the provider recovers. This is not a code defect."
            else
              echo "- Dependency health: \`healthy\`"
            fi
            echo "- Backend URL: \`${{ steps.final-state.outputs.backend_url }}\`"
            echo "- Frontend URL: \`${{ env.APP_FRONTEND_ORIGIN }}\`"
            echo "- Backend revision: \`${{ steps.final-state.outputs.backend_revision }}\`"
            echo "- Frontend revision: \`${{ steps.final-state.outputs.frontend_revision }}\`"
            echo "- Parity attempt 1: \`${{ steps.verify-parity-1.outcome }}\`"
            echo "- Parity attempt 2: \`${{ steps.verify-parity-2.outcome }}\`"
            echo "- Backend provenance: \`${{ steps.verify-backend-provenance.outcome }}\`"
            echo "- Frontend provenance: \`${{ steps.verify-frontend-provenance.outcome }}\`"
            echo "- Post-deploy DB contract: \`${{ steps.postdeploy-db-gate.outcome }}\`"
            echo "- Verify attempt 1: \`${{ steps.verify-uat-1.outcome }}\`"
            echo "- Verify attempt 2: \`${{ steps.verify-uat-2.outcome }}\`"
            echo "- Backend rollback: \`${{ steps.rollback-backend.outcome }}\`"
            echo "- Frontend rollback: \`${{ steps.rollback-frontend.outcome }}\`"
            echo "- Drive worker failure backend rollback: \`${{ steps.rollback-backend-after-drive-worker.outcome }}\`"
            echo "- Drive worker failure frontend rollback: \`${{ steps.rollback-frontend-after-drive-worker.outcome }}\`"
            echo "- Isolated V1 worker: \`${{ steps.deploy-drive-v1-worker.outcome }}\`"
            echo "- V1 serving revision: \`${{ steps.deploy-drive-v1-worker.outputs.revision || 'not_deployed' }}\`"
            echo "- V1 serving SHA: \`${{ steps.deploy-drive-v1-worker.outputs.sha || 'not_deployed' }}\`"
            echo "- V1 paused scheduler unchanged: \`${{ steps.deploy-drive-v1-worker.outputs.paused_drive_v1_unchanged || 'false' }}\`"
            echo "- V1 Scheduler fresh 200: \`${{ steps.deploy-drive-v1-worker.outputs.scheduler_http_200 || 'false' }}\`"
            echo ""
            echo "### Deploy Timing"
            echo ""
            echo "- Total job time so far: \`${total_seconds}s\`"
            echo "- Backend/shared Cloud Build: \`${backend_build_seconds}s\`"
            if [[ "${{ steps.prepare-frontend-rollout.outputs.parallel }}" == "true" ]]; then
              echo "- Frontend rollout: included in [shared Cloud Build](https://console.cloud.google.com/cloud-build/builds/${{ steps.deploy-frontend.outputs.shared_build_id }}?project=${{ env.GCP_PROJECT_ID }}); not an additional serial build."
            else
              echo "- Frontend Cloud Build: \`${frontend_build_seconds}s\`"
            fi
            echo "- Non-build gates and verification: \`${non_build_seconds}s\`"
            echo ""
            echo "### Revision Maintenance"
            echo ""
            echo "Old revisions are retired separately after a successful release; request drainage does not delay this deployment."
            echo "[View Capacity Maintenance](${{ github.server_url }}/${{ github.repository }}/actions/workflows/capacity-maintenance.yml)"
            echo ""
            echo "### Auto Scope Evidence"
            echo ""
            echo "- Backend changed files: \`${{ steps.scope.outputs.backend_changed_files || 'none' }}\`"
            echo "- Frontend changed files: \`${{ steps.scope.outputs.frontend_changed_files || 'none' }}\`"
            echo "- Shared changed files: \`${{ steps.scope.outputs.shared_changed_files || 'none' }}\`"
            echo "- Neutral changed files: \`${{ steps.scope.outputs.neutral_changed_files || 'none' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tag this release as last known good
        id: tag-last-known-good
        if: always()
        # Advisory annotation, not a release-health signal: the deploy above
        # already succeeded and classified healthy by this point. A tagging
        # failure (e.g. a transient push conflict) must never turn a healthy
        # release red or trigger the rollback investigation that implies.
        continue-on-error: true
        shell: bash
        env:
          ENVIRONMENT: uat
          SHA: ${{ steps.resolve-sha.outputs.sha }}
          BACKEND_REVISION: ${{ steps.final-state.outputs.backend_revision }}
          BACKEND_SERVICE_URL: ${{ steps.final-state.outputs.backend_url }}
          FRONTEND_REVISION: ${{ steps.final-state.outputs.frontend_revision }}
          FRONTEND_SERVICE_URL: ${{ steps.final-state.outputs.frontend_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          STATUS="$(python3 -c "import json; from pathlib import Path; print(json.loads(Path('/tmp/uat-release-status.json').read_text(encoding='utf-8'))['status'])")"
          if [ "$STATUS" != "healthy" ]; then
            echo "[tag-last-known-good] Release status is '$STATUS', not 'healthy' — not tagging."
            exit 0
          fi
          bash scripts/ci/tag-last-known-good.sh

      - name: Retire old UAT revision tags after a healthy release
        if: always()
        shell: bash
        env:
          BACKEND_CURRENT: ${{ steps.final-state.outputs.backend_revision }}
          FRONTEND_CURRENT: ${{ steps.final-state.outputs.frontend_revision }}
          BACKEND_ROLLBACK: ${{ steps.predeploy-state.outputs.backend_revision }}
          FRONTEND_ROLLBACK: ${{ steps.predeploy-state.outputs.frontend_revision }}
        run: |
          set -euo pipefail
          status="$(python3 -c "import json; from pathlib import Path; print(json.loads(Path('/tmp/uat-release-status.json').read_text(encoding='utf-8'))['status'])")"
          if [ "$status" != healthy ]; then
            echo "Skipping revision tag retirement for release status $status"
            exit 0
          fi
          bash scripts/ci/cloudrun-retention.sh "$BACKEND_SERVICE" "$GCP_REGION" "$BACKEND_REVISION_RETENTION" \
            "$BACKEND_CURRENT" --rollback-revision "$BACKEND_ROLLBACK" \
            --last-known-good-revision "$BACKEND_CURRENT" --apply --healthy --tags-only
          bash scripts/ci/cloudrun-retention.sh "$FRONTEND_SERVICE" "$GCP_REGION" "$FRONTEND_REVISION_RETENTION" \
            "$FRONTEND_CURRENT" --rollback-revision "$FRONTEND_ROLLBACK" \
            --last-known-good-revision "$FRONTEND_CURRENT" --apply --healthy --tags-only
          if [ "${{ inputs.preserve_paused_drive_worker }}" != true ]; then
            bash scripts/ci/cloudrun-retention.sh consent-protocol-drive-worker "$GCP_REGION" 2 \
              --apply --healthy --tags-only
          fi

      - name: Fail workflow when UAT release did not end healthy
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(python3 -c "import json; from pathlib import Path; print(json.loads(Path('/tmp/uat-release-status.json').read_text(encoding='utf-8'))['status'])")"
          if [ "$STATUS" != "healthy" ]; then
            echo "UAT release finished with status: $STATUS"
            exit 1
          fi
