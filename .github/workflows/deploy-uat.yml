name: Deploy to UAT
run-name: UAT · app ${{ inputs.sha || 'unselected' }} · scope ${{ inputs.scope || 'auto' }} · ${{ inputs.operation || 'deploy' }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Inspect prerequisites without deploying, or deploy a qualified application"
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - inspect
          - inspect-routing
      target:
        description: "Standard shared UAT deployment"
        required: true
        default: shared-uat
        type: choice
        options:
          - shared-uat
      scope:
        description: "Auto-detect deploy lane, or force backend/frontend/all"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - all
          - backend
          - frontend
      sha:
        description: "Exact qualified application SHA; blank only verifies an already-serving no-op"
        required: false
        type: string
      source_branch:
        description: "Protected application branch"
        type: choice
        default: uat
        options:
          - uat
          - uat-isolated
      verify_candidate_before_promotion:
        description: "Require candidate health and text recovery before changing UAT traffic"
        default: false
        type: boolean
      approved_scope:
        description: "Required for deploy: approved release PR and full SHAs (BACKEND:FRONTEND:PR=HEAD[,PR=HEAD])"
        required: false
        type: string
      ci_run_id:
        description: "Exact full UAT validation run, required for direct UAT admission"
        required: false
        type: string
      ci_run_attempt:
        description: "Required for deploy: current successful attempt (inspection supplies this)"
        required: false
        type: string
      ci_base_sha:
        description: "Required for deploy: qualified serving-base SHA (inspection supplies this)"
        required: false
        type: string
      backend_image_source:
        description: "Reuse the accepted Dev backend image when recorded, or build explicitly"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - build-from-source
          - promote-from-dev
      run_live_model_checks:
        description: "Opt in to paid candidate Gemini/Vertex readiness and synthetic PKM evaluation"
        required: false
        default: false
        type: boolean
      repeat_reviewer_byok:
        description: "Explicit read-only app-browser diagnostic (two passes); off by default"
        required: false
        default: false
        type: boolean
      run_pwm_acceptance:
        description: "Authorized live PWM research, one reviewed save and cold vault readback"
        required: false
        default: false
        type: boolean
      pwm_evidence_public_key:
        description: "Base64 DER SPKI public key sealing owner research evidence for the operator"
        required: false
        type: string
      pwm_expected_emails:
        description: "Expected verified owner emails (comma-separated); no fixture substitution"
        required: false
        type: string
      pwm_owner_confirmed_profile:
        description: "GitHub profile explicitly confirmed by the owner; bounds one reviewed save"
        required: false
        type: string
      preserve_paused_drive_worker:
        description: "Preserve all three operator-paused UAT Drive jobs and the current private worker"
        required: false
        default: false
        type: boolean
      skip_managed_vertex_probe_once:
        description: "One-time UAT Vertex probe exception for a8e36651; verify runtime after release"
        required: false
        default: false
        type: boolean


# Dispatch from the environment branch; implementation and credentials remain
# under reviewed Main authority. Merging does not deploy any environment.
permissions:
  contents: write
  deployments: read
  pull-requests: read
  checks: read
  actions: write
  id-token: write

jobs:
  release:
    name: Deploy
    uses: hushh-labs/hushh-research/.github/workflows/deploy-uat-implementation.yml@main
    with:
      operation: ${{ inputs.operation }}
      target: ${{ inputs.target }}
      scope: ${{ inputs.scope }}
      sha: ${{ inputs.sha }}
      source_branch: ${{ inputs.source_branch }}
      verify_candidate_before_promotion: ${{ inputs.verify_candidate_before_promotion }}
      approved_scope: ${{ inputs.approved_scope }}
      ci_run_id: ${{ inputs.ci_run_id }}
      ci_run_attempt: ${{ inputs.ci_run_attempt }}
      ci_base_sha: ${{ inputs.ci_base_sha }}
      backend_image_source: ${{ inputs.backend_image_source }}
      run_live_model_checks: ${{ inputs.run_live_model_checks }}
      repeat_reviewer_byok: ${{ inputs.repeat_reviewer_byok }}
      run_pwm_acceptance: ${{ inputs.run_pwm_acceptance }}
      pwm_evidence_public_key: ${{ inputs.pwm_evidence_public_key }}
      pwm_expected_emails: ${{ inputs.pwm_expected_emails }}
      pwm_owner_confirmed_profile: ${{ inputs.pwm_owner_confirmed_profile }}
      preserve_paused_drive_worker: ${{ inputs.preserve_paused_drive_worker }}
      skip_managed_vertex_probe_once: ${{ inputs.skip_managed_vertex_probe_once }}
