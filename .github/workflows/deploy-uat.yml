name: Deploy to UAT

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Auto-detect deploy lane, or force backend/frontend/all"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - all
          - backend
          - frontend
      sha:
        description: "Exact green main SHA to deploy (blank defaults to latest origin/main)"
        required: false
        type: string
      backend_image_source:
        description: "Reuse the accepted Dev backend image when recorded, or build explicitly"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - build-from-source
          - promote-from-dev
      run_live_model_checks:
        description: "Opt in to paid candidate Gemini/Vertex readiness and synthetic PKM evaluation"
        required: false
        default: false
        type: boolean
      repeat_reviewer_byok:
        description: "Repeat a selected read-only reviewer BYOK rehearsal for independent RCA acceptance"
        required: false
        default: false
        type: boolean
      run_pwm_acceptance:
        description: "Authorized live PWM research, one reviewed save and cold vault readback"
        required: false
        default: false
        type: boolean
      pwm_evidence_public_key:
        description: "Base64 DER SPKI public key sealing owner research evidence for the operator"
        required: false
        type: string
      pwm_expected_emails:
        description: "Expected verified owner emails (comma-separated); no fixture substitution"
        required: false
        type: string
      pwm_owner_confirmed_profile:
        description: "GitHub profile explicitly confirmed by the owner; bounds one reviewed save"
        required: false
        type: string
      preserve_paused_drive_worker:
        description: "Preserve all three operator-paused UAT Drive jobs and the current private worker"
        required: false
        default: false
        type: boolean
      skip_managed_vertex_probe_once:
        description: "One-time UAT Vertex probe exception for a8e36651; verify runtime after release"
        required: false
        default: false
        type: boolean

permissions:
  # write: this workflow tags a healthy release as "last known good"
  # (scripts/ci/tag-last-known-good.sh) so a future revert check and a
  # future rollback both have a durable anchor. Scoped to pushing tags only
  # — the workflow never touches a branch.
  contents: write
  checks: read
  actions: read
  id-token: write

env:
  GCP_PROJECT_ID: hushh-pda-uat
  UAT_FIREBASE_PROJECT_ID: hushh-pda
  GCP_REGION: us-central1
  BACKEND_SERVICE: consent-protocol
  RUNTIME_SERVICE_ACCOUNT: consent-protocol-runtime@hushh-pda-uat.iam.gserviceaccount.com
  FRONTEND_SERVICE: hushh-webapp
  FRONTEND_RUNTIME_SERVICE_ACCOUNT: hushh-webapp-runtime@hushh-pda-uat.iam.gserviceaccount.com
  ACCOUNT_DELETION_SCHEDULER_SERVICE_ACCOUNT_ID: account-deletion-cleanup
  GMAIL_PERSONAL_INFORMATION_REQUEST_MONITOR_SCHEDULER_SERVICE_ACCOUNT_ID: gmail-personal-monitor-sched
  APP_FRONTEND_ORIGIN: https://uat.one.hussh.ai
  CONSENT_API_PUBLIC_ORIGIN: https://api.uat.hushh.ai
  CONSENT_API_RUNTIME_ORIGIN: https://consent-protocol-f2gsa4kfsq-uc.a.run.app
  UAT_CLOUDSQL_INSTANCE: hushh-pda-uat:us-central1:hushh-uat-pg
  UAT_DB_UNIX_SOCKET: /cloudsql/hushh-pda-uat:us-central1:hushh-uat-pg
  BACKEND_REVISION_RETENTION: "2"
  FRONTEND_REVISION_RETENTION: "10"
  PROTOCOL_PYTHON: ${{ github.workspace }}/consent-protocol/.venv/bin/python

concurrency:
  # Backend candidates share one admission queue. Explicit frontend-only
  # requests can proceed while backend revisions finish draining.
  group: uat-release-requests-${{ inputs.scope == 'frontend' && 'frontend' || 'backend' }}
  cancel-in-progress: false
  queue: max

jobs:
  select-target:
    name: Select UAT target
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: read
      deployments: read
      actions: read
    outputs:
      sha: ${{ steps.resolve-sha.outputs.sha }}
      decision: ${{ steps.resolve-sha.outputs.decision }}
    steps:
      - name: Assert manual dispatch originates from main
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "Refusing UAT target selection outside main."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # Explicit selection does not read history. Automatic selection and
          # the later admission job retain full history for ancestry/deltas.
          fetch-depth: ${{ inputs.sha != '' && 1 || 0 }}
          ref: main


      - name: Assert manual UAT dispatch actor policy
        run: python3 scripts/ci/assert-governed-actor.py --surface uat --actor "${{ github.actor }}"

      - name: Resolve deployment SHA
        id: resolve-sha
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_SHA: ${{ github.event.inputs.sha }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED_SHA" ]; then
            if ! [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "UAT requires a full 40-character commit SHA."
              exit 1
            fi
            echo "sha=$REQUESTED_SHA" >> "$GITHUB_OUTPUT"
            echo "decision=DEPLOY_EXACT_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node hushh-webapp/scripts/ci/select-uat-target.mjs --limit 20 --github-output --allow-no-op

      - name: Validate one-time Vertex probe exception
        if: inputs.skip_managed_vertex_probe_once
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.sha }}
          REQUESTED_SCOPE: ${{ inputs.scope }}
          LIVE_CHECKS: ${{ inputs.run_live_model_checks }}
        run: |
          set -euo pipefail
          if [[ "$REQUESTED_SHA" != "a8e36651c17f6a0837530840fbeaf0ec3bbfcdf2" ||
                "$REQUESTED_SCOPE" != "all" || "$LIVE_CHECKS" != "false" ||
                "$GITHUB_ACTOR" != "ankitkumarsingh1702" ||
                "$(date -u +%Y-%m-%d)" > "2026-10-17" ]]; then
            echo "One-time Vertex exception is limited to the approved UAT release." >&2
            exit 1
          fi

      - name: Summarize unchanged UAT target
        if: steps.resolve-sha.outputs.decision == 'NO_OP'
        shell: bash
        env:
          UAT_SHA: ${{ steps.resolve-sha.outputs.uat_actual_sha }}
          REASON: ${{ steps.resolve-sha.outputs.reason }}
        run: |
          {
            echo "## UAT already current"
            printf '\n- Existing UAT SHA: `%s`\n- Decision: `NO_OP`\n- Reason: %s\n' "$UAT_SHA" "$REASON"
            echo "- No deployment, traffic change, or release tag update was performed."
          } >> "$GITHUB_STEP_SUMMARY"

  wait-capacity:
    name: Wait for UAT capacity outside the mutation lock
    needs: select-target
    if: needs.select-target.outputs.decision == 'DEPLOY_EXACT_SHA'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    permissions:
      contents: read
      checks: read
      id-token: write
    environment:
      name: uat
      deployment: false
    outputs:
      scope: ${{ steps.admission.outputs.scope }}
    steps:
      - name: Checkout current admission tooling
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Authenticate for read-only UAT capacity inventory
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          project_id: ${{ env.GCP_PROJECT_ID }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Wait for scope-aware UAT capacity
        id: admission
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ needs.select-target.outputs.sha }}
          REQUESTED_SCOPE: ${{ inputs.scope }}
        run: |
          python3 scripts/ci/wait-uat-capacity.py \
            --mode full --target-sha "$TARGET_SHA" \
            --requested-scope "$REQUESTED_SCOPE" \
            --github-output "$GITHUB_OUTPUT"

  deploy:
    name: Deploy UAT Scope
    needs: [select-target, wait-capacity]
    if: needs.select-target.outputs.decision == 'DEPLOY_EXACT_SHA'
    runs-on: ubuntu-24.04
    concurrency:
      group: deploy-uat
      cancel-in-progress: false
      queue: max
    environment: uat
    env:
      UAT_EMAIL_AUTH_ENABLED: ${{ vars.EMAIL_AUTH_ENABLED_UAT || 'false' }}

    steps:
      - name: Assert manual dispatch originates from main
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "Refusing UAT deploy from '${GITHUB_REF_NAME}'. Trigger this workflow from 'main' only."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Require reconciled maintenance mutations under deployment lock
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/ci/uat-retention-maintenance.py --environment uat \
            --check-mutations --state-dir "$RUNNER_TEMP/uat-maintenance-guard"


      - name: Assert manual UAT dispatch actor policy
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/assert-governed-actor.py --surface uat --actor "${GITHUB_ACTOR}"

      - name: Capture deployment timing start
        id: timing-start
        shell: bash
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      # Keep the existing deployment body's exact-SHA references. Selection
      # happens before the UAT environment is entered; validation stays below.
      - name: Resolve deployment SHA
        id: resolve-sha
        shell: bash
        env:
          DEPLOY_SHA: ${{ needs.select-target.outputs.sha }}
        run: |
          set -euo pipefail
          echo "sha=$DEPLOY_SHA" >> "$GITHUB_OUTPUT"

      - name: Validate deployment SHA against main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUIRED_BRANCH: main
          REQUIRE_CI_SUCCESS: "1"
          REQUIRED_CHECK_NAME: "Main Post-Merge Smoke Gate"
        run: bash scripts/ci/require-deploy-sha-on-main.sh "${{ steps.resolve-sha.outputs.sha }}"

      - name: Preserve current release tooling
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/release-tools"
          cp deploy/drive/resolve_protected_document_release.py "${RUNNER_TEMP}/release-tools/"
          cp deploy/drive/document_reader_compatibility.py "${RUNNER_TEMP}/release-tools/"
          cp scripts/ci/cloudrun-rollback.sh "${RUNNER_TEMP}/release-tools/"
          cp scripts/ci/process_group.py "${RUNNER_TEMP}/release-tools/"
          git log -1 --diff-filter=A --format=%H -- \
            consent-protocol/api/routes/document_delivery.py \
            > "${RUNNER_TEMP}/release-tools/protected-document-reader-commit"
          cp scripts/ci/verify-predecessor-acceptance.py "${RUNNER_TEMP}/release-tools/"
          cp scripts/ci/release_acceptance_provenance.py "${RUNNER_TEMP}/release-tools/"
          cp scripts/ci/verify-cloudrun-revision-provenance.py "${RUNNER_TEMP}/release-tools/"
          cp scripts/ci/resolve-cloud-run-deploy-revision.py \
            "${RUNNER_TEMP}/release-tools/resolve-cloud-run-deploy-revision.py"
          cp scripts/ci/runtime-capacity-budget.py \
            "${RUNNER_TEMP}/release-tools/runtime-capacity-budget.py"
          cp scripts/ci/runtime_capacity_inventory.py \
            "${RUNNER_TEMP}/release-tools/runtime_capacity_inventory.py"
          cp scripts/ci/verify-cloud-scheduler-attempt.py "${RUNNER_TEMP}/release-tools/"
          cp scripts/ci/cloudrun-rollback.sh "${RUNNER_TEMP}/release-tools/"
          cp deploy/drive/rollback_after_worker_failure.sh "${RUNNER_TEMP}/release-tools/"
          cp scripts/ci/account-deletion-fence-decision.py \
            "${RUNNER_TEMP}/release-tools/account-deletion-fence-decision.py"
          mkdir -p "${RUNNER_TEMP}/release-tools/account-deletion"
          cp deploy/account-deletion/{install,remove}_release_fence.sql \
            deploy/account-deletion/activate_release.py deploy/account-deletion/release_source.py deploy/account-deletion/release_target.py deploy/account-deletion/setup_cleanup_scheduler.sh \
            deploy/account-deletion/verify_release_boundary.sql \
            "${RUNNER_TEMP}/release-tools/account-deletion/"
          cp config/runtime-capacity.json \
            "${RUNNER_TEMP}/release-tools/runtime-capacity.json"
          cp scripts/ops/verify_passkey_domain_associations.py \
            "${RUNNER_TEMP}/release-tools/verify_passkey_domain_associations.py"
          cp scripts/ops/verify_uat_release.py \
            "${RUNNER_TEMP}/release-tools/verify_uat_release.py"
          cp scripts/ci/capture_managed_provider_receipt.py \
            "${RUNNER_TEMP}/release-tools/capture_managed_provider_receipt.py"
          cp scripts/ci/uat_backend_build_config.py "${RUNNER_TEMP}/release-tools/"
          cp scripts/ci/uat_frontend_image_handoff.py "${RUNNER_TEMP}/release-tools/"
          cp scripts/ci/resolve-cloud-run-image.py "${RUNNER_TEMP}/release-tools/"
          cp scripts/ops/run_uat_text_recovery_job.py \
            "${RUNNER_TEMP}/release-tools/run_uat_text_recovery_job.py"
          if [[ "${{ inputs.skip_managed_vertex_probe_once }}" == "true" ]]; then
            cp scripts/ci/managed_provider_readiness.py \
              "${RUNNER_TEMP}/release-tools/managed_provider_readiness.py"
            cp scripts/ci/managed_capability_proof.py \
              "${RUNNER_TEMP}/release-tools/managed_capability_proof.py"
            cp deploy/backend.cloudbuild.yaml \
              "${RUNNER_TEMP}/release-tools/backend.cloudbuild.yaml"
            printf '%s\n' \
              scripts/deploy/backend-deploy.sh \
              scripts/deploy/backend-capacity-settings.sh \
              scripts/deploy/backend-app-surface-settings.sh \
              scripts/deploy/verify-managed-vertex-runtime.sh \
              scripts/deploy/commerce-preview-bindings.sh \
              scripts/deploy/backend-model-settings.sh \
              scripts/deploy/backend-drive-secret-settings.sh \
              scripts/deploy/scope-commerce-secrets.sh \
              deploy/email-auth/bind_secrets.sh \
              deploy/plg/bind_secrets.sh \
              deploy/sso/bind_workos.sh > "${RUNNER_TEMP}/release-tools/vertex-exception-tools.txt"
            while IFS= read -r tool; do
              mkdir -p "${RUNNER_TEMP}/release-tools/$(dirname "$tool")"
              cp "$tool" "${RUNNER_TEMP}/release-tools/$tool"
            done < "${RUNNER_TEMP}/release-tools/vertex-exception-tools.txt"
          fi

      - name: Checkout deployment SHA
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "${{ steps.resolve-sha.outputs.sha }}"
          mkdir -p deploy/drive
          cp "${RUNNER_TEMP}/release-tools/resolve_protected_document_release.py" deploy/drive/
          cp "${RUNNER_TEMP}/release-tools/document_reader_compatibility.py" deploy/drive/
          cp "${RUNNER_TEMP}/release-tools/cloudrun-rollback.sh" scripts/ci/
          cp "${RUNNER_TEMP}/release-tools/process_group.py" scripts/ci/
          # Keep the current opt-in contract when verifying an older approved build.
          cp "${RUNNER_TEMP}/release-tools/verify_uat_release.py" \
            scripts/ops/verify_uat_release.py
          cp "${RUNNER_TEMP}/release-tools/capture_managed_provider_receipt.py" \
            scripts/ci/capture_managed_provider_receipt.py
          cp "${RUNNER_TEMP}/release-tools/uat_backend_build_config.py" scripts/ci/
          cp "${RUNNER_TEMP}/release-tools/uat_frontend_image_handoff.py" scripts/ci/
          cp "${RUNNER_TEMP}/release-tools/resolve-cloud-run-image.py" scripts/ci/
          # The launcher is current release tooling; the approved target image
          # and its processing policy remain bound by the launcher itself.
          cp "${RUNNER_TEMP}/release-tools/run_uat_text_recovery_job.py" \
            scripts/ops/run_uat_text_recovery_job.py
          cp "${RUNNER_TEMP}/release-tools/runtime-capacity-budget.py" \
            scripts/ci/runtime-capacity-budget.py
          cp "${RUNNER_TEMP}/release-tools/runtime_capacity_inventory.py" \
            scripts/ci/runtime_capacity_inventory.py
          cp "${RUNNER_TEMP}/release-tools/verify-cloudrun-revision-provenance.py" scripts/ci/
          cp "${RUNNER_TEMP}/release-tools/verify-cloud-scheduler-attempt.py" scripts/ci/
          cp "${RUNNER_TEMP}/release-tools/cloudrun-rollback.sh" scripts/ci/
          mkdir -p deploy/drive
          cp "${RUNNER_TEMP}/release-tools/rollback_after_worker_failure.sh" deploy/drive/
          cp "${RUNNER_TEMP}/release-tools/account-deletion-fence-decision.py" \
            scripts/ci/account-deletion-fence-decision.py
          mkdir -p deploy/account-deletion
          cp "${RUNNER_TEMP}/release-tools/account-deletion/"* deploy/account-deletion/
          cp "${RUNNER_TEMP}/release-tools/runtime-capacity.json" \
            config/runtime-capacity.json
          cp "${RUNNER_TEMP}/release-tools/verify_passkey_domain_associations.py" \
            scripts/ops/verify_passkey_domain_associations.py
          if [[ "${{ inputs.skip_managed_vertex_probe_once }}" == "true" ]]; then
            cp "${RUNNER_TEMP}/release-tools/managed_provider_readiness.py" \
              scripts/ci/managed_provider_readiness.py
            cp "${RUNNER_TEMP}/release-tools/managed_capability_proof.py" \
              scripts/ci/managed_capability_proof.py
            cp "${RUNNER_TEMP}/release-tools/backend.cloudbuild.yaml" \
              deploy/backend.cloudbuild.yaml
            while IFS= read -r tool; do
              mkdir -p "$(dirname "$tool")"
              cp "${RUNNER_TEMP}/release-tools/$tool" "$tool"
            done < "${RUNNER_TEMP}/release-tools/vertex-exception-tools.txt"
            printf '\n!deploy/email-auth/bind_secrets.sh\n' >> .gcloudignore
            printf '\n!deploy/plg/bind_secrets.sh\n!scripts/deploy/backend-capacity-settings.sh\n!scripts/deploy/backend-app-surface-settings.sh\n' >> .gcloudignore
          fi

      - name: Validate Google Cloud workload identity configuration
        shell: bash
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test -n "$WIF_PROVIDER" || { echo "Missing environment variable GCP_WORKLOAD_IDENTITY_PROVIDER" >&2; exit 1; }
          test -n "$DEPLOY_SERVICE_ACCOUNT" || { echo "Missing environment variable GCP_DEPLOY_SERVICE_ACCOUNT" >&2; exit 1; }

      - name: Authenticate to Google Cloud
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          project_id: ${{ env.GCP_PROJECT_ID }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set GCP project context
        run: gcloud config set project "${{ env.GCP_PROJECT_ID }}"

      - name: Assert GCP project scope
        shell: bash
        run: |
          set -euo pipefail
          ACTIVE_PROJECT="$(gcloud config get-value project 2>/dev/null)"
          if [ "$ACTIVE_PROJECT" != "${{ env.GCP_PROJECT_ID }}" ]; then
            echo "Refusing deploy: expected project '${{ env.GCP_PROJECT_ID }}' but got '$ACTIVE_PROJECT'."
            exit 1
          fi

      - name: Set up Python + uv runtime
        uses: ./consent-protocol/.github/actions/setup-python-uv
        with:
          python-version: "3.13"
          protocol-dir: ./consent-protocol

      - name: Capture predeploy Cloud Run state
        id: predeploy-state
        shell: bash
        run: |
          set -euo pipefail

          if ! gcloud run services describe "${{ env.BACKEND_SERVICE }}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --region="${{ env.GCP_REGION }}" \
            --format=json > /tmp/uat-backend-predeploy-service.json 2>/dev/null; then
            printf '{}\n' > /tmp/uat-backend-predeploy-service.json
          fi
          if ! gcloud run services describe "${{ env.FRONTEND_SERVICE }}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --region="${{ env.GCP_REGION }}" \
            --format=json > /tmp/uat-frontend-predeploy-service.json 2>/dev/null; then
            printf '{}\n' > /tmp/uat-frontend-predeploy-service.json
          fi

          backend_state="$(python3 scripts/ci/resolve-cloud-run-serving-state.py \
            --service-json /tmp/uat-backend-predeploy-service.json \
            --allow-missing \
            --github-output "$GITHUB_OUTPUT" \
            --output-prefix backend)"
          frontend_state="$(python3 scripts/ci/resolve-cloud-run-serving-state.py \
            --service-json /tmp/uat-frontend-predeploy-service.json \
            --allow-missing \
            --github-output "$GITHUB_OUTPUT" \
            --output-prefix frontend)"

          # The labels below are looked up from the order-safe serving revision
          # emitted by the resolver, never latestReadyRevisionName or traffic[0].
          backend_revision="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["revision"])' <<<"${backend_state}")"
          frontend_revision="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["revision"])' <<<"${frontend_state}")"
          backend_sha=""
          if [ -n "${backend_revision}" ]; then
            backend_sha="$(gcloud run revisions describe "${backend_revision}" \
              --project="${{ env.GCP_PROJECT_ID }}" \
              --region="${{ env.GCP_REGION }}" \
              --format='value(metadata.labels.deploy-sha)' 2>/dev/null || true)"
          fi
          frontend_sha=""
          if [ -n "${frontend_revision}" ]; then
            frontend_sha="$(gcloud run revisions describe "${frontend_revision}" \
              --project="${{ env.GCP_PROJECT_ID }}" \
              --region="${{ env.GCP_REGION }}" \
              --format='value(metadata.labels.deploy-sha)' 2>/dev/null || true)"
          fi

          echo "backend_sha=${backend_sha}" >> "$GITHUB_OUTPUT"
          echo "frontend_sha=${frontend_sha}" >> "$GITHUB_OUTPUT"

      - name: Resolve deployment scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/resolve-deploy-scope.py \
            --requested-scope "${{ github.event.inputs.scope }}" \
            --target-sha "${{ steps.resolve-sha.outputs.sha }}" \
            --backend-base-sha "${{ steps.predeploy-state.outputs.backend_sha }}" \
            --frontend-base-sha "${{ steps.predeploy-state.outputs.frontend_sha }}" \
            --github-output "$GITHUB_OUTPUT" \
            --json

      - name: Require exact-SHA dev acceptance
        id: predecessor-acceptance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 "${RUNNER_TEMP}/release-tools/verify-predecessor-acceptance.py" require \
            --environment dev --sha "${{ steps.resolve-sha.outputs.sha }}" \
            --scope "${{ steps.scope.outputs.scope }}" --output /tmp/uat-predecessor-acceptance.json

      - name: Resolve the exact accepted Dev backend image
        if: steps.scope.outputs.deploy_backend == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 "${RUNNER_TEMP}/release-tools/verify-predecessor-acceptance.py" backend-image \
            --environment dev --sha "${{ steps.resolve-sha.outputs.sha }}" \
            --predecessor /tmp/uat-predecessor-acceptance.json \
            --output /tmp/uat-dev-backend-image.json

      - name: Resolve retained protected document maintenance
        id: document-mode
        shell: bash
        run: |
          set -euo pipefail
          python3 deploy/drive/resolve_protected_document_release.py \
            --project "${{ env.GCP_PROJECT_ID }}" --environment uat \
            --target-sha "${{ steps.resolve-sha.outputs.sha }}" \
            --required-ancestor "$(cat "${RUNNER_TEMP}/release-tools/protected-document-reader-commit")" \
            --github-output "$GITHUB_OUTPUT" \
            | tee /tmp/uat-protected-document-release.json
          if [ "${{ inputs.preserve_paused_drive_worker }}" = true ] \
             && [ "$(python3 -c 'import json; print(str(json.load(open("/tmp/uat-protected-document-release.json"))["configured"]).lower())')" = true ]; then
            echo "Hosted copies require the regular private sharing maintenance worker." >&2
            exit 1
          fi

      - name: Enforce UAT database connection budget before deployment
        shell: bash
        env:
          DEPLOY_BACKEND: ${{ steps.scope.outputs.deploy_backend }}
          DEPLOY_FRONTEND: ${{ steps.scope.outputs.deploy_frontend }}
          ADMITTED_SCOPE: ${{ needs.wait-capacity.outputs.scope }}
        run: |
          set -euo pipefail
          if [ "${{ steps.scope.outputs.scope }}" != "$ADMITTED_SCOPE" ]; then
            echo "UAT deploy scope changed after capacity admission; refusing deployment." >&2
            exit 1
          fi
          if [ "$DEPLOY_BACKEND" = true ]; then
            candidate_services=(--candidate-service consent-protocol)
            if [ "${{ inputs.preserve_paused_drive_worker }}" = true ]; then
              candidate_services+=(--candidate-service consent-protocol-drive-v1-worker)
            else
              candidate_services+=(--candidate-service consent-protocol-drive-worker)
              if [ "${{ vars.DRIVE_FOUR_GROUP_INDEX_UAT_ENABLED || 'false' }}" = true ]; then
                candidate_services+=(--candidate-service consent-protocol-drive-v1-worker)
              fi
            fi
            timeout --signal=TERM --kill-after=2s 295s python3 scripts/ci/runtime-capacity-budget.py --environment uat \
              "${candidate_services[@]}"
          elif [ "$DEPLOY_FRONTEND" = true ]; then
            timeout --signal=TERM --kill-after=2s 295s python3 scripts/ci/runtime-capacity-budget.py --environment uat --frontend-only
          else
            echo "No resolved UAT deploy scope; refusing capacity admission." >&2
            exit 1
          fi

      - name: Verify prompt UAT Drive worker wake grant
        if: steps.scope.outputs.deploy_backend == 'true' && inputs.preserve_paused_drive_worker != true
        shell: bash
        run: |
          set -euo pipefail
          # The API only runs the two fixed Drive drain jobs; their scheduled
          # runs remain the durable recovery path. Project IAM is provisioned
          # by an operator; the deployer verifies it before the new API serves.
          gcloud projects get-iam-policy "${{ env.GCP_PROJECT_ID }}" --format=json \
            | RUNTIME_SERVICE_ACCOUNT="${{ env.RUNTIME_SERVICE_ACCOUNT }}" python3 -c '
          import json, os, sys
          member = "serviceAccount:" + os.environ["RUNTIME_SERVICE_ACCOUNT"]
          policy = json.load(sys.stdin)
          if not any(binding.get("role") == "roles/cloudscheduler.jobRunner"
                     and member in binding.get("members", []) and not binding.get("condition")
                     for binding in policy.get("bindings", [])):
              raise SystemExit("Drive work wake Cloud Scheduler run grant is missing")
          '

      # A manually paused Drive queue is an operator maintenance state. Capture
      # it before any release mutation; the opt-in path never deploys the worker,
      # retargets the jobs, or calls jobs run. The final gate checks exact drift.
      - name: Capture paused Drive maintenance baseline
        id: capture-paused-drive-maintenance
        if: inputs.preserve_paused_drive_worker == true
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.scope.outputs.deploy_backend }}" != "true" ]; then
            echo "Preserving paused Drive jobs requires a backend release" >&2
            exit 1
          fi
          gcloud scheduler jobs list \
            --project="${{ env.GCP_PROJECT_ID }}" --location="${{ env.GCP_REGION }}" \
            --format=json > /tmp/uat-paused-drive-pre-scheduler.json
          gcloud run services describe consent-protocol-drive-worker \
            --project="${{ env.GCP_PROJECT_ID }}" --region="${{ env.GCP_REGION }}" \
            --format=json > /tmp/uat-paused-drive-pre-worker.json
          python3 deploy/drive/attest_paused_maintenance.py capture \
            --scheduler-snapshot /tmp/uat-paused-drive-pre-scheduler.json \
            --worker-snapshot /tmp/uat-paused-drive-pre-worker.json \
            --baseline /tmp/uat-paused-drive-baseline.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Resolve rollback targets from predeploy traffic
        id: rollback-targets
        shell: bash
        run: |
          set -euo pipefail

          # This tag intentionally moves after every healthy UAT release. Force
          # refresh it so a reused checkout cannot resolve a stale local tag.
          git fetch --force origin \
            refs/tags/deployed/uat-latest:refs/tags/deployed/uat-latest

          # An audited traffic restore can serve a verified revision without
          # moving the last-known-good tag. On failure, return to the revision
          # actually serving before this run rather than an older tag target.
          backend_revision="${{ steps.predeploy-state.outputs.backend_revision }}"
          if [ "${{ steps.scope.outputs.deploy_backend }}" = "true" ]; then
            if [ -z "${backend_revision}" ]; then
              backend_revision="$(
                ROLLBACK_VERIFY_SERVICE="${{ env.BACKEND_SERVICE }}" \
                ROLLBACK_VERIFY_REGION="${{ env.GCP_REGION }}" \
                ROLLBACK_VERIFY_PROJECT="${{ env.GCP_PROJECT_ID }}" \
                bash scripts/ci/resolve-rollback-target.sh uat backend
              )"
            fi
          else
            backend_revision=""
          fi

          frontend_revision="${{ steps.predeploy-state.outputs.frontend_revision }}"
          if [ "${{ steps.scope.outputs.deploy_frontend }}" = "true" ]; then
            if [ -z "${frontend_revision}" ]; then
              frontend_revision="$(
                ROLLBACK_VERIFY_SERVICE="${{ env.FRONTEND_SERVICE }}" \
                ROLLBACK_VERIFY_REGION="${{ env.GCP_REGION }}" \
                ROLLBACK_VERIFY_PROJECT="${{ env.GCP_PROJECT_ID }}" \
                bash scripts/ci/resolve-rollback-target.sh uat frontend
              )"
            fi
          else
            frontend_revision=""
          fi

          echo "backend_revision=${backend_revision}" >> "$GITHUB_OUTPUT"
          echo "frontend_revision=${frontend_revision}" >> "$GITHUB_OUTPUT"

      - name: Resolve UAT verification plan
        id: verification-plan
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/resolve-uat-verification-plan.py \
            --target-sha "${{ steps.resolve-sha.outputs.sha }}" \
            --backend-base-sha "${{ steps.predeploy-state.outputs.backend_sha }}" \
            --frontend-base-sha "${{ steps.predeploy-state.outputs.frontend_sha }}" \
            --deploy-backend "${{ steps.scope.outputs.deploy_backend }}" \
            --deploy-frontend "${{ steps.scope.outputs.deploy_frontend }}" \
            --run-live-model-checks "${{ inputs.run_live_model_checks && 'true' || 'false' }}" \
            --github-output "$GITHUB_OUTPUT" \
            --json-output /tmp/uat-verification-plan.json

      - name: Upload verification-plan artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: uat-verification-plan
          path: /tmp/uat-verification-plan.json
          if-no-files-found: error

      - name: Set up Node runtime for UAT browser verification
        if: steps.scope.outputs.deploy_frontend == 'true' || steps.verification-plan.outputs.requires_web_dependencies == 'true' || inputs.run_pwm_acceptance
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: hushh-webapp/package-lock.json

      - name: Cache UAT Chromium binaries
        if: steps.scope.outputs.deploy_frontend == 'true' || steps.verification-plan.outputs.requires_web_dependencies == 'true' || inputs.run_pwm_acceptance
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # CI's browser cache also promises WebKit; this lane installs Chromium.
          key: ${{ runner.os }}-uat-chromium-${{ hashFiles('hushh-webapp/package-lock.json') }}

      - name: Install UAT browser verification dependencies
        id: install-browser-dependencies
        if: steps.scope.outputs.deploy_frontend == 'true' || steps.verification-plan.outputs.requires_web_dependencies == 'true' || inputs.run_pwm_acceptance
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix hushh-webapp --prefer-offline --no-audit --progress=false
          # Keep the runner's signed archive/security fallbacks. PR CI uses this
          # same removal after the preferred Azure mirror stalled for 23 minutes.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '\|^http://azure\.archive\.ubuntu\.com/ubuntu/[[:space:]]|d' /etc/apt/apt-mirrors.txt
          fi
          # Always verify installation, including restored binaries and system
          # libraries. Playwright reuses its completed browser downloads.
          for attempt in 1 2; do
            if (cd hushh-webapp && npx --no-install playwright install --with-deps chromium); then
              break
            fi
            if [ "$attempt" -eq 2 ]; then
              echo "::error::UAT Chromium installation failed twice."
              exit 1
            fi
            sleep 15
          done

      - name: Verify One Location read-only rollout prerequisites
        id: one_location_read_only_rollout
        shell: bash
        env:
          ONE_LOCATION_READ_ONLY_STATE_REQUESTED: ${{ vars.ONE_LOCATION_READ_ONLY_STATE_ENABLED || 'false' }}
        run: |
          set -euo pipefail

          requested="${ONE_LOCATION_READ_ONLY_STATE_REQUESTED}"
          requested="${requested#"${requested%%[![:space:]]*}"}"
          requested="${requested%"${requested##*[![:space:]]}"}"
          requested="${requested,,}"
          case "${requested}" in
            1|true|yes|on)
              normalized_requested="true"
              ;;
            ""|0|false|no|off)
              normalized_requested="false"
              ;;
            *)
              echo "Refusing UAT deployment: ONE_LOCATION_READ_ONLY_STATE_ENABLED must be a recognized boolean."
              exit 1
              ;;
          esac
          echo "enabled=${normalized_requested}" >> "${GITHUB_OUTPUT}"

          if [[ "${normalized_requested}" != "true" ]]; then
            echo "One Location read-only state remains disabled for this UAT rollout."
            exit 0
          fi

          scheduler_job="one-location-retention-purge-uat"
          expected_target="/api/one/location/retention/purge?older_than_hours=12"
          expected_uri="${CONSENT_API_RUNTIME_ORIGIN%/}${expected_target}"
          if ! scheduler_evidence="$(
            gcloud scheduler jobs describe "${scheduler_job}" \
              --project="${GCP_PROJECT_ID}" \
              --location="${GCP_REGION}" \
              --format=json 2>/dev/null \
            | "${PROTOCOL_PYTHON}" -c '
          import json
          import sys

          payload = json.load(sys.stdin)
          target = payload.get("httpTarget") or {}
          headers = target.get("headers") or {}
          auth_present = any(
              str(key).strip().lower() == "x-hushh-maintenance-token"
              and bool(str(value).strip())
              for key, value in headers.items()
          )
          print("\t".join((
              str(payload.get("state") or ""),
              str(target.get("uri") or ""),
              str(target.get("httpMethod") or ""),
              "true" if auth_present else "false",
          )))
          '
          )"; then
            echo "Refusing to enable One Location read-only state: the canonical UAT retention scheduler is missing."
            exit 1
          fi

          IFS=$'\t' read -r scheduler_state scheduler_uri scheduler_method scheduler_auth_present \
            <<<"${scheduler_evidence}"
          if [[ "${scheduler_state}" != "ENABLED" ]]; then
            echo "Refusing to enable One Location read-only state: the canonical UAT retention scheduler is not ENABLED."
            exit 1
          fi
          if [[ "${scheduler_method^^}" != "POST" ]]; then
            echo "Refusing to enable One Location read-only state: the canonical UAT retention scheduler is not configured for POST."
            exit 1
          fi
          if [[ "${scheduler_auth_present}" != "true" ]]; then
            echo "Refusing to enable One Location read-only state: the canonical UAT retention scheduler has no maintenance-auth header."
            exit 1
          fi

          scheduler_target="$("${PROTOCOL_PYTHON}" - "${scheduler_uri}" <<'PY'
          import sys
          from urllib.parse import urlsplit

          target = urlsplit(sys.argv[1])
          if (
              target.scheme != "https"
              or not target.netloc
              or target.username
              or target.password
              or target.fragment
          ):
              raise SystemExit(1)
          suffix = target.path
          if target.query:
              suffix = f"{suffix}?{target.query}"
          print(suffix)
          PY
          )" || {
            echo "Refusing to enable One Location read-only state: the scheduler target is not a canonical HTTPS endpoint."
            exit 1
          }

          if [[ "${scheduler_target}" != "${expected_target}" || "${scheduler_uri}" != "${expected_uri}" ]]; then
            echo "Refusing to enable One Location read-only state: the scheduler does not target the canonical UAT retention endpoint."
            exit 1
          fi

          # Deliberately report only the job identity. Header values remain in
          # the private gcloud-to-Python pipe and are reduced to a boolean.
          echo "Verified ENABLED One Location retention scheduler: ${scheduler_job}."

      - name: Sync canonical hosted runtime secrets
        shell: bash
        # These repository variables are UAT-only rollout controls. Passing them
        # through the environment (not inline expressions in shell) keeps an
        # opaque Firebase UID cohort from becoming executable shell text.
        env:
          UAT_ONE_PROFILE_RESEARCH_ENABLED: ${{ vars.ONE_PROFILE_RESEARCH_ENABLED_UAT || 'false' }}
          UAT_ONE_MAGIC_INTELLIGENCE_PHASE: ${{ vars.ONE_MAGIC_INTELLIGENCE_PHASE_UAT || '1' }}
          UAT_ONE_MAGIC_INTELLIGENCE_INNER_TEAM_EMAILS: ${{ vars.ONE_MAGIC_INTELLIGENCE_INNER_TEAM_EMAILS_UAT || '' }}
          UAT_ONE_MAGIC_INTELLIGENCE_SENIOR_TEAM_EMAILS: ${{ vars.ONE_MAGIC_INTELLIGENCE_SENIOR_TEAM_EMAILS_UAT || 'ankit@hushh.ai,i-akshat@hush1one.com,i-neelesh@hushh.ai,kushal@hushh.ai' }}
          UAT_ONE_MAGIC_INTELLIGENCE_QA_EMAILS: ${{ vars.ONE_MAGIC_INTELLIGENCE_QA_EMAILS_UAT || 'jhumma@hushh.ai' }}
          UAT_CONNECTIONS_PANEL_V2: ${{ vars.CONNECTIONS_PANEL_V2_UAT || 'false' }}
          UAT_GOOGLE_DRIVE_CONNECTION: ${{ vars.GOOGLE_DRIVE_CONNECTION_UAT || 'false' }}
          UAT_GOOGLE_DRIVE_LIVE: ${{ vars.GOOGLE_DRIVE_LIVE_UAT || 'false' }}
          UAT_GOOGLE_DRIVE_PICKER: ${{ vars.GOOGLE_DRIVE_PICKER_UAT || 'false' }}
          UAT_DRIVE_DOCUMENT_INDEXING: ${{ vars.DRIVE_DOCUMENT_INDEXING_UAT || 'false' }}
          UAT_DRIVE_DOCUMENT_SHARING: ${{ vars.DRIVE_DOCUMENT_SHARING_UAT || 'false' }}
          # Legacy agent packages and continuous collection stay retired.
          # Provider-discovery period packets have separate admission.
          UAT_DRIVE_AGENT_PACKAGES_ENABLED: 'false'
          UAT_DRIVE_PERIOD_PACKETS_ENABLED: ${{ vars.DRIVE_PERIOD_PACKETS_ENABLED_UAT || 'true' }}
          UAT_GMAIL_CHAT_READS: ${{ vars.GMAIL_CHAT_READS_UAT || 'false' }}
          UAT_GOOGLE_DRIVE_CHAT_READS: ${{ vars.GOOGLE_DRIVE_CHAT_READS_UAT || 'false' }}
          UAT_CURATED_MCP_CONNECTORS: ${{ vars.CURATED_MCP_CONNECTORS_UAT || 'false' }}
          UAT_CONNECTOR_INTERNAL_OWNER_COHORT: ${{ vars.CONNECTOR_INTERNAL_OWNER_COHORT_UAT || '' }}
          UAT_CONNECTOR_ALL_USERS: ${{ vars.CONNECTOR_UAT_ALL_USERS_UAT || 'false' }}
        run: |
          set -euo pipefail
          email_auth_args=()
          if [[ -f scripts/ops/email_auth_uat_release.py ]] && \
              grep -q -- '--email-auth-enabled' scripts/ops/sync_backend_runtime_secrets.py; then
            email_auth_args=(--email-auth-enabled "$UAT_EMAIL_AUTH_ENABLED")
            if [[ "${{ steps.scope.outputs.deploy_backend }}" == "true" ]]; then
              "${{ env.PROTOCOL_PYTHON }}" scripts/ops/email_auth_uat_release.py preflight
            fi
          elif [[ "$UAT_EMAIL_AUTH_ENABLED" != "false" ]]; then
            echo "Selected SHA cannot preserve enabled email OTP; disable EMAIL_AUTH_ENABLED_UAT for an older approved release." >&2
            exit 1
          fi
          drive_group_args=()
          if grep -q -- '--drive-four-group-index' scripts/ops/sync_backend_runtime_secrets.py; then
            drive_group_args=(--drive-four-group-index "${{ vars.DRIVE_FOUR_GROUP_INDEX_UAT_ENABLED || 'false' }}")
          fi
          drive_period_packet_args=()
          if grep -q -- '--drive-period-packets-enabled' scripts/ops/sync_backend_runtime_secrets.py; then
            drive_period_packet_args=(--drive-period-packets-enabled "$UAT_DRIVE_PERIOD_PACKETS_ENABLED")
          fi
          "${{ env.PROTOCOL_PYTHON }}" scripts/ops/sync_backend_runtime_secrets.py \
            --project "${{ env.GCP_PROJECT_ID }}" \
            --environment uat \
            "${email_auth_args[@]}" \
            --app-frontend-origin "${{ env.APP_FRONTEND_ORIGIN }}" \
            --db-host "cloudsql-socket" \
            --db-port "5432" \
            --db-name "postgres" \
            --db-unix-socket "${{ env.UAT_DB_UNIX_SOCKET }}" \
            --cloudsql-instance-connection-name "${{ env.UAT_CLOUDSQL_INSTANCE }}" \
            --consent-sse-enabled "true" \
            --sync-remote-enabled "false" \
            --developer-api-enabled "true" \
            --remote-mcp-enabled "true" \
            --cors-allowed-origins "${{ env.APP_FRONTEND_ORIGIN }}" \
            --obs-data-stale-ratio-threshold "0.25" \
            --plaid-env "production" \
            --plaid-client-name "Hushh Kai" \
            --plaid-country-codes "US" \
            --plaid-webhook-url "${{ env.APP_FRONTEND_ORIGIN }}/api/kai/plaid/webhook" \
            --plaid-redirect-path "/kai/plaid/oauth/return" \
            --plaid-tx-history-days "730" \
            --connections-panel-v2 "$UAT_CONNECTIONS_PANEL_V2" \
            --google-drive-connection "$UAT_GOOGLE_DRIVE_CONNECTION" \
            --google-drive-live "$UAT_GOOGLE_DRIVE_LIVE" \
            --google-drive-picker "$UAT_GOOGLE_DRIVE_PICKER" \
            --drive-document-indexing "$UAT_DRIVE_DOCUMENT_INDEXING" \
            "${drive_group_args[@]}" \
            --drive-document-sharing "$UAT_DRIVE_DOCUMENT_SHARING" \
            --drive-agent-packages-enabled "$UAT_DRIVE_AGENT_PACKAGES_ENABLED" \
            "${drive_period_packet_args[@]}" \
            --gmail-chat-reads "$UAT_GMAIL_CHAT_READS" \
            --google-drive-chat-reads "$UAT_GOOGLE_DRIVE_CHAT_READS" \
            --curated-mcp-connectors "$UAT_CURATED_MCP_CONNECTORS" \
            --connector-internal-owner-cohort "$UAT_CONNECTOR_INTERNAL_OWNER_COHORT" \
            --connector-uat-all-users "$UAT_CONNECTOR_ALL_USERS" \
            --one-location-read-only-state-enabled "${{ steps.one_location_read_only_rollout.outputs.enabled }}" \
            --consent-center-summary-v2-enabled "${{ vars.CONSENT_CENTER_SUMMARY_V2_ENABLED || 'true' }}" \
            --db-bulk-batching-enabled "${{ vars.DB_BULK_BATCHING_ENABLED || 'false' }}" \
            --hushh-trusted-device-enabled "${{ vars.HUSSH_TRUSTED_DEVICE_ENABLED || 'false' }}" \
            --one-location-nearby-presence-mode "${{ vars.ONE_LOCATION_NEARBY_PRESENCE_MODE_UAT || '' }}" \
            --one-location-nearby-presence-cohort "${{ vars.ONE_LOCATION_NEARBY_PRESENCE_COHORT_UAT || '' }}" \
            --hushh-trusted-device-uat-allowlist "${{ vars.HUSSH_TRUSTED_DEVICE_UAT_ALLOWLIST || '' }}" \
            --hushh-tech-client-enabled "${{ vars.HUSSH_TECH_CLIENT_ENABLED || 'false' }}" \
            --hushh-tech-developer-app-id "${{ vars.HUSSH_TECH_DEVELOPER_APP_ID || '' }}" \
            --hushh-tech-allowed-audience "hushh-tech-uat" \
            --hushh-tech-allowed-redirect-uris "https://uat.hushhtech.com/auth/hushh-research/callback" \
            --hushh-tech-allowed-consent-scopes "${{ vars.HUSSH_TECH_ALLOWED_CONSENT_SCOPES || '' }}" \
            --hushh-tech-uat-firebase-uid-allowlist "${{ vars.HUSSH_TECH_UAT_FIREBASE_UID_ALLOWLIST || '' }}" \
            --hushh-tech-shadow-max-age-ms "604800000" \
            --hushh-tech-trusted-proxy-hops "${{ vars.HUSSH_TECH_TRUSTED_PROXY_HOPS || '0' }}" \
            --hushh-tech-proxy-audience "${{ env.CONSENT_API_RUNTIME_ORIGIN }}" \
            --hushh-tech-trusted-proxy-service-accounts "${{ env.FRONTEND_RUNTIME_SERVICE_ACCOUNT }},${{ vars.HUSSH_TECH_TRUSTED_PROXY_SERVICE_ACCOUNTS || '' }}" \
            --advisors-api-base-url "${{ vars.ADVISORS_API_BASE_URL || 'https://brokercheck.35.253.255.106.sslip.io' }}" \
            --insurance-agents-api-base-url "${{ vars.INSURANCE_AGENTS_API_BASE_URL || 'https://insurance-agents.34.61.69.175.sslip.io' }}" \
            --one-places-directory-enabled "${{ vars.ONE_PLACES_DIRECTORY_ENABLED_UAT || 'true' }}" \
            --one-business-directory-enabled "${{ vars.ONE_BUSINESS_DIRECTORY_ENABLED_UAT || 'false' }}" \
            --one-profile-research-enabled "$UAT_ONE_PROFILE_RESEARCH_ENABLED" \
            --one-magic-intelligence-phase "$UAT_ONE_MAGIC_INTELLIGENCE_PHASE" \
            --one-magic-intelligence-inner-team-emails "$UAT_ONE_MAGIC_INTELLIGENCE_INNER_TEAM_EMAILS" \
            --one-magic-intelligence-senior-team-emails "$UAT_ONE_MAGIC_INTELLIGENCE_SENIOR_TEAM_EMAILS" \
            --one-magic-intelligence-qa-emails "$UAT_ONE_MAGIC_INTELLIGENCE_QA_EMAILS" \
            --one-voice-mail-reply-enabled "${{ vars.ONE_VOICE_MAIL_REPLY_ENABLED_UAT || 'true' }}" \
            --one-voice-mail-schedule-send-enabled "${{ vars.ONE_VOICE_MAIL_SCHEDULE_SEND_ENABLED_UAT || 'true' }}" \
            --one-voice-mail-drafts-enabled "${{ vars.ONE_VOICE_MAIL_DRAFTS_ENABLED_UAT || 'true' }}" \
            --mail-scheduled-drain-enabled "${{ vars.MAIL_SCHEDULED_DRAIN_ENABLED_UAT || 'true' }}" \
            > /tmp/uat-runtime-secret-sync.json

          "${{ env.PROTOCOL_PYTHON }}" scripts/ops/sync_frontend_runtime_secrets.py \
            --project "${{ env.GCP_PROJECT_ID }}" \
            --environment uat \
            > /tmp/uat-frontend-runtime-secret-sync.json

      # The web image does not depend on the migration fence, the migrations or
      # the backend candidate, so it is built while they run instead of after
      # them. It starts only after the runtime secret sync above, because the
      # build compiles NEXT_PUBLIC_* values from this project's Secret Manager.
      # The lane comes back for it in "Wait for frontend image and pin its
      # digest", right before the frontend deploy, so the deploy, analytics
      # smoke and promotion order is unchanged.
      - name: Start frontend image build in parallel
        id: start-frontend-image-build
        if: steps.scope.outputs.deploy_frontend == 'true'
        shell: bash
        run: |
          set -euo pipefail
          image_tag="uat-${{ steps.resolve-sha.outputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
          # The single definition of every value compiled into the web image.
          # The deploy step reuses it, so the build and deploy cannot disagree.
          build_substitutions="_APP_ENV=uat,_DEPLOY_ENV=uat,_IMAGE_TAG=${image_tag},_ONE_WALLET_CARD_ENABLED=true,_ONE_LOCATION_NEARBY_CHECK_IN=true,_LOCATION_MAP_DEMO=false"
          # Older deployment SHAs do not declare this substitution in both builds.
          if grep -q '^[[:space:]]*_WORKOS_SSO_ENABLED:' deploy/frontend.cloudbuild.yaml \
            && grep -q '^[[:space:]]*_WORKOS_SSO_ENABLED:' deploy/frontend-image.cloudbuild.yaml; then
            build_substitutions="${build_substitutions},_WORKOS_SSO_ENABLED=${{ vars.WORKOS_SSO_UAT_ENABLED || 'false' }}"
          fi
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"
          echo "build_substitutions=${build_substitutions}" >> "$GITHUB_OUTPUT"
          # A deployment SHA from before the split has no build-only config.
          # It keeps the combined build-and-deploy, serially, exactly as before.
          if [ ! -f deploy/frontend-image.cloudbuild.yaml ] \
            || ! grep -q '_SKIP_IMAGE_BUILD' deploy/frontend.cloudbuild.yaml; then
            echo "prebuilt=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Frontend image build::This SHA predates the prebuilt frontend image; using the combined build-and-deploy."
            exit 0
          fi
          build_id="$(gcloud builds submit \
            --async \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --config=deploy/frontend-image.cloudbuild.yaml \
            --format='value(id)' \
            "--substitutions=${build_substitutions}")"
          if [[ ! "${build_id}" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
            echo "Frontend image build did not return a Cloud Build id." >&2
            exit 1
          fi
          echo "Started frontend image build ${build_id}."
          echo "build_id=${build_id}" >> "$GITHUB_OUTPUT"
          echo "prebuilt=true" >> "$GITHUB_OUTPUT"

      - name: Build and pin backend image before lifecycle migration
        id: build-backend-image
        if: steps.scope.outputs.deploy_backend == 'true'
        shell: bash
        env:
          BACKEND_IMAGE_SOURCE: ${{ inputs.backend_image_source || 'auto' }}
        run: |
          set -euo pipefail
          image_tag="uat-${{ steps.resolve-sha.outputs.sha }}"
          image_repository="gcr.io/${{ env.GCP_PROJECT_ID }}/consent-protocol"
          dev_image="$(python3 -c '
          import json, re
          pin = json.load(open("/tmp/uat-dev-backend-image.json"))
          ref = pin.get("image_reference", "")
          if "image_reference" in pin:
              assert isinstance(ref, str) and re.fullmatch(r"gcr\.io/hushh-pda-dev/consent-protocol@sha256:[0-9a-f]{64}", ref), "Invalid accepted Dev image"
          print(ref)
          ')"
          case "${BACKEND_IMAGE_SOURCE}" in
            auto)
              if [ -n "${dev_image}" ]; then
                image_source=promote-from-dev
              else
                image_source=build-from-source
                echo "::notice title=Historical Dev acceptance::No image proof was recorded; building this backend from source."
              fi
              ;;
            build-from-source|promote-from-dev) image_source="${BACKEND_IMAGE_SOURCE}" ;;
            *) echo "Invalid backend image source." >&2; exit 1 ;;
          esac
          if [ "${image_source}" = promote-from-dev ]; then
            if [[ ! "${dev_image}" =~ ^gcr\.io/hushh-pda-dev/consent-protocol@sha256:[0-9a-f]{64}$ ]]; then
              echo "Accepted Dev executable image proof is required for promotion." >&2
              exit 1
            fi
            # Copy immutable bytes into UAT. Missing permission or a missing
            # image fails before migrations; there is no automatic build retry.
            gcloud container images add-tag --quiet "${dev_image}" "${image_repository}:${image_tag}"
          else
            gcloud builds submit \
              --project="${{ env.GCP_PROJECT_ID }}" \
              --config=deploy/backend-image.cloudbuild.yaml \
              "--substitutions=_IMAGE_TAG=${image_tag}"
          fi
          image_digest="$(gcloud container images describe \
            "${image_repository}:${image_tag}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --format='value(image_summary.digest)')"
          if [[ ! "${image_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Backend image build did not resolve an immutable sha256 digest." >&2
            exit 1
          fi
          image_reference="${image_repository}@${image_digest}"
          # Buildx attestations live in a parent index. Pin its executable child
          # before the fence; Cloud Run must later report this exact digest.
          gcloud auth configure-docker gcr.io --quiet
          docker buildx imagetools inspect --raw "${image_reference}" \
            > /tmp/uat-backend-image-manifest.json
          image_reference="$(python3 scripts/ci/resolve-cloud-run-image.py \
            --image-reference "${image_reference}" \
            --manifest-json /tmp/uat-backend-image-manifest.json \
            --sha "${{ steps.resolve-sha.outputs.sha }}" \
            --json-output /tmp/uat-backend-image.json)"
          if [ "${image_source}" = promote-from-dev ] \
            && [ "${image_reference}" != "${image_repository}@${dev_image#*@}" ]; then
            echo "Copied backend executable digest differs from the accepted Dev image." >&2
            exit 1
          fi
          echo "image_reference=${image_reference}" >> "$GITHUB_OUTPUT"
          echo "image_source=${image_source}" >> "$GITHUB_OUTPUT"

      - name: Refuse an already failed frontend image before lifecycle migration
        id: check-frontend-image
        if: steps.scope.outputs.deploy_frontend == 'true' && steps.start-frontend-image-build.outputs.prebuilt == 'true'
        shell: bash
        env:
          FRONTEND_IMAGE_BUILD_ID: ${{ steps.start-frontend-image-build.outputs.build_id }}
        run: |
          set -euo pipefail
          # The workflow is main-owned; the helper comes from the candidate.
          # Historical candidates retain the required final image join.
          if ! grep -Fq -- '--status-only)' scripts/ci/await-prebuilt-image.sh; then
            echo "::notice title=Frontend image status::This candidate predates the early check; retaining the final image join."
            exit 0
          fi
          bash scripts/ci/await-prebuilt-image.sh \
            --project "${{ env.GCP_PROJECT_ID }}" \
            --build-id "${FRONTEND_IMAGE_BUILD_ID}" --status-only

      - name: Install Cloud SQL Auth Proxy
        if: steps.scope.outputs.deploy_backend == 'true' || steps.verification-plan.outputs.run_pkm_upgrade_gate == 'true' || steps.document-mode.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.18.3/cloud-sql-proxy.linux.amd64 \
            -o /usr/local/bin/cloud-sql-proxy
          chmod +x /usr/local/bin/cloud-sql-proxy

      - name: Verify protected document reader and rollback compatibility
        if: steps.document-mode.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          "${{ env.PROTOCOL_PYTHON }}" deploy/drive/resolve_protected_document_release.py \
            --project "${{ env.GCP_PROJECT_ID }}" --environment uat \
            --target-sha "${{ steps.resolve-sha.outputs.sha }}" \
            --required-ancestor "$(cat "${RUNNER_TEMP}/release-tools/protected-document-reader-commit")" \
            --verify-previous --json-output /tmp/uat-document-reader-compatibility.json
          echo "HUSHH_DOCUMENT_READER_GUARD_REPORT=/tmp/uat-document-reader-compatibility.json" >> "$GITHUB_ENV"
          echo "HUSHH_DOCUMENT_READER_ENVIRONMENT=uat" >> "$GITHUB_ENV"

      - name: Qualify current account lifecycle producer
        if: steps.scope.outputs.deploy_backend == 'true'
        run: python3 deploy/account-deletion/activate_release.py --qualify-source "${{ steps.resolve-sha.outputs.sha }}"

      - name: Qualify uninterrupted account deletion
        id: account-deletion-fence-decision
        if: steps.scope.outputs.deploy_backend == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GCP_PROJECT_ID}" != "hushh-pda-uat" ] \
             || [ "${UAT_CLOUDSQL_INSTANCE}" != "hushh-pda-uat:us-central1:hushh-uat-pg" ]; then
            echo "Refusing account deletion preflight on a non-canonical UAT target."
            exit 1
          fi
          if ! gcloud run revisions list \
            --service="${BACKEND_SERVICE}" --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" --format=json \
            > /tmp/uat-account-deletion-revisions.json; then
            printf '[]\n' > /tmp/uat-account-deletion-revisions.json
          fi
          decision="$(python3 scripts/ci/account-deletion-fence-decision.py \
            --revisions-json /tmp/uat-account-deletion-revisions.json \
            --backend-base-sha "${{ steps.predeploy-state.outputs.backend_sha }}" \
            --target-sha "${{ steps.resolve-sha.outputs.sha }}" \
            --github-output "$GITHUB_OUTPUT")"
          if [ "${decision}" = "unfenced_candidate" ]; then
            DB_USER="$(gcloud secrets versions access latest --secret=DB_USER --project="${GCP_PROJECT_ID}")"
            DB_PASSWORD="$(gcloud secrets versions access latest --secret=DB_PASSWORD --project="${GCP_PROJECT_ID}")"
            echo "::add-mask::${DB_USER}"
            echo "::add-mask::${DB_PASSWORD}"
            cloud-sql-proxy --address 127.0.0.1 --port 6543 \
              ${GOOGLE_GHA_CREDS_PATH:+--credentials-file="${GOOGLE_GHA_CREDS_PATH}"} \
              "${UAT_CLOUDSQL_INSTANCE}" >/tmp/cloud-sql-proxy-uat-deletion-preflight.log 2>&1 &
            PROXY_PID=$!
            trap 'kill "${PROXY_PID}" >/dev/null 2>&1 || true' EXIT
            python3 - <<'PY'
          import socket
          import time
          deadline = time.time() + 20
          while time.time() < deadline:
              with socket.socket() as sock:
                  sock.settimeout(0.5)
                  if sock.connect_ex(("127.0.0.1", 6543)) == 0:
                      raise SystemExit(0)
              time.sleep(0.25)
          raise SystemExit("Cloud SQL proxy did not bind for deletion preflight")
          PY
            if ! command -v psql >/dev/null 2>&1; then
              sudo apt-get update -qq
              sudo apt-get install -y -qq postgresql-client
            fi
            if PGHOST=127.0.0.1 PGPORT=6543 PGDATABASE=postgres \
               PGUSER="$DB_USER" PGPASSWORD="$DB_PASSWORD" \
               psql --no-psqlrc -v expected_fence_count=0 \
                 --file deploy/account-deletion/verify_release_boundary.sql \
                 > /tmp/uat-account-deletion-unfenced-preflight.log 2>&1; then
              echo "required=false" >> "$GITHUB_OUTPUT"
              echo "Verified active v201 database and revisions; deletion remains available."
              exit 0
            fi
            echo "Unfenced database verification failed; retaining the release fence."
          fi
          echo "required=true" >> "$GITHUB_OUTPUT"

      - name: Install fail-closed account deletion release fence
        id: install-account-deletion-fence
        if: steps.scope.outputs.deploy_backend == 'true' && steps.account-deletion-fence-decision.outputs.required == 'true'
        shell: bash
        run: |
          set -euo pipefail

          if [ "${GCP_PROJECT_ID}" != "hushh-pda-uat" ] \
             || [ "${UAT_CLOUDSQL_INSTANCE}" != "hushh-pda-uat:us-central1:hushh-uat-pg" ]; then
            echo "Refusing account deletion fence: project or Cloud SQL instance is not the canonical UAT target."
            exit 1
          fi
          export HUSSH_RELEASE_ENVIRONMENT=uat
          export CLOUDSQL_INSTANCE_CONNECTION_NAME="${UAT_CLOUDSQL_INSTANCE}"

          DB_USER="$(gcloud secrets versions access latest --secret=DB_USER --project="${{ env.GCP_PROJECT_ID }}")"
          DB_PASSWORD="$(gcloud secrets versions access latest --secret=DB_PASSWORD --project="${{ env.GCP_PROJECT_ID }}")"
          echo "::add-mask::${DB_USER}"
          echo "::add-mask::${DB_PASSWORD}"

          cloud-sql-proxy \
            --address 127.0.0.1 \
            --port 6543 \
            ${GOOGLE_GHA_CREDS_PATH:+--credentials-file="${GOOGLE_GHA_CREDS_PATH}"} \
            "${{ env.UAT_CLOUDSQL_INSTANCE }}" >/tmp/cloud-sql-proxy-uat.log 2>&1 &
          PROXY_PID=$!
          trap 'kill "${PROXY_PID}" >/dev/null 2>&1 || true' EXIT

          python3 - <<'PY'
          import socket
          import time

          deadline = time.time() + 20
          while time.time() < deadline:
              with socket.socket() as sock:
                  sock.settimeout(0.5)
                  if sock.connect_ex(("127.0.0.1", 6543)) == 0:
                      raise SystemExit(0)
              time.sleep(0.25)
          raise SystemExit("Cloud SQL proxy did not bind 127.0.0.1:6543 in time")
          PY

          export DB_HOST=127.0.0.1
          export DB_PORT=6543
          export DB_NAME=postgres
          export DB_USER
          export DB_PASSWORD

          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi

          export PGHOST="$DB_HOST"
          export PGPORT="$DB_PORT"
          export PGDATABASE="$DB_NAME"
          export PGUSER="$DB_USER"
          export PGPASSWORD="$DB_PASSWORD"
          psql --no-psqlrc \
            --file deploy/account-deletion/install_release_fence.sql \
            | tee /tmp/uat-account-deletion-fence-install.log
          echo "installed=true" >> "$GITHUB_OUTPUT"

      - name: Apply UAT DB migrations behind account deletion fence
        id: predeploy-db-gate
        if: steps.scope.outputs.deploy_backend == 'true'
        shell: bash
        run: |
          set -euo pipefail

          if [ "${GCP_PROJECT_ID}" != "hushh-pda-uat" ] \
             || [ "${UAT_CLOUDSQL_INSTANCE}" != "hushh-pda-uat:us-central1:hushh-uat-pg" ]; then
            echo "Refusing UAT migration: project or Cloud SQL instance is not the canonical UAT target."
            exit 1
          fi
          export HUSSH_RELEASE_ENVIRONMENT=uat
          export CLOUDSQL_INSTANCE_CONNECTION_NAME="${UAT_CLOUDSQL_INSTANCE}"

          DB_USER="$(gcloud secrets versions access latest --secret=DB_USER --project="${{ env.GCP_PROJECT_ID }}")"
          DB_PASSWORD="$(gcloud secrets versions access latest --secret=DB_PASSWORD --project="${{ env.GCP_PROJECT_ID }}")"
          echo "::add-mask::${DB_USER}"
          echo "::add-mask::${DB_PASSWORD}"

          cloud-sql-proxy \
            --address 127.0.0.1 \
            --port 6543 \
            ${GOOGLE_GHA_CREDS_PATH:+--credentials-file="${GOOGLE_GHA_CREDS_PATH}"} \
            "${{ env.UAT_CLOUDSQL_INSTANCE }}" >/tmp/cloud-sql-proxy-uat-migrate.log 2>&1 &
          PROXY_PID=$!
          trap 'kill "${PROXY_PID}" >/dev/null 2>&1 || true' EXIT

          python3 - <<'PY'
          import socket
          import time

          deadline = time.time() + 20
          while time.time() < deadline:
              with socket.socket() as sock:
                  sock.settimeout(0.5)
                  if sock.connect_ex(("127.0.0.1", 6543)) == 0:
                      raise SystemExit(0)
              time.sleep(0.25)
          raise SystemExit("Cloud SQL proxy did not bind 127.0.0.1:6543 in time")
          PY

          export DB_HOST=127.0.0.1
          export DB_PORT=6543
          export DB_NAME=postgres
          export DB_USER
          export DB_PASSWORD
          export PGHOST="$DB_HOST"
          export PGPORT="$DB_PORT"
          export PGDATABASE="$DB_NAME"
          export PGUSER="$DB_USER"
          export PGPASSWORD="$DB_PASSWORD"

          # A migration-201 transition must reassert the fence after connecting.
          # A verified v201-to-v201 rollout keeps deletion available instead.
          if [ "${{ steps.account-deletion-fence-decision.outputs.required }}" = "true" ]; then
            psql --no-psqlrc \
              --file deploy/account-deletion/install_release_fence.sql \
              | tee /tmp/uat-account-deletion-fence-premigration.log
          fi

          (
            cd consent-protocol
            "${{ env.PROTOCOL_PYTHON }}" db/migrate.py --release \
              --release-environment uat \
              --migration-mode "${{ vars.UAT_MIGRATION_MODE || 'replay' }}"
          )
          # Reconcile the fixed Drive connector after migrations while the
          # attested UAT database connection is available. This also migrates
          # the previously reviewed Hushh web return to the Hussh alias.
          "${{ env.PROTOCOL_PYTHON }}" consent-protocol/scripts/ops/reconcile_google_drive_uat_connector.py --activate
          "${{ env.PROTOCOL_PYTHON }}" consent-protocol/scripts/ops/reconcile_google_drive_uat_connector.py
          "${{ env.PROTOCOL_PYTHON }}" scripts/ops/db_migration_release_guard.py \
            --release-environment uat \
            --contract-file consent-protocol/db/contracts/uat_integrated_schema.json \
            --report-path /tmp/uat-db-migration-guard-predeploy.json
          if [[ "$UAT_EMAIL_AUTH_ENABLED" == "true" ]]; then
            "${{ env.PROTOCOL_PYTHON }}" scripts/ops/email_auth_uat_release.py activate \
              --actor "${{ github.actor }}" \
              --sha "${{ steps.resolve-sha.outputs.sha }}" \
              > /tmp/uat-email-auth-policy-activation.json
          fi
          expected_fence_count=0
          if [ "${{ steps.account-deletion-fence-decision.outputs.required }}" = "true" ]; then
            expected_fence_count=2
          fi
          psql --no-psqlrc -v "expected_fence_count=${expected_fence_count}" \
            --file deploy/account-deletion/verify_release_boundary.sql \
            | tee /tmp/uat-account-deletion-boundary.log
          tombstone_count="$(psql --no-psqlrc --tuples-only --no-align \
            --command 'SELECT count(*) FROM public.account_deletion_tombstones')"
          if [[ ! "${tombstone_count}" =~ ^[0-9]+$ ]]; then
            echo "Unable to record the migration-boundary tombstone count." >&2
            exit 1
          fi
          echo "tombstone_count=${tombstone_count}" >> "$GITHUB_OUTPUT"

          # A curated connector whose registry row no longer equals its manifest is
          # hidden by the runtime and fails sign-in closed (Notion and Attio on UAT).
          # Report it here, where the database is already reachable. Report only: an
          # unrelated deploy is not blocked, and applying a row stays an operator step.
          if [ "${{ vars.CURATED_MCP_CONNECTORS_UAT }}" = "true" ]; then
            if (cd consent-protocol && "${{ env.PROTOCOL_PYTHON }}" \
                scripts/ops/provision_curated_connector.py verify --env uat) \
                > /tmp/uat-curated-registry-verify.json 2>/tmp/uat-curated-registry-verify.err; then
              python3 - <<'PY'
          import json
          import os

          report = json.load(open("/tmp/uat-curated-registry-verify.json"))
          lines = ["### Curated connector registry (UAT)", ""]
          for name, item in sorted(report["connectors"].items()):
              fields = ", ".join(item.get("fields", [])) or "-"
              lines.append(f"- {name}: {item['status']} ({fields})")
              if item["status"] == "drift":
                  print(
                      f"::warning title=Curated connector registry drift::{name} differs from its "
                      f"manifest in: {fields}. It is hidden until re-applied: "
                      f"python3 scripts/ops/provision_curated_connector.py apply {name} "
                      "--env uat --operator <you>"
                  )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(lines) + "\n")
          PY
            else
              echo "::warning title=Curated connector registry check::could not run (see log)"
              cat /tmp/uat-curated-registry-verify.err || true
            fi
          fi

          BOOTSTRAP_FOCUS_PROFILE=uat bash scripts/env/bootstrap_profiles.sh --strict
          bash scripts/env/use_profile.sh uat


      - name: Install PostgreSQL client for selected preservation
        if: steps.verification-plan.outputs.run_pkm_upgrade_gate == 'true'
        shell: bash
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi

      - name: Verify selected PKM preservation before deployment
        id: verify-pkm-preservation
        if: steps.verification-plan.outputs.run_pkm_upgrade_gate == 'true'
        shell: bash
        run: bash scripts/ci/run-release-pkm-gate.sh uat

      - name: Verify One mail sender configuration
        if: steps.scope.outputs.deploy_backend == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for secret_name in SUPPORT_EMAIL_DELEGATED_USER SUPPORT_EMAIL_FROM; do
            sender="$(gcloud secrets versions access latest \
              --secret="${secret_name}" --project="${{ env.GCP_PROJECT_ID }}")"
            if [ "${sender}" != "one@hushh.ai" ]; then
              echo "${secret_name} must name the One mailbox before backend deployment." >&2
              exit 1
            fi
          done

      - name: Resolve curated connector secrets
        id: curated-secrets
        if: steps.scope.outputs.deploy_backend == 'true'
        shell: bash
        env:
          CURATED_CONNECTORS_ENABLED: ${{ vars.CURATED_MCP_CONNECTORS_UAT }}
          SECRETS_PROJECT: ${{ env.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          names=""
          if [ "${CURATED_CONNECTORS_ENABLED}" = "true" ]; then
            names="$("${{ env.PROTOCOL_PYTHON }}" scripts/ci/curated_connector_secrets.py)"
            # Every other secret is skipped silently when missing; a connector
            # whose secret is absent would ship a green deploy that cannot connect.
            # Check for an enabled latest version (a bare secret with no value
            # would pass a plain existence check) and keep gcloud's own error.
            for secret in ${names//+/ }; do
              if ! state="$(gcloud secrets versions describe latest --secret="${secret}" \
                  --project="${SECRETS_PROJECT}" --format='value(state)' 2>&1)"; then
                echo "::error::Curated connector secret ${secret} is required by a manifest in consent-protocol/config/curated_connectors but could not be read in ${SECRETS_PROJECT}: ${state}. Provision it (scripts/ops/provision_curated_connector.py) or turn CURATED_MCP_CONNECTORS_UAT off." >&2
                exit 1
              fi
              if [ "${state}" != "ENABLED" ]; then
                echo "::error::Curated connector secret ${secret} has no enabled latest version in ${SECRETS_PROJECT} (state: ${state})." >&2
                exit 1
              fi
            done
          fi
          echo "names=${names}" >> "$GITHUB_OUTPUT"

      - name: Prepare frontend rollout and its exact image build
        id: prepare-frontend-rollout
        if: steps.scope.outputs.deploy_frontend == 'true'
        shell: bash
        env:
          FRONTEND_BUILD_SUBSTITUTIONS: ${{ steps.start-frontend-image-build.outputs.build_substitutions }}
          FRONTEND_IMAGE_BUILD_ID: ${{ steps.start-frontend-image-build.outputs.build_id }}
          FRONTEND_IMAGE_TAG: ${{ steps.start-frontend-image-build.outputs.image_tag }}
        run: |
          set -euo pipefail
          SUBSTITUTIONS="_FRONTEND_SERVICE=${{ env.FRONTEND_SERVICE }},_FRONTEND_RUNTIME_SERVICE_ACCOUNT=${{ env.FRONTEND_RUNTIME_SERVICE_ACCOUNT }},_REGION=${{ env.GCP_REGION }},_HUSHH_TECH_CLIENT_ENABLED=${{ vars.HUSSH_TECH_CLIENT_ENABLED || 'false' }},_HUSHH_TECH_PROXY_AUDIENCE=${{ env.CONSENT_API_RUNTIME_ORIGIN }},_HUSHH_TECH_FRONTEND_TRUSTED_PROXY_HOPS=${{ vars.HUSSH_TECH_FRONTEND_TRUSTED_PROXY_HOPS || '0' }},_RATE_LIMIT_STORAGE_URI_SECRET=RATE_LIMIT_STORAGE_URI,_VPC_CONNECTOR=${{ vars.UAT_VPC_CONNECTOR || '' }},_CLOUD_RUN_MEMORY=1Gi,_CLOUD_RUN_TIMEOUT_SECONDS=300,_CLOUD_RUN_CONCURRENCY=10,_CLOUD_RUN_MIN_INSTANCES=2,_CLOUD_RUN_MAX_INSTANCES=10,_CLOUD_RUN_NO_TRAFFIC=true,_DEPLOY_SOURCE=deploy-uat,_DEPLOY_SHA=${{ steps.resolve-sha.outputs.sha }},_GITHUB_RUN_ID=${{ github.run_id }},_GITHUB_RUN_ATTEMPT=${{ github.run_attempt }}"
          if [ -z "${FRONTEND_BUILD_SUBSTITUTIONS}" ]; then
            echo "Refusing frontend deploy: the frontend build substitutions were not resolved." >&2
            exit 1
          fi
          SUBSTITUTIONS="${SUBSTITUTIONS},${FRONTEND_BUILD_SUBSTITUTIONS}"
          echo "substitutions=${SUBSTITUTIONS}" >> "$GITHUB_OUTPUT"
          echo "parallel=false" >> "$GITHUB_OUTPUT"
          echo "wait_seconds=0" >> "$GITHUB_OUTPUT"
          # Readiness is independent of the web image. Await a still-building
          # image in its own branch of the same required Cloud Build, preserving
          # the image/IAM prerequisites and the final successful-build join.
          if [[ "${{ steps.scope.outputs.deploy_backend }}" == "true" &&
                "${{ steps.start-frontend-image-build.outputs.prebuilt }}" == "true" ]]; then
            status="$(gcloud builds describe "${FRONTEND_IMAGE_BUILD_ID}" \
              --project="${{ env.GCP_PROJECT_ID }}" --format='value(status)')"
            if [[ "$status" == "SUCCESS" ]]; then
              started_at="$(date +%s)"
              image_reference="$(bash scripts/ci/await-prebuilt-image.sh \
                --project "${{ env.GCP_PROJECT_ID }}" \
                --build-id "${FRONTEND_IMAGE_BUILD_ID}" \
                --image-repository "gcr.io/${{ env.GCP_PROJECT_ID }}/hushh-webapp" \
                --image-tag "${FRONTEND_IMAGE_TAG}" \
                --sha "${{ steps.resolve-sha.outputs.sha }}" \
                --manifest-json /tmp/uat-frontend-image-manifest.json \
                --json-output /tmp/uat-frontend-image.json)"
              echo "image_reference=${image_reference}" >> "$GITHUB_OUTPUT"
              echo "parallel=true" >> "$GITHUB_OUTPUT"
              echo "wait_seconds=$(( $(date +%s) - started_at ))" >> "$GITHUB_OUTPUT"
            elif [[ "$status" == "WORKING" || "$status" == "QUEUED" || "$status" == "PENDING" ]]; then
              echo "parallel=true" >> "$GITHUB_OUTPUT"
              echo "pending_image_build_id=${FRONTEND_IMAGE_BUILD_ID}" >> "$GITHUB_OUTPUT"
            else
              echo "Frontend image build is not eligible for deployment." >&2
              exit 1
            fi
          fi

      - name: Deploy backend using Cloud Build
        id: deploy-backend
        if: steps.scope.outputs.deploy_backend == 'true'
        shell: bash
        env:
          FRONTEND_PARALLEL: ${{ steps.prepare-frontend-rollout.outputs.parallel || 'false' }}
          FRONTEND_DEPLOY_SUBSTITUTIONS: ${{ steps.prepare-frontend-rollout.outputs.substitutions }}
