name: CI Trust Qualification

# Temporary, synthetic qualification of the single Main-owned CI design.
# This never runs for ordinary application PRs and grants no merge authority.
on:
  pull_request_target:
    branches: [ci/trusted-source-qualification]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

cache-mode: read

concurrency:
  group: ci-trust-qualification-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  boundary:
    name: Candidate authority boundary (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/ci/ci_trust_qualification.py
            scripts/ci/github_security_authority.py
          sparse-checkout-cone-mode: false
      - name: Record actual target-event identities
        run: python3 scripts/ci/ci_trust_qualification.py observe
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Prepare synthetic cache content
        run: mkdir -p "$RUNNER_TEMP/ci-trust-cache" && printf 'synthetic\n' > "$RUNNER_TEMP/ci-trust-cache/probe"
      - name: Attempt a cache write with the candidate token
        continue-on-error: true
        uses: actions/cache/save@v5
        env:
          # A candidate can spoof client environment. The server-issued cache
          # token must still refuse writes; SDK read-mode skipping is no proof.
          ACTIONS_CACHE_MODE: write
        with:
          path: ${{ runner.temp }}/ci-trust-cache
          key: ci-trust-${{ github.run_id }}-${{ github.run_attempt }}-${{ runner.os }}
      - name: Verify denied writes and absent privileged credentials
        run: python3 scripts/ci/ci_trust_qualification.py verify
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Retain bounded platform evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-trust-${{ github.run_id }}-${{ github.run_attempt }}-${{ runner.os }}
          path: ${{ runner.temp }}/ci-trust.json
          if-no-files-found: error
          retention-days: 7
