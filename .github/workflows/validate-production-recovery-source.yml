name: Validate Production Recovery Source
run-name: Production recovery source ${{ inputs.sha }}

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact application SHA in the recorded production recovery
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read
  security-events: read

concurrency:
  group: production-recovery-source-validation
  cancel-in-progress: false

jobs:
  source:
    name: Admit recorded recovery application
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      base: ${{ steps.admit.outputs.base }}
      tree: ${{ steps.admit.outputs.tree }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Admit source from protected Main
        id: admit
        env:
          SOURCE_SHA: ${{ inputs.sha }}
        run: python3 scripts/ci/production_recovery_ci.py "$SOURCE_SHA"

  deployment-security:
    name: Deployment security
    needs: source
    uses: ./.github/workflows/deployment-security.yml
    secrets:
      GH_SECURITY_ALERTS_TOKEN: ${{ secrets.GH_SECURITY_ALERTS_TOKEN }}
      CI_TEAM_APP_PRIVATE_KEY: ${{ secrets.CI_TEAM_APP_PRIVATE_KEY }}
    with:
      application_ref: ${{ inputs.sha }}
      environment_name: validation
      scope: validation

  functional:
    name: Exact recovery CI
    needs: [source, deployment-security]
    uses: ./.github/workflows/ci.yml
    with:
      scope: all
      production_recovery_sha: ${{ inputs.sha }}
      production_recovery_tree: ${{ needs.source.outputs.tree }}
      uat_base_sha: ${{ needs.source.outputs.base }}

  browser:
    # The pinned snapshot had required selected browser contracts and a
    # native WebKit/SQL document check. Keep them specific to this recovery.
    name: Exact recovery browser contracts
    needs: [source, deployment-security]
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout exact production recovery application
        env:
          SOURCE_SHA: ${{ inputs.sha }}
          SOURCE_BASE: ${{ needs.source.outputs.base }}
          SOURCE_TREE: ${{ needs.source.outputs.tree }}
        run: python3 scripts/ci/production_recovery_ci.py "$SOURCE_SHA" "$SOURCE_BASE" "$SOURCE_TREE"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: ./consent-protocol/.github/actions/setup-python-uv
        with:
          python-version: "3.13"
          protocol-dir: ./consent-protocol
      - name: Install locked web dependencies and browsers
        shell: bash
        run: |
          set -euo pipefail
          bash -c 'source scripts/ci/web-common.sh && web_ci_install'
          cd hushh-webapp
          npm exec -- playwright install chromium webkit
      - name: Run selected browser contracts
        env:
          WEB_TARGETED_PART: browser
          WEB_TARGETED_FULL_SUITE_OWNED: "1"
          WEB_CI_DEPS_INSTALLED: "1"
          WEB_TARGETED_BASE_SHA: ${{ needs.source.outputs.base }}
          WEB_TARGETED_HEAD_SHA: ${{ inputs.sha }}
          CAPABILITY_GRAPH_BASE_REF: ${{ needs.source.outputs.base }}
        run: bash scripts/ci/orchestrate.sh web-targeted
      - name: Prepare isolated PostgreSQL binaries
        shell: bash
        run: |
          set -euo pipefail
          brew list --versions postgresql@16 >/dev/null || HOMEBREW_NO_AUTO_UPDATE=1 brew install postgresql@16
          pg_bin="$(brew --prefix postgresql@16)/bin"
          test -x "$pg_bin/initdb"
          printf '%s\n' "$pg_bin" >> "$GITHUB_PATH"
          printf 'HUSHH_TEST_PG_BIN=%s\n' "$pg_bin" >> "$GITHUB_ENV"
      - name: Verify native WebKit protected documents through real SQL
        run: bash scripts/ci/document-delivery-check.sh --ci-macos-webkit

  gate:
    name: Production Recovery Source Gate
    needs: [source, deployment-security, functional, browser]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify recovery application (${{ inputs.sha }} ${{ needs.source.outputs.tree }} ${{ needs.source.outputs.base }})
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.sha }}
          SOURCE_TREE: ${{ needs.source.outputs.tree }}
          SOURCE_BASE: ${{ needs.source.outputs.base }}
          SOURCE_RESULT: ${{ needs.source.result }}
          CI_RESULT: ${{ needs.functional.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          SECURITY_RESULT: ${{ needs.deployment-security.result }}
          SECURITY_SHA: ${{ needs.deployment-security.outputs.application_sha }}
          SECURITY_ATTEMPT: ${{ needs.deployment-security.outputs.attempt }}
        run: |
          set -euo pipefail
          test "$SOURCE_RESULT:$CI_RESULT:$BROWSER_RESULT:$SECURITY_RESULT" = success:success:success:success
          test "$GITHUB_RUN_ATTEMPT:$SECURITY_ATTEMPT" = 1:1
          test "$SECURITY_SHA" = "$SOURCE_SHA"
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ && "$SOURCE_TREE" =~ ^[a-f0-9]{40}$ && "$SOURCE_BASE" =~ ^[a-f0-9]{40}$ ]]
          printf 'Application %s (tree %s, comparison %s)\nMain tooling %s, run %s attempt %s\n' \
            "$SOURCE_SHA" "$SOURCE_TREE" "$SOURCE_BASE" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_STEP_SUMMARY"
