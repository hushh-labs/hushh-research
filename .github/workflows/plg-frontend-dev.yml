name: Qualify isolated PLG frontend Dev fixture
permissions:
  contents: read
  checks: read
  actions: read
  id-token: write
concurrency:
  group: deploy-dev
  cancel-in-progress: false
  queue: max
jobs:
  fixture:
    name: PLG Private Frontend Fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    environment: dev
    env:
      GH_TOKEN: ${{ github.token }}
      VALIDATION_RUN: ${{ inputs.frontend_validation_run }}
      BACKEND_RUN: ${{ inputs.backend_acceptance_run }}
      PLG_FRONTEND_BUILD_PRINCIPAL: projects/hushh-pda-dev/serviceAccounts/${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      FIXTURE_PHASE: ${{ inputs.phase }}
      RECOVERY_ORIGIN: ${{ inputs.recovery_origin }}
    steps:
    - name: Checkout fixed Main fixture authority
      uses: actions/checkout@v6
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Install locked fixture Python
      uses: ./consent-protocol/.github/actions/setup-python-uv
      with:
        python-version: '3.13'
        protocol-dir: ./consent-protocol
    - name: Require governed fixed fixture context
      run: "set -euo pipefail\n[[ \"$GITHUB_REF\" == refs/heads/main && \"$(git rev-parse HEAD)\" == \"$GITHUB_SHA\"\
        \ ]]\nif [[ \"$FIXTURE_PHASE\" == qualify ]]; then\n  [[ \"$VALIDATION_RUN\" =~ ^[1-9][0-9]{0,18}$ && \"\
        $BACKEND_RUN\" =~ ^[1-9][0-9]{0,18}$ && -z \"$RECOVERY_ORIGIN\" ]]\nelif [[ \"$FIXTURE_PHASE\" == recover\
        \ ]]; then\n  [[ \"$RECOVERY_ORIGIN\" =~ ^[1-9][0-9]{0,18}:[1-9][0-9]{0,5}$ ]]\nelse exit 1; fi\npython3\
        \ scripts/ci/assert-governed-actor.py --surface dev --actor \"$GITHUB_ACTOR\"\npython3 scripts/ci/assert-governed-actor.py\
        \ --surface dev --actor \"$GITHUB_TRIGGERING_ACTOR\"\npython3 - <<'PY'\nimport base64, os, subprocess\n\
        header = base64.b64encode(('x-access-token:' + os.environ['GH_TOKEN']).encode()).decode()\nenv = dict(os.environ,\
        \ GIT_CONFIG_COUNT='1', GIT_CONFIG_KEY_0='http.https://github.com/.extraheader', GIT_CONFIG_VALUE_0='AUTHORIZATION:\
        \ basic ' + header)\ntry:\n    for sha in ('2a860818549f2d6c16d1f98bd8fb9cebe01a1f84', '5de6ee29abe3b00642bd6b745c608279091810b3'):\n\
        \        subprocess.run(['git', 'fetch', '--no-tags', 'origin', sha], env=env, check=True, stdout=subprocess.DEVNULL,\
        \ stderr=subprocess.DEVNULL, timeout=120)\nfinally:\n    env.clear()\nPY\n"
    - name: Authenticate ordinary Dev fixture workload
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
        project_id: hushh-pda-dev
        create_credentials_file: true
        export_environment_variables: true
    - name: Set up fixture Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
    - name: Read admitted private backend audience
      id: backend
      run: "consent-protocol/.venv/bin/python deploy/plg/frontend_fixture_producer.py audience \\\n  --environment\
        \ dev --backend-run \"$BACKEND_RUN\"\n"
      if: inputs.phase == 'qualify'
    - name: Mint canonical private backend identity
      id: private-auth
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
        project_id: hushh-pda-dev
        token_format: id_token
        id_token_audience: ${{ steps.backend.outputs.audience }}
        id_token_include_email: true
        create_credentials_file: false
        export_environment_variables: false
      if: inputs.phase == 'qualify'
    - name: Prepare fixed W4 fixture with private S binding
      env:
        PLG_QUALIFICATION_ID_TOKEN: ${{ steps.private-auth.outputs.id_token }}
      run: "consent-protocol/.venv/bin/python deploy/plg/frontend_fixture_producer.py prepare \\\n  --environment\
        \ dev --validation-run \"$VALIDATION_RUN\" --backend-run \"$BACKEND_RUN\"\n"
      if: inputs.phase == 'qualify'
    - name: Publish immutable fixture build intent
      uses: actions/upload-artifact@v6
      with:
        name: plg-fixture-build-intent-dev-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/plg-frontend-preflight-dev-${{ github.run_id }}-${{ github.run_attempt }}/build-intent.json
        if-no-files-found: error
        retention-days: 30
      if: inputs.phase == 'qualify'
    - name: Build exact isolated frontend fixture image
      run: 'consent-protocol/.venv/bin/python deploy/plg/frontend_fixture_producer.py build --environment dev

        '
      if: inputs.phase == 'qualify'
    - name: Refresh private backend identity before stage
      id: stage-auth
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
        project_id: hushh-pda-dev
        token_format: id_token
        id_token_audience: ${{ steps.backend.outputs.audience }}
        id_token_include_email: true
        create_credentials_file: false
        export_environment_variables: false
      if: inputs.phase == 'qualify'
    - name: Prepare fixture stage intent
      if: inputs.phase == 'qualify'
      run: consent-protocol/.venv/bin/python deploy/plg/frontend_fixture_producer.py stage-intent --environment
        dev
      env: &id001
        PLG_QUALIFICATION_ID_TOKEN: ${{ steps.stage-auth.outputs.id_token }}
    - name: Publish immutable fixture stage intent
      if: inputs.phase == 'qualify'
      uses: actions/upload-artifact@v6
      with:
        name: plg-fixture-stage-intent-dev-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/plg-frontend-preflight-dev-${{ github.run_id }}-${{ github.run_attempt }}/stage-intent.json
        if-no-files-found: error
        retention-days: 30
    - name: Stage private frontend fixture
      if: inputs.phase == 'qualify'
      run: consent-protocol/.venv/bin/python deploy/plg/frontend_fixture_producer.py stage --environment dev
      env: *id001
      id: candidate
    - name: Mint private frontend probe identity
      id: frontend-auth
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
        project_id: hushh-pda-dev
        token_format: id_token
        id_token_audience: ${{ steps.candidate.outputs.audience }}
        id_token_include_email: true
        create_credentials_file: false
        export_environment_variables: false
      if: inputs.phase == 'qualify'
    - name: Verify private fixture proxy scope
      if: inputs.phase == 'qualify'
      run: consent-protocol/.venv/bin/python deploy/plg/frontend_fixture_producer.py record --environment dev
      env:
        PLG_QUALIFICATION_ID_TOKEN: ${{ steps.stage-auth.outputs.id_token }}
        PLG_FIXTURE_FRONTEND_ID_TOKEN: ${{ steps.frontend-auth.outputs.id_token }}
    - name: Publish scoped private fixture acceptance
      if: inputs.phase == 'qualify'
      uses: actions/upload-artifact@v6
      with:
        name: plg-fixture-acceptance-dev-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/plg-frontend-preflight-dev-${{ github.run_id }}-${{ github.run_attempt }}/acceptance.json
        if-no-files-found: error
        retention-days: 30
    - name: Prepare fixture recovery intent
      if: inputs.phase == 'recover'
      run: consent-protocol/.venv/bin/python deploy/plg/frontend_fixture_producer.py recovery-intent --environment
        dev --origin "$RECOVERY_ORIGIN"
    - name: Publish immutable fixture recovery intent
      if: inputs.phase == 'recover'
      uses: actions/upload-artifact@v6
      with:
        name: plg-fixture-recovery-intent-dev-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/plg-frontend-preflight-dev-${{ github.run_id }}-${{ github.run_attempt }}/recovery-intent.json
        if-no-files-found: error
        retention-days: 30
    - name: Recover private frontend fixture route
      if: inputs.phase == 'recover'
      run: consent-protocol/.venv/bin/python deploy/plg/frontend_fixture_producer.py recover --environment dev --origin
        "$RECOVERY_ORIGIN"
    - name: Publish private fixture recovery result
      if: inputs.phase == 'recover'
      uses: actions/upload-artifact@v6
      with:
        name: plg-fixture-recovery-dev-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/plg-frontend-preflight-dev-${{ github.run_id }}-${{ github.run_attempt }}/recovery.json
        if-no-files-found: error
        retention-days: 30
    - name: Preserve fixture checkpoints without credentials
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: plg-fixture-diagnostics-dev-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/plg-frontend-preflight-dev-${{ github.run_id }}-${{ github.run_attempt }}/*.json
        if-no-files-found: ignore
        retention-days: 7
    - name: Publish fixture build request state
      if: always() && inputs.phase == 'qualify'
      uses: actions/upload-artifact@v6
      with:
        name: plg-fixture-build-request-state-dev-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/plg-frontend-preflight-dev-${{ github.run_id }}-${{ github.run_attempt }}/build-request-state.json
        if-no-files-found: ignore
        retention-days: 30
    - name: Publish fixture stage request state
      if: always() && inputs.phase == 'qualify'
      uses: actions/upload-artifact@v6
      with:
        name: plg-fixture-stage-request-state-dev-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/plg-frontend-preflight-dev-${{ github.run_id }}-${{ github.run_attempt }}/stage-request-state.json
        if-no-files-found: ignore
        retention-days: 30
    - name: Publish fixture recover request state
      if: always() && inputs.phase == 'recover'
      uses: actions/upload-artifact@v6
      with:
        name: plg-fixture-recover-request-state-dev-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/plg-frontend-preflight-dev-${{ github.run_id }}-${{ github.run_attempt }}/recover-request-state.json
        if-no-files-found: ignore
        retention-days: 30
'on':
  workflow_dispatch:
    inputs:
      frontend_validation_run:
        description: Successful Main-owned fixed W4 source validation run
        required: false
        type: string
      backend_acceptance_run:
        description: Successful isolated Dev S backend qualification run
        required: false
        type: string
      phase:
        description: Qualify private fixture or recover one interrupted route
        type: choice
        required: true
        default: qualify
        options:
        - qualify
        - recover
      recovery_origin:
        description: Interrupted fixture run ID and attempt, separated by colon
        type: string
