name: Semantic Search Validation

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  validate-semantic-search:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Validation Script
        run: python scripts/check_semantic_search_health.py