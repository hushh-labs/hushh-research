name: UAT Job Rerun Canary Controller

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Completed first-attempt UAT rerun canary run ID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: uat-rerun-canary-${{ inputs.run_id }}
  cancel-in-progress: false

jobs:
  rerun:
    name: Rerun only the authenticated canary wait job
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout exact main authority tooling
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify original canary and exercise GITHUB_TOKEN job rerun
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANARY_RUN_ID: ${{ inputs.run_id }}
        run: |
          python3 scripts/ci/uat-capacity-resume.py rerun-canary \
            --run-id "$CANARY_RUN_ID"
