name: Deploy to Dev
run-name: Dev · ${{ inputs.operation || 'deploy' }} · ${{ inputs.target || 'shared-dev' }} · app ${{ inputs.sha || 'protected Dev tip' }} · source dev

# Dev Fast Lane: dev deploys are decoupled from main. Normal application
# deploys must select a SHA in protected dev history; ref is only a lookup
# hint. The separate pod-publication target keeps its reviewed source rules.
# Contract: docs/operations/releases/dev-fast-lane.md
on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Deploy, or verify branch routing and cloud identity without changes"
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - inspect-routing
      target:
        description: "Shared Dev, commerce sandbox, or coordinated pod publication"
        required: true
        default: "shared-dev"
        type: choice
        options:
          - shared-dev
          - scope-commerce-sandbox
          - pod-publication
      pod_action:
        description: "Pod publication only: prepare an artifact, or activate a Main-reviewed coordinated pin"
        required: true
        default: prepare
        type: choice
        options:
          - prepare
          - activate
      scope:
        description: "Auto-detect deploy lane, or force backend/frontend/all"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - all
          - backend
          - frontend
      ref:
        description: "Ref used to locate the application SHA; normal deploys require protected dev membership"
        required: false
        default: "dev"
        type: string
      build_pod_image:
        description: "Build the dev-only pod image; does not approve owner installation"
        required: false
        default: false
        type: boolean
      sha:
        description: "Exact CI-green SHA to deploy (blank resolves from ref; the SHA must be reachable from protected dev)"
        required: false
        type: string


# Dispatch from Main. The application source remains the protected environment
# branch; merging source never deploys any environment.
permissions:
  pull-requests: read
  contents: read
  checks: read
  actions: write
  id-token: write

jobs:
  release:
    name: Deploy
    if: inputs.target != 'pod-publication'
    uses: hushh-labs/hushh-research/.github/workflows/deploy-dev-implementation.yml@main
    secrets:
      CI_TEAM_APP_PRIVATE_KEY: ${{ secrets.CI_TEAM_APP_PRIVATE_KEY }}
      GH_SECURITY_ALERTS_TOKEN: ${{ secrets.GH_SECURITY_ALERTS_TOKEN }}
    with:
      operation: ${{ inputs.operation }}
      target: ${{ inputs.target }}
      pod_action: ${{ inputs.pod_action }}
      scope: ${{ inputs.scope }}
      ref: ${{ inputs.ref }}
      build_pod_image: ${{ inputs.build_pod_image }}
      sha: ${{ inputs.sha }}

  pod-publication:
    name: Publish pod
    if: inputs.target == 'pod-publication'
    uses: hushh-labs/hushh-research/.github/workflows/deploy-dev-implementation.yml@main
    secrets:
      GH_SECURITY_ALERTS_TOKEN: ${{ secrets.GH_SECURITY_ALERTS_TOKEN }}
      CI_TEAM_APP_PRIVATE_KEY: ${{ secrets.CI_TEAM_APP_PRIVATE_KEY }}
    with:
      operation: ${{ inputs.operation }}
      target: ${{ inputs.target }}
      pod_action: ${{ inputs.pod_action }}
      scope: ${{ inputs.scope }}
      ref: ${{ inputs.ref }}
      build_pod_image: ${{ inputs.build_pod_image }}
      sha: ${{ inputs.sha }}
