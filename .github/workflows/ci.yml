name: "PR Validation"
run-name: ${{ inputs.uat_candidate_sha && format('Isolated UAT {0}', inputs.uat_candidate_sha) || 'PR Validation' }}

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    branches: ["**"]
  workflow_call:
    inputs:
      scope:
        type: string
        default: auto
      uat_base_sha:
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      # `auto` runs the lanes the dispatched branch's changes against the
      # default branch select, through the same path filters a pull request
      # uses. The default used to be `all`, which put iOS on one of the org's
      # five macOS slots on every dispatch: one 30-minute dispatch loop made 59
      # of the 77 runs dispatched from 2026-10-07 to 2026-10-15. `frontend`
      # and `backend` are diagnostic only: Branch Validation Gate fails them, so a
      # partial run can never stand in for a full one.
      scope:
        description: "auto (lanes from changed paths), all, or a diagnostic-only frontend/backend subset"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - frontend
          - backend
          - all
      uat_base_sha:
        description: "Optional comparison SHA; serving UAT SHA required for UAT qualification"
        required: false
        default: ""
        type: string

      uat_candidate_sha:
        description: "Protected uat-isolated application SHA (Main release qualification only)"
        type: string
        default: ""
      uat_candidate_tree:
        description: "Full Git tree of the isolated application SHA"
        type: string
        default: ""

permissions:
  contents: read
  pull-requests: read
  security-events: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}${{ inputs.uat_candidate_sha && format('-{0}', inputs.uat_candidate_sha) || '' }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PYTHON_VERSION: "3.13"
  UAT_CI_CANDIDATE: ${{ inputs.uat_candidate_sha }}
  UAT_CI_BASE: ${{ inputs.uat_base_sha }}
  CI_VALIDATION_POLICY: core-focused-v1
  CI_VALIDATION_LEVEL: ${{ github.event_name == 'workflow_dispatch' && inputs.scope == 'all' && 'release' || 'focused' }}
  CI_NATIVE_PARITY_REQUIRED: "0"
  CI_DOCS_PARITY_REQUIRED: "0"
  GITLEAKS_VERSION: "8.24.2"

jobs:
  secret-scan:
    name: "Secret Scan"
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: ${{ inputs.uat_candidate_sha == '' }}
      - &prepare_isolated
        name: Prepare isolated UAT source
        if: inputs.uat_candidate_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_TREE: ${{ inputs.uat_candidate_tree }}
          REQUESTED_SCOPE: ${{ inputs.scope }}
        run: |
          test "$REQUESTED_SCOPE" = all
          python3 scripts/ci/uat_exact_ci.py "$UAT_CI_CANDIDATE" "$UAT_CI_BASE" "$GITHUB_SHA" "$EXPECTED_TREE"
      - name: Install gitleaks OSS CLI (license-free)
        run: |
          # Keep CI independent from licensed action wrappers by using the OSS binary directly.
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${{ env.GITLEAKS_VERSION }}/gitleaks_${{ env.GITLEAKS_VERSION }}_linux_x64.tar.gz" \
            | tar -xz
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Resolve scan commit range
        id: scan-range
        shell: bash
        run: |
          resolve_from_default_branch() {
            DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
            git fetch origin "$DEFAULT_BRANCH" --quiet || true
            if git rev-parse "origin/$DEFAULT_BRANCH" >/dev/null 2>&1; then
              SCAN_BASE="$(git merge-base "origin/$DEFAULT_BRANCH" "${{ github.sha }}")" || return 1
              echo "${SCAN_BASE}..${{ github.sha }}"
            else
              echo "${{ github.sha }}"
            fi
          }

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            LOG_OPTS="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            if git rev-parse "${{ github.event.before }}" >/dev/null 2>&1 && git merge-base --is-ancestor "${{ github.event.before }}" "${{ github.sha }}"; then
              LOG_OPTS="${{ github.event.before }}..${{ github.sha }}"
            else
              LOG_OPTS="$(resolve_from_default_branch)"
            fi
          elif [ "${{ github.event_name }}" = "merge_group" ]; then
            BASE_SHA="${{ github.event.merge_group.base_sha }}"
            HEAD_SHA="${{ github.event.merge_group.head_sha }}"
            if [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ] \
              && git rev-parse "$BASE_SHA" >/dev/null 2>&1 \
              && git rev-parse "$HEAD_SHA" >/dev/null 2>&1 \
              && git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA"; then
              LOG_OPTS="${BASE_SHA}..${HEAD_SHA}"
            else
              LOG_OPTS="$(resolve_from_default_branch)"
            fi
          elif [ "${{ github.event_name }}" = "push" ]; then
            LOG_OPTS="$(resolve_from_default_branch)"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # A manually dispatched run validates a BRANCH, so it scans that
            # branch's own commits — the same range a push resolves. It used to
            # fall through to the bare-SHA case below, which walks all history
            # (~3400 commits) and fails on findings that predate the branch by
            # years. That made the manual lane useless exactly when it is
            # needed most: when the pull_request event does not fire and this
            # is the only way to validate a change.
            LOG_OPTS="$(resolve_from_default_branch)"
          else
            LOG_OPTS="${{ github.sha }}"
          fi
          if [ -n "${UAT_CI_CANDIDATE:-}" ]; then
            LOG_OPTS="$UAT_CI_BASE..$UAT_CI_CANDIDATE"
          fi
          echo "log_opts=$LOG_OPTS" >> "$GITHUB_OUTPUT"
      - name: Run gitleaks scan (no license secret required)
        run: bash scripts/ci/orchestrate.sh secret
        env:
          GITLEAKS_LOG_OPTS: ${{ steps.scan-range.outputs.log_opts }}
          GH_TOKEN: ${{ github.token }}
          CI_SECURITY_HEAD_SHA: ${{ inputs.uat_candidate_sha || github.event.pull_request.head.sha || github.sha }}

  dco-check:
    name: "DCO"
    # Dispatched runs too: their Branch Validation Gate lands on the branch head, so
    # the gate requires DCO on both events. Without a PR range,
    # check-dco-signoff.sh checks merge-base(origin/<default branch>)..HEAD,
    # the branch's own commits.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Signoff checks require complete commit history, not historical
          # file contents. Keep all commits without downloading every old blob.
          filter: ${{ inputs.uat_candidate_sha == '' && 'blob:none' || '' }}
          persist-credentials: ${{ inputs.uat_candidate_sha == '' }}
      - *prepare_isolated

      - name: Validate DCO signoff
        env:
          GITHUB_BASE_SHA: ${{ inputs.uat_base_sha || github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
          GITHUB_HEAD_SHA: ${{ inputs.uat_candidate_sha || github.event.merge_group.head_sha || github.event.pull_request.head.sha }}
          GITHUB_BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          GITHUB_BASE_REF="${GITHUB_BASE_REF#refs/heads/}"
          export GITHUB_BASE_REF
          if [ -n "$UAT_CI_CANDIDATE" ]; then
            bash scripts/ci/check-dco-signoff.sh "$UAT_CI_BASE" "$UAT_CI_CANDIDATE"
          elif [[ ( "${GITHUB_EVENT_NAME:-}" == pull_request || "${GITHUB_EVENT_NAME:-}" == merge_group ) && ( "${GITHUB_BASE_REF:-}" == dev || "${GITHUB_BASE_REF:-}" == uat ) ]]; then
            bash scripts/ci/check-dco-signoff.sh --history-sync
          else
            bash scripts/ci/check-dco-signoff.sh
          fi

  pr-base-policy:
    name: "PR Base Policy"
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.uat_candidate_sha != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: ${{ inputs.uat_candidate_sha && '0' || '1' }}
          persist-credentials: ${{ inputs.uat_candidate_sha == '' }}
      - *prepare_isolated

      # Through env, not inline: a head ref is chosen by whoever opens the PR,
      # and an inline expression is pasted into the script before bash parses it.
      - name: Verify PR target branch policy
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          python3 scripts/ci/verify-pr-base-policy.py \
            --base-ref "$PR_BASE_REF" \
            --head-ref "$PR_HEAD_REF" \
            --actor "$PR_AUTHOR"

  repo-governance:
    name: "Governance"
    needs: [paths]
    # Keep independent failure collection, but release superseded/cancelled work.
    # The final required status gate still runs always and refuses cancellation.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      unit_matrix: ${{ steps.unit-plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: ${{ inputs.uat_candidate_sha == '' }}
      - *prepare_isolated

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: hushh-webapp/package-lock.json

      - name: Install UI contract parser for governance
        working-directory: hushh-webapp/scripts/architecture/ui-contract-tools
        run: npm ci --ignore-scripts --no-audit --progress=false

      - uses: ./consent-protocol/.github/actions/setup-python-uv
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          protocol-dir: ./consent-protocol

      - &ci_impact
        name: Resolve exact changed contract input
        env:
          CI_IMPACT_BASE_SHA: ${{ github.event.merge_group.base_sha || inputs.uat_base_sha || github.event.pull_request.base.sha }}
          CI_IMPACT_HEAD_SHA: ${{ inputs.uat_candidate_sha || github.sha }}
        run: bash scripts/ci/resolve-ci-changed-files.sh

      - name: Plan unit concurrency
        id: unit-plan
        env:
          CI_ACCOUNT_DELETION_CLIENT_OWNED: "1"
        run: |
          matrix="$(node hushh-webapp/scripts/testing/affected-tests.mjs unit-matrix)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

      - name: Run repo governance checks
        run: bash scripts/ci/orchestrate.sh governance
        env:
          CAPABILITY_GRAPH_BASE_REF: &capability_graph_base ${{ inputs.uat_candidate_sha && inputs.uat_base_sha || github.event.merge_group.base_sha || github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/uat' || github.ref == 'refs/heads/uat-isolated') && inputs.scope == 'all' && inputs.uat_base_sha || format('origin/{0}', github.base_ref || 'main') }}
          # Required so verify-protected-pipeline-edits.py can resolve the PR's
          # changed-file list from the GitHub API. Without a token the guard
          # silently resolves zero files and passes (fails open). The job
          # already declares `pull-requests: read`, which is sufficient.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run exact auth-health contracts
        if: needs.paths.outputs.auth_health == 'true'
        working-directory: consent-protocol
        run: >-
          .venv/bin/python -m pytest -q
          tests/test_auth_health_deployment.py
          tests/test_auth_health_inventory.py
          tests/test_auth_health_lease_rest.py
          tests/test_auth_health_uat_activation.py
          tests/test_auth_health_uat_installation.py
          tests/test_auth_health_wif_scopes.py
          tests/test_phone_list_health.py

  # ============================================================================
  # Path filters: run platform jobs only when their paths change (or manual scope)
  # ============================================================================
  paths:
    name: "Path filters"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.resolve.outputs.frontend }}
      backend: ${{ steps.resolve.outputs.backend }}
      ios: ${{ steps.resolve.outputs.ios }}
      android: ${{ steps.resolve.outputs.android }}
      editor: ${{ steps.resolve.outputs.editor }}
      document: ${{ steps.resolve.outputs.document }}
      auth_health_only: ${{ steps.resolve.outputs.auth_health_only }}
      auth_health: ${{ steps.filter.outputs.auth_health }}
      queue_selection_files: ${{ steps.filter.outputs.queue_selection_files }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: ${{ inputs.uat_candidate_sha && '0' || '1' }}
          persist-credentials: ${{ inputs.uat_candidate_sha == '' }}
      - *prepare_isolated

      # A dispatch with scope `auto` runs these same filters. paths-filter v4
      # has no pull request to ask the API about then, so it diffs `ref`
      # against its merge-base with `base` (git three-dot), deepening the
      # shallow clone until it finds one. `ref` is the dispatched commit, not
      # the branch name, so a branch that moves mid-run cannot select lanes for
      # a commit this run does not test. Both are passed only on dispatch,
      # because v4 ignores them on a pull_request event and warns on every run.
      # Explicit release qualification keeps application core checks broad, but
      # native work is selected against the actual candidate's changed inputs.
      - uses: dorny/paths-filter@v4
        id: filter
        if: >-
          github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'merge_group' ||
          (github.event_name == 'workflow_dispatch' && ((inputs.scope == 'all' && inputs.uat_base_sha != '') ||
          (inputs.scope == 'auto' && github.ref_name != github.event.repository.default_branch)))
        with:
          base: ${{ github.event.merge_group.base_sha || github.event_name == 'workflow_dispatch' && (inputs.uat_base_sha || github.event.repository.default_branch) || '' }}
          ref: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group') && (inputs.uat_candidate_sha || github.sha) || '' }}
          # A leading '!' pattern removes files from its own filter only; the
          # filters below without one behave exactly as under the default
          # 'some'. Without this setting a '!' pattern would match every other
          # file in the repository.
          predicate-quantifier: 'some-with-excludes'
          list-files: json
          # scripts/ci is split by the lane that executes each script.
          # The web lanes run orchestrate.sh, its web-*.sh scripts and the
          # shared UI review-base resolver. The shared web-common.sh
          # helper also schedules backend contracts that exercise its fixtures.
          # Every other script, including any added later, stays on the backend
          # side, which covers the protocol, MCP and integration lanes.
          # Environment workflow YAML is covered by focused controller owners;
          # runtime, build and deletion inputs below remain backend-side.
          # orchestrate.sh dispatches both sides and is in both.
          # Guarded by
          # consent-protocol/tests/test_ci_path_filters_cover_lane_scripts.py
          filters: |
            # Capture the existing selector's actual inventory for queue reuse.
            queue_selection:
              - '**'
            frontend:
              - 'hushh-webapp/**'
              - '!hushh-webapp/scripts/testing/affected-tests.mjs'
              - '!hushh-webapp/scripts/testing/affected-tests.test.mjs'
              - 'deploy/mail-api/**'
            backend:
              - 'consent-protocol/**'
              # Governance owns these probe/compiler controllers and their exact contracts.
              - '!consent-protocol/scripts/generate_capability_graph.py'
              - '!consent-protocol/tests/helpers/capability_graph_fixture.py'
              - '!consent-protocol/scripts/verify_azure_pwm_runtime.py'
              - '!consent-protocol/scripts/managed_vertex_readiness.py'
              - '!consent-protocol/tests/test_pwm_runtime_probe.py'
              - '!consent-protocol/tests/scripts/test_trust_failure_verdict.py'
              - '!consent-protocol/tests/scripts/test_probe_drive_activity_planner.py'
              - '!consent-protocol/tests/scripts/test_readiness_exam_runner.py'
              - '!consent-protocol/tests/test_vertex_capability_probe.py'
              - '!consent-protocol/tests/scripts/test_managed_provider_receipt.py'
              - '!consent-protocol/tests/test_capability_graph_gate_compares_against_base.py'
              - '!consent-protocol/tests/test_capability_graph_dev_phone_history.py'
              - '!consent-protocol/tests/test_location_workflow_compatibility.py'
              # Public risk inputs have real-artifact and policy checks in Governance.
              - '!consent-protocol/config/email-auth/disposable-domains.txt'
              - '!consent-protocol/config/email-auth/risk-manifest.json'
              # The required Governance main-sync check owns the local push hook.
              - '!consent-protocol/ops/monorepo/pre-push.sh'
              # Human Browser evidence is covered by unconditional docs governance.
              # Keep other docs in Protocol: env-vars.md has semantic assertions.
              - '!consent-protocol/docs/reference/private-browser-runtime.md'
              - '!consent-protocol/docs/reference/agent-development.md'
              # The complete engineering-judge suite runs in Governance's agent owner.
              - '!consent-protocol/tests/test_memory_judge.py'
              - 'deploy/plg/**'
              - 'packages/hushh-mcp/**'
              - 'deploy/backend.cloudbuild.yaml'
              # Environment/infra-only edits can break the same deletion flow.
              # Keep them on Protocol + Integration, including the required
              # account-deletion pack, even without application source changes.
              - 'deploy/account-deletion/**'
              - 'deploy/drive/rollback_after_worker_failure.sh'
              - 'deploy/backend-image.cloudbuild.yaml'
              - 'deploy/frontend.cloudbuild.yaml'
              - 'deploy/frontend-image.cloudbuild.yaml'
              - 'deploy/dev.autodeploy.backend.cloudbuild.yaml'
              - 'scripts/ops/sync_backend_runtime_secrets.py'
              - 'scripts/ops/runtime_config_retention.py'
              - 'scripts/ops/recover_dev_cloud_removal.py'
              - 'scripts/ops/scope_commerce_runtime_policy.py'
              - 'scripts/ops/shared_files_runtime_policy.py'
              - 'scripts/ops/passkey_domain_policy.py'
              - 'scripts/ops/upsert_gcp_secret.py'
              - 'scripts/ops/sync_frontend_runtime_secrets.py'
              - 'config/runtime-capacity.json'
              - '!scripts/ci/web-check.sh'
              - '!scripts/ci/web-full-check.sh'
              - '!scripts/ci/web-full-suite-check.sh'
              - '!scripts/ci/web-targeted-check.sh'
              - '!consent-protocol/scripts/test-ci.manifest.txt'
              # Deployment-only writers are verified by the release-controller owner.
              - '!scripts/ops/sync_backend_runtime_secrets.py'
              - '!scripts/ops/runtime_config_retention.py'
              - '!scripts/ops/upsert_gcp_secret.py'
              - '!deploy/plg/bind_secrets.sh'
              # Synthetic release-controller tests have a focused Governance owner.
              - '!consent-protocol/tests/test_runtime_config_retention.py'
              - '!consent-protocol/tests/test_plg_deploy_bindings.py'
              - '!consent-protocol/tests/test_azure_runtime_config_wiring.py'
              - '!consent-protocol/tests/test_nws_nearby_runtime_config_wiring.py'
              - '!consent-protocol/tests/test_runtime_settings_maps.py'
              - '!consent-protocol/tests/test_direct_uat_acceptance.py'
              - '!consent-protocol/tests/test_advisors_runtime_config_wiring.py'
              - '!consent-protocol/tests/test_cloudbuild_step_arg_limit.py'
              - '!consent-protocol/tests/test_dev_release_classification.py'
              - '!consent-protocol/tests/test_frontend_prebuilt_image_contract.py'
              - '!consent-protocol/tests/test_hushh_tech_runtime_config.py'
              - '!consent-protocol/tests/test_insurance_agents_runtime_config_wiring.py'
              - '!consent-protocol/tests/test_one_location_read_only_runtime_config.py'
              - '!consent-protocol/tests/test_pkm_answer_config.py'
              - '!consent-protocol/tests/test_account_deletion_release_workflow.py'
              - '!consent-protocol/tests/test_account_generation_admission_deploy.py'
              - '!consent-protocol/tests/test_azure_pod_release_publish_step.py'
              - '!consent-protocol/tests/test_calendar_followup_scheduler_contract.py'
              - '!consent-protocol/tests/test_cloud_run_image_resolution.py'
              - '!consent-protocol/tests/test_commerce_preview_bootstrap.py'
              - '!consent-protocol/tests/test_commerce_preview_target.py'
              - '!consent-protocol/tests/test_curated_connector_deploy_wiring.py'
              - '!consent-protocol/tests/test_deploy_sha_gate_payload_size.py'
              - '!consent-protocol/tests/test_dev_candidate_gate.py'
              - '!consent-protocol/tests/test_drive_scheduler_set_snapshot.py'
              - '!consent-protocol/tests/test_drive_v1_worker_lane.py'
              - '!consent-protocol/tests/test_drive_work_drain_scheduler_contract.py'
              - '!consent-protocol/tests/test_drive_worker_release_rollback.py'
              - '!consent-protocol/tests/test_database_connection_ceiling.py'
              - '!consent-protocol/tests/helpers/drive_worker_gcloud.py'
              - '!consent-protocol/tests/test_feed_stream_capacity_contract.py'
              - '!consent-protocol/tests/test_gmail_information_request_release_contract.py'
              - '!consent-protocol/tests/test_hushh_tech_client_migration.py'
              - '!consent-protocol/tests/test_kai_analyze_durable_run_store_deploy_parity.py'
              - '!consent-protocol/tests/test_one_wallet_card_deploy_parity.py'
              - '!consent-protocol/tests/test_phone_schema_legacy_job.py'
              - '!consent-protocol/tests/test_pkm_v7_recovery_migration.py'
