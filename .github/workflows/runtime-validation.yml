name: Runtime Validation

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  runtime-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run runtime validation
        run: |
          python tools/integration_validation/run_all_checks.py