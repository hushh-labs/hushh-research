name: Deployment Security
run-name: >-
  ${{ inputs.source_request && fromJSON(inputs.source_request).kind == 'queue' &&
      format('Merge permission · {0} · queue {1}', fromJSON(inputs.source_request).phase, fromJSON(inputs.source_request).id) ||
      inputs.source_request && fromJSON(inputs.source_request).kind == 'operation' &&
      format('Operation permission · {0}', fromJSON(inputs.source_request).surface) || 'Deployment security' }}

on:
  # Explicit deployment clearance or exact operation/queue permission only.
  workflow_dispatch:
    inputs:
      source_request:
        description: "Exact deployment, queue or manual-operation request from trusted tooling"
        required: true
        type: string
  workflow_call:
    secrets:
      CI_TEAM_APP_PRIVATE_KEY:
        required: true
      GH_SECURITY_ALERTS_TOKEN:
        required: true
    inputs:
      application_ref:
        required: true
        type: string
      environment_name:
        required: true
        type: string
      scope:
        default: all
        type: string
    outputs:
      application_sha:
        value: ${{ jobs.alerts.outputs.sha }}
      attempt:
        value: ${{ jobs.alerts.outputs.attempt }}
      authorization:
        value: ${{ jobs.alerts.outputs.authorization }}

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  alerts:
    name: Verify repository secret clearance
    if: github.repository == 'hushh-labs/hushh-research' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    environment: ci-security
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.clearance.outputs.sha }}
      attempt: ${{ steps.clearance.outputs.attempt }}
      authorization: ${{ steps.clearance.outputs.authorization }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read current release-team membership
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3 (Node 24)
        id: membership
        with:
          client-id: ${{ vars.CI_TEAM_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_TEAM_APP_PRIVATE_KEY }}
          owner: hushh-labs
          repositories: hushh-research
          permission-members: read
      - name: Read protected repository inventory
        id: clearance
        run: python3 scripts/ci/deployment_security.py
        env:
          GH_TOKEN: ${{ github.token }}
          GH_SECURITY_ALERTS_TOKEN: ${{ secrets.GH_SECURITY_ALERTS_TOKEN }}
          CI_TEAM_MEMBERS_TOKEN: ${{ steps.membership.outputs.token }}
          DEPLOY_SECURITY_REF: ${{ inputs.application_ref }}
          DEPLOY_SECURITY_ENVIRONMENT: ${{ inputs.environment_name }}
          DEPLOY_SECURITY_SCOPE: ${{ inputs.scope }}
          DEPLOY_SECURITY_REQUEST: ${{ inputs.source_request }}
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: deployment-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/deployment-security.json
            ${{ runner.temp }}/merge-authorization.json
          if-no-files-found: error
          retention-days: 7
