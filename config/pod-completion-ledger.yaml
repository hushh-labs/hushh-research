# The private-pod completion ledger.
#
# WHAT THIS IS
# Every item is something that must be TRUE before "the private pod deployment is
# complete" is an honest sentence. Each carries a CHECK, and its status is whatever
# running that check says today. There is deliberately no status field: nobody can
# mark an item done, they can only make its check pass. Status is derived, never
# declared, because a declared status is the failure this programme keeps hitting.
#
# THE TWO RULES A NEW ITEM MUST FOLLOW
# 1. `falsifiable: true` only if the check genuinely FAILS when the thing is broken.
#    A check that cannot fail is not evidence, and the judge reports it as a defect
#    in this file rather than counting it as passing.
# 2. If it cannot be evaluated where the judge runs, it reports UNKNOWN, never PASS.
#    Use `blocked_by` for things gated on something outside our control, so the judge
#    stops nagging about the unfixable and starts nagging about the actionable.
#
# Run it:  uv run python scripts/ops/pod_completion_judge.py   (from consent-protocol/)

version: 1
subject: "Hussh private agent pod, all tiers: hushh-hosted, user-cloud BYOC, on-device"

assertions:
  # ---------------------------------------------------------------- the front door
  - id: firstrun-person-reaches-cloud-choice
    requirement: First run
    statement: "A brand-new person can reach the screen that asks where their agent should live."
    falsifiable: true
    owner_action: >-
      Find why the setup hub renders no "Where your agent lives" tile. Measured on
      localhost 2026-08-28: the hub paints all eight capability tiles and
      `one_setup_tile_cloud` is in NEITHER the Remaining nor the Complete group, so
      there is no in-app route from the hub to /one/setup/cloud. That is now the
      blocker, and it is a different defect from the pool contention below.
    check:
      kind: receipt
      reproduce: hushh-webapp/scripts/testing/first-run-reachability.mjs
      expires_after_days: 14
      pending: >-
        Measured FAILING on 2026-08-28 against the local stack. The driver reaches
        /one/setup and the hub renders, then times out waiting for the cloud tile
        that never appears. The earlier "sits on Checking setup forever" reading no
        longer reproduces: the admission guard resolved from cache and never even
        raised its loader.

  - id: firstrun-guard-is-time-bounded
    requirement: First run
    statement: "The setup admission check cannot spin forever; a hang becomes a visible error."
    falsifiable: true
    owner_action: "Add an upper bound to the guard's admission await, alongside its existing catch."
    check:
      kind: grep
      path: hushh-webapp/components/onboarding/onboarding-journey-guard.tsx
      pattern: "ADMISSION_TIMEOUT_MS"
      expect_present: true

  - id: firstrun-fanout-within-pool
    requirement: First run
    statement: "The first-paint fan-out fits inside the connection pool it runs against."
    falsifiable: true
    owner_action: >-
      The three chrome reads (consent badge, feed badge, avatar, persona) are now
      gated on route AND on chrome suppression, and that gate MEASURED NO CHANGE:
      re-run shows peak 7 with the same witnesses. Reason, measured: the peak lands
      while `location.pathname` is still /login and suppression is never active for
      a warm-cache identity, so neither clause fires. The remaining honest options
      are to gate on "the shell has not settled" rather than on route or
      suppression, or to raise the pool for the lane.
    check:
      kind: receipt
      reproduce: hushh-webapp/scripts/testing/first-run-reachability.mjs
      expires_after_days: 14
      pending: >-
        Measured 2026-08-28: peak 7 concurrent /api requests against a pool of 4, on
        /login. Witnesses: vault/check, feed/unread-count, account/identity/refresh,
        vault/bootstrap-state, consent/center/summary, iam/persona, connected-systems.
        The earlier "14 routes" figure is superseded by this instrumented reading.
        `/api/connected-systems` appears here and has no frontend caller anyone has
        found, which is worth chasing on its own.

  # ---------------------------------------------------------------- the seven
  - id: identity-durable-across-restart
    requirement: Identity
    statement: "A pod keeps the same identity key across a genuine restart, and says so durably."
    falsifiable: true
    check:
      kind: pytest
      target: tests/test_pod_lifecycle_drill.py

  - id: identity-proven-on-live-infrastructure
    requirement: Identity
    statement: "The durable-identity claim has been demonstrated on a real pod, with a negative control."
    falsifiable: true
    check:
      # A receipt, not a note. The note this replaced said "PROVEN 2026-08-28" and
      # would have kept saying it in 2027, which is the declared status this ledger
      # exists to abolish wearing a different field name. A receipt expires.
      kind: receipt
      verified_on: "2026-08-28"
      expires_after_days: 30
      reproduce: consent-protocol/scripts/ops/prove_identity.py
      evidence: >-
        hushh-pda-dev: same podKeyId across revisions 00001-xnm and 00002-857,
        podKeyDurable true on both, the stored key object READ not rewritten
        (generation 1787951680186460 unchanged), and a negative control with the
        feature off reported not durable. Everything created was torn down.

  - id: persistence-recall-across-death
    requirement: Persistence
    statement: "An agent recalls what it was taught after its compute is destroyed and rebuilt."
    falsifiable: true
    check:
      kind: pytest
      target: tests/test_pod_lifecycle_drill.py

  - id: lifecycle-drill-can-fail
    requirement: Persistence
    statement: "The lifecycle drill fails a lifecycle that loses memory or re-mints identity."
    falsifiable: true
    check:
      kind: command
      command: "cd consent-protocol && uv run python scripts/ops/pod_lifecycle_drill.py --dry-run >/dev/null"
      requires: [uv]

  - id: parity-ruler-hub-grounding-independent
    requirement: Capability
    statement: "The parity probe never reads the hub's grounding off the pod it is judging."
    falsifiable: true
    check:
      kind: pytest
      target: tests/test_pod_parity_probe.py

  - id: parity-ruler-sees-specialists
    requirement: Capability
    statement: "A live pod turn reports which specialists served, so the ruler can see them."
    falsifiable: true
    owner_action: "Emit a `specialists` key from run_pod_turn; observe_pod already reads it."
    check:
      # A pytest, not a grep. The grep this replaced would have passed on the word
      # appearing in a comment, and it could not see the half of the seam that
      # actually broke: the route's spelling of the id field agreeing with the
      # oracle's reader. The test pins both ends and the route source.
      kind: pytest
      target: tests/test_pod_turn_reports_specialists.py

  - id: specialists-run-in-pod
    requirement: Capability
    statement: "The DB-backed specialists execute inside the pod rather than reaching a central service."
    falsifiable: true
    blocked_by: >-
      Hub-side exact-authority threading. Three specialists are refused identically on
      both sides today, which is honest but is not re-homing.
    owner_action: "Land the nav/consent door first: deterministic, no model, no authority gate."
    check:
      kind: receipt
      reproduce: consent-protocol/scripts/ops/pod_parity_probe.py
      expires_after_days: 30
      pending: >-
        The ruler can see specialists as of 2026-08-28, so a live probe can now
        certify this. What it will certify today is identical refusal on both sides,
        which is honest agreement and not re-homing; earn the receipt after the
        nav/consent door lands.

  - id: consent-chain-detects-a-wipe
    requirement: Authority
    statement: "An emptied or truncated consent ledger fails verification instead of passing."
    falsifiable: true
    check:
      kind: pytest
      target: tests/test_consent_audit_chain.py

  - id: consent-chain-not-signed-by-the-minting-key
    requirement: Authority
    statement: "The audit ledger is not signed with the same key that mints consent tokens."
    falsifiable: true
    owner_action: "Move the chain signature off APP_SIGNING_KEY (Ed25519 or a KMS-side sign)."
    check:
      # A grep for the string would now FAIL on the module docstring that explains
      # why the key is not APP_SIGNING_KEY, and would have passed on a file that
      # merely renamed the import. The test parses the module and asserts no CODE
      # names it, then asserts the two properties a grep cannot see at all:
      # verification uses the public key, and an untagged HMAC signature is refused
      # so nobody can downgrade their way back in.
      kind: pytest
      target: tests/test_consent_audit_key_separation.py

  - id: internal-actions-are-chained
    requirement: Authority
    statement: "The agent's own internal actions are written into the audit chain."
    falsifiable: true
    owner_action: >-
      Route insert_internal_event through append_consent_receipt_safe. Today
      insert_event diverts internal events (self, agent_kai, kai, OPERATION_PERFORMED,
      device-scoped vault.owner) to insert_internal_event, which never chains them, so
      the largest class of actions has no receipt.
    check:
      # Scoped to the FUNCTION, not the file: a file-wide grep passed because the
      # chain call exists elsewhere for the primary ledger, which is exactly the
      # false green this ledger is supposed to make impossible. The test also pins
      # the part that matters most -- internal events land on their OWN sequence,
      # so the head an owner pins for truncation detection does not advance on
      # every turn and become useless for the one thing it is for.
      kind: pytest
      target: tests/test_consent_audit_key_separation.py

  - id: capability-wiring-is-closed-loop
    requirement: Isolation
    statement: "Every pod capability that is rendered is also emitted, and parked ones are wired nowhere."
    falsifiable: true
    check:
      kind: pytest
      target: tests/test_pod_capability_wiring_is_closed_loop.py

  - id: economics-cost-is-measured-not-estimated
    requirement: Economics
    statement: "The per-person cost is a measured number from real billed time."
    falsifiable: true
    check:
      kind: receipt
      verified_on: "2026-08-31"
      expires_after_days: 30
      reproduce: consent-protocol/scripts/ops/measure_pod_cost.py
      evidence: >-
        Re-earned 2026-08-31 against a REAL pod, because the 2026-08-28 receipt was a
        false green: measure_pod_cost.py shelled out to `gcloud monitoring time-series
        list`, a subcommand that does not exist in SDK 577 (nor alpha/beta), so the
        reproduction path could never run. The receipt passed only because the check
        verifies the path EXISTS, not that it RUNS. It now uses the Monitoring REST
        API and was executed to produce this line.
        Measured on one-pod-ha1-6ty5ir24faljqjfb43r6dexar6soha47 in
        hussh-one-kd8rb4ssh-one-tk2o4w over 7d: 0.5 vCPU / 1 GiB at $0.0000145 per
        billable second, 424.7 billable seconds across 489 sampled points, $0.00616
        for the window. Model inference is excluded and the report says so on its
        face, because a user_adc pod bills Vertex to its owner's account and is not
        in this project's metrics at all.

  - id: economics-cost-attributable-per-pod
    requirement: Economics
    statement: "Spend can be attributed to an individual agent."
    falsifiable: true
    owner_action: >-
      Assign billing_space_id on PodSpec at the provision sites. It must be an OPAQUE
      derived value distinct from the owner's space_id handle: _label_value's docstring
      forbids a raw user id (or a user-chosen name) in a billing label.
    check:
      # A grep for `space_id=` would have passed the day the field was DEFINED.
      # The test asserts the two things that actually make spend attributable:
      # the label carries an opaque value, and the registry row carries the same
      # one so it can be joined back to an account.
      kind: pytest
      target: tests/test_pod_cost_is_attributable.py

  # ---------------------------------------------------------------- operations
  - id: pod-image-has-a-supported-upgrade-path
    requirement: Lifecycle
    statement: "A running pod can be moved to a newer image without losing its memory."
    falsifiable: true
    owner_action: >-
      Shipped 2026-09-02: `UserGcpBackend.upgrade` / `GcpBackend.upgrade` replace the
      revision in place on the hub's current image (a heal still pins the deployed
      digest), `PersonalAgentProvisioningService.upgrade_pod` rewrites only the image
      facts on the row, and the reconcile worker's bounded sweep
      (PERSONAL_AGENT_UPGRADE_SWEEP_ENABLED, PERSONAL_AGENT_UPGRADE_BATCH) moves the
      fleet after each hub deploy. `scripts/ops/pod_upgrade.py` is the operator hand.
    check:
      # Names a test that does NOT exist yet, on purpose. `manual` here would report
      # UNKNOWN forever; a missing pytest target FAILS, which is the accurate word
      # for "nobody has built this", and it turns green the day somebody does.
      kind: pytest
      target: tests/test_pod_image_upgrade_path.py

  - id: teardown-deletes-what-it-claims-to
    requirement: Economics
    statement: "Teardown actually removes the pod, and says so when it cannot."
    falsifiable: true
    # This is the half that the fleet sweep below cannot see. An empty fleet is
    # equally consistent with "teardown works" and "nothing was ever created", so
    # the sweep alone was a check that passed for the wrong reason.
    check:
      kind: pytest
      target: tests/test_byoc_substrate_teardown_is_loud.py

  - id: an-update-is-visible-at-login
    requirement: Lifecycle
    statement: "The app can see that a newer agent build exists, is installing, or failed, from the pod's own report of what it runs."
    falsifiable: true
    # The founder's rule: an upgrade is a software update when the person opens the
    # app. That starts with the installed version, which nothing exposed before.
    check:
      kind: pytest
      target: tests/test_pod_update_detection.py

  - id: pod-memory-is-the-persons-own-memory-bank
    requirement: Learning loop
    statement: "A BYOC pod's memory is Vertex AI Memory Bank in the person's project, created by the pod itself, with the sealed log underneath."
    falsifiable: true
    check:
      kind: pytest
      target: tests/test_pod_memory_bank.py

  - id: only-the-pod-can-vouch-for-its-model
    requirement: Economics
    statement: "The owner can ask their own pod whether their project reaches a model; no hub identity can answer for it."
    falsifiable: true
    check:
      kind: pytest
      target: tests/test_pod_model_diagnostic.py

  - id: no-pod-is-billing-right-now
    requirement: Economics
    statement: "No pod left over from a drill or proof is still costing money on dev."
    falsifiable: true
    owner_action: "Tear down what the session created, then re-run the fleet sweep."
    check:
      # Deliberately narrow: this proves the shared dev environment is clean today.
      # It does NOT prove teardown works -- teardown-deletes-what-it-claims-to does.
      # Splitting them is the fix for a check that was green because the fleet was
      # empty for reasons unrelated to the thing it claimed to certify.
      kind: command
      command: >-
        cd consent-protocol && uv run python scripts/ops/pod_fleet.py
        --project hushh-pda-dev --region us-central1 | grep -q "no pods labelled"
      requires: [uv, gcloud]

  - id: the-drill-runs-on-a-schedule
    requirement: Learning loop
    statement: "The lifecycle drill runs on a cadence, not only when someone remembers."
    falsifiable: true
    check:
      kind: grep
      path: .github/workflows/dev-pod-lifecycle-drill.yml
      pattern: "schedule:"
      expect_present: true

  - id: the-judge-itself-can-fail
    requirement: Learning loop
    statement: "The judge reports NOT finished when an item is failing, and cannot report a false green."
    falsifiable: true
    check:
      kind: pytest
      target: tests/test_pod_completion_judge.py
