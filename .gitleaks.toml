title = "hushh-research gitleaks config"

[extend]
useDefault = true

[[rules]]
    id = "hushh-developer-secret"
    description = "Detected a possible Hushh Developer Secret or API Token prefix"
    regex = '''(?i)(hushh_secret_|hushh_token_|pkm_key_)[a-z0-9\-_\.=]{16,64}'''
    tags = ["key", "api", "hushh", "secret"]

# Source-aware exceptions for exact findings independently verified by Gitleaks
# 8.24.2 history and current-tree reports. Rule, path, and source context must
# all match; historical fixture exceptions also require their exact commit.
[[rules]]
    id = "generic-api-key"

[[rules.allowlists]]
    description = "Nonliteral VoiceSession keyword expression; credential-shaped values in this file remain scanned."
    condition = "AND"
    paths = ['''(^|/)consent-protocol/hushh_mcp/one_voice/session\.py$''']
    regexTarget = "match"
    regexes = ['''^auth\.user_id, conversation_id=self\.claims\.conversation_id$''']

[[rules.allowlists]]
    description = "Five verified idempotency test inputs in their historical commit only."
    condition = "AND"
    commits = ["b80a2169ed5d7f00f4f23b417403e9834e2317b5"]
    paths = ['''(^|/)consent-protocol/tests/test_information_sharing_lifecycle_e2e\.py$''']
    regexTarget = "line"
    regexes = ['''^\s*idempotency_key\s*=''']

[[rules.allowlists]]
    description = "Verified public Firebase test-fixture key name in its historical commit only."
    condition = "AND"
    commits = ["ffbab446c327ddffac2446d401237c7a4c5e725b"]
    paths = ['''(^|/)consent-protocol/tests/scripts/test_measure_agent_chat_latency\.py$''']
    regexTarget = "line"
    regexes = ['''^\s*"NEXT_PUBLIC_FIREBASE_API_KEY"\s*:''']

[[rules.allowlists]]
    description = "Verified fake vault-token fixture in its historical commit only."
    condition = "AND"
    commits = ["ffbab446c327ddffac2446d401237c7a4c5e725b"]
    paths = ['''(^|/)consent-protocol/tests/scripts/test_measure_agent_chat_latency\.py$''']
    regexTarget = "line"
    regexes = ['''^\s*FAKE_VAULT_TOKEN\s*=''']

[[rules.allowlists]]
    description = "The historical synthetic Stripe classifier assertion also matches the generic rule; exact commit, file, and assertion only."
    condition = "AND"
    commits = ["6b330b0ac32af63ff097799debd111a8421cf47f"]
    paths = ['''(^|/)consent-protocol/tests/services/test_pkm_agent_lab_service\.py$''']
    regexTarget = "line"
    regexes = ['''^\s*assert S\._contains_sensitive_secret\(.+\)\s*==\s*["']credential["']\s*$''']

[[rules.allowlists]]
    description = "One verified check-in route-token fixture in its historical commit only."
    condition = "AND"
    commits = ["4b2a240007921c3a4b19a57ab016d2e0c195bcee"]
    paths = ['''(^|/)hushh-webapp/__tests__/components/one-location-check-in-destination\.contract\.test\.ts$''']
    regexTarget = "line"
    regexes = ['''^\s*const token\s*=''']

[[rules]]
    id = "stripe-access-token"

[[rules.allowlists]]
    description = "One verified historical classifier assertion; no other Stripe-shaped value is exempt."
    condition = "AND"
    commits = ["6b330b0ac32af63ff097799debd111a8421cf47f"]
    paths = ['''(^|/)consent-protocol/tests/services/test_pkm_agent_lab_service\.py$''']
    regexTarget = "line"
    regexes = ['''^\s*assert S\._contains_sensitive_secret\(.+\)\s*==\s*["']credential["']\s*$''']

[allowlist]
description = "Documented backend env placeholders + test fixtures"
paths = [
  '''^consent-protocol/\.env\.example$''',
  # HCT golden-vector fixture: deterministic test signing key used by the
  # canonical Python signer parity gate.
  '''^consent-protocol/tests/fixtures/hct_golden_vectors\.json$''',
  # Deterministic, synthetic Hermes interoperability vector. The encrypted
  # bytes and hash are fixed test outputs, not deployable credentials.
  '''^hushh-webapp/__tests__/fixtures/hermes-vault-vector\.json$''',
  # Deterministic "Bring your own AI" seal vector (C1): published synthetic X25519
  # keys, iv and derived AES key so the device and the pod assert identical bytes.
  '''^consent-protocol/tests/fixtures/ai_selection_seal_vector_v1\.json$''',
  # Published synthetic connector seal (C2) interoperability vector. The fixed
  # private keys and derived outputs are test material, never live credentials.
  '''^consent-protocol/tests/fixtures/connector_credential_seal_vector_v1\.json$''',
]
regexes = [
  '''replace_with_64_char_hex_secret_key''',
  '''replace_with_64_char_hex_vault_encryption_key''',
  '''your_local_hex_secret_here''',
  '''your_local_vault_hex_here''',
  # False positive: route-state variable names in Kai layout matched Plaid client-id heuristic.
  '''onPlaidOauthReturnRoute''',
  '''onAlpacaOauthReturnRoute''',
  # Exact compiler provenance digest for the checked-in Location workflow API
  # contract. This is reproducible artifact metadata, not credential material.
  # A workflow-contract change produces a different digest and is scanned again.
  '''abcb54b58f01f2eb99ac4bda811187a21dd4a368987a8e570b43847b7a2a8bb2''',
  # Reproducible workflow API contract digest after the command repair.
  '''4e65e07107cbf9a571c0a471005f18e3b31366fea6a1176b0d745e47a5b3d383''',
  # Reproducible workflow API contract digest for Circle setup and Search actions.
  # Exact generated metadata only; future contract digests remain scanned.
  '''e8b5f1471a8ff3a3c44313dd7c8347d4dd3d3fec40c54f72a65743b02c0fb8a9''',
  # Python enum constant passed to token validation, never token material.
  '''ConsentScope\.VAULT_OWNER''',
  # Public algorithm identifier used by Location recipient-key fixtures.
  '''^ECDH-P256-AES256-GCM$''',
  # HCT golden-vector deterministic test key; never used in production.
  '''golden_vector_signing_key_for_hct_parity_only_32\+''',
  # OneConsent Keychain item account names — public, version-stable identifiers
  # for the SE-bound wrapping key + wrapped data-key envelope. Documented in
  # apps/one-mac/docs/threat-model.md.
  '''ai\.hushh\.one\.consent\.wrapping\.v1''',
  '''ai\.hushh\.one\.consent\.data-key\.v1''',
  # The NAME of the env var that carries the consent signing key, not the key.
  # `generic-api-key` fires on `PRIVATE_KEY_ENV = "CONSENT_ED25519_PRIVATE_KEY"`
  # (hushh_mcp/consent/token_signing.py) because the constant reads like a secret
  # and the literal clears the entropy bar at 4.06. The name is public by
  # necessity — it appears in deploy configs, runbooks and the backend parity
  # test — so the finding can never be anything but noise.
  #
  # Anchored on purpose, and matched against the SECRET rather than the file. A
  # path allowlist would blind the scanner to a real key landing in that same
  # file; this exempts one exact string and nothing else, so an actual Ed25519
  # key assigned to that variable still trips the rule.
  '''^CONSENT_ED25519_PRIVATE_KEY$''',
  # Public Python type annotation captured after pod_private_key, not a value.
  '''^X25519PrivateKey$''',
  # Exact test-only HMAC dependency injected into action ledger fixtures.
  '''^test-key-at-least-32-characters-long$''',
  # A Pydantic LENGTH BOUND, not a secret. `generic-api-key` treats a field alias
  # containing "Credential" as a key name and then captures the NEXT token as its
  # value, so
  #
  #     alias="runtimeCredential", max_length=12000
  #
  # is read as `runtimeCredential = 12000`. Four findings in api/routes/one/
  # pod_turn.py and pod_relay.py are all this shape; the captured "secret" is
  # literally `max_length=12000` at entropy 3.70.
  #
  # Anchored, and matched against the SECRET rather than the file, following the
  # CONSENT_ED25519_PRIVATE_KEY entry above. `max_length=<digits>` cannot express
  # a credential -- there is no assignment of a key that produces this exact
  # string -- so a real credential landing on the very next line of those same
  # files still trips the rule with a different secret. A path allowlist would
  # blind the scanner to that; this does not.
  '''^max_length=[0-9]+$''',
  # The equivalent public JSON Schema length bound, captured as a value after
  # prose containing "access" by Gitleaks 8.24.2. Exempt the numeric bound only;
  # credentials elsewhere in the same schema remain scanned.
  '''^maxLength=[0-9]+$''',
  # Public financial subdomain identifiers, not credentials; exact values only.
  '''^financial\.(holdings|securities|derived)_v1$''',
  # Azure's built-in "Key Vault Secrets User" role definition id. It is the same
  # GUID in every Azure tenant and is published in Microsoft's built-in roles
  # reference; `generic-api-key` fires only because the constant that names it
  # (ROLE_KEY_VAULT_SECRETS_USER in azure_setup_roles.py) contains "SECRETS".
  # Anchored and matched against the SECRET, following the entries above: any
  # other value assigned to that name still trips the rule.
  '''^4633458b-17de-408a-b874-0445c86b69e6$''',
  # Old unpushed V1 commit used this exact public checkpoint field name in a
  # Python constant; the generic-key heuristic mistook that assignment for a
  # credential. The constant is now renamed, but CI scans commit history.
  '''^v1_evaluation_priority$''',
  # An earlier feature commit put a synthetic token variable beside this
  # checkpoint field in a test constructor. The generic-key heuristic captured
  # the public field assignment as its value. Current code separates them; CI
  # still scans the commit range. Match only this exact non-secret field text.
  '''^epoch_digest=$''',
]
