title = "hushh-research gitleaks config"

[extend]
useDefault = true

[[rules]]
    id = "hushh-developer-secret"
    description = "Detected a possible Hushh Developer Secret or API Token prefix"
    regex = '''(?i)(hushh_secret_|hushh_token_|pkm_key_)[a-z0-9\-_\.=]{16,64}'''
    tags = ["key", "api", "hushh", "secret"]

[allowlist]
description = "Documented backend env placeholders + test fixtures"
paths = [
  '''^consent-protocol/\.env\.example$''',
  # HCT golden-vector fixture: deterministic test signing key used by the
  # canonical Python signer parity gate.
  '''^consent-protocol/tests/fixtures/hct_golden_vectors\.json$''',
  # Deterministic, synthetic Hermes interoperability vector. The encrypted
  # bytes and hash are fixed test outputs, not deployable credentials.
  '''^hushh-webapp/__tests__/fixtures/hermes-vault-vector\.json$''',
]
regexes = [
  '''replace_with_64_char_hex_secret_key''',
  '''replace_with_64_char_hex_vault_encryption_key''',
  '''your_local_hex_secret_here''',
  '''your_local_vault_hex_here''',
  # False positive: route-state variable names in Kai layout matched Plaid client-id heuristic.
  '''onPlaidOauthReturnRoute''',
  '''onAlpacaOauthReturnRoute''',
  # Exact compiler provenance digest for the checked-in Location workflow API
  # contract. This is reproducible artifact metadata, not credential material.
  # A workflow-contract change produces a different digest and is scanned again.
  '''abcb54b58f01f2eb99ac4bda811187a21dd4a368987a8e570b43847b7a2a8bb2''',
  # Reproducible workflow API contract digest after the command repair.
  '''4e65e07107cbf9a571c0a471005f18e3b31366fea6a1176b0d745e47a5b3d383''',
  # Python enum constant passed to token validation, never token material.
  '''ConsentScope\.VAULT_OWNER''',
  # Public algorithm identifier used by Location recipient-key fixtures.
  '''^ECDH-P256-AES256-GCM$''',
  # HCT golden-vector deterministic test key; never used in production.
  '''golden_vector_signing_key_for_hct_parity_only_32\+''',
]
