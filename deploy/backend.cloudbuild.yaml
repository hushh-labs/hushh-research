# Cloud Build configuration for Python FastAPI backend
# Deploy to: Cloud Run (service name configurable via substitutions)

steps:
  # Step 1: Build Docker image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "gcr.io/$PROJECT_ID/consent-protocol:manual"
      - "-t"
      - "gcr.io/$PROJECT_ID/consent-protocol:latest"
      - "-t"
      - "gcr.io/$PROJECT_ID/consent-protocol:${_IMAGE_TAG}"
      - "-f"
      - "consent-protocol/Dockerfile"
      - "consent-protocol"
    id: "build-backend-image"

  # Step 2: Push Docker image to Container Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "gcr.io/$PROJECT_ID/consent-protocol:manual"
    id: "push-backend-image"

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "gcr.io/$PROJECT_ID/consent-protocol:latest"
    id: "push-backend-latest"

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "gcr.io/$PROJECT_ID/consent-protocol:${_IMAGE_TAG}"
    id: "push-backend-version"

  # Step 3: Deploy to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        env_file="$(mktemp)"
        trap 'rm -f "${env_file}"' EXIT

        append_env_var() {
          local key="$1"
          local value="${2-}"
          if [[ -z "${value}" ]]; then
            return
          fi
          python3 -c 'import json, sys; print(f"{sys.argv[1]}: {json.dumps(sys.argv[2])}")' \
            "${key}" \
            "${value}" >>"${env_file}"
        }

        append_env_var "ENVIRONMENT" "${_ENVIRONMENT}"
        append_env_var "GOOGLE_GENAI_USE_VERTEXAI" "True"
        append_env_var "DB_HOST" "${_DB_HOST}"
        append_env_var "DB_PORT" "${_DB_PORT}"
        append_env_var "DB_NAME" "${_DB_NAME}"
        append_env_var "CONSENT_SSE_ENABLED" "${_CONSENT_SSE_ENABLED}"
        append_env_var "SYNC_REMOTE_ENABLED" "${_SYNC_REMOTE_ENABLED}"
        append_env_var "DEVELOPER_API_ENABLED" "${_DEVELOPER_API_ENABLED}"
        append_env_var "REMOTE_MCP_ENABLED" "${_REMOTE_MCP_ENABLED}"
        append_env_var "CORS_ALLOWED_ORIGINS" "${_CORS_ALLOWED_ORIGINS}"
        append_env_var "OBS_DATA_STALE_RATIO_THRESHOLD" "${_OBS_DATA_STALE_RATIO_THRESHOLD}"
        append_env_var "PASSKEY_ALLOWED_RP_IDS" "${_PASSKEY_ALLOWED_RP_IDS}"
        append_env_var "DB_UNIX_SOCKET" "${_DB_UNIX_SOCKET}"
        append_env_var "PLAID_ENV" "${_PLAID_ENV}"
        append_env_var "PLAID_CLIENT_NAME" "${_PLAID_CLIENT_NAME}"
        append_env_var "PLAID_COUNTRY_CODES" "${_PLAID_COUNTRY_CODES}"
        append_env_var "PLAID_WEBHOOK_URL" "${_PLAID_WEBHOOK_URL}"
        append_env_var "PLAID_REDIRECT_PATH" "${_PLAID_REDIRECT_PATH}"
        append_env_var "PLAID_REDIRECT_URI" "${_PLAID_REDIRECT_URI}"
        append_env_var "PLAID_TX_HISTORY_DAYS" "${_PLAID_TX_HISTORY_DAYS}"
        append_env_var "ALPACA_ENV" "${_ALPACA_ENV}"
        append_env_var "ALPACA_BROKER_BASE_URL" "${_ALPACA_BROKER_BASE_URL}"
        append_env_var "ALPACA_DEFAULT_ACCOUNT_ID" "${_ALPACA_DEFAULT_ACCOUNT_ID}"
        append_env_var "ALPACA_CONNECT_REDIRECT_URI" "${_ALPACA_CONNECT_REDIRECT_URI}"
        append_env_var "ALPACA_CONNECT_AUTHORIZE_URL" "${_ALPACA_CONNECT_AUTHORIZE_URL}"
        append_env_var "ALPACA_CONNECT_TOKEN_URL" "${_ALPACA_CONNECT_TOKEN_URL}"
        append_env_var "ALPACA_CONNECT_ACCOUNT_URL" "${_ALPACA_CONNECT_ACCOUNT_URL}"
        append_env_var "ALPACA_CONNECT_SCOPES" "${_ALPACA_CONNECT_SCOPES}"
        append_env_var "ALPACA_CONNECT_ENV" "${_ALPACA_CONNECT_ENV}"
        append_env_var "ALPACA_CONNECT_STATE_TTL_SECONDS" "${_ALPACA_CONNECT_STATE_TTL_SECONDS}"
        append_env_var "RIA_DEV_BYPASS_ENABLED" "${_RIA_DEV_BYPASS_ENABLED}"
        append_env_var "RIA_INTELLIGENCE_VERIFY_BASE_URL" "${_RIA_INTELLIGENCE_VERIFY_BASE_URL}"
        append_env_var "RIA_INTELLIGENCE_VERIFY_ENDPOINT_PATH" "${_RIA_INTELLIGENCE_VERIFY_ENDPOINT_PATH}"
        append_env_var "RIA_INTELLIGENCE_VERIFY_TIMEOUT_SECONDS" "${_RIA_INTELLIGENCE_VERIFY_TIMEOUT_SECONDS}"
        append_env_var "RIA_INTELLIGENCE_VERIFY_URL" "${_RIA_INTELLIGENCE_VERIFY_URL}"

        append_optional_secret() {
          local secret_name="$1"
          local env_name="$2"
          if [[ -z "${secret_name}" ]]; then
            return
          fi
          if gcloud secrets describe "${secret_name}" --project="$PROJECT_ID" >/dev/null 2>&1; then
            secrets="${secrets},${env_name}=${secret_name}:latest"
          else
            echo "Skipping optional secret ${secret_name}; not found in project ${PROJECT_ID}."
          fi
        }

        append_optional_secret_with_fallback() {
          local primary_secret_name="$1"
          local fallback_secret_name="$2"
          local env_name="$3"

          if [[ -n "${primary_secret_name}" ]] && gcloud secrets describe "${primary_secret_name}" --project="$PROJECT_ID" >/dev/null 2>&1; then
            secrets="${secrets},${env_name}=${primary_secret_name}:latest"
            return
          fi

          if [[ -n "${fallback_secret_name}" ]] && gcloud secrets describe "${fallback_secret_name}" --project="$PROJECT_ID" >/dev/null 2>&1; then
            echo "Using fallback source secret ${fallback_secret_name} for runtime ${env_name}."
            secrets="${secrets},${env_name}=${fallback_secret_name}:latest"
            return
          fi

          if [[ -n "${primary_secret_name}" || -n "${fallback_secret_name}" ]]; then
            echo "Skipping optional secret ${env_name}; no matching source secret was found in project ${PROJECT_ID}."
          fi
        }

        secrets="SECRET_KEY=SECRET_KEY:latest,VAULT_ENCRYPTION_KEY=VAULT_ENCRYPTION_KEY:latest,GOOGLE_API_KEY=GOOGLE_API_KEY:latest,FIREBASE_SERVICE_ACCOUNT_JSON=${_FIREBASE_SERVICE_ACCOUNT_SECRET}:latest,FRONTEND_URL=FRONTEND_URL:latest,DB_USER=DB_USER:latest,DB_PASSWORD=DB_PASSWORD:latest,APP_REVIEW_MODE=APP_REVIEW_MODE:latest,REVIEWER_UID=REVIEWER_UID:latest"
        if [[ -n "${_PLAID_CLIENT_ID_SECRET}" ]]; then
          secrets="${secrets},PLAID_CLIENT_ID=${_PLAID_CLIENT_ID_SECRET}:latest"
        fi
        if [[ -n "${_PLAID_SECRET_SECRET}" ]]; then
          secrets="${secrets},PLAID_SECRET=${_PLAID_SECRET_SECRET}:latest"
        fi
        if [[ -n "${_PLAID_TOKEN_ENCRYPTION_KEY_SECRET}" ]]; then
          secrets="${secrets},PLAID_TOKEN_ENCRYPTION_KEY=${_PLAID_TOKEN_ENCRYPTION_KEY_SECRET}:latest"
        fi
        append_optional_secret "${_ALPACA_BROKER_CLIENT_ID_SECRET}" "ALPACA_BROKER_CLIENT_ID"
        append_optional_secret "${_ALPACA_BROKER_CLIENT_SECRET_SECRET}" "ALPACA_BROKER_CLIENT_SECRET"
        append_optional_secret "${_ALPACA_BROKER_AUTH_TOKEN_SECRET}" "ALPACA_BROKER_AUTH_TOKEN"
        append_optional_secret_with_fallback "${_ALPACA_BROKER_KEY_ID_SECRET}" "${_ALPACA_BROKER_KEY_ID_FALLBACK_SECRET}" "ALPACA_BROKER_KEY_ID"
        append_optional_secret_with_fallback "${_ALPACA_BROKER_SECRET_SECRET}" "${_ALPACA_BROKER_SECRET_FALLBACK_SECRET}" "ALPACA_BROKER_SECRET"
        append_optional_secret "${_ALPACA_CONNECT_CLIENT_ID_SECRET}" "ALPACA_CONNECT_CLIENT_ID"
        append_optional_secret "${_ALPACA_CONNECT_CLIENT_SECRET_SECRET}" "ALPACA_CONNECT_CLIENT_SECRET"
        append_optional_secret "${_FUNDING_SECRET_ENCRYPTION_KEY_SECRET}" "FUNDING_SECRET_ENCRYPTION_KEY"
        append_optional_secret "${_FINNHUB_API_KEY_SECRET}" "FINNHUB_API_KEY"
        append_optional_secret "${_PMP_API_KEY_SECRET}" "PMP_API_KEY"
        append_optional_secret "${_NEWSAPI_KEY_SECRET}" "NEWSAPI_KEY"
        append_optional_secret "${_RIA_INTELLIGENCE_VERIFY_API_KEY_SECRET}" "RIA_INTELLIGENCE_VERIFY_API_KEY"

        cmd=(
          gcloud run deploy "${_BACKEND_SERVICE}"
          "--image=gcr.io/$PROJECT_ID/consent-protocol:${_IMAGE_TAG}"
          "--region=${_REGION}"
          "--platform=managed"
          "--allow-unauthenticated"
          "--port=8080"
          "--memory=1Gi"
          "--cpu=1"
          "--timeout=300"
          "--max-instances=10"
          "--min-instances=1"
          "--env-vars-file=${env_file}"
          "--set-secrets=${secrets}"
        )

        if [[ -n "${_CLOUDSQL_INSTANCES}" ]]; then
          cmd+=("--add-cloudsql-instances=${_CLOUDSQL_INSTANCES}")
        fi

        "${cmd[@]}"
    id: "deploy-backend"

# Images to store in Container Registry
images:
  - "gcr.io/$PROJECT_ID/consent-protocol:manual"
  - "gcr.io/$PROJECT_ID/consent-protocol:latest"
  - "gcr.io/$PROJECT_ID/consent-protocol:${_IMAGE_TAG}"

# Build timeout
timeout: "1200s"

substitutions:
  _BACKEND_SERVICE: consent-protocol
  _REGION: us-central1
  _ENVIRONMENT: production
  _DB_HOST: aws-1-us-east-1.pooler.supabase.com
  _DB_PORT: "5432"
  _DB_NAME: postgres
  _DB_UNIX_SOCKET: ""
  _CLOUDSQL_INSTANCES: ""
  _CORS_ALLOWED_ORIGINS: https://hushh-webapp-XXXXXXXXXX-uc.a.run.app
  _OBS_DATA_STALE_RATIO_THRESHOLD: "0.25"
  _CONSENT_SSE_ENABLED: "false"
  _SYNC_REMOTE_ENABLED: "false"
  _DEVELOPER_API_ENABLED: "false"
  _REMOTE_MCP_ENABLED: "false"
  _PASSKEY_ALLOWED_RP_IDS: ""
  _PLAID_ENV: ""
  _PLAID_CLIENT_NAME: ""
  _PLAID_COUNTRY_CODES: ""
  _PLAID_WEBHOOK_URL: ""
  _PLAID_REDIRECT_PATH: ""
  _PLAID_REDIRECT_URI: ""
  _PLAID_TX_HISTORY_DAYS: ""
  _ALPACA_ENV: ""
  _ALPACA_BROKER_BASE_URL: ""
  _ALPACA_DEFAULT_ACCOUNT_ID: ""
  _ALPACA_CONNECT_REDIRECT_URI: ""
  _ALPACA_CONNECT_AUTHORIZE_URL: ""
  _ALPACA_CONNECT_TOKEN_URL: ""
  _ALPACA_CONNECT_ACCOUNT_URL: ""
  _ALPACA_CONNECT_SCOPES: ""
  _ALPACA_CONNECT_ENV: ""
  _ALPACA_CONNECT_STATE_TTL_SECONDS: ""
  _RIA_DEV_BYPASS_ENABLED: ""
  _RIA_INTELLIGENCE_VERIFY_BASE_URL: https://hushh-ria-intelligence-api-53407187172.us-central1.run.app
  _RIA_INTELLIGENCE_VERIFY_ENDPOINT_PATH: /v1/ria/profile/stage1
  _RIA_INTELLIGENCE_VERIFY_TIMEOUT_SECONDS: "60"
  _RIA_INTELLIGENCE_VERIFY_URL: ""
  _PLAID_CLIENT_ID_SECRET: ""
  _PLAID_SECRET_SECRET: ""
  _PLAID_TOKEN_ENCRYPTION_KEY_SECRET: ""
  _ALPACA_BROKER_CLIENT_ID_SECRET: ""
  _ALPACA_BROKER_CLIENT_SECRET_SECRET: ""
  _ALPACA_BROKER_AUTH_TOKEN_SECRET: ""
  _ALPACA_BROKER_KEY_ID_SECRET: ""
  _ALPACA_BROKER_KEY_ID_FALLBACK_SECRET: ALPACA_API_KEY
  _ALPACA_BROKER_SECRET_SECRET: ""
  _ALPACA_BROKER_SECRET_FALLBACK_SECRET: ALPACA_API_SECRET
  _ALPACA_CONNECT_CLIENT_ID_SECRET: ""
  _ALPACA_CONNECT_CLIENT_SECRET_SECRET: ""
  _FUNDING_SECRET_ENCRYPTION_KEY_SECRET: ""
  _FINNHUB_API_KEY_SECRET: ""
  _PMP_API_KEY_SECRET: ""
  _NEWSAPI_KEY_SECRET: ""
  _RIA_INTELLIGENCE_VERIFY_API_KEY_SECRET: ""
  _FIREBASE_SERVICE_ACCOUNT_SECRET: FIREBASE_SERVICE_ACCOUNT_JSON
  _IMAGE_TAG: v2.1.0

# Options
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: "E2_HIGHCPU_8"
