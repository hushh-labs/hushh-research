  _ONE_EMAIL_WATCH_RENEW_AUTH_ENABLED: "true"
  _ONE_EMAIL_KYC_DEFAULT_SCOPE: ""
  _ONE_EMAIL_KYC_STRICT_CLIENT_ZK_ENABLED: "true"
  _ONE_WALLET_CARD_ENABLED: ""
  _APP_REVIEW_MODE: ""
  _HUSHH_PROD_PHONE_TEST_ENABLED: ""
  # Durable Kai analyze-run terminal-checkpoint store (migration 125). Empty =>
  # off (add_env skips empty values; runtime_settings defaults
  # False), preserving in-memory-only behavior. Set per-env below.
  _KAI_ANALYZE_DURABLE_RUN_STORE: ""
  _CLOUD_RUN_NO_TRAFFIC: "false"
  _CONSENT_API_PUBLIC_ORIGIN: ""
  _DB_POOL_MIN_SIZE: "1"
  _DB_POOL_MAX_SIZE: "4"
  _DB_SQLALCHEMY_POOL_SIZE: "4"
  _DB_SQLALCHEMY_MAX_OVERFLOW: "0"
  _CLOUD_RUN_MIN_INSTANCES: "1"
  _CLOUD_RUN_MAX_INSTANCES: "5"
  _RUNTIME_ENVIRONMENT: ""
  # Direct backend builds remain conservative. The UAT workflow explicitly
  # overrides this from its authoritative changed-SHA verification plan.
  _VERIFY_MANAGED_VERTEX_RUNTIME: "true"
  _IMAGE_TAG: v2.1.0
  _DEPLOY_ENV: manual
  _DEPLOY_SOURCE: manual
  _DEPLOY_SHA: unknown
  _GITHUB_RUN_ID: unknown
  # Slim per-user pod image (Dockerfile.pod). "true" builds and wires it on DEV
  # deploys of the SHA carrying this file; any other value skips both the build step
  # and the HUSSH_ONE_POD_IMAGE env var, leaving behaviour byte-identical to before.
  # The _DEPLOY_ENV == dev guard is independent of this switch, so setting it "true"
  # still cannot produce a pod image in uat or production.
  _BUILD_POD_IMAGE: "true"
  _RIA_INTELLIGENCE_CRD_SCRAPER_TIMEOUT_SECONDS: "65"
  _RIA_ONBOARDING_PROVIDER_TIMEOUT_SECONDS: "75"

# Options
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: "E2_HIGHCPU_8"
