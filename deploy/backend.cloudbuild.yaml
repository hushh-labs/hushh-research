      - "_ANSWER_WORK_DRAIN_AUDIENCE=${_ANSWER_WORK_DRAIN_AUDIENCE}"
    id: "deploy-backend"

  # UAT Azure PWM must prove federation, strict schema and attribution from the
  # exact no-traffic candidate image and runtime identity before promotion.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        finish_provider_probe() {
          probe_status=$?
          trap - EXIT
          READINESS_STEP_EXIT="${probe_status}" python3 scripts/ci/managed_provider_readiness.py record --provider=azure_openai --job="${job_name:-}" || true
          if [[ -n "${job_name:-}" ]]; then
            gcloud run jobs delete "${job_name}" --project="$PROJECT_ID" --region="${_REGION}" --quiet >/dev/null 2>&1 || true
          fi
          exit "${probe_status}"
        }
        trap finish_provider_probe EXIT
        if [[ "${_DEPLOY_ENV}" != "uat" ]]; then
          exit 0
        fi
        pwm_provider="$(python3 - <<'PY'
        import json
        from pathlib import Path

        config = json.loads(Path("consent-protocol/config/managed-ai-runtime.json").read_text())
        print(config.get("pwm_research_uat", config["pwm_research"])["provider"])
        PY
        )"
        if [[ "${pwm_provider}" != "azure_openai_web_search" ]]; then
          exit 0
        fi
        if [[ "$PROJECT_ID" != "hushh-pda-uat" || "${_REGION}" != "us-central1" ||
              "${_CLOUD_RUN_NO_TRAFFIC}" != "true" ||
              "${_RUNTIME_SERVICE_ACCOUNT}" != "consent-protocol-runtime@hushh-pda-uat.iam.gserviceaccount.com" ||
              ! "${_IMAGE_REFERENCE}" =~ ^gcr\.io/hushh-pda-uat/consent-protocol@sha256:[0-9a-f]{64}$ ]]; then
          echo "Azure PWM UAT requires the exact no-traffic candidate image and runtime identity." >&2
          exit 1
        fi
        job_name="azure-pwm-${BUILD_ID}"
        # The execution-bound collector finalizer owns cleanup.
        gcloud run jobs deploy "${job_name}" \
          --project="$PROJECT_ID" --region="${_REGION}" \
          --image="${_IMAGE_REFERENCE}" \
          --service-account="${_RUNTIME_SERVICE_ACCOUNT}" \
          --clear-secrets \
          --command=python3 --args=scripts/verify_azure_pwm_runtime.py \
          --set-env-vars=ENVIRONMENT=uat \
          --cpu=2 --memory=2Gi --max-retries=0 --task-timeout=240s --quiet
        if ! gcloud run jobs execute "${job_name}" \
          --project="$PROJECT_ID" --region="${_REGION}" --wait --quiet; then
          echo "Azure PWM UAT runtime probe execution failed." >&2
          exit 1
        fi
        execution_name="$(gcloud run jobs executions list \
          --job="${job_name}" --project="$PROJECT_ID" --region="${_REGION}" \
          --limit=1 --sort-by='~metadata.creationTimestamp' \
          --format='value(metadata.name)')"
        if [[ -z "${execution_name}" ]]; then
          echo "Azure PWM UAT runtime probe execution is missing." >&2
          exit 1
        fi
        probe_entries=""
        for _attempt in 1 2 3 4 5 6; do
          probe_entries="$(gcloud logging read \
            "resource.type=cloud_run_job AND labels.\"run.googleapis.com/execution_name\"=\"${execution_name}\" AND (jsonPayload.azure_pwm_runtime_probe_result:* OR jsonPayload.azure_pwm_runtime_probe_stage=primary_http OR jsonPayload.azure_managed_text_contract:* OR textPayload:azure_managed_text_contract OR textPayload:azure_pwm_runtime_probe_result OR textPayload:primary_http)" \
            --project="$PROJECT_ID" --limit=10 --freshness=1h \
            --format=json 2>/dev/null || true)"
          if PROBE_ENTRIES="${probe_entries}" python3 - <<'PY'
        import json, os
        try:
            entries = json.loads(os.environ["PROBE_ENTRIES"])
            values = []
            for entry in entries:
                payload = entry.get("jsonPayload")
                if payload is None:
                    try:
                        payload = json.loads(entry.get("textPayload", ""))
                    except json.JSONDecodeError:
                        continue
                values.append(payload)
            terminal = any(isinstance(value, dict) and "azure_pwm_runtime_probe_result" in value for value in values)
            primary = any(isinstance(value, dict) and value.get("azure_pwm_runtime_probe_stage") == "primary_http" for value in values)
            managed = any(isinstance(value, dict) and value.get("azure_managed_text_contract") == "ok" for value in values)
            failed = any(isinstance(value, dict) and value.get("azure_pwm_runtime_probe_result") == "failed" for value in values)
            raise SystemExit(0 if failed or terminal and primary and managed else 1)
        except (ValueError, TypeError):
            raise SystemExit(1)
        PY
          then
            break
          fi
          sleep 5
        done
        PROBE_ENTRIES="${probe_entries}" python3 - <<'PY'
        import json
        import os

        try:
            entries = json.loads(os.environ["PROBE_ENTRIES"])
        except (KeyError, json.JSONDecodeError):
            raise SystemExit("Azure PWM UAT runtime probe verdict is missing") from None
        verdicts = []
        for entry in entries:
            payload = entry.get("jsonPayload")
            if payload is None and isinstance(entry.get("textPayload"), str):
                try:
                    payload = json.loads(entry["textPayload"])
                except json.JSONDecodeError:
                    continue
            verdicts.append(payload)
        if {"azure_pwm_runtime_probe_result": "ok"} not in verdicts:
            raise SystemExit("Azure PWM UAT runtime probe did not pass")
        primary = [item for item in verdicts if isinstance(item, dict)
            and item.get("azure_pwm_runtime_probe_stage") == "primary_http"
            and item.get("result") == "ok" and item.get("http_status") == 200]
        if len(primary) != 1:
            raise SystemExit("Azure primary HTTP200 structured receipt is missing")
        print(json.dumps({"azure_primary_structured_readiness": "ok", "http_status": 200,
            "deployment": primary[0]["deployment"]}))
        if not any(isinstance(item, dict) and item.get("azure_managed_text_contract") == "ok" and item.get("scopes") == 2 for item in verdicts):
            raise SystemExit("Shared Azure primary text contract receipt is missing")
        print(json.dumps({"azure_managed_text_contract": "ok", "scopes": 2}))
        PY
        echo "Azure PWM UAT runtime probe passed."
    allowFailure: true
    waitFor: ["deploy-backend"]
    env:
      - "READINESS_BUILD_ID=${BUILD_ID}"
      - "READINESS_SOURCE_SHA=${_DEPLOY_SHA}"
      - "READINESS_IMAGE=${_IMAGE_REFERENCE}"
      - "READINESS_RUNTIME_ACCOUNT=${_RUNTIME_SERVICE_ACCOUNT}"
      - "READINESS_PROJECT=${PROJECT_ID}"
      - "READINESS_REGION=${_REGION}"
      - "READINESS_GITHUB_RUN=${_GITHUB_RUN_ID}"
      - "READINESS_ENVIRONMENT=${_DEPLOY_ENV}"
      - "READINESS_SERVICE=${_BACKEND_SERVICE}"
      - "READINESS_TAG=${_CLOUD_RUN_TAG}"
      - "READINESS_LEGACY_EXCEPTION=${_SKIP_MANAGED_VERTEX_RUNTIME_FOR_RELEASE}"
    id: "verify-azure-pwm-runtime"

  # Candidate-image GenAI probe under the exact runtime identity. This runs
  # before the calling workflow can promote a no-traffic revision when the
  # operator explicitly opts in. Direct backend builds do not make paid model
  # calls by default; schema, authority, provenance and health gates still run.
  # The unique probe job emits a structured receipt to Cloud Logging. Its
  # execution-scoped lookup tolerates ingestion lag; missing receipts block.
  # Keep prose outside the bash arg because Cloud Build caps it at 10,000 chars.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        finish_provider_probe() {
          probe_status=$?
          trap - EXIT
          READINESS_STEP_EXIT="${probe_status}" python3 scripts/ci/managed_provider_readiness.py record --provider=vertex --job="${job_name:-}" || true
          if [[ -n "${job_name:-}" ]]; then
            gcloud run jobs delete "${job_name}" --project="$PROJECT_ID" --region="${_REGION}" --quiet >/dev/null 2>&1 || true
          fi
          exit "${probe_status}"
        }
        trap finish_provider_probe EXIT
        if [[ "${_SKIP_MANAGED_VERTEX_RUNTIME_FOR_RELEASE}" == "true" ]]; then
          echo "WARNING: user-authorized one-time UAT Vertex probe skip; managed Chat and Voice are unverified by this release gate."
          exit 0
        fi
        case "${_VERIFY_MANAGED_VERTEX_RUNTIME}" in
          true) probe_mode=full ;;
          false)
            echo "Skipping managed Vertex candidate probe: live model checks were not requested."
            exit 0
            ;;
          *)
            echo "_VERIFY_MANAGED_VERTEX_RUNTIME must be true or false." >&2
            exit 1
            ;;
        esac
        genai_project_id="${_GENAI_PROJECT_ID}"
        if [[ -z "${genai_project_id}" ]]; then
          genai_project_id="$PROJECT_ID"
          if [[ "${_DEPLOY_ENV}" == "dev" ]]; then
            genai_project_id="hushh-pda-uat"
          fi
        fi
        image_reference="${_IMAGE_REFERENCE}"
        if [[ -z "${image_reference}" ]]; then
          image_reference="gcr.io/$PROJECT_ID/consent-protocol:${_IMAGE_TAG}"
        fi
        job_name="genai-ready-${BUILD_ID}"
        # The execution-bound collector finalizer owns cleanup.
        gcloud run jobs deploy "${job_name}" \
          --project="$PROJECT_ID" \
          --region="${_REGION}" \
          --image="${image_reference}" \
          --service-account="${_RUNTIME_SERVICE_ACCOUNT}" \
          --clear-secrets \
          --command="python3" \
          --args="scripts/verify_managed_vertex_runtime.py" \
          --set-env-vars="^|^HUSHH_GENAI_AUTH_MODE=vertex_adc|GOOGLE_GENAI_USE_VERTEXAI=true|GOOGLE_CLOUD_PROJECT=${PROJECT_ID}|GENAI_GOOGLE_CLOUD_PROJECT=${genai_project_id}|HUSHH_ONE_CHAT_VERTEX_PROJECT=${_HUSHH_ONE_CHAT_VERTEX_PROJECT}|HUSHH_ONE_VOICE_VERTEX_PROJECT=${_HUSHH_ONE_VOICE_VERTEX_PROJECT}|HUSHH_MANAGED_VERTEX_PROBE_MODE=${probe_mode}|ENVIRONMENT=${_DEPLOY_ENV}|HUSSH_GEMINI_TEXT_MODEL=${_HUSSH_GEMINI_TEXT_MODEL}|ONE_VOICE_LIVE_ENABLED=${_ONE_VOICE_LIVE_ENABLED}|VERTEX_LIVE_MODEL_ID=${_VERTEX_LIVE_MODEL_ID}|VERTEX_LIVE_LOCATION=${_VERTEX_LIVE_LOCATION}" \
          --cpu=2 \
          --memory=2Gi \
          --max-retries=0 \
          --task-timeout=420s \
          --quiet
        set +e
        gcloud run jobs execute "${job_name}" \
          --project="$PROJECT_ID" \
          --region="${_REGION}" \
          --wait \
          --quiet
        execute_status=$?
        set -e
        execution_name="$(gcloud run jobs executions list \
          --job="${job_name}" \
          --project="$PROJECT_ID" \
          --region="${_REGION}" \
          --limit=1 \
          --sort-by='~metadata.creationTimestamp' \
          --format='value(metadata.name)' 2>/dev/null || true)"

        probe_line=""
        if [[ -n "${execution_name}" ]]; then
          for _attempt in 1 2 3 4 5 6; do
            probe_line="$(gcloud logging read \
              "resource.type=cloud_run_job AND labels.\"run.googleapis.com/execution_name\"=\"${execution_name}\" AND textPayload:managed_vertex_probe_result" \
              --project="$PROJECT_ID" \
              --limit=1 \
              --format='value(textPayload)' \
              --freshness=1h 2>/dev/null || true)"
            if [[ -n "${probe_line}" ]]; then
              break
            fi
            sleep 10
          done
        fi
        echo "Probe execution: ${execution_name:-unknown}"
        classification="$(
          PROBE_LINE="${probe_line}" python3 - <<'PY'
        import json
        import os

        line = os.environ.get("PROBE_LINE", "")
        marker = "managed_vertex_probe_result"
        payload = line.split(marker, 1)[1].strip() if marker in line else line
        try:
            verdict = json.loads(payload)
        except json.JSONDecodeError:
            print("")
        else:
            print(str(verdict.get("classification") or ""))
        PY
        )"

        azure_uat_resource_exhaustion=false
        if [[ "${_DEPLOY_ENV}" == "uat" && "$PROJECT_ID" == "hushh-pda-uat" &&
              "${_CLOUD_RUN_NO_TRAFFIC}" == "true" &&
              "${_DRIVE_REQUEST_SEMANTIC_MODEL_PROVIDER}" == "azure_openai" &&
              "${genai_project_id}" != "$PROJECT_ID" ]]; then
          pwm_provider="$(python3 - <<'PY'
        import json
        from pathlib import Path

        config = json.loads(Path("consent-protocol/config/managed-ai-runtime.json").read_text())
        print(config.get("pwm_research_uat", config["pwm_research"])["provider"])
        PY
          )"
          if [[ "${pwm_provider}" == "azure_openai_web_search" ]]; then
            azure_uat_resource_exhaustion=true
          fi
        fi

        if [[ "${_DEPLOY_ENV}" == "production" && "${_ONE_VOICE_LIVE_ENABLED}" == "true" ]]; then
          printf '%s\n' "${probe_line}" | python3 scripts/ci/assert_one_voice_live_probe.py \
            --model "${_VERTEX_LIVE_MODEL_ID}" \
            --location "${_VERTEX_LIVE_LOCATION}"
        fi
        if [[ -n "${_MANAGED_AI_CONFIG_HASH}" ]]; then
          PROBE_LINE="${probe_line}" EXPECTED_CONFIG_HASH="${_MANAGED_AI_CONFIG_HASH}" EXPECTED_CHAT_PROJECT="${_GENAI_PROJECT_ID}" AZURE_UAT_RESOURCE_EXHAUSTION="${azure_uat_resource_exhaustion}" python3 - <<'PY'
        import json
        import os

        line = os.environ.get("PROBE_LINE", "")
        marker = "managed_vertex_probe_result"
        try:
            verdict = json.loads(line.split(marker, 1)[1].strip())
        except (IndexError, json.JSONDecodeError):
            raise SystemExit("One chat Vertex readiness verdict is missing") from None
        if verdict.get("config_hash") != os.environ["EXPECTED_CONFIG_HASH"]:
            raise SystemExit("Candidate image managed AI profile does not match deployment")
        if verdict.get("one_chat_project") != os.environ["EXPECTED_CHAT_PROJECT"]:
            raise SystemExit("One chat Vertex target does not match deployment")
        if os.environ["AZURE_UAT_RESOURCE_EXHAUSTION"] != "true" and verdict.get("one_chat_probe_ok") is not True:
            raise SystemExit("One chat Vertex target did not pass its runtime-identity probe")
        PY
        fi
        if [[ "${_ONE_VOICE_LIVE_ENABLED}" == "true" ]]; then
          PROBE_LINE="${probe_line}" EXPECTED_VOICE_PROJECT="${_GENAI_PROJECT_ID}" EXPECTED_VOICE_MODEL="${_VERTEX_LIVE_MODEL_ID}" EXPECTED_VOICE_LOCATION="${_VERTEX_LIVE_LOCATION}" AZURE_UAT_RESOURCE_EXHAUSTION="${azure_uat_resource_exhaustion}" python3 - <<'PY'
        import json
        import os

        line = os.environ.get("PROBE_LINE", "")
        marker = "managed_vertex_probe_result"
        try:
            verdict = json.loads(line.split(marker, 1)[1].strip())
        except (IndexError, json.JSONDecodeError):
            raise SystemExit("One voice Vertex readiness verdict is missing") from None
        if (
            verdict.get("one_voice_project") != os.environ["EXPECTED_VOICE_PROJECT"]
            or verdict.get("live_model") != os.environ["EXPECTED_VOICE_MODEL"]
            or verdict.get("live_location") != os.environ["EXPECTED_VOICE_LOCATION"]
        ):
            raise SystemExit("One voice Vertex target does not match deployment")
        if os.environ["AZURE_UAT_RESOURCE_EXHAUSTION"] != "true" and verdict.get("one_voice_probe_ok") is not True:
            raise SystemExit("One voice Vertex target did not pass its runtime-identity probe")
        PY
        fi
        if [[ "${_DEPLOY_ENV}" == "uat" && "${genai_project_id}" != "$PROJECT_ID" ]]; then
          verdict_mode="$(PROBE_LINE="${probe_line}" EXECUTE_STATUS="${execute_status}" AZURE_UAT_RESOURCE_EXHAUSTION="${azure_uat_resource_exhaustion}" VOICE_ENABLED="${_ONE_VOICE_LIVE_ENABLED}" EXPECTED_CONFIG_HASH="${_MANAGED_AI_CONFIG_HASH}" EXPECTED_CHAT_PROJECT="${_GENAI_PROJECT_ID}" EXPECTED_VOICE_MODEL="${_VERTEX_LIVE_MODEL_ID}" EXPECTED_VOICE_LOCATION="${_VERTEX_LIVE_LOCATION}" python3 scripts/ci/assert_uat_managed_vertex_probe.py)"
          if [[ "${verdict_mode}" == "resource_exhausted" ]]; then
            echo "WARNING: UAT Azure Drive release proceeds with managed Vertex resource exhaustion. Vertex models remain unverified and may be unavailable."
            exit 0
          fi
        fi
        if [[ "${execute_status}" -eq 0 ]]; then
          echo "Managed Vertex candidate probe passed."
          exit 0
        fi

        if [[ "${classification}" == "provider_unavailable" ]]; then
          echo "::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::"
          echo "WARNING  Managed Vertex is UNAVAILABLE (provider-side)."
          echo "         The candidate image built and deployed correctly; the"
          echo "         provider refused every probe. Release CONTINUES in"
          echo "         degraded mode. Vertex-backed capabilities will not work"
          echo "         until the provider recovers."
          echo "         Probe verdict: ${probe_line}"
          echo "         NOTE: a provider denial is returned before model"
          echo "         validation, so this run did NOT clear the candidate's"
          echo "         model configuration. Re-probe once the provider is back."
          echo "::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::"
          exit 0
        fi

        echo "Managed Vertex candidate probe FAILED and the cause is not a provider outage." >&2
        if [[ -n "${probe_line}" ]]; then
          echo "Probe verdict: ${probe_line}" >&2
        else
          echo "No probe verdict was recoverable from the job logs; treating as blocking." >&2
        fi
        exit 1
    allowFailure: true
    waitFor: ["deploy-backend"]
    env:
      - "READINESS_BUILD_ID=${BUILD_ID}"
      - "READINESS_SOURCE_SHA=${_DEPLOY_SHA}"
      - "READINESS_IMAGE=${_IMAGE_REFERENCE}"
      - "READINESS_RUNTIME_ACCOUNT=${_RUNTIME_SERVICE_ACCOUNT}"
      - "READINESS_PROJECT=${PROJECT_ID}"
      - "READINESS_REGION=${_REGION}"
      - "READINESS_GITHUB_RUN=${_GITHUB_RUN_ID}"
      - "READINESS_ENVIRONMENT=${_DEPLOY_ENV}"
      - "READINESS_SERVICE=${_BACKEND_SERVICE}"
      - "READINESS_TAG=${_CLOUD_RUN_TAG}"
      - "READINESS_LEGACY_EXCEPTION=${_SKIP_MANAGED_VERTEX_RUNTIME_FOR_RELEASE}"
    id: "verify-managed-vertex-runtime"


  # The required aggregate admits a usable provider; both checks still run.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        python3 scripts/ci/managed_provider_readiness.py evaluate
        if [[ "${_DEPLOY_ENV}" == "uat" ]]; then
          python3 scripts/ci/managed_provider_readiness.py select
        fi
    waitFor: ["verify-azure-pwm-runtime", "verify-managed-vertex-runtime"]
    env:
      - "READINESS_BUILD_ID=${BUILD_ID}"
      - "READINESS_SOURCE_SHA=${_DEPLOY_SHA}"
      - "READINESS_IMAGE=${_IMAGE_REFERENCE}"
      - "READINESS_RUNTIME_ACCOUNT=${_RUNTIME_SERVICE_ACCOUNT}"
      - "READINESS_PROJECT=${PROJECT_ID}"
      - "READINESS_REGION=${_REGION}"
      - "READINESS_GITHUB_RUN=${_GITHUB_RUN_ID}"
      - "READINESS_ENVIRONMENT=${_DEPLOY_ENV}"
      - "READINESS_SERVICE=${_BACKEND_SERVICE}"
      - "READINESS_TAG=${_CLOUD_RUN_TAG}"
      - "READINESS_LEGACY_EXCEPTION=${_SKIP_MANAGED_VERTEX_RUNTIME_FOR_RELEASE}"
    id: "verify-managed-provider-readiness"

# NOTE: no top-level `images:` block — `docker buildx build --push` (Step 1) already
# pushes every tag. Listing images here would make Cloud Build try to re-push them from
# the local daemon, which is empty under the buildx docker-container driver, and fail.

# Build timeout: 1800s headroom for the one-time cold seeding build; cached builds are minutes.
timeout: "1800s"

