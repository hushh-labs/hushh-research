# Cloud Build configuration for Python FastAPI backend
# Deploy to: Cloud Run (service name configurable via substitutions)

steps:
  # Step 1: Build + push with a registry LAYER CACHE (buildx, mode=max).
  #
  # Why: Cloud Build workers are ephemeral, so a plain `docker build` starts with an
  # empty cache every run and reinstalls all ~159 pinned deps from scratch (20-35 min).
  # buildx `--cache-to type=registry,mode=max` exports EVERY stage's layers (incl. the
  # builder's `uv pip install` layer) to `:buildcache`; `--cache-from` restores them on
  # the next run. Because the Dockerfile copies requirements.txt before the app source,
  # an unchanged requirements.txt turns the dependency install into a cache HIT, so a
  # code-only deploy drops to a couple of minutes.
  #
  # NOTE: the FIRST build after this lands is still cold — it seeds `:buildcache`.
  # The payoff shows on the next backend deploy.
  - name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        # The build context is `consent-protocol`, but the generated contracts tree
        # lives at the REPO ROOT. Stage it into the context so `COPY . .` lands it at
        # /app/contracts. Without this the action gateway, the route-orchestration
        # index and One's persona catalogue all resolve a path that does not exist in
        # the image and degrade SILENTLY to empty. See hushh_mcp/contracts_root.py.
        rm -rf consent-protocol/contracts
        cp -R contracts consent-protocol/contracts
        # Ensure gcr.io auth is available to the buildx container driver.
        gcloud auth configure-docker gcr.io --quiet || true
        docker buildx create --use --name hushh-builder --driver docker-container \
          >/dev/null 2>&1 || docker buildx use hushh-builder
        docker buildx build \
          --cache-from=type=registry,ref=gcr.io/$PROJECT_ID/consent-protocol:buildcache \
          --cache-to=type=registry,ref=gcr.io/$PROJECT_ID/consent-protocol:buildcache,mode=max \
          --tag gcr.io/$PROJECT_ID/consent-protocol:manual \
          --tag gcr.io/$PROJECT_ID/consent-protocol:latest \
          --tag gcr.io/$PROJECT_ID/consent-protocol:${_IMAGE_TAG} \
          --file consent-protocol/Dockerfile \
          --push \
          consent-protocol
    id: "build-backend-image"

  # Step 2: Build + push the SLIM POD image (dev only).
  #
  # Why this lives here and not in the workflow: the workflow definition runs from
  # `main`, but `gcloud builds submit --config=deploy/backend.cloudbuild.yaml` reads
  # THIS file from the deployed SHA (the workflow detaches to it before this step).
  # That is the same skew the substitution guard in deploy-dev.yml exists for. So a
  # pod-image build added here ships with the branch that needs it, and `main` is
  # unaffected until this file is merged.
  #
  # Blast radius is therefore exactly "dev deploys of the SHA carrying this file".
  # Other branches deploy their own copy of this template and never build a pod.
  #
  # Two independent conditions, both exact-equality (never a prefix/substring test —
  # a `startswith` on env names is the class of bug that fires in production):
  #   _DEPLOY_ENV == dev      -> uat/prod pass a different value and cannot reach this
  #   _BUILD_POD_IMAGE == true -> the kill-switch, so the step can be turned off
  #                               without reverting the file
  #
  # The image shares requirements.txt and the python:3.13-slim base with the hub
  # image above; what differs is the runtime surface (pod_server:app mounts an
  # allowlist of routers, no fleet workers) and HUSSH_POD_MODE=1. See Dockerfile.pod.
  - name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        if [[ "${_DEPLOY_ENV}" != "dev" ]]; then
          echo "pod image: skipped (deploy env '${_DEPLOY_ENV}' is not 'dev')"
          exit 0
        fi
        if [[ "${_BUILD_POD_IMAGE}" != "true" ]]; then
          echo "pod image: skipped (_BUILD_POD_IMAGE='${_BUILD_POD_IMAGE}')"
          exit 0
        fi
        # Same contracts staging as the hub image above -- a pod runs the same agent
        # code and reads the same generated contracts.
        rm -rf consent-protocol/contracts
        cp -R contracts consent-protocol/contracts
        gcloud auth configure-docker gcr.io --quiet || true
        docker buildx create --use --name hushh-builder --driver docker-container \
          >/dev/null 2>&1 || docker buildx use hushh-builder
        docker buildx build \
          --cache-from=type=registry,ref=gcr.io/$PROJECT_ID/consent-protocol-pod:buildcache \
          --cache-to=type=registry,ref=gcr.io/$PROJECT_ID/consent-protocol-pod:buildcache,mode=max \
          --tag gcr.io/$PROJECT_ID/consent-protocol-pod:latest \
          --tag gcr.io/$PROJECT_ID/consent-protocol-pod:${_IMAGE_TAG} \
          --file consent-protocol/Dockerfile.pod \
          --push \
          consent-protocol
    id: "build-pod-image"

  # Step 3: Deploy to Cloud Run
  #
  # WHY THE BODY LIVES IN A SCRIPT: Cloud Build caps a single build-step arg at
  # 10,000 characters, and this step's whole bash body used to be one arg. It
  # breached that cap twice in eight days -- 363a9932d (2026-07-28) and PR #4791
  # (2026-08-04) -- taking the UAT and dev deploy lanes down both times.
  # Substitutions are applied BEFORE the cap is enforced, so lanes differ: at
  # ba39d0342 the same body measured 10,282 for UAT and 10,208 for dev (both
  # over) but 8,937 for production (under), which is why nothing surfaced it.
  # Moving the body into scripts/deploy/backend-deploy.sh removes the ceiling
  # rather than buying headroom under it. The guard stays in
  # consent-protocol/tests/test_cloudbuild_step_arg_limit.py.
  #
  # Apple Wallet pass signing material (WALLET_PASS_CERT_PEM / KEY_PEM /
  # WWDR_PEM) is optional by construction: until the Pass Type ID certificate
  # is minted these secrets do not exist, so add_secret skips them
  # and the signing service answers 503 instead of 500. They are defaulted to
  # their canonical names so the first deploy after provisioning picks them up
  # with no change to this file.
  #
  # Runtime identity may differ from deploy identity: the dev environment
  # deploys with _DEPLOY_ENV=dev (labels, provenance) but runs with
  # ENVIRONMENT=uat so behavior gates replicate UAT exactly.
  #
  # env_var_string joins with '|' (not ',') so env VALUES may themselves
  # contain commas. Paired with gcloud's alternate-delimiter syntax on
  # --set-env-vars in the script.
  #
  # Timeout 3600s: WebSocket voice sessions (/api/one/adk/live) are long-lived
  # HTTP requests on Cloud Run; the previous 300s hard-killed any voice
  # conversation at 5 minutes. Session affinity is best-effort per Google's
  # WebSocket guidance; reconnects still re-mint a relay ticket, and
  # cross-instance nonce single-use is Postgres-backed (migration 084). Billing
  # note: instances with open WebSockets stay active for the connection's
  # lifetime.
  #
  # --max/--min: service-level limits bound aggregate database fan-out across
  # traffic splits. Revision min-instances=0 prevents no-traffic/retired
  # revisions from pinning their own warm database pools.
  # Step 3a: Validate the runtime identity + managed-Vertex IAM prerequisites.
  # Split out of the deploy step: Cloud Build caps one step arg at 10,000 chars
  # and the deploy body was 142 over after the INTELLIGENCE_* secret wiring.
  # A separate step gets its own budget; failure here stops the build the same way.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "bash"
    args:
      - "scripts/deploy/backend-deploy.sh"
    # Every value the script reads. Cloud Build substitutes these HERE (in the
    # config), not in the file -- and keeping the literal ${_FOO} tokens in this
    # YAML is what keeps deploy-dev.yml's skew guard working. See the script header.
    env:
      - "PROJECT_ID=$PROJECT_ID"
      - "_APP_FRONTEND_ORIGIN_SECRET=${_APP_FRONTEND_ORIGIN_SECRET}"
      - "_APP_REVIEW_MODE=${_APP_REVIEW_MODE}"
      - "_APP_SIGNING_KEY_SECRET=${_APP_SIGNING_KEY_SECRET}"
      - "_BACKEND_RUNTIME_CONFIG_JSON_SECRET=${_BACKEND_RUNTIME_CONFIG_JSON_SECRET}"
      - "_BACKEND_SERVICE=${_BACKEND_SERVICE}"
      - "_BUILD_POD_IMAGE=${_BUILD_POD_IMAGE}"
      - "_CLOUDSQL_INSTANCES=${_CLOUDSQL_INSTANCES}"
      - "_CLOUD_RUN_MAX_INSTANCES=${_CLOUD_RUN_MAX_INSTANCES}"
      - "_CLOUD_RUN_MIN_INSTANCES=${_CLOUD_RUN_MIN_INSTANCES}"
      - "_CLOUD_RUN_NO_TRAFFIC=${_CLOUD_RUN_NO_TRAFFIC}"
      - "_CONSENT_API_PUBLIC_ORIGIN=${_CONSENT_API_PUBLIC_ORIGIN}"
      - "_DB_POOL_MAX_SIZE=${_DB_POOL_MAX_SIZE}"
      - "_DB_POOL_MIN_SIZE=${_DB_POOL_MIN_SIZE}"
      - "_DB_SQLALCHEMY_MAX_OVERFLOW=${_DB_SQLALCHEMY_MAX_OVERFLOW}"
      - "_DB_SQLALCHEMY_POOL_SIZE=${_DB_SQLALCHEMY_POOL_SIZE}"
      - "_DEPLOY_ENV=${_DEPLOY_ENV}"
      - "_DEPLOY_SHA=${_DEPLOY_SHA}"
      - "_DEPLOY_SOURCE=${_DEPLOY_SOURCE}"
      - "_FINNHUB_API_KEY_SECRET=${_FINNHUB_API_KEY_SECRET}"
      - "_FIREBASE_ADMIN_CREDENTIALS_SECRET=${_FIREBASE_ADMIN_CREDENTIALS_SECRET}"
      - "_GENAI_PROJECT_ID=${_GENAI_PROJECT_ID}"
      - "_GITHUB_RUN_ID=${_GITHUB_RUN_ID}"
      - "_GMAIL_OAUTH_CLIENT_ID_SECRET=${_GMAIL_OAUTH_CLIENT_ID_SECRET}"
      - "_GMAIL_OAUTH_CLIENT_SECRET_SECRET=${_GMAIL_OAUTH_CLIENT_SECRET_SECRET}"
      - "_GMAIL_OAUTH_REDIRECT_URI_SECRET=${_GMAIL_OAUTH_REDIRECT_URI_SECRET}"
      - "_GMAIL_OAUTH_TOKEN_KEY_SECRET=${_GMAIL_OAUTH_TOKEN_KEY_SECRET}"
      - "_GOOGLE_OAUTH_CLIENT_ID_SECRET=${_GOOGLE_OAUTH_CLIENT_ID_SECRET}"
      - "_GOOGLE_OAUTH_CLIENT_SECRET_SECRET=${_GOOGLE_OAUTH_CLIENT_SECRET_SECRET}"
      - "_GOOGLE_OAUTH_REDIRECT_URI_SECRET=${_GOOGLE_OAUTH_REDIRECT_URI_SECRET}"
      - "_GOOGLE_OAUTH_TOKEN_KEY_SECRET=${_GOOGLE_OAUTH_TOKEN_KEY_SECRET}"
      - "_GOOGLE_MAPS_API_KEY_SECRET=${_GOOGLE_MAPS_API_KEY_SECRET}"
      - "_HUSHH_DEVELOPER_TOKEN_SECRET=${_HUSHH_DEVELOPER_TOKEN_SECRET}"
      - "_HUSHH_PROD_PHONE_TEST_CHALLENGE_SECRET_SECRET=${_HUSHH_PROD_PHONE_TEST_CHALLENGE_SECRET_SECRET}"
      - "_HUSHH_PROD_PHONE_TEST_CODE_SECRET=${_HUSHH_PROD_PHONE_TEST_CODE_SECRET}"
      - "_HUSHH_PROD_PHONE_TEST_ENABLED=${_HUSHH_PROD_PHONE_TEST_ENABLED}"
      - "_HUSHH_PROD_PHONE_TEST_NUMBERS_SECRET=${_HUSHH_PROD_PHONE_TEST_NUMBERS_SECRET}"
      - "_HUSHH_UAT_PHONE_TEST_CHALLENGE_SECRET_SECRET=${_HUSHH_UAT_PHONE_TEST_CHALLENGE_SECRET_SECRET}"
      - "_HUSHH_UAT_PHONE_TEST_CODE_SECRET=${_HUSHH_UAT_PHONE_TEST_CODE_SECRET}"
      - "_HUSHH_UAT_PHONE_TEST_NUMBERS_SECRET=${_HUSHH_UAT_PHONE_TEST_NUMBERS_SECRET}"
      - "_IMAGE_TAG=${_IMAGE_TAG}"
