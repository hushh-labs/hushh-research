      - "_INTELLIGENCE_API_KEY_SECRET=${_INTELLIGENCE_API_KEY_SECRET}"
      - "_SUPPORT_EMAIL_TEST_TO_SECRET=${_SUPPORT_EMAIL_TEST_TO_SECRET}"
      - "_SUPPORT_EMAIL_MODE_SECRET=${_SUPPORT_EMAIL_MODE_SECRET}"
      - "_SUPPORT_EMAIL_DELEGATED_USER_SECRET=${_SUPPORT_EMAIL_DELEGATED_USER_SECRET}"
      - "_SUPPORT_EMAIL_FROM_SECRET=${_SUPPORT_EMAIL_FROM_SECRET}"
      - "_GOOGLE_SERVICE_ACCOUNT_EMAIL_SECRET=${_GOOGLE_SERVICE_ACCOUNT_EMAIL_SECRET}"
      - "_GOOGLE_PRIVATE_KEY_SECRET=${_GOOGLE_PRIVATE_KEY_SECRET}"
      - "_RIA_CLAIM_TEST_EMAILS_SECRET=${_RIA_CLAIM_TEST_EMAILS_SECRET}"
    id: "deploy-backend"

  # Candidate-image GenAI probe under the exact runtime identity. This runs
  # before the calling workflow can promote a no-traffic revision when the
  # change-aware verification plan selects it. Direct backend builds retain the
  # conservative default of running this probe.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        case "${_VERIFY_MANAGED_VERTEX_RUNTIME}" in
          true) ;;
          false)
            echo "Skipping managed Vertex candidate probe: not selected by the verification plan."
            exit 0
            ;;
          *)
            echo "_VERIFY_MANAGED_VERTEX_RUNTIME must be true or false." >&2
            exit 1
            ;;
        esac
        genai_project_id="${_GENAI_PROJECT_ID}"
        if [[ -z "${genai_project_id}" ]]; then
          genai_project_id="$PROJECT_ID"
          if [[ "${_DEPLOY_ENV}" == "dev" ]]; then
            genai_project_id="hushh-pda-uat"
          fi
        fi
        job_name="${_BACKEND_SERVICE}-genai-readiness"
        gcloud run jobs deploy "${job_name}" \
          --project="$PROJECT_ID" \
          --region="${_REGION}" \
          --image="gcr.io/$PROJECT_ID/consent-protocol:${_IMAGE_TAG}" \
          --service-account="${_RUNTIME_SERVICE_ACCOUNT}" \
          --command="python" \
          --args="scripts/verify_managed_vertex_runtime.py" \
          --set-env-vars="^|^HUSHH_GENAI_AUTH_MODE=vertex_adc|GOOGLE_GENAI_USE_VERTEXAI=true|GOOGLE_CLOUD_PROJECT=${genai_project_id}|GOOGLE_CLOUD_LOCATION=global|HUSHH_VERTEX_LOCATIONS=global,us,eu|AGENT_ONE_ADK_LOCATION=us-central1" \
          --max-retries=0 \
          --task-timeout=90s \
          --quiet
        if gcloud run jobs execute "${job_name}" \
          --project="$PROJECT_ID" \
          --region="${_REGION}" \
          --wait \
          --quiet; then
          echo "Managed Vertex candidate probe: PASSED."
        else
          # Dev-lane ADVISORY, founder-directed (2026-08-20). Dev's managed fleet
          # binding deliberately rides UAT's Vertex project, so an upstream
          # failure THERE (observed: billing dunning denying GenAI) blocks every
          # dev release -- including releases whose whole point is the BYOC path,
          # which never touches the fleet binding. On dev the probe failure is
          # reported loudly and the release proceeds; the managed-Gemini surface
          # on dev is degraded until the fleet binding heals and this line says
          # so in every build log. UAT and production remain fail-closed.
          if [[ "${_DEPLOY_ENV}" == "dev" ]]; then
            echo "###############################################################"
            echo "# ADVISORY: managed Vertex probe FAILED on the dev lane.       #"
            echo "# Managed-Gemini generation on dev is NOT verified. BYOC pods  #"
            echo "# (user_adc) are unaffected. Fix the fleet Vertex project      #"
            echo "# (billing/dunning?) to restore managed AI on dev.             #"
            echo "###############################################################"
            exit 0
          fi
          echo "Managed Vertex candidate probe FAILED; refusing the release." >&2
          exit 1
        fi
    id: "verify-managed-vertex-runtime"

# NOTE: no top-level `images:` block — `docker buildx build --push` (Step 1) already
# pushes every tag. Listing images here would make Cloud Build try to re-push them from
# the local daemon, which is empty under the buildx docker-container driver, and fail.

# Build timeout: 1800s headroom for the one-time cold seeding build; cached builds are minutes.
timeout: "1800s"

