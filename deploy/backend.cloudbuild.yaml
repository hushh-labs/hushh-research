# Cloud Build configuration for Python FastAPI backend
# Deploy to: Cloud Run (service name configurable via substitutions)

steps:
  # Step 1: Build + push with a registry LAYER CACHE (buildx, mode=max).
  #
  # Why: Cloud Build workers are ephemeral, so a plain `docker build` starts with an
  # empty cache every run and reinstalls all ~159 pinned deps from scratch (20-35 min).
  # buildx `--cache-to type=registry,mode=max` exports EVERY stage's layers (incl. the
  # builder's `uv pip install` layer) to `:buildcache`; `--cache-from` restores them on
  # the next run. Because the Dockerfile copies requirements.txt before the app source,
  # an unchanged requirements.txt turns the dependency install into a cache HIT, so a
  # code-only deploy drops to a couple of minutes.
  #
  # NOTE: the FIRST build after this lands is still cold — it seeds `:buildcache`.
  # The payoff shows on the next backend deploy.
  - name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        gcloud auth configure-docker gcr.io --quiet || true
        docker buildx create --use --name hushh-builder --driver docker-container \
          >/dev/null 2>&1 || docker buildx use hushh-builder
        docker buildx build \
          --cache-from=type=registry,ref=gcr.io/$PROJECT_ID/consent-protocol:buildcache \
          --cache-to=type=registry,ref=gcr.io/$PROJECT_ID/consent-protocol:buildcache,mode=max \
          --tag gcr.io/$PROJECT_ID/consent-protocol:manual \
          --tag gcr.io/$PROJECT_ID/consent-protocol:latest \
          --tag gcr.io/$PROJECT_ID/consent-protocol:${_IMAGE_TAG} \
          --file consent-protocol/Dockerfile \
          --push \
          consent-protocol
    id: "build-backend-image"

  # Step 3: Deploy to Cloud Run
  #
  # NOTE ON COMMENTS IN THIS STEP: Cloud Build caps a single build-step arg at
  # 10,000 characters, and this step's whole bash body is one arg. Comments
  # placed *inside* the body count against that cap; comments here do not.
  # Keep explanatory prose at this level. See
  # consent-protocol/tests/test_cloudbuild_step_arg_limit.py for the CI guard.
  #
  # Apple Wallet pass signing material (WALLET_PASS_CERT_PEM / KEY_PEM /
  # WWDR_PEM) is optional by construction: until the Pass Type ID certificate
  # is minted these secrets do not exist, so add_secret skips them
  # and the signing service answers 503 instead of 500. They are defaulted to
  # their canonical names so the first deploy after provisioning picks them up
  # with no change to this file.
  #
  # Runtime identity may differ from deploy identity: the dev environment
  # deploys with _DEPLOY_ENV=dev (labels, provenance) but runs with
  # ENVIRONMENT=uat so behavior gates replicate UAT exactly.
  #
  # env_var_string joins with '|' (not ',') so env VALUES may themselves
  # contain commas. Paired with gcloud's alternate-delimiter syntax on
  # --set-env-vars below.
  #
  # Timeout 3600s: WebSocket voice sessions (/api/one/adk/live) are long-lived
  # HTTP requests on Cloud Run; the previous 300s hard-killed any voice
  # conversation at 5 minutes. Session affinity is best-effort per Google's
  # WebSocket guidance; reconnects still re-mint a relay ticket, and
  # cross-instance nonce single-use is Postgres-backed (migration 084). Billing
  # note: instances with open WebSockets stay active for the connection's
  # lifetime.
  #
  # --max/--min: service-level limits bound aggregate database fan-out across
  # traffic splits. Revision min-instances=0 prevents no-traffic/retired
  # revisions from pinning their own warm database pools.
  # Step 3a: Validate the runtime identity + managed-Vertex IAM prerequisites.
  # Split out of the deploy step: Cloud Build caps one step arg at 10,000 chars
  # and the deploy body was 142 over after the INTELLIGENCE_* secret wiring.
  # A separate step gets its own budget; failure here stops the build the same way.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        if [[ -z "${_RUNTIME_SERVICE_ACCOUNT}" ]]; then
          echo "_RUNTIME_SERVICE_ACCOUNT is required." >&2
          exit 1
        fi
        if [[ "${_RUNTIME_SERVICE_ACCOUNT}" != *"@${PROJECT_ID}.iam.gserviceaccount.com" ]]; then
          echo "Runtime service account must belong to ${PROJECT_ID}; got '${_RUNTIME_SERVICE_ACCOUNT}'." >&2
          exit 1
        fi
        genai_project_id="${_GENAI_PROJECT_ID}"
        if [[ -z "${genai_project_id}" ]]; then
          genai_project_id="$PROJECT_ID"
          if [[ "${_DEPLOY_ENV}" == "dev" ]]; then
            genai_project_id="hushh-pda-uat"
          fi
        fi
        if [[ "${genai_project_id}" != "$PROJECT_ID" && "${_DEPLOY_ENV}" != "dev" ]]; then
          echo "Cross-project managed Vertex is allowed only for the isolated dev lane." >&2
          exit 1
        fi
        gcloud iam service-accounts describe "${_RUNTIME_SERVICE_ACCOUNT}" \
          --project="$PROJECT_ID" >/dev/null
        vertex_api_name="$(gcloud services list --enabled \
          --project="${genai_project_id}" \
          --filter='config.name=aiplatform.googleapis.com' \
          --format='value(config.name)' | head -n 1)"
        if [[ "${vertex_api_name}" != "aiplatform.googleapis.com" ]]; then
          echo "Vertex AI API must be enabled in ${genai_project_id}." >&2
          exit 1
        fi
        runtime_vertex_role="$(gcloud projects get-iam-policy "${genai_project_id}" \
          --flatten='bindings[].members' \
          --filter="bindings.role=roles/aiplatform.user AND bindings.members=serviceAccount:${_RUNTIME_SERVICE_ACCOUNT}" \
          --format='value(bindings.role)' | head -n 1)"
        if [[ "${runtime_vertex_role}" != "roles/aiplatform.user" ]]; then
          echo "${_RUNTIME_SERVICE_ACCOUNT} must have roles/aiplatform.user in ${genai_project_id}." >&2
          exit 1
        fi
        if [[ "${genai_project_id}" != "$PROJECT_ID" ]]; then
          runtime_service_usage_role="$(gcloud projects get-iam-policy "${genai_project_id}" \
            --flatten='bindings[].members' \
            --filter="bindings.role=roles/serviceusage.serviceUsageConsumer AND bindings.members=serviceAccount:${_RUNTIME_SERVICE_ACCOUNT}" \
            --format='value(bindings.role)' | head -n 1)"
          if [[ "${runtime_service_usage_role}" != "roles/serviceusage.serviceUsageConsumer" ]]; then
            echo "${_RUNTIME_SERVICE_ACCOUNT} must have roles/serviceusage.serviceUsageConsumer in ${genai_project_id}." >&2
            exit 1
          fi
        fi
    id: "verify-runtime-iam"

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        genai_project_id="${_GENAI_PROJECT_ID}"
        if [[ -z "${genai_project_id}" ]]; then
          genai_project_id="$PROJECT_ID"
          if [[ "${_DEPLOY_ENV}" == "dev" ]]; then
            genai_project_id="hushh-pda-uat"
          fi
        fi
        if [[ "${genai_project_id}" != "$PROJECT_ID" && "${_DEPLOY_ENV}" != "dev" ]]; then
          echo "Cross-project managed Vertex is allowed only for the isolated dev lane." >&2
          exit 1
        fi
        add_secret() {
          local secret_name="$1"
          local env_name="$2"
          if [[ -z "${secret_name}" ]]; then
            return
          fi
          if gcloud secrets describe "${secret_name}" --project="$PROJECT_ID" >/dev/null 2>&1; then
            secrets="${secrets},${env_name}=${secret_name}:latest"
          else
            echo "Skipping optional secret ${secret_name}; not found in project ${PROJECT_ID}."
          fi
        }

        secrets="APP_SIGNING_KEY=${_APP_SIGNING_KEY_SECRET}:latest,VAULT_DATA_KEY=${_VAULT_DATA_KEY_SECRET}:latest,FIREBASE_ADMIN_CREDENTIALS_JSON=${_FIREBASE_ADMIN_CREDENTIALS_SECRET}:latest,APP_FRONTEND_ORIGIN=${_APP_FRONTEND_ORIGIN_SECRET}:latest,BACKEND_RUNTIME_CONFIG_JSON=${_BACKEND_RUNTIME_CONFIG_JSON_SECRET}:latest,DB_USER=DB_USER:latest,DB_PASSWORD=DB_PASSWORD:latest"
        if [[ -n "${_PLAID_CLIENT_ID_SECRET}" ]]; then
          secrets="${secrets},PLAID_CLIENT_ID=${_PLAID_CLIENT_ID_SECRET}:latest"
        fi
        if [[ -n "${_PLAID_SECRET_SECRET}" ]]; then
          secrets="${secrets},PLAID_SECRET=${_PLAID_SECRET_SECRET}:latest"
        fi
        if [[ -n "${_PLAID_ACCESS_TOKEN_KEY_SECRET}" ]]; then
          secrets="${secrets},PLAID_ACCESS_TOKEN_KEY=${_PLAID_ACCESS_TOKEN_KEY_SECRET}:latest"
        fi
        add_secret "${_FINNHUB_API_KEY_SECRET}" "FINNHUB_API_KEY"
        add_secret "${_PMP_API_KEY_SECRET}" "PMP_API_KEY"
        add_secret "${_NEWSAPI_KEY_SECRET}" "NEWSAPI_KEY"
        add_secret "${_GMAIL_OAUTH_CLIENT_ID_SECRET}" "GMAIL_OAUTH_CLIENT_ID"
        add_secret "${_GMAIL_OAUTH_CLIENT_SECRET_SECRET}" "GMAIL_OAUTH_CLIENT_SECRET"
        add_secret "${_GMAIL_OAUTH_REDIRECT_URI_SECRET}" "GMAIL_OAUTH_REDIRECT_URI"
        add_secret "${_GMAIL_OAUTH_TOKEN_KEY_SECRET}" "GMAIL_OAUTH_TOKEN_KEY"
        add_secret "${_GOOGLE_OAUTH_CLIENT_ID_SECRET}" "GOOGLE_OAUTH_CLIENT_ID"
        add_secret "${_GOOGLE_OAUTH_CLIENT_SECRET_SECRET}" "GOOGLE_OAUTH_CLIENT_SECRET"
        add_secret "${_GOOGLE_OAUTH_REDIRECT_URI_SECRET}" "GOOGLE_OAUTH_REDIRECT_URI"
        add_secret "${_GOOGLE_OAUTH_TOKEN_KEY_SECRET}" "GOOGLE_OAUTH_TOKEN_KEY"
        add_secret "${_OPENAI_API_KEY_SECRET}" "OPENAI_API_KEY"
        add_secret "${_GOOGLE_MAPS_API_KEY_SECRET}" "GOOGLE_MAPS_API_KEY"
        add_secret ADVISORS_API_KEY ADVISORS_API_KEY
        add_secret INSURANCE_AGENTS_API_KEY INSURANCE_AGENTS_API_KEY
        add_secret NWS_NEARBY_API_KEY NWS_NEARBY_API_KEY
        add_secret NWS_NEARBY_V4_API_KEY NWS_NEARBY_V4_API_KEY
        add_secret NWS_NEARBY_V4_ACTOR_HMAC_KEY NWS_NEARBY_V4_ACTOR_HMAC_KEY
        add_secret "${_VOICE_RUNTIME_CONFIG_JSON_SECRET}" "VOICE_RUNTIME_CONFIG_JSON"
        add_secret "${_OMNIGATEWAY_CLIENT_ID_SECRET}" "OMNIGATEWAY_CLIENT_ID"
        add_secret "${_OMNIGATEWAY_CLIENT_SECRET_SECRET}" "OMNIGATEWAY_CLIENT_SECRET"
        add_secret "${_OMNIGATEWAY_EXT_CRM_CLIENT_ID_SECRET}" "OMNIGATEWAY_EXT_CRM_CLIENT_ID"
        add_secret "${_OMNIGATEWAY_EXT_CRM_CLIENT_SECRET_SECRET}" "OMNIGATEWAY_EXT_CRM_CLIENT_SECRET"
        add_secret "${_HUSHH_DEVELOPER_TOKEN_SECRET}" "HUSHH_DEVELOPER_TOKEN"
        add_secret "${_HUSHH_UAT_PHONE_TEST_NUMBERS_SECRET}" "HUSHH_UAT_PHONE_TEST_NUMBERS"
        add_secret "${_HUSHH_UAT_PHONE_TEST_CODE_SECRET}" "HUSHH_UAT_PHONE_TEST_CODE"
        add_secret "${_HUSHH_UAT_PHONE_TEST_CHALLENGE_SECRET_SECRET}" "HUSHH_UAT_PHONE_TEST_CHALLENGE_SECRET"
        add_secret "${_HUSHH_PROD_PHONE_TEST_NUMBERS_SECRET}" "HUSHH_PROD_PHONE_TEST_NUMBERS"
        add_secret "${_HUSHH_PROD_PHONE_TEST_CODE_SECRET}" "HUSHH_PROD_PHONE_TEST_CODE"
        add_secret "${_HUSHH_PROD_PHONE_TEST_CHALLENGE_SECRET_SECRET}" "HUSHH_PROD_PHONE_TEST_CHALLENGE_SECRET"
        add_secret "${_REVIEWER_UID_SECRET}" "REVIEWER_UID"
        add_secret "${_REVIEWER_VAULT_PASSPHRASE_SECRET}" "REVIEWER_VAULT_PASSPHRASE"
        add_secret "${_RIA_INTELLIGENCE_VERIFY_BASE_URL_SECRET}" "RIA_INTELLIGENCE_VERIFY_BASE_URL"
        add_secret "${_RIA_IDENTITY_BASE_URL_SECRET}" "RIA_IDENTITY_BASE_URL"
        add_secret "${_RIA_IDENTITY_API_KEY_SECRET}" "RIA_IDENTITY_API_KEY"
        add_secret "${_INTELLIGENCE_API_BASE_URL_SECRET}" "INTELLIGENCE_API_BASE_URL"
        add_secret "${_INTELLIGENCE_API_KEY_SECRET}" "INTELLIGENCE_API_KEY"
        add_secret "${_SUPPORT_EMAIL_TEST_TO_SECRET}" "SUPPORT_EMAIL_TEST_TO"
        add_secret "${_SUPPORT_EMAIL_MODE_SECRET}" "SUPPORT_EMAIL_MODE"
        add_secret "${_SUPPORT_EMAIL_DELEGATED_USER_SECRET}" "SUPPORT_EMAIL_DELEGATED_USER"
        add_secret "${_SUPPORT_EMAIL_FROM_SECRET}" "SUPPORT_EMAIL_FROM"
        add_secret "${_GOOGLE_SERVICE_ACCOUNT_EMAIL_SECRET}" "GOOGLE_SERVICE_ACCOUNT_EMAIL"
        add_secret "${_GOOGLE_PRIVATE_KEY_SECRET}" "GOOGLE_PRIVATE_KEY"
        add_secret "${_RIA_CLAIM_TEST_NUMBERS_SECRET}" "RIA_CLAIM_TEST_NUMBERS"
        add_secret "${_RIA_CLAIM_TEST_CODE_SECRET}" "RIA_CLAIM_TEST_CODE"
        add_secret "${_RIA_CLAIM_TEST_EMAILS_SECRET}" "RIA_CLAIM_TEST_EMAILS"
        add_secret "${_ONE_EMAIL_WATCH_RENEW_TOKEN_SECRET}" "ONE_EMAIL_WATCH_RENEW_TOKEN"
        add_secret "${_WALLET_PASS_CERT_PEM_SECRET}" "WALLET_PASS_CERT_PEM"
        add_secret "${_WALLET_PASS_KEY_PEM_SECRET}" "WALLET_PASS_KEY_PEM"
        add_secret "${_WALLET_PASS_WWDR_PEM_SECRET}" "WALLET_PASS_WWDR_PEM"
        add_secret "${_WALLET_API_KEY_SECRET}" "WALLET_API_KEY"

        runtime_environment="${_RUNTIME_ENVIRONMENT}"
        if [[ -z "${runtime_environment}" ]]; then
          runtime_environment="${_DEPLOY_ENV}"
        fi

        require_non_negative_int() {
          local name="$1"
          local value="$2"
          if ! [[ "${value}" =~ ^[0-9]+$ ]]; then
            echo "${name} must be a non-negative integer, got '${value}'." >&2
            exit 1
          fi
        }
        require_positive_int() {
          local name="$1"
          local value="$2"
          require_non_negative_int "${name}" "${value}"
          if [[ "${value}" -lt 1 ]]; then
            echo "${name} must be at least 1, got '${value}'." >&2
            exit 1
          fi
        }
        require_non_negative_int "_DB_POOL_MIN_SIZE" "${_DB_POOL_MIN_SIZE}"
        require_positive_int "_DB_POOL_MAX_SIZE" "${_DB_POOL_MAX_SIZE}"
        require_positive_int "_DB_SQLALCHEMY_POOL_SIZE" "${_DB_SQLALCHEMY_POOL_SIZE}"
        require_non_negative_int "_DB_SQLALCHEMY_MAX_OVERFLOW" "${_DB_SQLALCHEMY_MAX_OVERFLOW}"
        require_non_negative_int "_CLOUD_RUN_MIN_INSTANCES" "${_CLOUD_RUN_MIN_INSTANCES}"
        require_positive_int "_CLOUD_RUN_MAX_INSTANCES" "${_CLOUD_RUN_MAX_INSTANCES}"
        if [[ "${_DB_POOL_MAX_SIZE}" -lt "${_DB_POOL_MIN_SIZE}" ]]; then
          echo "_DB_POOL_MAX_SIZE must be greater than or equal to _DB_POOL_MIN_SIZE." >&2
          exit 1
        fi
        if [[ "${_CLOUD_RUN_MAX_INSTANCES}" -lt "${_CLOUD_RUN_MIN_INSTANCES}" ]]; then
          echo "_CLOUD_RUN_MAX_INSTANCES must be greater than or equal to _CLOUD_RUN_MIN_INSTANCES." >&2
          exit 1
        fi

        env_vars=(
          "ENVIRONMENT=${runtime_environment}"
          "HUSHH_DEPLOY_ENV=${_DEPLOY_ENV}"
          "HUSHH_DEPLOY_SOURCE=${_DEPLOY_SOURCE}"
          "HUSHH_DEPLOY_SHA=${_DEPLOY_SHA}"
          "HUSHH_DEPLOY_RUN_ID=${_GITHUB_RUN_ID}"
          "HUSHH_GENAI_AUTH_MODE=vertex_adc"
          "GOOGLE_GENAI_USE_VERTEXAI=true"
          "GOOGLE_CLOUD_PROJECT=${genai_project_id}"
          "GOOGLE_CLOUD_LOCATION=global"
          "HUSHH_VERTEX_LOCATIONS=global,us,eu"
          "CONSENT_API_PUBLIC_ORIGIN=${_CONSENT_API_PUBLIC_ORIGIN}"
          "DB_POOL_MIN_SIZE=${_DB_POOL_MIN_SIZE}"
          "DB_POOL_MAX_SIZE=${_DB_POOL_MAX_SIZE}"
          "DB_SQLALCHEMY_POOL_SIZE=${_DB_SQLALCHEMY_POOL_SIZE}"
          "DB_SQLALCHEMY_MAX_OVERFLOW=${_DB_SQLALCHEMY_MAX_OVERFLOW}"
          "RIA_INTELLIGENCE_CRD_SCRAPER_TIMEOUT_SECONDS=${_RIA_INTELLIGENCE_CRD_SCRAPER_TIMEOUT_SECONDS}"
          "RIA_ONBOARDING_PROVIDER_TIMEOUT_SECONDS=${_RIA_ONBOARDING_PROVIDER_TIMEOUT_SECONDS}"
        )
        add_env() {
          local env_name="$1"
          local env_value="$2"
          if [[ -n "${env_value}" ]]; then
            env_vars+=("${env_name}=${env_value}")
          fi
        }
        add_env "ONE_EMAIL_ADDRESS" "${_ONE_EMAIL_ADDRESS}"
        add_env "ONE_EMAIL_DELEGATED_USER" "${_ONE_EMAIL_DELEGATED_USER}"
        add_env "ONE_EMAIL_PUBSUB_TOPIC" "${_ONE_EMAIL_PUBSUB_TOPIC}"
        add_env "ONE_EMAIL_WEBHOOK_AUDIENCE" "${_ONE_EMAIL_WEBHOOK_AUDIENCE}"
        add_env "ONE_EMAIL_WEBHOOK_SERVICE_ACCOUNT_EMAIL" "${_ONE_EMAIL_WEBHOOK_SERVICE_ACCOUNT_EMAIL}"
        add_env "ONE_EMAIL_WEBHOOK_AUTH_ENABLED" "${_ONE_EMAIL_WEBHOOK_AUTH_ENABLED}"
        add_env "ONE_EMAIL_WATCH_RENEW_AUTH_ENABLED" "${_ONE_EMAIL_WATCH_RENEW_AUTH_ENABLED}"
        add_env "ONE_EMAIL_KYC_DEFAULT_SCOPE" "${_ONE_EMAIL_KYC_DEFAULT_SCOPE}"
        add_env "ONE_EMAIL_KYC_STRICT_CLIENT_ZK_ENABLED" "${_ONE_EMAIL_KYC_STRICT_CLIENT_ZK_ENABLED}"
        add_env "ONE_WALLET_CARD_ENABLED" "${_ONE_WALLET_CARD_ENABLED}"
        add_env "WALLET_PASS_PROVIDER" "${_WALLET_PASS_PROVIDER}"
        add_env "APP_REVIEW_MODE" "${_APP_REVIEW_MODE}"
        add_env "HUSHH_PROD_PHONE_TEST_ENABLED" "${_HUSHH_PROD_PHONE_TEST_ENABLED}"
        add_env "KAI_ANALYZE_DURABLE_RUN_STORE" "${_KAI_ANALYZE_DURABLE_RUN_STORE}"

        env_var_string="$(IFS='|'; echo "${env_vars[*]}")"
        deploy_labels="managed-by=hushh-github-actions,deploy-env=${_DEPLOY_ENV},deploy-source=${_DEPLOY_SOURCE},deploy-sha=${_DEPLOY_SHA},github-run-id=${_GITHUB_RUN_ID}"

        cmd=(
          gcloud run deploy "${_BACKEND_SERVICE}"
          "--image=gcr.io/$PROJECT_ID/consent-protocol:${_IMAGE_TAG}"
          "--region=${_REGION}"
          "--platform=managed"
          "--service-account=${_RUNTIME_SERVICE_ACCOUNT}"
          "--allow-unauthenticated"
          "--port=8080"
          "--memory=1Gi"
          "--cpu=1"
          "--timeout=3600"
          "--session-affinity"
          "--max=${_CLOUD_RUN_MAX_INSTANCES}"
          "--min=${_CLOUD_RUN_MIN_INSTANCES}"
          "--max-instances=${_CLOUD_RUN_MAX_INSTANCES}"
          "--min-instances=0"
          "--labels=${deploy_labels}"
          "--set-env-vars=^|^${env_var_string}"
          "--set-secrets=${secrets}"
        )

        if [[ "${_CLOUD_RUN_NO_TRAFFIC}" == "true" ]]; then
          cmd+=("--no-traffic")
        fi

        if [[ -n "${_CLOUDSQL_INSTANCES}" ]]; then
          cmd+=("--add-cloudsql-instances=${_CLOUDSQL_INSTANCES}")
        fi

        "${cmd[@]}"
    id: "deploy-backend"

  # Candidate-image GenAI probe under the exact runtime identity. This runs
  # before the calling workflow can promote a no-traffic revision when the
  # change-aware verification plan selects it. Direct backend builds retain the
  # conservative default of running this probe.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        case "${_VERIFY_MANAGED_VERTEX_RUNTIME}" in
          true) ;;
          false)
            echo "Skipping managed Vertex candidate probe: not selected by the verification plan."
            exit 0
            ;;
          *)
            echo "_VERIFY_MANAGED_VERTEX_RUNTIME must be true or false." >&2
            exit 1
            ;;
        esac
        genai_project_id="${_GENAI_PROJECT_ID}"
        if [[ -z "${genai_project_id}" ]]; then
          genai_project_id="$PROJECT_ID"
          if [[ "${_DEPLOY_ENV}" == "dev" ]]; then
            genai_project_id="hushh-pda-uat"
          fi
        fi
        job_name="${_BACKEND_SERVICE}-genai-readiness"
        gcloud run jobs deploy "${job_name}" \
          --project="$PROJECT_ID" \
          --region="${_REGION}" \
          --image="gcr.io/$PROJECT_ID/consent-protocol:${_IMAGE_TAG}" \
          --service-account="${_RUNTIME_SERVICE_ACCOUNT}" \
          --command="python" \
          --args="scripts/verify_managed_vertex_runtime.py" \
          --set-env-vars="^|^HUSHH_GENAI_AUTH_MODE=vertex_adc|GOOGLE_GENAI_USE_VERTEXAI=true|GOOGLE_CLOUD_PROJECT=${genai_project_id}|GOOGLE_CLOUD_LOCATION=global|HUSHH_VERTEX_LOCATIONS=global,us,eu|AGENT_ONE_ADK_LOCATION=us-central1" \
          --max-retries=0 \
          --task-timeout=90s \
          --quiet
        gcloud run jobs execute "${job_name}" \
          --project="$PROJECT_ID" \
          --region="${_REGION}" \
          --wait \
          --quiet
    id: "verify-managed-vertex-runtime"

# NOTE: no top-level `images:` block — `docker buildx build --push` (Step 1) already
# pushes every tag. Listing images here would make Cloud Build try to re-push them from
# the local daemon, which is empty under the buildx docker-container driver, and fail.

# Build timeout: 1800s headroom for the one-time cold seeding build; cached builds are minutes.
timeout: "1800s"

substitutions:
  _BACKEND_SERVICE: consent-protocol
  _RUNTIME_SERVICE_ACCOUNT: ""
  _GENAI_PROJECT_ID: ""
  _REGION: us-central1
  _CLOUDSQL_INSTANCES: ""
  _PLAID_CLIENT_ID_SECRET: ""
  _PLAID_SECRET_SECRET: ""
  _APP_SIGNING_KEY_SECRET: APP_SIGNING_KEY
  _VAULT_DATA_KEY_SECRET: VAULT_DATA_KEY
  _APP_FRONTEND_ORIGIN_SECRET: APP_FRONTEND_ORIGIN
  _FIREBASE_ADMIN_CREDENTIALS_SECRET: FIREBASE_ADMIN_CREDENTIALS_JSON
  _BACKEND_RUNTIME_CONFIG_JSON_SECRET: BACKEND_RUNTIME_CONFIG_JSON
  _PLAID_ACCESS_TOKEN_KEY_SECRET: ""
  _FINNHUB_API_KEY_SECRET: ""
  _PMP_API_KEY_SECRET: ""
  _NEWSAPI_KEY_SECRET: ""
  _GMAIL_OAUTH_CLIENT_ID_SECRET: ""
  _GMAIL_OAUTH_CLIENT_SECRET_SECRET: ""
  _GMAIL_OAUTH_REDIRECT_URI_SECRET: ""
  _GMAIL_OAUTH_TOKEN_KEY_SECRET: ""
  _GOOGLE_OAUTH_CLIENT_ID_SECRET: ""
  _GOOGLE_OAUTH_CLIENT_SECRET_SECRET: ""
  _GOOGLE_OAUTH_REDIRECT_URI_SECRET: ""
  _GOOGLE_OAUTH_TOKEN_KEY_SECRET: ""
  _OPENAI_API_KEY_SECRET: ""
  _GOOGLE_MAPS_API_KEY_SECRET: GOOGLE_MAPS_API_KEY
  _VOICE_RUNTIME_CONFIG_JSON_SECRET: ""
  _OMNIGATEWAY_CLIENT_ID_SECRET: OMNIGATEWAY_CLIENT_ID
  _OMNIGATEWAY_CLIENT_SECRET_SECRET: OMNIGATEWAY_CLIENT_SECRET
  _OMNIGATEWAY_EXT_CRM_CLIENT_ID_SECRET: OMNIGATEWAY_EXT_CRM_CLIENT_ID
