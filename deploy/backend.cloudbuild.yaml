      - "_VOICE_RUNTIME_CONFIG_JSON_SECRET=${_VOICE_RUNTIME_CONFIG_JSON_SECRET}"
      - "_WALLET_API_KEY_SECRET=${_WALLET_API_KEY_SECRET}"
      - "_WALLET_PASS_CERT_PEM_SECRET=${_WALLET_PASS_CERT_PEM_SECRET}"
