# Cloud Build configuration for Python FastAPI backend
# Deploy to: Cloud Run (service name configurable via substitutions)

steps:
  # Step 1: Build + push with a registry LAYER CACHE (buildx, mode=max).
  #
  # Why: Cloud Build workers are ephemeral, so a plain `docker build` starts with an
  # empty cache every run and reinstalls all ~159 pinned deps from scratch (20-35 min).
  # buildx `--cache-to type=registry,mode=max` exports EVERY stage's layers (incl. the
  # builder's `uv pip install` layer) to `:buildcache`; `--cache-from` restores them on
  # the next run. Because the Dockerfile copies requirements.txt before the app source,
  # an unchanged requirements.txt turns the dependency install into a cache HIT, so a
  # code-only deploy drops to a couple of minutes.
  #
  # NOTE: the FIRST build after this lands is still cold — it seeds `:buildcache`.
  # The payoff shows on the next backend deploy.
  - name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        # The build context is `consent-protocol`, but the generated contracts tree
        # lives at the REPO ROOT. Stage it into the context so `COPY . .` lands it at
        # /app/contracts. Without this the action gateway, the route-orchestration
        # index and One's persona catalogue all resolve a path that does not exist in
        # the image and degrade SILENTLY to empty. See hushh_mcp/contracts_root.py.
        rm -rf consent-protocol/contracts
        cp -R contracts consent-protocol/contracts
        # Ensure gcr.io auth is available to the buildx container driver.
        gcloud auth configure-docker gcr.io --quiet || true
        docker buildx create --use --name hushh-builder --driver docker-container \
          >/dev/null 2>&1 || docker buildx use hushh-builder
        docker buildx build \
          --cache-from=type=registry,ref=gcr.io/$PROJECT_ID/consent-protocol:buildcache \
          --cache-to=type=registry,ref=gcr.io/$PROJECT_ID/consent-protocol:buildcache,mode=max \
          --tag gcr.io/$PROJECT_ID/consent-protocol:manual \
          --tag gcr.io/$PROJECT_ID/consent-protocol:latest \
          --tag gcr.io/$PROJECT_ID/consent-protocol:${_IMAGE_TAG} \
          --file consent-protocol/Dockerfile \
          --push \
          consent-protocol
    id: "build-backend-image"

  # Step 2: Build + push the SLIM POD image (dev only).
  #
  # Why this lives here and not in the workflow: the workflow definition runs from
  # `main`, but `gcloud builds submit --config=deploy/backend.cloudbuild.yaml` reads
  # THIS file from the deployed SHA (the workflow detaches to it before this step).
  # That is the same skew the substitution guard in deploy-dev.yml exists for. So a
  # pod-image build added here ships with the branch that needs it, and `main` is
  # unaffected until this file is merged.
  #
  # Blast radius is therefore exactly "dev deploys of the SHA carrying this file".
  # Other branches deploy their own copy of this template and never build a pod.
  #
  # Two independent conditions, both exact-equality (never a prefix/substring test —
  # a `startswith` on env names is the class of bug that fires in production):
  #   _DEPLOY_ENV == dev      -> uat/prod pass a different value and cannot reach this
  #   _BUILD_POD_IMAGE == true -> the kill-switch, so the step can be turned off
  #                               without reverting the file
  #
  # The image shares requirements.txt and the python:3.13-slim base with the hub
  # image above; what differs is the runtime surface (pod_server:app mounts an
  # allowlist of routers, no fleet workers) and HUSSH_POD_MODE=1. See Dockerfile.pod.
  - name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        if [[ "${_DEPLOY_ENV}" != "dev" ]]; then
          echo "pod image: skipped (deploy env '${_DEPLOY_ENV}' is not 'dev')"
          exit 0
        fi
        if [[ "${_BUILD_POD_IMAGE}" != "true" ]]; then
          echo "pod image: skipped (_BUILD_POD_IMAGE='${_BUILD_POD_IMAGE}')"
          exit 0
        fi
        # Same contracts staging as the hub image above -- a pod runs the same agent
        # code and reads the same generated contracts.
        rm -rf consent-protocol/contracts
        cp -R contracts consent-protocol/contracts
        gcloud auth configure-docker gcr.io --quiet || true
        docker buildx create --use --name hushh-builder --driver docker-container \
          >/dev/null 2>&1 || docker buildx use hushh-builder
        docker buildx build \
          --cache-from=type=registry,ref=gcr.io/$PROJECT_ID/consent-protocol-pod:buildcache \
          --cache-to=type=registry,ref=gcr.io/$PROJECT_ID/consent-protocol-pod:buildcache,mode=max \
          --tag gcr.io/$PROJECT_ID/consent-protocol-pod:latest \
          --tag gcr.io/$PROJECT_ID/consent-protocol-pod:${_IMAGE_TAG} \
          --file consent-protocol/Dockerfile.pod \
          --push \
          consent-protocol
    id: "build-pod-image"

  # Step 2b: Validate the runtime identity + managed-Vertex IAM prerequisites.
  # Split out of the deploy step: Cloud Build caps one step arg at 10,000 chars,
  # and the cross-project managed-Vertex allowlist plus the aiplatform.user /
  # serviceUsageConsumer role checks belong to a preflight, not the deploy body.
  # A separate step gets its own arg budget; a failure here stops the build the
  # same way an inline check would. The allowlist is the only cross-project
  # managed-Vertex target permitted: dev may ride hushh-pda-uat, and uat may ride
  # the hushh-gemini-bridge; every other cross-project pairing is refused.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        if [[ -z "${_RUNTIME_SERVICE_ACCOUNT}" ]]; then
          echo "_RUNTIME_SERVICE_ACCOUNT is required." >&2
          exit 1
        fi
        if [[ "${_RUNTIME_SERVICE_ACCOUNT}" != *"@${PROJECT_ID}.iam.gserviceaccount.com" ]]; then
          echo "Runtime service account must belong to ${PROJECT_ID}; got '${_RUNTIME_SERVICE_ACCOUNT}'." >&2
          exit 1
        fi
        genai_project_id="${_GENAI_PROJECT_ID}"
        if [[ -z "${genai_project_id}" ]]; then
          genai_project_id="$PROJECT_ID"
          if [[ "${_DEPLOY_ENV}" == "dev" ]]; then
            genai_project_id="hushh-pda-uat"
          fi
        fi
        if [[ "${genai_project_id}" != "$PROJECT_ID" ]]; then
          case "${_DEPLOY_ENV}:${genai_project_id}" in
            dev:hushh-pda-uat|uat:hushh-gemini-bridge) ;;
            *)
              echo "Cross-project managed Vertex target is not allowlisted." >&2
              exit 1
              ;;
          esac
        fi
        gcloud iam service-accounts describe "${_RUNTIME_SERVICE_ACCOUNT}" \
          --project="$PROJECT_ID" >/dev/null
        vertex_api_name="$(gcloud services list --enabled \
          --project="${genai_project_id}" \
          --filter='config.name=aiplatform.googleapis.com' \
          --format='value(config.name)' | head -n 1)"
        if [[ "${vertex_api_name}" != "aiplatform.googleapis.com" ]]; then
          echo "Vertex AI API must be enabled in ${genai_project_id}." >&2
          exit 1
        fi
        runtime_vertex_role="$(gcloud projects get-iam-policy "${genai_project_id}" \
          --flatten='bindings[].members' \
          --filter="bindings.role=roles/aiplatform.user AND bindings.members=serviceAccount:${_RUNTIME_SERVICE_ACCOUNT}" \
          --format='value(bindings.role)' | head -n 1)"
        if [[ "${runtime_vertex_role}" != "roles/aiplatform.user" ]]; then
          echo "${_RUNTIME_SERVICE_ACCOUNT} must have roles/aiplatform.user in ${genai_project_id}." >&2
          exit 1
        fi
        if [[ "${genai_project_id}" != "$PROJECT_ID" ]]; then
          runtime_service_usage_role="$(gcloud projects get-iam-policy "${genai_project_id}" \
            --flatten='bindings[].members' \
            --filter="bindings.role=roles/serviceusage.serviceUsageConsumer AND bindings.members=serviceAccount:${_RUNTIME_SERVICE_ACCOUNT}" \
            --format='value(bindings.role)' | head -n 1)"
          if [[ "${runtime_service_usage_role}" != "roles/serviceusage.serviceUsageConsumer" ]]; then
            echo "${_RUNTIME_SERVICE_ACCOUNT} must have roles/serviceusage.serviceUsageConsumer in ${genai_project_id}." >&2
            exit 1
          fi
        fi
    id: "verify-runtime-iam"

  # Step 3: Deploy to Cloud Run
  #
  # WHY THE BODY LIVES IN A SCRIPT: Cloud Build caps a single build-step arg at
  # 10,000 characters, and this step's whole bash body used to be one arg. It
  # breached that cap twice in eight days -- 363a9932d (2026-07-28) and PR #4791
  # (2026-08-04) -- taking the UAT and dev deploy lanes down both times.
  # Substitutions are applied BEFORE the cap is enforced, so lanes differ: at
  # ba39d0342 the same body measured 10,282 for UAT and 10,208 for dev (both
  # over) but 8,937 for production (under), which is why nothing surfaced it.
  # Moving the body into scripts/deploy/backend-deploy.sh removes the ceiling
  # rather than buying headroom under it. The guard stays in
  # consent-protocol/tests/test_cloudbuild_step_arg_limit.py.
  #
  # Apple Wallet pass signing material (WALLET_PASS_CERT_PEM / KEY_PEM /
  # WWDR_PEM) is optional by construction: until the Pass Type ID certificate
  # is minted these secrets do not exist, so add_secret skips them
  # and the signing service answers 503 instead of 500. They are defaulted to
  # their canonical names so the first deploy after provisioning picks them up
  # with no change to this file.
  #
  # Runtime identity may differ from deploy identity: the dev environment
  # deploys with _DEPLOY_ENV=dev (labels, provenance) but runs with
  # ENVIRONMENT=uat so behavior gates replicate UAT exactly.
  #
  # env_var_string joins with '|' (not ',') so env VALUES may themselves
  # contain commas. Paired with gcloud's alternate-delimiter syntax on
  # --set-env-vars in the script.
  #
  # Timeout 3600s: WebSocket voice sessions (/api/one/adk/live) are long-lived
  # HTTP requests on Cloud Run; the previous 300s hard-killed any voice
  # conversation at 5 minutes. Session affinity is best-effort per Google's
  # WebSocket guidance; reconnects still re-mint a relay ticket, and
  # cross-instance nonce single-use is Postgres-backed (migration 084). Billing
  # note: instances with open WebSockets stay active for the connection's
  # lifetime.
  #
  # --max/--min: service-level limits bound aggregate database fan-out across
  # traffic splits. Revision min-instances=0 prevents no-traffic/retired
  # revisions from pinning their own warm database pools.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "bash"
    args:
      - "scripts/deploy/backend-deploy.sh"
    # Every value the script reads. Cloud Build substitutes these HERE (in the
    # config), not in the file -- and keeping the literal ${_FOO} tokens in this
    # YAML is what keeps deploy-dev.yml's skew guard working. See the script header.
    env:
      - "PROJECT_ID=$PROJECT_ID"
      - "_APP_FRONTEND_ORIGIN_SECRET=${_APP_FRONTEND_ORIGIN_SECRET}"
      - "_APP_REVIEW_MODE=${_APP_REVIEW_MODE}"
      - "_APP_SIGNING_KEY_SECRET=${_APP_SIGNING_KEY_SECRET}"
      - "_BACKEND_RUNTIME_CONFIG_JSON_SECRET=${_BACKEND_RUNTIME_CONFIG_JSON_SECRET}"
      - "_BACKEND_SERVICE=${_BACKEND_SERVICE}"
      - "_BUILD_POD_IMAGE=${_BUILD_POD_IMAGE}"
      - "_CLOUDSQL_INSTANCES=${_CLOUDSQL_INSTANCES}"
      - "_CONSENT_API_PUBLIC_ORIGIN=${_CONSENT_API_PUBLIC_ORIGIN}"
      - "_CONSENT_SSE_ENABLED=${_CONSENT_SSE_ENABLED}"
      - "_CONSENT_WEB_FALLBACK_ENABLED=${_CONSENT_WEB_FALLBACK_ENABLED}"
      - "_DB_POOL_ACQUIRE_TIMEOUT_SECONDS=${_DB_POOL_ACQUIRE_TIMEOUT_SECONDS}"
      - "_DB_POOL_MAX_SIZE=${_DB_POOL_MAX_SIZE}"
      - "_DB_POOL_MIN_SIZE=${_DB_POOL_MIN_SIZE}"
      - "_DB_SQLALCHEMY_MAX_OVERFLOW=${_DB_SQLALCHEMY_MAX_OVERFLOW}"
      - "_DB_SQLALCHEMY_POOL_SIZE=${_DB_SQLALCHEMY_POOL_SIZE}"
      - "_DEPLOY_ENV=${_DEPLOY_ENV}"
      # Cloud Build caps a step at 100 env entries and this step reached 101 after
      # the 2026-09 main merge, which rejected the whole build before it ran. The
      # five Cloud Run capacity knobs travel as one packed entry; backend-deploy.sh
      # unpacks them into the same _CLOUD_RUN_* names the rest of it reads.
      - "_CLOUD_RUN_CAPACITY=max=${_CLOUD_RUN_MAX_INSTANCES},min=${_CLOUD_RUN_MIN_INSTANCES},no_traffic=${_CLOUD_RUN_NO_TRAFFIC},cpu=${_CLOUD_RUN_CPU},concurrency=${_CLOUD_RUN_CONCURRENCY}"
      - "_DEPLOY_SHA=${_DEPLOY_SHA}"
      - "_DEPLOY_SOURCE=${_DEPLOY_SOURCE}"
      - "_FINNHUB_API_KEY_SECRET=${_FINNHUB_API_KEY_SECRET}"
      - "_FIREBASE_ADMIN_CREDENTIALS_SECRET=${_FIREBASE_ADMIN_CREDENTIALS_SECRET}"
      - "_GENAI_PROJECT_ID=${_GENAI_PROJECT_ID}"
      - "_GITHUB_RUN_ID=${_GITHUB_RUN_ID}"
      - "_GMAIL_OAUTH_CLIENT_ID_SECRET=${_GMAIL_OAUTH_CLIENT_ID_SECRET}"
      - "_GMAIL_OAUTH_CLIENT_SECRET_SECRET=${_GMAIL_OAUTH_CLIENT_SECRET_SECRET}"
      - "_GMAIL_OAUTH_REDIRECT_URI_SECRET=${_GMAIL_OAUTH_REDIRECT_URI_SECRET}"
      - "_GMAIL_OAUTH_TOKEN_KEY_SECRET=${_GMAIL_OAUTH_TOKEN_KEY_SECRET}"
      - "_GOOGLE_OAUTH_CLIENT_ID_SECRET=${_GOOGLE_OAUTH_CLIENT_ID_SECRET}"
      - "_GOOGLE_OAUTH_CLIENT_SECRET_SECRET=${_GOOGLE_OAUTH_CLIENT_SECRET_SECRET}"
      - "_GOOGLE_OAUTH_REDIRECT_URI_SECRET=${_GOOGLE_OAUTH_REDIRECT_URI_SECRET}"
      - "_GOOGLE_OAUTH_TOKEN_KEY_SECRET=${_GOOGLE_OAUTH_TOKEN_KEY_SECRET}"
      - "_GOOGLE_MAPS_API_KEY_SECRET=${_GOOGLE_MAPS_API_KEY_SECRET}"
      - "_HUSHH_DEVELOPER_TOKEN_SECRET=${_HUSHH_DEVELOPER_TOKEN_SECRET}"
      - "_HUSHH_MANAGED_GEMINI_LIVE_API_KEY_SECRET=${_HUSHH_MANAGED_GEMINI_LIVE_API_KEY_SECRET}"
      - "_HUSHH_TECH_LAUNCH_PEPPER_SECRET=${_HUSHH_TECH_LAUNCH_PEPPER_SECRET}"
      - "_HUSHH_PROD_PHONE_TEST_CHALLENGE_SECRET_SECRET=${_HUSHH_PROD_PHONE_TEST_CHALLENGE_SECRET_SECRET}"
      - "_HUSHH_PROD_PHONE_TEST_CODE_SECRET=${_HUSHH_PROD_PHONE_TEST_CODE_SECRET}"
      - "_HUSHH_PROD_PHONE_TEST_ENABLED=${_HUSHH_PROD_PHONE_TEST_ENABLED}"
      - "_HUSHH_PROD_PHONE_TEST_NUMBERS_SECRET=${_HUSHH_PROD_PHONE_TEST_NUMBERS_SECRET}"
      - "_HUSHH_UAT_PHONE_TEST_CHALLENGE_SECRET_SECRET=${_HUSHH_UAT_PHONE_TEST_CHALLENGE_SECRET_SECRET}"
      - "_HUSHH_UAT_PHONE_TEST_CODE_SECRET=${_HUSHH_UAT_PHONE_TEST_CODE_SECRET}"
      - "_HUSHH_UAT_PHONE_TEST_NUMBERS_SECRET=${_HUSHH_UAT_PHONE_TEST_NUMBERS_SECRET}"
      - "_IMAGE_TAG=${_IMAGE_TAG}"
      - "_KAI_ANALYZE_DURABLE_RUN_STORE=${_KAI_ANALYZE_DURABLE_RUN_STORE}"
      - "_NEWSAPI_KEY_SECRET=${_NEWSAPI_KEY_SECRET}"
      - "_OMNIGATEWAY_CLIENT_ID_SECRET=${_OMNIGATEWAY_CLIENT_ID_SECRET}"
      - "_OMNIGATEWAY_CLIENT_SECRET_SECRET=${_OMNIGATEWAY_CLIENT_SECRET_SECRET}"
      - "_OMNIGATEWAY_EXT_CRM_CLIENT_ID_SECRET=${_OMNIGATEWAY_EXT_CRM_CLIENT_ID_SECRET}"
      - "_OMNIGATEWAY_EXT_CRM_CLIENT_SECRET_SECRET=${_OMNIGATEWAY_EXT_CRM_CLIENT_SECRET_SECRET}"
      - "_ONE_EMAIL_ADDRESS=${_ONE_EMAIL_ADDRESS}"
      - "_ONE_EMAIL_DELEGATED_USER=${_ONE_EMAIL_DELEGATED_USER}"
      - "_ONE_EMAIL_KYC_DEFAULT_SCOPE=${_ONE_EMAIL_KYC_DEFAULT_SCOPE}"
      - "_ONE_EMAIL_KYC_STRICT_CLIENT_ZK_ENABLED=${_ONE_EMAIL_KYC_STRICT_CLIENT_ZK_ENABLED}"
      - "_ONE_EMAIL_PUBSUB_TOPIC=${_ONE_EMAIL_PUBSUB_TOPIC}"
      - "_ONE_EMAIL_WATCH_RENEW_AUTH_ENABLED=${_ONE_EMAIL_WATCH_RENEW_AUTH_ENABLED}"
      - "_ONE_EMAIL_WATCH_RENEW_TOKEN_SECRET=${_ONE_EMAIL_WATCH_RENEW_TOKEN_SECRET}"
      - "_ONE_EMAIL_WEBHOOK_AUDIENCE=${_ONE_EMAIL_WEBHOOK_AUDIENCE}"
      - "_ONE_EMAIL_WEBHOOK_AUTH_ENABLED=${_ONE_EMAIL_WEBHOOK_AUTH_ENABLED}"
      - "_ONE_EMAIL_WEBHOOK_SERVICE_ACCOUNT_EMAIL=${_ONE_EMAIL_WEBHOOK_SERVICE_ACCOUNT_EMAIL}"
      - "_ONE_WALLET_CARD_ENABLED=${_ONE_WALLET_CARD_ENABLED}"
      - "_OPENAI_API_KEY_SECRET=${_OPENAI_API_KEY_SECRET}"
      - "_PLAID_ACCESS_TOKEN_KEY_SECRET=${_PLAID_ACCESS_TOKEN_KEY_SECRET}"
      - "_PLAID_CLIENT_ID_SECRET=${_PLAID_CLIENT_ID_SECRET}"
      - "_PLAID_SECRET_SECRET=${_PLAID_SECRET_SECRET}"
      - "_PMP_API_KEY_SECRET=${_PMP_API_KEY_SECRET}"
      - "_RATE_LIMIT_STORAGE_URI_SECRET=${_RATE_LIMIT_STORAGE_URI_SECRET}"
      - "_REGION=${_REGION}"
      - "_REVIEWER_UID_SECRET=${_REVIEWER_UID_SECRET}"
      - "_REVIEWER_VAULT_PASSPHRASE_SECRET=${_REVIEWER_VAULT_PASSPHRASE_SECRET}"
      - "_RIA_CLAIM_TEST_CODE_SECRET=${_RIA_CLAIM_TEST_CODE_SECRET}"
      - "_RIA_CLAIM_TEST_NUMBERS_SECRET=${_RIA_CLAIM_TEST_NUMBERS_SECRET}"
      - "_RIA_IDENTITY_API_KEY_SECRET=${_RIA_IDENTITY_API_KEY_SECRET}"
      - "_RIA_IDENTITY_BASE_URL_SECRET=${_RIA_IDENTITY_BASE_URL_SECRET}"
      - "_RIA_INTELLIGENCE_CRD_SCRAPER_TIMEOUT_SECONDS=${_RIA_INTELLIGENCE_CRD_SCRAPER_TIMEOUT_SECONDS}"
      - "_RIA_INTELLIGENCE_VERIFY_BASE_URL_SECRET=${_RIA_INTELLIGENCE_VERIFY_BASE_URL_SECRET}"
      - "_RIA_ONBOARDING_PROVIDER_TIMEOUT_SECONDS=${_RIA_ONBOARDING_PROVIDER_TIMEOUT_SECONDS}"
      - "_RUNTIME_ENVIRONMENT=${_RUNTIME_ENVIRONMENT}"
      - "_RUNTIME_SERVICE_ACCOUNT=${_RUNTIME_SERVICE_ACCOUNT}"
      - "_VAULT_DATA_KEY_SECRET=${_VAULT_DATA_KEY_SECRET}"
      - "_VOICE_RUNTIME_CONFIG_JSON_SECRET=${_VOICE_RUNTIME_CONFIG_JSON_SECRET}"
      - "_VPC_CONNECTOR=${_VPC_CONNECTOR}"
      - "_WALLET_API_KEY_SECRET=${_WALLET_API_KEY_SECRET}"
      - "_WALLET_PASS_CERT_PEM_SECRET=${_WALLET_PASS_CERT_PEM_SECRET}"
      - "_WALLET_PASS_KEY_PEM_SECRET=${_WALLET_PASS_KEY_PEM_SECRET}"
      - "_WALLET_PASS_PROVIDER=${_WALLET_PASS_PROVIDER}"
      - "_WALLET_PASS_WWDR_PEM_SECRET=${_WALLET_PASS_WWDR_PEM_SECRET}"
      - "_INTELLIGENCE_API_BASE_URL_SECRET=${_INTELLIGENCE_API_BASE_URL_SECRET}"
      - "_INTELLIGENCE_API_KEY_SECRET=${_INTELLIGENCE_API_KEY_SECRET}"
      - "_SUPPORT_EMAIL_TEST_TO_SECRET=${_SUPPORT_EMAIL_TEST_TO_SECRET}"
      - "_SUPPORT_EMAIL_MODE_SECRET=${_SUPPORT_EMAIL_MODE_SECRET}"
      - "_SUPPORT_EMAIL_DELEGATED_USER_SECRET=${_SUPPORT_EMAIL_DELEGATED_USER_SECRET}"
      - "_SUPPORT_EMAIL_FROM_SECRET=${_SUPPORT_EMAIL_FROM_SECRET}"
      - "_GOOGLE_SERVICE_ACCOUNT_EMAIL_SECRET=${_GOOGLE_SERVICE_ACCOUNT_EMAIL_SECRET}"
      - "_GOOGLE_PRIVATE_KEY_SECRET=${_GOOGLE_PRIVATE_KEY_SECRET}"
      - "_RIA_CLAIM_TEST_EMAILS_SECRET=${_RIA_CLAIM_TEST_EMAILS_SECRET}"
      - "_AGENT_ONE_ADK_MODEL=${_AGENT_ONE_ADK_MODEL}"
    id: "deploy-backend"

  # Candidate-image GenAI probe under the exact runtime identity. This runs
  # before the calling workflow can promote a no-traffic revision when the
  # change-aware verification plan selects it. Direct backend builds retain the
  # conservative default of running this probe.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        case "${_VERIFY_MANAGED_VERTEX_RUNTIME}" in
          true) ;;
          false)
            echo "Skipping managed Vertex candidate probe: not selected by the verification plan."
            exit 0
            ;;
          *)
            echo "_VERIFY_MANAGED_VERTEX_RUNTIME must be true or false." >&2
            exit 1
            ;;
        esac
        genai_project_id="${_GENAI_PROJECT_ID}"
        if [[ -z "${genai_project_id}" ]]; then
          genai_project_id="$PROJECT_ID"
          if [[ "${_DEPLOY_ENV}" == "dev" ]]; then
            genai_project_id="hushh-pda-uat"
          fi
        fi
        # The probe needs the managed live key when the canonical live model
        # rides the developer_api transport; mounted only when the secret
        # exists so lanes without it still create the job.
        live_key_secret_flag=""
        if gcloud secrets describe "${_HUSHH_MANAGED_GEMINI_LIVE_API_KEY_SECRET}" --project="$PROJECT_ID" >/dev/null 2>&1; then
          live_key_secret_flag="--set-secrets=HUSHH_MANAGED_GEMINI_LIVE_API_KEY=${_HUSHH_MANAGED_GEMINI_LIVE_API_KEY_SECRET}:latest"
        fi
        job_name="${_BACKEND_SERVICE}-genai-readiness"
        gcloud run jobs deploy "${job_name}" \
          --project="$PROJECT_ID" \
          --region="${_REGION}" \
          --image="gcr.io/$PROJECT_ID/consent-protocol:${_IMAGE_TAG}" \
          --service-account="${_RUNTIME_SERVICE_ACCOUNT}" \
          --command="python3" \
          --args="scripts/verify_managed_vertex_runtime.py" \
          --set-env-vars="^|^HUSHH_GENAI_AUTH_MODE=vertex_adc|GOOGLE_GENAI_USE_VERTEXAI=true|GOOGLE_CLOUD_PROJECT=${genai_project_id}|GOOGLE_CLOUD_LOCATION=global|HUSHH_VERTEX_LOCATIONS=global,us,eu|AGENT_ONE_ADK_LOCATION=us-central1|AGENT_ONE_ADK_MODEL=${_AGENT_ONE_ADK_MODEL}" \
          ${live_key_secret_flag} \
          --max-retries=0 \
          --task-timeout=90s \
          --quiet
        set +e
        gcloud run jobs execute "${job_name}" \
          --project="$PROJECT_ID" \
          --region="${_REGION}" \
          --wait \
          --quiet
        execute_status=$?
        set -e
        if [[ "${execute_status}" -eq 0 ]]; then
          echo "Managed Vertex candidate probe passed."
          exit 0
        fi

        # `gcloud run jobs execute` surfaces the execution's exit STATUS only --
        # the probe's stdout lands in Cloud Logging, not in this build log. So
        # the verdict has to be read back from the job's logs before we can tell
        # a provider outage from a candidate defect.
        #
        # Scope the read to THIS execution. Filtering only by job name reads
        # whichever line is newest at query time, and Cloud Logging ingestion
        # lags the job's exit by seconds -- so the first attempt returned the
        # PREVIOUS execution's verdict and the build acted on a stale answer.
        # Observed 2026-08-20: a run whose 9 probes all classified
        # provider_unavailable was failed on the prior run's application_broken.
        execution_name="$(gcloud run jobs executions list \
          --job="${job_name}" \
          --project="$PROJECT_ID" \
          --region="${_REGION}" \
          --limit=1 \
          --sort-by='~metadata.creationTimestamp' \
          --format='value(metadata.name)' 2>/dev/null || true)"

        probe_line=""
        if [[ -n "${execution_name}" ]]; then
          # Ingestion lag is normally a few seconds; wait bounded rather than
          # guessing, because an empty read is treated as blocking below.
          for _attempt in 1 2 3 4 5 6; do
            probe_line="$(gcloud logging read \
              "resource.type=cloud_run_job AND labels.\"run.googleapis.com/execution_name\"=\"${execution_name}\" AND textPayload:managed_vertex_probe_result" \
              --project="$PROJECT_ID" \
              --limit=1 \
              --format='value(textPayload)' \
              --freshness=1h 2>/dev/null || true)"
            if [[ -n "${probe_line}" ]]; then
              break
            fi
            sleep 10
          done
        fi
        echo "Probe execution: ${execution_name:-unknown}"
        classification="$(
          PROBE_LINE="${probe_line}" python3 - <<'PY'
        import json
        import os

        line = os.environ.get("PROBE_LINE", "")
        marker = "managed_vertex_probe_result"
        payload = line.split(marker, 1)[1].strip() if marker in line else line
        try:
            verdict = json.loads(payload)
        except json.JSONDecodeError:
            print("")
        else:
            print(str(verdict.get("classification") or ""))
        PY
        )"

        if [[ "${classification}" == "provider_unavailable" ]]; then
          echo "::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::"
          echo "WARNING  Managed Vertex is UNAVAILABLE (provider-side)."
          echo "         The candidate image built and deployed correctly; the"
          echo "         provider refused every probe. Release CONTINUES in"
          echo "         degraded mode. Vertex-backed capabilities will not work"
          echo "         until the provider recovers."
          echo "         Probe verdict: ${probe_line}"
          echo "         NOTE: a provider denial is returned before model"
          echo "         validation, so this run did NOT clear the candidate's"
          echo "         model configuration. Re-probe once the provider is back."
          echo "::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::"
          exit 0
        fi

        echo "Managed Vertex candidate probe FAILED and the cause is not a provider outage." >&2
        if [[ -n "${probe_line}" ]]; then
          echo "Probe verdict: ${probe_line}" >&2
        else
          echo "No probe verdict was recoverable from the job logs; treating as blocking." >&2
        fi
        exit 1
    id: "verify-managed-vertex-runtime"

# NOTE: no top-level `images:` block — `docker buildx build --push` (Step 1) already
# pushes every tag. Listing images here would make Cloud Build try to re-push them from
# the local daemon, which is empty under the buildx docker-container driver, and fail.

# Build timeout: 1800s headroom for the one-time cold seeding build; cached builds are minutes.
timeout: "1800s"

