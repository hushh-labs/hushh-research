tags: ["phone-${_PHONE_DEPLOY_PHASE}-${_GITHUB_RUN_ID}-${_GITHUB_RUN_ATTEMPT}"]
# Cloud Build configuration for Python FastAPI backend
# Deploy to: Cloud Run (service name configurable via substitutions)

steps:
  # Step 1: Build + push with a registry LAYER CACHE (buildx, mode=max).
  #
  # Why: Cloud Build workers are ephemeral, so a plain `docker build` starts with an
  # empty cache every run and reinstalls all ~159 pinned deps from scratch (20-35 min).
  # buildx `--cache-to type=registry,mode=max` exports EVERY stage's layers (incl. the
  # builder's `uv pip install` layer) to `:buildcache`; `--cache-from` restores them on
  # the next run. Because the Dockerfile copies requirements.txt before the app source,
  # an unchanged requirements.txt turns the dependency install into a cache HIT, so a
  # code-only deploy drops to a couple of minutes.
  #
  # NOTE: the FIRST build after this lands is still cold — it seeds `:buildcache`.
  # The payoff shows on the next backend deploy.
  - name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        if [[ "${_SKIP_IMAGE_BUILD}" == "true" ]]; then
          if [[ -z "${_IMAGE_REFERENCE}" || "${_IMAGE_REFERENCE}" != *"@sha256:"* ]]; then
            echo "_SKIP_IMAGE_BUILD=true requires an immutable _IMAGE_REFERENCE digest." >&2
            exit 1
          fi
          echo "Using prebuilt immutable backend image (digest verified)."
          exit 0
        fi
        if [[ "${_SKIP_IMAGE_BUILD}" != "false" ]]; then
          echo "_SKIP_IMAGE_BUILD must be true or false." >&2
          exit 1
        fi
        gcloud auth configure-docker gcr.io --quiet || true
        docker buildx create --use --name hushh-builder --driver docker-container \
          >/dev/null 2>&1 || docker buildx use hushh-builder
        docker buildx build \
          --cache-from=type=registry,ref=gcr.io/$PROJECT_ID/consent-protocol:buildcache \
          --cache-to=type=registry,ref=gcr.io/$PROJECT_ID/consent-protocol:buildcache,mode=max \
          --tag gcr.io/$PROJECT_ID/consent-protocol:manual \
          --tag gcr.io/$PROJECT_ID/consent-protocol:latest \
          --tag gcr.io/$PROJECT_ID/consent-protocol:${_IMAGE_TAG} \
          --file consent-protocol/Dockerfile \
          --push \
          consent-protocol
    id: "build-backend-image"
    waitFor: ["-"]

  # Step 2: Build + push the SLIM POD image (dev only).
  #
  # Why this lives here and not in the workflow: the workflow definition runs from
  # `main`, but `gcloud builds submit --config=deploy/backend.cloudbuild.yaml` reads
  # THIS file from the deployed SHA (the workflow detaches to it before this step).
  # That is the same skew the substitution guard in deploy-dev.yml exists for. So a
  # pod-image build added here ships with the branch that needs it, and `main` is
  # unaffected until this file is merged.
  #
  # Blast radius is therefore exactly "dev deploys of the SHA carrying this file".
  # Other branches deploy their own copy of this template and never build a pod.
  #
  # Two independent conditions, both exact-equality (never a prefix/substring test —
  # a `startswith` on env names is the class of bug that fires in production):
  #   _DEPLOY_ENV == dev      -> uat/prod pass a different value and cannot reach this
  #   _BUILD_POD_IMAGE == true -> the kill-switch, so the step can be turned off
  #                               without reverting the file
  #
  # The image shares the locked project dependency inputs and python:3.13-slim base
  # with the hub image above; what differs is the runtime surface (pod_server:app
  # mounts an allowlist of routers, no fleet workers) and HUSSH_POD_MODE=1. See
  # Dockerfile.pod.
  - name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        if [[ "${_DEPLOY_ENV}" != "dev" ]]; then
          echo "pod image: skipped (deploy env '${_DEPLOY_ENV}' is not 'dev')"
          exit 0
        fi
        if [[ "${_BUILD_POD_IMAGE}" != "true" || -n "${_SECRET_PREFIX}" ]]; then
          echo "pod image: skipped (_BUILD_POD_IMAGE='${_BUILD_POD_IMAGE}')"
          exit 0
        fi
        if [[ -f deploy/pod-release-reuse.json ]]; then
          # The Cloud SDK digest step validates the pinned archive and image.
          # A refusal there aborts publication; it never falls back to a rebuild.
          echo "pod image build: using reviewed dev publication pin"
          exit 0
        fi
        # Same contracts staging as the hub image above -- a pod runs the same agent
        # code and reads the same generated contracts.
        rm -rf consent-protocol/contracts
        cp -R contracts consent-protocol/contracts
        gcloud auth configure-docker gcr.io --quiet || true
        docker buildx create --use --name hushh-builder --driver docker-container \
          >/dev/null 2>&1 || docker buildx use hushh-builder
        docker buildx build \
          --cache-from=type=registry,ref=gcr.io/$PROJECT_ID/consent-protocol-pod:buildcache \
          --cache-to=type=registry,ref=gcr.io/$PROJECT_ID/consent-protocol-pod:buildcache,mode=max \
          --tag gcr.io/$PROJECT_ID/consent-protocol-pod:latest \
          --tag gcr.io/$PROJECT_ID/consent-protocol-pod:${_IMAGE_TAG} \
          --build-arg POD_IMAGE_TAG=${_IMAGE_TAG} \
          --file consent-protocol/Dockerfile.pod \
          --push \
          consent-protocol
        docker buildx imagetools inspect --raw \
          gcr.io/$PROJECT_ID/consent-protocol-pod:${_IMAGE_TAG} \
          > /workspace/pod-image-manifest.json

    id: "build-pod-image"
    waitFor: ["build-backend-image"]

  # Docker's builder image does not include gcloud. Resolve the pushed tag in a
  # Cloud SDK step, then hand the immutable digest to deployment through the
  # shared workspace. Approval and installation must refer to this exact
  # artifact; re-resolving a mutable tag later would make the owner's approval
  # ambiguous.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        if [[ "${_DEPLOY_ENV}" != "dev" || "${_BUILD_POD_IMAGE}" != "true" || -n "${_SECRET_PREFIX}" ]]; then
          echo "pod image digest: skipped"
          exit 0
        fi
        if [[ -f deploy/pod-release-reuse.json ]]; then
          python3 scripts/deploy/reuse-pod-release.py \
            --config deploy/pod-release-reuse.json --project "$PROJECT_ID" \
            --descriptor-sha "${_DEPLOY_SHA}" --workspace /workspace
          image_source_sha="$(cat /workspace/pod-image-source-sha)"
          python3 scripts/deploy/assemble-pod-release.py \
            --descriptor deploy/pod-release.json \
            --image-reference-file /workspace/pod-image-reference \
            --source-sha "$image_source_sha" --environment dev \
            --run-id "${_GITHUB_RUN_ID}" --output /workspace/pod-release.json
          gcloud storage cp /workspace/pod-release.json \
            "gs://${PROJECT_ID}_cloudbuild/pod-releases/${image_source_sha}/${_GITHUB_RUN_ID}/release.json"
          exit 0
        fi
        pod_tag="gcr.io/$PROJECT_ID/consent-protocol-pod:${_IMAGE_TAG}"
        pod_digest=""
        for attempt in 1 2 3 4 5; do
          pod_digest="$(gcloud container images describe "$pod_tag" \
            --format='value(image_summary.digest)' 2>/dev/null || true)"
          if printf '%s' "$pod_digest" | grep -Eq '^sha256:[0-9a-fA-F]{64}$'; then
            break
          fi
          pod_digest=""
          sleep 2
        done
        if [[ -z "$pod_digest" ]]; then
          echo "pod image digest was not observable after push" >&2
          exit 1
        fi
        python3 scripts/ci/resolve-cloud-run-image.py \
          --image-reference "${pod_tag%:*}@$pod_digest" \
          --manifest-json /workspace/pod-image-manifest.json \
          --sha "${_DEPLOY_SHA}" --json-output /workspace/pod-image-provenance.json \
          > /workspace/pod-image-reference
        python3 scripts/deploy/assemble-pod-release.py \
          --descriptor deploy/pod-release.json \
          --image-reference-file /workspace/pod-image-reference \
          --source-sha "${_DEPLOY_SHA}" --environment dev \
          --run-id "${_GITHUB_RUN_ID}" --output /workspace/pod-release.json
        gcloud storage cp /workspace/pod-release.json \
          "gs://${PROJECT_ID}_cloudbuild/pod-releases/${_DEPLOY_SHA}/${_GITHUB_RUN_ID}/release.json"
    id: "resolve-pod-image-digest"
    waitFor: ["build-pod-image"]

  # Connect Azure (dev only) imports the approved pod digest from the lane's
  # pod-only release repository, the one repository its image reader is granted
  # (HUSSH_AZURE_POD_IMAGE_REPOSITORY, docs/reference/architecture/byoc-azure.md).
  # The hub's runtime identity holds no registry write, and widening it or the
  # reader is not approved, so the build identity copies exactly the digest the
  # hub will offer, before deploy-backend can offer it. A digest names exact
  # bytes: the copy is proven by reading that digest back, and a digest already
  # there is left alone. Fail closed: a release Azure could not import is never
  # offered. The repository must equal the dev lane's
  # hussh_azure_pod_image_repository in scripts/ops/sync_backend_runtime_secrets.py
  # (pinned by consent-protocol/tests/test_azure_pod_release_publish_step.py).
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        if [[ "${_DEPLOY_ENV}" != "dev" || "${_BUILD_POD_IMAGE}" != "true" || -n "${_SECRET_PREFIX}" ]]; then
          echo "azure pod release: skipped"
          exit 0
        fi
        release_repository="us-central1-docker.pkg.dev/$PROJECT_ID/one-pod-release/consent-protocol-pod"
        pod_image="$(head -n 1 /workspace/pod-image-reference | tr -d '\r\n')"
        pod_digest="${pod_image##*@}"
        if [[ ! "$pod_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
          echo "azure pod release: the pinned pod image is not a digest" >&2
          exit 1
        fi
        release_image="${release_repository}@${pod_digest}"
        if gcloud artifacts docker images describe "$release_image" >/dev/null 2>&1; then
          echo "azure pod release: ${pod_digest} already published"
          exit 0
        fi
        gcloud container images add-tag "$pod_image" "${release_repository}:${_IMAGE_TAG}" --quiet
        published="$(gcloud artifacts docker images describe "$release_image" \
          --format='value(image_summary.digest)')"
        if [[ "$published" != "$pod_digest" ]]; then
          echo "azure pod release: ${pod_digest} did not land in the release repository" >&2
          exit 1
        fi
        echo "azure pod release: published ${pod_digest}"
    id: "publish-azure-pod-release"
    waitFor: ["resolve-pod-image-digest"]

  # IAM and the isolated model probe overlap pod publication. Deployment joins
  # both paths; Docker builds stay serialized because they share a build context.
  # Validate the runtime identity + managed-Vertex IAM prerequisites.
  # Split out of the deploy step: Cloud Build caps one step arg at 10,000 chars
  # and the deploy body was 142 over after the INTELLIGENCE_* secret wiring.
  # A separate step gets its own budget; failure here stops the build the same way.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "bash"
    env:
      - "_GMAIL_PERSONAL_INFORMATION_REQUEST_MONITOR_AUTH_ENABLED=${_GMAIL_PERSONAL_INFORMATION_REQUEST_MONITOR_AUTH_ENABLED}"
      - "_GMAIL_PERSONAL_INFORMATION_REQUEST_MONITOR_AUDIENCE=${_GMAIL_PERSONAL_INFORMATION_REQUEST_MONITOR_AUDIENCE}"
      - "_GMAIL_PERSONAL_INFORMATION_REQUEST_MONITOR_SERVICE_ACCOUNT_EMAIL=${_GMAIL_PERSONAL_INFORMATION_REQUEST_MONITOR_SERVICE_ACCOUNT_EMAIL}"
    args:
      - "-c"
      - |
        set -euo pipefail
        case "${_SKIP_MANAGED_VERTEX_RUNTIME_FOR_RELEASE}" in
          false) ;;
          true)
            if [[ "$PROJECT_ID" != "hushh-pda-uat" || "${_DEPLOY_ENV}" != "uat" ||
                  "${_DEPLOY_SOURCE}" != "deploy-uat" || "${_DEPLOY_SHA}" != "a8e36651c17f6a0837530840fbeaf0ec3bbfcdf2" ||
                  "${_CLOUD_RUN_NO_TRAFFIC}" != "true" || "${_VERIFY_MANAGED_VERTEX_RUNTIME}" != "true" ||
                  ! "${_IMAGE_REFERENCE}" =~ ^gcr\.io/hushh-pda-uat/consent-protocol@sha256:[0-9a-f]{64}$ ||
                  ! "${_GITHUB_RUN_ID}" =~ ^[0-9]+$ || "${_CLOUD_RUN_TAG}" != "account-deletion-${_GITHUB_RUN_ID}" ||
                  "$(date -u +%Y-%m-%d)" > "2026-10-17" ]]; then
              echo "Invalid one-time UAT Vertex probe exception." >&2
              exit 1
            fi
            ;;
          *) echo "Invalid Vertex probe exception flag." >&2; exit 1 ;;
        esac
        if [[ -z "${_RUNTIME_SERVICE_ACCOUNT}" ]]; then
          echo "_RUNTIME_SERVICE_ACCOUNT is required." >&2
          exit 1
        fi
        if [[ "${_RUNTIME_SERVICE_ACCOUNT}" != *"@${PROJECT_ID}.iam.gserviceaccount.com" ]]; then
          echo "Runtime service account must belong to ${PROJECT_ID}; got '${_RUNTIME_SERVICE_ACCOUNT}'." >&2
          exit 1
        fi
        genai_project_id="${_GENAI_PROJECT_ID}"
        if [[ -z "${genai_project_id}" ]]; then
          genai_project_id="$(python3 -c 'import json,sys; print(json.load(open("consent-protocol/config/managed-ai-runtime.json"))["environments"][sys.argv[1]]["project"])' "${_DEPLOY_ENV}")"
        fi
        # Validate every surface against the packaged profile; no project overrides.
        expected_config_hash=$(python3 scripts/ops/managed_ai_config.py --environment "${_DEPLOY_ENV}" --format hash)
        if [[ "${_MANAGED_AI_CONFIG_HASH}" != "${expected_config_hash}" ]]; then echo "Managed AI profile hash mismatch." >&2; exit 1; fi
        expected_genai_project=$(python3 -c 'import json,sys; print(json.load(open("consent-protocol/config/managed-ai-runtime.json"))["environments"][sys.argv[1]]["project"])' "${_DEPLOY_ENV}")
        if [[ "${genai_project_id}" != "${expected_genai_project}" || -n "${_HUSHH_ONE_CHAT_VERTEX_PROJECT}" || -n "${_HUSHH_ONE_VOICE_VERTEX_PROJECT}" ]]; then
          echo "Managed AI deployment disagrees with its checked-in profile." >&2
          exit 1
        fi
        gcloud iam service-accounts describe "${_RUNTIME_SERVICE_ACCOUNT}" \
          --project="$PROJECT_ID" >/dev/null
        # UAT's cross-project release runs a mandatory no-traffic candidate
        # probe as the runtime identity before promotion. Cloud Build's separate
        # build identity need not read managed AI API state or IAM policy.
        # Other environments retain the static preflight. UAT cannot fall back
        # to an administrative read when its required candidate proof is absent.
        if [[ "${_DEPLOY_ENV}" == "uat" && "${genai_project_id}" != "$PROJECT_ID" ]]; then
          if [[ "$PROJECT_ID" != "hushh-pda-uat" || "${_CLOUD_RUN_NO_TRAFFIC}" != "true" || "${_VERIFY_MANAGED_VERTEX_RUNTIME}" != "true" ]] || \
            ! [[ "${_IMAGE_REFERENCE}" =~ ^gcr\.io/hushh-pda-uat/consent-protocol@sha256:[0-9a-f]{64}$ && "${_DEPLOY_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "UAT cross-project Vertex requires a no-traffic candidate, immutable image, exact SHA and successful runtime probe." >&2
            exit 1
          fi
          echo "UAT cross-project Vertex access will be verified by the required runtime-identity candidate probe."
        else
          vertex_api_name="$(gcloud services list --enabled \
            --project="${genai_project_id}" \
            --filter='config.name=aiplatform.googleapis.com' \
            --format='value(config.name)' | head -n 1)"
          if [[ "${vertex_api_name}" != "aiplatform.googleapis.com" ]]; then
            echo "Vertex AI API must be enabled in ${genai_project_id}." >&2
            exit 1
          fi
          runtime_vertex_role="$(gcloud projects get-iam-policy "${genai_project_id}" \
            --flatten='bindings[].members' \
            --filter="bindings.role=roles/aiplatform.user AND bindings.members=serviceAccount:${_RUNTIME_SERVICE_ACCOUNT}" \
            --format='value(bindings.role)' | head -n 1)"
          if [[ "${runtime_vertex_role}" != "roles/aiplatform.user" ]]; then
            echo "${_RUNTIME_SERVICE_ACCOUNT} must have roles/aiplatform.user in ${genai_project_id}." >&2
            exit 1
          fi
          if [[ "${genai_project_id}" != "$PROJECT_ID" ]]; then
            runtime_service_usage_role="$(gcloud projects get-iam-policy "${genai_project_id}" \
              --flatten='bindings[].members' \
              --filter="bindings.role=roles/serviceusage.serviceUsageConsumer AND bindings.members=serviceAccount:${_RUNTIME_SERVICE_ACCOUNT}" \
              --format='value(bindings.role)' | head -n 1)"
            if [[ "${runtime_service_usage_role}" != "roles/serviceusage.serviceUsageConsumer" ]]; then
              echo "${_RUNTIME_SERVICE_ACCOUNT} must have roles/serviceusage.serviceUsageConsumer in ${genai_project_id}." >&2
              exit 1
            fi
          fi
        fi
        if [[ "${_PKM_ANSWER_PAYMENTS_ENABLED}" == "true" || "${_ANSWER_WORK_DRAIN_ENABLED}" == "true" ]]; then
          for answer_secret in "${_PKM_ANSWER_STRIPE_SECRET_KEY_SECRET}" "${_PKM_ANSWER_STRIPE_WEBHOOK_SECRET_SECRET}"; do
            if [[ -z "${answer_secret}" ]] || ! gcloud secrets describe "${answer_secret}" --project="$PROJECT_ID" >/dev/null 2>&1; then
              echo "Answer payments require their own Stripe secret bindings." >&2
              exit 1
            fi
          done
          if [[ "${_PKM_ANSWER_PAYMENTS_ENABLED}" == "true" && "${_PKM_ANSWER_COMPOSER_ENABLED}" != "true" ]]; then
            echo "Paid answers require the reviewed composer flag." >&2
            exit 1
          fi
        fi
        if [[ "${_PKM_ANSWER_PAYMENTS_ENABLED}" == "true" && "${_PKM_ANSWER_STRIPE_MODE}" == "live" && "${_PKM_ANSWER_LIVE_PROVIDER_REVIEWED}" != "true" ]]; then
          echo "Live answers require verified provider retention and owner disclosure before admission." >&2
          exit 1
        fi
        require_non_negative_int() {
          local name="$1"
          local value="$2"
          if ! [[ "${value}" =~ ^[0-9]+$ ]]; then
            echo "${name} must be non-negative." >&2
            exit 1
          fi
        }
        require_positive_int() {
          local name="$1"
          local value="$2"
          require_non_negative_int "${name}" "${value}"
          if [[ "${value}" -lt 1 ]]; then
            echo "${name} must be positive." >&2
            exit 1
          fi
        }
        require_non_negative_int "_DB_POOL_MIN_SIZE" "${_DB_POOL_MIN_SIZE}"
        require_positive_int "_DB_POOL_MAX_SIZE" "${_DB_POOL_MAX_SIZE}"
        require_positive_int "_DB_SQLALCHEMY_POOL_SIZE" "${_DB_SQLALCHEMY_POOL_SIZE}"
        require_non_negative_int "_DB_SQLALCHEMY_MAX_OVERFLOW" "${_DB_SQLALCHEMY_MAX_OVERFLOW}"
        require_non_negative_int "_CLOUD_RUN_MIN_INSTANCES" "${_CLOUD_RUN_MIN_INSTANCES}"
        require_positive_int "_CLOUD_RUN_MAX_INSTANCES" "${_CLOUD_RUN_MAX_INSTANCES}"
        if [[ "${_DB_POOL_MAX_SIZE}" -lt "${_DB_POOL_MIN_SIZE}" ]]; then
          echo "_DB_POOL_MAX_SIZE must be at least _DB_POOL_MIN_SIZE." >&2
          exit 1
        fi
        if [[ "${_CLOUD_RUN_MAX_INSTANCES}" -lt "${_CLOUD_RUN_MIN_INSTANCES}" ]]; then
          echo "_CLOUD_RUN_MAX_INSTANCES must be at least _CLOUD_RUN_MIN_INSTANCES." >&2
          exit 1
        fi

    id: "verify-runtime-iam"
    waitFor: ["-"]

  # Candidate-image GenAI probe under the exact runtime identity. This runs
  # alongside pod publication, before deployment, when the operator explicitly
  # opts in. Direct backend builds do not make paid model calls by default;
  # schema, authority, provenance and health gates still run.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "bash"
    env:
      - "BUILD_ID=${BUILD_ID}"
      - "PROJECT_ID=${PROJECT_ID}"
      - "_DEPLOY_ENV=${_DEPLOY_ENV}"
      - "_GENAI_PROJECT_ID=${_GENAI_PROJECT_ID}"
      - "_HUSHH_ONE_CHAT_VERTEX_PROJECT=${_HUSHH_ONE_CHAT_VERTEX_PROJECT}"
      - "_HUSHH_ONE_VOICE_VERTEX_PROJECT=${_HUSHH_ONE_VOICE_VERTEX_PROJECT}"
      - "_HUSSH_GEMINI_TEXT_MODEL=${_HUSSH_GEMINI_TEXT_MODEL}"
      - "_IMAGE_REFERENCE=${_IMAGE_REFERENCE}"
      - "_IMAGE_TAG=${_IMAGE_TAG}"
      - "_MANAGED_AI_CONFIG_HASH=${_MANAGED_AI_CONFIG_HASH}"
      - "_ONE_VOICE_LIVE_ENABLED=${_ONE_VOICE_LIVE_ENABLED}"
      - "_REGION=${_REGION}"
      - "_RUNTIME_SERVICE_ACCOUNT=${_RUNTIME_SERVICE_ACCOUNT}"
      - "_SKIP_MANAGED_VERTEX_RUNTIME_FOR_RELEASE=${_SKIP_MANAGED_VERTEX_RUNTIME_FOR_RELEASE}"
      - "_VERIFY_MANAGED_VERTEX_RUNTIME=${_VERIFY_MANAGED_VERTEX_RUNTIME}"
      - "_VERTEX_LIVE_LOCATION=${_VERTEX_LIVE_LOCATION}"
      - "_VERTEX_LIVE_MODEL_ID=${_VERTEX_LIVE_MODEL_ID}"
      - "_CLOUD_RUN_NO_TRAFFIC=${_CLOUD_RUN_NO_TRAFFIC}"
      - "_DRIVE_REQUEST_SEMANTIC_MODEL_PROVIDER=${_DRIVE_REQUEST_SEMANTIC_MODEL_PROVIDER}"
      - "_DRIVE_REQUEST_SEMANTIC_SEARCH_ENABLED=${_DRIVE_REQUEST_SEMANTIC_SEARCH_ENABLED}"
      - "_APP_SIGNING_KEY_SECRET=${_APP_SIGNING_KEY_SECRET}"
      - "_VAULT_DATA_KEY_SECRET=${_VAULT_DATA_KEY_SECRET}"
      - "READINESS_BUILD_ID=${BUILD_ID}"
      - "READINESS_SOURCE_SHA=${_DEPLOY_SHA}"
      - "READINESS_IMAGE=${_IMAGE_REFERENCE}"
      - "READINESS_RUNTIME_ACCOUNT=${_RUNTIME_SERVICE_ACCOUNT}"
      - "READINESS_PROJECT=${PROJECT_ID}"
      - "READINESS_REGION=${_REGION}"
      - "READINESS_GITHUB_RUN=${_GITHUB_RUN_ID}"
      - "READINESS_ENVIRONMENT=${_DEPLOY_ENV}"
      - "READINESS_SERVICE=${_BACKEND_SERVICE}"
      - "READINESS_TAG=${_CLOUD_RUN_TAG}"
      - "READINESS_LEGACY_EXCEPTION=${_SKIP_MANAGED_VERTEX_RUNTIME_FOR_RELEASE}"
    args: ["scripts/deploy/verify-managed-vertex-runtime.sh"]
    id: "verify-managed-vertex-runtime"
    waitFor: ["build-backend-image", "verify-runtime-iam"]

  # Deploy through the extracted, checked script so Cloud Build substitutions
  # stay in env values and the script has a separate argument-size budget.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "bash"
    args:
      - "scripts/deploy/backend-deploy.sh"
    env:
      - "PROJECT_ID=$PROJECT_ID"
      - "_IMAGE_SETTINGS=${_SKIP_IMAGE_BUILD}|${_IMAGE_REFERENCE}|${_CLOUD_RUN_TAG}|${_BUILD_POD_IMAGE}|${_SECRET_PREFIX}|${_PHONE_ROLLBACK_SHA}|${_PHONE_ROLLBACK_IMAGE_REFERENCE}|${_PHONE_DEPLOY_PHASE}"
      - "_CLOUD_RUN_CAPACITY=max=${_CLOUD_RUN_MAX_INSTANCES},min=${_CLOUD_RUN_MIN_INSTANCES},no_traffic=${_CLOUD_RUN_NO_TRAFFIC},cpu=${_CLOUD_RUN_CPU},concurrency=${_CLOUD_RUN_CONCURRENCY},scaling_target=${_CLOUD_RUN_SCALING_CONCURRENCY_TARGET}"
      - "_DB_POOL_SETTINGS=acquire_timeout=${_DB_POOL_ACQUIRE_TIMEOUT_SECONDS},max=${_DB_POOL_MAX_SIZE},min=${_DB_POOL_MIN_SIZE},sa_max_overflow=${_DB_SQLALCHEMY_MAX_OVERFLOW},sa_pool_size=${_DB_SQLALCHEMY_POOL_SIZE}"
      - "_MODEL_SETTINGS=puppy_relay_url=${_PUPPY_INFERENCE_RELAY_URL},puppy_model=${_PUPPY_INFERENCE_MODEL},puppy_timeout=${_PUPPY_INFERENCE_TIMEOUT_SECONDS},gemini_text=${_HUSSH_GEMINI_TEXT_MODEL},chat_vertex_project=${_HUSHH_ONE_CHAT_VERTEX_PROJECT},voice_vertex_project=${_HUSHH_ONE_VOICE_VERTEX_PROJECT},voice_enabled=${_ONE_VOICE_LIVE_ENABLED},calendar_narration=${_ONE_VOICE_CALENDAR_NARRATION_ENABLED},voice_model=${_VERTEX_LIVE_MODEL_ID},voice_location=${_VERTEX_LIVE_LOCATION}"
      - "_DRIVE_SEARCH_SETTINGS=${_DRIVE_REQUEST_SEMANTIC_SEARCH_ENABLED}|${_DRIVE_REQUEST_SEMANTIC_MODEL_PROVIDER}|${_DRIVE_REQUEST_ACTIVITY_UNION_ENABLED}|${_DRIVE_REQUEST_ACTIVITY_UNION_PAUSED}"
