      - "_NEWSAPI_KEY_SECRET=${_NEWSAPI_KEY_SECRET}"
      - "_OMNIGATEWAY_CLIENT_ID_SECRET=${_OMNIGATEWAY_CLIENT_ID_SECRET}"
      - "_OMNIGATEWAY_CLIENT_SECRET_SECRET=${_OMNIGATEWAY_CLIENT_SECRET_SECRET}"
      - "_OMNIGATEWAY_EXT_CRM_CLIENT_ID_SECRET=${_OMNIGATEWAY_EXT_CRM_CLIENT_ID_SECRET}"
