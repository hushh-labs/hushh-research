# Cloud Build configuration for Python FastAPI backend
# Deploy to: Cloud Run (service name configurable via substitutions)

steps:
  # Step 1: Build + push with a registry LAYER CACHE (buildx, mode=max).
  #
  # Why: Cloud Build workers are ephemeral, so a plain `docker build` starts with an
  # empty cache every run and reinstalls all ~159 pinned deps from scratch (20-35 min).
  # buildx `--cache-to type=registry,mode=max` exports EVERY stage's layers (incl. the
  # builder's `uv pip install` layer) to `:buildcache`; `--cache-from` restores them on
  # the next run. Because the Dockerfile copies requirements.txt before the app source,
  # an unchanged requirements.txt turns the dependency install into a cache HIT, so a
  # code-only deploy drops to a couple of minutes.
  #
  # NOTE: the FIRST build after this lands is still cold — it seeds `:buildcache`.
  # The payoff shows on the next backend deploy.
  - name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        if [[ "${_SKIP_IMAGE_BUILD}" == "true" ]]; then
          if [[ -z "${_IMAGE_REFERENCE}" || "${_IMAGE_REFERENCE}" != *"@sha256:"* ]]; then
            echo "_SKIP_IMAGE_BUILD=true requires an immutable _IMAGE_REFERENCE digest." >&2
            exit 1
          fi
          echo "Using prebuilt immutable backend image (digest verified)."
          exit 0
        fi
        if [[ "${_SKIP_IMAGE_BUILD}" != "false" ]]; then
          echo "_SKIP_IMAGE_BUILD must be true or false." >&2
          exit 1
        fi
        gcloud auth configure-docker gcr.io --quiet || true
        docker buildx create --use --name hushh-builder --driver docker-container \
          >/dev/null 2>&1 || docker buildx use hushh-builder
        docker buildx build \
          --cache-from=type=registry,ref=gcr.io/$PROJECT_ID/consent-protocol:buildcache \
          --cache-to=type=registry,ref=gcr.io/$PROJECT_ID/consent-protocol:buildcache,mode=max \
          --tag gcr.io/$PROJECT_ID/consent-protocol:manual \
          --tag gcr.io/$PROJECT_ID/consent-protocol:latest \
          --tag gcr.io/$PROJECT_ID/consent-protocol:${_IMAGE_TAG} \
          --file consent-protocol/Dockerfile \
          --push \
          consent-protocol
    id: "build-backend-image"

  # Step 3: Deploy to Cloud Run
  #
  # NOTE ON COMMENTS IN THIS STEP: Cloud Build caps a single build-step arg at
  # 10,000 characters, and this step's whole bash body is one arg. Comments
  # placed *inside* the body count against that cap; comments here do not.
  # Keep explanatory prose at this level. See
  # consent-protocol/tests/test_cloudbuild_step_arg_limit.py for the CI guard.
  #
  # Apple Wallet pass signing material (WALLET_PASS_CERT_PEM / KEY_PEM /
  # WWDR_PEM) is optional by construction: until the Pass Type ID certificate
  # is minted these secrets do not exist, so add_secret skips them
  # and the signing service answers 503 instead of 500. They are defaulted to
  # their canonical names so the first deploy after provisioning picks them up
  # with no change to this file.
  #
  # WorkOS enterprise SSO follows the same optional rule. This step body is within
  # a few characters of Cloud Build's 10,000-character arg cap, so its bindings
  # live in deploy/sso/bind_workos.sh, sourced after add_secret and add_env exist.
  # Missing secrets are skipped and the routes answer 404 until WORKOS_SSO_ENABLED
  # is true, so deploying this file changes nothing by itself. The source line
  # tolerates a missing script because production deploys this file over the older
  # commit it is asked to release or roll back to, which has no deploy/sso/.
  #
  # Runtime identity may differ from deploy identity: the dev environment
  # deploys with _DEPLOY_ENV=dev (labels, provenance) but runs with
  # ENVIRONMENT=uat so behavior gates replicate UAT exactly.
  #
  # env_var_string joins with '|' (not ',') so env VALUES may themselves
  # contain commas. Paired with gcloud's alternate-delimiter syntax on
  # --set-env-vars below.
  #
  # Long-running text streams retain the existing 3600s request timeout.
  # Location commands use bounded HTTP requests; Live relay is retired.
  #
  # --max/--min: service-level limits bound aggregate database fan-out across
  # traffic splits. Revision min-instances=0 prevents no-traffic/retired
  # revisions from pinning their own warm database pools.
  # CPU stays allocated between requests for action-search warmup and chat.
  # Step 3a: Validate the runtime identity + managed-Vertex IAM prerequisites.
  # Split out of the deploy step: Cloud Build caps one step arg at 10,000 chars
  # and the deploy body was 142 over after the INTELLIGENCE_* secret wiring.
  # A separate step gets its own budget; failure here stops the build the same way.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "bash"
    env:
      - "_GMAIL_PERSONAL_INFORMATION_REQUEST_MONITOR_AUTH_ENABLED=${_GMAIL_PERSONAL_INFORMATION_REQUEST_MONITOR_AUTH_ENABLED}"
      - "_GMAIL_PERSONAL_INFORMATION_REQUEST_MONITOR_AUDIENCE=${_GMAIL_PERSONAL_INFORMATION_REQUEST_MONITOR_AUDIENCE}"
      - "_GMAIL_PERSONAL_INFORMATION_REQUEST_MONITOR_SERVICE_ACCOUNT_EMAIL=${_GMAIL_PERSONAL_INFORMATION_REQUEST_MONITOR_SERVICE_ACCOUNT_EMAIL}"
    args:
      - "-c"
      - |
        set -euo pipefail
        case "${_SKIP_MANAGED_VERTEX_RUNTIME_FOR_RELEASE}" in
          false) ;;
          true)
            if [[ "$PROJECT_ID" != "hushh-pda-uat" || "${_DEPLOY_ENV}" != "uat" ||
                  "${_DEPLOY_SOURCE}" != "deploy-uat" || "${_DEPLOY_SHA}" != "a8e36651c17f6a0837530840fbeaf0ec3bbfcdf2" ||
                  "${_CLOUD_RUN_NO_TRAFFIC}" != "true" || "${_VERIFY_MANAGED_VERTEX_RUNTIME}" != "true" ||
                  ! "${_IMAGE_REFERENCE}" =~ ^gcr\.io/hushh-pda-uat/consent-protocol@sha256:[0-9a-f]{64}$ ||
                  ! "${_GITHUB_RUN_ID}" =~ ^[0-9]+$ || "${_CLOUD_RUN_TAG}" != "account-deletion-${_GITHUB_RUN_ID}" ||
                  "$(date -u +%Y-%m-%d)" > "2026-10-17" ]]; then
              echo "Invalid one-time UAT Vertex probe exception." >&2
              exit 1
            fi
            ;;
          *) echo "Invalid Vertex probe exception flag." >&2; exit 1 ;;
        esac
        if [[ -z "${_RUNTIME_SERVICE_ACCOUNT}" ]]; then
          echo "_RUNTIME_SERVICE_ACCOUNT is required." >&2
          exit 1
        fi
        if [[ "${_RUNTIME_SERVICE_ACCOUNT}" != *"@${PROJECT_ID}.iam.gserviceaccount.com" ]]; then
          echo "Runtime service account must belong to ${PROJECT_ID}; got '${_RUNTIME_SERVICE_ACCOUNT}'." >&2
          exit 1
        fi
        genai_project_id="${_GENAI_PROJECT_ID}"
        if [[ -z "${genai_project_id}" ]]; then
          genai_project_id="$PROJECT_ID"
          if [[ "${_DEPLOY_ENV}" == "dev" ]]; then
            genai_project_id="hushh-pda-uat"
          fi
        fi
        # Validate deployment arguments against the same packaged profile used
        # by text, voice, research and embeddings. No surface project overrides.
        expected_config_hash=$(python3 scripts/ops/managed_ai_config.py --environment "${_DEPLOY_ENV}" --format hash)
        if [[ "${_MANAGED_AI_CONFIG_HASH}" != "${expected_config_hash}" ]]; then echo "Managed AI profile hash mismatch." >&2; exit 1; fi
        expected_genai_project=$(python3 -c 'import json,sys; print(json.load(open("consent-protocol/config/managed-ai-runtime.json"))["environments"][sys.argv[1]]["project"])' "${_DEPLOY_ENV}")
        if [[ "${genai_project_id}" != "${expected_genai_project}" || -n "${_HUSHH_ONE_CHAT_VERTEX_PROJECT}" || -n "${_HUSHH_ONE_VOICE_VERTEX_PROJECT}" ]]; then
          echo "Managed AI deployment disagrees with its checked-in profile." >&2
          exit 1
        fi
        gcloud iam service-accounts describe "${_RUNTIME_SERVICE_ACCOUNT}" \
          --project="$PROJECT_ID" >/dev/null
        # UAT's cross-project release runs a mandatory no-traffic candidate
        # probe as the runtime identity before promotion. Cloud Build's separate
        # build identity need not read managed AI API state or IAM policy.
        # Other environments retain the static preflight. UAT cannot fall back
        # to an administrative read when its required candidate proof is absent.
        if [[ "${_DEPLOY_ENV}" == "uat" && "${genai_project_id}" != "$PROJECT_ID" ]]; then
          if [[ "$PROJECT_ID" != "hushh-pda-uat" || "${_CLOUD_RUN_NO_TRAFFIC}" != "true" || "${_VERIFY_MANAGED_VERTEX_RUNTIME}" != "true" ]] || \
            ! [[ "${_IMAGE_REFERENCE}" =~ ^gcr\.io/hushh-pda-uat/consent-protocol@sha256:[0-9a-f]{64}$ && "${_DEPLOY_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "UAT cross-project Vertex requires a no-traffic candidate, immutable image, exact SHA and successful runtime probe." >&2
            exit 1
          fi
          echo "UAT cross-project Vertex access will be verified by the required runtime-identity candidate probe."
        else
          vertex_api_name="$(gcloud services list --enabled \
            --project="${genai_project_id}" \
            --filter='config.name=aiplatform.googleapis.com' \
            --format='value(config.name)' | head -n 1)"
          if [[ "${vertex_api_name}" != "aiplatform.googleapis.com" ]]; then
            echo "Vertex AI API must be enabled in ${genai_project_id}." >&2
            exit 1
          fi
          runtime_vertex_role="$(gcloud projects get-iam-policy "${genai_project_id}" \
            --flatten='bindings[].members' \
            --filter="bindings.role=roles/aiplatform.user AND bindings.members=serviceAccount:${_RUNTIME_SERVICE_ACCOUNT}" \
            --format='value(bindings.role)' | head -n 1)"
          if [[ "${runtime_vertex_role}" != "roles/aiplatform.user" ]]; then
            echo "${_RUNTIME_SERVICE_ACCOUNT} must have roles/aiplatform.user in ${genai_project_id}." >&2
            exit 1
          fi
          if [[ "${genai_project_id}" != "$PROJECT_ID" ]]; then
            runtime_service_usage_role="$(gcloud projects get-iam-policy "${genai_project_id}" \
              --flatten='bindings[].members' \
              --filter="bindings.role=roles/serviceusage.serviceUsageConsumer AND bindings.members=serviceAccount:${_RUNTIME_SERVICE_ACCOUNT}" \
              --format='value(bindings.role)' | head -n 1)"
            if [[ "${runtime_service_usage_role}" != "roles/serviceusage.serviceUsageConsumer" ]]; then
              echo "${_RUNTIME_SERVICE_ACCOUNT} must have roles/serviceusage.serviceUsageConsumer in ${genai_project_id}." >&2
              exit 1
            fi
          fi
        fi
        if [[ "${_PKM_ANSWER_PAYMENTS_ENABLED}" == "true" || "${_ANSWER_WORK_DRAIN_ENABLED}" == "true" ]]; then
          for answer_secret in "${_PKM_ANSWER_STRIPE_SECRET_KEY_SECRET}" "${_PKM_ANSWER_STRIPE_WEBHOOK_SECRET_SECRET}"; do
            if [[ -z "${answer_secret}" ]] || ! gcloud secrets describe "${answer_secret}" --project="$PROJECT_ID" >/dev/null 2>&1; then
              echo "Answer payments require their own Stripe secret bindings." >&2
              exit 1
            fi
          done
          if [[ "${_PKM_ANSWER_PAYMENTS_ENABLED}" == "true" && "${_PKM_ANSWER_COMPOSER_ENABLED}" != "true" ]]; then
            echo "Paid answers require the reviewed composer flag." >&2
            exit 1
          fi
        fi
        if [[ "${_PKM_ANSWER_PAYMENTS_ENABLED}" == "true" && "${_PKM_ANSWER_STRIPE_MODE}" == "live" && "${_PKM_ANSWER_LIVE_PROVIDER_REVIEWED}" != "true" ]]; then
          echo "Live answers require verified provider retention and owner disclosure before admission." >&2
          exit 1
        fi
        require_non_negative_int() {
          local name="$1"
          local value="$2"
          if ! [[ "${value}" =~ ^[0-9]+$ ]]; then
            echo "${name} must be non-negative." >&2
            exit 1
          fi
        }
        require_positive_int() {
          local name="$1"
          local value="$2"
          require_non_negative_int "${name}" "${value}"
          if [[ "${value}" -lt 1 ]]; then
            echo "${name} must be positive." >&2
            exit 1
          fi
        }
        require_non_negative_int "_DB_POOL_MIN_SIZE" "${_DB_POOL_MIN_SIZE}"
        require_positive_int "_DB_POOL_MAX_SIZE" "${_DB_POOL_MAX_SIZE}"
        require_positive_int "_DB_SQLALCHEMY_POOL_SIZE" "${_DB_SQLALCHEMY_POOL_SIZE}"
        require_non_negative_int "_DB_SQLALCHEMY_MAX_OVERFLOW" "${_DB_SQLALCHEMY_MAX_OVERFLOW}"
        require_non_negative_int "_CLOUD_RUN_MIN_INSTANCES" "${_CLOUD_RUN_MIN_INSTANCES}"
        require_positive_int "_CLOUD_RUN_MAX_INSTANCES" "${_CLOUD_RUN_MAX_INSTANCES}"
        if [[ "${_DB_POOL_MAX_SIZE}" -lt "${_DB_POOL_MIN_SIZE}" ]]; then
          echo "_DB_POOL_MAX_SIZE must be at least _DB_POOL_MIN_SIZE." >&2
          exit 1
        fi
        if [[ "${_CLOUD_RUN_MAX_INSTANCES}" -lt "${_CLOUD_RUN_MIN_INSTANCES}" ]]; then
          echo "_CLOUD_RUN_MAX_INSTANCES must be at least _CLOUD_RUN_MIN_INSTANCES." >&2
          exit 1
        fi

    id: "verify-runtime-iam"

  # Curated OAuth connectors (config/curated_connectors/*.json): the deploy
  # passes the '+'-joined secret names derived from the checked-in manifests.
  # Secret name == environment variable name, so nothing is mapped per provider.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        genai_project_id="${_GENAI_PROJECT_ID}"
        if [[ -z "${genai_project_id}" ]]; then
          genai_project_id="$PROJECT_ID"
          if [[ "${_DEPLOY_ENV}" == "dev" ]]; then
            genai_project_id="hushh-pda-uat"
          fi
        fi
        add_secret() {
          local secret_name="$1"
          local env_name="$2"
          [[ -z "${secret_name}" ]] && return
          if gcloud secrets describe "${secret_name}" --project="$PROJECT_ID" >/dev/null 2>&1; then
            secrets="${secrets},${env_name}=${secret_name}:latest"
          fi
        }

        secrets="$${BASE_SECRET_BINDINGS}"
        if [[ -n "${_PLAID_CLIENT_ID_SECRET}" ]]; then
          secrets="${secrets},PLAID_CLIENT_ID=${_PLAID_CLIENT_ID_SECRET}:latest"
        fi
        if [[ -n "${_PLAID_SECRET_SECRET}" ]]; then
          secrets="${secrets},PLAID_SECRET=${_PLAID_SECRET_SECRET}:latest"
        fi
        if [[ -n "${_PLAID_ACCESS_TOKEN_KEY_SECRET}" ]]; then
          secrets="${secrets},PLAID_ACCESS_TOKEN_KEY=${_PLAID_ACCESS_TOKEN_KEY_SECRET}:latest"
        fi
        if [[ "${_DRIVE_REQUEST_PAYMENTS_ENABLED}" == "true" || "${_DRIVE_REQUEST_OWNER_PAYOUTS_ENABLED}" == "true" ]]; then
          for required_secret in "${_STRIPE_SECRET_KEY_SECRET}" "${_STRIPE_WEBHOOK_SECRET_SECRET}"; do
            if [[ -z "${required_secret}" ]] || ! gcloud secrets describe "${required_secret}" --project="$PROJECT_ID" >/dev/null 2>&1; then
              echo "Drive request payments and owner payouts require both Stripe secrets in the deploy project." >&2
              exit 1
            fi
          done
        fi
        if [[ "${_DRIVE_REQUEST_OWNER_PAYOUTS_ENABLED}" == "true" ]]; then
          if [[ -z "${_STRIPE_CONNECT_WEBHOOK_SECRET_SECRET}" ]] || ! gcloud secrets describe "${_STRIPE_CONNECT_WEBHOOK_SECRET_SECRET}" --project="$PROJECT_ID" >/dev/null 2>&1; then
            echo "Document owner payouts require the Stripe Connect webhook secret in the deploy project." >&2
            exit 1
          fi
        fi
        add_secret "${_PKM_ANSWER_STRIPE_SECRET_KEY_SECRET}" "PKM_ANSWER_STRIPE_SECRET_KEY"
        add_secret "${_PKM_ANSWER_STRIPE_WEBHOOK_SECRET_SECRET}" "PKM_ANSWER_STRIPE_WEBHOOK_SECRET"
        add_secret "${_PKM_ANSWER_STRIPE_TEST_SECRET_KEY_SECRET}" "PKM_ANSWER_STRIPE_TEST_SECRET_KEY"
        add_secret "${_PKM_ANSWER_STRIPE_TEST_WEBHOOK_SECRET_SECRET}" "PKM_ANSWER_STRIPE_TEST_WEBHOOK_SECRET"
        add_secret "${_PKM_ANSWER_STRIPE_LIVE_SECRET_KEY_SECRET}" "PKM_ANSWER_STRIPE_LIVE_SECRET_KEY"
        add_secret "${_PKM_ANSWER_STRIPE_LIVE_WEBHOOK_SECRET_SECRET}" "PKM_ANSWER_STRIPE_LIVE_WEBHOOK_SECRET"
        source deploy/drive/verify_hashcoin_config.sh "$PROJECT_ID"
        for n in FINNHUB_API_KEY PMP_API_KEY NEWSAPI_KEY GMAIL_OAUTH_CLIENT_ID GMAIL_OAUTH_CLIENT_SECRET GMAIL_OAUTH_REDIRECT_URI GMAIL_OAUTH_TOKEN_KEY GOOGLE_OAUTH_CLIENT_ID GOOGLE_OAUTH_CLIENT_SECRET GOOGLE_OAUTH_REDIRECT_URI GOOGLE_OAUTH_TOKEN_KEY GOOGLE_DRIVE_OAUTH_CLIENT_ID GOOGLE_DRIVE_OAUTH_CLIENT_SECRET GOOGLE_DRIVE_PICKER_API_KEY EXTERNAL_CONNECTOR_CREDENTIAL_KEY DRIVE_DOCUMENT_KEY_V1 DRIVE_SHARING_KEY_V1 STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET STRIPE_CONNECT_WEBHOOK_SECRET OPENAI_API_KEY STRIPE_CONNECT_SECRET_KEY STRIPE_CONNECT_TEST_WEBHOOK_SECRET GOOGLE_MAPS_API_KEY OMNIGATEWAY_CLIENT_ID OMNIGATEWAY_CLIENT_SECRET OMNIGATEWAY_EXT_CRM_CLIENT_ID OMNIGATEWAY_EXT_CRM_CLIENT_SECRET HUSHH_DEVELOPER_TOKEN HUSHH_UAT_PHONE_TEST_NUMBERS HUSHH_UAT_PHONE_TEST_CODE HUSHH_UAT_PHONE_TEST_CHALLENGE_SECRET HUSHH_PROD_PHONE_TEST_NUMBERS HUSHH_PROD_PHONE_TEST_CODE HUSHH_PROD_PHONE_TEST_CHALLENGE_SECRET REVIEWER_UID REVIEWER_VAULT_PASSPHRASE REVIEWER_COUNTERPART_UID REVIEWER_COUNTERPART_VAULT_PASSPHRASE RIA_INTELLIGENCE_VERIFY_BASE_URL RIA_IDENTITY_BASE_URL RIA_IDENTITY_API_KEY INTELLIGENCE_API_BASE_URL INTELLIGENCE_API_KEY SUPPORT_EMAIL_TEST_TO SUPPORT_EMAIL_MODE SUPPORT_EMAIL_DELEGATED_USER SUPPORT_EMAIL_FROM GOOGLE_SERVICE_ACCOUNT_EMAIL GOOGLE_PRIVATE_KEY RIA_CLAIM_TEST_NUMBERS RIA_CLAIM_TEST_CODE RIA_CLAIM_TEST_EMAILS ONE_EMAIL_WATCH_RENEW_TOKEN WALLET_API_KEY; do
          v="_${n}_SECRET"
          add_secret "${!v}" "${n}"
        done
        for s in $(echo "${_CURATED_CONNECTOR_SECRETS}" | tr '+' ' '); do
          add_secret "$s" "$s"
        done
        add_secret "${_DIRECT_MESSAGE_ENCRYPTION_KEY_V1_SECRET}" "DIRECT_MESSAGE_ENCRYPTION_KEY_V1"
        add_secret ADVISORS_API_KEY ADVISORS_API_KEY
        add_secret INSURANCE_AGENTS_API_KEY INSURANCE_AGENTS_API_KEY
        source deploy/email-auth/bind_secrets.sh "${_DEPLOY_ENV}"
        source deploy/plg/bind_secrets.sh "${_DEPLOY_ENV}" "$PROJECT_ID"
        add_secret NWS_NEARBY_API_KEY NWS_NEARBY_API_KEY
        add_secret NWS_NEARBY_V4_API_KEY NWS_NEARBY_V4_API_KEY
        add_secret NWS_NEARBY_V4_ACTOR_HMAC_KEY NWS_NEARBY_V4_ACTOR_HMAC_KEY
        add_secret "${_HUSHH_TECH_LAUNCH_PEPPER_SECRET}" "HUSSH_TECH_LAUNCH_PEPPER"
        add_secret "${_RATE_LIMIT_STORAGE_URI_SECRET}" "RATE_LIMIT_STORAGE_URI"
        add_secret "${_WALLET_PASS_CERT_PEM_SECRET}" "WALLET_PASS_CERT_PEM"
        add_secret "${_WALLET_PASS_KEY_PEM_SECRET}" "WALLET_PASS_KEY_PEM"
        add_secret "${_WALLET_PASS_WWDR_PEM_SECRET}" "WALLET_PASS_WWDR_PEM"

        runtime_environment="${_RUNTIME_ENVIRONMENT}"
        if [[ -z "${runtime_environment}" ]]; then
          runtime_environment="${_DEPLOY_ENV}"
        fi

        env_vars=(
          "ENVIRONMENT=${runtime_environment}"
          "DRIVE_REQUEST_SEMANTIC_SEARCH_ENABLED=${_DRIVE_REQUEST_SEMANTIC_SEARCH_ENABLED}"
          "DRIVE_REQUEST_SEMANTIC_MODEL_PROVIDER=${_DRIVE_REQUEST_SEMANTIC_MODEL_PROVIDER}"
          "HUSHH_DEPLOY_ENV=${_DEPLOY_ENV}"
          "HUSHH_DEPLOY_SOURCE=${_DEPLOY_SOURCE}"
          "HUSHH_DEPLOY_SHA=${_DEPLOY_SHA}"
          "HUSHH_DEPLOY_RUN_ID=${_GITHUB_RUN_ID}"
          "HUSHH_GENAI_AUTH_MODE=vertex_adc"
          "GOOGLE_GENAI_USE_VERTEXAI=true"
          "GOOGLE_CLOUD_PROJECT=${PROJECT_ID}"
          "GENAI_GOOGLE_CLOUD_PROJECT=${genai_project_id}"
          "CONSENT_API_PUBLIC_ORIGIN=${_CONSENT_API_PUBLIC_ORIGIN}"
          "DB_POOL_MIN_SIZE=${_DB_POOL_MIN_SIZE}"
          "DB_POOL_MAX_SIZE=${_DB_POOL_MAX_SIZE}"
          "DB_SQLALCHEMY_POOL_SIZE=${_DB_SQLALCHEMY_POOL_SIZE}"
          "DB_SQLALCHEMY_MAX_OVERFLOW=${_DB_SQLALCHEMY_MAX_OVERFLOW}"
          "DB_POOL_ACQUIRE_TIMEOUT_SECONDS=${_DB_POOL_ACQUIRE_TIMEOUT_SECONDS}"
          "RIA_INTELLIGENCE_CRD_SCRAPER_TIMEOUT_SECONDS=${_RIA_INTELLIGENCE_CRD_SCRAPER_TIMEOUT_SECONDS}"
          "RIA_ONBOARDING_PROVIDER_TIMEOUT_SECONDS=${_RIA_ONBOARDING_PROVIDER_TIMEOUT_SECONDS}"
        )
        if [[ "${_DEPLOY_ENV}" == "uat" ]]; then
          env_vars+=("HUSHH_UAT_MANAGED_TEXT_PROVIDER=azure_openai")
        fi
        add_env() {
          local env_name="$1"
          local env_value="$2"
          if [[ -n "${env_value}" ]]; then
            env_vars+=("${env_name}=${env_value}")
          fi
        }
        for n in ONE_EMAIL_ADDRESS ONE_EMAIL_DELEGATED_USER ONE_EMAIL_PUBSUB_TOPIC ONE_EMAIL_WEBHOOK_AUDIENCE ONE_EMAIL_WEBHOOK_SERVICE_ACCOUNT_EMAIL ONE_EMAIL_WEBHOOK_AUTH_ENABLED ONE_EMAIL_WATCH_RENEW_AUTH_ENABLED GMAIL_PERSONAL_INFORMATION_REQUEST_MONITOR_AUTH_ENABLED GMAIL_PERSONAL_INFORMATION_REQUEST_MONITOR_AUDIENCE GMAIL_PERSONAL_INFORMATION_REQUEST_MONITOR_SERVICE_ACCOUNT_EMAIL ACCOUNT_DELETION_CLEANUP_AUDIENCE ACCOUNT_DELETION_CLEANUP_SERVICE_ACCOUNT_EMAIL DRIVE_WORK_DRAIN_ENABLED DRIVE_WORK_DRAIN_SCHEDULER_PROJECT_ID DRIVE_WORK_DRAIN_SCHEDULER_SERVICE_ACCOUNT_EMAIL DRIVE_WORK_DRAIN_SCHEDULER_AUDIENCE DRIVE_REQUEST_PAYMENTS_ENABLED DRIVE_REQUEST_OWNER_PAYOUTS_ENABLED DRIVE_REQUEST_HASHCOINS_ENABLED DRIVE_REQUEST_HASHCOINS_LIVE_ENABLED STRIPE_MODE STRIPE_CONNECT_MODE ONE_EMAIL_KYC_DEFAULT_SCOPE ONE_EMAIL_KYC_STRICT_CLIENT_ZK_ENABLED ONE_WALLET_CARD_ENABLED WALLET_CARD_ACCESS_ENABLED WALLET_PASS_PROVIDER APP_REVIEW_MODE HUSSH_GEMINI_TEXT_MODEL HUSHH_PROD_PHONE_TEST_ENABLED ONE_VOICE_LIVE_ENABLED ONE_VOICE_CALENDAR_NARRATION_ENABLED VERTEX_LIVE_MODEL_ID VERTEX_LIVE_LOCATION; do
          v="_${n}"
          add_env "${n}" "${!v}"
        done
        for n in PKM_ANSWER_REQUESTS_ENABLED PKM_ANSWER_PAYMENTS_ENABLED PKM_ANSWER_COMPOSER_ENABLED PKM_ANSWER_LIVE_PROVIDER_REVIEWED PKM_ANSWER_STRIPE_MODE ANSWER_WORK_DRAIN_ENABLED ANSWER_WORK_DRAIN_AUDIENCE; do
          v="_${n}"
          add_env "${n}" "${!v}"
        done
        add_env "KAI_ANALYZE_DURABLE_RUN_STORE" "${_KAI_ANALYZE_DURABLE_RUN_STORE}"
        add_env "HUSHH_ONE_CHAT_VERTEX_PROJECT" "${_HUSHH_ONE_CHAT_VERTEX_PROJECT}"
        add_env "HUSHH_ONE_VOICE_VERTEX_PROJECT" "${_HUSHH_ONE_VOICE_VERTEX_PROJECT}"
        add_env "CONSENT_WEB_FALLBACK_ENABLED" "${_CONSENT_WEB_FALLBACK_ENABLED}"
        add_env "CONSENT_SSE_ENABLED" "${_CONSENT_SSE_ENABLED}"
        source deploy/sso/bind_workos.sh || :

        env_var_string="$(IFS='|'; echo "${env_vars[*]}")"
        deploy_labels="managed-by=hushh-github-actions,deploy-env=${_DEPLOY_ENV},deploy-source=${_DEPLOY_SOURCE},deploy-sha=${_DEPLOY_SHA},github-run-id=${_GITHUB_RUN_ID},account-deletion-contract=v201"
