apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

def releaseSigningProperties = new Properties()
def releaseSigningPropertiesFile = new File(rootProject.projectDir.parentFile, ".env.local.d/android/release-signing.properties")

def envKeystorePath = System.getenv("ANDROID_KEYSTORE_PATH")
def envKeyAlias = System.getenv("ANDROID_KEY_ALIAS")
def envKeystorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
def envKeyPassword = System.getenv("ANDROID_KEY_PASSWORD")

def hasEnvReleaseSigning = envKeystorePath && new File(envKeystorePath).exists() && envKeyAlias && envKeystorePassword
def hasReleaseSigning = releaseSigningPropertiesFile.exists() || hasEnvReleaseSigning

// A package/SHA-restricted Android Maps SDK key. It is intentionally supplied
// by the build environment and never committed. An empty value builds a safe
// unavailable Map surface instead of falling back to the browser/server key.
def googleMapsApiKey = (System.getenv("NEXT_PUBLIC_GOOGLE_MAPS_ANDROID_API_KEY") ?: project.findProperty("GOOGLE_MAPS_ANDROID_API_KEY") ?: "").replace('"', '\\"')
if (releaseSigningPropertiesFile.exists()) {
    releaseSigningProperties.load(new FileInputStream(releaseSigningPropertiesFile))
}

android {
    namespace = "com.hushh.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.hushh.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "1.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        resValue "string", "google_maps_key", googleMapsApiKey
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasEnvReleaseSigning) {
                keyAlias envKeyAlias
                keyPassword envKeyPassword ?: envKeystorePassword
                storeFile file(envKeystorePath)
                storePassword envKeystorePassword
            } else if (releaseSigningPropertiesFile.exists()) {
                keyAlias releaseSigningProperties['keyAlias']
                keyPassword releaseSigningProperties['keyPassword']
                storeFile releaseSigningProperties['storeFile'] ? file(releaseSigningProperties['storeFile']) : null
                storePassword releaseSigningProperties['storePassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = "21"
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    
    // Firebase Auth
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-auth'
    
    // Google Sign-In
    implementation 'com.google.android.gms:play-services-auth:21.3.0'
    
    // Encrypted SharedPreferences (Android Keystore)
    implementation "androidx.security:security-crypto:1.1.0-alpha06"
    
    // Biometric Authentication
    implementation "androidx.biometric:biometric:1.1.0"

    // Credential Manager / Passkeys
    implementation "androidx.credentials:credentials:1.5.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.5.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"

    // OkHttp for Cloud API calls
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Apply Google Services plugin for Firebase
apply plugin: 'com.google.gms.google-services'
