<svg width="1024" height="1024" viewBox="0 0 1024 1024"
     xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <linearGradient id="bg" x1="172" y1="116" x2="874" y2="910" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C06CFF"/>
      <stop offset="0.48" stop-color="#8A46F4"/>
      <stop offset="1" stop-color="#5B22C9"/>
    </linearGradient>

    <radialGradient id="glow" cx="0" cy="0" r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(314 218) rotate(48) scale(712 702)">
      <stop stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="frontCard" x1="254" y1="522" x2="744" y2="746" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F4ECFF"/>
    </linearGradient>

    <linearGradient id="thread" x1="330" y1="593" x2="692" y2="662" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A250F4"/>
      <stop offset="1" stop-color="#5F25D7"/>
    </linearGradient>

    <radialGradient id="node" cx="0" cy="0" r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(495 604) rotate(63) scale(92)">
      <stop stop-color="#D8A4FF"/>
      <stop offset="0.48" stop-color="#974EF0"/>
      <stop offset="1" stop-color="#5E24CF"/>
    </radialGradient>

    <linearGradient id="edge" x1="92" y1="60" x2="922" y2="964" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="0.43" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#2B0B72" stop-opacity="0.25"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="26" stdDeviation="28" flood-color="#35106F" flood-opacity="0.28"/>
    </filter>

    <filter id="smallShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#3E147C" flood-opacity="0.22"/>
    </filter>

    <clipPath id="iconClip">
      <rect width="1024" height="1024" rx="232"/>
    </clipPath>
  </defs>

  <g clip-path="url(#iconClip)">
    <rect width="1024" height="1024" rx="232" fill="url(#bg)"/>
    <rect width="1024" height="1024" rx="232" fill="url(#glow)"/>

    <!-- Quiet depth, not a glossy app-store badge -->
    <path d="M92 186C239 61 477 35 672 78C838 114 938 218 986 354V0H0V330C25 271 54 220 92 186Z"
          fill="#FFFFFF" fill-opacity="0.08"/>

    <!-- Memory stack -->
    <g filter="url(#softShadow)">
      <rect x="272" y="276" width="480" height="176" rx="88"
            fill="#FFFFFF" fill-opacity="0.22"
            stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="4"/>

      <rect x="220" y="392" width="584" height="190" rx="95"
            fill="#FFFFFF" fill-opacity="0.43"
            stroke="#FFFFFF" stroke-opacity="0.34" stroke-width="4"/>

      <rect x="166" y="514" width="692" height="222" rx="111"
            fill="url(#frontCard)"
            stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="4"/>
    </g>

    <!-- Memory thread -->
    <path d="M340 626
             C390 566 449 566 498 626
             C547 686 610 686 684 618"
          stroke="url(#thread)" stroke-width="28"
          stroke-linecap="round" stroke-linejoin="round"/>

    <circle cx="340" cy="626" r="23" fill="url(#node)" filter="url(#smallShadow)"/>
    <circle cx="511" cy="638" r="34" fill="url(#node)" filter="url(#smallShadow)"/>
    <circle cx="684" cy="618" r="23" fill="url(#node)" filter="url(#smallShadow)"/>

    <!-- Retrieval sparkle -->
    <g transform="translate(738 316)" filter="url(#smallShadow)">
      <path d="M0 -51C7 -18 18 -7 51 0C18 7 7 18 0 51C-7 18 -18 7 -51 0C-18 -7 -7 -18 0 -51Z"
            fill="#FFFFFF" fill-opacity="0.94"/>
      <circle cx="58" cy="-47" r="10" fill="#FFFFFF" fill-opacity="0.72"/>
    </g>

    <!-- Subtle outer edge -->
    <rect x="10" y="10" width="1004" height="1004" rx="222"
          stroke="url(#edge)" stroke-width="20"/>
  </g>
</svg>