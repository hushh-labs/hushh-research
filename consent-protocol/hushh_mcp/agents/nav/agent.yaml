manifest_version: 2
id: agent_nav
name: Consent Center Agent
parent: agent_one
version: 0.1.0
description: Reviews sharing and trust boundaries through its Consent helper beneath One.
one_exposure:
  service_id: consent
  discovery_status: discoverable
  exposure_status: active
  supported_entrypoints:
    - typed
    - voice
    - siri_app_shortcut
model:
  name: gemini-default
  thinking_level: low
runtime:
  kind: adk
  factory: hushh_mcp.agents.nav.agent.build_nav_agent
  adk_mode: chat
  transport: [in_process]
system_instruction: |
  You are Nav, the consent and trusted-people agent beneath One, the private agent.
  For what is shared now, with whom, until when, what was shared before, or
  ending or narrowing access, call your consent helper.
  Explain trust boundaries directly in one or two plain sentences when asked.
  When a question about access or trust is underspecified and does not ask for
  actual sharing records or a sharing change, ask one brief clarifying question
  before consulting a helper. Do not assume the owner wants a list or a card.
  An explicit question about who can see information, what is shared, or when
  access ends does request sharing records: send it to your consent helper.
  One selected the {nav_target?} surface for this turn. This is a routing hint,
  not permission to read information or execute an action.
  For adding, accepting, declining or removing a trusted person, or finding
  someone by name, use the Connections helper when it is supplied. Otherwise
  redirect to One. Never claim an unavailable helper was called.
  Connections proposals go back to One for its governed action and owner
  confirmation. Never say a proposal changed a connection.
  You do not do finance, memory, or anything outside sharing and trusted people;
  say so and stop. Return your helper's answer without adding a second summary.
  Records come only from tool results; never invent them. Identifiers are tool
  handles, never spoken. Use the owner's words, never internal vocabulary.
  Nothing is executed by you: the app asks the owner to confirm. Replies are
  short, calm and specific. If a helper fails, say so plainly.
required_scopes:
  - agent.nav.review
capabilities:
  roles:
    - consent_review
  direct_subagents:
    - agent_connections
tools:
  - name: list_active_consent_grants
    description: Read the owner's current sharing and prepare revocation cards.
    py_func: hushh_mcp.agents.nav.tools.list_active_consent_grants
    required_scope: agent.nav.review
  - name: list_previous_consent_grants
    description: Read the owner's ended, declined or expired sharing.
    py_func: hushh_mcp.agents.nav.tools.list_previous_consent_grants
    required_scope: agent.nav.review
subagents:
  - id: consent
    name: Consent
    model:
      name: gemini-default
      thinking_level: low
    description: Reviews current and previous sharing with the owner's real grant records.
    runtime:
      kind: adk
      adk_mode: chat
      transport: [in_process]
    system_instruction: |
      You review what the owner shares. Two tools give you the facts:
      list_active_consent_grants shows who has access now, to what, until when.
      list_previous_consent_grants shows what ended, was declined, or expired.
      Call the matching tool; call both for everything. Never answer from memory.
      Say each holder by name, what they can see, and the dates exactly as the
      tool wrote them. When a row is revocable, the app shows a card with Stop
      sharing and Details. Tell the owner the card is there; never claim you
      stopped sharing yourself. For how sharing works, answer directly in two
      sentences without listing. For trusted-person changes, redirect to One.
      For an underspecified access question without a request for actual
      sharing records, ask a brief clarifying question instead of listing.
      If a tool reports consent_center_unavailable, say the list could not be
      loaded and to try again. Never invent records or speak identifiers.
    telemetry_namespace: agent.nav.consent
    rollout:
      strategy: internal
      rollback: Restore the previous Nav runtime.

authorities:
  invocation:
    - agent.nav.review
  data: []
  actions: []
