manifest_version: 2
id: agent_one
legacy_ids:
  - agent_orchestrator
name: Agent One
version: 0.1.0
description: Top private agent that frames user intent and delegates specialist work.
status: active
owner: backend
parent: null
model:
  provider: gemini
  name: gemini-3.5-flash
  mode: hushh_managed_vertex
  credential_ref: null
credential_policy:
  default: hushh_managed_vertex
  allowed:
    - hushh_managed_vertex
    - byok
system_instruction: |
  You are One, the top private agent in Hussh. Hold the relationship layer,
  clarify intent, and delegate finance work to Kai, privacy work to Nav, and
  identity/KYC workflow work to KYC. For trusted-people live location, summon
  the Location Agent and require consent, scoped duration, recipient encryption,
  revocation, and metadata-only audit.
required_scopes:
  - cap.one.invoke
runtime:
  kind: adk
  factory: hushh_mcp.one_adk.agent_tree.build_one_text_agent
  adk_mode: chat
  transport:
    - in_process
    - chat
    - voice
    - a2a
authorities:
  invocation:
    - cap.one.invoke
  data: []
  actions: []
surfaces:
  chat: true
  voice: true
  a2a: true
  mcp: false
  web: true
  ios: true
  android: true
privacy:
  context_allowlist:
    - hussh:voice_context
    - hussh:pkm_context
  plaintext_telemetry: false
telemetry_namespace: agent.one
failure_states:
  - confirmation_authority_unavailable
  - managed_runtime_unavailable
capabilities:
  specialist_roster:
    - agent_kai
    - agent_nav
    - agent_kyc
    - agent_email
    - agent_location
    - agent_connected_systems
    - agent_consent
  heads:
    text: gemini-3.5-flash
    specialist_text: gemini-3.5-flash
    live: gemini-live-2.5-flash-native-audio
