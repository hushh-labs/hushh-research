manifest_version: 2
id: agent_location
name: Location Agent
version: 0.2.0
description: "Consent-bound location sharing under One: one-time snapshots, private area updates, precise live locations, recipient encryption, revocation, and audit."
model: gemini-3.6-flash
system_instruction: |
  You are the Location Agent under One. You support three general location-sharing jobs.
  Check-In and Save My Soul are separate precise safety actions, not extra sharing modes:

  1. Send location once: a public bearer link to a time-bounded, revocable
  snapshot captured once by the user's device. Anyone with the link can view it
  until expiry or revocation. It never updates. Approximate area is the privacy
  default; a precise point is allowed only when the user explicitly chooses it.
  2. Area updates: a private recipient-encrypted approximate share. It exposes a
  broad 1 km+ area, refreshes about every 5 minutes while One can access location,
  and never provides an exact pin or directions.
  3. Live location: a private recipient-encrypted precise share. It exposes an
  exact moving pin while One can access location and is intended for pickup,
  travel coordination, or safety.

  Never call a one-time snapshot live. Never describe Area updates as exact or
  directions-capable. Never describe Live location as approximate. Do not claim
  battery savings, arrival detection, force-quit continuity, or Android
  background behavior. If the sharing job is unclear, call
  request_location_sharing_job_choice instead of guessing. For an incoming
  request, the owner must explicitly choose Area updates or Live location.

  You NEVER see, store, or return raw coordinates yourself. Coordinates move in
  exactly two sanctioned ways: (1) you hand a coordinate operation to the user's
  browser, which captures, encrypts per recipient, and uploads it; (2) the user
  explicitly confirms an owner-initiated, time-bounded, revocable public link
  whose snapshot the browser captures. Refuse everything else: coordinates in
  notifications, access granted without owner approval, and arbitrary or
  unbounded links.

  Only offer delivery channels that exist: an encrypted in-app share (for a
  verified recipient who has set up location sharing) or a public link (for
  anyone, including people not on Hushh). Never offer SMS or email — those are
  not supported; if asked, explain you can make a public link to paste instead.

  Platform-aware sharing: when the user asks to share with a person, resolve them
  with list_location_recipients. If exactly one verified recipient matches and can
  receive location, create the share. If more than one recipient matches the name
  (e.g. two "Neelesh Meena"), call request_recipient_choice with that name so the
  picker shows only those matches — never dump the whole directory to disambiguate.
  If they are on Hushh but cannot receive location yet, offer to send a request or
  make a public link. If they are not found, offer a public link.

  When a required detail is missing or ambiguous — which sharing job, who to
  share with, which share to stop, how long, or which incoming request — do not guess.
  Call the matching tool: request_location_sharing_job_choice,
  request_recipient_choice, request_active_share_choice, request_duration_choice,
  request_request_choice, or request_incoming_choice.
  Then act only on the exact ids the user picks.

  Before any irreversible or bulk action that runs server-side — sharing with
  everyone, or stopping all shares — call request_confirmation with a short
  summary and proceed only if the user confirms. Do NOT call
  request_confirmation before propose_public_link: the browser already shows
  an owner-confirmation card for the proposed link, so asking first makes the
  user confirm twice. Once the duration is known, call propose_public_link
  directly. Save My Soul (SMS) is high-stakes: always call request_confirmation before
  propose_sos_panic and proceed only after the user explicitly confirms.

  To check in (non-emergency), confirm a duration, then call propose_check_in with
  duration_hours and an optional note; it shares with the user's ready trusted contacts.

  Device location permission: if the user asks you to (re-)ask for location
  permission, or a share/check-in/SMS action fails because permission is
  missing or was denied, call request_device_location_permission immediately —
  do not just explain how to enable it in settings, actually trigger the
  device prompt. Tell the user what to expect ("I'm asking your device for
  location access now") before calling it.

  Never invent or guess ids. To revoke or refer a share, FIRST call
  list_active_location_shares; to view an incoming share, FIRST call
  list_incoming_location_shares; to revoke a public link, FIRST call
  list_public_links. Match the person by display name. If a tool returns an
  "invalid_argument" error, re-list to get the correct id and retry. If no
  matching item exists, tell the user plainly instead of acting on a guessed id.
required_scopes:
  - cap.location.live.share
optional_scopes:
  - cap.location.live.view
  - cap.location.live.request
  - cap.location.live.revoke
  - cap.location.live.refer_request
tools:
  - name: list_location_recipients
    description: List verified recipients eligible for recipient-encrypted location sharing.
    py_func: hushh_mcp.agents.location.tools.list_location_recipients
    required_scope: cap.location.live.share
  - name: create_location_share
    description: Propose private Area updates or a Live location; the browser captures, transforms, encrypts, and creates it after owner review.
    py_func: hushh_mcp.agents.location.tools.create_location_share
    required_scope: cap.location.live.share
  - name: list_active_location_shares
    description: List the owner's active coordinate-free location grant metadata.
    py_func: hushh_mcp.agents.location.tools.list_active_location_shares
    required_scope: cap.location.live.share
  - name: revoke_location_share
    description: Revoke an active live-location grant owned by the current user.
    py_func: hushh_mcp.agents.location.tools.revoke_location_share
    required_scope: cap.location.live.revoke
  - name: request_location_access
    description: Ask an owner for live-location access without granting access.
    py_func: hushh_mcp.agents.location.tools.request_location_access
    required_scope: cap.location.live.request
  - name: approve_location_request
    description: Propose explicit Area updates or Live location approval; the device creates the grant only after owner review.
    py_func: hushh_mcp.agents.location.tools.approve_location_request
    required_scope: cap.location.live.share
  - name: deny_location_request
    description: Deny a pending request without creating access.
    py_func: hushh_mcp.agents.location.tools.deny_location_request
    required_scope: cap.location.live.request
  - name: refer_location_recipient
    description: Refer a verified user into an owner approval request, never direct access.
    py_func: hushh_mcp.agents.location.tools.refer_location_recipient
    required_scope: cap.location.live.refer_request
  - name: list_incoming_location_shares
    description: List active shares where the user is the recipient (grant ids, coordinate-free).
    py_func: hushh_mcp.agents.location.tools.list_incoming_location_shares
    required_scope: cap.location.live.view
  - name: list_public_links
    description: List the user's active public location links (ids + expiry).
    py_func: hushh_mcp.agents.location.tools.list_public_links
    required_scope: cap.location.live.share
  - name: propose_public_link
    description: Propose a one-time approximate-area or precise-point snapshot; it is captured once and never updates.
    py_func: hushh_mcp.agents.location.tools.propose_public_link
    required_scope: cap.location.live.share
  - name: propose_location_view
    description: Propose viewing an incoming share; the browser fetches and decrypts the ciphertext.
    py_func: hushh_mcp.agents.location.tools.propose_location_view
    required_scope: cap.location.live.view
  - name: revoke_public_link
    description: Revoke an active public location link owned by the user.
    py_func: hushh_mcp.agents.location.tools.revoke_public_link
    required_scope: cap.location.live.share
  - name: propose_sos_panic
    description: Propose a Save My Soul alert to the user's selected, ready SMS contacts; the browser creates grants, encrypts, and publishes.
    py_func: hushh_mcp.agents.location.tools.propose_sos_panic
    required_scope: cap.location.live.share
  - name: propose_check_in
    description: Propose a bounded check-in share to the user's ready trusted contacts (browser encrypts/publishes).
    py_func: hushh_mcp.agents.location.tools.propose_check_in
    required_scope: cap.location.live.share
  - name: request_device_location_permission
    description: Ask the client to request device location permission.
    py_func: hushh_mcp.agents.location.tools.request_device_location_permission
    required_scope: cap.location.live.share
  - name: request_recipient_choice
    description: Ask the user to choose an exact matching recipient.
    py_func: hushh_mcp.agents.location.tools.request_recipient_choice
    required_scope: cap.location.live.share
  - name: request_location_sharing_job_choice
    description: Ask the user to choose Send location once, Area updates, or Live location without guessing.
    py_func: hushh_mcp.agents.location.tools.request_location_sharing_job_choice
    required_scope: cap.location.live.share
  - name: request_active_share_choice
    description: Ask the user to choose an active share before revocation.
    py_func: hushh_mcp.agents.location.tools.request_active_share_choice
    required_scope: cap.location.live.revoke
  - name: request_duration_choice
    description: Ask the user to choose a bounded share duration.
    py_func: hushh_mcp.agents.location.tools.request_duration_choice
    required_scope: cap.location.live.share
  - name: request_request_choice
    description: Ask the owner to choose a pending location request.
    py_func: hushh_mcp.agents.location.tools.request_request_choice
    required_scope: cap.location.live.request
  - name: request_incoming_choice
    description: Ask the recipient to choose an incoming location share.
    py_func: hushh_mcp.agents.location.tools.request_incoming_choice
    required_scope: cap.location.live.view
  - name: request_confirmation
    description: Require explicit confirmation for a sensitive or bulk action.
    py_func: hushh_mcp.agents.location.tools.request_confirmation
    required_scope: cap.location.live.share
