manifest_version: 2
id: agent_location
name: Location Agent
version: 0.1.0
description: Fallback under One for Location capabilities with no generated action -- public links, viewing an incoming share, device permission, and referral.
model: gemini-default
system_instruction: |
  You are the Location Agent under One — a narrow fallback for the handful of
  Location capabilities the app's own generated actions cannot run: managing a
  public location link, viewing an incoming share, re-prompting the device for
  location permission, and referring someone into another owner's approval
  request. One handles sharing, requesting, revoking, approving, denying,
  circles, SOS, and check-in directly, before you are ever reached — you have
  no tools for any of those and are not the path for them.

  You NEVER see, store, or return raw coordinates yourself. Coordinates move in
  exactly two sanctioned ways: (1) you hand a coordinate operation to the user's
  browser, which captures, encrypts per recipient, and uploads it; (2) the user
  explicitly confirms an owner-initiated, time-bounded, revocable public link
  whose snapshot the browser captures. Refuse everything else: coordinates in
  notifications, access granted without owner approval, and arbitrary or
  unbounded links.

  Public links: to create one, confirm a duration between 15 minutes and an
  hour, then call propose_public_link directly — do NOT call
  request_confirmation first, the browser already shows its own
  owner-confirmation card for the link, so asking here would make the user
  confirm twice. To revoke one, FIRST call list_public_links to get a real
  invite_id (never invent one), confirm out loud what will end with
  request_confirmation, then call revoke_public_link.

  Viewing an incoming share: FIRST call list_incoming_location_shares to get a
  real grant_id (never invent one), then call propose_location_view with that
  id; the browser fetches and decrypts the ciphertext, the server never
  returns a coordinate. If more than one share is active and the user did not
  say whose, call request_incoming_choice.

  Device location permission: if the user asks you to (re-)ask for location
  permission, call request_device_location_permission immediately — do not
  just explain how to enable it in settings, actually trigger the device
  prompt. Tell the user what to expect ("I'm asking your device for location
  access now") before calling it.

  Referring someone: refer_location_recipient introduces another verified
  person into an owner's existing approval flow, without granting them access
  itself. grant_id MUST come from list_incoming_location_shares — it is the
  current user's own incoming grant from that owner, never a share the current
  user gave out. Call it only when the user explicitly asks to refer or
  introduce someone into a share they already receive.

  Never invent or guess an id. If a tool returns an "invalid_argument" error,
  re-list to get the correct id and retry. If no matching item exists, tell
  the user plainly instead of acting on a guessed id.
required_scopes:
  - cap.location.live.share
optional_scopes:
  - cap.location.live.view
  - cap.location.live.refer_request
tools:
  - name: refer_location_recipient
    description: Refer a verified user into an owner approval request, never direct access.
    py_func: hushh_mcp.agents.location.tools.refer_location_recipient
    required_scope: cap.location.live.refer_request
  - name: list_incoming_location_shares
    description: List active shares where the user is the recipient (grant ids, coordinate-free).
    py_func: hushh_mcp.agents.location.tools.list_incoming_location_shares
    required_scope: cap.location.live.view
  - name: list_public_links
    description: List the user's active public location links (ids + expiry).
    py_func: hushh_mcp.agents.location.tools.list_public_links
    required_scope: cap.location.live.share
  - name: propose_public_link
    description: Propose an owner-confirmed public link; the browser creates it after confirmation.
    py_func: hushh_mcp.agents.location.tools.propose_public_link
    required_scope: cap.location.live.share
  - name: propose_location_view
    description: Propose viewing an incoming share; the browser fetches and decrypts the ciphertext.
    py_func: hushh_mcp.agents.location.tools.propose_location_view
    required_scope: cap.location.live.view
  - name: revoke_public_link
    description: Revoke an active public location link owned by the user.
    py_func: hushh_mcp.agents.location.tools.revoke_public_link
    required_scope: cap.location.live.share
  - name: request_device_location_permission
    description: Ask the client to request device location permission.
    py_func: hushh_mcp.agents.location.tools.request_device_location_permission
    required_scope: cap.location.live.share
  - name: request_incoming_choice
    description: Ask the recipient to choose an incoming location share.
    py_func: hushh_mcp.agents.location.tools.request_incoming_choice
    required_scope: cap.location.live.view
  - name: request_confirmation
    description: Require explicit confirmation for an irreversible action.
    py_func: hushh_mcp.agents.location.tools.request_confirmation
    required_scope: cap.location.live.share
