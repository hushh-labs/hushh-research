manifest_version: 2
id: agent_calendar
name: Calendar Agent
version: 0.1.0
description: Google Calendar read, availability, and owner-confirmed scheduling specialist under One.
one_exposure:
  service_id: calendar
  discovery_status: discoverable
  exposure_status: active
  supported_entrypoints:
    - typed
status: active
owner: backend
parent: agent_one
model: gemini-default
system_instruction: |
  You are the Calendar Agent under One. Use only the authenticated owner's
  connected Google Calendar through the declared tools. Never see OAuth tokens,
  persist Calendar content, or guess event ids, dates, time zones, attendees, or
  availability. Ask one clear question when a required detail is missing.

  Read requests can list or summarize events, check free/busy windows, and find
  the earliest free slots in an explicit requested window. Never invent working
  hours, preferences, or invitee availability. When the owner asks you to find
  time and schedule automatically, find the earliest fitting slot only after
  they give a window and duration, then create the normal confirmation-bound
  proposal.

  Use calendar_calendars to discover subscribed calendars before selecting a
  secondary calendar. In the next user turn, pass the calendar's position as
  calendar_ordinal to calendar_events. For "open the second event", pass ordinal
  2 to calendar_event_detail. Never invent or pass provider ids; these tools
  resolve exact ids from a short-lived private owner-bound list. If that list
  expired, ask to show it again. A pre-existing primary-only connection can
  still read its primary calendar; if subscribed-calendar permission is missing,
  ask for that specific upgrade rather than claiming Calendar is disconnected.
  If a page is truncated, say the answer covers only that page and narrow or
  continue the search before claiming completeness.

  Every new event includes a Google Meet link after the owner confirms the
  exact proposal. State that the confirmation card includes the link and that
  Calendar will share the invite with guests. Do not claim the link exists
  before confirmation, and do not promise to add one while rescheduling.

  If a proposed create or reschedule overlaps an existing opaque event, name
  the returned event details and ask whether they still want to schedule it.
  The explicit browser confirmation card is that decision; never schedule from
  the conflict warning alone. For schedule summaries, call out concrete
  time-sensitive signals such as imminent events or pending attendee responses;
  never claim subjective importance without an observable calendar signal.

  For rescheduling or cancellation, list the relevant interval first and use
  the returned event id. Creating, changing, and cancelling events always
  creates a short-lived proposal. Tell the user that the browser shows the
  exact change and it will happen only after they explicitly confirm it.
required_scopes:
  - cap.one.invoke
tools:
  - name: calendar_summary
    description: List the next calendar events for a bounded summary.
    py_func: hushh_mcp.agents.calendar.tools.calendar_summary
    required_scope: cap.one.invoke
  - name: calendar_events
    description: List a bounded page of events in an exact time interval on the primary calendar or a previously offered subscribed calendar selected by calendar_ordinal; optionally match search text. A next-page token means more exist.
    py_func: hushh_mcp.agents.calendar.tools.calendar_events
    required_scope: cap.one.invoke
  - name: calendar_calendars
    description: List a bounded page of subscribed calendars, including their exact ids; existing primary-only connections may need an additional read permission.
    py_func: hushh_mcp.agents.calendar.tools.calendar_calendars
    required_scope: cap.one.invoke
  - name: calendar_event_detail
    description: Read one exact event by ordinal in the latest short-lived owner-bound event list. Never supply a guessed event id.
    py_func: hushh_mcp.agents.calendar.tools.calendar_event_detail
    required_scope: cap.one.invoke
  - name: calendar_availability
    description: Return busy intervals in an exact time interval.
    py_func: hushh_mcp.agents.calendar.tools.calendar_availability
    required_scope: cap.one.invoke
  - name: calendar_free_slots
    description: Find the earliest fitting open slots in an exact owner-calendar window.
    py_func: hushh_mcp.agents.calendar.tools.calendar_free_slots
    required_scope: cap.one.invoke
  - name: propose_calendar_event
    description: Prepare a new Google Meet event for explicit owner confirmation; Calendar shares the invite with guests after confirmation.
    py_func: hushh_mcp.agents.calendar.tools.propose_calendar_event
    required_scope: cap.one.invoke
  - name: propose_calendar_reschedule
    description: Prepare an existing event change for explicit owner confirmation; only named fields change, and the review lists every attendee added or removed.
    py_func: hushh_mcp.agents.calendar.tools.propose_calendar_reschedule
    required_scope: cap.one.invoke
  - name: propose_calendar_cancellation
    description: Prepare event cancellation for explicit owner confirmation.
    py_func: hushh_mcp.agents.calendar.tools.propose_calendar_cancellation
    required_scope: cap.one.invoke
authorities:
  invocation:
    - cap.one.invoke
  data:
    - google.calendar.read
  actions:
    - google.calendar.write.confirmed
side_effects:
  - name: calendar_event_mutation
    confirmation: explicit_user_confirmation
    idempotent: false
    timeout_seconds: 20
    max_retries: 0
surfaces:
  chat: true
  voice: false
  web: true
  ios: false
  android: false
  a2a: false
  mcp: false
  not_applicable_reason: Calendar chat is web-only until native OAuth and voice confirmation surfaces are implemented; it is not public A2A or MCP.
privacy:
  context_allowlist:
    - hussh:user_id
    - hussh:timezone
  plaintext_telemetry: false
telemetry_namespace: agent.calendar
failure_states:
  - google_connection_required
  - google_permission_required
  - proposal_expired
  - event_changed
  - availability_changed
rollout:
  strategy: internal
  rollback: Disable Calendar Agent and retain existing Google connection records without executing proposals.
