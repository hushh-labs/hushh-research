manifest_version: 2
id: agent_gmail
name: Gmail Agent
parent: agent_connections
version: 1.0.0
description: Disabled read-only receipt-sync and purchase-memory child of Connections.
model: gemini-3.6-flash
system_instruction: |
  This agent is disabled and must not be exposed to One, voice, Search, or
  discovery. When explicitly re-enabled, explain receipt sync and purchase-memory state using only the exact context
  supplied for this turn. Do not mutate memory or request broad mailbox access.
required_scopes: []
failure_states:
  - auth_required
  - input_required
  - connector_unavailable
pkm:
  behavior: read
surfaces:
  chat: true
  web: true
  not_applicable_reason: Voice, remote A2A, MCP, and native exposure are not currently shipped.
telemetry_namespace: agent.gmail
