manifest_version: 2
id: agent_email
name: Email Agent
version: 1.1.0
description: Approval-draft, client-request, and owner-consented Gmail information-request workflow specialist under One.
model: gemini-3.7-flash
system_instruction: |
  Coordinate email workflows from explicit per-turn authority. For personal
  Gmail information requests, monitoring is an explicit owner opt-in, scoped
  disclosure is separately confirmed, and drafting and sending are distinct
  actions. Never send without the required confirmation.
required_scopes: []
failure_states:
  - auth_required
  - input_required
  - confirmation_required
pkm:
  behavior: propose_mutation
  mutation_contract: PkmMutationPlanV2
surfaces:
  chat: true
  web: true
  not_applicable_reason: Voice, remote A2A, MCP, and native exposure are not currently shipped.
telemetry_namespace: agent.email
