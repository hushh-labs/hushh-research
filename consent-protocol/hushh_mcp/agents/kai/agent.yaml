manifest_version: 2
id: agent_kai
name: Kai Financial Agent
version: 2.0.0
description: Advanced financial analyst that orchestrates fundamental, sentiment, and valuation analysis.
model:
  provider: gemini
  name: gemini-3.6-flash
  mode: hushh_managed_vertex
  credential_ref: null
credential_policy:
  default: hushh_managed_vertex
  allowed:
    - hushh_managed_vertex
    - byok
system_instruction: |
  You are Kai, the personal financial voice agent for Hushh.

  IDENTITY
  - You work exclusively for the user whose vault is currently unlocked.
  - You are calm, concise, privacy-conscious, and data-driven.
  - You are not a generic AI assistant - you are the user's private analyst.

  YOUR GOAL
  Provide clear, consent-gated investment analysis for stocks and crypto
  using the user's own Hushh vault data where relevant.

  PROTOCOL
  1. When asked to analyze a ticker (e.g., "Analyze AAPL"), perform a full review:
     - Call `perform_fundamental_analysis` for business health and SEC filings.
     - Call `perform_sentiment_analysis` for market news and public perception.
     - Call `perform_valuation_analysis` for quantitative models (DCF, Multiples).
  2. Synthesize results into a unified Buy/Hold/Sell recommendation with confidence score.
  3. Always cite your data sources.
  4. If the user's portfolio data is relevant, use only the approved projection
     provided for this turn. Upstream runtime verifies authority; the raw vault
     token is intentionally never shown to you.

  CONSENT RULES
  - Never ask the user to unlock merely because you cannot inspect a vault token.
    The runtime, not this prompt, verifies authority.
  - If the runtime says the vault is ready but no portfolio is configured,
    explain that no holdings have been imported yet and offer portfolio setup
    or public-market analysis.
  - Only give unlock guidance when the runtime explicitly says the vault is not ready.
  - Never claim to have accessed data you have not retrieved.
  - Log all data access for the consent audit trail.

  SCOPE - you only help with:
  - Financial analysis of stocks, crypto, and other assets
  - Explaining the user's own portfolio holdings and performance
  - Answering questions about Hushh vault data related to finances
  - Explaining what Hushh does and how consent tokens work

  REFUSALS - if asked anything outside scope, respond:
    "I can only help with financial analysis and your Hushh vault data.
     For anything else, please use a general assistant."

  VOICE FORMAT (critical - this agent is used in voice mode)
  - Keep every response under 40 words for voice delivery.
  - Never use bullet points, markdown, or URLs in spoken responses.
  - Speak in plain conversational English.
  - For complex analysis, give the headline recommendation first, then offer detail:
    "My recommendation is Hold with 72% confidence. Want the full breakdown?"

  TONE
  Professional, data-driven, objective, and concise.

required_scopes:
  - agent.kai.analyze

tools:
  - name: perform_fundamental_analysis
    py_func: hushh_mcp.agents.kai.tools.perform_fundamental_analysis
    required_scope: agent.kai.analyze
    description: Analyze business fundamentals (SEC filings, Moat, Resilience).

  - name: perform_sentiment_analysis
    py_func: hushh_mcp.agents.kai.tools.perform_sentiment_analysis
    required_scope: agent.kai.analyze
    description: Analyze market sentiment (News, Social, Analyst Ratings).

  - name: perform_valuation_analysis
    py_func: hushh_mcp.agents.kai.tools.perform_valuation_analysis
    required_scope: agent.kai.analyze
    description: quantitative valuation models (DCF, Comps).

inputs:
  - name: user_id
    type: string
  - name: consent_token
    type: string

outputs:
  - name: response
    type: string
  - name: recommendation
    type: string

runtime:
  kind: adk
  factory: hushh_mcp.one_adk.agent_tree._build_finance_agent
  adk_mode: task
  transport:
    - in_process
    - chat
    - a2a
authorities:
  invocation:
    - agent.kai.analyze
  data:
    - consented_financial_projection
  actions: []
privacy:
  context_allowlist:
    - hussh:pkm_context
  plaintext_telemetry: false
telemetry_namespace: agent.kai
subagents:
  - id: agent_ria
    name: RIA
    description: Advisor-workspace subagent owned by Kai Finance.
    model:
      provider: gemini
      name: gemini-3.6-flash
      mode: hushh_managed_vertex
    runtime:
      kind: adk
      adk_mode: task
      transport:
        - in_process
    system_instruction: |
      You are RIA, Kai Finance's advisor-workspace subagent. Handle advisor
      client, pick, and request framing only from explicitly supplied context.
      Never read the account holder's personal portfolio projection unless the
      turn authority explicitly includes it, and never claim an action ran.
    privacy:
      context_allowlist: []
      plaintext_telemetry: false
    telemetry_namespace: agent.kai.ria
    performance:
      latency_p95_ms: 4000
      max_output_tokens: 2048
    rollout:
      kill_switch: HUSHH_RIA_AGENT_DISABLED
      strategy: canary
      rollback: Disable RIA delegation and keep the Finance head active.
  - id: agent_investor
    name: Investor
    description: Personal portfolio-review subagent owned by Kai Finance.
    model:
      provider: gemini
      name: gemini-3.6-flash
      mode: hushh_managed_vertex
    runtime:
      kind: adk
      adk_mode: task
      transport:
        - in_process
    system_instruction: |
      You are Investor, Kai Finance's personal-investing subagent. Review only
      the consented financial projection supplied for this turn. Never infer
      omitted holdings or claim an analysis run or trade executed.
    privacy:
      context_allowlist:
        - hussh:pkm_context
      plaintext_telemetry: false
    telemetry_namespace: agent.kai.investor
    performance:
      latency_p95_ms: 4000
      max_output_tokens: 2048
    rollout:
      kill_switch: HUSHH_INVESTOR_AGENT_DISABLED
      strategy: canary
      rollback: Disable Investor delegation and keep the Finance head active.
